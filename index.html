egories":["プログラム・システム","契約・報酬"],"fun_headline":"【悲報】2300万円請求したエンジニア、「契約成立してなかった」で全額ゼロになった件","hook":"「口約束で話は進んでたし、もう100台に先行導入もしてたし、これ契約成立してるよね？」って思いますよね。\n\n思いますよね？\n\n裁判所は「思いません」って言いました。2300万円の請求が、全部ゼロです。","summary":"・絡んでる金額: 150万円\n・テーマ: アプリ提供契約の成否\n・契約とお金の話","what_happened":"順を追って整理しますね。\n\n発注側はカラーコンタクトレンズの試着シミュレーションアプリを作った会社です。スマホで顔を撮影すると、コンタクトを付けたイメージが確認できるやつ。それを、コンタクトレンズ販売の開発側に「使いませんか？」って営業したわけです。\n\n開発側の担当者Dがめちゃくちゃ乗り気で、「100台入れるってことは、この後全店舗に入れるのと同じですよ」とか言い出すんですよ。\n\nここで僕の話をさせてほしいんですけど、こういう「いいっすね〜全部やりましょう！」みたいなテンションで話を進める担当者、わりとどこにでもいますよね。居酒屋で「今日は俺が全部奢るよ！」って言って翌日に割り勘を要求してくる先輩みたいな存在です。話を戻します。\n\n開発側はとりあえず先行で100店舗に導入しました。さらに200万円の開発委託契約も締結。お金も払われました。順調に見えた。\n\nで、ここからがヤバいんですけど。\n\n本契約の基本契約書を作ってたんですが、調印（つまり署名）まで至らなかった。交渉は続いていた。値段の合意も取れてなかった。権利関係の交渉もまだ途中だった。\n\nそして同年12月、開発側は発注側に「このアプリ使いません」と通知。さらに開発側は別のベンダのアプリに乗り換えた。\n\n発注側は激怒して2300万円を請求。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\nちなみに全然関係ないけど、2300万円って数字、デカすぎて感覚が麻痺しますよね。僕が今まで人生で使った最高額って、たぶん引っ越し代の20万円くらいです。関係ないですね。話を戻します。","issue":"要するに何が問題だったかというと──\n\n発注側と開発側の間に「本契約（101台目以降の全店舗導入契約）」が成立していたか？ ここ一点に絞られます。\n\nここテストに出ます。「交渉してた」と「契約が成立した」は全然別の話なんです。","ruling":"で、裁判所はどう判断したか。\n\nズバリ「契約成立してません」です。\n\nまず担当者Dの発言について。裁判所はこう言いました。\n\n 仮にＤが上記のとおり発言したとしても，そもそも，X代表者も認めるとおり，開発側においてこのアプリに関する契約締結の意思決定権を有するのはY事業部長であり，Ｄは開発側としての意思決定権を有しておらず，Ｄの一存によって発注側と開発側との間でのこのアプリ導入に関する契約を成立させ得るものでないことは明らかである。また，一般的に，会社の従業員が自身の担当する商品の開発等の現場において，その所属する会社の意思と完全に一致するかとは別として，個人的な高い目標を掲げて行動するということは何ら稀有なことではないように思われ，そのような個人的な目標と会社としての意思とが時に異なることも十分に考えられるところであるし，会社の従業員として営業等を担当していたというＣにおいて，営業担当者個人の意思と会社の意思とを区別し得なかったなどとは考え難い。そうすると，例え，Ｃが，Ｄから，１００台導入することは全店舗へ導入することと同じだなどと申し向けられ，その旨の期待を抱いたとしても，それをもってＣが開発側との間でこのアプリを全店舗へ導入する旨の契約が成立したとの認識を有するに至ったというのは余りに不合理かつ不自然である\n\n裁判所、めっちゃ冷静。好き。\n\n要するに「担当者Dが熱く語っても、その人に決定権がないんだから契約成立しないでしょ」ということです。\n\nさらに値段の交渉がまだ続いていた点について。\n\n 「１００台目以降のエンジン利用料についてですが，」「エンジンが無ければシミュレーターそのものが成立しないという考えに基づくもので，台数が増える＝露出媒体が増えるという認識で，その分，金額をあげさせていただきたい」（略）などと，１０１台目以降の導入に関する料金体系に関する双方の見解をやり取しているのであるから，発注側と開発側との間で，同月に至っても，１０１台目以降を導入した場合の金額的な条件に関する合意が調っていなかったことは明らかである\n\n値段の合意がまだ取れてないのに契約成立とは言えない、と。ラーメン屋でメニューも値段も決まってないのに「食べることは決まってる」とはならんわけです。\n\nさらに権利関係の交渉についても。\n\n 平成２７年７月２４日に行われたX及び開発側の担当者らによる協議において，価格交渉のほか，このアプリの権利構造に関する交渉等も行われ，発注側と開発側とが，本件基本契約書にこのアプリの権利帰属に関する条項を入れ，発注側とY双方に帰属する範囲を明示するための詳細な本件別紙の作成作業も進めていたことからすれば（略），少なくとも，開発側にとって，このアプリに関する著作権の帰属がどのような形となるかということが，価格面での条件に比肩する大きな関心事であったものと推認できる。\n\nそうすると，開発側としては，発注側との間でこの契約を締結するに当たっては，価格面の条件のみならず，権利帰属に関する条件も重視すべき要素として同時に合意するために，発注側との交渉を継続していたものと考えられるし，交渉相手である発注側としてもそのような開発側の意図は十分に認識していたものと考えるのが自然である。そうすると，仮に平成２７年６月２６日時点でこのアプリの内容と導入価格が決定していたとしても，そのことのみをもってしてこの契約が成立したと評価し得るものではなく，このような観点からも，同日時点でこの契約が成立していたと理解することは契約当事者の意思に沿うものとはいえない。\n\nそして、一番大事な「署名してない」問題。\n\n 一般的に，契約当事者間において契約関係が黙示的に成立することは否定し得ないが，発注側と開発側が本件基本契約書の書式を作成して，価格交渉や権利関係に関する契約書別紙の内容に関する協議を行っていたのは，本件基本契約書を調印することにより明示的にこのアプリの継続的な使用に関する契約を締結することを目的としたものであると考えるほかない。そうであれば，発注側と開発側の双方において，本件基本契約書の調印に至る以前の段階でこの契約を成立させる意思を有していたとは考え難い。\n\nこの点，発注側は，（略）開発側との取引では，常に後付けで契約書の作成が行われていたものであり，この契約も本件基本契約書を調印する以前に成立したと理解することは何ら不合理ではない旨主張する。しかしながら，このアプリの開発や１００台の先行導入については，このアプリの開発行為や１００台の導入の事実行為が現に行われたものである以上，その前提として契約書作成前の段階であっても上記事実行為を行うことに関する最低限の契約が成立していたとみるほかないが，これに対して，本件で問題となる１０１台目以降の導入或いは２２０台の導入という事実行為は何ら行われていないのであるから，このアプリの開発や１００台の先行導入とは全く状況が異なるのであって，発注側の主張は当を得たものとはいい難い。\n\n裁判所が言いたいのはこういうこと。「100台の先行導入は実際にやった。だから最低限の合意はあった。でも101台目以降は何もやってない。何もやってないのに契約成立とは言えない」。\n\n結果、発注側の2300万円の請求は全部棄却。","takeaway":"で、結局なにが大事なの？\n\n・担当者が「全部やります！」と言っても、その人に決定権がなければ契約にならない。相手の「偉い人」の承認を必ず確認しよう\n・値段・権利・条件、全部合意できてから「契約成立」と言える。一個でも交渉中なら成立してない\n・署名前の書面はただの「交渉中のメモ」。自分に有利な解釈をしない\n・口頭や熱意だけで仕事を進めるな。メールで「この条件で合意しました」を必ず残せ\n\n「仲がよければ大丈夫」は、大丈夫じゃなかったときに一番後悔するやつです。","one_liner":"担当者の「熱意」は契約じゃない。署名のない紙は、ただの紙だ。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"アプリ開発会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"コンタクト販売会社"}],"lessons":["契約書読んどけば…","口約束は約束じゃない"]},{"original_title":"東京高判令2.2.26（瑕疵担保責任に基づく解除と損害賠償請求）","url":"https://itlaw.hatenablog.com/entry/2021/01/20/000307","court":"東京高判","date":"令2.2.26","year":"令和2年","topic":"瑕疵担保責任に基づく解除と損害賠償請求","categories":["契約・報酬","瑕疵・完成","責任・損害"],"fun_headline":"【実話】稼働初日にサイトが落ちた→ 解除→ 4400万円の請求→ 裁判所が全部さばいた話","hook":"みなさん、システムが本番稼働した当日に落ちたことありますか。\n\nないですよね。ないといいんですけど。\n\n今日の主人公はあります。しかも「開かなくなった」というレベルで。稼働日の当日に。\n\nこれ、怖すぎる。","summary":"・絡んでる金額: 340万円\n・テーマ: 瑕疵担保責任に基づく解除と損害賠償請求\n・契約とお金の話","what_happened":"登場人物を整理します。\n\n開発側は持ち帰り弁当店の運営会社。発注側はWeb開発の会社。開発側が発注側に「Web注文システムを作ってください」と依頼したわけです。\n\n契約の中身は複雑で、要件定義の準委任（約340万円）、Web開発の請負＋準委任（約2750万円）、ネットワーク機器の売買（約1330万円）の三段構成。全部合わせると約4400万円です。\n\n【ちょっと解説】準委任（じゅんいにん）── 「結果は約束しないけど、プロとしてちゃんとやります」という契約。美容院で「いい感じにしてください」と言うのに近い。SES契約はだいたいこれ。\n\nで、いよいよ平成25年7月1日。システム稼働。\n\n……当日に落ちました。注文サイトが開かなくなった。\n\nここで僕の話をさせてほしいんですけど、僕が昔バイトしてたコンビニで、レジが稼働初日に固まったことがあって。店長が「なんでや」って叫んでたのを思い出しました。あのスケールの1000倍くらいの話がここで起きてます。話を戻します。\n\n翌日再開したら今度は「動作が遅い」という障害。第三者ベンダが調査したら「このシステムでは多くのユーザーがアクセスする公開Webサービスとして期待する性能を実現することは不可能と思われる」という報告が出ました。\n\n「不可能と思われる」って、ヤバくないですか。不可能ですよ不可能。\n\n発注側は「直します」と言い、改修計画書も出したんですが、検証方法などで意見が合わず、平行線のまま7月25日に開発側が「解除します」と通知。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。レストランで「カレーください」と注文するようなもので、カレーが出てこなかったら契約違反。\n\n発注側は「うちはちゃんと作った。お金払え」と4400万円を請求。開発側は「バグだらけで使えない。解除だ。むしろ損害賠償しろ」と反論。\n\nちょっと面白いポイントがあって、開発側はこの訴訟の中で「要件定義の準委任は発注側がやって、うちが検収しました」「仕事は完成しました」「機器の引き渡しは完了しました」と認めたんです。\n\n【ちょっと解説】検収（けんしゅう）── 「確認しました、OKです」と納品物を正式に受け取ること。これが終わると基本的に「やっぱダメ」とは言いにくくなる。\n\n自分で認めちゃったんですよ、法廷で。これ、どう転ぶか。","issue":"要するに何が問題だったかというと──\n\n争点がいくつかあるんですが、今回特に面白いのは「要件定義の段階で発注側が情報提供の義務を怠ったんじゃないか？」という点です。\n\n【ちょっと解説】善管注意義務（ぜんかんちゅういぎむ）── 「その道のプロなら当然気をつけるでしょ」という注意義務。ITベンダなら、既知の脆弱性対策くらいやれよ、という話。\n\n具体的には、アクセス数の要件をすり合わせるとき、発注側が開発側に見せたデータが「同時注文数」のデータだったのに、開発側は「同時アクセス数」と誤解してしまったという問題です。そのせいで「ピーク時300件対応」という要件がずれてた。\n\nこれ、誰が悪いの？という話。","ruling":"裁判所、こう言いました。\n\nまず「発注側に情報提供義務違反はあったか？」について。\n\n 発注側と開発側が宅配システム（Ｗｅｂ）へのアクセス数を打ち合わせるに当たっては，発注側の担当者が，旧宅配サービスのシステム下におけるサイトへのアクセス数を開発側の担当者に示しながら打合せをし，店舗数が２００件の状態での同時「注文数」が最大で１０から２０であることに言及していたことから，開発側の担当者において，「ピーク時アクセス件数３００件」について，「同時注文が３００件可能」という意味であると誤解したことについてもやむを得ない面があったといえ，開発側が適切な要件定義をするための情報提供に関して，発注側に善管注意義務違反があったものと認められる。\n\n発注側の義務違反、認定。\n\nただし──\n\n 宣伝等による顧客動向の変化等を予測して必要なアクセス数を予測することは，基本的に開発側の責任である\n\n開発側も悪い、と。裁判所は開発側の過失7割と判断しました。\n\n裁判所、どっちも怒ってる。めっちゃ公平。\n\nつまり「発注側が数字の説明を雑にしたのは悪い。でも『どのくらい集客するか』を予測するのは開発側の仕事でしょ」ということです。居酒屋で「何人来ますか？」ってお店に聞かれたのに「知らん」と答えて、席が足りなくなったら誰が悪い？という感じ。\n\nさらに「この情報提供義務違反の損害は、バグ（瑕疵）による損害と重なるので、追加の損害賠償はできない」とも。","takeaway":"で、結局なにが大事なの？\n\n・「請負」か「準委任」かで責任の内容が全然違う。契約書の文字を確認しよう\n・検収は慎重に。「OK」と言ったら「やっぱダメ」が難しくなる。条件を明確にしてから判子を押せ\n・要件定義の段階で「アクセス数」「同時接続数」「同時注文数」はちゃんと言語を揃えろ。曖昧なまま進めると後で地獄になる\n・契約解除は最終手段。要件を満たさないと解除した側が逆に不利になることもある\n\n要件定義で「なんとなくOK」は、稼働日の地獄への入口です。","one_liner":"稼働初日に落ちたシステムは、だいたい要件定義で死んでいる。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"弁当店運営会社"},{"role":"第三者","icon":"👥","side":"third","desc":""},{"role":"開発側","icon":"💻","side":"defendant","desc":"システム開発会社"}],"lessons":["「完成」って何？"]},{"original_title":"東京地判令2.2.26（連絡が途絶えたことによる開発終了）","url":"https://itlaw.hatenablog.com/entry/2021/01/13/232651","court":"東京地判","date":"令2.2.26","year":"令和2年","topic":"連絡が途絶えたことによる開発終了","categories":["その他"],"fun_headline":"【実録】クライアントの質問を無視して1日既読無視したフリーランス、裁判で全部負けた話","hook":"ちょっと待ってこれ聞いたら驚くから。\n\nフリーランスのエンジニアが、クライアントからの質問に1日以上返信しなかったんですよ。\n\nそれだけで「開発終了・代金もらえず」になりました。\n\n既読無視って、こんなにリスクあったんですね。","summary":"・絡んでる金額: 45万円\n・テーマ: 連絡が途絶えたことによる開発終了","what_happened":"登場人物を整理します。\n\n被告は会社で、クラウドソーシングの「L」というサービスを使って、生産・商品在庫・売上管理システムの開発をフリーランスの原告に依頼しました。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。レストランで「カレーください」と注文するようなもので、カレーが出てこなかったら契約違反。\n\n原告はいくつかのタスクは納品して、ちゃんとお金ももらいました。でも別のタスクについて「納品したのに代金を払わない」と被告を訴えたわけです。45万円を求めて。\n\nここで僕の話をさせてほしいんですけど、クラウドソーシングのトラブルって、金額は小さくても消耗しますよね。僕の友人がランサーズで3万円の案件でクライアントと揉めて、精神的に2ヶ月引きずってたのを思い出しました。今回はその15倍の金額です。話を戻します。\n\nさて、事件はここから起きます。","issue":"要するに何が問題だったかというと──\n\n「仕事は完成したのか？」「開発が止まったのは誰のせいか？」この2点です。\n\n原告は「完成して納品した」と言う。被告は「完成してない、しかも原告が連絡を絶ったから開発止めた」と言う。","ruling":"さあ、裁判所の答えです。\n\n開発が止まった経緯をちゃんと整理しましょう。\n\nX（フリーランス）とY（クライアント）は、クラウドソーシングのメッセージ機能でやり取りしてました。システムの不具合について議論していた。被告は「不安なので対面で打ち合わせしたい」と言った。これに対して原告が返した言葉が──\n\n 「現状を拝見しただけでは完成像と運用の際のオペレーションをイメージすることが難しく，クライアントが操作・運用可能なものに仕上がるのかどうか発注者としてはとても不安です。そのため，私共としては，早急にお目にかかってお打合せの機会を持った方が，様々リスクや相互の理解不足を回避できるのではないかと考えた次第です。」\n\nこれは被告の発言。被告は「会いましょう」と言ってるわけです。丁寧に、真剣に。\n\n原告の返答は「システム要件は閉じたものとして捉えているので、これ以上の追加対応はできません」。\n\nその後、被告が原告に「この業務に含まれているもの、内訳を教えてください」と質問しました。\n\n原告からの返信が──\n\n1日以上、来なかった。\n\n被告は「これ以上続けるのは無理」と判断して、\n\n 「今後の対応について弊社で協議しますので，開発はストップしてください。」\n\nと通知した。\n\nそして裁判所はこう判断しました。\n\n 前記認定事実によれば，平成３０年１１月１６日，原告と被告とのやり取りにおいて，このシステムの製作進行に関する認識の差異が表面化して議論となり，今後，実運用に足りるシステムが完成できるのかを不安に思った被告が，原告に対し，この業務２に含まれるものの内容を教えてほしいと質問したところ，原告は突如として連絡を絶ったことが認められる。この点，原告は，被告からこの業務２を請け負った請負人の立場にあったのであるから，上記の質問を受けたのであれば，それに誠実に回答すべき本件請負契約上の義務があったというべきところ，上記の質問を受けるまで被告との間で頻繁なやりとりをしていたにもかかわらず，上記の質問を受けるや，１日間以上にわたって被告に何らの応答もしなかったのであって，これによれば，被告において今後のシステム製作に強い危機感を抱いたのはもっともなことであり，原告に依頼していたシステム開発を停止するとの判断に至ったことについてはやむを得ない判断であったというべきである。\n\n裁判所が言ってるのは「それまでフツーに返信してたのに、都合が悪い質問が来たとたんに1日以上黙ったら、そりゃ相手は不安になるでしょ」ということ。\n\nX（フリーランス）の気持ちはわかる。めっちゃわかる。「これ以上対応する義務はない」って思いたいよね。でも「連絡を絶つ」という手段、これが致命的だった。\n\n結果として、仕事は「完成していない」と判断され、被告の開発停止判断は正当とされ、原告の45万円の請求は棄却されました。","takeaway":"で、結局なにが大事なの？\n\n・クライアントの質問は無視するな。たとえ「答えたくない質問」でも、「確認中です」の一言でいい\n・「システム要件は閉じた」と一方的に決めても、相手の理解が追いついてなければ意味がない\n・検収が完了していないと「仕事完成」とは見なされない。納品の定義を最初に決めておけ\n・困ったときほどちゃんと返信しろ。黙ることが一番リスク高い\n\n既読無視は、日常でもビジネスでも、ろくなことにならない。","one_liner":"返信しない選択は、「負け」を選ぶ選択だった。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"フリーランス開発者"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"発注者"}],"lessons":["「完成」って何？"]},{"original_title":"東京高判令2.2.7（コインハイブ事件控訴審）","url":"https://itlaw.hatenablog.com/entry/2020/02/08/120927","court":"東京高判","date":"令2.2.7","year":"令和2年","topic":"コインハイブ事件控訴審","categories":["暗号資産・ブロッキング"],"fun_headline":"【全エンジニア注目】サイトにコインハイブ仕込んだら逮捕→ 一審無罪→ 控訴審でひっくり返った話","hook":"自分のウェブサイトに「コインハイブ」というスクリプトを埋め込んだウェブデザイナーが逮捕されたんです。\n\nコインハイブって何かというと、サイトを見てる人のパソコンのCPUを使って仮想通貨をマイニングするプログラムのことです。\n\nこれ、犯罪なのか犯罪じゃないのか。一審と控訴審で答えが変わりました。","summary":"・テーマ: コインハイブ事件控訴審\n・仮想通貨関連","what_happened":"まず背景を整理しますね。\n\n「コインハイブ」は2017〜2018年ごろに話題になったやつです。ウェブサイトのコードに埋め込んでおくと、訪問者のブラウザが勝手に仮想通貨（Monero）を掘ってくれる仕組み。掘った仮想通貨はサイト運営者のものになる。\n\n要するに、サイトの訪問者のパソコンを「こっそり」計算に使わせて、運営者が儲ける、というビジネスモデルです。訪問者は知らない間にCPUをフル回転させられてる。\n\nちょっとここで僕の話をさせてほしいんですけど、これって電気代泥棒じゃないですか。他人の電気を使って自分が稼ぐ。銭湯で他人のタオルで体を拭いているような感じ。いや、もっと悪い気がする。話を戻します。\n\n一審（横浜地裁）では、コインハイブについて。\n\n「反意図性」──つまり「ユーザーが意図しない動作をさせる」という要件は満たしてると認めました。\n\nでも「不正性」──つまり「社会的に許容されていない」という要件を否定して、無罪としました。\n\nさらに「実行の用に供する目的」も否定。結論：無罪。\n\nで、検察が控訴したのがこの話です。","issue":"争点をまとめます。\n\n刑法168条の2が問題になりました。「不正指令電磁的記録」──つまり「ウイルス」に該当するかどうかという話。\n\n要件は3つ。\n1. 反意図性：ユーザーの意図に反して動作させる\n2. 不正性：社会的に許容されていない\n3. 実行の用に供する目的があったか\n\nこの3つ全部揃わないと犯罪にならない。一審では「1は満たすが2と3は違う、無罪」でした。控訴審ではどうなったか。","ruling":"裁判所、こう言いました。\n\n控訴審（東京高裁）は、一審と違う判断を下しました。\n\n「不正性」について、一審は「社会的に許容されていないとは言えない」としましたが、控訴審はこれを覆しました。\n\nポイントは「ユーザーへの告知なし」という点です。コインハイブを使っていること、CPUが使われることをユーザーに知らせていなかった。\n\nあ、今思い出したんですけど、ウェブサービスの利用規約って誰も読まないじゃないですか。読まないけど「読んだことにして」同意するやつ。コインハイブの問題と根っこが似てる気がする。「知らないうちにCPU使われてる」は、「知らないうちに個人情報取られてる」と同じ構造で怖い。話を戻します。\n\n反意図性については一審と同じく認定。\n\n不正性については「ユーザーに告知なくCPUを使わせることは、社会的に許容されていない」と認定。\n\n目的要件については「実行の用に供する目的があった」と認定。\n\n結果、一審の無罪を破棄し、有罪（罰金刑）。\n\n裁判所、じわじわと「知らないうちに使われる」に対して厳しくなってる。これ、エンジニア全員が把握しておくべき判断だと思います。","takeaway":"で、結局なにが大事なの？\n\n・ユーザーのリソース（CPU、電力、通信量）を使う場合は、必ず明示的な同意を取れ\n・「みんなやってる」「グレーゾーンだろ」は通用しない。特に新しい技術の分野では法律が後から追いつく\n・コインハイブのような「見えないコスト」をユーザーに押しつける設計は、法的リスクどころか信頼失墜リスクもある\n・判例は変わる。一審無罪でも控訴審で有罪になる。「過去に無罪だった」は参考にならない\n\n「知らなかった」も「みんなやってた」も、裁判所には通じなかった。","one_liner":"他人のCPUで自分が儲けようとしたら、それは犯罪だった。","parties":[{"role":"請求側","icon":"💼","side":"plaintiff","desc":"検察官"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"サイト運営者"}],"lessons":["規約、読んだ？"]},{"original_title":"さいたま地判令2.2.5（モバゲー免責条項差止）","url":"https://itlaw.hatenablog.com/entry/2020/02/10/172937","court":"さいたま地判","date":"令2.2.5","year":"令和2年","topic":"モバゲー免責条項差止","categories":["その他"],"fun_headline":"【衝撃】「当社は一切損害を賠償しません」という規約、裁判所に差し止められた話","hook":"みなさん、サービスの利用規約を読んでますか。\n\n読んでないですよね。僕も読んでません。\n\nでも今日の話は、読んでなくても関係ある話です。\n\n「当社は一切損害を賠償しません」という規約が違法かどうかについて、裁判所が真剣に議論した事件です。","summary":"・絡んでる金額: １万円\n・テーマ: モバゲー免責条項差止","what_happened":"まず整理します。\n\nNPO法人X（適格消費者団体）が、DeNA（Y）のモバゲーの利用規約にある2つの条項を「これ違法だから使うな」と訴えた事件です。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\n問題になった条項がこれです。\n\n 7条（会員規約の違反等について）\n\n１　M会員が以下の各号に該当した場合，当社は，当社の定める期間，本サービスの利用を認めないこと，又は，M会員の会員資格を取り消すことができるものとします。（略）\n\nａ　会員登録申込みの際の個人情報登録，及びＭ会員となった後の個人情報変更において，その内容に虚偽や不正があった場合，または重複した会員登録があった場合\n\nｂ　本サービスを利用せずに１年以上が経過した場合\n\nｃ　他のＭ会員に不当に迷惑をかけたと当社が判断した場合\n\nｄ　本規約及び個別規約に違反した場合\n\nｅ　その他，Ｍ会員として不適切であると当社が判断した場合\n\n２　（略）\n\n３　当社の措置によりM会員に損害が生じても，当社は一切損害を賠償しません。\n\n１２条（当社の責任）\n\n４　本規約において当社の責任について規約していない場合で，当社の責めに帰すべき事由によりM会員に損害が生じた場合，当社は，１万円を上限として賠償します。\n\n５　当社は，当社の故意または重大な過失によりＭ会員に損害を与えた場合には，その損害を賠償します。\n\n7条3項の「一切損害を賠償しません」と、12条4項の「1万円を上限として賠償します」という2つが問題になりました。\n\nここで僕の話をさせてほしいんですけど、「一切賠償しません」ってすごい言葉だと思うんですよ。居酒屋で「万が一食中毒になっても責任取りません」って書いてある紙を渡されたら怖いじゃないですか。でもデジタルサービスだと当たり前みたいな顔して書いてある。話を戻します。\n\n訴えた側原告は最初4つの条項を問題にしてたんですが、DeNAが途中で2つを修正・削除したため、最終的に上記の2つについての争いになりました。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\nこれを受けてDeNAが規約を一部直したということ自体、「確かにこれはまずかった」という認識があったということですよね。企業側の対応として興味深い。","issue":"争点をまとめます。\n\n消費者契約法8条1項1号・3号に違反するかどうかです。\n\n簡単に言うと、「事業者が自分の責任を全部免除する条項」や「事業者が自分の責任があるかどうかを自分で決める権限を持つ条項」は無効だ、という法律があります。\n\nモバゲーの規約がこれに当たるかどうか。\n\n7条3項「一切賠償しません」と、12条4項「最大1万円だけ賠償します」、それぞれについて判断が下されました。","ruling":"裁判所、こう言いました。\n\nまず7条3項の「当社の措置によりM会員に損害が生じても，当社は一切損害を賠償しません」について。\n\nこれは消費者契約法8条1項1号・3号に違反する、として差止請求を認容しました。\n\n理由はシンプルです。「事業者が自分の判断でアカウントを停止する権限を持っておきながら、その結果生じた損害を一切賠償しない、というのはおかしい」。\n\n裁判所、めっちゃ真っ当。好き。\n\nちなみに全然関係ないけど、「一切損害を賠償しません」って規約、読んだことある人いますよね。あれ、法律的に無効になる可能性があるということです。読んで「損したな」と思っても諦めないでください。話を戻します。\n\n次に12条4項の「1万円を上限として賠償します」について。\n\nこちらは、前の12条5項で「故意または重大な過失の場合は損害を賠償する」と別途書いてあったことが重要でした。\n\n12条4項はあくまで「軽い過失のとき」を想定している条項であり、重大な過失には12条5項が適用される、という構造として読めば、消費者契約法には違反しない、として差止請求を棄却しました。\n\n要するに「軽い過失なら1万円上限でもいいけど、重大な過失の免責はダメ」ということです。","takeaway":"で、結局なにが大事なの？\n\n・「一切損害を賠償しません」という規約は、消費者契約法違反になりえる。自社の規約を今すぐ見直せ\n・免責条項を書くなら「軽い過失限定」などの制限を明確にしておくこと\n・消費者団体から訴えられる前に規約を整えておく方が絶対にいい。後から直しても傷が残る\n・利用規約は「読まれない」ではなく「いつでも武器にされる」と思って書け\n\n「誰も読まない規約」が、裁判で全員に読まれる日が来る。","one_liner":"「一切賠償しません」は、裁判所も「それは無理」と言った。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"消費者団体"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"DeNA"}],"lessons":["規約、読んだ？"]},{"original_title":"東京高判令2.1.16（基本設計頓挫の責任）","url":"https://itlaw.hatenablog.com/entry/2020/07/14/175957","court":"東京高判","date":"令2.1.16","year":"令和2年","topic":"基本設計頓挫の責任","categories":["責任・損害"],"fun_headline":"【悲報】7000万払ったシステム、完成しなかった。誰のせい？ → 裁判所「ユーザーです」","hook":"システム開発を頼んで、7000万円払って、それでも完成しなかったとしますよね。\n\n「誰のせいなんですか！」ってなりますよね。当然です。\n\nで、裁判所が答えを出したんですけど、その答えが想像と全然違う方向でして。\n\n今日はその話をします。ちょっと待ってて、驚くから。","summary":"・絡んでる金額: 7000万円\n・テーマ: 基本設計頓挫の責任\n・責任の所在を巡る争い","what_happened":"で、何が起きたかというと。\n\nユーザーX（発注側）がベンダーY（作る側）に新しい基幹システムの開発を頼みました。\n\n【ちょっと解説】基幹システム── 会社の核になるシステムのこと。在庫管理とか会計とか、これが止まると会社が回らないやつ。\n\n最初は順調に見えました。\n\n- 平成20年9月：発注側と被請求側で業務請負基本契約を締結\n- 平成21年2月：要件定義書・基本設計書の作成を個別契約\n- 同年3月：要件定義書と基本設計書を納品。発注側は約7000万円を支払い\n- 同年6月〜翌年3月：詳細設計・開発などの個別契約を4本追加（合計約6.8億円）\n\nここで僕の話をさせてほしいんですけど、昔バイト先でシフトの引き継ぎがうまくいかなくて「誰がやるの？」って3週間誰もやらなかったことがあって。\n話を戻します。\n\n- 平成22年2月：被請求側から「詳細設計が遅れてすみません」というお詫び文書が届く\n- 同年3月：納期を1年延長する覚書を締結\n- 平成23年1月ごろ：被請求側から「やり直し後の基本設計も長引いて、また延長が必要です」と申し入れ\n- 同年7月：発注側が被請求側に対して契約解除を通知\n\n僕がこの立場だったら転職サイト開いてると思う。\n\n【ちょっと解説】請負（うけおい）── 「完成品を届けます」という契約。「カレーライスください」と注文するようなもので、カレーが来なかったら契約違反。\n\n発注側は「もう無理」と7000万円の返還と21.5億円の損害賠償を求めました。\n\n被請求側は反論します。「遅れたのは発注側がルール外の作業をやらせたり、方針をコロコロ変えたりしたせいだ。こっちこそ被害者だ」と言って、逆に約12億円を請求（反訴）。\n\nで、ここからがヤバいんですけど。\n\n一審（東京地裁）では「発注側の協力義務違反はない。でも被請求側の遅延は責任あり」として、発注側の主張を一部認め、約1.2億円の支払いを被請求側に命じました。\n\nこれに対して発注側も被請求側も「納得いかん」と控訴した、という話です。","issue":"要するに何が問題になったの？\n\nここテストに出ます。\n\nポイントは2つ。\n\nひとつめ。被請求側の開発が遅れたのは誰のせい？\n- 発注側が「契約範囲外の作業をやらせた」のか？\n- 発注側が「ちゃんと協力しなかった」のか？\n- それとも被請求側がただ遅かっただけか？\n\nふたつめ。被請求側が「契約範囲外の作業をやった分のお金をくれ」と言っているけど、それは認められるか？\n\n【ちょっと解説】協力義務── 発注側（ユーザー）がベンダーにきちんと協力する義務のこと。要件を決めない、レビューしない、連絡を無視するとかは義務違反になりうる。\n\n要するに「なんでシステムできなかったの？どっちが悪いの？」ってことを裁判所に決めてもらった話です。","ruling":"裁判所はこう言いました。\n\n一審と真逆の結論が出ます。びっくりしないでください。\n\n高裁は「開発が遅れた主な原因は発注側にある」と判断しました。\n\n具体的には、\n- 発注側が契約範囲外の大量の作業を被請求側にやらせていた\n- 発注側が開発方針を不合理に変更した\n- 発注側が被請求側への協力義務を果たさなかった\n\nこれらを認定して、一審とは逆に「発注側の本訴請求はすべて退ける」という判断になりました。\n\n一方で被請求側の反訴については「約7.7億円を認める」。\n\nただし、被請求側が「契約範囲外の作業の報酬をくれ」という部分については次のように述べて退けました。\n\n裁判所、こう言いました。\n\n> 新要件定義書１．０は，本件変更覚書に基づいて作成されたものであって，作成された要件定義書に各個別契約には含まれていない要件が記載されているとしても「他人のために行為をしたとき」に当たらない\n\nつまりこういうこと。\n\n「契約書に書いてないことをやった」としても、それが「本来の仕事をこなすための行為」や「次の契約の準備」と見なされれば、別途お金は取れない。\n\n裁判所、めっちゃ冷静。\n\nでも追加契約も成立していないとして、結局被請求側の契約範囲外作業の報酬請求は全部棄却されました。","takeaway":"で、結局なにが大事なの？\n\n- 協力義務は発注側にも課せられる。要件決めない、方針コロコロ変えるは立派な「義務違反」になる。開発はベンダーだけの問題じゃない\n- 「口頭で頼んだ追加作業」はお金を取れないことがある。契約範囲外の仕事をするときは必ず事前に追加契約を結ぶ。じゃないと「本来業務の一環」と判断されて終わる\n- 証拠は丁寧に残す。メール、議事録、覚書。「そんな話してない」「してた」の戦いで勝つには書面しかない\n- 契約解除は最終手段。使い方を間違えると、解除した側が損害賠償を請求される立場になることがある\n\n一言でまとめると「発注側も義務を果たさないと、裁判で負けます」です。","one_liner":"システム開発の失敗を全部ベンダーのせいにしてたら、裁判所に「あなたのせいです」と言われることがある。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ユーザ企業"},{"role":"被請求側","icon":"⚖️","side":"defendant","desc":"ベンダ企業"}],"lessons":["契約書読んどけば…","証拠がないと詰む","「完成」って何？"]},{"original_title":"東京地判令元.12.26（元従業員に対するソースコードの保存等請求と特定）","url":"https://itlaw.hatenablog.com/entry/2021/05/30/161148","court":"東京地判","date":"令元.12.26","year":"平成31年・令和元年","topic":"元従業員に対するソースコードの保存等請求と特定","categories":["プログラム・システム"],"fun_headline":"【実録】会社が元従業員に「そのソースコード返せ」と訴えた結果、裁判所に「何のコードですか？」と言われた件","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n会社が元従業員に「ソースコードを返せ！」と裁判を起こしました。\n\nで、裁判所の答えが「そのソースコード、何ですか？」。\n\nえ、ちゃんと訴えてるのに「特定できてない」って言われたんです。\n\nITリテラシーと法律リテラシーのすれ違いが生んだ悲劇。見ていきましょう。","summary":"・テーマ: 元従業員に対するソースコードの保存等請求と特定\n・システム開発のトラブル","what_happened":"ここから先がとんでもないんですよ。\n\nX（従業員）とY（会社）の間で解雇をめぐるトラブルがありました。\n\n権利主張側は「この解雇は無効だ」と主張して、職場復帰と未払い賃金を求めて訴えました（本訴）。\n\nここで全然関係ない話なんですけど、僕が学生のときにバイトを突然クビになったことがあって、そのとき「え、なんで？」ってなった記憶があります。\n話を戻します。\n\n相手方は逆に権利主張側に対して「お前が在籍中に開発したソースコードを出せ」と反訴しました。\n\nその請求内容がこうです。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。たとえばソースコードを渡す義務があったのに渡さなかった、みたいな話。\n\n (1) 　原告は，被告に対し，別紙２ソースコード目録記載のソースコードのデータを別紙３パソコン目録記載のパソコンに保存せよ。\n\n (2) 　原告は，被告に対し，別紙２ソースコード目録記載のソースコードのデータを保存した前記(1)のパソコンを引き渡せ。\n\n (3) 　原告は，別紙２ソースコード目録記載のソースコードのデータその他の原告が被告の業務として開発した全てのソースコードのデータを複製，公衆送信，譲渡，貸与又は翻案してはならない。\n\n (4) 　原告は，前記(1)のデータの保存及び前記(2)のパソコンの引渡しをした上で，別紙２ソースコード目録記載のソースコードのデータその他の原告が被告の業務として開発した全てのソースコードのデータを廃棄せよ。\n\nちょっと深呼吸しましょう。\n\nわかります？「ソースコードをパソコンに保存して、そのパソコンを渡して、コピーもするな、全部捨てろ」ということです。\n\nで、一度は和解の話がまとまりかけたんですよ。\n\n権利主張側が「わかった、ソースコード入りのUSBを相手方に渡す」ということで合意しかけた。\n\nしかし。\n\n相手方がUSBを受け取ったら「対象のソースコードが入ってない」「動かない」という話になって、和解は崩壊。\n\n結局、裁判で決着をつけることになりました。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n相手方が「返せ」と言ったソースコードの特定の仕方が、法的に「特定できてる」と言えるかどうか、です。\n\n相手方の特定方法はこうでした。\n\n UNINT LoadImages (IN PMOUNT_IMAGE pImages , 以下，引数の定義部分略)\n\n{\n\nで始まって、\n\n }\n\nで終わる部分、ということです。\n\nこれってつまり「`{`で始まって`}`で終わる中身のコード」を返せ、ということなんですけど。\n\n権利主張側はこう反論しました。「拡張子も指定してない。ファイルが何個あるかも言ってない。それで対象が特定できてるって言えるの？」\n\n要するに「なんのソースコードか全然わかんない」ということです。","ruling":"いよいよ判決です。\n\n裁判所は「ソースコードの特定が不十分」として、保存・引き渡し請求を却下しました。\n\n裁判所はこう言っています。\n\n 相手方の本件ソースコード８の定義では，上記「｛」と「｝」との間の文字列が何ら特定されていないため，「ソースコード」といえる限り，いかなる文字列であっても，その定義にあてはまることになり，論理的には，ＬｏａｄＩｍａｇｅｓ関数以外のあらゆる「ソースコード」が含まれ得ることになる。\n\nつまりこういうこと。\n\n`{`と`}`の間に何が入るかが全然決まってないから、世界中のあらゆるソースコードが「当てはまる」可能性がある。それって特定してると言えなくない？\n\nエンジニアとして「まあそうだよね」ってなりますよね。\n\nさらに裁判所はこうも言いました。\n\n 相手方の本件ソースコード８の定義では，上記「｛」と「｝」との間の文字列が何ら特定されていないため，「ソースコード」といえる限り，いかなる文字列であっても，その定義にあてはまることになるばかりか，「ソースコード」の定義も明らかでないため，結局のところ，本件における審判対象を的確に特定していないものといわざるを得ない。したがって，本件ソースコード８の特定は不十分というべきであるから，相手方の本件ソースコード８のデータを別紙３パソコン目録記載のパソコンに保存するよう求める請求に係る訴えは，不適法として却下すべきである。\n\n裁判所、めっちゃ正確。\n\n裁判所は相手方に「補充主張があれば言ってください」と釈明の機会を与えたんですが、相手方はなんの追加主張もしなかったそうです。\n\nそうなると、もう却下するしかない。\n\n著作権に基づく差止め請求や廃棄請求も、同じ理由で却下されました。\n\nただし、パソコン自体の引き渡し請求は認められています。ソースコードじゃなくてパソコンは特定できてるから。","takeaway":"で、結局なにが大事なの？\n\n- 裁判で「返せ」と言うものは具体的に特定しなければならない。「あのコード」「あの関数」では通じない。ファイル名、拡張子、バージョン、全部必要\n- 技術的な概念を法律の言葉に翻訳するのはめちゃくちゃ難しい。エンジニアが「これはわかるでしょ」と思ってることが裁判所には通じないことがある\n- 退職時のソースコード管理ルールは事前に決めておく。「誰が持ってる」「どこにある」「どう引き継ぐか」を明文化しないと、いざというとき「特定できません」になる\n- 和解がうまくいかなかった理由も教訓。「USBを渡す」という合意だけでは不十分。何のデータかを明確にしないと「入ってない」問題が起きる\n\nこの記事もう結構長くないですか？ でもあと一言だけ言わせてください。","one_liner":"「そのソースコードを返せ」という訴えは、「そのソースコードが何か」を明確に言えないと裁判所に門前払いされる。","parties":[{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"元従業員"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"IT企業"}],"lessons":["辞め方を間違えた","パクリの立証は地獄"]},{"original_title":"東京地判令元.12.20（脆弱性対応の責任の所在）","url":"https://itlaw.hatenablog.com/entry/2021/03/02/225516","court":"東京地判","date":"令元.12.20","year":"平成31年・令和元年","topic":"脆弱性対応の責任の所在","categories":["セキュリティ","責任・損害"],"fun_headline":"【怖すぎる】「OpenSSL脆弱性の対応、ウチの仕事じゃないです」で裁判所が「そうですね」と言った話","hook":"みなさん、Heartbleedって知ってますか？\n\n2014年に発覚した超有名なOpenSSLの脆弱性で、世界中のサーバーがやばいことになったやつです。\n\nで、これへの対応が「誰の仕事か」が裁判で争われました。\n\n結論から言うと、裁判所の答えが「契約書に書いてないから、あなたの仕事じゃないです」。\n\nこれ、一見ベンダー側の勝ちに見えるんですけど、後味がめちゃくちゃ悪い話でして。","summary":"・絡んでる金額: 20万円（月額）、損害請求は約1.6億円\n・テーマ: 脆弱性対応の責任の所在\n・セキュリティ事案","what_happened":"ちょっと長くなるけど、大事な話なので付き合ってください。\n\n被害者側という会社が通販サイトを持っていました。そのサイトはEC-CUBEで作られていた。\n\n2013年ごろ、被害者側は責任者側という会社にそのサイトの「運用・保守管理」と「EC-CUBEカスタマイズ」を月額20万円で委託しました。\n\n契約書は作ってません。注文書にサラッと書いてあるだけ。\n\nここで僕の話をさせてほしいんですけど、友人と「ちょっと手伝って」って言って引越しを丸ごとやらされた話を思い出しました。「ちょっと」って言葉、こわい。\n話を戻します。\n\n2014年4月。OpenSSLに深刻な脆弱性（後にHeartbleedと呼ばれる）が公表されました。\n\n被害者側のサイトでもOpenSSLを使っていた。\n\nしかし、対応が行われなかった。\n\n2015年5月。決済代行会社から被害者側に連絡が入ります。「お客さんのクレジットカード情報が漏れてるかもしれません」。\n\nここまで読んで「うわぁ……」ってなった人、正常です。\n\n被害者側はクレジットカード決済を緊急停止。\n\n被害者側は責任者側に対して「OpenSSLの脆弱性対応はあなたの仕事だったはず。やらなかったせいで情報漏えいが起きた」として、被害総額約1.6億円の損害賠償を求めました。\n\n【ちょっと解説】逸失利益── 「あの事故がなければ得られたはずの利益」のこと。システムが止まってた間の売上損失とかがこれにあたる。","issue":"要するに、裁判所に聞きたいことはこういうこと。\n\nここテストに出ます。\n\n責任者側へのOpenSSL脆弱性対応は、月額20万円の委託契約に含まれていたか？\n\n被害者側は「『保守管理』って書いてあるじゃないですか。セキュリティ対応はそこに入るでしょ」と主張。\n\n責任者側は「EC-CUBEのカスタマイズを頼まれただけです。OpenSSLは別物ですよ」と主張。\n\n「保守管理」って書いてあるだけで、何がどこまで含まれるかを誰も決めていなかった。\n\nこれが事件の核心です。","ruling":"いよいよ判決です。\n\n裁判所は「責任者側の仕事にはOpenSSLの脆弱性対応は含まれていなかった」と判断しました。\n\n裁判所はこう言いました。\n\n この契約における当事者の合意内容をうかがわせる本件注文書（甲４）に委託される業務として記載された「このサイトの運用，保守管理」との記載は，このサイトが直ちにこのシステム全体を意味するとまではいえない以上は，少なくともその文言上，これにこのシステム全体を対象とする業務が含まれることが直ちに読み取れるとまでいうことはできず，また，同じく本件注文書に委託される業務として記載された「ＥＣ－ＣＵＢＥカスタマイズ」との記載についても，ＥＣ－ＣＵＢＥはインターネット上の通販サイト用のソフトウェアの一つである一方，ＯｐｅｎＳＳＬはインターネット上の暗号化通信に用いられるオープンソースソフトウェアであり，両者は全く性質の異なるソフトウェアであることから，このような記載に係る業務にＯｐｅｎＳＳＬに関するセキュリティ対策業務が含まれている旨を直ちに読み取ることも困難であって，ＥＣ－ＣＵＢＥにおいてＯｐｅｎＳＳＬを経由した通信がされるからといって，ＥＣ－ＣＵＢＥのカスタマイズ業務の委託を受けた者が，当然にＯｐｅｎＳＳＬに関するセキュリティ対策業務の委託を受けたこととなると解することはできない。\n\nつまりこういうこと。\n\n「EC-CUBEのカスタマイズを頼まれた人が、OpenSSLのセキュリティ対応まで当然やらなきゃいけないとは読めない」。\n\nさらに裁判所は、注文書のファイル名や件名が「SEO施策」になっていたことも指摘しました。\n\n「この契約の主な目的はマーケティングだったんじゃないですか」と。\n\nそうなると「全体的なセキュリティ対策が含まれていた」とはなおさら言えない。\n\n被害者側のその他の主張もすべて退けられ、請求は全部棄却されました。\n\nあ、今思い出したんですけど、「保守管理」って言葉、IT業界でめちゃくちゃ広く使われるわりに、誰も定義してないですよね。こわい言葉だ。","takeaway":"で、結局なにが大事なの？\n\n- 「保守管理」の範囲は必ず契約書に書く。「当然含まれるでしょ」は通じない。セキュリティ対応が含まれるなら「含まれる」と明記する\n- 脆弱性対応は誰がやるか事前に決めておく。OS層、ミドルウェア層、アプリ層、それぞれ誰の担当か。決めてなければ誰もやらない。そして誰かがやられる\n- 契約書がない、または曖昧な場合は今すぐ見直す。「今まで問題なかったから大丈夫」は、問題が起きたあとでは通用しない\n- 情報漏えいが起きてからではすべてが遅い。裁判に勝っても失った信用は戻ってこない\n\n月20万円の保守契約で守れなかったものを、1.6億円かけて取り戻そうとした話でした。","one_liner":"「保守管理」という言葉は、契約書に何も書かないと何も保守管理してないのと同じ。","parties":[{"role":"被害者側","icon":"🛡️","side":"plaintiff","desc":"通販サイト運営"},{"role":"責任者側","icon":"⚖️","side":"defendant","desc":"運用保守会社"}],"lessons":["契約書読んどけば…","セキュリティ甘すぎ","損害、証明できる？"]},{"original_title":"東京高判令元.12.19（ユーザ都合による解約の場合の報酬・損害賠償請求の範囲）","url":"https://itlaw.hatenablog.com/entry/2020/08/30/214659","court":"東京高判","date":"令元.12.19","year":"平成31年・令和元年","topic":"ユーザ都合による解約の場合の報酬・損害賠償請求の範囲","categories":["契約・報酬","PM・開発管理","責任・損害"],"fun_headline":"「やっぱやめます」と言ったユーザーにベンダーが請求できるお金の範囲、裁判所が整理した件","hook":"「やっぱりこのプロジェクト、止めることになりました」\n\nIT業界でたまに聞くこの言葉。受け取る側のベンダーはどうなるの？\n\nお金はもらえるの？ もらえないの？\n\nユーザー都合で中止になったとき、ベンダーが請求できるお金の範囲を裁判所が判断した事例があります。\n\n今日はその話です。わりと身近かもしれない。","summary":"・テーマ: ユーザ都合による解約の場合の報酬・損害賠償請求の範囲\n・契約とお金の話","what_happened":"順を追って説明しますね。\n\nユーザーX（発注側）の都合でシステム開発プロジェクトが中途で止まりました。\n\n【ちょっと解説】準委任── 「作業をします」という契約。仕事の「結果」ではなく「プロセス」に対して報酬が発生する。コンサルや調査・分析がこれに近い。\n\nベンダーY（受注側）は「途中まで作ったぶんの報酬と、損害賠償をください」と請求しました。\n\nここで僕の話をさせてほしいんですけど、昔飲み会の幹事を頼まれてお店まで予約したのに「やっぱり飲み会なしで」って言われたことがあって。\nキャンセル料は誰が払うんだろうと思った記憶があります。\n話を戻します。\n\nこの事件では、中途解約時の損害賠償について定めた契約条項と、民法の条文との関係が問題になりました。\n\nで、ここからがヤバいんですけど。\n\n「契約書に書いてある損害賠償の範囲」と「民法で認められる損害賠償の範囲」が、必ずしも一致しないことがあります。\n\nそのどちらが適用されるか、というのが争点のひとつでした。\n\n【ちょっと解説】民法641条── 注文者（発注側）はいつでも契約を解除できる。ただしベンダーが損害を受けた場合は賠償しなければならない。「やめるのは自由、でも損害は払え」ということ。","issue":"両者の言い分が食い違ったポイントはここ。\n\nここテストに出ます。争点は3つ。\n\n争点1：契約の一部が「履行不能」になったか？\n\nすでに作業が進んでいる部分を「なかったこと」にできるのか、という問い。\n\n争点2：報酬を請求できる「終了部分」ってどこまで？\n\n中途解約のとき「ここまではできた」と認められる範囲と、「委託料相当額の損害」の計算方法が争われた。\n\n争点3：契約書の条項を超えた損害賠償（民法641条）を請求できるか？\n\n契約書に「損害賠償はこの範囲まで」と書いてあったとき、民法の規定を根拠にそれ以上を請求できるか？\n\n要するに「やめると言ったユーザーに、どこまで請求できるか」です。","ruling":"裁判所はこう言いました。\n\n裁判所は各争点についてこのように判断しました。\n\n争点1（履行不能の成否）：\n中途解約された部分については、ユーザーX都合による解約であっても、その時点で未着手・未完成の作業については「履行不能」になったと判断できる部分がある、という整理がされました。\n\n争点2（報酬請求できる「終了部分」の範囲）：\n準委任契約の部分については、作業が「終了した」と認められる部分に相当する報酬を請求できる。ただし、完成していない部分は「委託料相当額の損害」として別途請求することになります。\n\n争点3（民法641条に基づく追加請求の可否）：\nここが一番のポイントです。\n\n契約書に損害賠償の範囲を定めた条項があっても、民法641条（注文者による解除）に基づく損害賠償請求はそれとは別に認められる余地がある。つまり「契約書に書いてある範囲だけ」ではなく、民法の規定を根拠に追加の請求ができる可能性があるということです。\n\n裁判所、意外と発注側に厳しい。好き。","takeaway":"で、結局なにが大事なの？\n\n- 「解約したら損害賠償はこの範囲」という条項を入れても、民法を完全には排除できないことがある。ベンダー側はこれを知っておくと交渉が強くなる\n- 中途解約時の「出来高」の計算方法を事前に決めておく。「ここまでやった分はいくら」という基準がないと、裁判で全部争うことになる\n- ユーザー都合で止めるときはコストを覚悟する。途中でやめても「なんも払わなくていい」にはならない\n- 契約書は書けば書くほどいい、ただし曖昧な条項は逆効果。「解約時の損害賠償はどう計算するか」まで書き込んでおく\n\n「解約は自由、でもタダじゃない」。これが今日の結論です。","one_liner":"プロジェクトをやめるのは自由だけど、途中までやったベンダーへのお金はちゃんと払いましょう。裁判所も「払え」と言います。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ベンダ"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ユーザ企業"}],"lessons":["契約書読んどけば…","「完成」って何？"]},{"original_title":"東京地判令元.12.19（データベースからのデータ抽出と不法行為）","url":"https://itlaw.hatenablog.com/entry/2020/09/22/181452","court":"東京地判","date":"令元.12.19","year":"平成31年・令和元年","topic":"データベースからのデータ抽出と不法行為","categories":["責任・損害"],"fun_headline":"【衝撃】公開データをスクレイピングして転売した業者に裁判所が「不法行為ではない」と言った理由が意外すぎた","hook":"ヤフーの病院検索サービスからデータをかき集めて、それを有料で売っていた業者がいました。\n\nデータの元の権利者が「これは不法行為だ！」と裁判を起こした。\n\nで、裁判所の答えが「不法行為ではない」。\n\nえ、どういうこと？ 一緒に整理してみましょう。","summary":"・絡んでる金額: 27万円\n・テーマ: データベースからのデータ抽出と不法行為\n・責任の所在を巡る争い","what_happened":"話を整理しましょう。\n\n権利者は病院・診療所の情報データベース（DB）を作って維持していました。\n\nヤフーは権利者と契約して、このDBをもとに「病院・診療所検索」機能をaサイトとして無料公開していました。\n\n【ちょっと解説】データベース著作権── データの「選択や配列に創作性がある」場合に認められる著作物。ただし収録されているデータ自体（住所、電話番号など）には著作権はない。\n\n被請求側は、このaサイトを見て「ここのデータ、お金払ってくれる人いるんじゃ？」と考えました。\n\nここで全然関係ない話なんですけど、インターネット黎明期にYahoo!カテゴリを手作業で分類してた人たちのことを思うと、データって本当に大変だよなって思います。\nで、話を戻します。\n\n被請求側のやり方はこうです。\n\n- 顧客から「この地域の病院リストを作って」と依頼を受ける\n- aサイトのHTMLを解析してデータ抽出プログラムを作る（いわゆるスクレイピング）\n- 抽出した情報をExcelにまとめて顧客に渡す\n- お金をもらう\n\nこれで平成27〜29年の間に少なくとも27万円の売上があった。\n\nこの時点で嫌な予感がしますよね。はい、的中です。\n\n権利者は「これは自分たちのDBの無断複製だ。不法行為だ」として損害賠償を請求しました。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。民法709条が根拠。","issue":"両者の言い分が食い違ったポイントはここ。\n\nここテストに出ます。\n\n被請求側がaサイトからデータをスクレイピングしてExcelで売った行為は「不法行為」にあたるか？\n\n権利者は「DBに著作物性があるとは主張しない。でも独立した経済的価値があるから、それを勝手に使うのは不法行為だ」と主張。\n\n著作権ではなく「不法行為」で戦ったのがポイントです。\n\nなぜかというと、このDBが著作物として認められるかどうか確信がなかったから、と思われます。保険を掛けた戦略ですね。\n\n被請求側は「公開されてる情報をまとめただけ。そもそも違法なことはしていない」と主張。","ruling":"裁判所はこう言いました。\n\nまず裁判所は「不法行為になる場合の基準」をこう示しました。\n\n 権利者が本件ＤＢの作成及び維持（更新等）のために費用及び労力をかけており，本件ＤＢに独立の経済的価値が存在すること及び本件ＤＢが著作物として保護されるものではないことは，当事者間に争いがないところ，ＤＢが著作物として保護されない場合には，当該ＤＢに独立の経済的価値があるとしても，その情報を収集して他のＤＢに組み込む行為は，情報及びＤＢの内容及び性質，行為の態様及び目的，権利侵害の程度等に照らして，著しく不公正な方法で他人の権利を侵害したと評価できる場合に限り，不法行為を構成すると解すべきである。\n\nつまりこういうこと。\n\n「著作物でないDBのデータを使う行為」が不法行為になるのは「著しく不公正な方法で他人の権利を侵害した」場合に限る、ということ。\n\nハードル高めです。\n\n続いて裁判所は「じゃあ被請求側の行為はそこまでひどかったか？」を検討しました。\n\n ア　被請求側は，ａサイトに掲載されている情報を収集して顧客に有償で提供しているところ，被請求側が顧客に提供した情報のうち，医療機関基本情報は，いずれも権利者がａサイトに有償で提供した本件ＤＢ上の情報であるから，被請求側が収集して顧客に提供した情報の大部分は，このデータと同一であると認められる。\n\nここは権利者に有利な認定です。でも続きがあります。\n\n イ　他方，このデータのうち，医療機関基本情報は，一般に公開される必要が高く，実際に公開されている情報であり，被請求側は，ａサイトにおいて無料で公開されていた情報の中から，顧客が指定した条件に従って情報を収集したに止まり，労力及び時間をかければ顧客自身でも収集することが可能な情報について，その収集を代行していたにすぎないと評価することもできる。\n\nここ、エンジニアなら身に覚えがある人いるんじゃないですか。\n\n「公開されてる情報を、手間を省いて集めてあげただけ」という言い方。\n\n続いて権利侵害の程度についても、\n\n ア　前提事実のとおり，本件ＤＢの主な市場は，検索サイトやコールセンター等への医療機関情報の提供，カーナビ向けの医療機関情報の提供及び診療圏（市場）調査である。そして，（略）権利者は，顧客との間で，本件ＤＢの更新を前提とする継続的な利用許諾契約を締結しており，（略）年間使用料は，提供する情報の範囲や更新頻度によって異なるが，数万円から数十万円程度である。\n\nと認定して、\n\n 以上によれば，本件被請求側業務には，本件ＤＢの無断複製と評価できる行為が含まれているものの，著しく不公正な方法で他人の権利を侵害したとまではいい難く，不法行為には当たらないというべきである。\n\nつまりこういうこと。\n\n「被請求側の行為はアウトっぽい部分もある。でも公開情報の収集代行レベルなら、『著しく不公正』とまでは言えない」。\n\n権利者の請求は全部退けられました。\n\n裁判所、基準を示したうえで丁寧に当てはめてる。好き。","takeaway":"で、結局なにが大事なの？\n\n- 公開されたデータのスクレイピングは、すぐに「不法行為」にはならない。「著しく不公正」という高いハードルがある。ただしグレーゾーンではある\n- データベースに著作権が認められるかどうかは別の話。著作物でなくても不法行為になることはあるが、そのハードルは高い\n- 自社データを守りたいなら、契約で利用条件を明示する。「このデータを収集・再配布してはならない」という利用規約が有効な武器になる\n- 「公開してるから誰でも使っていい」と「何に使ってもいい」は違う。公開と利用許諾は別の話\n\nこの判決、スクレイピングをやってるエンジニアには「ふーん、全然OKじゃん」と読めますが、それは早計です。","one_liner":"公開データをスクレイピングして売るのは、今回はセーフだった。でも「著しく不公正」な方法でやったら終わりなので、そのラインを意識しましょう。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"医療DB提供者"},{"role":"被請求側","icon":"⚖️","side":"defendant","desc":"データ収集業者"}],"lessons":["著作権は万能じゃない","規約、読んだ？"]},{"original_title":"大阪地判令元.10.3（ウェブサイト制作契約における権利帰属と権利濫用）","url":"https://itlaw.hatenablog.com/entry/2020/09/24/000231","court":"大阪地判","date":"令元.10.3","year":"平成31年・令和元年","topic":"ウェブサイト制作契約における権利帰属と権利濫用","categories":["契約・報酬"],"fun_headline":"【実話】Web制作会社が「434万円払え」と言った結果、全部棄却された件","hook":"ちょっと待って、これ聞いたら驚くから。\n\nWebサイトを作った会社が「著作権を侵害された！」って訴えたんですよ。\n\nで、裁判所の判断が「それ、権利の濫用です」。\n\n濫用。濫用って言われたんですよ。訴えた側が。\n\nどういうこと？ って思いますよね。説明します。","summary":"・テーマ: ウェブサイト制作契約における権利帰属と権利濫用\n・契約とお金の話","what_happened":"登場人物を整理しますね。\n\nX（制作会社）が、Y（依頼主）からWebサイト制作を受けました。\n\n発注側はサイトを作って公開した。ここまでは普通の話。\n\nで、ここからがヤバいんですけど──\n\n開発側がレンタルサーバーの費用を払わなかったんです。\n\nその結果、平成29年12月12日にWebサイトが凍結されて見られなくなった。\n\nここで僕の話をさせてほしいんですけど、サーバー代ってだいたい月数百円から数千円じゃないですか。それを払わなかったってことですよね。開発側、それは……。まあいいです、話を戻します。\n\n開発側はあわてて、凍結の直後に発注側に13万8240円を振り込んで「復旧してくれ」と頼んだ。\n\nここ大事なとこなんで簡単に言うと、サーバーの規約では「30日以内に更新料を払えば復旧できる」状況だったんです。\n\nところが発注側は何と言ったかというと──\n\n「データは失われました。復旧するには再制作が必要で、費用は434万円です」\n\n434万円。\n\nマジ？\n\n証人として出廷した別の業者Zは「サーバーが凍結された場合、料金を払えばすぐ復旧できる。特に作業は不要」と証言した。\n\nつまり、嘘をついた可能性が高い。\n\n開発側は「その値段はおかしい」と判断して、X抜きで別の業者ZにWebサイトのデータを移してもらい、新しいサイトを公開した。\n\nすると発注側が「無断で著作権を侵害した！」と訴えた、というわけです。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。","issue":"要するに何が問題だったの？\n\n問題①「そもそもWebサイトの著作権は誰のもの？」\n\n問題②「著作権があったとして、訴えることは許される？」\n\nここテストに出ます。\n\n裁判所は②について「権利の濫用に当たる」という判断を下しました。\n\n「権利の濫用」ってつまり、「権利はあるかもしれないけど、それを使うのはやりすぎ」ということ。\n\nなぜかというと──\n\n434万円の請求、データが実は残っていたのに「消えた」と言ったこと、サーバー凍結のリスクを事前に適切に警告しなかったこと。\n\nこれだけの事情が積み重なると、裁判所も「ちょっと待て」となるわけです。\n\n ア　本件の事実関係を前提とすると，仮に，Xウェブサイトの一部に，発注側の著作物と認めるべき部分が存在する場合であったとしても，以下に述べるとおり，発注側が，その部分の著作権を理由に，Yウェブサイトに対する権利行使をすることは，権利の濫用に当たり許されないというべきである。","ruling":"裁判所の判断、いきますよ。\n\n裁判所はこう言いました──「発注側の著作権があったとしても、開発側への権利行使は権利の濫用で許されない」。\n\n理由の要点をまとめると、こうです。\n\nイ　すなわち，前記認定したところによれば，\n\n発注側は，Xウェブサイト制作後，その保守管理を行っていたこと，\n\n開発側は，平成２９年秋の時点で，発注側に対する支払を遅滞し，本件サーバの更新料も支払っていなかったこと，\n\n本件サーバを使用継続するには，同年１１月３０日に最低１万２９６０円（１２か月分）を支払う必要があったが，開発側はこれを徒過したこと，\n\n同年１２月１２日，本件サーバは凍結され，Xウェブサイトの利用ができなくなったこと，\n\n開発側はその直後に発注側に１３万８２４０円を振り込み，Xウェブサイトを復旧するよう発注側に依頼したこと，\n\n本件サーバの規約によれば，Xウェブサイトのようなドメインが失効した場合，利用期限日から３０日以内であれば，更新費用を支払えば復旧可能であること，\n\n発注側は，同月１３日，開発側に対し，このウェブサイトのデータは失われ，復旧するには再度制作する必要があり，その費用は４３４万円余であると伝えたこと，\n\n開発側は，発注側の提案を断って，第三者に，このウェブサイトの復旧を依頼したこと，\n\n第三者は，このウェブサイトのデータを利用して相手方ウェブサイトを作成し，平成３０年１月ころ公開したこと，\n\n以上の事実が認められる。\n\n（略）発注側が開発側に対し，本件サーバの更新費用を怠った場合のリスクについて，適切に警告し，期限を徒過しないよう十分注意したとは認められないし，このウェブサイトの利用ができなくなった直後に開発側が金員を原告に振り込み，本件サーバの規約ではデータの使用が可能な期限内であるのに，発注側が，データが失われ復旧もできないと説明したことが適切であったことを裏付ける事情や，復旧のために４３４万円余もの高額の費用が必要であると説明したことの合理的理由は見出し難い。かえって証人第三者は，サーバが凍結された場合，サーバ会社に料金を支払えばすぐ復旧することができ，特に作業等をする必要はない旨を証言している。\n\n（略）このウェブサイトは，新たな顧客のために，開発側の事業内容を紹介するのみならず，すでに顧客，会員となった者に対するサービスの提供も行っているのであるから，このウェブサイトの停止は，開発側の企業としての活動を停止することであり，その制作・保守・管理を行った発注側は，当然にこれを了解していた。\n\nウ　前記イで述べたところによれば，このウェブサイトが停止するまでの発注側の行為は，その保守・管理を受託した者として不十分であったというべきであるし，このウェブサイトの停止後の発注側の行為は，このウェブサイトの停止が開発側を窮地に追い込むことを知りながら，これを利用して，データは失われた，復旧できないと述べて，法外な代金を請求したものと解さざるを得ない。\n\n 　上述のとおり，このウェブサイトの停止は企業としての活動の停止を意味し，既に検討したとおり，このウェブサイトの著作権は全体として開発側に帰属すると解されるのであるから，開発側が，法外な代金を請求された発注側との信頼関係は失われたとして，発注側の十分な了解を得ることなく，このウェブサイトのデータを移転するよう第三者に依頼したとしても，やむを得ないことであると評価せざるを得ない。\n\nエ　これらの事情を総合すると，仮に，このウェブサイトの一部に発注側の著作権を認めるべき部分が存在していたとしても，本件の事情において，発注側がその著作権を主張して，相手方ウェブサイトの利用等に対し権利行使することは，権利の濫用に当たり許されないというべきである。\n\nつまりこういうこと。\n\n「あなたが先にやらかしたから、著作権を盾にするのは許されません」。\n\n裁判所、めちゃくちゃ冷静。好き。\n\n発注側の請求はすべて棄却されました。","takeaway":"で、結局なにが大事なの？\n\n・Web制作の著作権は「依頼主のものになることが多い」。制作会社が主張するつもりなら契約書に明記\n・「データが消えた」と嘘をついたり法外な請求をしたりすると、著作権があっても「権利の濫用」で負ける\n・保守管理を受けてる側は、リスクを依頼主にちゃんと伝える義務がある\n・怒りで訴訟を起こす前に、自分の行動が正当だったか一度振り返ろう\n\n権利があっても、使い方が悪ければ負ける。これが今日の教訓です。","one_liner":"著作権を持っていても、嘘をついて使ったら負ける。権利は免罪符じゃない。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"Web制作者"},{"role":"開発側","icon":"💻","side":"defendant","desc":"発注者"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["著作権は万能じゃない"]},{"original_title":"東京地判令元.9.27（請負か準委任か派遣か）","url":"https://itlaw.hatenablog.com/entry/2025/03/27/192942","court":"東京地判","date":"令元.9.27","year":"平成31年・令和元年","topic":"請負か準委任か派遣か","categories":["契約・報酬"],"fun_headline":"【SES業界よ震えろ】「請負？準委任？派遣？」で揉めた1460万円案件の結末","hook":"「この契約って、なんの契約ですか？」って聞かれて即答できますか？\n\nIT業界で働いてる人なら絶対関係ある話です。\n\n請負、準委任、派遣。\n\n言葉は知ってるけど、違いをちゃんと説明できますか。\n\n今日の登場人物たちも、たぶんわかってなかった。その結果、1460万円の訴訟になった。","summary":"・絡んでる金額: 80万円\n・テーマ: 請負か準委任か派遣か\n・契約とお金の話","what_happened":"ちょっと長くなるけど、大事な話なので付き合ってください。\n\nX（依頼主）は、Y（開発会社）に、ネットショッピングサイトの在庫管理システム開発を発注しました。\n\n契約書には「別紙仕様書に準ずる」と書いてあった。\n\nでも仕様書が添付されていなかった。\n\n……ちょっと待って。仕様書がない？\n\nここで僕の話をさせてほしいんですけど、仕様書なしで開発って、僕がラーメン屋で「なんか美味しいやつください」と注文するのと同じじゃないですか。出てきたものがどうだとか言えないですよね。話を戻します。\n\n条件は「発注側の会社に常駐、月額80万円」という記載があった。\n\n発注側は毎月80万円を払い続けて、合計約1460万円を支払った。\n\nで、ここからがヤバいんですけど──\n\n開発側が「納品も修正もしない」という状況になり、発注側は開発側との契約を解除。\n\n「1460万円全部返せ」と訴えた（本訴）。\n\nそれに対して開発側は何と言ったか。\n\n「この契約は労働者派遣契約です。未払い分260万円を払え」と反訴した。\n\n【ちょっと解説】検収（けんしゅう）── 「確認しました、OKです」と納品物を正式に受け取ること。これが終わると基本的に「やっぱダメ」とは言いにくくなる。\n\nここまで読んで「うわぁ……」ってなった人、正常です。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。","issue":"両者の言い分が食い違ったポイントはここ。\n\n「この契約、法律上なんの契約なの？」\n\n【ちょっと解説】準委任（じゅんいにん）── 「結果は約束しないけど、プロとしてちゃんとやります」という契約。美容院で「いい感じにしてください」と言うのに近い。SES契約はだいたいこれ。\n\n発注側の主張：「請負契約（主位的）、または準委任契約（予備的）。完成させるか、プロとしてやるかどっちかの約束だったはずだ」\n\n開発側の主張：「違います、これは労働者派遣です。僕の人を送り込んで働かせた契約です」\n\nここテストに出ます。\n\n裁判所はどちらの言い分を採用したか。","ruling":"で、裁判所はどう判断したか。\n\nまず「請負ではない」と言いました。\n\n理由は、仕様書がないから「完成させるべき仕事の内容が特定されていない」。\n\n当事者間において本件基本契約及び本件個別契約が書面により締結されているところ，これらの契約書面の規定内容をみても，完成させるべき仕事の内容が特定されていたとはいえない。\n\nすなわち，本件個別契約書（甲４）においては，開発側がなすべき事柄として「仕様書に準ずる」とか，「指示仕様書の機能一式の製造からテストまで」などの記載があるものの，実際には本件個別契約書に仕様書は添付されていない。かえって，本件個別契約書には，開発側がなすべき事柄として「仕様書の作成」が掲げられている。\n\nえっ。マジで？\n\nまた，本件個別契約書には，この業務の内容として，９項目（①独自サイトＷＥＢシステム，②卸注文システム・見積りシステム，③在庫管理機能追加，④物流システム，⑤おてがる操作画面作成，⑥楽天ポイント・手数料チェック機能，⑦マーケティング分析機能，⑧笑得ドットコム　写真大喜利機能，⑨笑得ドットコム　リニューアル）が記載されているが，これらは単にこの業務の内容の抽象的な項目を挙げたにすぎず，完成させるべき仕事の具体的な内容とはいえない。\n\n（中略）\n\nこの契約に係る代金支払等について見ても，本件個別契約書によれば，毎月８０万円（消費税込み）を検収完了後に月末締め翌月１０日払いをすることとされており，本件個別契約書の記載振りをみても，特定の完成成果物に対して代金ないしは報酬が支払われることが前提とされているとは直ちに解しがたい。\n\n（中略）個別業務の成果物に対する検収等の有無にかかわらず，毎月のように一定の金額が支払われていたことが認められる。そして，個別業務の成果物に対して各別に検査や検収，開発側によるテストが実際に行われたことをうかがわせる証拠はない。\n\nつまり「仕様書なし・毎月定額払い・成果物の検収なし」という実態を見て、「これは請負じゃない」と。\n\n次に「労働者派遣でもない」と言った。\n\n契約書自体に「派遣関係はない」と明記されていたし、開発側のエンジニアBには一定の裁量があったから。\n\n裁判所はこう言いました。\n\nこの契約は，発注側において稼働していたこのシステムに独自販売サイト等の新たな機能を付加作成するためのものであるところ，発注側は，それまで断続的に原告からシステム開発を依頼され，このシステムについて事前知識のある開発側との間でこの契約を締結したのであるから，この契約はその相手方がこのシステムに事前知識のある開発側であることが重要な動機となっているものと認められる。\n\nまた，この契約に係る実際の作業の過程を見ても，前記認定のとおり，ＡからＢに対し，たびたび具体的な指摘がされ（略），それを受けて，Ｂが実際の制作作業を行ったものであるが，一方で，上記指摘の内容から一義的に制作作業の内容が確定するともいえず，Ｂには一定の裁量が残されていたものと認められる。\n\nまた，実際にＢが発注側の指揮命令権の下で労働者として働いていたことを認めるに足りる証拠もない（略）。\n\nなお，本件基本契約書には，開発側が行う義務の着手から成果物の納入に至るすべてにおいて，発注側と開発側との間に労働者派遣法に規定される派遣元と派遣先としてのいかなる関係も存在しないことを確認する旨が規定されている（３４条）。\n\n以上の事情によれば，開発側の作業には，このシステムの事前知識やＢの専門性を前提とする一定の裁量が認められていたものであるから，この契約は，作業者（派遣労働者）の個性や裁量が重視されない労働者派遣ではなく，むしろ，準委任の性質を持つものと認められる。\n\n結論：準委任契約。\n\nただし、発注側が求めていた「債務不履行による損害賠償」は棄却。\n\n「プロとしての注意義務（善管注意義務）に違反したとは言えない」という理由。\n\n【ちょっと解説】善管注意義務（ぜんかんちゅういぎむ）── 「その道のプロなら当然気をつけるでしょ」という注意義務。ITベンダなら、既知の脆弱性対策くらいやれよ、という話。\n\n開発側の反訴（260万円請求）も棄却。「派遣契約が前提だったけど、それが否定されたから」。\n\n結果、両者ともに負け。意味がわからない。いや、わかるけど、つらい。","takeaway":"で、結局なにが大事なの？\n\n・自分の契約が「請負」か「準委任」か今すぐ確認。請負は完成責任あり、準委任は善管注意義務\n・仕様書は必ず添付する。「別紙に準ずる」だけで仕様書がない契約は「ふわっとした約束」と裁判所に言われる\n・成果物の検収を毎月きちんと実施する。した記録も残す\n・「完成」の定義を契約書に明記する。裁判所は実態を見て判断する\n\n契約書はラブレターより丁寧に書いたほうがいい。マジで。","one_liner":"仕様書のない開発契約は、地図のない登山と同じ。どこで転んでも誰のせいかわからない。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ECサイト運営"},{"role":"開発側","icon":"💻","side":"defendant","desc":"システム開発会社"}],"lessons":["契約書読んどけば…","「完成」って何？","金の話は最初にしろ"]},{"original_title":"東京地判令元.9.5（宿泊予約仲介プラットフォームの責任）","url":"https://itlaw.hatenablog.com/entry/2022/01/04/162046","court":"東京地判","date":"令元.9.5","year":"平成31年・令和元年","topic":"宿泊予約仲介プラットフォームの責任","categories":["責任・損害"],"fun_headline":"「静かな部屋にしてください」→工事中ホテル→自費で交渉2往復→裁判所「予約サイトは悪くない」","hook":"みなさん、旅行の予約サイトって使いますか。\n\n僕はめちゃくちゃ使います。\n\nで、「特別リクエスト」欄ってあるじゃないですか。\n\n「静かな部屋をお願いします」とか書くやつ。\n\n今日の裁判、ちょうどそれです。\n\n「静かな部屋」と書いたら、着いたらホテルが工事中だった。\n\nで、訴えた。\n\n結果を先に言います。負けました。\n\nどうして負けたのか、聞いていきましょう。","summary":"・絡んでる金額: 20万円\n・テーマ: 宿泊予約仲介プラットフォームの責任\n・責任の所在を巡る争い","what_happened":"順を追って説明しますね。\n\n請求側は、相手方が運営する宿泊予約サイトでマカオのホテルを予約しました。\n\n特別リクエスト欄に「quiet room」と記入した。\n\nで、実際にホテルに行ってみたら、仮囲いがあって工事中だった。\n\n請求側の気持ち、わかる。めっちゃわかる。つらい。\n\nここで僕の話をさせてほしいんですけど、マカオってけっこう遠いじゃないですか。\n\nフライト時間も長いし、宿泊費も高いし、「静かな部屋希望」って書いたのにガンガン工事音がしてるホテルって想像するだけで嫌すぎる。話を戻します。\n\n請求側はその場でキャンセルしたんですが、当日キャンセルなので全額（816香港ドル）が決済されてしまった。\n\nそれだけじゃなくて、ホテルと直接交渉するために2回もマカオに行った。\n\n2回。\n\nその交通費も含めて、合計約20万円の損害賠償を予約サイト相手方に請求した。\n\nちなみに本人訴訟のようです。弁護士なしで自分で戦った。その気概、すごい。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。","issue":"両者の言い分が食い違ったポイントはここ。\n\n「予約サイト相手方は、工事情報を掲載しなかったことや、特別リクエストを伝えなかったことで責任があるのか？」\n\nここテストに出ます。\n\n予約サイトは「仲介しているだけ」と言う。\n\n請求側は「ちゃんと情報提供・伝達する義務があったはず」と言う。\n\nどっちが正しいか。","ruling":"で、裁判所はどう判断したか。\n\nまず、このサイトの位置づけを確認した。\n\n裁判所はこう言いました。\n\nこのサイトは，サイトを閲覧した顧客が，客室予約の手続を行うことのできるオンライン・プラットフォームであり，利用者は，無料でこのサイトを利用することができ，このサイトを通じて予約が完了した時点以降，相手方は，予約情報を宿泊施設に伝達し，利用者に予約確認書メールを宿泊施設に代わって送信し，利用者と宿泊施設との仲介のみを務めるものとされている。\n\nつまり「仲介するだけ」というのが約款で決まっていた。\n\n次に、相手方の責任について。\n\n請求側は，相手方がこのサイトに，本件ホテルの周りには仮囲いがあって工事中であるとの情報を掲載しなかったことが請求側の利益を侵害し，不法行為に当たると主張する。しかし，上記ア（ア）の約定（注：上記認定）を見ても，相手方において，本件ホテルの場所や宿泊料といった一般的な情報を超えて，本件ホテルが，原告固有の特別なリクエストにすぎない「静かな部屋」に対応することのできる状況にあるのか否かについてまで，このサイトに情報を掲載して提供する法的義務が生じるとはいえず，他に，そのような法的義務が生じることを基礎付ける事情も認められない。よって，この点に関する請求側の主張は理由がない。\n\n要するに「工事情報まで掲載する義務はない」。\n\nちょっと待って、これ居酒屋で言ったら「カウンター席がうるさいって情報を掲示しなかった居酒屋に損害賠償」みたいな話ですよ。そりゃ無理か。\n\nさらに特別リクエストの伝達についても。\n\nまた，請求側は，相手方が予約内容を正確に仲介すべき債務を負っていたと主張する。この主張が，予約内容を正確に伝達すべき債務であるという趣旨であれば，請求側が入力した他の予約情報が本件ホテルに伝達されていながら，特別リクエストのみ伝達されていないということは想定し難いのであるから，相手方は予約内容を伝達する債務を履行したといえる。また，上記の主張が，相手方において，本件ホテルに対し，請求側が静かな部屋を要望している旨を伝えて，本件ホテルに何らかの対処を求めるべき債務があるとの趣旨であるとしても，上記イのとおり，相手方の債務は予約の伝達と予約確認書メールの送信に尽きるのであって，それ以上に，相手方が，本件ホテルに対し，請求側の特別リクエストに応じた対処を求めるべき債務が存在するものとはいえない。よって，この点に関する請求側の主張も理由がない\n\n裁判所、めちゃくちゃ冷静。好き。\n\n消費者契約法、景表法違反の主張も全部退けられた。\n\n請求側の請求は全部棄却されました。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。","takeaway":"で、結局なにが大事なの？\n\n・予約サイトは「仲介するだけ」。ホテルの工事情報まで掲載する法的義務はない\n・「特別リクエスト」は法的拘束力が弱い。「静かな部屋を保証してほしい」なら直接ホテルに確認を\n・プラットフォームの責任範囲は約款で決まってる。使う前に読もう（読まんけどな）\n・損害賠償を請求するなら、相手に法的義務があったことの証明が必要\n\n特別リクエストは「お願い」であって「約束」じゃない。ここ、心に刻んでおいてください。","one_liner":"予約サイトの「特別リクエスト欄」はただのメモ帳。法的拘束力はない。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"予約仲介サイト"},{"role":"請求側","icon":"💼","side":"plaintiff","desc":"宿泊予約者"}],"lessons":["証拠がないと詰む"]},{"original_title":"知財高判令元.8.21（ソースコードと営業秘密・控訴審）","url":"https://itlaw.hatenablog.com/entry/2019/09/21/225817","court":"知財高判","date":"令元.8.21","year":"平成31年・令和元年","topic":"ソースコードと営業秘密・控訴審","categories":["プログラム・システム","営業秘密"],"fun_headline":"【転職組よ震えろ】「ソースコードを持ち出した疑惑」を裁判所が99%の数字で否定した話","hook":"退職するとき、会社のデータは絶対に持ち出してはいけません。\n\nこれは常識ですよね。\n\nでも今日の話はちょっと違う。\n\n「持ち出してない」と主張した側が、地裁で一回負けて、高裁でひっくり返した話です。\n\n証拠は「ソースコードの類似度鑑定」。\n\n99%が非類似でした。\n\nどういう結末になったか、聞いてください。","summary":"・テーマ: ソースコードと営業秘密・控訴審\n・営業秘密の話","what_happened":"順を追って説明しますね。\n\nX（元の会社）の元従業員AとBが、Y（新会社）に移籍した。\n\n相手方が開発・販売した字幕制作ソフトウェアについて、権利主張側が「うちのソースコードを使ったんじゃないか」と訴えた。\n\n前の裁判（東京地判平27年、知財高判平28年）では著作権侵害で争ったけど負けた。\n\nで、今回は「営業秘密を持ち出した」という不正競争防止法での主張に切り替えた。\n\nちょっと待って。前の裁判で負けてもう一回訴えるの？ 粘り強いな……。\n\n【ちょっと解説】不正競争防止法（ふせいきょうそうぼうしほう）── 営業秘密の持ち出し、商品の模倣など、ズルい競争方法を規制する法律。略して「不競法」。\n\n地裁（原審）では「ソースコードが営業秘密に当たる、不正競争あり」として差止と損害賠償を認めた。\n\nここ、大事なとこです。赤線引いてください。\n\n相手方が控訴して、知財高裁で争われたのが今回の話です。\n\n【ちょっと解説】営業秘密── 不正競争防止法で保護される企業秘密。ただし「秘密管理性」「有用性」「非公知性」の3要件を満たす必要がある。「うちの秘密です」と言い張るだけじゃダメ。","issue":"で、何が問題になったかというと──\n\n「相手方は権利主張側のソースコードを実際に使ったと評価できるか？」\n\nここテストに出ます。\n\n鑑定では、両社のソースコード300組を比較した。\n\n4か所で「コピーまたは参照が疑われる」という結果が出た。\n\nでも果たして、それは「使用した」と言えるのか。","ruling":"で、裁判所はどう判断したか。\n\n知財高裁は、鑑定結果を詳細に検討した上で、地裁の判断をすべてひっくり返しました。\n\nまず鑑定の内容から。両ソースコードに共通点が7つ指摘されていました。\n\n 本件鑑定の結果によれば，YソフトウェアのソースファイルＳｏｕｒｃｅＤｅｆａｕｌｔ．ｈで宣言されている変数３０個のうち，２０個の宣言が型，注釈，インデントを含めてXソフトウェアのソースファイルＧｌｏｂａｌＳｅｔｔｉｎｇｓ．ｈのものと完全に一致し（略），５個では少なくとも変数の名前がＧｌｏｂａｌＳｅｔｔｉｎｇｓ．ｈのものと一致しており，残りの５個では一致していない。\n\nまた，本件ソースコードとYソフトウェアのソースコードに共通してみられる特徴として，\n\n①クラスメンバ変数の名前がアンダースコア（＿）で始まること，\n\n②複数の英単語から構成される変数名において，各単語の先頭が大文字になっていること，\n\nここ、大事なとこです。赤線引いてください。\n\n③型名にＬＯＮＧが多用されていること，\n\n④ＨｏｒｉｚｏｎｔａｌをＨｏｒｉｚ，ＶｅｒｔｉｃａｌをＶｅｒｔと略していること，\n\n⑤変数宣言の順番が似ていること，\n\n⑥メンバ変数の型を記述する部分に３個のタブ（１２個のスペース）を用いていること，\n\n⑦●●●●●●●●●●●●●●●●●●●●のコメントがタブ文字を含めて完全に一致していることが指摘されている（以下，順に，それぞれ「共通点①」などという。）。\n\nそして，鑑定人は，上記共通点③ないし⑦から，XソフトウェアとYソフトウェアの開発者は同一人物であると判断した上で，変数の一致箇所が多いことと，共通点⑥⑦を理由に，YソフトウェアがXソフトウェアを参照して開発されたと考えるのが自然である旨述べていることが認められる。\n\n「開発者が同一人物なら一致するのは当然」という評価で、①〜⑥は「参照した証拠にならない」とされた。\n\n共通点⑦だけは「参照した可能性が否定できない」となった。でも──\n\n (ア)　本件ソースコードの類似箇所１に係る部分は，Xソフトウェアの字幕データの標準値を，ＧｌｏｂａｌＳｅｔｔｉｎｇｓ．ｈのＣＧｌｏｂａｌＳｅｔｔｉｎｇｓクラスのパブリック・メンバ変数に格納し，字幕データの標準値を格納する変数を宣言するものであって，処理を行う部分ではない。\n\nつまり、一致した部分は「変数定義」という処理を行わない箇所で、かつ──\n\n ウ　検討\n\n上記イ(イ)のとおり，類似箇所１に係る本件ソースコードとYソフトウェアのソースコードとの共通点⑦によれば，相手方らが，本件ソースコードの変数定義部分を参照した可能性は否定できない。\n\nしかし，上記イ(ア)によれば，類似箇所１に係る本件ソースコードは，変数定義部分であり，字幕データの標準値を格納する変数を宣言するもので，処理を行う部分ではないこと，変数は，いずれも字幕を表示する際の基本的な設定に関する変数であること，変数名は，字幕制作ソフトで使用する一般的な内容を表す，ごく短い英単語に基づくものであって，その形式も開発者の慣習に基づくこと，変数のデータの型は，マイクロソフト社が提供する標準のデータ型であること，注釈の内容も，変数名が表す字幕の意味をそのまま説明したものであることが認められる。\n\n要するに「一致してた部分はそもそも営業秘密じゃなかった」。\n\n有用性と非公知性がない、と。\n\n最終的な数字がこれ。\n\n 以上によれば，相手方らが，類似箇所１に係る部分以外に本件ソースコードを参照したとは認められず，また，類似箇所１に係る変数定義部分を参照した可能性が否定できないことをもって，本件ソースコードを使用したとは評価できない。そうすると，本件ソースコードについて，不競法にいう「使用」があったとはいえないというべきである。\n\n鑑定対象の2万9679行のうち、非類似が2万9561行。非類似部分が99%以上。\n\n99%が非類似。\n\nこれで「使用した」とは言えないでしょ、と。裁判所、めちゃくちゃ冷静。好き。\n\n権利主張側の全請求が棄却された。\n\nさらに裁判所は一言、地裁（原審）に苦言を呈した。\n\n その余の争点については判断するまでもないが，原判決が，将来バージョンアップされた後のYソフトウェアについて，本件ソースコードを使用するものか否か審理することなく，その使用等の差止めを認めたことは，その範囲が過大であって，相当でないことを付言する。\n\n「地裁の差止め範囲、広すぎたよ」と高裁に言われた地裁、ちょっとかわいそう。","takeaway":"で、結局なにが大事なの？\n\n・「うちの秘密です」だけじゃ営業秘密として保護されない。「秘密管理性・有用性・非公知性」の3要件が必須\n・一般的な変数名・標準的な型・業界慣習のコーディングスタイルは営業秘密にならない\n・ソースコードの類似度鑑定は強力な証拠になる。数字で出るから逃げられない（逆に守れる）\n・退職するときにデータを持っていったかどうか、後で鑑定で判断される可能性がある\n\n退職のとき、データの扱いは慎重に。人生が変わるから。","one_liner":"ソースコードの99%が非類似でも裁判になる。退職時のデータ管理を甘く見るな。","parties":[{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"字幕ソフト会社"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"元従業員ら会社"}],"lessons":["秘密は管理してナンボ","辞め方を間違えた","パクリの立証は地獄"]},{"original_title":"知財高判令元.6.6（著作権条項の解釈・控訴審）","url":"https://itlaw.hatenablog.com/entry/2019/09/28/111842","court":"知財高判","date":"令元.6.6","year":"平成31年・令和元年","topic":"著作権条項の解釈・控訴審","categories":["著作権"],"fun_headline":"【契約書の落とし穴】「契約が終わったらもう使えないはず」→「26条に書いてある、ずっと使える」→終わり","hook":"コピペしたことない人だけが石を投げなさい。\n\n……はい、みんな手を下ろしてください。今日はそういう話です。\n\nちょっと待ってこれ聞いたら驚くから。\n\n「契約が終わったらプログラムの使用権もなくなるはず」と思って訴えた会社が、\n\n「26条を読め」と言われて全部棄却された話です。\n\n契約書の読み方って、こんなに怖い。","summary":"・テーマ: 著作権条項の解釈・控訴審\n・著作権がらみの争い","what_happened":"順を追って説明しますね。\n\n権利主張側と利用側の間で基本契約を結んでいた。\n\n利用側は権利主張側の作ったプログラム（本件共通環境設定プログラム）を使い続けていた。\n\n契約が終わった後も使い続けていた。\n\n権利主張側は「契約終了後に無断で使うのは著作権侵害だ！」と訴えた。\n\nここで僕の話をさせてほしいんですけど、契約書って読みますか。僕は読まないんですよ。いや読まなきゃいけないのはわかってるんですが。この事件の当事者の方も、たぶんそういう気持ちがあったんじゃないかなと思います。話を戻します。\n\n地裁（原審）は権利主張側の請求をすべて棄却した。理由を要約すると4つ。\n\n [1]本件ソースコードが本件基本契約の終了前に複製又は翻案されたこと及び本件基本契約の終了後に本件共通環境設定プログラムが複製又は翻案されたことを認めるに足りる証拠はなく，\n\n[2]仮に，これらの複製又は翻案がされたとしても，本件共通環境設定プログラムは，本件基本契約で規定された「成果物」に該当し，本件基本契約の終了前及び終了後において，利用側は，本件基本契約に基づき本件共通環境設定プログラムを使用するために必要な範囲で本件共通環境設定プログラムを複製又は翻案して利用することができたから，複製権又は翻案権の侵害は成立しないとし，さらに，\n\nここからが本番です。覚悟してください。\n\n[3]利用側が，本件共通環境設定プログラムの複製物の所有権を取得しているから，本件共通環境設定プログラムを使用することができ，その使用による著作権法のみなし侵害も成立せず，\n\n[4]利用側は，本件基本契約終了後も本件共通環境設定プログラムを使用することができるから，その使用が債務不履行に当たらず，\n\n不当利得も成立しないとして，権利主張側の請求をいずれも棄却する旨の判決を言い渡した。\n\n権利主張側は控訴した。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。","issue":"要するに、裁判所に聞きたいことはこういうこと。\n\n「契約が終わった後も、利用側は権利主張側のプログラムを無断で使い続けていいの？」\n\nここテストに出ます。\n\nポイントは基本契約の26条。「サバイバル条項」と呼ばれるやつです。\n\nサバイバル条項ってつまり「契約が終わっても、この条項だけは生き続けます」という取り決め。\n\n裁判所はこう判断した。\n\n 本件基本契約２６条は，「（契約終了後の権利義務）」との見出しの下，「本契約が合意の解約により終了した場合および解除により終了した場合でも，本契約に定める・・・著作権・知的財産権および諸権利の帰属」についての定めが有効であると定めている。本件基本契約２６条の「著作権・知的財産権および諸権利の帰属」との文言は，本件基本契約２１条の見出しと同一である。（略）本件基本契約２６条がいう契約終了後も有効とされる「著作権・知的財産権および諸権利の帰属」の定めとは，本件基本契約２１条の定め全体を指し，同条が規定する利用に関する定めも含んでいるものと解釈するのが相当である。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n\nさらにこう続いた。\n\nまた，本件基本契約２６条の見出しが，「（契約終了後の権利義務）」とされており，同条が，「本契約が合意の解約により終了した場合および解除により終了した場合でも」となっていることからすると，（略）本件基本契約２６条は，本件基本契約が合意解約又は解除により終了した場合でも，同条に定められた各内容が有効であることを明示的に規定するとともに，それ以外の原因によって本件基本契約が終了した場合にも，上記各内容が有効であることを規定したものであると解するのが相当である。\n\nつまり「21条の利用許諾は26条によって、契約終了後も生きている。利用側は無償で使い続けられる」。\n\n権利主張側の控訴は棄却された。","ruling":"で、裁判所はどう判断したか。\n\n結論は一言でいえば「契約書の26条を読め」。\n\n成果物の利用許諾を定めた21条3項は、26条のサバイバル条項によって、契約終了後も有効に存続する。\n\nだから利用側は無償でプログラムを使い続けられる。\n\n権利主張側の主張はすべて棄却。\n\n裁判所、めちゃくちゃ冷静。好き。\n\nあ、今思い出したんですけど、こういう「契約後も使えます」「使えません」問題って、フリーランスのエンジニアでもよく聞くんですよね。「納品したあとで追加の修正を勝手に使われた」みたいな。契約書に何が書いてあるかで全部変わる、という話です。","takeaway":"で、結局なにが大事なの？\n\n・契約書のサバイバル条項（契約終了後も生き続ける条項）は必ず確認する\n・「契約が終わったら全部終わり」は大間違い。著作権・利用許諾の条項は生き残ることがある\n・成果物の利用範囲と期間を契約書に明記する。「成果物は利用側が使える」の一行が命取り\n・訴える前に契約書を全部読む。自分に不利な条文が入ってないか確認する\n\n契約書は全部読め。以上。","one_liner":"契約書を読まないやつが訴訟を起こすと、自分が書いたサバイバル条項で死ぬ。","parties":[{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"ベンダ"},{"role":"利用側","icon":"⚖️","side":"defendant","desc":"ユーザ企業"}],"lessons":["証拠がないと詰む","「完成」って何？","パクリの立証は地獄"]},{"original_title":"大阪地判令元.5.21（プログラム著作物性の立証）","url":"https://itlaw.hatenablog.com/entry/2019/06/12/224640","court":"大阪地判","date":"令元.5.21","year":"平成31年・令和元年","topic":"プログラム著作物性の立証","categories":["著作権","プログラム・システム"],"fun_headline":"【悲報】1万ページのソースコード、著作権で守れなかった件","hook":"「1万ページ超えるコード書いたのに著作権認めてもらえなかった」という話があるんですけど。\n\n1万ページですよ。印刷したら積み上げると何センチになるんですか。そのボリュームで負けるんですか。\n\nマジで？って感じですよね。でもこれ、マジなんですよ。しかも理由がすごく大事なやつで。一緒に読んでいきましょう。","summary":"・絡んでる金額: 24万円\n・テーマ: プログラム著作物性の立証\n・著作権がらみの争い","what_happened":"ちょっと整理しますね。\n\n権利主張側という人が、飲食店向けのレジアプリを作ってたんですよ。\n\n前の会社辞めて、2011年の5月ごろから主に自宅で開発してた。\n\nそのタイミングで利用側という会社が設立されて、権利主張側は利用側のために無給で開発を続けてたわけです。\n\n「無給で開発続けてた」って時点でもう胃が痛い話なんですけど、続きますね。\n\nで、2012年の12月からようやく月24万円の給与をもらって利用側の事務所に出勤するようになった。\n\nここで僕の話をさせてほしいんですけど、僕も前職でちょっと似たような「なんか気づいたら実質タダ働きしてた期間」があって、思い出したくないんですよね。全然話の規模が違いますけど。話を戻します。\n\n権利主張側は2015年7月に利用側の代表者と揉めて退職。\n\nそして「利用側のソフトウェアは権利主張側が作ったXプログラムをコピーしたものだ」として、差止めと廃棄を求めて訴えを起こしました。\n\nYプログラムがXプログラムに変更を加えたものであることには、両者ともに争いがない。つまり「ベースは同じ」というのは認めてるんですよ。\n\nで、ここからがヤバいんですけど、問題は「じゃあそれって著作権侵害なの？」というところで。\n\n権利主張側が一番しんどかったのはたぶんここからです。","issue":"要するに何が問題だったかというと──\n\nXプログラムに「著作権で守られるだけの創作性があったか」ということです。\n\n【ちょっと解説】著作物性── 「それ、著作権で保護される\"著作物\"ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\nここテストに出ます。\n\nプログラムって、同じ機能を実現しようとすると、書き方がわりと似通ってくるんですよ。\n\n例えるなら、「カレーの作り方を文章で書いて」ってお願いすると、みんなだいたい「玉ねぎを炒め、じゃがいもを入れ…」みたいな感じになりますよね。\n\nその文章に著作権があるかというと、微妙じゃないですか。プログラムも同じ問題があるわけです。","ruling":"さあ、裁判所の答えです。\n\nまず裁判所はXプログラムについてこう言いました。\n\n Xプログラムは，権利主張側が作成していたレジアプリケーションソフトを基に，権利主張側と利用側が協議しつつ，権利主張側がソースコードを書くことにより完成したものであって，顧客の携帯電話端末を注文端末として使用することができる点や，店舗において入力した情報を店舗（クライアント）側ではなくサーバー側プログラムを介してデータベースに保持し，主要な演算処理を行う点等について，従来の飲食店において使用されていた注文システムとは異なる新規なものであったと一応推測することができる。また，権利主張側の書いたXプログラムのソースコードは，印刷すると１万頁を超える分量であって，相応に複雑なものであると推測できる\n\n「1万ページあるし、新しいものっぽいね」とは認めてくれた。\n\nここで期待しちゃいますよね。「あ、勝てるのかも」ってなりますよね。\n\nちなみに全然関係ないですけど、1万ページのドキュメント、会社で読めって言われたら絶対読まないですよね。僕だったら「要約を3枚で出してください」って言います。で、\n\nでも裁判所は続きでこう言うんですよ。\n\n プログラムの著作物性が認められるためには，プログラムにより特定の機能を実現するための指令の表現，表現の組合せ，表現順序等に選択の幅があり，ありふれた表現ではないことを主張立証することが必要であって，これらの主張立証がなされなければ，プログラムにより実現される機能自体は新規なものであったり，複雑なものであったとしても，直ちに，当該プログラムをもって作成者の個性の発現と認めることはできないといわざるを得ない。\n\nつまりこういうこと。「複雑でも長くても、それだけじゃダメ。どの部分があなた独自の書き方なのかを具体的に証明して」ということです。\n\n権利主張側はどう反論したかというと、「この機能が新しくて複雑なんです」と主張したんですけど、裁判所はこう言います。\n\n 権利主張側は，（中略）する機能が一体となる点に創作性が認められる旨主張するが，これは，プログラムにより実現される機能が新規なもの，複雑なものであることをいうにとどまり，それだけでプログラムに創作性が認められることにはならないことは前述のとおりであるところ，権利主張側は，具体的にどの指令の組合せに選択の幅があり，いかなる記述がプログラム制作者である権利主張側の個性の発現であるのかを，具体的に主張立証しない。\n\n「機能が新しいのはわかった。でもあなたの個性はどこにあるの？それを示してくれないと。」\n\nこれが本当に怖いんですよ。\n\nあ、今思い出したんですけど、昔の職場でデザイナーの先輩が「作ったロゴに著作権はあるの？」って議論になってて、「ありふれたフォントを使っただけだと難しいかも」って話になったことがあって。あれ結局どうなったんだろう。話を戻します。\n\n権利主張側が「この部分が創作的」と具体的に証明できなかったため、裁判所は最終的にこう言いました。\n\n 仮にXプログラムの一部に，権利主張側の個性の発現としての創作性が認められる部分が存したとしても，その部分と同一又は類似の内容がYプログラムに存すると認めるに足りる証拠はなく，結局のところ，平成２４年５月２２日時点のXプログラムの著作権に基づいて，現在頒布されているYプログラムに対し，権利を行使し得る理由はないといわざるを得ない。\n\n「仮に著作権があったとしても、同じ部分がYプログラムにあるとも証明できてないよね」ということで、権利主張側の請求は退けられました。\n\n権利主張側の気持ち、わかる。めっちゃわかる。つらい。","takeaway":"で、結局なにが大事なの？\n\n・プログラムの著作権は「機能が新しい」「量が多い」では証明できない。具体的にどのコードのどの部分が自分だけの書き方なのかを示す必要がある\n・著作権を主張するなら、差分となる部分を記録・保管しておくことが超重要。「俺が作った」を後から証明するのは難しい\n・利用側が権利主張側のコードをベースにしてることを認めていても、著作権侵害の立証責任はX側にある。「使われた側が証明しなきゃいけない」という残酷さ\n・コードを書いたら、なるべく早く著作権主張の根拠になる記録を残せ。Gitのコミット履歴はそういう意味でも大事\n\n1万ページ書いても、「どこが独自なの？」に答えられなければ意味がない。世の中そういうもの。","one_liner":"コードの量じゃない。「あなた独自の表現」が証明できるかどうか。それだけ。","parties":[{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"プログラム開発者"},{"role":"利用側","icon":"⚖️","side":"defendant","desc":"飲食店向けSW販売"}],"lessons":["証拠がないと詰む","著作権は万能じゃない","辞め方を間違えた"]},{"original_title":"大阪地判平31.4.11（口コミサイトランキング不正）","url":"https://itlaw.hatenablog.com/entry/2019/05/15/212019","court":"大阪地判","date":"平31.4.11","year":"平成31年・令和元年","topic":"口コミサイトランキング不正","categories":["その他"],"fun_headline":"【ヤバすぎ】自分でランキングサイト作って自分が1位になった業者、裁判になった件","hook":"みなさん、外壁塗装って頼んだことありますか？\n\n僕はないんですけど、たぶんいい業者を探すときに口コミサイトとか見ますよね。\n\n「このサイトで1位の業者なら安心かな」って。\n\nでも、その1位の業者が自分でそのランキングサイトを運営してたとしたら？\n\n今日はそういう話です。マジで意味わからないんですけど実際に起きてる話なので聞いてください。","summary":"・絡んでる金額: 264万円\n・テーマ: 口コミサイトランキング不正","what_happened":"話を整理しますね。\n\n原告と被告はどちらも外壁塗装リフォームの業者です。\n\nで、被告が口コミサイトを運営してたんですよ。外壁塗装業者のランキングがあるサイトを。\n\nそのサイトで1位になってたのが、被告です。運営者自身です。\n\n...もう一回言いますね。サイトを運営してる被告が、そのサイトのランキングで1位になってました。\n\nここで僕の話をさせてほしいんですけど、学生のころ自分でボードゲームを作ったことがあって、自分がルールを作れるから自分がめっちゃ強くなるようにルール設定したんですよ。友達にすぐバレて「それおかしくない？」って言われました。それと似たような話です。話を戻します。\n\n原告は当然「それおかしいだろ」となりまして。\n\n被告の行為が「品質等誤認惹起行為」、つまり消費者を誤解させるズルい競争をしてるとして、損害賠償264万円を求めて訴えました。\n\n【ちょっと解説】不正競争防止法（ふせいきょうそうぼうしほう）── 営業秘密の持ち出し、商品の模倣など、ズルい競争方法を規制する法律。略して「不競法」。\n\nちなみに全然関係ないけど、「品質等誤認惹起行為」って読み方、「ひんしつとうごにんじゃっきこうい」ですよ。漢字9文字。法律の名前ってなんでこんなに読みにくいんですかね。\n\n原告がサーバー管理会社に発信者情報開示を請求して、いろいろ調べていく中で被告が運営者だと判明しました。\n\n【ちょっと解説】発信者情報開示── ネット上で権利を侵害された人が、プロバイダに対して「投稿者が誰か教えて」と請求する制度。\n\nで、最初はサーバー管理者のPという人を訴えたんですけど、調べてみたらPじゃなくて被告が運営者だったと。だから改めて被告を訴えた、という経緯です。\n\nここまで読んで「弁護士費用かかりまくってるじゃないか」と気づいたあなた、するどい。それが後で問題になります。","issue":"要するに何が問題になったか、というと──\n\n被告が不正競争をしてたのはまあOKとして（全然OKじゃないですけど）、「じゃあ原告の損害はいくらなの？」というところです。\n\n原告は「無形損害」（目に見えない損害、信用の毀損とか）と「有形損害」（実際に払ったお金とか）を主張しました。\n\n「無形損害」については、裁判所は「被告がランキング不正やってたとしても、原告の信用が具体的に傷ついたとまでは認められないよ」と言って退けました。\n\n「有形損害」については、弁護士費用の話になります。\n\n今回原告は最初にP（実際はYだった人）を訴えた訴訟と、改めて被告を訴えた訴訟の2つをやってるんですよ。\n\n裁判所の問題意識は「2回目の訴訟、本当に必要だった？最初から交渉すれば良かったんじゃない？」というところで。","ruling":"さあ、裁判所の答えです。\n\n原告が主張した264万円に対して、裁判所が認めたのは8万円でした。\n\n8万円。264万円を求めて8万円。約3%。\n\nこの数字を見た瞬間「え、それだけ？」ってなりますよね。僕なりました。\n\n内訳はこうです。\n\n最初のP相手の訴訟（第1訴訟）の弁護士着手金は約20万円だったんですが、裁判所は「まあ、不正競争の調査をするためにサーバー管理会社に請求した部分は必要だったね」として、7万円を認めました。\n\nで、被告を直接訴えた第2訴訟の弁護士費用（こちらも着手金約20万円）については、「Pと任意交渉をしないでいきなり訴訟にしたのは必要だったとは言えないよね」として、認めませんでした。\n\nあと、この訴訟（被告を訴えた今回の裁判）の弁護士費用は1万円だけ認めました。\n\n合計8万円。\n\n裁判所、めっちゃ冷静。好き。でも原告はしんどい。\n\nあ、今思い出したんですけど、弁護士費用って基本的に「勝訴しても全額は戻ってこない」んですよ。認められるのはだいたい損害額の1割とかで。だから実際に動かすお金と、裁判で戻ってくるお金は全然違うんですよね。これ知らない人多い気がする。話を戻します。\n\n教訓としては「任意交渉（まず話し合い）をすっ飛ばしていきなり訴訟にすると、その費用は損害として認めてもらいにくい」ということです。","takeaway":"で、結局なにが大事なの？\n\n・不正競争をされても、「自分の信用が実際に傷ついた」ことを証明するのは難しい。感情的な損害は基本的に認められにくい\n・訴訟を起こす前にまず任意交渉（話し合い）をすること。それをすっ飛ばすと弁護士費用が損害として認められなくなる\n・弁護士費用は裁判で全額戻ってくるわけではない。「勝訴=元が取れる」ではない\n・競合他社のランキングサイトを鵜呑みにするな。誰が運営してるかちゃんと確認しろ\n\n264万円請求して8万円。訴訟は「正義が勝つ場所」ではなく「証明できた分だけ勝てる場所」。","one_liner":"自分でルールを作って自分が1位になっても、損害賠償は8万円しかもらえなかった。それが現実。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"外壁塗装業者X"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"外壁塗装業者Y"}],"lessons":["秘密は管理してナンボ","損害、証明できる？"]},{"original_title":"大阪高判平31.3.27（取締役退任後の引継義務履行としてのパスワード開示請求）","url":"https://itlaw.hatenablog.com/entry/2020/09/24/231359","court":"大阪高判","date":"平31.3.27","year":"平成31年・令和元年","topic":"取締役退任後の引継義務履行としてのパスワード開示請求","categories":["その他"],"fun_headline":"【実話】辞めた取締役がInstagramのパスワードを教えてくれなかったら300万円の裁判になった件","hook":"会社を辞めるとき、業務で使ってたアカウントのパスワードを引き継がずに辞めたら、どうなると思いますか？\n\n今日の判例、答えは「50万円払え」という裁判所の判断でした。\n\nでも最初は「300万円払え」っていう裁判だったんですよ。\n\nインスタのパスワード問題で300万円の裁判。2019年の話です。Instagramって個人のSNSアプリだと思ってたんですけど、それで300万円の裁判が起きる時代になってたんですね。","summary":"・絡んでる金額: 300万円\n・テーマ: 取締役退任後の引継義務履行としてのパスワード開示請求","what_happened":"整理しますね。\n\n被告は原告の代表取締役だったんですよ。\n\nで、被告は個人のGmailアドレスを使って、会社の商品の写真をInstagramに投稿してました。\n\nアカウント名には原告のブランド名が入ってて、プロフィールには原告のウェブサイトへのリンクもあった。完全に会社の公式アカウントっぽい感じです。\n\nここで僕の話をさせてほしいんですけど、僕も昔、個人のGmailで会社の仕事をしてた時期がありまして、「あ、これ引き継ぎのとき絶対めんどくさくなるな」と思いながら使い続けて、案の定めんどくさいことになったことがあります。全然規模が違いますけど。話を戻します。\n\nで、被告は原告のインスタにラグビー選手仲間の写真も投稿してたんですよ。被告が元ラグビー日本代表選手だったので。\n\n2017年5月1日、被告は原告の代表取締役を退任しました。揉めて辞めたのかどうかはわからないですけど。\n\nここからがヤバいんですけど、被告はInstagramのパスワードを教えてくれなかった。\n\n原告は商品の写真を投稿できなくなって、フォロワーが減って、損害が出た。\n\nそこで原告は「パスワードを開示する義務がある」として、それを履行しろという請求と、履行しなかった損害賠償300万円を求めて裁判を起こしました。\n\nエンジニアなら身に覚えがある人いるんじゃないですか。「退職した人がアカウント情報を持ったまま辞めた」という話、わりと聞きますよね。\n\nちなみに全然関係ないけど、Instagramのパスワード忘れたとき、Gmailで登録してたら復旧できるんですよね。でも今回は被告が個人のGmailで登録してたから、X側がそのGmailにアクセスできない。詰んでる。\n\n一審（大阪地裁）では「このアカウントは原告のものではない」として、原告の請求を全部棄却しました。\n\n原告は高裁に控訴したわけです。","issue":"両者の言い分が食い違ったポイントはここです。\n\nこのInstagramアカウント、誰のものなの？ということ。\n\n被告は「個人のGmailで登録した個人のアカウントだ」と言う。\n\n原告は「ブランド名が入ってるし、会社の商品写真を上げてたし、実質会社のアカウントだろ」と言う。\n\n高裁はどう判断したか。\n\n「アカウントの利用者としての地位は原告にある」として、原告は被告に対してアカウントの引継ぎを求められると認めました。\n\n一審を覆したわけです。ここで「やっと！」となるわけですが、損害額の話はまた別で。","ruling":"いよいよ判決です。\n\nアカウントの引継ぎ義務があることは認められました。\n\nでも損害額については、こんな感じで裁判所が言っています。\n\n ア　損害金額の算定については，このアカウントを通じて受け得るのは，飽くまでもインスタグラム社に個人が投稿し，これを共有閲覧し得るというサービスであり，業として専門の広告を行うものではないし，取り分け，平成３０年８月までの期間について主張される利益は，このアカウントの広告媒体としての機能を失わせたり，積極的な毀損行為と評価し得る変更がされたことに基づくものではなく，更新できないという消極的なものにとどまっているのであり，実際にも，数字上フォロワー数は１割程度しか減少していない（略）。そうすると，これらの不利益は，社会通念上売上に何らかの影響を及ぼしていることは明らかであるが，これがいかなる金額となるかを算定することは困難である。\n\nつまり「インスタが使えなくなったのは損害だね。でもいくら損したかを数字で出すのは難しいよね」ということ。\n\nこういうとき裁判所は「民訴法248条」というルールを使って、証拠から合理的に損害額を認定できるんですよ。\n\nで、その結果がこれです。\n\n イ　翻って，上記(1)イのとおり，このアカウントを更新できない不利益及び非公開とされた不利益は，いずれも財産的損害として観念できるところであり，損害の性質上その額を立証することが極めて困難といえるから，民事訴訟法２４８条に基づき，更新などの利用ができなかった期間は平成２９年５月から平成３０年８月の１年３か月であり，その後「非公開」設定とされ，他のインスタグラム利用者もこれを共有閲覧し得なくなったのは，当審の口頭弁論終結時（平成３１年１月）までの５か月に及ぶこと，その間のフォロワー数の減少の程度をはじめとする諸事情を考慮した上，損害額を５０万円と認定する。\n\nフォロワー数の減少が1割程度というのも考慮された上で、50万円。\n\n300万円を求めて50万円。これは原告としては微妙な気持ちになりますね。\n\n裁判所、めっちゃ冷静に算定してる。すごいよ。インスタのフォロワー減少分の損害を裁判所が50万円って決めてくれる時代なんですよ。\n\nあ、今思い出したんですけど、インスタのフォロワー数って、お金で買えるサービスもあるじゃないですか。フォロワー1万人で数万円とかで売ってる業者があって。そういう相場感が判決に影響してたりするんですかね。謎。話を戻します。","takeaway":"で、結局なにが大事なの？\n\n・退職するときは業務で使ってたアカウントのパスワードは必ず引き継ぐこと。それをしないと裁判になる可能性がある\n・個人のGmailで登録してても、業務で使ってたら会社のアカウントとみなされることがある。「個人で登録したから俺のもの」は通用しない\n・SNSアカウントが「引き継がれなかった損害」として認定される時代になった。会社のSNSアカウントは会社の資産として管理する仕組みを作れ\n・損害額は証明が難しい。50万円という数字は合理的な推定に過ぎない。もっと損してたかもしれないけど証明できない\n\n「個人のメールで登録したSNS」は、業務に使った瞬間に会社のリスクになる。","one_liner":"業務で使ったInstagramのパスワードを教えないで辞めたら50万円払う羽目になった。パスワードは引き継げ。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"会社"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"元代表取締役"}],"lessons":["証拠がないと詰む","損害、証明できる？"]},{"original_title":"横浜地判平31.3.27（コインハイブ事件）","url":"https://itlaw.hatenablog.com/entry/2019/06/15/152250","court":"横浜地判","date":"平31.3.27","year":"平成31年・令和元年","topic":"コインハイブ事件","categories":["暗号資産・ブロッキング"],"fun_headline":"【無罪判決】「他人のパソコンでこっそり仮想通貨を採掘したら犯罪か？」裁判所が本気で考えた件","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n「ウェブサイトを見てる人のパソコンに、こっそり仮想通貨を採掘させるプログラムを仕込んだ」という話があるんですけど。\n\n「それ完全に犯罪じゃないの？」と思いますよね。僕も思いました。\n\nでも裁判所は「犯罪とは言えない」という判決を出したんですよ。2019年の話です。\n\nこれ、法律の世界での「テクノロジーが法律を追い越す瞬間」をリアルタイムで見てる感じで、すごく面白くて怖い話なので付き合ってください。","summary":"・テーマ: コインハイブ事件\n・仮想通貨関連","what_happened":"ちょっと長くなるけど大事なので付き合ってください。\n\n請求側はあるウェブサイトを運営してたんですよ。音楽情報系のサイトです。\n\nサイトの維持費がかかるじゃないですか。普通は広告を貼ってお金を稼ぐんですけど、請求側はあるサービスの存在を知るんですよ。\n\n「Coinhive（コインハイブ）」というサービスです。\n\nこれ何かというと、ウェブサイトを見てる人のパソコンのCPUを使って仮想通貨をマイニング（採掘）させて、その収益をサイト運営者がもらう、というしくみです。\n\n【ちょっと解説】マイニング── 仮想通貨の取引を承認する計算作業のこと。計算をすることで報酬として仮想通貨をもらえる。ただしめちゃくちゃCPUパワーと電気を使う。\n\n請求側はこのスクリプトをウェブサイトのHTMLに埋め込みました。閲覧者には何も説明せずに。\n\nここで僕の話をさせてほしいんですけど、僕のパソコンのファンが急にうるさくなるとき「あれ？なんか重い処理してる？」ってなるじゃないですか。もしかしたらそういうことが起きてたかもしれないんですよ。怖い。全然笑えない話ですね。話を戻します。\n\nで、これが問題になりました。警察が請求側を「不正指令電磁的記録」の保管罪で起訴したんですよ。\n\n要するに「ウイルスを持ってた」罪です。つまり「コインハイブのスクリプトはコンピュータウイルスですよ」という主張で起訴されたわけです。\n\nちなみに全然関係ないけど、「不正指令電磁的記録」って2011年の刑法改正で新設された罪なんですよ。コンピュータウイルスを作ったり配ったりすることを取り締まるための法律です。スマートフォンが普及し始めた時期に作られた法律で、当然「マイニングスクリプト」なんてものは想定してなかったわけですよ。法律が追いついてないわけです。","issue":"さあ、何が揉めたのかというと。\n\nコインハイブのスクリプト、「不正指令電磁的記録」に当たるか？\n\nポイントは2つです。\n\n1つ目は「反意図性」。つまり「閲覧者の意図に反して動くプログラムかどうか」。\n\n2つ目は「不正性」。つまり「社会的に許容できないプログラムかどうか」。\n\n両方OKなら有罪、どちらか欠けてたら無罪、という構図です。\n\nこの2つの要件について、裁判所がどう判断したか見てきましょう。\n\n法律の条文が出てくるんですけど、これが面白い。刑法の条文を引用します。\n\n 第十九章の二　不正指令電磁的記録に関する罪\n\n（不正指令電磁的記録作成等）\n\n第百六十八条の二　正当な理由がないのに、人の電子計算機における実行の用に供する目的で、次に掲げる電磁的記録その他の記録を作成し、又は提供した者は、三年以下の懲役又は五十万円以下の罰金に処する。\n\n一　人が電子計算機を使用するに際してその意図に沿うべき動作をさせず、又はその意図に反する動作をさせるべき不正な指令を与える電磁的記録\n\n二　前号に掲げるもののほか、同号の不正な指令を記述した電磁的記録その他の記録\n\n２　（略。供用罪規定）\n\n３　（略。未遂罪規定）\n\n（不正指令電磁的記録取得等）\n\n第百六十八条の三　正当な理由がないのに、前条第一項の目的で、同項各号に掲げる電磁的記録その他の記録を取得し、又は保管した者は、二年以下の懲役又は三十万円以下の罰金に処する。\n\nこれが今回適用されようとした法律です。請求側は「保管」の罪で起訴されました。","ruling":"で、裁判所はどう判断したか。\n\nまず【反意図性】について。「閲覧者の意図に反するか？」という点。\n\n裁判所はこう言いました。\n\n 個々のプログラムが使用者の意図に反するものといえるかどうかは，個別具体的な使用者の実際の認識を基準とするのではなく，当該プログラムの機能の内容や機能に関する説明内容，想定される利用方法等を総合的に考慮して，当該プログラムの機能につき一般的に認識すべきと考えられるところを基準として判断するのが相当である。\n\nつまり「個人の認識じゃなく、一般的な感覚で判断する」ということです。\n\nそして実際の判断として、\n\n このプログラムコードの場合，その機能の内容は本件マイニングの実行すなわち仮想通貨である○○の採掘作業を実施することであるが，ａサイト内には仮想通貨やマイニングについて説明する記述がなく，ａサイト閲覧中にマイニングが実行されることについて閲覧者の同意を取得するような仕様も設けられていなかったものである。\n\nと、説明も同意もなかったことを指摘して、「一般的な閲覧者がマイニングを認識してたとは言えない」としました。\n\n弁護人が「JavaScriptは普通そういうもの、個別の同意なんて慣行がない」と主張したんですが、これについては、\n\n これに対し，弁護人は，このプログラムコードはＪａｖａＳｃｒｉｐｔ（以下「ジャバスクリプト」という。）で記述されたプログラムであるところ，今日では，個々のジャバスクリプトのプログラムの実行に際し，閲覧者側の承諾を得る慣行はないから，□□サービスによるマイニングの実行についてもあらかじめ承諾があるとみることができると主張する。しかしながら，本罪が電子計算機のプログラムに対する信頼を保護する罪であることからすれば，意図に反するかどうかは，プログラム言語一般の性質ではなく，個々のプログラムの機能に照らして判断すべきであり，本罪の成立範囲を不当に限定することにつながる弁護人の主張には賛同できない。\n\nとして退けました。「JavaScriptだから何でもアリ」という主張は通らなかったわけです。\n\nいや、そうはならんやろ。なっとるやないか。\n\nつまり【反意図性】は認められた。「閲覧者の意図に反するプログラムだった」と。\n\nここで「あ、有罪になるんだ」と思いますよね。僕も思いました。\n\nあ、今思い出したんですけど、この記事もう結構長くないですか？でも続きが大事なので読んでください。ここからが本番です。\n\n続いて【不正性】について。「社会的に許容できないか？」という点。\n\n裁判所はこう述べました。\n\n この点，「不正な」指令に限定することとされた趣旨は，電子計算機の使用者の「意図に反する動作をさせる」べき指令を与えるプログラムであれば，多くの場合，それだけで，その指令の内容を問わず，プログラムに対する社会の信頼を害するものとして，その保管等の行為に当罰性があるようにも考えられるものの，そのような指令を与えるプログラムの中には，社会的に許容し得るものが例外的に含まれることから，このようなプログラムを処罰対象から除外するためである。よって，あるプログラムによる指令が「不正な」ものであるかどうかは，ウェブサイトを運営するような特定のユーザー及びウェブサイト閲覧者等の一般的なユーザーにとっての有益性や必要性の程度，当該プログラムのユーザーへの影響や弊害の度合い，事件当時における当該プログラムに対するユーザー等関係者の評価や動向等の事情を総合的に考慮し，当該プログラムの機能の内容が社会的に許容し得るものであるか否かという観点から判断するのが相当である。\n\nここが面白いんですよ。「意図に反するプログラムでも、社会的に許容されてれば不正じゃない」という考え方をとった。\n\nそして裁判所は、こんな要素を挙げて判断しました。\n\n- ウェブサイト運営には費用がかかるから、マイニングで稼ぐのはある意味理解できる\n- でも一般ユーザーはマイニングを認知してなかった\n- マイニングによるCPU負荷は広告と比べてそこまで大きく違わない\n- 当時、マイニング自体の賛否は世の中で分かれてた\n- 公的機関からの警告とかも特になかった\n\nそして結論として、\n\n これまでに検討した諸事情に照らせば，本件当時，マイニング自体が社会的に広く知れ渡っていたわけではないとの検察官の主張を踏まえ，更には閲覧者から本件マイニングについて個別の同意を得る仕様にしたときに，その限度で利便性を後退させるものの正当性を担保できる点で十分意義があることを勘案しても，本件当時において，このプログラムコードが社会的に許容されていなかったと断定することはできず，結局，不正な指令を与えるプログラムに該当すると判断するには合理的な疑いが残るというべきである。\n\n「2019年時点では、コインハイブが社会的に許容されてなかったとは断言できない。だから『不正』とも言えない。」\n\n無罪判決。\n\n裁判所、難しいテーマに正面から向き合って答えを出してる。すごい。ヤバい。","takeaway":"で、結局なにが大事なの？\n\n・「法律に明確な禁止規定がなければセーフ」とは限らない。社会的許容性で判断されることがある\n・ただし「当時は判断が難しかった」という事情は裁判所も考慮する。白黒つけられない技術的問題は無罪になる余地がある\n・コインハイブ事件は最終的に最高裁でも無罪が確定した。ただし今後同じことをやれば有罪になる可能性が高い。法律の解釈は時代とともに変わる\n・新しい技術を使うときは「社会通念上どう見えるか」を考えることが大事。技術的に可能でも倫理的・法的にアウトになりうる\n\nテクノロジーが法律を追い越すとき、裁判所は本当に大変そう。","one_liner":"「他人のパソコンでこっそり仮想通貨を掘る」が無罪になった2019年。法律とテクノロジーの戦いは今も続いている。","parties":[{"role":"請求側","icon":"💼","side":"plaintiff","desc":"検察官"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"サイト運営者"}],"lessons":["証拠がないと詰む"]},{"original_title":"東京地判平31.3.20（野村vs日本IBM）","url":"https://itlaw.hatenablog.com/entry/2019/04/30/225039","court":"東京地判","date":"平31.3.20","year":"平成31年・令和元年","topic":"野村vs日本IBM","categories":["その他"],"fun_headline":"36億円請求して16億円認められた「野村vs日本IBM」の話をします","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n「システム開発が失敗して、36億円の損害賠償裁判になった」という話があるんですよ。\n\n36億円ですよ。億ですよ。\n\n「36億円のシステム開発プロジェクトが失敗した話」なんですけど、これ読んでいくと「あ、これ規模は違うけど自分の職場でも起きてるかも」ってなる話なので付き合ってください。\n\n判決文が14万字・100ページ超という超大作でして、僕も読んでて軽く頭がおかしくなりかけましたが、がんばってまとめます。","summary":"・絡んでる金額: 36億円\n・テーマ: 野村vs日本IBM","what_happened":"整理しますね。\n\n野村ホールディングスと野村証券（まとめて原告とします）が、「ラップ口座システム」というのを新しくしたかったんですよ。\n\n【ちょっと解説】ラップ口座── 証券会社に投資のお任せを一括で頼む口座のこと。運用から管理まで全部やってもらえる代わりに手数料がかかる。お金持ち向けのサービスです。\n\n原告は日本IBM（Y）に「WealthManager Software」というシステムのカスタマイズを依頼しました。\n\nちなみに全然関係ないけど、「WealthManager（ウェルスマネージャー）」って名前、お金持ち感がすごくないですか。「ウェルス（富）を管理してあげますよ」みたいな。名前だけで億持ってそう。\n\nこのWMってシステム、当時日本での導入実績がなかったんですよ。国内初導入。\n\n2010年11月から開発が始まって、当初は2013年1月の稼働予定でした。\n\nで、ここからが長い。本当に長い。覚悟してください。\n\nフェーズ1（導入前検証）→フェーズ2（要件定義）→フェーズ3（概要設計立上げ）→フェーズ4（概要設計）→フェーズ5（最適化）→フェーズ6（基本設計準備）→フェーズ7（設計・開発）...\n\nここで僕の話をさせてほしいんですけど、僕が関わった最長のプロジェクトで「要件定義だけで3ヶ月かかった」というのがあって、もう泣きそうになりながら毎週「要件定義シート」を更新してたことがあります。あれつらかった。全然規模が違いますけど。話を戻します。\n\nで、フェーズが進むにつれて問題が出てきます。\n\n概算開発費用が17.8億円から26.9億円に膨らんだ。\n\nスケジュールが何度も遅延した。2011年11月の計画変更、2012年2月の再変更、4月のまた変更、5月のさらなる変更…\n\n「これ以上の延期は許容できない」と原告が言い始めたのが2012年5月です。\n\n2012年8月、ついに被告が「2013年1月の稼働は困難」と報告。総合テストも中止。\n\n2012年11月、原告がプロジェクトの中止を通告。\n\n2013年1月、「履行不能」として契約を解除。\n\n36億円の損害賠償請求へ。\n\nここまで読んで「うわぁ……」ってなった人、正常です。僕もなりました。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。","issue":"両者の言い分が食い違ったポイントを整理します。\n\n原告は「IBMの管理がずさんだった。要員をころころ交代させた。設計書がひどかった。スケジュール管理がでたらめだった。だから36億円払え」という立場。\n\n被告は「いや、プロジェクトには責任制限条項があるし、原告の協力不足もあった。そもそもそんな全額は払えない」という立場。\n\n裁判所が認めたのはどの損害か、ざっくり言うと──\n\n履行不能になった個別契約（13〜15）の既払代金が約12.5億円。\n\nWMのライセンス代金が約6.6億円。これが面白くて、ライセンス契約自体は有効に履行されてるんですよ。でも開発が頓挫したせいでそのライセンスを使いようがなくなった。だから損害として認めた。\n\n 本件個別契約６が，既履行であり，本件発動通知や本件通告により遡って履行不能を来すものでないことは前記説示のとおりであるが，本件個別契約１３～１５が履行不能となったことにより，もはやこのシステムが開発されることはなく，本件全証拠によっても，本件個別契約１３～１５が履行不能を来した後，本件個別契約６により得たＷＭのライセンスについて，原告に何らかの経済的利益が残存していたとは認められない。したがって，その代金の支払は，本件個別契約１３～１５が履行不能となったことにより，無為に帰したものというべきであり，これにより債権者である原告には現実の損害が生じたと認めることができるから，本件個別契約６が履行不能を来していないからといって，上記支払額を損害から除外すべき理由は見当たらない。\n\n「ライセンス自体は使えたはずだけど、開発が失敗したせいで無駄になった。だから損害でしょ」ということです。裁判所、筋が通ってる。","ruling":"で、裁判所はどう判断したか。\n\n合計で損害額は約19.1億円になったんですよ。\n\nでも、そこに「責任制限条項」という壁がありました。\n\n 本件各個別契約のうち履行不能となった契約は，本件個別契約１３～１５のみである。そして，本件個別契約１３及び１５には「被告の損害賠償責任は（中略）損害発生の直接原因となった当該別紙所定の作業に対する受領済みの代金相当額を限度額とする。」との責任制限条項が，本件個別契約１４には「お客様が被告の責に帰すべき事由に基づいて救済を求めるすべての場合において，被告の損害賠償責任は（中略）損害発生の直接原因となった当該『サービス』の料金相当額（中略）を限度とする。」との責任制限条項が，それぞれ設けられている。\n\n要するに「賠償額の上限は契約書に書いてある」ということ。これを「責任制限条項」といいます。要するに「どんなに失敗しても、支払う金額はここまで」という上限の決まりです。\n\n原告はこれを「無効にしてくれ」と3つの角度から主張しました。\n\n「信義則違反で無効」→裁判所「野村とIBMって日本を代表する大企業同士だよね。交渉力が劣ってたなんて言えないよ」と退けた。\n\n「IBMに重過失があるから適用外のはず」→裁判所「確かにIBMのやり方に問題はあったけど、社会通念上明らかにやってはいけないことをしたとまでは言えない」と退けた。\n\nここ、僕的にはちょっと「えっ」てなったんですよ。あれだけ遅延してあれだけ問題があって「重過失ではない」って…。\n\nあ、今思い出したんですけど、以前ニュースで「大規模システム開発失敗」の話を見るたびに「なんでそんなことになるの？」って不思議だったんですけど、この裁判読んでちょっと理解しました。規模がデカくなると誰も全体像を把握できなくなるんですよ。怖い。話を戻します。\n\n原告が「前のスルガ・IBM裁判と同じ論理で責任制限条項を超えた部分も賠償して」という主張も、裁判所は「あの判決は特殊な事情あってのもの。今回には当てはまらない」と退けました。\n\n 原告は，被告には，ベンダに通常求められる適切なプロジェクト・マネジメントを怠ってこの開発業務を頓挫させた重過失があるとし，被告に重過失のある本件について本件各責任制限条項は適用されるべきではないと主張する。\n\n（中略）\n\n しかし，ベンダに重過失がある場合に責任制限条項を適用しない旨の規定は，経済産業省のモデル契約には設けられているものの，本件個別契約１３～１５に係る各契約書には，その旨の明文規定はない。\n\n「経産省のモデル契約には『重過失の場合は責任制限を適用しない』って書いてあるけど、今回の契約書にはそれが書いてなかった。だから適用できない」。\n\n契約書に書いてないことは主張できない。これが今回の最大の教訓です。\n\n結果として、裁判所が認めた損害賠償額は約16.2億円に上限が設定されました。\n\n36億円を求めて16.2億円。約45%。半分以下です。\n\nでも日本IBM側も反訴（未払報酬を請求）してたんですけど、そちらは認められなかった。\n\n裁判所、めっちゃ長い判決文を書いて、すべてをきれいに整理してる。14万字書いた裁判所の人たちも大変だったと思います。","takeaway":"で、結局なにが大事なの？\n\n・責任制限条項は必ず確認する。「支払い上限額」が契約書に書いてあれば、どんなに失敗してもそれ以上は請求できない\n・「重過失があったら責任制限は外れる」というルールは、契約書に明記されていないと使えない。書いてなければ主張できない\n・国内導入実績のないシステムを採用するときは特にリスク管理を徹底する。「できます」という言葉だけで信用してはいけない\n・ライセンスが使われなくなった場合でも、その代金は損害として認められることがある。「実際に使えなくなった損害」は広く認められる\n\n36億円請求して16.2億円。契約書に書いてないことは、裁判所も認めてくれない。","one_liner":"契約書に書いてないことは主張できない。36億円の裁判もそこで決まった。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"野村証券"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"日本IBM"}],"lessons":["契約書読んどけば…","「完成」って何？","金の話は最初にしろ"]},{"original_title":"東京地判平31.3.14（ブロッキング差止め）","url":"https://itlaw.hatenablog.com/entry/2019/03/14/164903","court":"東京地判","date":"平31.3.14","year":"平成31年・令和元年","topic":"ブロッキング差止め","categories":["暗号資産・ブロッキング"],"fun_headline":"【全ITユーザー必見】政府が「ブロッキングしろ」と言った結果、裁判所に「必要ない」と言われた件","hook":"政府が「海賊版サイトをブロックしてくれ」ってISP（インターネット業者）に頼んで、ISPが「わかった」って言ったんです。\n\nそしたら市民が「待ってくれ、それ通信の秘密に関わるんじゃないの」って訴えたんです。\n\nここまでは「あーあの話ね」ってなると思うんですけど、その後の展開がちょっと面白いんですよ。","summary":"・テーマ: ブロッキング差止め\n・仮想通貨関連","what_happened":"平成30年4月のことです。\n\n知的財産戦略本部っていう国の機関が、こんな発表をしました。\n\n要するに「悪質な海賊版サイトはブロックしていいよ。緊急避難になるから。ISP事業者さん、自主的にやってね」ってこと。\n\nここで僕の話をさせてほしいんですけど、「自主的に」って言葉、怖くないですか。なんか断れない空気、しますよね。「自主的に残業してくれると助かる」みたいな。話を戻します。\n\nNTTグループが「わかりました、準備が整い次第ブロッキングします」って発表しました。\n\n名指しされたのは3つのサイト。「漫画村」「Anitube」「Miomio」。\n\nで、ここからがヤバいんですけど。\n\n原告X（一般市民です）が「ちょっと待って」と言いました。NTTグループの相手方との通信サービス契約に基づいて、「ブロッキングするな」という差止め訴訟を起こしたんです。「通信の秘密を侵害する」って主張で。\n\nこの人、すごくないですか。市民一人が国のお墨付きをもらったNTTに「待った」をかける。\n\nちなみに全然関係ないけど、日本ではこういう「一人の市民が大企業を訴える」系の裁判がもっと増えてほしいと個人的に思ってます。頑張ってほしい。\n\nで、訴訟の途中で何が起きたかというと、サイト側に動きがあったんです。","issue":"要するに何が問題だったの？\n\n相手方が、訴訟の途中で「うちはブロッキングしませんって言いました」と宣言した。\n\n「宣言したんだから、もう差し止める必要なくない？」という話になった。\n\nここテストに出ます。「必要性がなくなったら請求は棄却できる」という話です。","ruling":"裁判所、こう言いました。\n\n訴訟の途中でこんなことが起きていました。\n\nまず、名指しされた3サイトのうち、漫画村とAnitubeはアクセスできない状態になってました。\n\nそして相手方は準備書面にこう書きました。\n\n (1)本件３サイトは，現時点において「漫画村」及び「Ａｎｉｔｕｂｅ」についてはアクセスできない状況にあり，「Ｍｉｏｍｉｏ」についてはアクセス数が緊急対策決定前に比べて激減している状態にあること，\n\n(2)相手方は，この訴訟において，上記(1)のような状況の下では，本件ブロッキングを行う予定はないと主張していること，\n\n(3)相手方の親会社の代表取締役も（略）本件ブロッキングを行わない旨を述べていること，\n\n(4)相手方は，現時点において，本件３サイトが上記(1)の状態であることから，本件ブロッキングを実施していないこと\n\n(5)現時点において，今後「漫画村」及び「Ａｎｉｔｕｂｅ」に対してアクセスできる状況になり，かつ，本件３サイトに対するアクセス数が増加することが見込まれることを認めるに足りる証拠はない。\n\nつまりこういうことです。\n\n「サイトはもう消えてるし、相手方も『やらない』って言ってる。将来また必要になる証拠もない。だから差止めの必要性はない」。\n\nそして請求は棄却されました。\n\n裁判所、めっちゃ冷静。好き。\n\n「問題が解消されたから差し止める必要はない」って言い方、すごくシンプルなんですけど、これ訴えた人からすると「え、じゃあ判断もらえないの？」ってなりますよね。\n\nあ、今思い出したんですけど、相手方の親会社の代表者は記者会見で「今はやらないけど、サイトが復活したら政府の考え方に沿って対処する」って言ってたんですよ。つまり「やらないとは言ってない」状態なんですよね。そこは裁判所に拾ってほしかった気もする。でもまあ、証拠がなければどうにもならないということです。","takeaway":"で、結局なにが大事なの？\n\n・「今はしない」と宣言されると差止め請求が難しくなる。タイミングが大事\n・通信の秘密とブロッキングの問題、法整備がないまま「緊急避難」で押し切ろうとすると後で揉める\n・一市民が大企業や国の方針に「待った」をかけられるのが司法の面白いところ\n・でも結局サイトが消えたら「問題なし」で終わってしまう。なんか腑に落ちない\n\n訴えた人の気持ち、めっちゃわかる。つらい。","one_liner":"「やらない」と言われたら「やめてくれ」とは言えない。法律ってそういうもんです。","parties":[{"role":"請求側","icon":"💼","side":"plaintiff","desc":"インターネット利用者"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"NTTグループ"}],"lessons":["証拠がないと詰む"]},{"original_title":"東京地判平31.2.28（タイプフェイスの著作物性）","url":"https://itlaw.hatenablog.com/entry/2020/04/29/232217","court":"東京地判","date":"平31.2.28","year":"平成31年・令和元年","topic":"タイプフェイスの著作物性","categories":["著作権"],"fun_headline":"【衝撃】フォント（書体）って著作権で守られると思ってた？実はそんなに甘くなかった件","hook":"ちょっと待ってこれ聞いたら驚くから。\n\nみなさん、フォントって著作権で守られてると思いますか？\n\n「え、当然じゃないの？デザインしたんだから」って思いますよね。\n\n僕もそう思ってました。でも裁判所はわりとシビアなんです。今日はその話をします。","summary":"・テーマ: タイプフェイスの著作物性\n・著作権がらみの争い","what_happened":"順を追って説明しますね。\n\nX（フォント権利者）が、映画のパンフレットとかポスターにうちのフォント使われてる、著作権侵害だ、と主張してY（映画配給会社）を訴えた事案です。\n\n要するにこういうこと。映画のポスターに使われてた書体が「俺のだ」って話。\n\nここで僕の話をさせてほしいんですけど、映画のポスターってフォントにすごいこだわりがあるじゃないですか。あのゴシック体の微妙なカーブとか。あれ、全部誰かが設計してるわけですよ。すごくないですか。ちょっと感動した。話を戻します。\n\n権利者が主張したのは「本件タイプフェイス（フォント）には著作物性がある」ということ。\n\n【ちょっと解説】著作物性── 「それ、著作権で保護される「著作物」ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\nで、裁判所は複数のフォントと本件フォントを並べて比較しました。「ア」とか「シ・ジ」とかの文字を対比したわけです。\n\nここからがヤバいんですけど。\n\nちなみに全然関係ないけど、フォントを比較する作業って裁判官も大変だなと思います。「このはねの角度が…」とかやるわけでしょ。専門家みたいな話になってくる。","issue":"要するに何が問題だったの？\n\n本件フォントは「著作物」と言えるか。\n\n著作物として守ってもらうには「顕著な独創性」と「美術鑑賞の対象になりうる美的特性」が必要、というのが過去の最高裁判例（ゴナU事件）のルールです。\n\nここテストに出ます。「普通のフォントは著作物じゃない場合が多い」という話です。","ruling":"裁判所、まずゴナU事件という有名な過去の判例を引っ張ってきました。\n\n 著作権法は，「思想又は感情を創作的に表現したものであって，文芸，学術，美術又は音楽の範囲に属するもの」を著作物と定めるところ，印刷用書体がここにいう著作物に該当するというためには，それが従来の印刷用書体に比して顕著な特徴を有するといった独創性を備えることが必要であり，かつ，それ自体が美術鑑賞の対象となり得る美的特性を備えていなければならないと解するのが相当である（最高裁判所平成１０年（受）第３３２号平成１２年９月７日第一小法廷判決・民集５４巻７号２４８１頁）。\n\nつまりこういうこと。「ちょっと凝ったデザインじゃダメ。飛び抜けてオリジナルで、美術品として鑑賞できるレベルじゃないと著作物と認めないよ」ということです。\n\nハードル、高すぎません？\n\n続いて本件フォントについての判断がこれです。\n\n ア　対比表記載の本件タイプフェイス以外の各タイプフェイス（以下「対比タイプフェイス」という。）欄の括弧内に記載された各証拠及び弁論の全趣旨によれば，対比タイプフェイス欄に記載された制作年に対比タイプフェイスがそれぞれ制作されたことが認められるところ，権利者の主張に係る本件タイプフェイスの制作年である平成１２年（２０００年）までに制作された対比タイプフェイスに限って対比した場合においても，利用側により使用された文字のうち，「シ」，「ッ」，及び「ギ」「ジ」「デ」「ド」「バ」「ブ」「ベ」「ボ」における濁点「゛」の部分（以下，単に「濁点」という。)以外の文字については，本件タイプフェイスに類似する対比タイプフェイスの存在が認められ，本件タイプフェイスの制作時以前から存在する各タイプフェイスのデザインから大きく外れるものとは認めがたい。\n\nイ　他方，本件タイプフェイスにおける「シ」，「ッ」，及び濁点の各文字については，２つの点をアルファベットの「Ｕ」の字に繋げた形状にしている点において従来のタイプフェイスにはない特徴を一応有しているということはできる。しかしながら，２つの点が繋げられた形状のタイプフェイス（ＣＬＥＡＲ　ＫＡＮＡＴ利用側ＰＥ（乙１７，９７）及び曲水Ｍ（乙１５））の存在を考慮すれば，顕著な特徴を有するといった独創性を備えているとまでは認めがたい。\n\nウ　以上からすれば，本件タイプフェイスが，前記の独創性を備えているということはできないし，また，それ自体が美術鑑賞の対象となり得る美的特性を備えているということもできないから，著作物に当たると認めることはできない。\n\n要するにこういうことです。「シとッと濁点はちょっと特徴的だけど、似たようなフォントが他にもあるから、「飛び抜けてオリジナル」とは言えない。著作物じゃない」。\n\n僕が権利者の立場だったら三日は寝込む。\n\nあ、今思い出したんですけど、フォントの権利って「著作権」じゃなくて「不正競争防止法」で守られる場合もあるんですよ。今回は著作権の話でしたけど、別のルートもあるっていう話、誰かしてあげてほしかった。","takeaway":"で、結局なにが大事なの？\n\n・フォント（書体）は著作物として認められるハードルが非常に高い。「凝ったデザイン」じゃ足りない\n・「顕著な独創性」と「美術鑑賞の対象になりうる美的特性」、この2つが両方必要\n・似たようなフォントが他に存在すると、独創性の主張が一気に厳しくなる\n・フォントを使うときは、ライセンスをちゃんと確認しよう。商用利用NGのフォントは世の中にたくさんある\n\nデザイナーの皆さん、フォントは買いましょう。無料のやつ、思わぬところで落とし穴があります。","one_liner":"「かっこいいフォントを作った」と「著作権で守られる」の間には、深くて暗い川が流れている。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"フォント著作権者"},{"role":"利用側","icon":"⚖️","side":"defendant","desc":"映画配給会社"}],"lessons":["著作権は万能じゃない"]},{"original_title":"東京地判平31.2.15（収益金分配に関する争い）","url":"https://itlaw.hatenablog.com/entry/2020/11/08/221035","court":"東京地判","date":"平31.2.15","year":"平成31年・令和元年","topic":"収益金分配に関する争い","categories":["その他"],"fun_headline":"【悲報】共同運営ビジネス、仲良しだったはずなのに気づいたら1180万円の訴訟になってた件","hook":"みなさん、共同経営って聞いてどう思います？\n\n「夢があるな」「でもリスクあるな」って感じですよね。\n\n今日の話は後者です。完全に後者。\n\nプログラムを消されて、バックアップから復旧して、最終的に4000万円以上の請求が飛んでくる話です。","summary":"・絡んでる金額: 1180万円\n・テーマ: 収益金分配に関する争い","what_happened":"話を整理しましょう。\n\n原告がプログラムの開発と運用を担当。被告が企画や顧客対応を担当。ふたりで共同でポータルサイトを運営してました。\n\n収益は広告収入で、経費を引いた分を折半するレベニューシェア方式です。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n\n平成18年からビジネス開始。平成21年に「ちゃんと契約書を作ろう」ということで書面化しました。\n\nここで僕の話をさせてほしいんですけど、「口約束でやってたのを後から書面化する」って、やるタイミングが遅れれば遅れるほど揉めやすい。これ経験則なんですけど、早め早めに書いとくに越したことないです。話を戻します。\n\n平成27年5月ごろから原告と被告の関係が悪化しました。被告が収益分配金の明細を教えなくなったんです。\n\nお金は送ってくるけど、内訳は教えない。これ、怖すぎる。\n\n原告は被告に対して「未払いの収益金払ってください。払わないなら契約解除しますよ」と催告しました。被告は期限までに払わなかった。\n\nそこで原告はプログラムを消しました。\n\nここ、大事なとこです。赤線引いてください。\n\n原告がプログラムを消した。\n\nそしたら被告はバックアップから復旧して、23日間そのまま動かし続けました。\n\nちなみに全然関係ないけど、「バックアップから復旧する」ってエンジニア的に普通の作業なんですよ。でもこういう文脈でやると著作権侵害になる可能性がある。技術と法律って面白いなと思います。で、","issue":"で、裁判所に聞きたいことはこういうこと。\n\n原告が被告に請求したのはこういう内訳です。\n\n・未払い収益金 約1180万円\n・逸失利益 4000万円\n・プログラムの著作権侵害による損害 約100万円\n\n被告は原告のプログラム消去が不法行為だとして反訴しました。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\nここで「プログラムを23日間無断使用した損害はいくらか」という計算が面白いので見てください。\n\n \n\n 前記判示のとおり，被告は，このプログラムを違法に複製し，それを平成２９年４月１日から同月２３日まで使用したということができる。原告は，プログラム著作権の複製権侵害に対する使用料相当損害金として，原告への収益分配額を基礎とすべきであると主張するが，年間の使用料相当損害金としては，本件事業から生じる年間の収益金４０２４万１５１４円を基礎にして，その１％であると認めることが相当である。\n\nそうすると，被告のプログラム著作権侵害に対する使用料相当損害金は，上記年間使用料相当額のうち２３日分に相当する２万５３５７円（小数点一位は切下げ）となる。\n\n 　（計算式）４０２４万１５１４円（別紙２の①の合計額）×１％×２３日／３６５日＝２万５３５７円\n\nその結果，原告の被告に対する請求は約4190万円認容され，反訴請求はすべて退けられた。","ruling":"で、裁判所はどう判断したか。\n\n年間4024万円の収益があるサービスを23日間無断使用した損害が、2万5357円。\n\nちょっと待って、それだけ？\n\n原告が「収益分配額を基準にしてほしい」と言ったのに、裁判所は「年間収益の1%を基準にする」って判断した。\n\nここ、なかなか身も蓋もない計算式ですよね。でもまあ裁判所的には「ライセンス使用料の相場」の話なんでしょう。\n\n裁判所、めっちゃ冷静。好き。\n\nトータルで見ると、原告の被告に対する請求は約4190万円が認容されました。反訴（被告のプログラム消去が不法行為）は全部棄却。\n\nという結論。なるほどね。","takeaway":"で、結局なにが大事なの？\n\n・レベニューシェアをやるなら「明細の開示義務」を契約書に絶対入れること\n・パートナーとの関係が悪化したときのプロセス（解除、損害賠償の計算方法）も事前に決めておく\n・プログラムを消すのは最終手段だけど、「消した後に相手がバックアップから復旧する」ことも想定しておく\n・著作権侵害の損害額は自分が思うより低く計算されることが多い。過信しない\n\n共同ビジネスは最初が肝心。仲良しのうちに、嫌な話を契約書に書いておきましょう。","one_liner":"仲良しのうちに契約書を書く。これが全てのパートナーシップの鉄則です。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"システム開発者"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"ポータルサイト運営"}],"lessons":["契約書読んどけば…","損害、証明できる？"]},{"original_title":"東京地判平31.2.4（コインチェック事件）","url":"https://itlaw.hatenablog.com/entry/2019/09/01/174852","court":"東京地判","date":"平31.2.4","year":"平成31年・令和元年","topic":"コインチェック事件","categories":["暗号資産・ブロッキング"],"fun_headline":"【令和の教訓】コインチェックに580億円盗まれたのに「契約違反じゃない」って言われた話","hook":"2018年1月のコインチェック事件、覚えてます？\n\n580億円分の仮想通貨が盗まれたやつ。\n\n「流出しました、補償します」ってなったとき、「いや待って、そのまえにサービス止めて出金できなくしたのって契約違反じゃないの？」って訴えた人がいたんです。\n\n結果がどうなったか、一緒に見ていきましょう。","summary":"・絡んでる金額: 5000円\n・テーマ: コインチェック事件\n・仮想通貨関連","what_happened":"順を追って説明しますね。\n\nX（ユーザー）がY（コインチェック）の仮想通貨交換サービスに合計84万5000円を入金してリップル（XRP）を購入してました。\n\n2018年1月26日。事件が起きました。\n\n何者かが相手方のネットワークに不正アクセス。仮想通貨ネムが5億2630万XEM（当時580億円相当）盗まれました。\n\n相手方はすぐに全サービスを停止。出金もできなくなりました。\n\nここで僕の話をさせてほしいんですけど、84万5000円を仮想通貨に入れてた請求側の気持ち、考えたことがありますか。「今すぐ引き出したい」のに「できません」って言われる。怖すぎる。居酒屋で言ったら「お会計お願いします」「ちょっとシステムがね…」みたいな話ですよ。話を戻します。\n\n請求側は1月28日、相手方に対してこう言いました。\n\n「債務不履行で契約解除します。入金した84万5000円を全額返してください」。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\nで、ここからがヤバいんですけど。\n\n相手方の利用規約にはこういう条項がありました。「ハッキングによって資産が盗難された場合は、事前通知なしにサービスを止められる。その損害について相手方は責任を負わない」。\n\n請求側はこの条項が消費者契約法に違反して無効だ、と主張したわけです。","issue":"両者の言い分が食い違ったポイントはここ。\n\n相手方がサービスを停止して日本円を払い戻さなかったことは「債務不履行」にあたるか。\n\nそして相手方の利用規約の免責条項は有効か。\n\nここテストに出ます。「利用規約の免責条項が消費者契約法で無効になるかどうか」という問題です。","ruling":"裁判所、まず免責条項の有効性についてこう言いました。\n\n 本件条項は，ハッキングその他の方法によりその資産が盗難された場合に，各顧客に事前に通知することなく，相手方がこのサービスの全部又は一部の提供を停止又は中断することができる旨を定めたものにすぎないから，消費者契約法にいう「事業者の債務不履行により消費者に生じた損害を賠償する責任の全部を免除する条項」又は同条の２第１号にいう「事業者の債務不履行により生じた消費者の解除権を放棄させる条項」には該当しない。\n\nつまりこういうこと。「この条項は『サービスを止める権利』を書いてるだけで、『損害賠償を全部免除する』とは書いてない。だから消費者契約法違反じゃない」。\n\nなるほど、そう読むか、って感じ。\n\nさらに続きます。\n\n 平成３０年１月２６日，相手方が顧客から預託された資産を管理するサーバーに何者かが不正にアクセスし，仮想通貨ネム５億２６３０万００１０ＸＥＭが不正に外部へと送金されるという事故が発生し，相手方は，これを理由として，同年２月１３日までこのサービスのうち日本円の出金サービスの，同年３月１２日までその他のサービスの一部の提供を停止したことが認められる。本件事故は，相手方のネットワークに何者かが不正にアクセスし，相手方が管理するネムが不正に外部へ送金されたというものであるから，本件条項にいう「ハッキングその他の方法によりその資産が盗難された場合」に当たるものである。\n\n「さらなる被害を防ぐためにサービスを止めることはむしろ顧客の利益になる。相手方が過失でやらかしたかどうかに関係なく、条項は適用される」。\n\n裁判所、めっちゃ顧客目線で語りながら相手方を守ってる。これが法律の妙味。\n\n請求側の気持ち、わかる。めっちゃわかる。つらい。\n\nそして結論は「債務不履行じゃない」。よって請求棄却。\n\n請求側が手にしたのは5000円分の差額精算くらいでした。","takeaway":"で、結局なにが大事なの？\n\n・仮想通貨サービスの利用規約は「ハッキング時に停止できる」条項が大抵入ってる。入金前に読もう\n・「サービスを止める権利」と「損害賠償を免除する権利」は別物。裁判所はそこを厳密に分けて判断する\n・消費者契約法は万能じゃない。利用規約がすべて無効になるわけじゃない\n・暗号資産は自己責任の世界。裁判所も「ハッキング時のリスクは分かった上で使ってるでしょ」というスタンス\n\n利用規約、ちゃんと読んでますか？ 読んでないですよね。僕も読まないです。でも読んだほうがいいです。","one_liner":"利用規約を読まないやつが損をする。この世の真実です。","parties":[{"role":"請求側","icon":"💼","side":"plaintiff","desc":"仮想通貨利用者"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"コインチェック"}],"lessons":["規約、読んだ？"]},{"original_title":"東京地判平31.2.4（納期遅延に関するベンダの責任）","url":"https://itlaw.hatenablog.com/entry/2020/02/06/211011","court":"東京地判","date":"平31.2.4","year":"平成31年・令和元年","topic":"納期遅延に関するベンダの責任","categories":["PM・開発管理","瑕疵・完成","責任・損害"],"fun_headline":"【炎上案件】1億1700万円のシステム開発が納品されなかったのにベンダが勝った話","hook":"システム開発って、大変じゃないですか。\n\n僕はエンジニアじゃないんですけど、なんとなく「大変そう」「怖そう」「炎上しそう」っていうイメージがある。\n\n今日の話はそのイメージを全部満たしてくるやつです。\n\n1億1700万円のシステムが未完成に終わった。でも「悪いのはベンダじゃない」と裁判所が言った話です。","summary":"・絡んでる金額: 1700万円\n・テーマ: 納期遅延に関するベンダの責任\n・プロジェクト管理の問題","what_happened":"お待たせしました。ここからが事件です。\n\nユーザーX（発注側）がベンダY（開発側）に「レセプト点検システムを作ってくれ」と依頼しました。\n\nレセプトっていうのは、医療機関が保険者に請求する診療報酬明細書のことです。専門的なシステムです。\n\n契約は平成27年8月。開発期間は平成28年3月31日まで。金額は総額1億1700万円。\n\nここで僕の話をさせてほしいんですけど、10ヶ月で1億1700万円のシステムを作るって、相当ハードなスケジュールじゃないですか。居酒屋で言ったら「今日中に100皿作って、1品も品質下げずに、材料費込みで」みたいな話。うん。話を戻します。\n\n着手は契約締結より先に始まってました（交渉が長引いたため）。\n\n平成27年12月、発注側が突然「このシステムが希望通りに作れるかどうか疑問があるので一時停止してほしい」と言い出しました。\n\nわかります？ この怖さ、伝わってます？\n\n「途中で止めてくれ」って言われた開発側の立場、想像してみてください。お金はもらってる（3000万円の着手金と2ヶ月分の月払い、計4140万円）。でも「止まれ」と言われた。\n\nその後、開発側は性能評価の準備を完了して「いつでもできます」と連絡した。\n\nちなみに全然関係ないけど、「準備できました」って相手に連絡するの、大事じゃないですか。証拠になりますもんね。話を戻します。\n\nところが発注側は「あなたたちは趣旨を理解していない」と言って、何の対応もしませんでした。\n\nそして平成28年3月31日、納期が来ました。システムは未納入。\n\n発注側は「債務不履行で解除します、4140万円返してください」と請求しました（本訴）。\n\n開発側は「いや待ってください、払ってもらってない分を払ってください」と反訴しました（4600万円請求）。","issue":"さあ、何が揉めたのかというと。\n\n「納期に間に合わなかった責任は誰にあるのか」。\n\n発注側は「フィット＆ギャップ分析をしなかった開発側が悪い」と主張しました。\n\nでも開発側は「いや、一時停止を求めたのXじゃないですか」と言いました。\n\nここテストに出ます。「発注側が開発を止めたら、遅延の責任は発注側にも来る」という話です。\n\n \n\n このシステム開発は，○○エンジンをベースにX向けにカスタマイズすることが予定されていたものであるが，発注側からのヒアリング後に，いわゆるフィット＆ギャップ分析は行われていないことから，既存のパッケージソフトをカスタマイズする開発手法を採る場合の一般的な開発工程を経ていないともいえる。\n\nしかしながら，（略）発注側と開発側は，システム開発作業と並行して，契約条件について交渉し，同年８月１２日，このシステム開発契約の締結に至ったが，このシステム開発契約において，このシステムは，○○エンジンをベースとして，X向けにカスタマイズしたレセプト審査システムであることが明示され，このシステムの基盤に○○エンジンを使用することを前提として，開発期間（１０か月）やこのシステム開発の対価（総額１億１７００万円）が定められ，また，契約締結後に○○エンジンとX業務との適合性の審査を実施し，その結果によっては，○○以外のシステムを選択する可能性や，○○を使用せずに新システムを構築する可能性があることを予定した規定はなく，むしろ，成果物の納入後，このシステムが発注側の要望した本件仕様に合致するかについて検収を行い，その結果，瑕疵が発見された場合には，開発側がこれを修正すること（略）なども定められている。これらの事実によれば，発注側と開発側は，このシステム開発契約締結の時点で，○○の機能は，発注側が要望する機能と概ね合致しているという認識を有しており，契約締結後に，いわゆるフィット＆ギャップ分析等の性能評価を行うことを予定していなかったと認めることができる。\n\n【ちょっと解説】瑕疵（かし）── 法律用語で言う「バグ」。正確には「契約で約束した品質を満たしていない部分」のこと。\n\nそして，（略）開発側は，発注側からこのシステム開発の一時停止を要請され，○○の性能評価の実施を求められたことに対しても同意し，平成２８年２月２日の時点において，性能評価のためのY側の準備を完了させ，発注側において性能評価を実施できるインフラの整備を完了すれば，発注側が希望する性能評価を実施できることや，説明会の準備もあることなどを伝えていたにもかかわらず，発注側は，同年３月１０日になって，開発側は○○エンジンの性能評価の趣旨を正しく理解していないなどと述べた上，同月３１日までに開発側がこのシステム開発を完成させて納入することを待つとのみ回答し，その後，何の対応もしなかったものである。このことに加え，（略）発注側は，平成２７年９月末日支払期限の同年８月分から人件費及び分析ツール費用の支払を遅滞しており，X自身が支払を約束した同年１２月２０日が迫った同年１１月３０日になって，開発側に対し，契約内容の見直しのための協議を申し入れたという経緯にも鑑みれば，平成２８年３月３１日までにこのシステムが完成しなかった主な原因は，このシステム開発の一時停止を要請し，このシステム開発契約締結時に予定されていなかった性能評価を求め，開発側にその準備をさせたにもかかわらず，その後，何の対応もしなかった発注側にあり，開発側には帰責性はないというべきである。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n\nよって，他の争点もあったが，発注側による契約解除は理由がないとされ，本訴請求は棄却された。\n\n反訴請求に関しては，約定で毎月570万円ずつ支払われるべき人件費（相当の報酬）が支払われていないことが発注側の債務不履行にあたるとして，不履行になっている債務4560万円のうち，対価の一部としてすでに3000万円が支払われていることから，その差額の1560万円が損害として認定された。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\nなお，遅延損害金割合は14.6％とすることがこのシステム開発契約で定められており，その起算点も争いがあったが，債権者から履行の請求を受けたときから遅滞に陥るとしつつ，明確な請求があったのは反訴の提起があった日であるとして後ろに設定した。","ruling":"で、裁判所はどう判断したか。\n\n「フィット＆ギャップ分析はしてない」と認めつつも、「でも最初から予定されてなかったよね」とバッサリ。\n\n裁判所、めっちゃ契約書読んでる。好き。\n\nさらにダメ押し。\n\n「遅延の主な原因はX（発注側）にある」とはっきり言い切りました。\n\n発注側が毎月の支払いも遅らせてて、一時停止を求めて、「準備できました」という開発側に何も返事しなかった。\n\n僕が開発側のPMだったら泣きながら証拠を全部プリントアウトしてたと思います。\n\n結果、発注側の開発側に対する請求は棄却。開発側の発注側に対する反訴は1560万円が認容されました。\n\nはい、裁判所はこう言いました。以上。","takeaway":"で、結局なにが大事なの？\n\n・発注側が「止めてくれ」「変えてくれ」「もう少し待って」を繰り返すと、遅延の責任が発注側に来る\n・「フィット＆ギャップ分析をすること」は契約書に書かれていなければ義務じゃない。契約書が全て\n・ベンダ側は「準備できました」「対応しました」を書面やメールで残しておくこと。口頭では証拠にならない\n・毎月の支払いを遅らせると、それだけで不利な立場になる\n\n炎上プロジェクトは大抵、最初の仕様と要件定義に問題がある。気づいたときはもう遅い。","one_liner":"開発を止めたのは誰か。裁判所はちゃんと調べます。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ユーザ企業"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ベンダ企業"}],"lessons":["契約書読んどけば…","「完成」って何？","金の話は最初にしろ"]},{"original_title":"東京地判平31.1.25（仮想通貨不正流出における取引所の責任）","url":"https://itlaw.hatenablog.com/entry/2019/11/04/184826","court":"東京地判","date":"平31.1.25","year":"平
