的に索引をつけて整理したものであって、個人情報に着目してこれを体系的に索引をつけて整理したものではないから、個人情報データベース等に該当しないものと解することができる。\n\nつまりこういうことです。\n\nグーグルマップは「地図の上のある地点」に情報を結びつけてるだけ。「この人の個人情報」として整理してるわけじゃない。\n\n検索した結果たまたま個人情報が出てきたとしても、それは個人情報データベースとは言えない、ということ。\n\n裁判所、めっちゃ冷静。好き。\n\n結果、本人側の請求は棄却。40万円ゲットならず。","takeaway":"で、結局なにが大事なの？\n\n・「個人情報データベース等」に当たるかどうかは、何を軸に整理されてるかが超重要。「個人情報として」体系化されてるかどうかが分かれ目\n・グーグルマップは「地図」のデータベース。個人情報のデータベースではない、というのが裁判所の見立て\n・個情法の保護が及ぶかどうかは、見た目じゃなくて構造の話。難しいけどここが急所\n・個人情報まわりで「なんか違法じゃない？」と思ったら、専門家に相談する前に「これは個人情報データベースに含まれてる？」を確認しよう\n\n個人情報の話、奥が深すぎる。知れば知るほど「えっそういうこと？」ってなる。","one_liner":"グーグルマップは地図のデータベースであって、あなたのデータベースではない。","parties":[{"role":"第三者","icon":"👥","side":"third","desc":"同意なく第三者に提供"},{"role":"本人側","icon":"👤","side":"plaintiff","desc":"法律事務所"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"Google"}],"lessons":["証拠がないと詰む"]},{"original_title":"東京地判令5.8.29（契約範囲外の作業の実施の位置づけ等）","url":"https://itlaw.hatenablog.com/entry/2025/04/29/164417","court":"東京地判","date":"令5.8.29","year":"令和5年（2023年）","topic":"契約範囲外の作業の実施の位置づけ等","categories":["契約・報酬"],"fun_headline":"【実録】契約書にサインしないまま1000万円の開発を進めた結果がヤバかった","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n1000万円の開発案件があったとして。\n\n契約書にサインしてないのに着手金を払って、開発を進めて、最終的に裁判になった話があるんですよ。\n\n聞いてる？　1000万円ですよ。サインなしで。\n\nこれ、今日の話です。","summary":"・絡んでる金額: 1000万円\n・テーマ: 契約範囲外の作業の実施の位置づけ等\n・契約とお金の話","what_happened":"主人公は発注側、化粧品・医薬品などを製造販売している会社です。\n\n発注側は開発側に在庫管理システムの開発を依頼した。\n\n最初に開発側から機密保持契約書と業務委託基本契約書のひな型が送られてきた。\n\nでも、ここが大事なとこなんで簡単に言うと、その後の契約書案のやり取りも、署名押印もされていない。\n\nにもかかわらず、開発側は見積書を出した。代金は約1000万円。\n\n発注側は見積書を受け取った翌日、発注書を送って着手金約325万円を振り込んだ。\n\n……。\n\nここで僕の話をさせてほしいんですけど。\n\n僕、引越しのときに「ちょっと手伝って」って友達に頼んだことがあって、で実際に来てもらったら荷物が全部段ボールに入ってなかったんですよ。それで気まずくなって。でもお金の話はしなかった。\n\n話を戻します。\n\n数ヶ月後、開発側はシステムのソースコードやDB設計書を納品して請求書を出した。\n\n発注側は「納品物はどこにあるの？」「請求できるわけがないでしょう？」とメールした。\n\n開発側は作業を続けた。\n\n途中で275万円は支払われたけど、システムは本番稼働に至らず、作業も終了した。\n\nで、ここからがヤバいんですけど。\n\n発注側が「契約解除する、払ったお金全部返して（約600万円）」と請求（本訴）。\n\n開発側が「発注側のせいで仕事できなくなったんだから未払い報酬約370万円払え」と反訴。\n\n互いに訴え合う事態になった。","issue":"要するに何が問題だったの？\n\n大きなポイントは「再委託禁止の合意があったかどうか」です。\n\n開発側は、受託した仕事の一部をEさんに再委託していた。\n\n発注側は「再委託禁止って契約書に書いてあったのに違反した！だから解除できる！」と主張。\n\nでも裁判所はこう言った。\n\nひな型にすぎないこの契約書案が送付されたことのみをもって直ちに発注側及び開発側がこの契約における再委託禁止を合意したと認めることはできないところ、本件において、この契約書案が送付されたこと以外の事情は見当たらず、そうすると、この契約において再委託が禁止されていたとは認められない。\n\nつまり「ひな型を送っただけでは合意とは言えない」ということ。\n\nしかも、発注側が署名押印しなかった理由の説明に合理性がなく、再委託の事実はとっくに判明していたのに、本訴提起から2年後に初めてその主張をした、と裁判所に指摘された。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。","ruling":"裁判所はこう言いました。\n\n発注側の本訴（600万円返せ）→　開発側の債務不履行が認められないので棄却。\n\n開発側の反訴（370万円払え）→　履行不能になったのは発注側の責任とは言えないので棄却。\n\n要するに、どっちも負けた。\n\n裁判所、めっちゃ冷静。好き。\n\nちなみに全然関係ないけど、「どっちも負け」って裁判、見てる側としては「うーん……」ってなるよね。でも現実ってそういうもんかもしれない。\n\nで、この件で一番大事な教訓はなにか、というと。\n\n契約書にサインしないで仕事を始めると、いざトラブルになったとき「何が合意事項か」が全部曖昧になる。\n\n合意してる範囲が証明できなければ、再委託禁止も、納期も、仕様も、全部「証拠なし」扱いになる。\n\n1000万円の案件でサインなしはさすがに……という話でした。","takeaway":"で、結局なにが大事なの？\n\n・契約書のひな型を送っただけでは合意にならない。署名・押印があって初めて「合意した」と主張できる\n・再委託禁止条項も、合意が証明できなければ意味がない。ひな型送付だけでは弱すぎる\n・「なんとなく進めてきた」案件ほど、トラブル時にどちらの言い分も通らなくなる\n・着手金を払う前に契約書にサインしよう。1000万円でも、48万円でも、同じルール\n\n契約書はラブレターより丁寧に書いたほうがいい。マジで。","one_liner":"署名押印なき合意は、トラブルの火種が「全部曖昧」になるという意味。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"製薬会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ITベンダ"}],"lessons":["契約書読んどけば…","証拠がないと詰む","「完成」って何？"]},{"original_title":"東京地判令5.8.24（転売禁止・違約金条項と民法548条の2第2項）","url":"https://itlaw.hatenablog.com/entry/2025/03/02/143300","court":"東京地判","date":"令5.8.24","year":"令和5年（2023年）","topic":"転売禁止・違約金条項と民法548条の2第2項","categories":["その他"],"fun_headline":"【転売ヤー vs 規約】違約金20万円の罠、17歳が踏んだ結果……裁判所が意外な判断を下す","hook":"みなさん、ECサイトで買い物するとき、規約読んでます？\n\n読んでないですよね。わかる。僕も読まない。\n\nでも今日の話は「規約に書いてあっても、通用しない条件がある」という話で、これちょっと知っておいたほうがいいやつです。\n\n転売禁止の商品を買って転売した人が、違約金20万円を請求された裁判の話です。\n\nどうなったと思いますか。","summary":"・絡んでる金額: 20万円\n・テーマ: 転売禁止・違約金条項と民法548条の2第2項","what_happened":"主人公は相手方、個人の方です。\n\n相手方は原告側というECサイトで陶器製の人形を12,100円で買った。\n\nそのECサイト、規約がめちゃくちゃ厳しかった。こんな感じです。\n\n第８条　転売禁止商品の購入時・転売発覚時の措置\n\n１ 　「転売禁止商品」とは、オンラインショップページ内の「転売禁止に関する規約事項」の指定記述があるものと定義する。\n\n２ 　転売とは、当社より購入した商品について、第三者に有償で譲渡する一切の行為をいう。\n\n３ 　転売禁止商品と指定する商品については、転売禁止を条件として販売するもので、転売目的による購入者への販売は一切行わない。当社と購入者との契約は、転売禁止条件付き売買契約となる。\n\n４ 　転売目的を秘して「転売禁止条件付き売買契約」により転売禁止商品を購入することは、購入者が商品を購入した時点で、詐欺罪（刑法２６４条１項）が成立することになる。\n\n５ 　転売禁止に関する規約事項に同意し購入したにもかかわらず転売行為を行った場合、当社は以下対応を行うことができ、購入者はこれに応じなければならない。\n\n（抄）転売者は違約金として、転売により得られた売上相当額又は２０万円のうちいずれか大きい方の額を支払うものとする。\n\nここで僕の話をさせてほしいんですけど。\n\n「詐欺罪が成立する」って規約に書くの、法律的にどうなんでしょうね。事実かどうかは別として、買う前にこれ読んだら怖くなりますよね。\n\n話を戻します。\n\nしかも買うまでの流れが多段構えで。購入ボタンを押すとモーダルが出て、規約ページに進んで、チェックボックスを入れて、さらに購入確認画面でもチェックして、さらにマイナンバーカードの画像を送って……。\n\n相手方はこれを全部くぐり抜けて12,100円で購入した。\n\nで、2週間後にメルカリで48,400円で出品した。\n\n原告側（ECサイト運営）はこれを発見して、自分で落札。\n\n「規約違反でしょ。違約金20万円払え。あと詐欺だから101万円の損害賠償も払え」と請求した。\n\nなお、相手方は当時17歳だったらしい。","issue":"要するに何が問題だったの？\n\n違約金20万円の条項って、有効なの？\n\nここテストに出ます。\n\n相手方の言い分は「この条項はひどすぎる。普通、転売禁止って言われても違約金が課されるなんて思わないじゃないですか。不意打ちじゃないですか」というもの。\n\n法律でいうと「定型約款で相手方が合理的に予測できない条項は、合意内容にならない」という規定がある（民法548条の2第2項）。\n\n【ちょっと解説】定型約款── ECサイトの利用規約みたいな、たくさんの人に一斉に適用するための規約。全部読んで全部理解してなくても、「同意した」と扱われるやつ。\n\n相手方は「この違約金条項は不意打ちだ。だから合意してない」と主張した。","ruling":"裁判所はこう言いました。\n\n本件売買は、民法にいう定型取引に該当するところ、本件転売禁止特約は、本来自由な処分権の行使に制約を設けるものといえ、さらに、これに違反して転売した場合、本件違約金条項により相手方に違約金の支払義務を負わせるものであるから、本件違約金条項は、民法にいう「相手方の権利を制限し、又は相手方の義務を加重する」ものといえる。このような条項で、相手方が合理的に予測することができない条項は、相手方に不意打ち的なものとなるから信義誠実の原則に反し、合意内容とならないと解される。\n\nそして、本件売買のようなインターネットを介した取引形態においては、未成年者から高齢者まで、幅広い年代層で理解度も様々な者が関与することが容易に想定されるものである。そうであれば、取引の安全の観点から、契約締結までの間に、相手方に定型約款を利用した取引であることが個別具体的にウェブ画面上で認識可能な状態にしておくことが必要と解される。特に、定型約款によって義務を加重する場合には、通常、予測が困難であるといえるから、どのような場合にどのような義務を加重するのかを、取引の当初から個別に表示するなど、その内容を容易に知り得る状況にすることが必要であり、相手方が合理的に予測できない義務内容であって容易には知りえない状況のものについては、信義誠実の原則に反し、合意内容とはならないというべきである。\n\nこの点、前提事実及び認定事実のとおり、本件では、本件商品について違約金に関する記載は本件違約金条項のみであるところ、本件商品の商品ページに記載はなく、本件違約金条項が画面上表示されるのは、本件商品の商品ページより後の別の画面である、購入に関する規約事項の画面である。また、同画面には、まず、購入方法等の４つの規約事項の記載があり、これらの規約事項の後に本件転売禁止特約として表示され、本件違約金条項は、本件転売禁止特約の５項目のうちの、最後の５項目の中のさらに４つ目の項目に一文として表示されているにすぎない。また、転売禁止内容と異なり、文字色や大きさを変えるなどの注意喚起を促すような文字形態にもなっていない。このように、本件違約金条項は、契約までの間に表示されるとはいえ、終盤の段階に至って初めて表示され、かつ、画面上、容易に認識できる状況にはない。そして、一般的に、転売禁止であるからといって、違反した場合に当然に違約金が課されるとは限らないことからすれば、転売禁止商品であることを表示したとしても、通常、違約金が課されることを予測できるとまではいえない。加えて、本件の違約金額は２０万円と購入価額を大きく上回る金額であって、このような高額の違約金の支払義務を負うことを予想することは通常困難である。\n\nこれらを踏まえると、本件違約金条項は、相手方に一方的に義務を負わせるだけではなく、合理的に予測することが困難な不意打ち的な内容といわざるを得ない。\n\nよって、原告側の主張を踏まえても、本件違約金条項は、民法に該当し、合意内容とはならない。\n\nつまりこういうことです。\n\n転売禁止なのはわかった。でも「違反したら20万円払え」というのは、商品ページには書いてなくて、規約の終盤の目立たない場所に小さく書いてあっただけ。\n\nそれは「不意打ち」だ。だから20万円の違約金条項は無効。\n\n原告側の20万円請求→棄却。101万円の損害賠償請求→もちろん棄却。\n\n裁判所、ECサイト運営者に「違約金を課したいなら、もっとわかりやすく最初から示せ」とビシッと言った。好き。","takeaway":"で、結局なにが大事なの？\n\n・違約金条項は「規約のどこかに書いてある」だけでは不十分。目立つ場所に、最初から、明確に示す必要がある\n・「転売禁止」と「転売したら違約金」は別物。転売禁止だけじゃ違約金は取れない可能性がある\n・ECサイト運営者は、ユーザーが「合理的に予測できるか」を基準に規約を設計する必要がある\n・転売する側も、規約は守りましょう。今回は違約金条項が無効になっただけで、転売行為自体が正当化されたわけじゃない\n\n規約は書いてあればいい、ではなく、ちゃんと伝わるように書かないと意味がない。","one_liner":"規約は書いてあれば有効じゃない。ちゃんと気づかせないと、合意したことにはならない。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"転売者(個人)"},{"role":"原告側","icon":"💼","side":"plaintiff","desc":"EC事業者"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["規約、読んだ？"]},{"original_title":"大阪地判令5.7.21（キャンセル・転売を制限する条項の消費者契約法10条該当性）","url":"https://itlaw.hatenablog.com/entry/2024/09/16/155818","court":"大阪地判","date":"令5.7.21","year":"令和5年（2023年）","topic":"キャンセル・転売を制限する条項の消費者契約法10条該当性","categories":["契約・報酬","利用規約・消費者"],"fun_headline":"【USJ】チケットのキャンセル禁止・転売禁止条項、消費者団体が「無効じゃないか」と裁判に持ち込んだ話","hook":"みなさん、USJのチケット買ったことありますか。\n\n僕はあります。ハリー・ポッターのエリアが混みすぎて死ぬかと思った。\n\n話は全然関係ないんですけど、今日はUSJのチケット規約が裁判になった話です。\n\nキャンセルできない。転売もできない。これって消費者にとってひどすぎない？ということで訴えた団体がいて、どうなったかという話。","summary":"・テーマ: キャンセル・転売を制限する条項の消費者契約法10条該当性\n・契約とお金の話","what_happened":"主人公は発注側、消費者契約法に定める「適格消費者団体」です。\n\n適格消費者団体って何かというと、消費者の利益を守るために、事業者に差止請求ができると法律で認められた団体のこと。要するに「おかしい規約を使うのをやめさせろ」と訴えることができる、消費者側の番人みたいな存在です。\n\nで、発注側が目をつけたのがUSJのチケット規約。\n\n大きく2つの条項が問題にされました。\n\n①キャンセル禁止条項：「原則として購入後のキャンセルはできません」\n②転売禁止条項：「チケットの転売は固く禁止」\n\nここで僕の話をさせてほしいんですけど。\n\n僕、コンサートのチケットを取ったあとに行けなくなったことがあって、友達に譲ったんですよ。あれって厳密にはアウトなやつだったのかな……。いや、お金もらってないから違うか。\n\n話を戻します。\n\nUSJの購入フローはこんな感じで多段構えになってました。\n\n- チケットを探す・購入する画面の中央付近に「転売は固く禁止！」の表示\n- カートに入れる画面でキャンセル不可・転売禁止の確認チェックボックス。チェックしないと次へ進めない\n- 購入者情報画面で利用規約の全文を表示。スクロールして全部読んでチェックしないと次へ進めない\n- 注文確認画面でも再度チェックが必要\n\nで、ここからがヤバいんですけど、発注側が「この条項おかしいんじゃないか」という書面をUSJに送ったら、USJが「法令上、消費者に解除権等が認められる場合はキャンセルに応じる」と回答。\n\nその後、条項に「但し、法令上の解除・無効事由等がお客様に認められる場合はこの限りではありません」という文言が追加された。\n\nこれ、発注側の指摘を受けて修正したわけです。でも訴訟は提起された。\n\nなお、東京ディズニーリゾート、レゴランド、ハウステンボスでも、チケットのキャンセル・転売が制限されています。つまりこの裁判の結果、業界全体に影響が出る可能性があった。","issue":"要するに何が問題だったの？\n\nキャンセル禁止条項と転売禁止条項が、消費者契約法10条に違反して無効にならないか、ということです。\n\nここテストに出ます。\n\n消費者契約法10条はこういう規定です。\n\n消費者契約法\n\n消費者の不作為をもって当該消費者が新たな消費者契約の申込み又はその承諾の意思表示をしたものとみなす条項その他の法令中の公の秩序に関しない規定の適用による場合に比して消費者の権利を制限し又は消費者の義務を加重する消費者契約の条項であって、民法第一条第二項に規定する基本原則に反して消費者の利益を一方的に害するものは、無効とする。\n\n要するに「消費者の権利を制限する条項で、かつ信義則に反して一方的に消費者を不利にするもの」は無効、ということ。\n\n2つの要件に分解できます。\n\n前段：消費者の権利を制限または義務を加重している条項か\n後段：信義則に反して消費者の利益を一方的に害するか\n\nあと、キャンセル禁止条項については消費者契約法9条1号（平均的損害を超える違約金は無効）も問題になりました。\n\n同法9条\n\n次の各号に掲げる消費者契約の条項は、当該各号に定める部分について、無効とする。\n\n一　当該消費者契約の解除に伴う損害賠償の額を予定し、又は違約金を定める条項であって、これらを合算した額が、当該条項において設定された解除の事由、時期等の区分に応じ、当該消費者契約と同種の消費者契約の解除に伴い当該事業者に生ずべき平均的な損害の額を超えるもの当該超える部分\n\n二　以下略","ruling":"さあ、裁判所の答えです。\n\nこの裁判、判決の詳細は原判決を参照ですが、裁判所の整理の仕方が重要でした。\n\nキャンセル禁止条項と転売禁止条項、それぞれについて消費者契約法の各条項への該当性を丁寧に検討しました。\n\nチケット業界全体のビジネスモデルにとって意味のある判断が示された判決です。\n\n裁判所、めっちゃ冷静。好き。\n\nテーマパークが「キャンセルできない、転売できない」と規定することには、それなりのビジネス上の理由があります。人気商品の転売問題、席の確保、収益安定など。\n\nでも消費者保護法制との兼ね合いで「どこまで制限できるか」は常に問題になる。この判決はそのひとつの答えです。\n\nちなみに全然関係ないけど、テーマパークのチケット問題って、NFTでどうにかできないのかな、といつも思う。転売すると元の販売者にも収益が入る仕組みとか。まあ余談ですが。","takeaway":"で、結局なにが大事なの？\n\n・キャンセル禁止・転売禁止条項は「書いてあれば何でも有効」ではなく、消費者契約法による制限がある\n・消費者の権利を制限する条項は「信義則に反して一方的に不利か」という観点で審査される\n・適格消費者団体が動けば、個別の消費者が訴えなくても差止請求ができる\n・企業が規約を作るときは「消費者にとって理不尽すぎないか」という視点が必須\n\n規約は作ったら終わりじゃない。法律の専門家に定期的に見直してもらおう。","one_liner":"「規約に書いてあるから有効」は、消費者契約法の前では通用しないことがある。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"消費者団体"},{"role":"開発側","icon":"💻","side":"defendant","desc":"USJ運営会社"}],"lessons":["規約、読んだ？"]},{"original_title":"東京地判令5.7.14（ベンダからユーザへのハラスメントと検査の協力）","url":"https://itlaw.hatenablog.com/entry/2024/11/29/214806","court":"東京地判","date":"令5.7.14","year":"令和5年（2023年）","topic":"ベンダからユーザへのハラスメントと検査の協力","categories":["PM・開発管理"],"fun_headline":"【実録】「良いお客様だと思われていないのは、ほぼ確実」とメールしたベンダに裁判所が鉄槌を下した話","hook":"これヤバいから。\n\nシステム開発を発注して、検査がうまくいかなくて、ベンダにZoom説明を頼んだら断られて、そのうえ「あなたは良いお客様だと思われていないのはほぼ確実です」ってメールが来た事件があるんですよ。\n\nどういうこと？\n\n意味がわからない。でも実際にあった話で、裁判になったんです。","summary":"・絡んでる金額: 48万円\n・テーマ: ベンダからユーザへのハラスメントと検査の協力\n・プロジェクト管理の問題","what_happened":"主人公は発注側、発注者です。\n\n開発側（ベンダ）に本人確認システムの開発を48万円（税込）で依頼した。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。レストランで「カレーください」と注文するようなもので、カレーが出てこなかったら契約違反。\n\n開発側からの連絡で「検査できる状態になったので触ってほしい」と言われ、発注側が検査を開始。\n\nしかし。\n\nログイン段階から不具合が多発した。\n\n発注側は丁寧に課題管理表を作って、画面コピーもまとめて開発側に送った。\n\nでもなかなか進まない。\n\nそこで発注側は「Zoomで画面共有しながら説明してほしい」と頼んだ。\n\n開発側の答えは「文章で説明してほしい」。\n\nここで僕の話をさせてほしいんですけど。\n\n画面共有でのサポートって、今どき当たり前じゃないですか。僕、家族のパソコンのトラブルをZoomで解決したことあって、その便利さを知ってるんですよ。「文章で」って言われたら絶対に解決しない問題ってありますよね。\n\n話を戻します。\n\nその後、決済システム会社ｃ社とのやり取りでも揉めた。\n\n開発側は発注側に対して「（自分を）いじめる意図・迷惑をかける意図・話をそらして業務を継続しないことを目的にメッセージを送られていると感じています。これ以上不快な思いをさせたり、傷つける連絡はやめて下さい」とメールを送った。\n\nで、ここからがヤバいんですけど。\n\nその後も開発側は発注側に対して「ｃ社からのお客様への評価は良くないと思われます」「良いお客様だと思われていないのは、ほぼ確実だと思われます」などとメールを送り続けた。\n\n発注側の気持ち、わかる。めっちゃわかる。つらい。\n\n発注側は「精神的苦痛があった」として慰謝料10万円を求めた。\n\n開発側は「仕事したんだから48万円払え」と反論した。","issue":"で、裁判所に聞きたいことはこういうこと。\n\n開発側（ベンダ）の行動って、不法行為になるの？\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\n大きく2つの問題がありました。\n\n①Zoomでの説明を断ったこと：請負の場合、発注者が検査できるよう協力する義務がベンダにある。それを拒否したのは義務違反か\n②「良いお客様だと思われていないのはほぼ確実」というメールを送り続けたこと：これはハラスメントにあたるか","ruling":"裁判所はこう言いました。\n\n発注側が述べる初期設定の段階から先に進むことができず、多くの時間を費やすことになった原因が、このシステムにあるのか、その使用方法等にあるのかは、必ずしも明らかではない。しかしながら、上記のとおり、発注側においては、その不具合の状況につき、画像を用いて具体的に伝えており、それでも伝わらないため、第三者ｏｏｍを利用した説明をしたいと希望していると認められる。この点、仮に、上記原因が発注側の使用方法等にあるとしても、この契約のように、システムの専門家ではない一般人が利用することを想定しているシステムの開発業務であって、納品後には注文者による検査が予定されている以上、注文者において同検査ができるよう協力することは、請負人に求められている仕事の一部であって、応じる義務があると解すべきであるから、第三者ｏｏｍにより説明したいという発注側の要望に応じられない理由がないにもかかわらず（通常行わないというのは理由にならないし、忙しいというのも日時を固定した申入れでない以上、理由にならない。）、対案を示したりすることなく、拒絶することは上記義務に違反するものであるといえる（中略）。\n\n裁判所、「通常行わないは理由にならないし、忙しいも理由にならない」ってはっきり言ってる。好き。\n\nさらに、\n\nまた、そのような中で、発注側に対し、決済システム会社と発注側との関係性を疑うような内容のメールを送り、発注側がそのようなメールを送らないでほしいと依頼した後に、「良いお客様だと思われていないのは、ほぼ確実だと思われます。」とか、こちらもビジネスとしてやっているなどというメールを送り続けたことは、そのようなメールを見た発注側が精神的に苦痛を覚えることを認識しながら、あえて行った行為であると評価することができ、これら一連の行為は、開発側の発注側に対する不法行為を構成するといえる。\n\nつまりこういうことです。\n\n「やめてくれ」と言われた後も送り続けたのは「精神的苦痛を覚えることを認識しながらあえて行った」。これは不法行為だ、という結論。\n\n慰謝料3万円を認定。開発側の請負代金48万円の請求は棄却された。\n\nべンダ側、Zoom断って、傷つくメール送り続けて、報酬も取れなかった。","takeaway":"で、結局なにが大事なの？\n\n・請負契約では「検査への協力」もベンダの仕事の一部。Zoomでの説明を断るのは義務違反になりうる\n・「通常行わない」「忙しい」は理由にならない、と裁判所がはっきり言った。覚えておこう\n・「やめてくれ」と言われた後も傷つく内容を送り続けると不法行為になる。コミュニケーションは要注意\n・ベンダもユーザーも、お互いにメールの記録が証拠になる。送る前に一呼吸置こう\n\n検査に協力しないのも、傷つくメールを送るのも、ベンダ側のリスク。両方裁判所に認定されてしまった。","one_liner":"「やめてくれ」と言われた後も送り続けたら、それは不法行為。ビジネスでも同じ。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"発注者"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ベンダ"}],"lessons":["証拠がないと詰む","「完成」って何？","金の話は最初にしろ"]},{"original_title":"東京地判令5.6.19（転職活動を理由とした準委任契約解約の正当性）","url":"https://itlaw.hatenablog.com/entry/2025/11/22/144145","court":"東京地判","date":"令5.6.19","year":"令和5年（2023年）","topic":"転職活動を理由とした準委任契約解約の正当性","categories":["契約・報酬"],"fun_headline":"【実話】客先で転職活動したら契約ぶった切られた話、165万円が消えた","hook":"仕事中に、取引先のPCで、その取引先の偉い人に「採用してください」ってチャットを送った人がいるんですよ。\n\n……え？　マジで？\n\nマジです。しかもそのせいで契約が切られて、雇った会社が165万円の報酬を請求できなくなったんです。\n\n今日はその話をします。ちょっと待って驚くから。","summary":"・絡んでる金額: 165万円\n・テーマ: 転職活動を理由とした準委任契約解約の正当性\n・契約とお金の話","what_happened":"順番に整理しますね。\n\n原告のX（ベンダ）が、被告のY（中間業者）から、パッケージソフト導入案件の一部を受託しました。\n\n期間は2021年5月〜6月の2カ月。1カ月165万円。技術者1人を提供するという契約です。\n\n開発側は大手コンサルのA社から仕事をもらってて、原告はその下請けという構造です。\n\n原告はその仕事をこなすために、技術者1人と有期雇用契約を結んでアサインしました。\n\nで、ここからがヤバいんですけど。\n\nその技術者さん、5月21日の勤務時間中に、A社から貸与されたPCで、A社のえらい人（マネージングディレクターと人事担当）に対して、Teamsで「採用してください」的なチャットを送ったんですよ。\n\n……え？　え？\n\nここで僕の話をさせてほしいんですけど、僕も昔、仕事中にTwitterを開いて上司に見つかりそうになったことがあって、あの時の「やばいやばいやばい」ってなる感覚、今でも覚えてるんですけど、それの比じゃないですよこれは。取引先の偉い人に「転職させてください」は、さすがにレベルが違う。話を戻します。\n\nA社はこのチャットを問題視して、開発側に「即刻解約しろ」と連絡。\n開発側は原告に対して5月28日付で契約終了を通知しました。\n\n5月分の報酬は開発側が払った。でも原告は「6月分も払え（税込181万5000円）」と請求したわけです。\n\n理由は「開発側が一方的に中断させたから」。つまり「お前のせいで仕事できなくなったんだから弁償しろ」ってこと。\n\n【ちょっと解説】準委任契約── 仕事の「完成」ではなく「業務の遂行」を約束する契約。請負と違って成果物の完成を保証する必要がない。SES（システムエンジニアリングサービス）なんかがこれにあたることが多い。","issue":"要するに何が問題だったの？\n\n技術者がやらかしたのは原告のせい？　それとも開発側のせい？\n\nもう少しちゃんと言うと、こうなります。\n\n「原告が仕事を続けられなくなったのは、開発側の責任（帰責事由）があるから？」\n\nここテストに出ます。\n\n開発側の言い分は「技術者がA社の情報を転職活動に使った。これは基本契約の即時解除事由に該当する」というもの。要するに「お前のとこの技術者がやらかしたんだから、こっちに責任はない」ってことです。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。お互い原状回復（もらったものを返す）義務が発生するのが原則。でも解除できるかどうかには要件がある。","ruling":"で、裁判所はどう判断したか。\n\n裁判所は開発側の責任を否定しました。つまり「これは原告のせい（というか技術者のせい）だから開発側は払わなくていい」という判断です。\n\n裁判所、めっちゃ冷静。好き。\n\n具体的にはこう言っています。\n\n本件技術者のこのような行為（引用者注：貸与ＰＣで転職活動のチャットをしたこと）は、同じＡ社内といっても、本件個別契約の業務の遂行とは関係のない者に対し、本件個別契約の顧客の名称や担当業務といった業務上知り得た情報を漏洩するとともに、許可なく職務以外の目的で委託先の物品等を使用し、職務に関連して自己の利益を図るなどの職務専念義務に違反する行為というべきである。加えて、本件個別契約の業務の内容は、最終的な顧客の機密情報に該当する可能性があり、本件基本契約上も、秘密情報の取扱いについて厳しい規定が定められていることにも照らすと、本件技術者が本件チャットをしたことにより、Ａ社が本件技術者をこれ以上業務に従事すべきではないと判断し、本件元委託契約を即刻解約しようとすることは、決して不合理なことではなく、むしろ、最終的な顧客の利益やＡ社の信用を守るためには、当然のことというべきである。このような状況下においては、開発側として、Ａ社に対し、本件個別契約の継続を可能とするために講じうる手段が具体的に存在したということはできない。\n\nつまりこういうことです。「技術者が仕事中に取引先のPCで転職活動したんだから、A社が即解約したのは当然。開発側にはどうしようもなかった。開発側のせいじゃない。」\n\n裁判所がわりと感情を排して「まあ当然やな」って言ってるのが、なんか逆にリアルで怖い。\n\nよって、原告の請求はすべて棄却。6月分165万円は受け取れず。\n\n原告の気持ち、想像したくない。つらい。","takeaway":"で、結局なにが大事なの？\n\n・技術者の行為はベンダの責任になる。誰を送り込むかは超重要。「まさかこんなことをするとは」は言い訳にならない\n・「一方的に切られた」と主張しても、原因が自分側にあれば報酬請求は通らない。弁償してもらうには、相手のせいであることを証明しないといけない\n・客先でやっちゃいけないことリスト、技術者に共有しよう。競合他社への営業、SNS投稿、私的なPC使用……今すぐ確認を\n・転職活動は、定時後に、自分のPCで、こっそりやるものです（当たり前）\n\n最後に一言。この技術者さん、その後転職できたんでしょうか。心配なような、心配じゃないような。","one_liner":"客先のPCで転職活動は、人生の難易度を最大にする選択肢。","parties":[{"role":"開発側","icon":"💻","side":"defendant","desc":"コンサル会社"},{"role":"下請業者","icon":"🔧","side":"third","desc":""},{"role":"関連会社","icon":"🏢","side":"third","desc":""}],"lessons":["契約書読んどけば…"]},{"original_title":"東京地判令5.5.31（業務委託契約と知的財産譲渡の合意）","url":"https://itlaw.hatenablog.com/entry/2023/06/14/214128","court":"東京地判","date":"令5.5.31","year":"令和5年（2023年）","topic":"業務委託契約と知的財産譲渡の合意","categories":["契約・報酬"],"fun_headline":"【悲報】フリーランスが作ったゲーム動画、全部会社のものだった件","hook":"みなさん、フリーランスで仕事してる人に聞きます。\n\n自分が作ったもの、ちゃんと「自分のもの」ですか？\n\n……え、そりゃそうだろって思ったそこのあなた。\n\nちょっと待ってください。今日の判例、それを根底からひっくり返してくるんですよ。\n\n契約書の中身によっては、あなたが作ったものが全部相手のものになってる可能性があります。ヤバい話です。","summary":"・テーマ: 業務委託契約と知的財産譲渡の合意\n・契約とお金の話","what_happened":"時系列で整理しますね。\n\n平成14年（2002年）ごろ、発注側は開発側という会社に契約社員として入社して、ゲームソフトの開発に従事していました。\n\nで、平成21年（2009年）に開発側を退職してフリーランスになり、開発側と業務委託契約を締結しました。\n\nここで大事なのが、その契約書の中身です。ちょっと後で詳しく触れます。\n\n発注側はフリーランスとして開発側の委託を受けて、ゲームソフトの開発に従事。その中で「本件各動画」というゲーム動画を制作しました。\n\nちなみに全然関係ないんですけど、「ゲームの動画を作る仕事」って響きだけ聞くとすごく楽しそうじゃないですか。実態がどうかは置いといて。話を戻します。\n\n平成22年（2010年）12月、業務委託契約は合意で解約。\n\nその後、開発側は本件ソフトを開発して納入。平成24年（2012年）12月には販売開始。\n\n発注側は「本件各動画の著作権は自分にある」と主張して、開発側が無断で動画を使って販売したのは著作権侵害だとして、損害賠償を請求しました。\n\n【ちょっと解説】著作権── 自分が作った表現物（文章・絵・音楽・動画など）を守る権利。「作った人に自動でつく」のが特徴。特許みたいに申請不要。ただし、契約で別の人に譲渡することもできる。\n\nさて、契約書には何が書いてあったか。以下がその核心部分です。\n\n第５条（納入）\n(1)乙は、甲からそのつど個別に発行される発注書の定める納期にこの業務の成果物を甲の指定する場所に納入する。\n\n第７条（著作権及び著作者人格権）\n(1)成果物（成果物がコンピューターソフトのプログラムである場合にはソースコード及びオブジェクトコードを含む）並びにその関連資料とテスト結果報告書の著作権その他一切の知的財産権及び成果物の所有権は、第５条に規定する成果物の引渡完了をもって乙から甲へ移転する。\n(2)甲は、譲り受けた著作権その他の権利に基づき成果物の複製、販売、ライセンス、他機種への移植その他成果物に関する一切の利用を独占的になし得る。\n(3)乙は、成果物の著作者人格権を甲及び甲の指定する第三者に対する関係で放棄し、甲によるこのプログラムの著作権の行使及び甲の著作権に基づく第三者による権利の行使に対し、著作者人格権を含む一切の権利を主張しない。\n\n……これ、すごい条文ですよ。\n\nひとことで言うと「納品したら著作権は全部開発側のものになる。著作者人格権も放棄しろ」ってことです。\n\n「それって普通じゃないの？」って思う人もいるかもしれないけど、フリーランスとして仕事した成果物の権利が全部相手に移るって、かなり強い条件なんですよ。","issue":"要するに何が問題だったの？\n\n「動画を作ったのはXだけど、著作権は開発側に移ったの？移ってないの？」\n\nX側の言い分は「この動画はこの業務委託契約とは別の仕事として作ったものだ」「納品してないから権利は移ってない」というもの。\n\n要するに「契約の適用外だからオレのもの」ってことです。\n\nここテストに出ます。「納品」があったかどうかが争点です。","ruling":"いよいよ裁判所の出番です。\n\n裁判所、発注側の主張を全部退けました。\n\n上記第５条の「納入」の対象物は「成果物（…）並びにその関連資料」と規定され、この業務委託契約において、その対象物の意義を限定的に解釈すべきことをうかがわせる規定もないことから、受託した業務の完成、未完成に関わらず、発注側が同契約に基づいて発注を受けて製作したもの全てを意味すると解するのが合理的である。そうすると、製作途中のデータや資料についても同契約第７条の「成果物（…）並びにその関連資料」に含まれると解するのが相当である。\n\nまた、この業務委託契約第５条においては、「成果物を甲の指定する場所に納入する。」とのみ規定され、具体的な納入場所は規定されていないところ、弁論の全趣旨によれば、開発側においては、成果物の納入場所はデータ共有サーバと指定されていたものの、未完成の成果物を開発側が貸与したパソコンに収納したままの状態でパソコンの返却を受けることも許容されていたと認められるから、成果物に係るデータをデータ共有サーバにアップロード又はパソコン内に格納して同パソコンを開発側に引き渡すことも、同契約第７条の「第５条に規定する成果物の引渡」に含まれると解するのが相当である。\n\nそして、発注側の主張によれば、発注側は、この業務委託契約を解消する際、本件各動画又はその一部のデータを含む、自身が作業をして製作したデータ等を、自身が使用していたパソコン内に格納して、同パソコンを開発側に引き渡し、又は開発スタッフの作業用のデータ共有サーバに保管したというのであるから、本件各動画については、発注側から開発側に対する、「第５条に規定する成果物の引渡」がされたと解するのが相当である。\n\nつまり「パソコンを返した時点でもう納品扱い」ってことです。意味がわかります？\n\nこれって要するに「PCを返したら、中のデータも一緒に渡したことになるから著作権も移転した」ってことですよね。\n\n怖すぎる。\n\n発注側の請求はすべて棄却。","takeaway":"で、結局なにが大事なの？\n\n・契約書の著作権条項は必ず読め。「納品したら権利は全部相手のもの」という条文、意外と普通に存在する\n・「納品」の定義に注意。データを共有サーバに置く、PCを返す……これ全部「納品」になりうる\n・「この仕事はこの契約と別」と言いたいなら、それを書面で残せ。口頭ではダメ。絶対ダメ\n・フリーランスになる前に、業務委託契約書を弁護士に1回見てもらっておくと、本当に後悔しなくて済む\n\n自分で作ったものが気づいたら相手のものになってた話、これリアルに起きてるんですよ。","one_liner":"作ったものが自分のものかどうかは、契約書を読むまでわからない。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"フリーランスSE"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ゲーム会社"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["契約書読んどけば…","「完成」って何？"]},{"original_title":"東京地判令5.4.20（プロジェクト担当者の契約締結権限）","url":"https://itlaw.hatenablog.com/entry/2024/11/30/134953","court":"東京地判","date":"令5.4.20","year":"令和5年（2023年）","topic":"プロジェクト担当者の契約締結権限","categories":["契約・報酬","PM・開発管理"],"fun_headline":"「その担当者に権限ないから払わん」→裁判所「いや払え」5億円案件の顛末","hook":"突然ですが聞いていいですか。\n\n契約書にハンコが押してあったとして、その担当者に「本当に契約を結ぶ権限があったかどうか」って確認しますか？\n\n……普通しないですよね。\n\nでもこれ、相手方に「あの人に権限なかったから、この契約は無効です」って言われたら、どうなるんでしょう。\n\n今日はその話です。約1億5000万円の案件で実際に起きたやつ。","summary":"・絡んでる金額: 5億円\n・テーマ: プロジェクト担当者の契約締結権限\n・契約とお金の話","what_happened":"ちょっと長いけど付き合ってください。大事な話です。\n\n開発側という会社が、基幹業務用サーバの更改を企画して、発注側というベンダに相談しました。\n\nプロジェクト総額は約1億5000万円。でかい。\n\n2021年7〜9月にかけて、5件の契約書・注文書が交わされました。\n\nここまでは普通の話なんですけど、ここからがヤバいんです。\n\n開発側が言い出したことがあって。「あの契約書に押してあるハンコ、偽造されたものだ」「担当者のDは、うちの社内ルール上、契約を結ぶ権限を持っていなかった」「だからその契約は無効」\n\nそう、払いたくないから「契約そのものが無効」って言い始めたわけですよ。\n\n僕がXだったらこの時点で泣きながら弁護士に電話します。\n\nちなみに全然関係ないんですけど、「無効」って言葉、なんか最強感ありますよね。「無効！」って言えばなんでもなかったことになりそうな。でも法律的にはそんな簡単な話じゃなくて、ちゃんと要件があるんですよ。話を戻します。\n\nしかも、開発側はシステム担当のEさんを「上長の承認なくシステム入替に関与した」という理由で懲戒解雇までしていました。\n\n【ちょっと解説】無権代理── 代理権を持っていない人が「代理人として」契約を結ぶこと。原則として本人には効力が生じない。ただし「そんな権限ないの知らなかったよ」という善意の相手方は保護されることがある。","issue":"要するに何が問題だったの？\n\n「Dに契約を結ぶ権限があったかどうか」\n\nこれが全てです。\n\n開発側の言い分：「社内の職務権限規程上、この金額の契約は管理本部長が決裁しないといけない。Dにはその権限がなかった。だから契約は無効。払わなくていい。」\n\n発注側の言い分：「Dがプロジェクトオーナーとして仕切っていた。権限があると信じて契約した。」\n\nここテストに出ます。「担当者に権限があったか」と「権限がないと知っていたか」は別の話です。","ruling":"裁判所はどう判断したか。\n\n裁判所は「この契約は有効に成立した」という結論を出しました。\n\n発注側がこのプロジェクトについて開発側側に説明等をした際には、開発側の取締役らが出席しており、このプロジェクトの契約額も、全体で１億４９８０万円という高額なものであり、開発側の取締役会の議題に挙げられるなどして開発側元代表者が認識していて然るべきものである。\n\n（中略）\n\n開発側は、この契約書等と同じ開発側名義の印章により押印がされた注文書を用いて、発注側との間で複数回契約を締結し、その決済をしており、開発側杉並事業所の従業員に発注側との間の取引の権限を与えていたものと認められる。そして、前記認定事実(2)のとおり、発注側がこのプロジェクトについて開発側側に説明等をした際に、開発側の取締役らが出席していたことなどからすれば、開発側において、このプロジェクトでプロジェクトオーナーに就任したＤに対し、この契約に関する処理を委任していたものと認められる（この契約書等は、その委任された権限の範囲内で作成されたものと認められ、成立の真正が認められる。）。\n\nつまり「えらい人たちが説明会に来てたし、過去にも同じハンコで契約してたし、実質的にDに任せてたんでしょ」ってこと。\n\n開発側が「社内ルール上、権限なかった」と主張したことに対しては、裁判所はこう言いました。\n\nそのため、上記職務権限規程及び権限行使基準表の正確性には疑問があり、その記載どおりこの契約の締結について管理本部長の決裁が必要であったとは認められない。また、仮に管理本部長が決定権限を有するとしても、そのような制限について発注側が知っていたことをうかがわせる事情はなく（この契約書等に旧本店所在地が記載されていたことは、発注側において、開発側の担当者の権限を疑うべき事情とはいえない。）、むしろ発注側はこの契約締結前に開発側の取締役と面会しており、Ｄの権限を疑わせる事情はないことに照らせば、発注側は善意の第三者であると認められる。\n\n「発注側は権限があると信じて当然だった。善意の第三者として保護される。」\n\n裁判所、ものすごく冷静に「お前ら（Y）の内部ルールの問題を発注側に押しつけるな」って言ってるわけですよ。好き。\n\n結果、報酬の全額が認容されました。","takeaway":"で、結局なにが大事なの？\n\n・「権限がないから無効」は通りにくい。過去に同じやりとりがあったり、えらい人が関与していたりすると、実質的に権限があったとみなされる\n・ベンダ側は、取締役や偉い人が関与していた証拠（議事録・メール・出席記録）を残しておこう。「えらい人も知ってたじゃないか」は強い\n・「うちの社内ルールに違反した」は外部の人には関係ない。内部の事情を相手に押しつけて契約無効にはできない\n・大型案件ほど「誰が決裁権者か」を最初に確認しておくと、後でこういうもめ方をしない\n\n社内ルールを外部への言い訳に使おうとしたY、裁判所に完全論破された案件でした。","one_liner":"「権限なかったから無効」は、社内でだけ通じる言い訳。外に持ち出すな。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ITベンダ"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ユーザ企業"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["契約書読んどけば…","証拠がないと詰む"]},{"original_title":"知財高判令5.4.13（スクリーンショットと引用成否（控訴審））","url":"https://itlaw.hatenablog.com/entry/2023/05/02/144941","court":"知財高判","date":"令5.4.13","year":"令和5年（2023年）","topic":"スクリーンショットと引用成否（控訴審）","categories":["著作権"],"fun_headline":"【朗報】ツイートのスクショ投稿、著作権侵害じゃないかもしれない件","hook":"Twitter（今は権利主張側ですけど）で、誰かのツイートをスクショして「これ見てよ」って投稿したことありますよね？\n\n……え、ない？　うそ。めっちゃある人のほうが多いと思うんだけど。\n\nあれって著作権侵害になるの？ならないの？って話、ずっとグレーだったんですよ。\n\n今日は、それにある程度の答えを出した判例の話をします。","summary":"・テーマ: スクリーンショットと引用成否（控訴審）\n・著作権がらみの争い","what_happened":"まず背景を整理します。\n\nこれは1審（東京地判令3.12.10）の控訴審です。\n\n誰かが他人のツイートをスクリーンショットして投稿した。\n元のツイート主が「著作権侵害だ！投稿者を特定させろ！」とプロバイダに発信者情報開示請求をした。\n\nここで大事なポイントがあって、被告はその投稿者じゃなくて、プロバイダ（インターネットの接続業者）なんですよ。\n\n【ちょっと解説】発信者情報開示── ネット上で権利を侵害された人が、プロバイダに「投稿者が誰か教えて」と請求できる制度。要するに「犯人の素性を教えろ」制度。教えてもらったあとに本人を訴える流れ。\n\n1審では「スクショは著作権侵害になる」「Twitterの規約違反だし引用として認めない」という判断が出て、プロバイダに発信者情報を開示するよう命じました。\n\nプロバイダが「えっ、そんな無茶な」とブチ切れて控訴したのが今回の事件です。\n\nここで僕の話をさせてほしいんですけど、プロバイダって「板挟み」の象徴みたいな存在ですよね。投稿した人でもなく、被害を受けた人でもなく、ただ「通信を中継した会社」として訴えられる。なんかかわいそう。僕がプロバイダだったら泣きながら弁護士を呼ぶ。話を戻します。\n\nちなみに、この控訴審と前後して、別の事件（知財高判令4.11.2）では「プロフィール画像を含むスクショは適法な引用」という判断も出ていました。流れとしてはスクショに対してゆるい方向に動いてた時期ですね。","issue":"要するに何が問題だったの？\n\n「他人のツイートをスクショして投稿するのは、著作権法上の『引用』として認められるか？」\n\nこれだけです。\n\n【ちょっと解説】引用── 他人が作ったもの（著作物）を自分の文章や動画の中に使うこと。「出所の明示」「引用部分と本文が明確に区分されている」「引用が必要な理由がある」などの要件を満たせば、許可なしでOK。要するに「ちゃんと使えばセーフ」。\n\nTwitterの規約がどうあれ、著作権法の「引用」に当たるかどうかは、著作権法の基準で判断される。そこが争点です。","ruling":"裁判所の答えです。\n\n1審の判断をひっくり返しました。「スクショは引用になり得る。開示請求には理由がない。」\n\nまず、Twitterの規約について。\n\nそもそも本件規約は本来的にはツイッター社とユーザーとの間の約定であって、その内容が直ちに著作権法上の引用に当たるか否かの判断において検討されるべき公正な慣行の内容となるものではない。また、他のツイートのスクリーンショットを添付してツイートする行為が本件規約違反に当たることも認めるに足りない。\n\nつまり「Twitterの規約は著作権法の話とは別の話。規約違反かどうかで引用の成否は決まらない。」\n\nこれ、めっちゃ重要です。\n\nそしてスクショの必要性についてこう言いました。引用リツイートだと元ツイートが削除されたら見えなくなるけど、スクショなら消えない。だからスクショには批評手段としての正当な理由がある、と。\n\nこれって要するに「証拠を残すためにスクショするのは理にかなってる」ってことですよ。\n\n裁判所の結論は。\n\n以上の点を考慮すると、本件各投稿における原告各投稿のスクリーンショットの添付は、いずれも著作権法の引用に当たるか、又は引用に当たる可能性があり、原告各投稿に係る相手方の著作権を侵害することが明らかであると認めるに十分とはいえないというべきである。\n\n「明らかに侵害とは言えないから、発信者情報を開示するほどじゃない。」という判断。\n\n裁判所「スクショでの批評は、普通にやられてることだし、引用として認め得る」ってサラッと言ってる。好き。\n\nプロバイダ、控訴して正解でした。","takeaway":"で、結局なにが大事なの？\n\n・Twitterの規約と著作権法は別の話。規約違反でも著作権侵害にならないことがあるし、その逆もある\n・批評・解説のためのスクショは引用として認められやすい。「これどう思う？」とスクショを貼ること自体は、条件次第でセーフ\n・引用が適法かどうかの条件は4つ：①引用部分がはっきりわかる、②自分のコンテンツがメインで引用はサブ、③必然性がある、④出所を示す。この4つを押さえよう\n・悪意でスクショしてるのか、批評でスクショしてるのかは、文脈で変わる。「引用だから何でもOK」ではない\n\nスクショの扱い、これからも判例が積み上がっていく分野です。","one_liner":"Twitterの規約と著作権法は別の法律。混同するな。","parties":[{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"ツイート投稿者"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"プロバイダ"}],"lessons":["著作権は万能じゃない"]},{"original_title":"知財高判令5.3.30（YouTube動画の引用成否）","url":"https://itlaw.hatenablog.com/entry/2023/11/19/162625","court":"知財高判","date":"令5.3.30","year":"令和5年（2023年）","topic":"YouTube動画の引用成否","categories":["著作権","ネット・コンテンツ"],"fun_headline":"逮捕動画をYouTubeに上げたら名誉毀損→批判動画を作ったら著作権侵害を主張された→どっちもどっちな裁判の話","hook":"今日の話、登場人物がどっちも「まあ……そうなるよね」って感じで、なんとも言えない気持ちになる案件です。\n\nある人が逮捕された。その逮捕の瞬間をYouTuberが撮影して動画にした。逮捕された人が「名誉毀損だ！」と訴えた。その訴訟の中で逮捕された人も批判動画を作った。今度はYouTuberが「著作権侵害だ！」と反訴した。\n\nもうね、「全員なんか悪いことしてない？」ってなるやつです。\n\n法律の話として、引用の成否がテーマです。","summary":"・絡んでる金額: 30万円\n・テーマ: YouTube動画の引用成否\n・著作権がらみの争い","what_happened":"順番に整理します。\n\n利用側というYouTuberが、【Ａ】というチャンネルで動画を投稿していました。そのチャンネルに「不当逮捕の瞬間！警察官の横暴、職権乱用、誤認逮捕か！」という動画をアップしました。\n\nこれ、権利主張側という人が警察官に逮捕される瞬間を撮影したものです。\n\n権利主張側が「これは名誉毀損だ、肖像権・プライバシー権の侵害だ」として利用側に損害賠償を請求しました（本訴）。\n\n……ここまではまあわかる展開です。\n\nで、ここからがヤバいんですけど。\n\n権利主張側は自分でもYouTubeチャンネルを開設して、「利用側にプライバシーを侵害された」と批判する動画（原告動画１）を投稿したんです。\n\nその動画の中で、利用側の逮捕動画の一部を使ったんですよ。\n\nすると今度は利用側が「著作権侵害だ！」と反訴してきた。\n\nここで僕の話をさせてほしいんですけど、これ完全に「殴り合いながら『先に手を出したのはそっちだ』とどっちも言ってる」状態じゃないですか。僕、こういう争い見るたびに「最初の一手さえなければ……」って思うんですよね。でも裁判所はそういう感情論とは関係なく淡々と判断するわけです。話を戻します。\n\n1審（東京地判令4.10.28）では、\n・利用側の逮捕動画投稿は名誉毀損・肖像権侵害あり（権利主張側の勝ち）\n・権利主張側の批判動画は引用として適法（利用側の反訴は負け）\nという結果でした。利用側が控訴してこの判決が生まれます。\n\n【ちょっと解説】引用── 他人の著作物を自分のコンテンツの中に使うこと。批評・研究などの目的で、出所を明示して、引用部分がわかる形でやれば、許可なしでOK。「使っていい理由と方法」がちゃんとある場合のみセーフ。","issue":"要するに何が問題だったの？\n\n2つあります。\n\n（1）利用側の逮捕動画投稿は権利主張側の名誉を毀損しているか？（本訴）\n\n（2）権利主張側が利用側の逮捕動画を批判動画の中で使ったのは、著作権法上の引用として適法か？（反訴）\n\n【ちょっと解説】名誉毀損── 人の社会的な評価を下げるような事実を公表すること。たとえそれが真実でも、公益上必要じゃなければ成立することがある。「本当のことだから言っていい」とは限らない。\n\nどっちが勝つか、なんとなくわかりますか？","ruling":"裁判所の答えは「どっちの主張もある程度通る」でした。\n\n本訴（名誉毀損）については、1審の判断を維持。ただし賠償額を増額（30万円→40万円）。逮捕動画の投稿はやっぱり名誉毀損でした。\n\n反訴（著作権侵害）については、1審と同じく「権利主張側の批判動画は引用として適法」と判断。\n\nつまり「利用側は名誉毀損で40万円払え。でも権利主張側が批判動画で利用側の動画を使ったのはセーフ。」\n\n裁判所、どっちも負けさせてる。すごい。\n\n結論として、お互い傷つきながら「引き分け」みたいな結果です。\n\nちなみに全然関係ないけど、こういう「お互い訴え合ってる」系の裁判、読んでると「最初から仲良くすれば全員ハッピーだったのでは」ってなる。でも仲良くできなかったから裁判になるわけで。話を戻します。\n\n大事なのは権利主張側の批判動画が引用と認められた理由。「利用側の動画を批評する目的で使っていた」「引用部分と自分のコンテンツが区別されていた」という点が評価されました。","takeaway":"で、結局なにが大事なの？\n\n・批評のために他人の動画を使うのは、条件を満たせば引用として適法。「使ったこと」より「どう使ったか」が重要\n・引用のポイントは「明確な区別」と「必然性」。「批評のために必要だったか」「自分のコンテンツがメインか」を常に意識する\n・名誉毀損は「本当のことでも成立する」。事実だからといって公開していいわけじゃない。公益性があるかどうかが分かれ目\n・他人の動画を批判するコンテンツを作るとき、「引用」「コメント」「批評」の形式を意識して作ると、著作権侵害のリスクを下げられる\n\n今回の教訓まとめ：人を叩く動画を出す前に「自分も訴えられる要素がないか」を一回考えよう。","one_liner":"他人を訴えに行くとき、自分も訴えられる準備をしてから行け。","parties":[{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"被撮影者(個人)"},{"role":"利用側","icon":"⚖️","side":"defendant","desc":"YouTuber"}],"lessons":["損害、証明できる？"]},{"original_title":"東京地判令5.3.24（サービス運営を批判する投稿とアカウント停止）","url":"https://itlaw.hatenablog.com/entry/2025/03/16/172807","court":"東京地判","date":"令5.3.24","year":"令和5年（2023年）","topic":"サービス運営を批判する投稿とアカウント停止","categories":["利用規約・消費者"],"fun_headline":"【悲報】同人作家、運営に文句を言った結果アカウントを完全に消された件","hook":"「利用規約に同意する」ってボタン、あれ押すとき中身読んでます？\n\n僕は読んでません。秒で押してます。\n\nでも今日の話を読むと、その「秒で押した」が人生に響いてくる可能性があることがわかります。\n\n怖い話です。でも面白い。どうぞ。","summary":"・絡んでる金額: 150万円\n・テーマ: サービス運営を批判する投稿とアカウント停止\n・利用規約の問題","what_happened":"登場人物を整理しましょう。\n\nユーザー側は同人誌を作って売ってる人です。\n\nサービス側はその同人誌を売るためのサイトを運営してる会社。\n\nユーザー側は平成20年からこのサイトに登録して、ずっと自分の作品を売っていた。仲良くやってたんです。最初は。\n\nここで僕の話をさせてほしいんですけど、僕も昔ネットのサービスに登録するとき「同意する」を連打しまくって、後から「え、こんなこと書いてあったの？」って青ざめたことがあります。あれ本当に心臓に悪い。話を戻します。\n\n令和3年12月ごろ、事件が起きました。\n\nユーザー側が作品を登録しようとしたとき、モザイク処理の対応でサービス側の従業員とトラブルになったんです。\n\nで、ユーザー側はどうしたか。\n\nサイトの掲示板に「こいつには金輪際、絶対に作業をさせないでください！」と投稿。\n\nさらにTwitterに「悪質行為を働いた二名をさっさとクビにしろ！」と投稿。\n\n気持ちはわかる。めっちゃわかる。つらい。でもこれは……。\n\nサービス側側は「それ利用規約違反だよね」として、ユーザー側のアカウントを停止しました。\n\nで、ここからがヤバいんですけど、ユーザー側はアカウント停止で売上が吹っ飛んだとして、150万円の損害賠償を請求したわけです。\n\n【ちょっと解説】逸失利益── 「あの事故がなければ得られたはずの利益」のこと。要するに「あなたのせいで稼げなかった分を払え」という話。\n\nちなみに全然関係ないけど、「金輪際」ってすごい言葉ですよね。金輪際使ったことないです僕。で、","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n（１）そもそもこのサイトの利用規約ってユーザー側に適用されるの？\n\nユーザー側側の主張は「規約に同意した覚えがない」だったんです。\n\n（２）アカウント停止は正しい対応だったの？\n\nつまり「文句を言ったらアカウント消すよ」って規約、有効ですか問題です。\n\n法律用語で言うと「処分の適法性」。わかりやすく言うと「それ許されるの？」です。","ruling":"裁判所はこう言いました。\n\nまず（１）の「規約が適用されるか」について。\n\n裁判所、めっちゃ細かく調べてる。好き。\n\n平成２１年当時、前身サイトのユーザー登録画面上、２０年規約及び個人情報の取扱い方針へのリンク及びこれらに同意するか否かについて選択ボタンが設置されており、これが選択されない状態ではユーザー登録等の登録ができなかったこと、\n\nユーザー側は、平成２１年１０月２６日、生年月日や支払方法等のほか、電子メールアドレス、パスワード等を設定した上で前身サイトにユーザー登録し、その後、継続的に前身サイトにログインし、その利用を継続したこと、\n\nアカウント統合に際し、前身サイトのサークル登録及びユーザー登録をしていたユーザー側は、ユーザー登録を統合する手続をする必要があり、「ユーザー規約、個人情報の取扱いについてをご確認いただき、同意の上で登録してください。」と記載され、ユーザー規約へのリンクが設置された登録画面から「登録する」とのボタンを押して、ユーザー登録手続を行ったこと、\n\nサービス側は、平成３１年以降、３０年規約の一部を変更して新たな規約を作成し、最終的に本件規約が作成されたことがそれぞれ認められる。\n\nまた、２０年規約以降の前身サイト及びこのサイトの規約第１条には、前身サイト及びこのサイトの運営者側が提供する手段を通じ、随時ユーザーに対して発表される諸規定は、規約の一部を校正し、ユーザーはこれを承諾すること、及び上記運営者側は、ユーザーの了承を得ることなく規約を変更することがあり、ユーザーはこれを承諾すること、\n\n規約変更は上記運営者側が提供する手段を通じて随時ユーザーに発表するとの定めがあること、\n\n規約の変更はサービス側及びユーザーの利害に影響を及ぼす重要なことであり、かつ、サービス側にとって、都度、ユーザーに発表することが困難な状況はなかったと考えられること\n\nからすれば、サービス側は、３０年規約以降、規約改定の都度、このサイト等においてユーザー側がこれを確認可能な状態にし、ユーザー側はこうした状況を認識した上で、本件処分まで継続的にこのサイトを利用していたと認められる。\n\n上記によれば、ユーザー側は、このサイトの継続的利用の過程において、サービス側に対し、少なくとも黙示的に本件規約を承諾する意思を表示していたものであり、ユーザー側とサービス側との間で、本件ユーザー資格取消条項を含めた本件規約の内容による利用契約が成立していたと認めるのが相当である。\n\nつまりこういうことです。「読んでなくても、使い続けてたら同意したことになる」。\n\nこれ、ラーメン屋の入口に書いてある「ルール守れない方はお断り」って張り紙を読まずに入店したけど、それでもそのルールに従わないといけない、みたいな話です。\n\nで、（２）のアカウント停止が適法かどうか。\n\nこのようなユーザー側の投稿行為は、このサイトのユーザーや関係者が閲覧する可能性があるウェブサイトに、サービス側やその従業員との私信の内容を一方的に公表し、かつ、これらに対する穏当を欠く表現を含む非難を公然とするものであって、これが違法であるかは格別、少なくともサービス側の信用を失墜させ、また、サービス側従業員らの人格権を侵害する可能性が高い不適切な行為であって、サービス側ないしこのサイトの円滑な運営に支障を生じさせるものといえる。また、上記投稿の内容に照らし、ユーザー側が、このような投稿をする必要性、正当性があるとはおよそ認め難い。\n\nこれに照らせば、ユーザー側の上記行為は、このサイトの運営を妨害ないしその信用を毀損する行為として、本件禁止条項６号、本件資格取消条項４号に該当し、本件資格取消条項９号に該当するものといえる。また、サービス側が、上記ユーザー側の行為についてユーザーとして不適当と判断するのが合理的であるから、本件資格取消条項１０号にも該当するといえる。\n\nそうすると、サービス側は、本件資格取消条項に基づき、ユーザー側のユーザー資格を取り消すことができるから、本件処分は適法というべきである。\n\n裁判所、めっちゃ冷静。好き。\n\nまとめると「ユーザー側の負け。全部棄却」です。\n\nあ、今思い出したんですけど、「穏当を欠く表現」って表現がすごくないですか。法律用語で「言い方が悪い」って言うと「穏当を欠く」になるんですね。使っていこうと思います。","takeaway":"で、結局なにが大事なの？\n\n・利用規約は「使い続けること」で同意したことになる。 読んでないは言い訳にならない\n・運営批判の投稿はリスクがある。 SNSでの愚痴がアカウント停止の根拠になりうる\n・規約の禁止事項を把握しておこう。 特に「運営を妨害する行為」の定義が広すぎる場合がある\n・どうしても不満があるなら、公の場じゃなくて直接交渉か法的手段を選ぼう\n\n最後に一言。感情で動くと、法的には負けやすい。冷静でいることが最強の武器です。","one_liner":"使い続けることが同意。それがインターネットのルールです。知らなかった、では遅い。","parties":[{"role":"ユーザー側","icon":"👤","side":"plaintiff","desc":"同人誌作家"},{"role":"サービス側","icon":"🌐","side":"defendant","desc":"同人誌サイト"}],"lessons":["規約、読んだ？","プラットフォームの罠","損害、証明できる？"]},{"original_title":"知財高判令5.3.16（情報番組における個人サイト記事の無断転載）","url":"https://itlaw.hatenablog.com/entry/2024/01/20/113759","court":"知財高判","date":"令5.3.16","year":"令和5年（2023年）","topic":"情報番組における個人サイト記事の無断転載","categories":["その他"],"fun_headline":"【衝撃】NHKが個人ブログをパクった結果、「雑用は喜んで！」の5文字が著作権を持っていた","hook":"ちょっと待ってこれ聞いたら驚くから。\n\nNHKが個人サイトの記事を無断でパクって、テレビで使いました。\n\nで、どこまでが著作権で守られるの？ってなったとき、裁判所が「この5文字は著作物だ」って言い出したんです。\n\nどういうこと？って思いますよね。僕もそう思いました。\n\n将棋のマナーを解説したブログが、歴史に残る判例になった話です。","summary":"・テーマ: 情報番組における個人サイト記事の無断転載","what_happened":"整理しますね。\n\n原告側は個人でウェブサイトを運営してた人です。\n\n将棋道場で対局するときの初心者向けマナーを記事にして公開していた。\n\n「空いている場所を探してスムーズに着席」とか「駒をぐちゃぐちゃに置いたり、裏返したり、重ねたりしてはいけません」とかね。\n\nここで僕の話をさせてほしいんですけど、僕、将棋のルールを全然知らないんです。「飛車」と「角」の違いすら怪しい。でも将棋のマナーを解説したブログがこんな大事件になるとは思わなかった。話を戻します。\n\n2021年5月、NHKのEテレで「将棋フォーカス」という番組が放送されました。\n\n「初心者必見！対局マナー」というコーナーがあって、そこに……\n\n原告側の記事とほぼ同じ表現が使われていたんです。\n\n原告側の気持ち、わかる。めっちゃわかる。つらい。\n\nNHKはすぐ謝罪しました。「参照したものであることを表示しなかったのは不適切」と認めた。\n\nでも謝罪だけじゃ終わらなかった。\n\n原告側は損害賠償を求めて訴えたんです。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。要するに「あなたのせいで傷ついた、払え」という請求の根拠。\n\n一審では「不法行為は成立しない」として負け。でも原告側は控訴審で請求の内容を変えて戦いを続けました。\n\n「著作権を侵害された」という主張に切り替えたんです。\n\n【ちょっと解説】公衆送信権── 著作物をインターネットやテレビで大勢に送信する権利。無断で使うと侵害になる。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n原告側の文章は「著作物」として認められるか？\n\n【ちょっと解説】著作物性── 「それ著作権で守られる作品ですか？」という問い。ありふれた表現やただの情報は対象外で、「創作的な表現」がないと認められない。\n\n将棋のマナーって、基本的にはどのサイトにも書いてある情報じゃないですか。「上座に座れ」とか「駒は丁寧に扱え」とか。\n\nそういう「誰でも思いつく内容」は著作権で守られない、というのが基本ルールです。\n\nじゃあ原告側の文章は守られるの？ 守られないの？","ruling":"裁判所はこう言いました。\n\n問題となったのは5カ所の表現。著作物と認められた部分と、認められなかった部分があります。\n\nまず著作物性が否定された例から。\n\n１－３　座る場所\n\n将棋道場などでは、あまり気にする必要はありません。\n\n空いている場所を探してスムーズに着席し、対局の準備をしましょう。\n\nこの文章について、裁判所はこう判断しました。\n\n原告側文章１は、将棋の対局の際に座る場所に関し、将棋道場などの場合と和室で指導対局を受けるような場合を分け、前者の場合には、座る場所について余り気にする必要はない一方で、後者の場合には、上位者が上座に座ることなどを説明するものであるところ、座る場所について説明することや、それに当たり上記のように場合分けをして説明すること自体は、アイデアにすぎない。また、その記載内容は、いずれも将棋のルール又はマナーであって、当該内容自体から創作性を認めることはできず、その表現についても、ありふれたものといえ、原告側の何らかの個性が表現として現れているものとは直ちに認め難い。\n\nつまり「そんな表現、誰でも書く。著作権ない」ってことです。厳しい。\n\n次に著作物性が認められた例。これがすごい。\n\n１－４．駒は上位者が準備・片づけをする\n\n駒の準備（盤の上に広げる）や片付け（駒箱にしまう）は\n上位者がやることになっています。\n\n「雑用は喜んで！」とばかりに下位者が手を出さないようにしましょう。\n\nこれについて、裁判所は「駒の準備・片付けの部分はありふれた内容でアウト」としつつも、\n\nもっとも、「「雑用は喜んで！」とばかりに下位者が手を出さないようにしましょう。」という部分については、原告側自身の経験に基づき、初心者等が陥りがちな誤りを指摘するため、広く一般に目下の者が「雑用」を率先して行うに当たっての心構えを示したものといい得る表現を選択し、これを簡潔な形で用いた上で、しかし、逆に、将棋の駒の準備や片付けに関してはこれが当てはまらないことを述べることで、将棋の初心者にも分かりやすく、かつ、印象に残りやすい形で伝えるものといえる。この点、本件番組の制作時に参考にした書籍やウェブサイトである被控訴人が当審において提出した証拠のうち駒の準備や片付けについて記載されたものにも、類似の表現は見受けられない。したがって、上記部分は、特徴的な言い回しとして、原告側の個性が表現として現れた創作性のあるものということができ、著作物性を有するというべきである。\n\n「雑用は喜んで！」という逆説的な使い方に個性がある、ってことですね。\n\nほかに著作物性が認められたのは「待った」に関するこの記述。\n\n着手した後に「あっ、間違えた！」「ちょっと待てよ・・・」などと思っても、勝手に駒を戻してはいけません。\n\nこの臨場感のある書き方が「創作的」と認められました。\n\n裁判所、めっちゃ細かい。好き。\n\n結果、ＮＨＫの著作権・著作者人格権侵害が認められて、損害賠償は5万円少々。\n\nちなみに全然関係ないけど、5万円ってこの規模の裁判にしては少ないですよね。裁判費用のほうが高そう。","takeaway":"で、結局なにが大事なの？\n\n・「情報」は著作権で守られないが、「表現の仕方」は守られる。 同じ内容でも書き方に個性があればOK\n・個人ブログの文章でも著作権はある。 「有名じゃないから大丈夫」は根拠なし\n・媒体が大きくても油断しない。 NHKでも無断転載はダメ、ちゃんとアウトになる\n・コンテンツを使うときは出所を明示する。 それだけで大半のトラブルは防げる\n\n最後に一言。「みんなが書いてる情報」と「あなたの書き方」は別物です。","one_liner":"「雑用は喜んで！」の5文字に著作権があった。世界は思ったより深い。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"個人サイト運営"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"NHK"}],"lessons":["証拠がないと詰む","著作権は万能じゃない"]},{"original_title":"前橋地判令5.2.17（自治体システムへの不正アクセス）","url":"https://itlaw.hatenablog.com/entry/2024/04/02/220322","court":"前橋地判","date":"令5.2.17","year":"令和5年（2023年）","topic":"自治体システムへの不正アクセス","categories":["プログラム・システム","セキュリティ"],"fun_headline":"【実話】NTT東日本が自治体に1億円以上の賠償を払う羽目になった、ファイアウォール設定ミスの話","hook":"みなさん、ファイアウォールって知ってます？\n\n知ってる人も知らない人も、今日の話は関係あります。\n\n前橋市の学校ネットワークに不正アクセスがあって、子供たちの個人情報が大量流出したかもしれない事件がありました。\n\n原因は「ファイアウォールの設定ミス」。委託されたNTT東日本によるものです。\n\n怖すぎる。本当に怖い。","summary":"・絡んでる金額: 100万円\n・テーマ: 自治体システムへの不正アクセス\n・セキュリティ事案","what_happened":"順番に説明しますね。\n\n前橋市（被害者側）は「MENET」という情報教育ネットワークを持ってました。\n\n学校向けのシステムです。子供たちの情報が入ってる。大事なやつです。\n\nそのデータセンタの移管設計・構築業務を、NTT東日本（相手方）に委託していました。\n\n保守業務も月額100万円で委託してた。\n\nここで僕の話をさせてほしいんですけど、「月額100万円の保守費用」って聞くと高い気がするんですけど、子供の個人情報を守るためのシステムだったら全然安いんですよね。むしろそれで守れなかったら洒落にならない。話を戻します。\n\n平成29年8月ごろ、MENETの公開サーバへの不正アクセスが始まりました。\n\n平成30年3月、調査の結果が出ました。\n\n児童・生徒・保護者の個人情報が大量流出した可能性が高い、という結果が。\n\n被害者側の気持ち、わかる。いや、わかりすぎる。自治体の担当者が青ざめてる顔が浮かびます。つらい。\n\n原因はサーバにバックドアが仕掛けられていたこと。そしてファイアウォールの設定が甘かったこと。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。要するに「お金もらったのに仕事してない」のと同じ。\n\n前橋市は1.8億円の損害賠償を請求しました。\n\nで、ここからがヤバいんですけど、NTT東日本は契約書にある「賠償は契約金額まで」という条項を盾にしようとしたんです。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n一番のキモは「賠償額の上限条項が有効かどうか」です。\n\n相手方の主張：「契約書に『賠償は契約金額（約1.05億円）まで』って書いてある。だからそれ以上は払わない。」\n\n被害者側の主張：「設定ミスは明らかにプロ失格のミス。そんな条項は適用されないはずだ。」\n\nこれって要するに「どんなひどいミスをしても上限超えたら知らんもんね」って約束が有効か問題です。\n\n【ちょっと解説】SQLインジェクション── Webアプリの入力欄にSQL文を突っ込んで、データベースを不正操作する攻撃。対策は基本中の基本で、これを怠ると裁判で負けます。","ruling":"裁判所はこう言いました。\n\n「重過失がある場合には、賠償上限の条項は適用しない」。\n\nまず条項の有効性について、こう述べました。\n\n本件委託契約の１７条は、ソフトウェアの開発に係る契約に関連して生じる損害額が、その契約の性質上、想定外に多額に上るおそれがあることから、相手方が被害者側に対して負うべき損害賠償金額を契約金額の範囲内に制限し、相手方はそれを前提として当該契約の金額を設定できるという意味で一定の合理性がある約定であるということはできるが、他方で、相手方が、権利・法益侵害の結果について故意又は重過失がある場合にまで、当該条項によって相手方の損害賠償義務の範囲が制限されるということは著しく衡平を害するものであり、当事者の通常の意思に合致していないというべきであるから、本件委託契約の１７条は、相手方に故意又は重過失がある場合には適用されないと解するのが相当である（東京地裁平成２６年１月２３日判決・判例時報２２２１号７１頁参照）。\n\nつまり「条項は条項として意味はあるけど、ひどいミスをした場合は使えないよ」ということです。\n\nで、ＮＴＴ東日本のミスは「重過失」に当たるか。裁判所、こう言いました。\n\n相手方は、被害者側との間で、本件委託契約の前後における提案依頼書、提案書、要件定義書、設計方針及び基本設計書において、外部ファイアウォールないし内部ファイアウォールによる外部からのアクセス制限を行うことを複数回にわたって確認していたことが認められるから、相手方が被害者側に対して不適切な設定のままこのシステムを引き渡したことは、単純かつ明白なミスであるというべきであり、かつ、相手方が情報セキュリティについて高度な専門的知見を有していることを併せ考えると、相手方には本件委託契約の債務不履行について少なくとも重過失があることは明らかというべきである。\n\n「何回も確認してたのに不適切な設定で引き渡した。これは単純かつ明白なミス。専門家なのに。重過失。」\n\n裁判所、容赦ない。好き。\n\nあ、今思い出したんですけど「単純かつ明白なミス」って表現、普通に傷つきますよね。プロ向けの一番きつい表現だと思います。","takeaway":"で、結局なにが大事なの？\n\n・セキュリティ設定のミスは「重過失」になる。 特に専門家がやるとより厳しく評価される\n・契約書の賠償上限条項は万能じゃない。 ひどいミスには適用されないことがある\n・何度も確認した内容を間違えると言い訳できない。 記録が多いほど「知ってたはず」になる\n・委託する側も、契約内容をちゃんと確認しよう。 「お任せ」は危ない\n\n最後に一言。専門家に頼んでも、確認は怠らない。","one_liner":"脆弱性は放置した人が訴えられる。セキュリティに「まあいいか」は存在しない。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"NTT東日本"},{"role":"被害者側","icon":"🛡️","side":"plaintiff","desc":"前橋市"}],"lessons":["セキュリティ甘すぎ","損害、証明できる？"]},{"original_title":"東京地判令5.2.10（YouTubeチャンネルアカウント管理権限）","url":"https://itlaw.hatenablog.com/entry/2024/11/10/133848","court":"東京地判","date":"令5.2.10","year":"令和5年（2023年）","topic":"YouTubeチャンネルアカウント管理権限","categories":["利用規約・消費者","ネット・コンテンツ"],"fun_headline":"【実話】弁護士がYouTubeのアカウント管理を業者に任せたら、チャンネルごと持っていかれた話","hook":"弁護士がYouTubeチャンネルを作って、動画編集を外注した。\n\nしばらくして業者とトラブルになって、チャンネルのパスワードを変えられて入れなくなった。\n\nで、弁護士が訴えたら……負けたんです。\n\nどういうこと？って話を今からします。","summary":"・絡んでる金額: 3万円\n・テーマ: YouTubeチャンネルアカウント管理権限\n・利用規約の問題","what_happened":"登場人物は3人です。\n\n弁護士側：YouTubeでチャンネルをやりたい人。\n\n動画編集業者側：動画を作ってアップロードする人。\n\nＣ：サービス側よりもっと安く動画を作れる人。\n\nまず弁護士側は動画編集業者側に動画の編集・アップロードを頼んでいました。\n\n1本3万円。高いと感じた弁護士側は「もっと安いＣに頼もう」と考えた。\n\nここで僕の話をさせてほしいんですけど、「1本3万円、高い」って感覚、わかるんですよ。でも動画編集って相場がバラバラで、高いのか安いのかわからないですよね。僕も一回動画編集を頼もうとしたら「最低10万から」って言われて泡を吹いたことあります。話を戻します。\n\n弁護士側は動画編集業者側に「ＣもこのGoogleアカウントを使えるようにしてほしい」と提案。\n\n動画編集業者側は承諾し、Ｃにパスワードを教えた。\n\nここからがヤバいんですけど、ＣがYouTubeの収益化手続きのために二段階認証を設定してしまい……動画編集業者側がアカウントにログインできなくなりました。\n\n2021年11月24日、動画編集業者側はパスワードを変更。\n\n弁護士側が「パスワード教えて」と言ったら動画編集業者側が「教えない」と拒否。\n\nこの日に、なぜかユーザー側サービス側間で業務委託契約書が締結されました。\n\nその契約書に、こう書いてあったんです。\n\n甲（弁護士側）は、乙（動画編集業者側）が自社のＨＰなどに広報・宣伝目的として、甲の制作した動画の実績を掲載することを許可する。また、甲は、乙が本チャンネルのアカウント所有者であることを認める。\n\n「アカウント所有者は動画編集業者側です」と書いてある契約書に、弁護士側が署名してしまいました。\n\n弁護士側の気持ち、わかる。でもこれは……つらい。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。要するに「あなたのせいで傷ついた、弁償しろ」という話。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n弁護士側が「パスワードを勝手に変えられた。違法だ。205万円払え」と訴えた。\n\nでも裁判所が見なきゃいけないのは、そもそも「このアカウントの管理権限って誰にあるの？」という点。\n\n管理権限が弁護士側にあれば、勝手に変えられた＝違法。\n\n管理権限が動画編集業者側にあれば、自分のアカウントをいじっただけ＝合法。\n\nどっちでしょう？","ruling":"裁判所はこう言いました。\n\n「このアカウントの管理権限は動画編集業者側にある」。\n\n本件チャンネルは、サービス側名義のこのアカウントに紐づくものとして動画編集業者側が作成したものであること、\n\n動画編集業者側がこのアカウントのパスワードを変更するまでの間、このアカウントにログインし、本件チャンネル上で動画をアップロードしていたのは動画編集業者側であったこと、\n\n弁護士側による本件チャンネルの具体的な管理行為があったとはうかがわれないこと、\n\n弁護士側は、動画編集業者側がこのアカウントのパスワードを変更した後ではあるが、この契約書を作成し、動画編集業者側が本件チャンネルを含むこのアカウントの「所有者」であることを確認していること\n\nからすると、動画編集業者側がこのアカウントを作成した時点から、このアカウント及びこれに紐づくチャンネルの管理権限は動画編集業者側にあったと認めるのが相当である。\n\nそして、本件チャンネルの管理権限が動画編集業者側にある以上、弁護士側が「本件チャンネルを運営し集客する利益及び作成した動画を自由に編集し管理する権利」を有していたとはいい難く、動画編集業者側らによるこのアカウントのパスワード変更が弁護士側の権利を侵害することにはならない。\n\nしたがって、動画編集業者側がこのアカウントのパスワードを変更したことにより、弁護士側の権利が侵害されたとは認められず、よって、この点に係る不法行為は成立しない。\n\nまとめると「管理権限は動画編集業者側にあった。だからパスワード変えても問題ない。弁護士側の負け」です。\n\n裁判所、めっちゃ冷静。好き。\n\nちなみに全然関係ないけど、弁護士側は弁護士なんですよ。弁護士が法律の話で負けるのって、ものすごく珍しいケースだと思うんですよね。契約書のサインというものの重さを改めて感じます。\n\nなお弁護士側の別の請求も棄却されて、逆に動画編集業者側からの反訴（弁護士側の投稿が名誉毀損だという主張）が一部認められました。踏んだり蹴ったりです。","takeaway":"で、結局なにが大事なの？\n\n・アカウントは「誰が作ったか」「誰が使ってきたか」で権限が決まる。 出演者と管理者は別の話\n・契約書に書かれたことは有効。 「あの状況では仕方なかった」は通用しない\n・業者にアカウント管理を任せるなら、最初から所有権を明確に決めておく。 後で「実は私のです」は難しい\n・SNSや動画の投稿でトラブルになると、名誉毀損で逆に訴えられることもある\n\n最後に一言。YouTubeチャンネルは最初から自分のアカウントで作れ。","one_liner":"アカウントは作った人のもの。「私のチャンネルです」と言うだけでは足りない。","parties":[{"role":"サービス側","icon":"🌐","side":"defendant","desc":"動画編集者"},{"role":"ユーザー側","icon":"👤","side":"plaintiff","desc":"弁護士"}],"lessons":["契約書読んどけば…","セキュリティ甘すぎ","プラットフォームの罠"]},{"original_title":"東京地判令5.2.8（事業譲渡に伴うアカウント引渡し義務）","url":"https://itlaw.hatenablog.com/entry/2024/09/13/230619","court":"東京地判","date":"令5.2.8","year":"令和5年（2023年）","topic":"事業譲渡に伴うアカウント引渡し義務","categories":["利用規約・消費者"],"fun_headline":"【盲点】ブログ事業を買ったのにInstagramアカウントが引き渡されなかった、10万フォロワー事件","hook":"今日の話は「事業を買うってどういうことか」という話です。\n\nブログをまるごと買いました。ドメインも、記事も、全部。\n\nでも元の会社の人がInstagramのアカウントを「これ私のです」と言って渡してくれない。\n\nフォロワーは10万人近くいます。\n\nえ、どっちのもの？ って話です。","summary":"・絡んでる金額: 200万円\n・テーマ: 事業譲渡に伴うアカウント引渡し義務\n・利用規約の問題","what_happened":"登場人物を整理しましょう。\n\n原告側：ブログ事業を買った人。「アカウントくれ」と言ってる側。\n\n被告側：ａ社の元代表者。「アカウントは私のです」と言ってる側。\n\n原告側はａ社からブログ事業をまるごと買いました。これを「事業譲渡」と言います。\n\n【ちょっと解説】事業譲渡── 会社の事業をそっくり別の人・会社に売ること。モノだけじゃなく、契約や権利もまとめて移る。\n\n事業譲渡の契約書には、こう書いてありました。\n\n第１条（目的）\n\n 　甲（ａ社）は本契約の定めに従って、本事業及び本事業に帰属する下記のサイト（ＵＲＬページ及びそれと運営上一体とみなされる全てのページを含む。）（以下、「本サイト」という。）並びに本サイトを運用するためのシステム等（以下、「本システム等」という。）及び、本事業に付随する一切の権利を乙（原告）に譲渡し、乙はこれを譲り受ける。\n\n 　記　（略）\n\n第２条（譲渡資産）\n 　甲（ａ社）が乙（原告）に譲渡する本サイト及び本システム等を構成する資産（以下、「譲渡資産」という。）は、別紙１に記載する資産とする。\n\nで、別紙1にはこう書いてあった。\n\n＜別紙１＞\n　１ 　本サイトに関するすべてのプログラム、ソースコード、デザイン、データ、コンテンツ、及びパスワード等の本サイトの運営に必要なシステムの全て\n　２ 　本サイトに含まれるすべてのページのドメイン（https://〈省略〉）使用に関する契約及び権利義務\n　３ 　著作権を含む本サイトに含まれる全ての知的財産権\n　４ 　本サイトの会員との会員契約上の地位、甲が適法に取得した会員情報\n　５ 　本サイトに関する取引、利用の履歴に関するデータベース\n　６ 　本サイトの運営のための取引先との契約上の地位\n\nインスタグラムのアカウントは……別紙1に明示されていませんでした。\n\nここで僕の話をさせてほしいんですけど、契約書ってこういうとき「書いてあるかどうか」で全部決まるんですよね。「常識的に考えたら含まれるでしょ」が通じないのが法律の世界で、僕だったら絶対全部書き出す。話を戻します。\n\n被告側は「インスタは私が個人で作ったもの。事業と関係ない」と言い張りました。\n\n原告側は「事業の公式インスタとして使ってたじゃないですか」と反論。\n\n被告側の気持ち、わからなくもない。でも事実がどうだったかが問題です。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n（１）このInstagramアカウント、事業譲渡に含まれる？\n\n契約書に「インスタ」って書いてない。でも「運営上一体とみなされるページを含む」とは書いてある。どっち？\n\n（２）もしアカウントを渡せないなら、いくら払うの？\n\n原告側は「フォロワー10万人近い。200万円の価値はある」と主張。でも事業の売買金額は50万円。どうなる？","ruling":"裁判所はこう言いました。\n\nまず（１）、アカウントは事業譲渡に含まれる、と判断。\n\n前提事実のとおり、ａ社は平成３０年７月１日原告側に対しウェブサイト「ｈｔｔｐｓ：／／〈省略〉」に関する一切の事業を、５０万円（消費税含む。）で譲渡したのであり、本件事業譲渡契約書にはこのアカウントが含まれているとの明示の記載は存しないものの、ＵＲＬページ及びそれと運営上一体とみなされる全てのページを含むとの記載があること、本サイトに関する全てのプログラム、ソースコード、デザイン、データ、コンテンツ、及びパスワード等の本サイトの運営に必要なシステムの全てが含まれること、このアカウントは、ａ社が運営していた○○ブログ事業についての公式インスタグラムとして活用されていたことに鑑みると、その譲渡対象に含まれていると解するべきである。\n\n被告側は、このアカウントを設立したのは、被告側個人であったことなどを主張するが、仮に設立当初は被告側個人のアカウントとして開設されたものであるとしても、その後は、○○ブログ事業の一環として活用されていたことは被告側も自認するところであり、少なくとも本件事業譲渡時点においては、ａ社が権利を保有していたと認められるのであり、この点についての被告側の主張は採用できない。\n\nつまり「明示はされてないけど、事業の公式として使ってたんだから含まれる」ということ。裁判所、めっちゃ実態を見てる。好き。\n\n次に（２）、代償の金額について。\n\n(1) 　原告は、被告に対してこのアカウントの情報開示を求め、この執行が不能なときに備えて代償請求として２００万円及び執行不能日からの遅延損害金の支払を求める。\n\n本請求は、このアカウントの情報開示が執行不能になった場合に備えて、これに代わる価値の請求を求める代償請求であり、将来請求であるところ、このアカウントの情報開示を求める請求は、単純な物の引渡を求める訴訟とは異なり、強制執行の方法としては間接強制が可能であると解されるところ、これが執行不能になる可能性は極めて低いものと解されるが、その可能性は認められるところであるから、民訴法１３５条の「あらかじめその請求をする必要がある場合」には該当するといえる。\n\n(2) 　もっとも、本請求は、このアカウントの情報開示が執行不能となった場合の価値を求めるというものであり、前記１で認定したとおり本件事業譲渡契約には、このアカウントの本件売買契約の対価に含まれているというのであるから、その価値は高くても売買代金全体の５０万円を上回ることはないといえ、開示が不能となった時点でこれを上回ることを認めるに足りる証拠はない。\n\n要するに「事業全体を50万円で買った。アカウントはその中に含まれる。だから200万円の価値はない。50万円が上限」です。\n\nユーザー側の気持ち、わかる。でも裁判所の論理は一貫してる。\n\nちなみに全然関係ないけど、10万フォロワーのアカウントを50万円以下に評価されたの、時代を感じますよね。今だったらどう評価されるんだろう。","takeaway":"で、結局なにが大事なの？\n\n・事業譲渡のとき、SNSアカウントも必ず契約書に明示する。 「含まれるでしょ」は通じないリスクがある\n・個人で作ったアカウントでも、事業に使ったら事業の資産になる。 被告側の失敗がまさにこれ\n・代償請求の上限は売買金額に縛られる。 フォロワーが多くても「契約書の金額が基準」になりうる\n・デジタル資産の棚卸しは今すぐやろう。 意外と「誰のもの？」が曖昧なアカウントが眠ってる\n\n最後に一言。デジタル資産を「なんとなく誰かのもの」にしておくのが一番危ない。","one_liner":"事業を買うなら、Instagramのアカウントも契約書に書け。それだけで裁判一回分は防げる。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"事業譲受者"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"元代表者"}],"lessons":["証拠がないと詰む","金の話は最初にしろ"]},{"original_title":"東京地判令5.2.3（和解条項の解釈とプログラムの複製）","url":"https://itlaw.hatenablog.com/entry/2024/09/07/143736","court":"東京地判","date":"令5.2.3","year":"令和5年（2023年）","topic":"和解条項の解釈とプログラムの複製","categories":["著作権","プログラム・システム"],"fun_headline":"【実話】「ちょっとカスタマイズしただけ」と言ったら315万円請求された件","hook":"「ちょっとカスタマイズしただけだから別物だよ」って言い張った人がいるんですよ。\n\n裁判所に。\n\n結果がどうなったかというと、負けました。315万円払うことになりました。そりゃそうじゃないですか？　って思うじゃないですか。でもこの事件、構造がかなりヤバくて、読み込むほどに「自分だったら絶対こうなるわ」ってなる。だから聞いてください。","summary":"・絡んでる金額: 400万円\n・テーマ: 和解条項の解釈とプログラムの複製\n・著作権がらみの争い","what_happened":"まず登場人物を整理しますね。\n\n権利者：電子カルテシステムを作ってる会社。\n被告Ａ：元権利者の契約社員。退職して相手方の代表になった人。\n相手方：Ａが代表の会社。\n\nで、何があったかというと。\n\n権利者と相手方は平成23年に「うちのe-J電子カルテをあなたの会社で売ってください」という販売委託契約を結んだんです。その中に「権利者の取引先にこっそり営業しちゃダメ」という条項があった。\n\nここで僕の話をちょっとさせてほしいんですけど、僕も昔バイト先で「競合他社に就職するな」みたいな誓約書を書かされたことがあって。まあ書いたんですけど、あれって法的にどこまで有効なんだろうって当時から気になってたんですよね。話を戻します。\n\n相手方は平成24年5月ごろから、権利者がすでにアプローチしてたＢ診療所に勝手に営業を始めた。で、同年10月に委託契約を解除した。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n\n権利者としては当然怒るわけです。「Ｂ診療所に入ったシステム、うちのやつじゃないか」って乗り込んでいって、相手方のパソコンからe-J電子カルテを消去して、「もう持ってません」という誓約書（平成25年合意書）にＡのサインをもらった。\n\nここまでは「まあそういうトラブルあるよね」という感じです。\n\nで、ここからがヤバいんですけど。\n\nその後も相手方がこっそりe-J電子カルテを使い続けようとしてるとして、仮処分まで申立て、知財高裁で「e-J電子カルテを使用・販売しない」という内容の和解が成立した（平成27年和解）。\n\n二度も誓約させたのに、権利者はそれでも「またやってる」と疑うわけです。信頼関係の話をすると、これはもうゼロどころかマイナスですよね。","issue":"要するに、裁判所に聞きたいことはこういうこと。\n\n「Ｂ診療所に入れたシステム、e-J電子カルテのパクリじゃないの？」\n\n相手方は「いや、うちが独自にカスタマイズしたんで別物です」と主張した。これって要するに、ラーメン屋で人の秘伝のタレをちょっとだけアレンジして「うちのオリジナルです」って言うような話なんですよね。\n\n裁判所的には「どのくらいの改変をしたら別の著作物になるの？」という問いに答えなきゃいけない。ここテストに出ます。","ruling":"裁判所、こう言いました。\n\n相手方は「自分でカスタマイズしたから複製じゃない」と言い張ったんですが、裁判所はバッサリ切り捨てた。\n\nＢ診療所に導入された電子カルテシステムは、e-J 電子カルテに対してごく一部の設定項目の追加などを行ったものであり、そのプログラムはe-J 電子カルテのプログラムと基本的には同じものといえる。Ｂ診療所に導入された電子カルテシステムは、権利者が著作権を有するe-J 電子カルテのプログラムの創作的部分を利用したもので、相手方により加えられた部分はわずかといえるものであり、相手方は、e-J 電子カルテのプログラムの創作性のある部分を複製した上で、電子カルテシステムを作成し、これを販売したといえる。よって、本件導入は、e-J 電子カルテを複製したものであるといえる。\n\nつまり「ちょっと設定変えただけで中身一緒なら複製です」ということ。\n\n裁判所、めっちゃ冷静。好き。\n\n損害額は315万円と認定された。不正競争防止法の主張については「著作権侵害が認められた以上、それ以上にはならない」として判断がスルーされた。なんかラスボスを倒したら中ボスの話がなかったことになった感じですね。","takeaway":"で、結局なにが大事なの？\n\n・「ちょっと改変したから別物」は通用しない。創作的な部分が同じなら複製と判断される\n・和解したあとも似たようなことをすると、今度は和解条項違反で追い詰められる\n・約束破り（債務不履行）は証拠が残りやすいので、やった側が圧倒的に不利\n・著作権を主張したいなら「自分が著作権者である証拠」を先に整えておくこと\n\nあと一言だけ言わせてください。二回も誓約書を書かせた権利者の執念、ちょっと怖いくらいすごい。","one_liner":"「ちょっとカスタマイズしただけ」は著作権侵害の常套句。裁判所は一切信じない。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"電子カルテ会社"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"販売委託会社"}],"lessons":["証拠がないと詰む","パクリの立証は地獄"]},{"original_title":"東京地判令5.1.27（システム関連資料の営業秘密該当性）","url":"https://itlaw.hatenablog.com/entry/2025/04/16/234957","court":"東京地判","date":"令5.1.27","year":"令和5年（2023年）","topic":"システム関連資料の営業秘密該当性","categories":["プログラム・システム","営業秘密"],"fun_headline":"【退職者あるある】「これくらいいいか」で外部送信→営業秘密侵害で訴えられた話","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n転職のとき、前の会社の資料を「参考に」と思って持っていくのって、めちゃくちゃヤバいんですよ。\n\n「みんなやってるでしょ」「バレないでしょ」「そんな大事な資料じゃないでしょ」、全部アウトになり得る。\n\nしかも「秘密って書いてなかったから問題ない」も通用しなかった事件があって。今日はその話です。","summary":"・テーマ: システム関連資料の営業秘密該当性\n・営業秘密の話","what_happened":"で、何が起きたかというと。\n\n建設会社会社側に勤めてたＡが、2014年にこっそり転職先の元社員の人間に社内資料をメールで送ったんです。件名とか本文とかじゃなくて「これですね。」とだけ書いて添付ファイルをぽんと投げた。\n\nこれ、すでにアウトの匂いがするんですけど。\n\nちなみに全然関係ないですけど、「これですね。」だけのメールって送ったことある人いますか。僕は昔、上司への報告メールに本文ゼロで資料だけ添付して送ってしまったことがあって。「本文がありません」って返信来て三日くらい引きずった。で、\n\nＡは会社側を退職する直前に、貸与されたPCのローカルに会社のシステムファイルを保存して、外部ストレージにzipで圧縮してアップロードした。退職の翌日に元社員に入社して、Ｂとともに元社員のシステム開発を担当した。\n\nいやいやいや。退職の翌日に入社って、もう前から決めてたやつじゃないですか。しかも転職先にはすでに前職の同僚Ｂがいる。これ、組織的な話ですよね。\n\n会社側はＡが作成した「基幹システムの問題点をまとめた検討資料」と「Ｑシステムのファイル群（ＡＱＳ関連ファイル）」の両方が営業秘密にあたると主張して訴えた。\n\n【ちょっと解説】営業秘密── 不正競争防止法で保護される企業秘密。ただし「秘密管理性」「有用性」「非公知性」の3要件を満たす必要がある。「うちの秘密です」と言い張るだけじゃダメ。\n\nで、ここからがヤバいんですけど、この2つの資料、扱いが全然違ったんです。","issue":"要するに、裁判所に聞きたいことはこういうこと。\n\n「この資料って法律的に保護される『営業秘密』なの？」\n\n営業秘密として認められるには3つの条件を満たさなきゃいけない。\n\n①秘密として管理されてること（秘密管理性）\n②事業に有用な情報であること（有用性）\n③世の中に出回っていないこと（非公知性）\n\nここテストに出ます。特に①がポイントで、「秘密って書いてなかった」「鍵もかかってなかった」となると認められないことがある。今回の2資料、この①の扱いが全然違ってた。","ruling":"裁判所、こう言いました。\n\nまず「本件検討資料」（基幹システムの問題点まとめ）について。\n\nアクセス権限が設定されており、全従業員のうち約30名しかアクセスできない環境で管理されていたことが認められる。秘密と明示されていなくても、アクセス制限があれば秘密管理性が認められる場合がある。\n\nつまり「秘密って書いてないけど、30人しか入れないフォルダにあったから秘密扱い」ということ。アクセス制限、ちゃんと機能してました。\n\n一方「ＡＱＳ関連ファイル」については、保管フォルダにアクセス制限が設定されていなかったことから、秘密管理性なし→営業秘密に該当しないと判断された。\n\n裁判所、めっちゃ細かく見てる。好き。\n\n結果として、本件検討資料については不正競争行為あり。ＡＱＳ関連ファイルについては営業秘密に該当しないため請求棄却。同じ「持ち出した資料」でも、フォルダのアクセス権限の有無で結論が真逆になった。\n\n今気づいたんですけどこれ、フォルダの設定一個で数百万円の差が出るってこと。サーバー管理者の方、今すぐアクセス権限を見直してください。","takeaway":"で、結局なにが大事なの？\n\n・秘密って書かなくてもアクセス制限があれば「営業秘密」と認められる可能性がある\n・逆に言うと、アクセス制限がないフォルダに入れた情報は守られない\n・「これくらいいいか」で外部に送った瞬間に不正競争行為が成立しうる\n・退職前のファイル持ち出しは、退職後に確実に尻尾がつかまれる\n\n会社のフォルダ設定、今すぐ確認してください。マジで。","one_liner":"「秘密」と書いていないものを守りたいなら、アクセス制限だけが頼りだった。","parties":[{"role":"会社側","icon":"🏢","side":"plaintiff","desc":"建設業者"},{"role":"元社員","icon":"👤","side":"defendant","desc":"競合建設業者"}],"lessons":["秘密は管理してナンボ","辞め方を間違えた"]},{"original_title":"東京地判令4.11.28（実験報告書中の写真・図表の著作物性）","url":"https://itlaw.hatenablog.com/entry/2025/01/18/151023","court":"東京地判","date":"令4.11.28","year":"令和4年（2022年）","topic":"実験報告書中の写真・図表の著作物性","categories":["著作権"],"fun_headline":"【驚愕】「実験データのグラフ」は著作物じゃなかった。じゃあ何が著作物なの？","hook":"「これ著作権あるやつ？」って判断、実はめちゃくちゃ難しいんですよ。\n\n今日の判例は「実験報告書に入ってる写真や図表が著作物かどうか」をめぐる裁判なんですけど、結果が「これはOK、これはアウト、これはまたOK」と入り乱れててカオスになっている。\n\n同じ報告書の中に入ってる図でも、著作物と認められるものと認められないものが混在するんです。何が違うのか。今日これを解明します。","summary":"・テーマ: 実験報告書中の写真・図表の著作物性\n・著作権がらみの争い","what_happened":"順を追って説明しますね。\n\n脳・生命科学の研究をやってる会社権利者が、相手方から委託を受けて実験をやった。ドライバーが実車を運転してるときの脳の活動を測定するというやつ。\n\n権利者はその結果をまとめた報告書（権利者報告書）を相手方に提出した。写真も図表もたくさん入ってます。\n\nここで僕の話をちょっとさせてほしいんですけど、学生のころ実験レポートを書くのがとにかく苦手で。グラフを貼って数字を並べて「以上より……」って書くだけなのに三日かかってたんですよ。で、あのグラフに著作権があるかって話、全然考えたことなかった。話を戻します。\n\n相手方の従業員たちはこの報告書を使って論文を書いて、ウェブサイトに公開した。そのとき、権利者報告書に入ってた写真や図を無断で使った。\n\n権利者はこれを見て「著作権侵害じゃないか」と訴えた。写真と図を合計するとかなりの枚数になる。相手方側は「著作物じゃないから侵害にならない」と反論した。\n\nこうして「1枚ずつどうか？」という、ものすごく地道な裁判が始まった。","issue":"要するに、裁判所に聞きたいことはこういうこと。\n\n「この写真や図表って『著作物』なの？」\n\n著作物って、なんでもかんでも認められるわけじゃないんですよ。「創作的な表現」がないと著作物にならない。\n\n【ちょっと解説】著作物性── 「それ、著作権で保護される\"著作物\"ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\n要するに「思わず工夫しちゃった部分」があるかどうか。データをそのまま折れ線グラフにしたやつとか、機械が自動で生成した図とかは「工夫なし」と見なされて著作物にならない。","ruling":"裁判所、こう言いました。\n\n同じ報告書の中でも「これは著作物」「これは違う」と1枚ずつ判定していった。怖い。\n\n（著作物と認めた例・図４　実験車両の写真）\n\nいずれも、実験車両の外観や機器の状況を視覚的に端的に理解することができるように、被写体の状況を踏まえ、構図、撮影ポジション・アングルの選択、明るさ等を工夫して撮影したものであることが認められる。\n\nつまり「構図や角度や明るさを工夫して撮ったから著作物」ということ。\n\n（著作物と認めた例・図５写真　ドライブシミュレータの外観写真）\n\n本件実験に用いられたＤＳ及びｆＮＩＲＳの形状等を示すために、被験者がシミュレーションを実施中のＤＳの外観を左後方からそれぞれ撮影したものであり、ＤＳが実車乗車時と同様の視界や道路環境を再現したものであることを視覚的に端的に理解することができるように、被写体の状況を踏まえ、構図、撮影ポジション・アングルの選択、明るさ等を工夫して撮影したものであることが認められる。\n\n（著作物と認めなかった例・図５模式図）\n\n本件図５（模式図部分）は、実験状況を簡潔に説明するために通常の模式図を利用するものにすぎず、ごくありふれた表現にとどまるものであるから、思想又は感情を創作的に表現したものと認めることはできない。\n\n「ありふれた模式図は著作物じゃない」。辛辣。\n\n（著作物と認めなかった例・図６　計測原理を示す画像）\n\n本件図６Ａは、頭部の断面図の画像に赤や青の線を付記したものにすぎず、また、本件図６Ｂは、動脈を示す赤色の管と静脈を示す青色の管を組み合わせるものにすぎず、いずれもごくありふれた表現にとどまるものであるから、思想又は感情を創作的に表現したものと認めることはできない。\n\n（著作物と認めた例・図７Ａ／Ｂ　頭部アタッチメントの写真）\n\n本件図７Ａ及びＢは、頭部アタッチメントを装着した様子を示すために、①本件実験に用いられた頭部アタッチメントの形状を真上から撮影したもの（図７Ａ）及び②当該頭部アタッチメントを被験者が実際に装着した際の様子を前方、後方、右方、左方の４方向から撮影したもの（図７Ｂ）であり、いずれも、頭部アタッチメントの形状やその装着状況を視覚的に端的に理解することができるように、被写体の状況を踏まえ、構図、撮影ポジション・アングルの選択、明るさ等を工夫して撮影したものであることが認められる。\n\n（著作物と認めなかった例・図７Ｃ／Ｄ　MRI画像と模式図）\n\n本件図７Ｃは、３Ｄ－ＭＲＩにより機械的に表示された図に、関連する数字を端的に付記したものにすぎず、ごくありふれた表現にとどまる（中略）\n\n本件図７Ｄは、赤、青、黄色、緑といった一般的な色彩を用いて、頭部アタッチメントを上から見た際の計測チャンネルを模式図化した上で、これに対応するブロードマンの領野の各番号を記載するものにすぎず、ごくありふれた表現にとどまる\n\n（著作物と認めた例・図８　被験者が実験中の様子の写真）\n\n頭部アタッチメントを装着して実車を運転中の被験者の状況を視覚的に端的に理解することができるように、被写体の状況を踏まえ、構図、撮影ポジション・アングルの選択、明るさ等を工夫して撮影したものであることが認められる。\n\n（著作物と認めなかった例・図１３　脳活動データのグラフ）\n\n本件図１３は、計測チャンネルの位置を示すために頭部の３Ｄ画像に数字を付したり、△ＣＯＥのようなデータの数量的な変化を示すために一般的な折れ線グラフを使用したりしたものにすぎず、ごくありふれた表現にとどまるものである\n\n（著作物と認めなかった例・図１６　実験データのグラフ）\n\n本件図１６及び２０は、計測チャンネルの位置を示すために頭部の３Ｄ画像を使用したり、△ＣＯＥや加速度のようなデータの数量的な変化を示すために一般的な折れ線グラフを使用したりしたものにすぎず、ごくありふれた表現にとどまるものである\n\nまとめると。図４、図５写真、図７Ａ・Ｂ、図８が著作物と認められた。データグラフ、模式図、MRI画像は全滅した。\n\n損害賠償は写真1枚あたり2万円（著作権侵害1万円＋著作者人格権侵害1万円）と算定された。枚数分だけかけ算されます。","takeaway":"で、結局なにが大事なの？\n\n・「構図や角度を工夫した」写真は著作物になる。機械的に撮っただけのものは微妙\n・データをそのまま折れ線グラフにしたやつは著作物にならない可能性が高い\n・「引用」として使うには出典の記載が必要。書いてないと言い訳にならない\n・他人の報告書の図を無断で論文に使ったら普通にアウト\n\n研究者のみなさんも、図の使用には注意してください。お互い。","one_liner":"「ありふれた表現」には著作権がない。工夫した瞬間に守られる。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"研究開発会社"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"委託元企業"}],"lessons":["著作権は万能じゃない"]},{"original_title":"知財高判令4.11.2（スクリーンショットと引用該当性）","url":"https://itlaw.hatenablog.com/entry/2022/11/13/184435","court":"知財高判","date":"令4.11.2","year":"令和4年（2022年）","topic":"スクリーンショットと引用該当性","categories":["著作権"],"fun_headline":"「スクショで晒した」が適法だった？　SNS批判投稿と著作権の意外すぎる結末","hook":"みなさん、SNSでスクショ撮って投稿したことありますか。\n\nあれって実は著作権侵害になるかもしれない、という話を聞いたことがある人もいると思うんですよ。\n\nでも今日の判例は「スクショ投稿、合法でした」という判決なんです。\n\nえっ、じゃあ何でもいいの？　というわけでは全然ないんですけど、「批評のためのスクショ」は適法な引用になり得るという話で。これ、SNSを使うすべての人に関係する話なので聞いてください。","summary":"・テーマ: スクリーンショットと引用該当性\n・著作権がらみの争い","what_happened":"順を追って説明しますね。\n\n権利者がTwitter（現・X）に投稿したツイートを、何者かがスクリーンショットして、「ＤＭ画像捏造してまで友人を悪人に仕立てあげるのやめてくれませんかね？」という文章とともに投稿した。\n\n権利者のプロフィール画像もスクショに入っていた。\n\n権利者はこれを見て「プロフィール画像は私の著作物なのに無断使用した。著作権侵害だ」と主張して、プロバイダに対して発信者情報の開示を求めた。要するに「誰がやったか教えてくれ」という裁判です。\n\nここで僕の話をちょっとさせてほしいんですけど、プロバイダ責任制限法って名前がかっこよくないですか。「制限法」ってなんか強そうで。僕がバンド名を付けるとしたらプロバイダ責任制限法にしたい。全然関係ない話をしました。話を戻します。\n\n一審（東京地裁）では、プロバイダがそもそも「開示の義務を負う事業者（開示関係役務提供者）」にあたらないとして請求が棄却された。\n\n権利者は控訴した。\n\nで、控訴審では「開示関係役務提供者にはあたる」と認めた上で、本題に入っていく。「スクショによるプロフィール画像の引用、合法か違法か」という問い。","issue":"要するに、裁判所に聞きたいことはこういうこと。\n\n「スクショでプロフィール画像ごと投稿するのって、『引用』として認められるの？」\n\n【ちょっと解説】引用── 他人の著作物を自分の著作物の中に取り込むこと。「出所の明示」「主従関係」「必然性」などの要件を満たせば、著作権者の許諾なしでOK。\n\n引用として認められるための条件は2つ。「公正な慣行に合致していること」「引用の目的上、正当な範囲内であること」。この2つを満たせば著作権者の許可なしでOKになる。\n\n権利者側は「主従関係がない（スクショの分量が本文と同じくらい）から引用じゃない」と主張した。これ、一見するともっともらしいんですよね。","ruling":"いよいよ判決です。\n\n裁判所はまず、スクショ投稿の目的を分析した。\n\nエ(ｱ)　本件についてみると、本件ツイート１においては、（略）控訴人権利者１が「ＤＭ画像を捏造した」という行為を批判するために、控訴人権利者１が捏造した画像として、この投稿画像１を合わせて示したものと推認され、この投稿画像１を付した目的は、控訴人権利者１が「ＤＭ画像を捏造」してこれをツイートした行為を批評することにあると認められる。\n\n要するに「批評のためにスクショを使ったのは目的が正当」と言った。\n\n次に「分量が同じだから引用じゃない」という権利者の主張を退けた。\n\nオ(ｱ)　控訴人らは、この投稿画像１の分量が本件ツイート１の本文の分量と同等であり、主従関係にないから、引用に当たらないと主張するが、仮に「引用」に該当するために主従関係があることを要すると解したとしても、主従関係の有無は分量のみをもって確定されるものではなく、分量や内容を総合的に考慮して判断するべきである。本件では、この投稿画像１ではなく、本件控訴人プロフィール画像と本件ツイート１の本文の分量を比較すべきである上、この投稿画像１は、本件ツイート１の本文の内容を補足説明する性質を有するものとして利用されているといえることから、控訴人らの上記主張は採用できない。\n\nつまり「主従関係は文字数だけで判断するものじゃない」。裁判所、鋭い。\n\nさらに「引用リツイートじゃなくてスクショはルール違反じゃないの？」という主張も退けた。\n\n(ｲ)　控訴人らは、引用リツイートではなくスクリーンショットによることは、ツイッター社の方針に反するものであって、公正な慣行に反すると主張する。しかしながら、そもそもツイッターの運営者の方針によって直ちに引用の適法性が左右されるものではない上、スクリーンショットの投稿がツイッターの利用規約に違反するなどの事情はうかがえない（甲４１、乙１３、１４）。そして、批評対象となったツイートを示す手段として引用リツイートのみによったのでは、元のツイートが変更されたり削除された場合には、引用リツイートにおいて表示される内容も変更されたり削除されることから、読者をして、批評の妥当性を検討することができなくなるおそれがあるところ、スクリーンショットを添付することで、このような場合を回避することができる。現に、令和２年８月７日時点における、本件ツイート１が引用リツイートした控訴人権利者１のツイートとこの投稿画像１を比較すると、上記引用リツイートでは、控訴人権利者１のユーザー名が変更されており、本件ツイート１が投稿された当時に、同ツイートが批評した控訴人権利者１のツイートが当時のまま表示されているものではないことが認められ（甲３）、引用リツイートのみによっていたのでは、本件ツイート１の投稿当時の控訴人権利者１のツイートを参照することはできなくなっていたといえる。そうすると、スクリーンショットにより引用をすることは、批評という引用の目的に照らし必要性があるというべきであり、その余の本件に顕れた事情に照らしても公正な慣行に反するとはいえないから、控訴人らの上記主張は採用できない。\n\n「削除されたり変更されたりするリスクを考えると、スクショの方が批評の証拠として適切」という理由付けが鋭い。裁判所がSNSの実態を理解してる。\n\nただし、スクショの著作権侵害は否定されたものの、「ＤＭ画像を捏造した」という内容が名誉毀損にあたるとして権利者の請求自体は認められた。\n\nつまり「著作権ではなく名誉毀損で勝った」という、なんとも複雑な結末。","takeaway":"で、結局なにが大事なの？\n\n・批評目的のスクショ引用は、条件を満たせば合法になる\n・「主従関係」は文字数だけで判断されない。内容と文脈も見られる\n・スクショが著作権的にOKでも、その投稿内容が名誉毀損になることはある\n・Twitter社のルールは著作権法の判断に直接影響しない\n\nSNSで誰かを批判するとき、著作権より名誉毀損の方が怖かったりする。","one_liner":"スクショ引用は適法かもしれない。でも書いた内容が名誉毀損なら意味がない。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"ツイート投稿者"},{"role":"利用側","icon":"⚖️","side":"defendant","desc":"プロバイダ"}],"lessons":["証拠がないと詰む","著作権は万能じゃない","規約、読んだ？"]},{"original_title":"東京高判令4.10.5（複数契約の解除の範囲 Z会・日立S）","url":"https://itlaw.hatenablog.com/entry/2023/07/12/003741","court":"東京高判","date":"令4.10.5","year":"令和4年（2022年）","topic":"複数契約の解除の範囲 Z会・日立S","categories":["契約・報酬"],"fun_headline":"【27億円訴訟】本番稼働初日に夜間バッチが死んで、5年後に裁判になった話","hook":"今日の話、スケールがでかすぎて笑えないんですよ。\n\nシステムの本番稼働を開始した初日に、夜間バッチが異常終了した。\n\nその結果、システムは再稼働しないまま廃棄されて、Z会が日立ソリューションズを約27億円で訴えた。\n\nIT業界の闇がギュッと詰まってる案件なので、少し長いですけど最後まで聞いてください。","summary":"・絡んでる金額: 3億円\n・テーマ: 複数契約の解除の範囲 Z会・日立S\n・契約とお金の話","what_happened":"で、何が起きたかというと。\n\n第三者会（発注側）が日立ソリューションズ（開発側）に基幹システムの開発を委託したんです。ウォーターフォール型で進めることにして、フェーズごとに38個の個別契約を締結していった。基本契約はなし。個別契約38本。\n\nここで全然関係ない話なんですけど、38本の契約ってどんな厚みになるんですかね。紙で印刷したら段ボール1箱くらいになりそう。サインするだけで手首が死ぬ。話を戻します。\n\n開発側は順次、設計→開発→テストを進めて、総合試験、受入試験、本番稼働準備まで完了した。\n\nここで嫌な予感がしますよね。でも実際にここまで来るとみんな「もう大丈夫だろう」という気持ちになる。なる。だからこそ本番稼働するんだし。\n\n2017年1月11日、本番稼働開始。\n\n1月13日、初回の夜間バッチ処理を実施。\n\n夜中に終わらなかった。異常終了した。\n\n発注側はシステムの利用を停止して、旧システムに切り戻した。以降、このシステムが再稼働することはなかった。\n\n発注側は「バグがある、直してくれ」と言った。開発側は「テスト工程で発注側がコストを優先して工数を削減した、本番データも提供されなかった、本番稼働を強行したのは発注側自身だ、うちのせいじゃない」と返した。\n\nこの言い合いが続いた結果、2017年12月に発注側がすべての個別契約を解除して、訴訟に至った。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n\n発注側の請求は大きく分けて2つ。「払った20億円を返せ」という原状回復請求と、「使えなかったせいで損した7億円を払え」という損害賠償請求。合計約27億円。\n\n金額が大きすぎて現実感がない。でもZ会もとんでもない損をしてるので笑えない。","issue":"両者の言い分が食い違ったポイントはここ。\n\n38本の個別契約を一括で解除できるの？ という問いと、責任制限条項がどこまで効くの？ という問いが核心。\n\n本件には下記のような責任制限条項があった。\n\n開発側の責めに帰すべき事由による債務不履行に起因して発注側が損害を被った場合，発注側は，開発側に対し，当該損害の直接の原因となったサービス商品（開発側が本件各個別契約に基づいて提供する各業務の総称をいう。）のサービス料金相当額を上限として，当該損害の賠償を請求することができる。\n\nつまり「開発側が払う賠償の上限はそのサービスの料金まで」という条項。これが27億円の請求にどう影響するか。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。","ruling":"いよいよ判決です。\n\n裁判所は、38本の個別契約のうち「開発・単体テストに係る本件個別契約７」の債務不履行を認め、それに密接に関連する他の契約も連鎖的に解除できると判断した。\n\nで、責任制限条項については次のように述べた。\n\nかかる責任制限条項を設けた当事者の合理的な意思は，本件個別契約７の債務不履行があった場合，請求の根拠が本件個別契約７の解除に基づく原状回復請求であるか本件個別契約７の債務不履行であるかを問わず，開発側が負担する債務を本件個別契約７のサービス料金相当額である６億１８５０万円に制限するというものであったと解される。\n\nつまり、個別契約７に関する部分は6億1850万円が上限。\n\n一方で「密接関連する他の個別契約の解除に伴う原状回復請求」には責任制限条項が及ばないとも述べた。\n\nなお，このように解したとしても，本件個別契約１１ないし１４，２１，２２及び２９ないし３２については，本件個別契約７とは別個の契約であるから，本件個別契約７の責任制限条項の効力は，本件個別契約７と併せて解除される本件個別契約１１ないし１４，２１，２２及び２９ないし３２の解除に基づく原状回復請求に及ぶものではない。\n\nつまり「個別契約７の制限条項は、個別契約７以外の契約分の原状回復には効かない」。\n\nこれ、要するに「責任制限条項を書いた契約の分だけ制限される。他の契約の分は別の話」ということ。契約を38本に分けていたことで、制限条項の射程が限定された。\n\n結果として、開発側が戻さなきゃいけないお金の上限がぐっと上がった。","takeaway":"で、結局なにが大事なの？\n\n・責任制限条項は「その契約」にしか効かない。複数契約のまとめて解除には及ばない場合がある\n・ウォーターフォール型の開発で本番稼働直前にトラブルが起きると、原因の押し付け合いが始まる\n・「テスト工程でコストを削減した」「本番データを提供しなかった」は、後で被告側の言い訳になる\n・本番稼働の判断は双方で記録を残して合意しておくこと\n\n本番稼働初日に夜間バッチが死ぬ夢、今夜見そうです。","one_liner":"責任制限条項は万能じゃない。「この契約の分だけ」という話だった。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"Z会"},{"role":"開発側","icon":"💻","side":"defendant","desc":"日立ソリューションズ"}],"lessons":["「完成」って何？"]},{"original_title":"東京地判令4.10.5（不競法・秘密保持契約に基づく請求とUSBメモリ）","url":"https://itlaw.hatenablog.com/entry/2023/03/15/232451","court":"東京地判","date":"令4.10.5","year":"令和4年（2022年）","topic":"不競法・秘密保持契約に基づく請求とUSBメモリ","categories":["契約・報酬","営業秘密"],"summary":"・テーマ: 不競法・秘密保持契約に基づく請求とUSBメモリ\n・契約とお金の話","fun_headline":"【実録】退職前にUSBメモリをコソコソしてたら懲戒解雇された男の話","hook":"退職直前に会社のPCからUSBメモリにファイルをコピーしてたら、同僚に目撃されて懲戒解雇された人がいるんですよ。\n\nもう「えっ」しか言えないじゃないですか。\n\nしかも裁判まで起こされてる。今日はその話です。怖すぎるから最後まで聞いてください。","what_happened":"昭和57年4月に発注側に入社し、40年近く働いてた開発側がいるんですけど。\n\nこの人、令和元年12月に退職届を出して、翌年1月から発注側の競合であるＳ社に転職することにしたんですよ。\n\nここで僕の話をさせてほしいんですけど、転職ってリスクあるじゃないですか。新しいところがしんどかったらどうしようとか。でもそういう不安より先に「競合への転職」っていうのは、まあ火に油というか。話を戻します。\n\n開発側、退職前に誓約書を提出してるんですね。その内容がこれ。\n\n会社を退職した後においても、次に示される秘密情報及び開発物について、会社の許可なく、不正に開示又は不正に使用しないことを約束いたします\n\nこれにサインしておきながら、退職直前にUSBメモリで会社データをゴッソリ複製してた。\n\nで、その場面を目撃されました。\n\nヤバい。これは本当にヤバい。目撃されてるんですよ？\n\nさらに、部下をＳ社に引き抜こうとした疑惑まで出てきて、結果的に「懲戒解雇」の通知が届く。\n\n40年近く勤めた会社を最後の最後にこういう形で去ることになった。僕が当事者だったら三日は寝込んだと思います。本当に。\n\n発注側はさらに「USBの中身を使うな」「情報を廃棄しろ」「USBメモリを返せ」という裁判を起こしました。\n\n【ちょっと解説】不正競争防止法（ふせいきょうそうぼうしほう）── 営業秘密の持ち出し、商品の模倣など、ズルい競争方法を規制する法律。略して「不競法」。要するに「ズルするな」を法律にしたもの。","issue":"要するに何が問題だったの？\n\n発注側の言い分は「USBでデータ持ち出して競合で使うのは不競法違反だし、誓約書（秘密保持契約）にも違反してる」というもの。\n\nそれに対して開発側の反論のうち特に注目なのが、USBメモリの所有権の問題です。\n\n開発側が使ったUSBメモリ、実は「発注側の販促グッズとして配ってたやつ」だったんですよ。余った販促品は従業員が自由に使ってたし、誰も何も言わなかった。\n\nということは「無償でもらったものじゃないですか」って話になる。\n\nここテストに出ます。所有権の主張がひっくり返ることがある、という話です。","ruling":"裁判所、こう言いました。\n\nUSBメモリについては「販促用で余ったやつは従業員が自由に使ってた、異議も出てなかった」という事実から、開発側に無償で譲渡する合意があったと判断。\n\n発注側のUSBメモリ返還請求は却下。\n\nしかも、秘密保持契約に基づく請求まで却下されました。\n\n裁判所、めちゃくちゃ冷静。好き。\n\n発注側の請求はほぼ全部棄却という結果でした。\n\nちなみに全然関係ないけど、「販促グッズのUSBメモリで機密情報を持ち出す」ってシチュエーション、どこかの映画で見た気がする。気のせいかもしれない。で、話を戻すと、証拠が揃わないと裁判は難しいということです。","takeaway":"で、結局なにが大事なの？\n\n・証拠を揃えないと裁判は始まらない。「持ち出した」を立証できなければ負ける\n・誓約書は形式だけじゃなく中身が大事。何が「秘密」かを明確に定義しておくこと\n・会社の備品管理ちゃんとしよう。「余ったから自由に使っていい」が通用すると所有権が揺らぐ\n・退職前の行動は全部見られてると思え。目撃者がいる可能性は常にある\n\n退職って人生の節目ですけど、最後の最後に40年の実績を吹き飛ばすような行動はやめましょうね。","one_liner":"証拠がない主張は存在しないのと同じ。裁判所はエスパーじゃない。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"情報サービス会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"元従業員"}],"lessons":["証拠がないと詰む","秘密は管理してナンボ","辞め方を間違えた"]},{"original_title":"大阪地判令4.9.29（ライセンスチェック結果の評価）","url":"https://itlaw.hatenablog.com/entry/2022/12/26/235835","court":"大阪地判","date":"令4.9.29","year":"令和4年（2022年）","topic":"ライセンスチェック結果の評価","categories":["その他"],"summary":"・絡んでる金額: 75億円\n・テーマ: ライセンスチェック結果の評価","fun_headline":"「違法コピーしてるだろ！」→「してません」→「え、できませんでした（調査ツール）」の75億円裁判","hook":"みなさん、「ソフトウェアのライセンス管理」って聞いてどう思いますか。\n\n「あ〜、なんか面倒なやつ」って思った人、正直だと思います。\n\nでも今日の話を聞いたら、面倒とか言ってられなくなるかもしれない。\n\n著作権者が75億円規模の会社に「違法コピーしてるだろ」と乗り込んでったら、実は調査ツールが使えなかったっていう話です。怖いでしょ？","what_happened":"CADソフトの著作権者である原告側が、情報処理スクールを運営する被告側に、3製品で各6ライセンスの利用許諾をしてたんですよ。\n\n被告側はさらに代理店経由でも別途ライセンスを購入してた。\n\nところがある日、ソフトウェア保護団体（BSAってやつ）の情報提供窓口に「被告側が違法コピーしてる」という情報が入った。\n\n原告側、「やばい」と思って動き出します。\n\n大阪地裁と神戸地裁に「証拠保全」を申し立てて、被告側の3つの校舎を一斉調査。つまり裁判所の許可を得て「急に現地に乗り込む」わけです。\n\nここで僕の話をさせてほしいんですけど、突然「調査に来ました」って会社に乗り込まれる状況、想像するだけで胃が痛い。しかも相手は裁判所の許可持ちです。逃げ場がない。話を戻します。\n\n調査の結果、PCの中にシリアル番号が確認できないものや「000-000000000」と表示されるものが見つかった。\n\n原告側「これは無許可インストールだ！」と判断して、約1.75億円の損害賠償を請求した。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。要するに「契約してなくても弁償しろ」と言える状況のこと。","issue":"要するに何が問題だったの？\n\n「シリアル番号がない＝違法コピー」という前提が正しかったのか、ということです。\n\n原告側は「シリアル番号なし＝ライセンスなし＝アウト」って主張したわけですが。\n\nここテストに出ます。「なぜシリアル番号がないのか」の理由は一つじゃないんですよ。","ruling":"いよいよ判決です。\n\n裁判所は、次のように述べて違法複製の事実は認定できないとした（改行位置や、スクール名などは仮名に変更した。）。\n\nＡ校及びＢ校での本件証拠保全において、原告側は、持参したＵＳＢメモリに記憶させた「専用の調査ツール」（以下「専用調査ツール」という。）を使用して、被告側のパソコンに対し、AutoCAD 等のプログラムの検索を行ったところ、専用調査ツールは起動したもののレジストリを表示するテキストファイルが作成されなかったもの、専用調査ツールは起動してレジストリを表示するテキストファイルは作成されたものの「Registry Search Result」の項目が表示されなかったものが存在し、\n\nまた、Ｃ校での本件証拠保全において、原告側は、専用調査ツールを使用したが起動しなかったことから、被告側のパソコンに対し、ソフトウェアを起動してライセンスマネージャー画面を立ち上げ、AutoCAD 等のプログラムのシリアル番号の確認を行ったところ、シリアル番号の確認ができなかったものが存在し、原告側は、これらのパソコンについて、AutoCAD LT の複製が確認されたが、シリアル番号が不明であったものとしてカウントしていることが認められる。\n\nつまり「調査ツールが正常に動かなかった」んですよ。\n\n証拠保全に乗り込んどいて、調査ツールが機能しないってどういうこと？ってなりますよね。\n\nまた、（略）バージョン２０１７以降の　AutoCAD LT 及びバージョン２０１７以降のAutoCAD については、シングルユーザータイプであるかマルチユーザータイプであるかにかかわらず、それぞれのバージョン２０１６以前とは異なり、（略）コンピュータのWindows レジストリには、シリアル番号が入力されず、「000-00000000」と書き込まれるようになったことが認められる。\n\nこれらの事実に照らすと、本件証拠保全において、AutoCAD LT の複製が確認されたパソコンのうち、原告側において、シリアル番号が確認されず不明であるとカウントしたものやシリアル番号が「000-00000000」となっていたものについて、シングルユーザー（スタンドアロン）タイプのプログラムがインストールされていたものと推認することはできないといわざるを得ず、原告側の前記主張は、その前提を欠く。\n\nやばい。「000-00000000」は仕様なんですよ、バージョン2017以降。\n\nつまり原告側が「違法の証拠だ」って言ってたものが「バージョンが新しいときの正常な表示」だったわけです。\n\nあと被告側が証拠保全の前後に大量のライセンスを追加購入した件も、「違法分を埋め合わせた」という主張は「直ちに従前の違法複製が推認されることにはならない」としてバッサリ切られました。\n\n原告側の請求は全部棄却。","takeaway":"で、結局なにが大事なの？\n\n・調査ツールは本番環境で使える状態か事前に確認しよう。乗り込んでからツールが動かないのは最悪\n・「ゼロ表示＝不正」は早計。ソフトのバージョンによって仕様が変わることがある\n・訴える前に証拠の精度を確認しよう。前提が崩れると請求全部が崩れる\n・ライセンス管理はちゃんとやろう。疑われるような状況は作らないのが一番\n\n著作権の調査、ちゃんと準備してから乗り込みましょう。裁判所が許可した現地調査でツールが動かないって、もう終わりじゃないですか。","one_liner":"「違法の証拠」が仕様だったとき、人は何も言えなくなる。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"CADソフト会社"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"ITスクール"}],"lessons":["証拠がないと詰む","パクリの立証は地獄"]},{"original_title":"東京地判令4.9.15（ＡＩ開発と請負／準委任）","url":"https://itlaw.hatenablog.com/entry/2025/05/06/155645","court":"東京地判","date":"令4.9.15","year":"令和4年（2022年）","topic":"ＡＩ開発と請負／準委任","categories":["契約・報酬"],"summary":"・絡んでる金額: 4320万円\n・テーマ: ＡＩ開発と請負／準委任\n・契約とお金の話","fun_headline":"4320万円払ってAIが完成しなかった話、そして裁判で全額返ってきた話","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n4320万円払ってAI開発を依頼したんですよ。全額先払いで。\n\n完成しませんでした。\n\n「え、じゃあ返して」「いや、準委任だから返さなくていい」という謎の応酬が始まって、裁判になった話です。\n\nIT業界で仕事してる人、全員他人事じゃないやつです。","what_happened":"発注側が開発側に、動画の音声から自動で字幕を生成するAIシステムの開発を頼んだんですよ。\n\n開発費は4320万円（税込）。\n\n発注側はこれを2回に分けて全額支払い済みです。全部払った。\n\nところがシステムは完成しなかった。\n\nここで僕の話をさせてほしいんですけど、ものが来てないのにお金だけ払った状態って、居酒屋で注文してお金渡したのに料理が来ないまま閉店したみたいな感じじゃないですか。しかも4320万円規模で。泣く。話を戻します。\n\n発注側は「この契約を解除する」と言って、代金の返還を求めました。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。お互い原状回復（もらったものを返す）義務が発生する。要するに「なかったことにして、払ったお金返して」ということ。\n\n開発側の取締役らも連帯保証人になってたので、一緒に訴えられました。地獄。","issue":"要するに何が問題だったの？\n\n「この契約が請負なのか、準委任なのか」という点です。\n\n【ちょっと解説】準委任（じゅんいにん）── 「結果は約束しないけど、プロとしてちゃんとやります」という契約。美容院で「いい感じにしてください」と言うのに近い。SES契約はだいたいこれ。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。レストランで「カレーください」と注文するようなもので、カレーが出てこなかったら契約違反。\n\n発注側の主張は「請負だから完成品が来なかったら全額返せ」。\n\n開発側の主張は「準委任だから、完成しなくても作業した分はもらえる。返さなくていい」。\n\nここテストに出ます。どちらの契約形態かで、お金が全部返ってくるかどうかが変わります。","ruling":"いよいよ判決です。\n\n裁判所は、本件合意書の記載等から、開発側はこのシステムを完成させる債務を負っていたと認定した。\n\n本件合意書の１条は、その文言上、開発側が開発を完成させるシステムとして、自動字幕システムが対象とされていることが明らかとはいい難いものの（略）、本件合意書作成当時、発注側及び開発側は、将来的に、自動的に動画にテロップを入れたり、動画を番組の規定時間に合わせて編集したりするＡＩの開発を想定していたことが認められ、本件合意書記載の動画自動編集ＡＩは、このシステムの機能に人の動作や背景を識別する機能等を加えるなどしてこのシステムを発展させたものであるということができる。そして、発注側が開発側に対し、Ｑ社に向けて販売される予定であるＡＩによって自動的にテレビ放送等の音声を認識して字幕を作成する自動字幕システム、すなわちこのシステムを４０００万円で開発することが可能であるという認識でよいか問い合わせたのに対し、開発側がそのような認識でよいという趣旨の返事をするというやりとりをしているところ、これ以外に発注側と開発側との間で、本件合意書記載の合計金額である４０００万円で開発するシステムの内容について話し合いがされた様子はうかがわれない。そうすると、本件合意書においては、当事者の将来的な上記想定をもとに「動画自動編集ＡＩ」という文言が用いられたにすぎず、開発側が開発を完成させる具体的な債務の内容として想定されていたのは、動画自動編集ＡＩの基礎となるこのシステムを４０００万円（税込４３２０万円）で完成させることであったと考えるのが自然である。\n\n以上によれば、開発側は、この契約に基づいてこのシステムを完成させる債務を負っていたというべきである。\n\n要するに「4000万で完成させますよ」ってメールのやりとりがあった時点で、請負だよねということです。\n\nチャットのやりとりで「完成させます」っていう趣旨の返信してたら、それが証拠になります。怖すぎる。\n\n開発側の反論（「仕様が抽象的だったから請負じゃない」「代金を先払いしてるんだから完成義務はない」）も、\n\n開発側が開発すべきシステムの内容は、ＡＩによって自動的にテレビ放送等の音声を認識して字幕を作成する自動字幕システムであり、（略）少なくとも開発を予定したシステムが有すべき機能は特定されていたと認められ、開発対象として具体性に欠けていたということはできない。また、本件合意書には「完成させる」という文言が用いられ、その完成期限も定められており、開発側がこのシステムを完成させる債務を負わないという開発側の主張は、本件合意書の上記文言と矛盾するものである。さらに、この契約における発注側の代金支払時期は、この契約締結直後の平成２９年９月２９日（１条２項）及び発注側が成果物が完成するとの確証を得たときとされているが、請負契約において仕事を完成させるのに必要な費用を提供するなどの目的で仕事の完成前に請負代金の一部の支払をすることは一般的にあり得ることであり、同条４項も成果物の完成時期と関連付けて代金の支払時期を定めたものに過ぎず、開発側に成果物の完成義務がないことをうかがわせる趣旨の条項とはいえないから、上記代金支払時期の定めをもって、この契約が請負契約ではないとはいえない。\n\nとバッサリ切られました。\n\n音声データの提供が不十分だったという開発側の主張も認められず、発注側の請求が全額認容。4320万円、全部返ってきました。","takeaway":"で、結局なにが大事なの？\n\n・「完成させます」という一言が請負契約の根拠になる。口頭でもメールでも\n・請負か準委任かを最初に決めておこう。後で揉めると両方しんどい\n・仕様書には「完成の定義」を明記しよう。何ができたら完成なのかを決めておく\n・先払いしても「完成義務がない」にはならない。裁判所はちゃんと見てる\n\n「準委任だから返さなくていい」は通用しないこともある。契約の形をちゃんと決めましょう。","one_liner":"「完成させます」のひと言は、4000万円の約束と同じ重さを持つ。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"動画サービス会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"AI開発会社"}],"lessons":["契約書読んどけば…","「完成」って何？"]},{"original_title":"東京地判令4.9.13（支払留保条項と民法548条の2第2項）","url":"https://itlaw.hatenablog.com/entry/2025/03/04/220859","court":"東京地判","date":"令4.9.13","year":"令和4年（2022年）","topic":"支払留保条項と民法548条の2第2項","categories":["その他"],"summary":"・絡んでる金額: 7000万円\n・テーマ: 支払留保条項と民法548条の2第2項","fun_headline":"【怖話】アマゾンに7000万円売上を凍結された会社の末路","hook":"Amazonのマーケットプレイスで商売してる人、いますか？\n\n今日の話、かなり怖いんで覚悟して聞いてください。\n\n「売上7000万円を突然凍結された」という事案があって、しかも裁判で「それは合法です」ってなった話です。\n\nえ、怖くないですか？ 怖いですよね？","what_happened":"医薬品等を販売する原告側が、アマゾン（被告側）のマーケットプレイスに出品登録して、いろいろ規約に同意した上で商売を始めたんですよ。\n\n短期間で商品取引数2919点、総額約7000万円の取引を行いました。\n\nすごいスピード感ですよね。\n\nところがアマゾン側が「この取引、おかしい」と判断した。\n\n理由は「同一の購入者が大多数の商品を買ってる」「不自然すぎる」「資金洗浄の疑いがある」。\n\n【ちょっと解説】資金洗浄（マネーロンダリング）── 犯罪で得たお金を「普通のお金」に見せかけること。違法。要するに汚いお金をきれいに偽装する行為のこと。\n\nアマゾン、売上金の支払いを「留保」しました。つまり凍結。払わないってこと。\n\nその根拠として規約のこの条項を持ち出してきた。\n\n第２条　サービス利用者のアカウントが、偽装、詐欺、又は違法行為に利用されているものとＡｍａｚｏｎが判断した場合、Ａｍａｚｏｎは、その独自の裁量により、サービス利用者への送金又は支払を永続的に留保することができるものとします\n\n「永続的に留保」って書いてある。永遠に払わなくていい可能性があるということです。\n\nここで僕の話をさせてほしいんですけど、規約を読まずに同意してるの、全員心当たりありますよね。「同意します」ボタン押すだけみたいなの。ここにこんな条項が入ってるとは。話を戻します。\n\n原告側は「支払留保は違法だ」として、手数料引いた約6500万円の支払いを求めて裁判を起こしました。","issue":"要するに何が問題だったの？\n\n「この規約の条項は無効じゃないの？」という話です。\n\n定型約款という形で利用者に提示される規約の条項が、消費者にとって不当に不利な内容の場合は「合意しなかったことにする」という民法のルールがあります。\n\n原告側は「永続的に留保できるなんて、そんな条項は無効だ」と主張したわけです。\n\n一方アマゾンは「規約にちゃんと書いてある、太字で強調もしてある」と主張。\n\nここテストに出ます。「規約に書いてあれば何でも有効」ではありません。でも今回は……。","ruling":"裁判所、こう言いました。\n\nまず「永続的に留保できる」という条項が公序良俗に反して無効では？という主張について。\n\n裁判所は「詐欺やマネロン防止という目的のためには期間を限定できないこともある。必要かつ相当な範囲内だ」として、無効とはしませんでした。\n\n次に「これは不当条項で、合意しなかったことになる」という主張について。\n\n本件規定の不当条項等該当性について検討するに、本件規定に定める送金等の留保の措置は、被告側がサービス利用者に対して契約上負っている売上金の送金等に係る義務の履行を拒絶することを可能とし、サービス利用者の権利行使を阻止できるようにするものであるから、「相手方の権利を制限する条項」に当たる。しかしながら、前記１(2)に説示した点に照らせば、本件規定は、違法行為等の存在をうかがわせるような徴表が発見されたことを前提に、不当な資金の移転を阻止するために不可欠な手段として送金等の留保の措置を取ることができるとするものであり、上記の目的を達成する上で必要かつ相当な範囲内にとどまっていると評価すべきものである。また、本件規定の意味内容が、サービス利用者のアカウントが違法行為等に利用されていると被告側において判断した場合には、送金等の留保の措置を、期限を定めることなく取ることができるものであることは、本件規定の文言からサービス利用者が理解し得るものであり、かつ、本件規約中、本件規定部分は太字で記載され、サービス利用者に対しても強調されて示されていることからすると、本件規定が、サービス利用者にとって認識困難であるとか、あるいは予測が困難であるということはできない。\n\n長い。要約すると「太字で書いてあったし、目的も正当だから、不当条項じゃない」ということです。\n\n裁判所、めちゃくちゃ冷静。\n\nさらに実際の取引が架空だったかどうかも判断された。1ヶ月弱で同じ製品の高級カメラ（1台約30万円）が242台、特定の1アカウントに売れてる、しかも決済が全部アマゾンギフト券、伝票も出てこない。\n\n裁判所「架空取引の疑いあり。アマゾンが支払いを留保したのは合理的」と判断。\n\n原告側の請求は全部棄却されました。","takeaway":"で、結局なにが大事なの？\n\n・規約は読め。「永続的に留保できる」みたいな条項、ちゃんと書いてある\n・取引が不自然な形になってたら自分から説明できるようにしておく。疑われたとき証拠がないと終わる\n・アマゾンギフト券での大量決済は超怪しまれる。当たり前だが\n・プラットフォームに依存したビジネスはリスクがある。規約変更や凍結で一発アウトになることも\n\nプラットフォームの規約に同意した時点で、その世界のルールに縛られます。確認しましょう。","one_liner":"規約は読め。以上。太字で書いてあった。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"Amazon"},{"role":"原告側","icon":"💼","side":"plaintiff","desc":"医薬品販売店"}],"lessons":["証拠がないと詰む","規約、読んだ？","プラットフォームの罠"]},{"original_title":"東京地判令4.8.30（プログラムの創作性（否定））","url":"https://itlaw.hatenablog.com/entry/2023/01/11/234707","court":"東京地判","date":"令4.8.30","year":"令和4年（2022年）","topic":"プログラムの創作性（否定）","categories":["プログラム・システム"],"summary":"・テーマ: プログラムの創作性（否定）\n・システム開発のトラブル","fun_headline":"「俺のコードには著作権がある！」→「ありません」と言われた電子カルテ裁判","hook":"エンジニアのみなさん、今日もコード書いてますか。\n\nちょっと聞いてほしいんですけど。\n\n「自分が書いたコードには著作権がある」と思ってる人、多いと思うんですよ。\n\n今日の裁判、それを「ない」と言われた話です。\n\necho 1; の1行コードにも著作権はないと言われた話、聞きますか？","what_happened":"かなり込み入ってるので整理しますね。\n\n原告側が「うちの電子カルテのプログラム（このプログラム）を被告側がパクってSaaSで提供してる」として、差止請求と損害賠償を求めた事案です。\n\n電子カルテって要するに、医療機関でカルテをデジタル管理するシステムのことです。ちなみに全然関係ないけど、電子カルテって実際に使ってる病院と紙カルテの病院が両方あって、どっちが多いのか気になって一瞬調べたら、そこそこ電子カルテが普及してるということがわかりました。で、話を戻します。\n\nことの発端はこうです。\n\nもともと被告側がＰＭポータルというウェブアプリの基盤を作ってたんですよ。\n\n被告側が委託した第三者企業がそれをベースに電子カルテシステムを開発した。\n\nで、著作権が被告側から第三者企業に移転し、さらに第三者企業から原告側に移転したと原告側は主張してる。\n\n一方被告側は「もともとうちが作ったＰＭポータルが元になってて、修正した部分にも創作性はないから著作権はうちにある」と反論。\n\nこのプログラムとＰＭポータルには、ソースコードに類似した記述が多数あることは認められてる。\n\n要するに「似てる」のは事実。でも「著作権の侵害になるかどうか」は別の話なんです。","issue":"要するに何が問題だったの？\n\n「このプログラムの修正・追加した部分に、オリジナルの創作性があるか」という点です。\n\nここテストに出ます。プログラムに著作権が認められるかどうかは「表現の選択の幅があるか」で決まります。\n\nひとつしか書きようのないコードは、著作権で保護されません。ありふれた表現は著作権の対象外なんです。\n\n原告側が「これは創作的な表現だ」と主張した箇所が、本当に創作的なのかどうかが争われました。","ruling":"さあ、裁判所の答えです。\n\n原告側が「創作的表現である」と主張する部分について、それぞれ創作性があるかどうか検討された。判決文では、多数の箇所について個別に検討した結果が述べられているが、いずれも創作性を否定した。いくつか例を引用する。\n\n電子カルテに必要な機能を抽出、分類しているという原告側主張の点は機能をいうものでプログラムの創作性を直接述べるものとはいえず、上記のような㋐及び㋒部分の特性に照らすと、電子カルテシステムに適用するために、ＰＭポータルを修正し新たに作成した部分があるからといって、そのことが直ちに本件３１個の各プログラムの表現上の創作性につながるとはいえない。\n\nこのプログラム１⑷に記述された各関数は、ＰＭポータルにおいて頻繁に使用される処理を関数として記述しこれらをまとめたファイルや、ＰＭポータルのその他の記述、汎用的な記述を参照して記述され、その内容は、所定のデータベースから所定の情報を取得する関数やＰＨＰの一般的な記述による画面表示用の関数など、いずれも単純な作業が記述されたものであって（前記１⑵イ(イ)）、表現の幅は狭い。これらによれば、このプログラム１⑷の記述は、繰り返し記述される命令文の組合せを一般的な共通化の手法によってそのまま表現したものであって、その記述をすることやその内容はありふれたといえるものである。\n\nありふれてる。一般的な記述方法。こう言われたらもう反論できないですよね。\n\n繰り返し記述することが予想される命令文の組合せをまとめて関数として定義し、関数名を記述してあらかじめ定義された関数を呼び出す方法により複数のプログラムの動作を実現させることは一般的に行われている。（略）したがって、このプログラム３⑴の記述は、繰り返し記述される命令文の組合せを一般的な共通化の手法によってそのまま表現したものであって、その記述をすることやその内容はありふれたといえるものである。\n\nこのプログラム３⑵は、「echo 1;」という、echo文により定数である「１」を送信する処理を行う１行から成るプログラムであり（前記１⑵イ(カ)）、極めて簡単な内容を一つの命令のみのごく短い構文で記述したありふれた表現であって、このプログラム３⑵に創作性があるとは認められない。\n\necho 1; に著作権はない。\n\nまあそうですよね、と思いつつ、これを法廷で言われるのはエンジニアとして地味につらい。\n\n以上のように、ＰＭポータルを基盤としＰＭポータルのＷｅｂフレームワークを用いて作成されたことに起因して、（略）その内容は、自由度が制約され、基本的な命令文を列挙して、変数にデータを代入する処理や画面を表示するためのＨＴＭＬ文書が記述された部分が多くを占めていること（前記第２の１⑸イ、前記イ）、作成、表示される医事文書の基本的な様式も通知により定められるなどしていることから、各プログラムにおいて変数に値を設定する処理や画面を表示するためのＨＴＭＬ文書を記述するに当たっても個性を発揮する余地が乏しい。これらの㋐及び㋒部分の特性から、電子カルテシステムに適用するために、ＰＭポータルを修正し新たに作成した部分があるからといって、そのことが直ちに本件３１個の各プログラムの表現上の創作性につながるとはいえない（前記ウ(ア)）。そして、原告側は、本件各３１個の各プログラムがそれぞれ著作物であり、それらに創作性があると主張するところ、（略）原告側が創作性があるとして主張する具体的な記述等はいずれもありふれたといえるものなどであって、それらに独自に著作物といえる程度の表現上の創作性を認めるに足りない（前記ウ(イ)～(オ)）。\n\n「個性を発揮する余地が乏しい」という表現、エンジニア的にはちょっと刺さりますよね。\n\nあ、今気づいたんですけどこの記事もう結構長くないですか？ まあいいです。続けます。\n\n結果、このプログラムには独自の創作性がないとして、著作権は被告側に留まったままと判断。原告側の請求は全部棄却されました。","takeaway":"で、結局なにが大事なの？\n\n・「書いた＝著作権がある」ではない。ありふれた表現には著作権が認められない\n・フレームワークを使うと創作性の余地が狭まる。それは仕方ないが認識しておこう\n・プログラムの著作権を主張するなら、独自性の高い部分に限定しよう。全部にあると思うと負ける\n・著作権の移転はちゃんと書面に残そう。口頭の合意だと後でひっくり返ることがある\n\n「自分が書いたコードは著作物だ」という直感は正しいことも多いけど、裁判所は一行一行チェックします。","one_liner":"echo 1; に著作権はない。プログラムはアートじゃなく、手段だから。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"電子カルテ会社"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"医療ソフト会社"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["契約書読んどけば…","著作権は万能じゃない"]},{"original_title":"東京地判令4.8.9（ドキュメントの秘密管理性・創作性、従業員引抜行為）","url":"https://itlaw.hatenablog.com/entry/2022/12/14/222630","court":"東京地判","date":"令4.8.9","year":"令和4年（2022年）","topic":"ドキュメントの秘密管理性・創作性、従業員引抜行為","categories":["営業秘密"],"fun_headline":"【悲報】「秘密です」と言い張るだけじゃ営業秘密にならなかった件","hook":"「うちの資料は秘密です」って言えば営業秘密になると思ってた人、手を挙げてください。\n\n僕は挙げます。思ってました。でも裁判所的にはそうじゃないらしい。\n\nきょうの話、会社員の人は他人事じゃないので、ちょっと付き合ってください。","summary":"・絡んでる金額: 1億円\n・テーマ: ドキュメントの秘密管理性・創作性、従業員引抜行為\n・営業秘密の話","what_happened":"ちょっとこれ、登場人物が多いので整理しながら聞いてください。\n\n会社側という会社があります。その代表取締役がＣさん。もともとの代表取締役だったＡさんと、なんかいろいろあって仲違いしたわけです。\n\nここで僕の話をさせてほしいんですけど、職場の人間関係って、最終的に「どちらかが出ていく」みたいな展開になりがちじゃないですか。僕の元バイト先もそうでした。話を戻します。\n\nで、ＡさんとＣさんが2017年10月19日に合意書を取り交わしたんですよ。その内容が結構すごくて、\n\n- Ａが会社側の代表を辞任し、新たに会社（元社員）を設立することをＣが承認する\n- 会社側の従業員が転籍の申出をした場合、Ｃはこれを許可する。ただしクライアントに迷惑をかけず、損害が生じないようにする\n- Ａは情報を持ち出さないこと\n- Ａは従業員を新会社に移籍するよう勧誘しないこと\n- 顧客に取引切替の勧奨もしないこと\n\nえっ。こんな細かく書くんだ。\n\nその後どうなったかというと、元社員が設立されて、会社側の従業員31名中18名が元社員に移籍したんですよ。過半数超えてるじゃないですか。\n\nちなみに全然関係ないけど、「31人中18人が同じ人について行く」って、相当な求心力ですよね。僕なら絶対そんなに慕われない。\n\nで、問題になったのが「このデータ」。ＡＩチャットボットの機能一覧とか非機能一覧とか画面イメージとかをまとめた資料です。Ｂが会社側在籍中に作ってた資料と、元社員で作った資料が似てるじゃないかと。\n\nそこで会社側が、①著作権侵害、②営業秘密の不正取得・開示、③従業員の引抜・顧客の取引切替勧誘という不法行為があったとして、損害の一部として1億円を請求したわけです。\n\n【ちょっと解説】不法行為── 「わざと、または不注意で他人に損害を与える行為」のこと。契約書がなくても「あんたのせいで損した」と言える制度。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n争点は大きく三つ。\n\n①そのデータ、著作物なの問題\n②それ、営業秘密として管理されてたの問題\n③合意書の６項（従業員の勧誘禁止・顧客切替禁止）に違反してたの問題\n\n会社側的には「全部アウトでしょ！」という主張なんですけど、裁判所の見解はかなりクールでした。\n\n【ちょっと解説】営業秘密── 不正競争防止法で守られる企業の秘密情報。ただし「秘密として管理している」「有用な情報だ」「世に出回っていない」の3つを全部満たさないといけない。「うちの秘密！」と言い張るだけじゃダメ。\n\n特に営業秘密については、「秘密管理性」があるかどうかが鍵でした。つまり、ちゃんと「これは秘密ですよ」という管理をしていたかどうか。ラベルも貼らず、アクセス制限もなく、「まあ秘密なんで」だけだと、法律的には秘密として認められないんですよ。","ruling":"で、裁判所はどう判断したか。\n\n従業員引抜（６項前段違反）については、裁判所はこう言いました。\n\n上記認定事実によれば、元社員に移籍した会社側の従業員の大多数は、そもそもＡを信頼するなどして、Ａを追って会社側に入社した者であり、Ｃが法定の手続なく不当に会社側代表者に就任し不当な介入をしてきた不満等から、会社側を退職し、従前から信頼していたＡを追って、自らの判断で元社員に移籍したものと推認するのが相当である。\n 　そして、元社員に移籍した会社側の従業員全員が、Ａを信頼し、自らの意思で元社員に入社した旨陳述するとともに、Ａからは、当該従業員の意思を尊重し、勧誘など一切されていない旨、事の経緯を明らかにしているところ、上記認定に係る本件の経過に照らし、Ａを追って自発的に元社員に移った旨の上記各陳述に、不自然、不合理なところはなく、その信用性は高いものと認められる。\n 　これらの事情の下においては、元社員に移籍した会社側の従業員は、Ａを信頼し又はＣに不満を抱き、自発的に元社員に移籍したものと認めるのが実態に沿うものというべきであり、Ａが上記従業員に対して元社員への移籍を勧誘したものと認めるのは相当ではない。\n\nつまり「みんな自分で決めて移ったんだから勧誘とは違う」という判断。\n\n裁判所、めっちゃ冷静。好き。\n\n「Ｃさんに不満があった」という事情まで読んで、「これは勧誘じゃない」と言い切るの、結構すごいですよね。\n\n顧客切替の勧誘（６項後段）についても、もともと会社側との取引がなかった顧客が多かったなどとして、違反は認められませんでした。\n\n結果として、会社側の請求はほぼ認められませんでした。1億円の請求、全部です。","takeaway":"で、結局なにが大事なの？\n\n- 「秘密管理性」は制度として作る。 「秘密です」と口で言うだけじゃ法的に守られない。アクセス制限・ラベリング・誓約書がセット\n- プログラムの著作物性は「選択の幅」で決まる。 ロジックが一通りしかない場合、著作物として認められないことがある\n- 合意書は具体的に書くほど強い。 「情報を持ち出さない」だけじゃ広すぎる。何が対象かを明示しないと抜け穴になる\n- 人が辞めるとき、引き止めは難しい。 「自分の意思で行った」と言われたらほぼ負け\n\n今気づいたんですけどこの記事、けっこう長くないですか。でも大事なとこだったので許してください。","one_liner":"「秘密」は管理してはじめて秘密になる。言うだけじゃ呪文と同じ。","parties":[{"role":"会社側","icon":"🏢","side":"plaintiff","desc":"IT会社"},{"role":"元社員","icon":"👤","side":"defendant","desc":"競合IT会社"}],"lessons":["契約書読んどけば…","秘密は管理してナンボ","辞め方を間違えた"]},{"original_title":"知財高判令4.7.13（システム全体の著作物性）","url":"https://itlaw.hatenablog.com/entry/2024/07/14/153347","court":"知財高判","date":"令4.7.13","year":"令和4年（2022年）","topic":"システム全体の著作物性","categories":["著作権","プログラム・システム"],"fun_headline":"【衝撃】「俺が設計したシステム、著作物じゃないの？」→ 裁判所「ないです」","hook":"ちょっと待ってこれ聞いたら驚くから。\n\nあなたが丹精込めて設計したシステム、著作権で守られると思いますか。\n\n「そりゃそうでしょ、俺の頭から生まれたんだし」って思いますよね。\n\n僕もそう思ってました。でも裁判所は「技術的アイデアの集合体にすぎない」って言い放ったんですよ。\n\nエンジニアの方、これは他人事じゃないです。聞いてください。","summary":"・テーマ: システム全体の著作物性\n・著作権がらみの争い","what_happened":"状況を整理しますね。\n\n福井県が、自然保護センターの展示工事を第三者さんという業者に委託しました。その中にはインターネット展示システムの構築も含まれていて、権利者が第三者さんの下請けとしてその仕事をしたわけです。\n\nその後、福井県側は権利者に対して、ウェブサーバ設備の更新に伴う保守委託、機器購入、環境構築、システム移行業務などを発注しました。\n\nここで僕の話をさせてほしいんですけど、「下請けで仕事して、のちに直接発注してもらえる」って、けっこう夢のある展開じゃないですか。僕が学生時代にバイトしてたラーメン屋では絶対そんなことなかった。話を戻します。\n\n権利者は、新しいインターネット展示システムを構築して、2010年3月ごろに福井県側に納品しました。\n\nで、福井県側がホームページのリニューアルをするときに、ルータの設定を変えて80番ポートを閉鎖した。さらにＡＤＳＬ回線のモジュラージャックを取り外した（これを「本件引抜行為」と呼ぶ）。\n\nちなみに全然関係ないけど、「モジュラージャックを引き抜く」って行為、やけに生々しくないですか。物理的に引っこ抜くんですよ。\n\n権利者はこれを「私が作ったシステムへの著作者人格権侵害だ！」と主張して、差止請求と損害賠償を求めて裁判を起こしました。\n\n【ちょっと解説】著作者人格権── 著作権とはまた別のもの。「俺の作品を勝手に改変するな」という権利。お金の問題じゃなくて、作者の名誉・意図に関わる権利。","issue":"要するに何が問題だったの？\n\nここテストに出ます。一行で言います。\n\n「このシステム全体って著作物なの？」\n\nこれだけです。でもこれが深い。\n\n【ちょっと解説】著作物性── 「それ、著作権で保護される『著作物』ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\n権利者の主張はこうです。「ソフトウェアやハードウェアの選択・組み合わせを私がやったんだから、私の個性が出てるでしょ。著作物でしょ。」\n\nわかる。めっちゃわかる。そう思うよ。\n\nでも裁判所の答えはNOでした。","ruling":"裁判所、こう言いました。\n\n一審（大阪地判）も控訴審（知財高判）も、同じ方向で著作物性を否定しました。\n\n権利者は、本件展示システム全体に著作物性があるとして、システムの機能を実現するための設計・構築については、権利者による選択の幅が広く、どのようなソフトウェアやハードウェアを用い、それらをどのような構成で組み合わせ、どのように機能分担させるかに関する選択（必要機能の選定、機能分割設計、分割した機能単位の配置計画という設計行為）は、権利者の技術者としての知識や経験が表出したものであるから、思想又は感情の創作的な表現である旨を主張する。\n\nしかし、本件展示システムについて求められる機能のほか、基本的な構成やその構築に当たっての要件等は、本件購入仕様書及び本件構築仕様書において相応に具体的に定められており、権利者による選択は、あくまでそれらの制約の中で行われるものである。また、本件展示システムは、公営の自然保護センターである本件センターにおける展示のためのインターネットに接続されるシステムであり、その性質上、システムの設計・構成については、あくまで円滑かつ安定した展示に資するとともにセキュリティ対策についても必要十分なものとするといった、その実用品としての機能を発揮させるべく、専ら技術的観点から行われるものと考えられる。そして、設計され構築される本件展示システムは、実用的な工業製品である個々のハードウェアやその設定、ハードウェア間やインターネットとの間の接続、ソフトウェアといった個別的な要素の集合体として構成され、またそのような集合体として通常は観念されるもので、その全体が一まとまりに表現されたものとして存在するものともいい難い（略）。\n\nこの後、さらに追い打ちをかけるようにこう言います。\n\n上記の点を考慮すると、権利者が主張する本件展示システムの設計・構築に当たっての選択は、基本的に、上記の制約等の下で特定の機能を果たすべきシステムの設計・構築を合理的に行おうとした際に考え得る技術上のアイディア又は個々のアイディアの集合体にすぎず、法２条１項１号にいう「思想又は感情を創作的に表現したもの」には当たらないというべきである。そして、本件全証拠をもってしても、本件展示システムについて、上記と異なって、権利者の思想又は感情が創作的に表現されているといえるような特徴を有するものであるというべき事情は認められない。\n\n「技術上のアイデアの集合体にすぎない」。\n\n権利者の気持ち、わかる。めっちゃわかる。つらい。\n\n要するに裁判所が言ってることは「仕様書に制約された中でやってるんだから、あなたの創作的な表現とは言えない」ということ。\n\nこれ、ラーメン屋さんに「このラーメンの具材の組み合わせ、俺のオリジナルだから著作権ある」と言ったら「そのレシピ、もともとうちが出した指示通りに作ってるじゃないですか」って言われたようなもんですよ。","takeaway":"で、結局なにが大事なの？\n\n- 「選択の幅」がなければ著作物にならない。 仕様書で縛られた設計は「技術的アイデア」扱いになる\n- システム全体を著作物として守るのは難しい。 個々のプログラムコードの方が著作物性を認めてもらいやすい\n- 著作権だけに頼らず契約書で権利を明確にしろ。 「納品したシステムの所有権・利用権がどちらにあるか」を最初に決めておく\n- 「俺が作った」は感情、「俺の著作物だ」は法律。 この二つは別物\n\nあ、今思い出したんですけど、コードそのものの著作物性は認められやすいです。ソースコードをそのままコピーされたら戦えます。「システム全体の設計思想」は難しい、ということ。","one_liner":"エンジニアの頭の中にあるものは著作物じゃない。コードに書いてはじめて著作物になる可能性がある。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"システム開発会社"},{"role":"下請業者","icon":"🔧","side":"third","desc":""}],"lessons":["証拠がないと詰む","著作権は万能じゃない"]},{"original_title":"東京地判令4.6.22（検収がない場合の報酬請求可否）","url":"https://itlaw.hatenablog.com/entry/2024/04/06/104052","court":"東京地判","date":"令4.6.22","year":"令和4年（2022年）","topic":"検収がない場合の報酬請求可否","categories":["契約・報酬"],"fun_headline":"【全エンジニア必読】「検収してないからお金払わない」は通用するのか、裁判所に聞いた結果","hook":"IT開発で「納品はしたけど検収してもらえない」「検収がないから代金払わない」って言われるやつ、ありますよね。\n\n実はこれ、裁判になった事例があります。\n\n結論から言うと「検収しなくても、ちゃんと納品してれば代金払え」という判断が出ました。\n\nでも話はそんなに単純じゃないので、最後まで聞いてください。","summary":"・絡んでる金額: 1586万円\n・テーマ: 検収がない場合の報酬請求可否\n・契約とお金の話","what_happened":"登場人物を整理します。\n\nＭ社というところが「モバイルでエアコン操作できるＩｏＴシステムを作りたい」と言い出した。開発側（被告）がその開発を請け負って、さらに発注側（原告）にシステム設計を投げた。つまり、Ｍ→開発側→発注側という構造です。\n
