<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x2696;</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --yellow:#FFE135;--pink:#FF6B9D;--blue:#4ECDC4;--orange:#FF8C42;
  --purple:#A855F7;--green:#22C55E;--red:#EF4444;--navy:#1E293B;
  --bg:#FFF9E6;--card-bg:#FFF;--text:#1E293B;--muted:#6B7280;
}
body{
  font-family:'Zen Maru Gothic','Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.8;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
#app{min-height:100vh}
.view{animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ======== HERO ======== */
.hero{background:linear-gradient(135deg,var(--yellow) 0%,#FFB347 50%,var(--orange) 100%);padding:2.5rem 1rem 3.5rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:repeating-linear-gradient(45deg,transparent,transparent 22px,rgba(255,255,255,.06) 22px,rgba(255,255,255,.06) 44px);animation:stripe 30s linear infinite}
@keyframes stripe{to{transform:translateX(62px)}}
.hero-in{position:relative;z-index:1}
.hero h1{font-size:clamp(1.8rem,5.5vw,3.5rem);font-weight:900;letter-spacing:.03em;text-shadow:3px 3px 0 rgba(0,0,0,.07);margin-bottom:.15em}
.hero h1 .g{display:inline-block;animation:bang 2.5s ease-in-out infinite}
@keyframes bang{0%,100%{transform:rotate(0)}10%{transform:rotate(-18deg)}20%{transform:rotate(4deg)}30%{transform:rotate(0)}}
.hero .sub{font-size:clamp(.8rem,2vw,1.15rem);font-weight:500;opacity:.78;margin-bottom:1.3rem}
.stats{display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.82);border-radius:50px;padding:.4rem 1rem;font-weight:700;font-size:.85rem;box-shadow:2px 2px 0 rgba(0,0,0,.05)}
.stat b{color:var(--red);font-size:1.1em}
.wave{background:linear-gradient(135deg,var(--yellow),#FFB347,var(--orange));margin-top:-1px}
.wave svg{display:block;width:100%;height:auto}

/* ======== FILTERS ======== */
.fwrap{max-width:1200px;margin:-1rem auto 1.2rem;padding:0 1rem;position:relative;z-index:10}
.fcard{background:var(--card-bg);border-radius:18px;padding:1.2rem;box-shadow:0 6px 25px rgba(0,0,0,.06);border:3px solid var(--yellow)}
.search{display:none}
.fr{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.5rem}.fr:last-child{margin-bottom:0}
.fl{font-weight:700;font-size:.78rem;padding:.3rem .6rem;white-space:nowrap;display:flex;align-items:center}
.fb{padding:.3rem .85rem;border:2px solid #E5E7EB;border-radius:50px;background:#fff;font-family:inherit;font-size:.78rem;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.fb:hover{border-color:var(--orange);transform:translateY(-1px)}.fb.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.rc{text-align:center;font-weight:700;font-size:1rem;margin:1rem 0;color:var(--muted)}.rc b{color:var(--red);font-size:1.2em}

/* ======== CARDS ======== */
.cw{max-width:1200px;margin:0 auto;padding:0 1rem 3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem}
.card{background:var(--card-bg);border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.04);transition:all .3s cubic-bezier(.4,0,.2,1);cursor:pointer;display:flex;flex-direction:column;border-left:5px solid transparent}
.card:hover{transform:translateY(-4px) scale(1.005);box-shadow:0 10px 30px rgba(0,0,0,.09)}
.card .top{padding:1rem 1rem .4rem;display:flex;justify-content:space-between;align-items:flex-start;gap:.4rem}
.card .yr{background:var(--navy);color:#fff;padding:.12rem .6rem;border-radius:50px;font-size:.7rem;font-weight:700;white-space:nowrap;flex-shrink:0}
.card .ct{font-size:.75rem;color:var(--muted);font-weight:500}
.card .mid{padding:0 1rem .4rem;flex:1}
.card .hl{font-size:.95rem;font-weight:700;line-height:1.55;margin-bottom:.25rem}
.card .ol{font-size:.8rem;color:var(--muted);line-height:1.5;font-style:italic}
.card .tags{padding:0 1rem .7rem;display:flex;flex-wrap:wrap;gap:.3rem}
.tag{font-size:.65rem;font-weight:700;padding:.12rem .5rem;border-radius:50px;white-space:nowrap}
.card .rm{display:block;padding:.55rem;background:#F9FAFB;text-align:center;font-size:.8rem;font-weight:700;color:var(--orange);border-top:1px solid #F3F4F6;transition:background .2s}
.card:hover .rm{background:#FFF7ED}

/* 教訓タグ */
.ltag{font-size:.62rem;font-weight:700;padding:.15rem .55rem;border-radius:50px;white-space:nowrap;background:#FEF3C7;color:#92400E;border:1.5px solid #FCD34D}
.fb.lb{border-color:#FCD34D;background:#FFFBEB;color:#92400E;font-size:.72rem}.fb.lb:hover{border-color:#F59E0B;background:#FEF3C7}.fb.lb.on{background:#F59E0B;color:#fff;border-color:#D97706}
.ltag.lclick{cursor:pointer;transition:all .2s}.ltag.lclick:hover{background:#FCD34D;transform:translateY(-1px)}
.ltags{display:flex;flex-wrap:wrap;gap:.3rem;padding:0 1rem .5rem}
.les-row{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#FCD34D transparent;padding-bottom:.2rem}
.les-row::-webkit-scrollbar{height:3px}
.les-row::-webkit-scrollbar-thumb{background:#FCD34D;border-radius:2px}
.fr+.fr{border-top:1px solid #F3F4F6;padding-top:.5rem}

.t-copy{background:#DBEAFE;color:#1D4ED8}.t-prog{background:#D1FAE5;color:#065F46}
.t-cont{background:#FEF3C7;color:#92400E}.t-sec{background:#EDE9FE;color:#5B21B6}
.t-priv{background:#FCE7F3;color:#9D174D}.t-pm{background:#FFEDD5;color:#C2410C}
.t-hack{background:#FEE2E2;color:#991B1B}.t-cry{background:#E0E7FF;color:#3730A3}
.t-tos{background:#F0FDF4;color:#166534}.t-bug{background:#FFF7ED;color:#9A3412}
.t-lia{background:#FEF2F2;color:#B91C1C}.t-net{background:#F0F9FF;color:#0369A1}
.t-etc{background:#F3F4F6;color:#374151}

.card:nth-child(13n+1){border-left-color:var(--pink)}.card:nth-child(13n+2){border-left-color:var(--blue)}
.card:nth-child(13n+3){border-left-color:var(--orange)}.card:nth-child(13n+4){border-left-color:var(--purple)}
.card:nth-child(13n+5){border-left-color:var(--green)}.card:nth-child(13n+6){border-left-color:var(--yellow)}
.card:nth-child(13n+7){border-left-color:var(--red)}.card:nth-child(13n+8){border-left-color:#F472B6}
.card:nth-child(13n+9){border-left-color:#06B6D4}.card:nth-child(13n+10){border-left-color:#FB923C}
.card:nth-child(13n+11){border-left-color:#C084FC}.card:nth-child(13n+12){border-left-color:#34D399}
.card:nth-child(13n){border-left-color:#FBBF24}

.empty{text-align:center;padding:3.5rem 1rem;color:#9CA3AF}.empty .big{font-size:3.2rem;margin-bottom:.7rem}.empty p{font-size:1rem;font-weight:500}

/* ======== DETAIL ======== */
.dh{background:linear-gradient(135deg,var(--navy) 0%,#334155 100%);color:#fff;padding:1.8rem 1rem 2.2rem;position:relative;overflow:hidden}
.dh::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 30px,rgba(255,255,255,.025) 30px,rgba(255,255,255,.025) 60px)}
.din{max-width:800px;margin:0 auto;position:relative;z-index:1}
.back{display:inline-flex;align-items:center;gap:.3rem;color:rgba(255,255,255,.65);font-size:.85rem;font-weight:500;margin-bottom:.8rem;transition:color .2s;cursor:pointer;background:none;border:none;font-family:inherit}
.back:hover{color:#fff}
.dcats{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.6rem}.dcats .tag{font-size:.72rem;padding:.18rem .65rem}
.dh h1{font-size:clamp(1.4rem,3.8vw,2.1rem);font-weight:900;line-height:1.45;margin-bottom:.6rem}
.dm{font-size:.85rem;opacity:.6}.dm span{margin-right:.8rem}

/* ======== 当事者カード ======== */
.pvs{display:flex;justify-content:center;align-items:stretch;gap:0;margin:1.8rem 0 2rem}
.pc{flex:1;min-width:0;padding:1.3rem 1rem;text-align:center}
.pc.pl{background:linear-gradient(160deg,#EFF6FF 0%,#DBEAFE 100%);border-radius:16px 0 0 16px;border:2px solid #93C5FD;border-right:1px dashed #93C5FD}
.pc.df{background:linear-gradient(160deg,#FEF2F2 0%,#FEE2E2 100%);border-radius:0 16px 16px 0;border:2px solid #FCA5A5;border-left:none}
.pc .icon{font-size:2.2rem;margin-bottom:.3rem}
.pc .role{font-weight:900;font-size:1.05rem;line-height:1.3;color:var(--navy)}
.pc .desc{font-size:.85rem;margin-top:.35rem;line-height:1.5;font-weight:600}
.pc.pl .desc{color:#1E40AF}
.pc.df .desc{color:#991B1B}
.pc .side{font-size:.6rem;font-weight:700;margin-top:.45rem;padding:.15rem .65rem;border-radius:50px;display:inline-block;letter-spacing:.08em}
.pc.pl .side{background:#BFDBFE;color:#1E40AF}
.pc.df .side{background:#FECACA;color:#991B1B}
.pvs-mid{display:flex;align-items:center;justify-content:center;width:52px;flex-shrink:0;background:linear-gradient(180deg,#DBEAFE 0%,#F5F3FF 50%,#FEE2E2 100%);font-weight:900;font-size:.85rem;color:var(--navy);letter-spacing:.05em;border-top:2px solid #93C5FD;border-bottom:2px solid #FCA5A5}
/* 3名以上の関係図 */
.pdiag{background:var(--card-bg);border-radius:16px;padding:1.4rem;margin:1.8rem 0 2rem;box-shadow:0 4px 16px rgba(0,0,0,.05);border:2px solid #E5E7EB}
.pdiag-title{font-size:.8rem;font-weight:900;color:var(--navy);margin-bottom:1rem;text-align:center}
.pdiag-nodes{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem}
.pnode{padding:.7rem 1rem;border-radius:12px;text-align:center;font-weight:700;min-width:100px;border:2px solid;font-size:.85rem}
.pnode.n0{background:#DBEAFE;border-color:#3B82F6;color:#1E40AF}
.pnode.n1{background:#FEE2E2;border-color:#EF4444;color:#991B1B}
.pnode.n2{background:#FEF3C7;border-color:#F59E0B;color:#92400E}
.pnode.n3{background:#D1FAE5;border-color:#10B981;color:#065F46}
.pnode .pn-role{font-size:.72rem;font-weight:500;margin-top:.25rem;opacity:.8}
.pdiag-rels{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem;margin-top:.7rem}
.prel{font-size:.72rem;color:var(--muted);background:#F3F4F6;padding:.2rem .65rem;border-radius:50px;font-weight:500}

.srclink{display:flex;align-items:center;justify-content:center;gap:.4rem;margin:1.5rem 0;padding:.7rem 1rem;background:#F8FAFC;border:2px solid #E2E8F0;border-radius:12px;font-size:.82rem;font-weight:600;color:#475569;transition:all .2s;text-decoration:none}
.srclink:hover{border-color:var(--orange);background:#FFF7ED;color:var(--orange)}
.srclink .src-icon{font-size:1rem}
.art{max-width:800px;margin:0 auto;padding:2rem 1rem 3.5rem}
.hookbox{background:linear-gradient(135deg,#FFF7ED,#FFFBEB);border-radius:16px;padding:1.4rem 1.5rem;margin-bottom:2rem;font-size:1.05rem;font-weight:500;line-height:2;border-left:5px solid var(--orange);white-space:pre-line}
.sh{font-size:1.2rem;font-weight:900;margin:2.2rem 0 .8rem;padding-left:.75rem;border-left:5px solid var(--orange);display:flex;align-items:center;gap:.4rem}
.sh .ic{font-size:1em}
.sbox{background:var(--card-bg);border-radius:14px;padding:1.2rem 1.3rem;box-shadow:0 3px 12px rgba(0,0,0,.04);margin-bottom:.8rem}
.sbox ul{list-style:none;padding:0}.sbox li{padding:.35rem 0;padding-left:1.4rem;position:relative;line-height:1.75}
.sbox li::before{content:'';position:absolute;left:0;top:.8rem;width:7px;height:7px;background:var(--orange);border-radius:50%}
.bt{font-size:1rem;line-height:2;margin-bottom:.8rem}
.cq{background:linear-gradient(135deg,#F0F4F8,#E8EDF2);border:none;padding:1.2rem 1.3rem 1rem;margin:1.2rem 0;border-radius:14px;font-size:.88rem;line-height:1.9;color:#334155;position:relative;box-shadow:inset 0 2px 8px rgba(0,0,0,.04)}
.cq::before{content:'📜 裁判所の原文がこちら';display:block;font-size:.78rem;font-weight:900;color:#475569;margin-bottom:.5rem;padding-bottom:.4rem;border-bottom:1px solid #CBD5E1}
.cq::after{content:'※ 裁判所の判決文から引用（原文のまま）';display:block;font-size:.6rem;color:#94A3B8;margin-top:.4rem;text-align:right;font-style:italic}

/* 永田リアクション */
.reaction{background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border-radius:12px;padding:.8rem 1.2rem;margin:1.2rem 0;font-weight:700;font-size:1rem;color:#92400E;border:2px dashed #FCD34D;text-align:center;position:relative;transform:rotate(-.3deg)}
.reaction::after{content:'';position:absolute;top:-6px;left:1.5rem;width:12px;height:12px;background:#FFFBEB;border-left:2px dashed #FCD34D;border-top:2px dashed #FCD34D;transform:rotate(45deg)}

/* 法律用語解説ボックス */
.glossary{background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-radius:12px;padding:.9rem 1.1rem;margin:.8rem 0;font-size:.88rem;line-height:1.8;color:#1E40AF;border-left:4px solid #3B82F6}
.glossary::before{content:'📖 ちょっと解説';display:block;font-size:.72rem;font-weight:900;color:#2563EB;margin-bottom:.2rem}

.tkbox{background:linear-gradient(135deg,#ECFDF5,#F0FDF4);border-radius:16px;padding:1.3rem 1.4rem;margin:2rem 0;border:2px dashed var(--green)}
.tkbox h3{font-size:1.05rem;font-weight:900;color:#065F46;margin-bottom:.6rem}
.tkbox .items{white-space:pre-line;line-height:2;font-size:.95rem}
.olbox{text-align:center;padding:2.2rem 1.5rem;margin:2.5rem 0;background:linear-gradient(135deg,#FEF3C7 0%,#FFFBEB 50%,#FEF3C7 100%);border-radius:20px;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(251,191,36,.15)}
.olbox::before{content:'💬';position:absolute;top:-.2rem;left:50%;transform:translateX(-50%);font-size:2rem;opacity:.3}
.olbox .q{font-size:clamp(1.1rem,3vw,1.4rem);font-weight:900;font-style:italic;line-height:1.7;color:var(--navy);letter-spacing:.02em}
.olbox .lb{font-size:.78rem;color:var(--muted);margin-top:.6rem;font-weight:500}

.cnav{display:flex;justify-content:space-between;gap:.8rem;margin:2.5rem 0 .8rem;flex-wrap:wrap}
.nb{flex:1;min-width:130px;padding:.7rem .9rem;border-radius:12px;background:var(--card-bg);border:2px solid #E5E7EB;cursor:pointer;transition:all .2s;font-family:inherit;text-align:left}
.nb:hover{border-color:var(--orange);background:#FFF7ED}.nb.nx{text-align:right}
.nb .dir{font-size:.72rem;color:var(--muted);font-weight:700}
.nb .nt{font-size:.82rem;font-weight:700;margin-top:.15rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

footer{background:var(--navy);color:#fff;text-align:center;padding:2rem 1rem}
footer a{color:var(--yellow);text-decoration:none}footer a:hover{text-decoration:underline}
footer p{margin-bottom:.3rem;font-size:.85rem;opacity:.7}

.rpbar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--orange),var(--pink));z-index:200;transition:width .1s;width:0}
.stt{position:fixed;bottom:1.5rem;right:1.5rem;width:46px;height:46px;border-radius:50%;background:var(--orange);color:#fff;border:none;font-size:1.3rem;cursor:pointer;box-shadow:0 3px 12px rgba(255,140,66,.3);transition:all .3s;opacity:0;pointer-events:none;z-index:100}
.stt.vis{opacity:1;pointer-events:auto}.stt:hover{transform:scale(1.08)}

.gacha{display:inline-block;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:none;padding:.55rem 1.4rem;border-radius:50px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .3s;box-shadow:2px 2px 0 rgba(0,0,0,.08);margin-top:.8rem}
.gacha:hover{transform:scale(1.06) rotate(-2deg);box-shadow:4px 4px 0 rgba(0,0,0,.12)}
.gacha:active{transform:scale(.96)}
.share-wrap{display:flex;gap:.5rem;justify-content:center;margin:1.5rem 0}
.share-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.45rem 1rem;border-radius:50px;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;border:2px solid;transition:all .2s}
.share-x{background:#000;color:#fff;border-color:#000}.share-x:hover{background:#333}
.share-copy{background:#fff;color:var(--navy);border-color:#E5E7EB}.share-copy:hover{border-color:var(--orange);background:#FFF7ED}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy);color:#fff;padding:.6rem 1.5rem;border-radius:50px;font-size:.85rem;font-weight:700;z-index:200;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:700px){
  .grid{grid-template-columns:1fr}.fb{font-size:.72rem;padding:.25rem .65rem}
  .stats{gap:.35rem}.stat{padding:.3rem .65rem;font-size:.75rem}
  .art{padding:1.2rem .7rem 2.5rem}.cnav{flex-direction:column}
}
</style>
</head>
<body>
<div id="rpbar" class="rpbar"></div>
<div id="app"></div>

<script>
const C=[{"original_title":"大阪地判令8.1.22（限定提供データ該当性）","url":"https://itlaw.hatenablog.com/entry/2026/02/21/115036","court":"大阪地判","date":"令8.1.22","year":"令和8年（2026年）","topic":"限定提供データ該当性","categories":["その他"],"fun_headline":"【悲報】「うちのデータ盗まれた！」→ 裁判所「そもそもあなたのデータじゃないです」","hook":"パチンコの出玉データを誰でも無料で見られるサイトがあるとして、そのデータをbotで根こそぎ取っていった人がいて、でもいざ訴えたら「それ、あなたのデータじゃないですよ」って裁判所に言われた、っていう話があるんですよ。\n\nちょっと待って。じゃあ誰のデータなの？\n\nこれ、「限定提供データ」っていう法律の話なんですけど、知らないとマジで怖いやつです。","summary":"・テーマ: 限定提供データ該当性","what_happened":"パチンコホール向けに情報サービスを提供してる会社（原告側）があったんですよ。\n\nそこが持ってる台データ、つまりパチンコ台の出玉グラフとかそういうやつ、これを何者かがbotで根こそぎ取っていった。\n\n怒った原告側は、その記事が投稿されたサイトの管理者（被告側）に「誰が投稿したか教えろ」って発信者情報の開示を求めたわけです。\n\nここで僕の話をさせてほしいんですけど、僕がこういうサービスを運営してたら、botにデータ全部持ってかれた時点で3日は寝込むと思うんですよね。でも寝込む前にまず弁護士に電話しないといけない。それがつらい。話を戻します。\n\n補助参加人第三者は「その投稿、俺がしました」って手を挙げて参加してきて、大阪地方裁判所は令和7年6月30日、申立てを全部却下。\n\nえっ、なんで？\n\n原告側は「却下はおかしい！」と異議を申し立てて、今回の裁判になりました。\n\nで、このサービスの台データって、パチンコホール運営会社が自分のサイトに貼り付けて集客に使えるやつなんですよ。閲覧するには利用規約への同意が必要。でも、ユーザー登録も認証も不要で、しかも無料で見られた。\n\nちなみに全然関係ないんですけど、利用規約に同意ってクリックするとき、内容を読んでる人って世界に何人いるんでしょうね。僕はほぼ読まない。あ、読みましょうね。読みましょう。\n\nで、一応botによるアクセスを防ぐために「Cloudflare Turnstile」（ＣＴ）というツールが入ってた。でも第三者はそれを回避してbotでデータを取りまくった。","issue":"で、結局何が問題だったの？\n\n争点はひとつです。このシンプルさが逆に怖い。\n\n台データは「限定提供データ」に当たるの？ 当たらないの？\n\n【ちょっと解説】限定提供データ── 2018年の不競法改正で新設された概念。特定の人にだけ提供されるデータ（有料データベースなど）を不正取得から保護する。\n\n「限定提供データ」として認められるためには、ざっくり3つの要件が必要なんですよ。\n\n(a) 限定提供性　→　特定の人にだけ提供されてる\n(b) 電磁的管理性　→　「特定の人向けです」ってわかるように管理されてる\n(c) 相当量蓄積性　→　そこそこの量がある\n\nここテストに出ます。今回は(a)と(b)が争点になりました。","ruling":"さあ裁判所の答えです。容赦ないやつが来ます。\n\n限定提供性について、裁判所はこう言いました。\n\n原告側が保有する台データを閲覧するためには、本件利用規約への同意とＣＴによる検証を通過する必要こそあるものの、ユーザー登録を求めるなどのデータにアクセスする者を特定、限定するための措置などが講じられているわけではなく、上記台データは、その提供相手を誰とするかについて、原告側の選択や裁量が入る余地のないまま、インターネット上で上記同意等の手続に応じさえすれば、何人たりとも無償で提供を受けることのできる情報であるところ、そもそも、不特定の者に提供されている情報であって、「特定の者」に対して提供されている情報とはいえない。\n\nつまりこういうことです。「誰でも見られるものは『特定の人向け』じゃない。」\n\n裁判所、めっちゃ冷静。好き。\n\n電磁的管理性についても同じ方向で攻めてきます。\n\nデータ保有者がデータを提供する際に、特定の者に対して提供するものとして管理する意思が外部に対して明確化され、第三者が認識できるようにされている必要があると解されるところ、上記のとおり、本件の台データは、そもそも、「特定の者」に対して提供されている情報とはいえないから、そのような管理の意思が外部に対して明確化されているものではなく、電磁的管理性の前提を欠くものといえる。\n\nさらにダメ押し。ＣＴ（botブロックツール）を入れてたことについてはこう言ってます。\n\n「botのアクセス制限をしていることが『者』を限定することにはならない。」\n\n今気づいたんですけど、ここがいちばんヤバいポイントかもしれない。botを排除しても、それは「人間全員OKです」ってことだから「特定の者」にはならない、という話なんですよ。意味がわかる？ わかる？ 僕は最初「え？」ってなりました。\n\n結果、台データは限定提供データに該当しないとして、申立てを却下した原決定は正しかった、はい、裁判所はこう言いました。以上。","takeaway":"で、結局なにが大事なの？\n\n・「誰でも見られるデータ」は「限定提供データ」として保護されない。無料公開した時点で「限定」じゃない\n・botブロック（Cloudflare等）は「限定管理」の証拠にならない。「人間限定」にしても「特定の者限定」にはならない\n・データを本当に限定提供データとして守りたいなら、ユーザー登録・認証・アクセス管理が必須\n・「うちのデータです」と主張したいなら、「誰がアクセスできるか」を明確にコントロールすること\n\n要するに：鍵をかけてない部屋のものは「私の秘密の荷物」とは呼べない。以上。","one_liner":"無料で誰でも見られるデータを「俺だけのデータ」とは呼ばない。裁判所に言われる前に気づこう。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"情報サービス会社"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"サイト管理者"},{"role":"第三者","icon":"👥","side":"third","desc":""},{"role":"参加人","icon":"👥","side":"third","desc":""}],"lessons":["規約、読んだ？","秘密は管理してナンボ"]},{"original_title":"東京高判令7.9.25（PM義務違反と協力義務違反双方が認められた例）","url":"https://itlaw.hatenablog.com/entry/2025/12/28/151328","court":"東京高判","date":"令7.9.25","year":"令和7年（2025年）","topic":"PM義務違反と協力義務違反双方が認められた例","categories":["PM・開発管理"],"fun_headline":"【実話】7億円のシステム開発が崩壊した。ベンダーが悪い？ 発注側が悪い？ 裁判所の答えが「両方」だった件","hook":"ちょっと待ってこれ聞いたら驚くから。\n\nシステム開発の契約金が約2.7億円で、うまくいかなくて、お互い訴え合って、最終的に請求額が合計13億円超えた裁判があるんですよ。\n\n開発費の5倍。\n\nプロジェクトマネージャーのみなさん、今日も元気に生きてますか。今日の話、人ごとじゃないです。","summary":"・絡んでる金額: 7億円\n・テーマ: PM義務違反と協力義務違反双方が認められた例\n・プロジェクト管理の問題","what_happened":"順を追って説明しますね。ちょっと長いけど読んで。\n\n独立行政法人発注側が、開発側に対して基幹システムの開発を約2.7億円で委託した。稼働予定は2019年3月。2018年1月に契約締結。\n\n要件定義も基本設計も終わって、詳細設計・製造・テストと進んでいったんですが、遅延が発生した。\n\nここ、エンジニアなら「あ〜……」ってなるとこですよね。あのね、遅延が発生したとき、現場の人間はたいてい知ってるんですよ。でも報告書には「進捗良好」って書いてある。あれ何なんですかね。話を戻します。\n\n2019年3月、稼働判定の報告書が出て「品質面においてリスクが残存するため条件付き合格」。条件付き。微妙な言葉ですよね。条件付き合格ってのは要するに「ギリギリ通った、でも怖い」ってことです。\n\n同月、契約を変更して稼働支援期間を7月まで延ばすことに合意。\n\n2019年5月、発注側は開発側に約2.56億円を支払った。\n\nその後も不具合解消しながら稼働時期を何度も延長していたが、結局本稼働には至らず。\n\n2020年2月、開発側が「発注側の担当者にハラスメントを受けた」として担当者を現場から引き上げた。発注側はこれを受けて催告のうえ契約を解除。\n\nあ、今思い出したんですけど、「ベンダーがハラスメントを理由に撤退する」ってパターン、IT系の訴訟で最近増えてる気がするんですよね。それだけ現場がひどいってことかもしれない。辛い話です。\n\n発注側は7億円超の返還・損害賠償を請求。開発側も発注側に6億円超を請求。ハラスメントで3000万円も。\n\n原審（東京地裁）では、開発側の発注側への支払いが約3.36億円、発注側の開発側への支払いが約2.18億円と認定された。\n\n両方が両方に払え、という判決。意味がわかりますか。喧嘩両成敗、だけど金額がハンパじゃない。\n\n【ちょっと解説】協力義務── ユーザ（発注側）がベンダに適切に協力する義務。要件を決めない、レビューしない、連絡を無視する──こういうのは義務違反になりうる。\n\n今回は高裁の判断です。","issue":"要するに何が問題だったの？\n\nシステムが完成しなかったことについて、誰がどれだけ悪いか。\n\n開発側のPM義務違反。つまり「ちゃんとプロジェクト管理しろよ」。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\n発注側の協力義務違反。つまり「発注側もちゃんと協力しろよ」。\n\nあと、開発側が発注側に追加で請求できる損害の金額。\n\nここテストに出ます。「ベンダーが悪い」「発注側が悪い」どちらか一方ではなく、両方に責任があると認められた、というのがこの裁判のポイントです。","ruling":"高裁、こう言いました。\n\n原審の判断を引き継ぎつつ、開発側の損害額について整理しました。\n\n裁判所は、開発側が派遣企業に支払った約1.8億円を認定したうえで、「変更前の期間分はすでに報酬のやりとりで考慮済みだから、発注側の義務違反で生じた損害は変更後の期間（10カ月）分だけ」という計算をしました。\n\n元の契約が14カ月分だったから、その14分の10で1.83億円が損害、という算数ですね。\n\n裁判所、めっちゃ計算する。好き。\n\n外部専門家への委託費用は半額の約830万円のみ認定。セールスフォースのライセンス料は認められなかった。\n\nで、互いの請求を相殺したら、残額として開発側が発注側に約1.1億円を支払え、という結論になりました。\n\n元の請求が7億円超えてたの、覚えてますか。最終的に1.1億円。この差が「裁判って大変だ」を物語ってる気がします。","takeaway":"で、結局なにが大事なの？\n\n・「稼働しなかった＝ベンダーが全部悪い」は通用しない。発注側にも協力義務がある\n・「条件付き合格」は危険信号。その場でちゃんと合否基準を詰めないと後で地獄になる\n・ハラスメントは証拠になる。現場の人間関係トラブルが裁判の争点に直結する\n・解除は最終手段。要件を満たさない解除は逆に自分が不利になることがある\n\nPMの仕事は炎上したときに初めてその本質がわかる。でも気づいたときにはもう遅いことが多い。","one_liner":"炎上プロジェクトに被害者はいない。関わった全員がどこかで間違えてる。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"独立行政法人"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ITベンダ"}],"lessons":["「完成」って何？","PM不在の悲劇","損害、証明できる？"]},{"original_title":"東京地判令7.5.21（竜王戦棋譜配信行為と不法行為の成否）","url":"https://itlaw.hatenablog.com/entry/2026/02/28/142447","court":"東京地判","date":"令7.5.21","year":"令和7年（2025年）","topic":"竜王戦棋譜配信行為と不法行為の成否","categories":["責任・損害","ネット・コンテンツ"],"fun_headline":"【衝撃】将棋の棋譜って著作権ないの？→ でも1600万円の賠償請求が来た話","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n将棋の棋譜（どの駒をどこに動かしたかの記録）って、著作権がないんですよ。法律上は。\n\nじゃあ自由に使っていいじゃん、と思って竜王戦の棋譜をYouTubeで配信してたら1600万円の損害賠償を請求されたYouTuberがいるんです。\n\n「著作権がないのに賠償請求？」って思いますよね。そこが面白いとこなんですよ。","summary":"・絡んでる金額: 1600万円\n・テーマ: 竜王戦棋譜配信行為と不法行為の成否\n・ネット上の問題","what_happened":"やっと本題に入れる。長かった。\n\n原告は日本将棋連盟（連盟側）と読売新聞（読売側）。この2社が竜王戦を共同主催している。\n\n読売側は自社サイトで棋譜を掲載してYouTubeでも対局中映像を配信。連盟側はスマホアプリ「将棋連盟ライブ中継」で棋譜をリアルタイム配信。AbemaTVにも非独占で配信許諾を出してた。\n\nここで僕の話をさせてほしいんですけど、AbemaTVで将棋見たことあるんですよ。なんか解説とかコメントが面白くて、気づいたら3時間経ってたんですよね。将棋詳しくないのに。コンテンツの力ってすごい。話を戻します。\n\n原告らは「竜王戦・棋譜等利用ガイドライン」も作ってた。「棋譜を使いたいなら許諾が必要」って明示してた。\n\n相手方は、いわゆる将棋YouTuberです。\n\n相手方は、原告らの許諾を取らずに、竜王戦（第35期・第36期の七番勝負）の棋譜を使った動画をYouTubeで配信した。内容は、アプリで棋譜を確認しながら動画内の盤面で再現する、というもの。\n\n将棋ファンなら「あーあのやつか」となるコンテンツですよね。解説系のやつ。\n\n原告らは「これは不法行為だ」として約1600万円の損害賠償を請求した。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\nそして重要なのがここ。原告らは「棋譜が著作物だ」という主張をあえてしていない。著作権の話じゃなくて、不法行為の話として争ったわけです。\n\nこういうの聞くと「なんで著作権で争わないの？」ってなるじゃないですか。棋譜って表現の選択の幅が狭いから著作物として認定されにくい、という事情があるんですよ。だから別の道で攻めた。法律の世界は深い。","issue":"要するに何が問題だったの？\n\n「著作権じゃないのに不法行為になるの？」ってとこです。\n\n（１）不法行為の成否\n\n相手方の配信行為が、原告らの「営業上の利益」を侵害する不法行為に当たるかどうか。\n\nここテストに出ます。著作権がなくても、ビジネス上の損害を与えたら不法行為になりうる、ということが問われています。\n\n（２）損害の額\n\n不法行為だとしたら、いくら払うの？","ruling":"いよいよ判決です。\n\n裁判所は相手方の配信行為が不法行為に当たると認定しました。\n\n裁判所がポイントにしたのは、原告らが多大なコストをかけて作り上げたリアルタイムの棋譜配信ビジネスに、相手方が無断でただ乗りした、という構図です。\n\n著作権がなくても、他人のビジネスの成果にただ乗りして利益を得る行為は不法行為になる。これが裁判所の結論でした。\n\n裁判所、こういう「抜け道を塞ぐ」判断が好きですよね。好き。\n\n損害額については、相手方がその配信によって得た広告収入等をベースに認定されました。\n\nちなみに全然関係ないんですけど、YouTubeの将棋解説動画って最近すごく増えてますよね。この判決が出た後、どうなるのか気になります。で、","takeaway":"で、結局なにが大事なの？\n\n・「著作権がない＝自由に使える」は大間違い。不法行為という別の法律でやられる可能性がある\n・他人のコンテンツにただ乗りするビジネスモデルは、法的リスクが高い\n・ガイドラインに「許諾必要」と書いてあったら、それを無視すると証拠になる\n・「知らなかった」は言い訳にならない。YouTuberも法律を知らないとダメな時代になった\n\n許諾ゼロで始めると、取り返しがつかない。","one_liner":"著作権がないからといって自由に使えるわけじゃない。世の中そんなに甘くない。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"将棋YouTuber"},{"role":"請求側","icon":"💼","side":"plaintiff","desc":"将棋連盟・読売"}],"lessons":["損害、証明できる？"]},{"original_title":"東京地判令7.5.19（利用規約中の仲裁合意の適否）","url":"https://itlaw.hatenablog.com/entry/2026/02/04/222114","court":"東京地判","date":"令7.5.19","year":"令和7年（2025年）","topic":"利用規約中の仲裁合意の適否","categories":["利用規約・消費者"],"fun_headline":"【実話】Googleに訴えようとしたら「日本で裁判できません」と言われた件","hook":"アプリを使いはじめるとき、「同意する」ってボタンを押しますよね。\n\n僕も押します。押しながらほぼ読んでない。\n\nでも今日の話は「読んでなかった」では済まされない話です。\n\nそのボタンを押した瞬間に「裁判はアメリカの機関でやります」に同意してた、という判例があるんですよ。ちょっと聞いてください。","summary":"・テーマ: 利用規約中の仲裁合意の適否\n・利用規約の問題","what_happened":"ちょっと長くなるけど、大事な話なので付き合ってください。\n\nゲームアプリ開発者のユーザー側が、GoogleのAds（広告）サービスを使おうとして、Googleとの間で広告サービスの利用契約を締結した。\n\n「Google Ads日本向け広告プログラム規約」っていう利用規約の中に、紛争解決条項があったんです。\n\n本件利用規約に関連して紛争が生じた場合、両当事者は、相手方からの紛争に関する書面による通知から６０日以内に、その紛争を解決するための誠実な努力を行う。両当事者が当該期限までに紛争を解決できない又は解決しようとしない場合、その紛争は、国際紛争解決センター（以下「ＩＣＤＲ」という。）の国際仲裁規則に基づき、ＩＣＤＲが行う仲裁によって最終的に解決される。\n\nつまりこういうことです。もめたら60日話し合って、それでダメなら「ICDR（国際紛争解決センター）」という国際機関で仲裁、ということ。日本の裁判所じゃなくて。\n\nここで僕の話をさせてほしいんですけど、「ICDR」って言われてもピンとこないじゃないですか。要するにアメリカ系の国際仲裁機関です。日本人がGoogleに「訴えたい」と思っても、日本の裁判所じゃなくてそっちに行ってください、ということが小さい字で書いてあったわけです。話を戻します。\n\nユーザー側はGoogleのアプリダウンロード数の水増し行為などを問題にして、不法行為に基づく損害賠償を請求しようとした。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\nでもGoogleが「そもそもこの訴えは無効。仲裁合意があるんだから日本の裁判所には来るな」と主張してきた。\n\n裁判所に訴えたら「裁判所で裁判するな」と言われた、みたいな状況です。これ、怖すぎる。","issue":"で、裁判所に聞きたいことはこういうこと。\n\nこの仲裁合意は有効なの？\n\nつまり「同意するボタンを押した時点で、日本での裁判を諦めることに合意したことになるの？」という話です。\n\nユーザー側の主張はこうです。\n- 「利用規約ちゃんと読んでなかったし」（でも同意はした）\n- 「仲裁合意は信義則に反してユーザーの利益を一方的に害する」（消費者保護的な主張）\n- 「自分は消費者だから消費者契約法で守られるべき」\n\nここテストに出ます。この3つの主張が全部退けられます。","ruling":"いよいよ判決です。容赦ないです。\n\n裁判所はまずGoogleの登録プロセスを確認しました。\n\n①Ｇｏｏｇｌｅ広告アカウントを作成するユーザーは、「お支払い情報の確認」ページにおいて、「続行すると、Ｇｏｏｇｌｅ広告の利用規約に同意したことになります。法的拘束力のある仲裁によって異議申し立てを解決することも記載されています。」と表示され、Ｇｏｏｇｌｅ広告の利用規約のリンクも記載されたページを閲覧し、これを確認した上でＧｏｏｇｌｅ広告アカウントを作成することになっており、Ｇｏｏｇｌｅ広告の利用規約に同意することを記載したページを経由せずにＧｏｏｇｌｅ広告アカウントを作成することはできないこと、②（略）ユーザー側がＧｏｏｇｌｅ広告の利用規約を閲覧し、令和３年１０月２日に利用規約に同意したことが確認できることが認められる。\n\nつまり「ちゃんと表示してましたよ」「あなたも同意しましたよ」という記録がある。\n\n続いて、「読んでなかったとしても同意は有効」という話。\n\n仮にユーザー側が本件利用規約の内容を十分に確認していなかったとしても、（略）本件広告契約は、民法の定型取引であり、本件利用契約は定型約款であると認められ、サービス側はユーザー側に対し、あらかじめその定型約款を契約の内容とする旨を表示しているから、ユーザー側は、定型約款である本件利用契約の個別の条項についても合意したものとみなされるというべきである。\n\n「定型約款」っていうのは要するに「不特定多数に使う標準的な規約」のことです。Googleがあらかじめ「この規約でいきます」と表示してた以上、中身を読んでなくても同意したことになる、という話。\n\n裁判所、容赦ない。でも論理は一貫してる。\n\n「ICDRに任せるのはユーザーに不利では？」という主張は「一切の紛争解決を妨げるわけじゃないし、アメリカ系の国際機関を使うことが一方的に不利とは言えない」と退けられた。\n\n「自分は消費者」という主張は「ゲーム開発者として事業目的で契約してるんだから消費者じゃない」と退けられた。\n\nちなみに全然関係ないんですけど、「自分は消費者だから保護されるべき」という主張、ビジネスで契約してる場合は使えないんですよね。個人で使ってる場合とは扱いが違う。これ知らない人多いと思う。で、\n\n結論：この訴えは不適法として却下。","takeaway":"で、結局なにが大事なの？\n\n・利用規約は読まなくても同意した瞬間に有効。「読んでなかった」は通用しない\n・「仲裁合意」が入ってると、日本の裁判所で争えなくなる可能性がある\n・ビジネス目的で使ってる場合は「消費者保護」が使えないことが多い\n・Google等のプラットフォームと契約するときは、紛争解決条項を事前に確認しよう\n\n読まずに同意するのは自由。でもその結果まで無効にはできない。","one_liner":"同意ボタンは契約書のサイン。押す前に読む習慣だけで人生が変わる。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"Google"},{"role":"ユーザー側","icon":"👤","side":"plaintiff","desc":"ゲーム開発者"}],"lessons":["契約書読んどけば…","規約、読んだ？","プラットフォームの罠"]},{"original_title":"東京地判令7.4.25（プラットフォーマーによる偽造品等調査義務）","url":"https://itlaw.hatenablog.com/entry/2025/09/15/153255","court":"東京地判","date":"令7.4.25","year":"令和7年（2025年）","topic":"プラットフォーマーによる偽造品等調査義務","categories":["その他"],"fun_headline":"【実話】Amazonで正規品を売ってたら偽物に相乗りされて、文句を言ったら自分が出品停止になった話","hook":"これ結構ヤバい話だから。\n\nアマゾンで正規品を出品してたら、どこかの業者が全然関係ない商品を「これも同じ商品です」って感じで相乗り出品してきた。\n\n「偽物が混じってるから何とかして」とアマゾンに言ったら、偽物の出品は消えなくて、逆に自分の出品が停止された。\n\nどういうこと？\n\n しかもこれ、医療機器の話です。金額は損害賠償請求が約2.8億円。","summary":"・絡んでる金額: 8億円\n・テーマ: プラットフォーマーによる偽造品等調査義務","what_happened":"で、何が起きたかというと。\n\n医療機器メーカー原告側２（原告）が作ってるパルスオキシメーター、つまり指につけて血中酸素濃度を測るやつ、これを独占販売する権利を持ってたのが原告側１（もう一方の原告）です。\n\nパルスオキシメーターって、薬機法上、販売するには許可が必要で、しかもその許可を取るためには日本国内に営業所が必要なんです。ここ重要。\n\n原告側１はアマゾン（被告側）のプラットフォームで、この商品を出品してた。\n\nここからが本番です。\n\nアマゾンには「相乗り出品方式」っていう仕組みがある。同じ商品を複数の業者が出品すると、商品ページが1つにまとまって、価格が安い順に並ぶやつです。ラーメン屋で言ったら「同じメニュー名なのに別の店が安く出してきた」みたいな話。\n\n原告側１が出品した後、別の出品者が「本件商品ではない商品」を低廉な価格で相乗りしてきた。偽物、あるいは別の商品ってことです。\n\n値段が安いから、そっちが上位表示される。\n\n原告側１は「これ正規品じゃない、なんとかしろ」とアマゾンに是正を求めた。\n\nここで僕の話をさせてほしいんですけど、アマゾンに「偽物が混じってる」って連絡したことある人いますか？ 僕は経験ないんですけど、聞いた話だと対応が遅いことが多いみたいなんですよね。今回もそれに近い感じになります。話を戻します。\n\nアマゾンのシステムが「原告側１の出品価格が過去の平均価格から大きく乖離してる」と判定して、逆に原告側１の出品を停止した。\n\n偽物を訴えたのに、自分が止められた。\n\n続いて原告側１は商標権侵害の申告をした。アマゾンは原告側１の出品分ごと商品詳細ページを全部削除した。\n\n原告側１が「原告側１が独占販売権を持ってるから他社からは買えない」と商品ページに書いたら、被告側のポリシー違反として削除された。\n\nこういうの聞くと「プラットフォームって強すぎる」ってなりますよね。なってほしい。\n\n契約には免責条項もあって、ざっくり言うと「被告側はよほど悪質な場合以外責任を負わない」「責任があるとしても過去6カ月の支払額を上限にする」という内容だった。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\n原告側１と原告側２はアマゾンに対し、合計約2.8億円の損害賠償を求めた。","issue":"で、何が問題になったかというと──\n\nアマゾンにどんな義務があったのか。そしてその義務を違反したのか。\n\n主な義務は4つあった。\n\n予防的措置をとる義務（事前に防げよ）\n\n- 義務０－１　相乗り出品者が相乗り出品する際に、商品詳細ページの商品の販売に特定の資格が必要である場合、相乗り出品者が当該商品を販売する資格があることを確認し、資格を有しない出品者の出品を排除する義務\n- 義務０－２　相乗り出品者が相乗り出品する際に、相乗り出品者が相乗り出品しようとする商品が商品詳細ページの商品と同一のものであることを確認し、同一でない商品を排除する義務\n\n問題を知った後の対処義務（知ったなら動けよ）\n\n- 義務１－１　相乗り出品者が当該商品を販売する資格を有していないことを知り又は知ったと認められる相当の理由がある場合、合理的期間内に相乗り出品者の資格を調査し、資格を有しない出品者の出品を削除する義務\n- 義務１－２　相乗り出品者が相乗り出品した商品と商品詳細ページの商品とが同一でないことを知り又は知ったと認められる相当の理由があった場合、合理的期間内に当該偽造品を削除する義務\n\n- 義務２　（原告側１の出品が削除されたことにつき）合理的な理由なく出品を削除しない義務\n- 免責条項による免責の可否\n\nここテストに出ます。プラットフォーマーにこれだけの義務があると認められるかが争点です。","ruling":"で、裁判所はどう判断したか。\n\n各義務の前段階として、裁判所はまず大きな方向性を示しました。これがこの判例のいちばん大事なとこです。\n\nこの契約は、被告側が、出品者に対し、このサイトへの商品の出品を可能とするサービスを提供し、出品者がその対価として各種手数料等を支払うことを内容とする契約である。このサイトは、（略）実店舗と比較すれば偽造品等の不正な出品が容易な構造となっているところ、被告側は、このような構造下にあるオンラインストア・プラットフォームへの出品サービスを提供し、出品者からその対価を収受するのであるから、出品者の適正な販売機会を確保するために、これを阻害する不正な出品を監視し、取り締まるなど、不正行為への対応を行う義務を、この契約上の義務として出品者に対して負うものと解される。\n\nつまりこういうことです。「偽物が混じりやすい構造を作って手数料を取ってるんだから、その構造のせいで起きる問題に対処する義務がある」。\n\n裁判所がこう言い切ったのは、かなり踏み込んだ判断だと思います。プラットフォームビジネスをやってる会社はみんな読むべき。\n\nちなみに全然関係ないんですけど、「プラットフォームは中立だから責任ない」という主張、最近なかなか通りにくくなってきてる気がするんですよね。今回の判決もその流れの一つかもしれない。で、","takeaway":"で、結局なにが大事なの？\n\n・プラットフォームは「場を提供してるだけ」では免責されない。偽物が混じりやすい構造を作ったなら、対処義務もある\n・免責条項があっても「重大な過失」が認定されると免責されない可能性がある\n・Amazonで出品するなら「相乗り出品」のリスクを把握しておくこと。特に資格が必要な商品は要注意\n・問題が起きたらすぐ記録を残す。是正を求めた記録、対応の経緯、全部証拠になる\n\nプラットフォームは便利だけど、起きた問題の責任をどこに問うかは、ちゃんと考えておかないといけない。","one_liner":"プラットフォームで売るなら、そのプラットフォームのルールと責任の所在を先に把握しろ。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"医療機器販売会社"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"Amazon"}],"lessons":["証拠がないと詰む","プラットフォームの罠"]},{"original_title":"東京地判令7.3.31（MIDIデータの複製と不法行為）","url":"https://itlaw.hatenablog.com/entry/2026/01/19/212717","court":"東京地判","date":"令7.3.31","year":"令和7年（2025年）","topic":"MIDIデータの複製と不法行為","categories":["著作権","責任・損害"],"fun_headline":"【悲報】退職する前にやらかした社員、会社のMIDIデータ19万曲を持ち出した結果がヤバすぎた","hook":"カラオケで流れてる音楽って、あの「演奏データ」みたいなの、誰かが手作業で作ってるって知ってました？\n\n1曲6万6000円かけて。19万曲分。\n\nそれを全部コピーして持って帰った人がいるんですよ。\n\nちょっと待ってこれ、どういうこと？","summary":"・テーマ: MIDIデータの複製と不法行為\n・著作権がらみの争い","what_happened":"まず登場人物の整理から。\n\nカラオケ用の音源（MIDIデータって言います）を作る会社がありまして。権利者です。\n\nここで働いていた従業員が相手方。この人が今回の主役というか、加害者というか。\n\nMIDIデータって何かというと。\n\nmp3とかの「実際の音」とは違います。「この楽器を、この音程で、このタイミングで鳴らせ」という命令書みたいなもの。要するに超詳細な楽譜のデジタル版です。\n\nで、これを作るのがめちゃくちゃ大変なんですよ。\n\nここで僕の話をさせてほしいんですけど、昔ピアノをやってたんですよ。耳コピって本当につらいんです。「あれ今の音なんだっけ」「ピアノ？ バイオリン？」って楽器ひとつひとつ聴き分けて、手で入力して、を繰り返す。あれを19万曲やるって、どんな体力がいるんだという話で。\n\n話を戻します。\n\n相手方はMIDIデータ制作の担当ではありませんでした。でも、19万曲分の楽曲情報が入ったデータベースへのアクセス権限は持っていた。\n\n2019年12月、相手方は上司の許可なくそのデータベースをコピー。\n\nで、ここからがヤバいんですけど。\n\n2020年3月、業務用カラオケMIDIデータ約19万曲をまるっとコピー。\n\n自分でTwitter、YouTube、nanaのアカウントを作って、そこに自作したMIDIデータを公開していた。その自作データが、実は会社のMIDIデータを参照して作ったものだったことが社内調査でわかり、本人も認めて懲戒解雇。\n\n懲戒解雇ですよ。当たり前と言えば当たり前ですが。\n\nちなみに全然関係ないけど、「nana」って音楽コラボアプリ、まだ使ってる人いますかね。高校のとき友達がやってたな。なつかしい。\n\nで、会社は相手方に対して損害賠償請求。2160000円。","issue":"要するに何が問題だったの？\n\n相手方のやったことが「不法行為」に当たるかどうか。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\n相手方はこう主張していました。「趣味でMIDIデータを作る際に参考にしたことはあるが、生データそのものを公開したわけじゃない。著作権（原盤権）の侵害でもない」と。\n\nここテストに出ます。\n\nこの「参考にしただけ」「公開したのは自作データ」という主張が通るかどうかが争点。\n\nちなみに「原盤権」って何かというと、録音された音源に対して持てる権利のことです。作曲者の権利とは別にある、「この音源を録った人の権利」みたいな感じ。","ruling":"さあ、裁判所の答えです。\n\n裁判所はまず事実をしっかり認定しました。行為①②（コピー行為）をしたこと、相手方のアップロードしたMIDIデータが本件MIDIデータ①を参照して作られたこと、これらを認めた上で言いました。\n\n相手方は、（略）なるほど本件ＭＩＤＩデータ①、②は、市販の音源と同じものを作業者が耳で聞きながら楽器ごとの演奏内容を手動でデータ化して作成されたものではあって、権利者が独自に作曲等することによって作成されたものではないものの、権利者が人件費その他の費用を出捐して上記作業を経ることにより体系的に作成、整理されたものであって（（略）弁論の全趣旨によれば、１曲の制作単価は６万６０００円となる。）、著作権法上の原盤権の有無にかかわらず、権利者における営業上の貴重な利益、財産であるというべきものである。\n\n裁判所、めちゃくちゃ冷静。好き。\n\n「著作権があるかどうかはさておき、これ会社の大切な財産でしょ」というロジック。\n\nそして、かかるＭＩＤＩデータを基にして音源データを作成して第三者に公開することは、本来、権利者と契約を締結している通信用カラオケ業者によらずとも、同データに基づく音源を利用することができ、また、大量の複製行為を可能とすることになることに照らせば、相手方の前記行為は、権利者の上記利益等を侵害するものと評価することができる。\n\nつまり「会社の大切な財産を勝手に使って、それを公開できる状態にした。これは財産への侵害」ということ。不法行為を認定しました。\n\n損害額は、弁護士費用220万円＋その他の経費50万円から2割の過失相殺をして216万円。\n\nなぜ過失相殺があるかというと、部署が変わった後も相手方のアクセス権限を消し忘れていた会社側にも落ち度があると判断されたから。\n\n「鍵かけてなかった側にも責任ある」という話で、まあ確かにと思う。","takeaway":"で、結局なにが大事なの？\n\n・「著作権がない」は免罪符じゃない。会社の財産を無断で使えば不法行為になりうる\n・アクセス権限は退職・異動のたびにちゃんと削除しよう。「まあいいか」が裁判になる\n・「参考にしただけ」「自作です」は、参照元が明確だと通らないことがある\n・退職前に変なことしないこと。当たり前だけど、本当に当たり前のことが大事\n\n1曲6万6000円。19万曲。計算すると125億円以上。そりゃ怒るわ。","one_liner":"会社の財産は、著作権がなくても会社の財産。持って帰ったらアウト。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"音楽制作会社"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"元従業員"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["パクリの立証は地獄","プラットフォームの罠","損害、証明できる？"]},{"original_title":"知財高判令7.3.25（競馬情報プログラムと営業秘密・著作物性）","url":"https://itlaw.hatenablog.com/entry/2025/07/12/151925","court":"知財高判","date":"令7.3.25","year":"令和7年（2025年）","topic":"競馬情報プログラムと営業秘密・著作物性","categories":["著作権","プログラム・システム","営業秘密"],"fun_headline":"競馬の予想プログラムを持ち逃げした元社員、1.5億円の賠償を命じられる。馬券より高くついた件","hook":"みなさん、競馬ってやります？\n\n僕はやらないんですけど、たまに気になるんですよね。「なんで当たるか当たらないかわかるの」って。\n\n今日の話は、その「当たる予測をするプログラム」を開発した会社が、元社員にそのプログラムを持ち逃げされた話です。\n\n損害賠償、最終的に1億5000万円。\n\n馬券を買い続けるより高くつきましたね。","summary":"・テーマ: 競馬情報プログラムと営業秘密・著作物性\n・著作権がらみの争い","what_happened":"まず状況を整理します。\n\n権利者は、ネット上で競馬の勝ち馬を「指数」にして予測する競馬新聞を提供していた会社。\n\nそこにいた社員のＰ１とＰ２（どちらも被告）が、退職するにあたって会社の「IDM指数作成プログラム」「データ」「競馬新聞ブログ」「顧客名簿」などをごっそり持ち出した。\n\nで、Ｐ１が新しく会社（相手方）を立ち上げて、持ち出したものをもとに競馬新聞を作って顧客に提供し始めた。\n\n【ちょっと解説】不正競争防止法（ふせいきょうそうぼうしほう）── 営業秘密の持ち出し、商品の模倣など、ズルい競争方法を規制する法律。略して「不競法」。\n\nここで僕の話をさせてほしいんですけど、転職する友達に「前の会社でやってたこと教えて」って聞いたことがあるんです。そしたら「守秘義務があるから言えない」って言われて。それが正解なんですよ。知ってたけど改めて実感した。\n\n話を戻します。\n\n権利者は、「これ不正競争防止法違反だし著作権侵害でしょ」として、差止・廃棄・損害賠償を請求。\n\n一審（大阪地裁）では「プログラムは著作物じゃない」「ブログの著作権も権利者にない」「不正競争防止法の請求も認めない」と全部負け。権利者が控訴。\n\n【ちょっと解説】著作物性── 「それ、著作権で保護される「著作物」ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\nで、ここからが知財高裁（控訴審）の話。","issue":"要するに何が問題だったの？\n\n控訴審での大きな争点の一つが「損害額の計算に消費税を含めるかどうか」という話。\n\n権利者は「相手方が受けた利益の額」を損害として主張していました。\n\n「利益」って何かというと、売上から変動費を引いた額のこと。要するに「いくら儲けたか」です。\n\nそのとき「売上は消費税込みで計算すべき」と権利者が主張したんですね。\n\n本件のように、侵害者が、事業として資産の譲渡等を行い、これによる売上を、消費税抜きの売上と仮受け消費税に分けて帳簿に計上する場合、仮受け消費税分は、侵害者が納税を予定する額として計上するものであって、国に帰属すべき消費税分であり、侵害者に帰属すべき利益には当たらないと解するのが相当である。\n\n裁判所、「消費税は国のお金だから儲けに入れちゃダメ」と言いました。めちゃくちゃ冷静。好き。\n\nここテストに出ます。消費税は「預かり金」なので利益じゃない、という理屈。","ruling":"で、裁判所はどう判断したか。\n\n限界利益率94%（ほぼ全部が利益みたいな商売だったわけです）として利益を計算。\n\nただし、競馬情報を提供する業者が他にもたくさんいることを踏まえて、「因果関係がある損害は利益の70%」と推定を一部覆滅した。\n\nちょっと解説します。「推定の覆滅」って聞き慣れない言葉ですが、要するに「相手方の儲けが全部権利者の損害かというと、そうじゃない部分もあるよね」ということ。競合が多い市場だから、「他から買う人もいたはず」という話で7割に割引いた。\n\nその結果、弁護士費用込みで約1億5000万円の損害賠償を認容。\n\nあ、今思い出したんですけど、競馬の「予想屋」って昔は競馬場の外で紙を売ってたんですよね。それがデジタル化してプログラムになって、そのプログラムで裁判になる時代になったのか、と思うと感慨深い。\n\n控訴審で1億5000万円の逆転勝訴。一審では全部負けだったのに。\n\n「諦めずに控訴する」ことが大事な場合もあるというお話でした。","takeaway":"で、結局なにが大事なの？\n\n・プログラムの著作物性は「表現の選択の幅」で決まる。ロジックが一通りしかない実装は著作物にならないことがある\n・営業秘密として守りたいなら「秘密管理措置」が必須。「社内ではみんな知ってた」は秘密じゃない\n・損害額の計算で消費税は含まれない。「税込売上が利益」は裁判所に通じない\n・諦めずに控訴したら1.5億円になった案件。一審の判決がすべてじゃない\n\n競馬で儲けようとしたら、裁判で1.5億円払う羽目になりました。馬を買った方が安かったかもしれない。","one_liner":"会社の秘密を持ち逃げするくらいなら、競馬場で1億5000万円突っ込んだ方がまだマシだった。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"競馬情報会社"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"元従業員会社"}],"lessons":["著作権は万能じゃない","秘密は管理してナンボ","辞め方を間違えた"]},{"original_title":"大阪地判令7.2.17（フローチャート、画面の著作物性）","url":"https://itlaw.hatenablog.com/entry/2025/05/03/175026","court":"大阪地判","date":"令7.2.17","year":"令和7年（2025年）","topic":"フローチャート、画面の著作物性","categories":["著作権"],"fun_headline":"「私の論文からシステム作ったじゃないか！」と訴えた医師、フローチャートは著作物じゃなかった件","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n医師が論文を書いたんですよ。画像診断の方法について。\n\nその論文をもとに、会社がソフトウェアを作った。\n\n医師が退職後に「それ私の著作権じゃないの？」と言い出した。\n\n裁判所の回答がなかなか興味深くて、「論文はOK、フローチャートはアウト、画面もアウト」という分かれ方をしたんですよ。\n\nなんで分かれるの？ 一緒に考えましょう。","summary":"・テーマ: フローチャート、画面の著作物性\n・著作権がらみの争い","what_happened":"順を追って説明します。\n\n医師の権利者。疾病の予防・診断・治療をする法人相手方に勤めていた。\n\n権利者は在職中に「画像診断の方法」という論文を執筆。自分を著作権者として文化庁に登録もした。\n\nその論文にはフローチャート（本件作品２）も含まれていた。\n\n相手方はソフトウェア会社第三者に委託して、論文に記載された画像診断用ソフトウェアを開発。その画面レイアウト（本件作品３）も存在している。\n\n権利者が退職するとき「このシステムの知的財産権は私にある」と確認を求めた。\n\n相手方は「それは職務発明なので会社のもの」と拒絶。\n\n【ちょっと解説】著作物性── 「それ、著作権で保護される「著作物」ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\nここで僕の話をさせてほしいんですけど、昔アルバイトで資料作ったときに「これ誰の著作権？」って気になったことがあるんです。結論から言うと何も主張しませんでしたが。権利者はちゃんと主張したわけです。\n\n話を戻します。\n\nそこで訴訟へ。「論文・フローチャート・画面レイアウトについて、私に著作権があることを確認してほしい」と権利者が求めた。","issue":"で、何が問題になったかというと──\n\n3つの作品それぞれに著作権があるのかどうか。\n\n- 本件作品１：論文\n- 本件作品２：フローチャート\n- 本件作品３：画面レイアウト\n\nここテストに出ます。「著作権があるかどうか＝著作物性があるかどうか」の判断は、「創作的な表現があるか」で決まる。\n\nありふれた表現、決まった形式に従ったもの、アイデアそのもの、こういうのは著作物にならない可能性がある。","ruling":"裁判所はこう言いました。\n\nまず論文（本件作品１）は著作物性あり、と認めた。\n\n(2) 　上記本件作品１の内容は、おおむね画像を経時的に用い、あるいは他のバイタル情報や検査結果等を総合して患者の状態を鑑別、診断するという、医師の判断過程を記述したものであるといえ、思想、内容自体はある程度普遍的なもの（少なくとも、原告固有の思想やアイディアとまではいえない。）とは言い得るものの、権利者の医師としての経験に基づき、医療現場における画像診断の役割と現状の問題認識を明らかにし、診断過程を分析し、条件分岐による画像診断の手順を提案するものであって、また、本件作品１は、本件作品２を添付し、腹部超音波検査における診断方法を例示し、その内容を原告なりの表現で言語化するなど、表現上の工夫も認められるのであって、表現の選択の幅の中からこれらの表現を選択して構成し、全体としてまとまった記述をしたことには原告なりの個性が現れているということができる。\n\n(3) 　よって、本件作品１は、（略）これを全体としてみた限りでは、権利者の思想又は感情を創作的に表現したものであって、著作物であるといえる。\n\n論文は権利者の個性が出てる。著作物。はい。\n\nここで「やった！」となるわけですが、次のフローチャートがヤバい。\n\n本件作品２は、別紙１記載２のとおりであり、本件作品１の「腹部超音波検査における読影・判断支援の方法」という部分に記された腹部超音波検査における診断過程を、フローチャートを用いてＡ３用紙１枚内に図示したものである。\n\nこの点、当該診断過程そのものは本件作品１に記載されており、本件作品２は、一般的なフローチャートの作成方法にしたがってこれを図示したにすぎないものである。そして、フローチャートは、用いる図形等にも制約があるなど、その性質上表現上の選択の余地に乏しいうえに、本件作品２を具体的に検討しても、権利者の個性の表れとしての格別の表現上の工夫を見いだすことができない。\n\nそうすると、本件作品２は、本件作品１の基となったアイディアを単にありふれた表現で図示したものにすぎないというべきであって、それ単体としては創作性を欠くものというべきである。\n\n裁判所、「フローチャートって菱形と矢印で描くやつでしょ。それって選択の余地ないじゃん」と言ってる。\n\nこれ、エンジニアやデザイナーなら「わかる……」てなるやつじゃないですか。フローチャートに独自性って出しにくい。\n\n続いて画面レイアウト（本件作品３）も著作物性なし。\n\n本件作品３は、別紙１記載３のとおりであって、本件作品１に記された権利者の画像診断方法を実現するために必要な情報や患者の基本情報がコンピュータ・システムで管理されることを前提とし、当該情報のうち画面に表示されるものを所定のレイアウトに従って列挙したものである。全部で８画面分あるが、うち７画面は、同一画面の中にある臓器別に分かれたタブを切り替えたもので画面構成としては同じであり、実質的には２画面分のものである。\n\nこの点、コンピュータ・システムの画面における情報表示のあり方は、画面のサイズや必要な情報が決まれば、おのずと導き出されるものであり、またその配置に関しても、もともと選択の幅は限られるのであって、現に本件作品３においても、一般的な医療システムと比較して、権利者の個性の表れとしての具体的な表現上の工夫を見いだし得ない。\n\nそうすると、本件作品３は、本件作品１の基となったアイディアを単にありふれた表現でシステムの画面レイアウトに落とし込んだものにすぎないから、それ自体には創作性が認められず、著作物には該当しない。\n\n「画面サイズと表示情報が決まったら、レイアウトって自ずと決まるでしょ」という話。ちなみに画面を実際に作ったのは第三者企業なので、そもそも権利者は著作者でもないとも言われた。\n\nちなみに全然関係ないけど、「医療用画面のデザイン」って考えてみると確かに自由度ないですよね。患者名、年齢、検査値、全部ここに並べる、みたいな感じで。\n\n結果、論文の著作権は権利者のもの、という限度でのみ請求が認められた。","takeaway":"で、結局なにが大事なの？\n\n・論文は著作物になりうる。でもそこから派生したフローチャートや画面は「別物」として判断される\n・著作物として守られるには「創作的な表現」が必要。形式が決まっているものは要注意\n・「私のアイデアをもとに作った」だけでは、その成果物の著作権は主張できない\n・退職前に知財の権利関係をクリアにしておくこと。揉めるのは必ず退職後\n\nアイデアは著作権で守れない。守れるのは「表現」だけ。この壁、意外と高い。","one_liner":"アイデアを守る法律はない。守られるのは「どう表現したか」だけ。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"医師"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"医療法人"},{"role":"第三者","icon":"👥","side":"third","desc":"相手方はソフトウェア会社"}],"lessons":["著作権は万能じゃない","辞め方を間違えた"]},{"original_title":"大阪高判令7.1.30（棋譜データの利用と配信・控訴審）","url":"https://itlaw.hatenablog.com/entry/2025/02/17/234133","court":"大阪高判","date":"令7.1.30","year":"令和7年（2025年）","topic":"棋譜データの利用と配信・控訴審","categories":["ネット・コンテンツ"],"fun_headline":"将棋の棋譜をリアルタイム配信したYouTuber、「ビジネスモデルを壊す気だったんじゃないか」と裁判所に言われる","hook":"将棋の対局って、今はリアルタイムで配信されてるんですよ。\n\nAbema TVとか将棋連盟公式とかで、お金払って見られる。\n\nでも「俺が無料でAI評価値つきで配信してやる」と言い出したYouTuberがいて。\n\n最初は一審で勝ったんですよ、なんと。\n\nでも控訴審で全部ひっくり返されて、しかも裁判所に「あなた、わざとやりましたよね？」みたいなことを言われた。\n\nどういうこと？","summary":"・テーマ: 棋譜データの利用と配信・控訴審\n・ネット上の問題","what_happened":"まず一審（原審）の話から。\n\n将棋の棋譜。これは著作物なのか、という問題が以前からありまして。一審の大阪地裁は「棋譜は公表された客観的事実で、原則として自由に使える情報」「将棋連盟のガイドラインに法的拘束力はない」と言って、YouTuber側の言い分を認めた。\n\nこれが将棋YouTuberや将棋ファンの間で大きな話題になった。「棋譜って使っていいの？！」みたいな。\n\nちなみに全然関係ないけど、僕将棋のルールは知ってるんですよ。飛車と角の価値の違いくらいはわかる。でも「棋譜」を見てもどっちが優勢かは全然わからなくて、AI評価値がないと観戦できないタイプです。YouTuber側が配信してたAI評価値、僕には需要がある。\n\nで、一審から1年ほどが経過して控訴審（大阪高裁）へ。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\n控訴審の裁判長は、ワンスプーン事件（不競法保護の範囲外でも一般不法行為が成立するという先例）を出した方で。「あ、これは何か起きる予感がする」と思った人もいたようです。実際、結果はひっくり返った。\n\n相手方側（囲碁将棋チャンネル）は控訴審から代理人をTMIという大手事務所に変えてきた。これも「本気になってきた」サインだったわけです。","issue":"で、結局何が問題になったかというと。\n\n相手方がYouTuber側の動画をYouTubeから削除申請したことは、不正競争防止法違反か。\n\n【ちょっと解説】不正競争防止法（ふせいきょうそうぼうしほう）── 営業秘密の持ち出し、商品の模倣など、ズルい競争方法を規制する法律。略して「不競法」。\n\n相手方は棋譜が著作物だとは主張していなかった。それでも著作権侵害として削除申請した。これは「虚偽の事実の告知」にあたるから不競法違反だ、とYouTuber側が主張した。\n\n相手方側は「YouTuber側の主張する営業上の利益は法律上保護されるものじゃない」と反論。","ruling":"で、裁判所はどう判断したか。\n\n裁判所はまず将棋業界のビジネスモデルを丁寧に事実認定した。\n\n棋戦を主催（新聞社等あるいは相手方との共催を含む。）する日本将棋連盟は、棋戦を放送・配信する権利を許諾することで収益を上げ、これにより棋戦を主催するための開催・運営費用を賄っていること、そして、上記許諾を受けた被告ら放送配信事業者は、当該棋戦を有償配信し、これにより棋戦の配信の権利の許諾を受けるために負担した協賛金ないし契約金を回収し、さらに利益を上げようとしているものと認められるが、日本将棋連盟がリアルタイムの棋戦の放送・配信につき、このようなビジネスモデルを採用する理由は、同連盟の目的を達成するための事業をする上で、将棋はスポーツ競技のように大きな会場を用意して入場者から入場料を徴収することで開催・運営費用等を賄うことができないことから、会場を用意する主催者として物理的に独占できるリアルタイムの棋譜情報を、相手方のような放送配信事業者を介して将棋ファンに提供することで、将棋ファンから上記放送配信事業者を介して対価を徴収し、これにより開催・運営費用等を賄うとともに利益を上げ、もって将棋文化の向上発展に寄与しようとしているものと考えられる。そして、放送配信事業者である相手方の収益構造も、このようなビジネスモデルに組み込まれたものということができる。\n\n「将棋は野球やサッカーと違って入場料を取りにくい。だからリアルタイムの棋譜情報を売るビジネスモデルで成立している」という話。裁判所がビジネスモデルを丁寧に分析してる。好き。\n\n続いて、YouTuber側の配信行為について。\n\nこれに対し、YouTuber側のしていたこの動画の配信は、自らは一視聴者として相手方の配信する棋戦を観戦しながら、そこで得たリアルタイムの棋譜情報をほぼ同時に将棋ファンに対して無料で提供するものであるが、将棋ファンにとっては、YouTuber側が配信する動画を視聴すれば無料で棋戦のリアルタイムでの棋譜情報が得られるのであるから、対価を支払ってまでして相手方から棋戦の配信を受けようとしなくなることが十分考えられ、（略）YouTuber側によるこの動画の配信は、対価を支払って相手方から配信を受ける将棋ファンを減少させるものであって、このことによって相手方に対して直接的に損害を生じさせるものであるし、また、このような行為が多数の動画配信者によって繰り返されるなら、相手方の収益構造でもある日本将棋連盟がよって立つ上記ビジネスモデルの成立が阻害され、ひいては現状のような規模での棋戦を存続させていくことを危うくしかねないものといえる。\n\nつまり「無料で代わりに配信されたら有料で見る人が減る。それが続くと将棋界全体のビジネスモデルが崩れる」という話。\n\nここで僕の話をさせてほしいんですけど、これって音楽の違法アップロードと同じ構造じゃないですか。「どうせYouTubeで見られるからCD買わない」みたいな。形は違えど、本質は同じ問題だと思う。\n\n話を戻します。\n\nそして裁判所が踏み込んだことを言う。\n\nYouTuber側は、（略）上記のとおりの日本将棋連盟のビジネスモデルに組み込まれた相手方の収益構造を理解していたはずであり、そうするとこの動画を将棋ファンに無料で配信し視聴させることが、その反射として相手方から有料で配信を受けていたはずの将棋ファンを減少させ、その結果が相手方に損害を与えることも認識していたと認められる。そればかりか、YouTuber側が、この動画の配信前からリアルタイムの棋譜情報を提供する動画配信をしており、かつ、これを禁じようとする日本将棋連盟のビジネスモデルの在り方を批判し、この動画の配信を適法とすることで、そのビジネスモデルが崩壊してもやむを得ないような主張すらしていることからすると、YouTuber側は、上記のような動画配信をすることで日本将棋連盟及びそのビジネスモデルに組み込まれた相手方を害する目的すらあったことさえうかがえる。\n\n「YouTuber側は将棋連盟のビジネスモデルを壊してやろうとしていたんじゃないか」と裁判所が言っている。\n\nこれはかなり強い言い方で。「目的すらうかがえる」って、ほぼ認定に近い。\n\nなお、YouTuber側が主張するようにリアルタイムでの棋譜情報の利用制限というルールは、日本将棋連盟等の主催者が一方的に定めたものにすぎず、また、主催者と契約を結ばないYouTuber側は、この利用制限について法的に拘束されないが、YouTuber側が侵害されたと主張する営業上の利益は、他の競争者が主催者の定めたルールに従うことで価値が増したリアルタイムの棋譜情報を利用することにより、棋戦を主催・運営するための必要なビジネスモデルが成立している中（略）、他の競争者が従うルールに従わないことで競争上優位に立った上、競争者である相手方の営業上の利益も侵害することで得ている利益であるといえるから、上記の点を踏まえても、これを社会通念上、許された自由競争で得た利益ということはできない。\n\nしたがって、少なくとも相手方が棋戦をリアルタイムで配信するまさにそのときになされたYouTuber側によるこの動画の配信は、自由競争の範囲を逸脱して相手方の営業上の利益を侵害するものとして違法性を有し、不法行為を構成するというべきである。\n\n「みんながルールに従う中でお前だけルール無視して得をしようとするのは、自由競争じゃない」という話。これは刺さる。\n\n相手方による削除申請は不当ではないとされた。YouTuber側の請求はすべて棄却。一審とは真逆の結果に。","takeaway":"で、結局なにが大事なの？\n\n・「著作権がない情報」でも、それを使って他者のビジネスを破壊しようとすれば不法行為になりうる\n・「ルールに法的拘束力はない」は正しいかもしれないが、みんながそのルールで成立しているビジネスを壊すことは許されない\n・一審で勝っても控訴審でひっくり返ることがある。判例は確定するまで予断を持てない\n・インターネットの「情報は自由」は、他者のビジネスを破壊するための免罪符にはならない\n\n「合法かどうか」と「やっていいかどうか」は違う。裁判所はそこまで見る。","one_liner":"ルールに縛られないのと、ルールを壊していいのは、全然違う話。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"将棋YouTuber"},{"role":"請求側","icon":"💼","side":"plaintiff","desc":"将棋連盟"}],"lessons":["秘密は管理してナンボ"]},{"original_title":"徳島地判令7.1.16（故意によるファイル削除の責任と損害）","url":"https://itlaw.hatenablog.com/entry/2025/05/09/225038","court":"徳島地判","date":"令7.1.16","year":"令和7年（2025年）","topic":"故意によるファイル削除の責任と損害","categories":["責任・損害"],"fun_headline":"【怖すぎ】退職日に会社のファイルを消去するバッチを仕掛けた元社員、2500万円の請求を受ける","hook":"これ本当に怖い話なんで。\n\n退職前に「退職日になったらファイルを全部消すプログラム」を仕掛けた元社員がいるんですよ。\n\n退職日の当日に自動実行されて、230フォルダのファイルが消えた。\n\n発覚が遅れて、バックアップからも復旧できなかった。\n\n損害賠償2500万円の請求。\n\n怖すぎる。本当に怖すぎる。","summary":"・絡んでる金額: 2500万円\n・テーマ: 故意によるファイル削除の責任と損害\n・責任の所在を巡る争い","what_happened":"順を追って説明します。\n\n相手方、令和元年にメーカーの請求側に中途入社。研究開発業務に携わっていた。\n\n令和3年7月31日が退職日。\n\nでも6月29日に、何をしたかというと。\n\n共有サーバーの特定フォルダを削除するプログラムと、そのプログラム自体も削除するバッチファイルを作成。自宅からリモート接続して、退職日の7月31日に起動するよう設定した。\n\nここで僕の話をさせてほしいんですけど、これ「悪意がある」を通り越してもはや「計画的犯行」ですよね。6月29日に仕込んで、7月31日に発動。1ヶ月以上前から準備してる。\n\n話を戻します。\n\n7月31日、退職日当日にプログラムが起動。約230フォルダのファイルが削除された。プログラム自体も自動で消えた。証拠隠滅まで自動化している。\n\n発覚したのは9月30日。\n\nバックアップの復元可能期間は40日間。でも発覚が復元期間を過ぎていたので復旧不可能。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\n請求側は相手方に対し不法行為または労働契約上の債務不履行（データ保存義務違反）として約2500万円の損害賠償請求。\n\nちなみに全然関係ないけど、「証拠隠滅を自動化する」発想は技術的には面白いですよね。エンジニアとして。でも絶対にやってはいけない。","issue":"で、何が問題になったかというと──\n\n「損害額がいくらか」の計算が争点の一つ。\n\n削除されたファイルを再開発するコスト、代替品を調達するコストで計算して、約570万円と認定された。\n\n相手方側は「過失相殺してほしい」と主張した。つまり「会社側にも落ち度がある分、賠償額を減らせ」という話。\n\n主な主張は2つ。\n- 「適切な開発環境を用意してなかった会社が悪い」\n- 「バックアップをちゃんととってなかった会社が悪い」\n\nこれが通るかどうかが争点でした。\n\nここテストに出ます。\n\nむしろ商用利用できない統合開発環境を用いたのは相手方の事情によるところが大きい。また、相手方は、退職前に、上司等に対し、ライセンスの問題からこのソフトウェア①及びこのソフトウェア②を削除する必要があることや実際にそれらのソフトウェアをこのプログラムによる削除の対象としていることを告げたことはなく、会社側側においてそれらのソフトウェアが削除されないよう対応をする余地はなかった。\n\nこのような事情に加えて、本件削除行為が相手方の故意によるものであることをも踏まえれば、前記⑴ⅰを理由に過失相殺をすべき旨の相手方の主張は採用できない。\n\n「商用ライセンス問題はお前の事情。しかも誰にも言わなかったじゃないか。会社が対応できる余地はなかった」という話。\n\n請求側が本件各ファイルのバックアップを一切とっていなかったとは認められず、むしろ、請求側は、本件共有サーバー内のデータについては４０日間復元可能なバックアップ体制を採っていたが、このプログラムによる本件各ファイルの削除が、相手方の最終勤務日よりも後に行われ、かつ、本件各ファイルが保存されていたフォルダはそのまま本件共有サーバー内に残されていたため、請求側において本件削除行為が発覚したのが復元可能期間を経過した後であったために、本件各ファイルが消失してしまったものと認められる。\n\nしたがって、本件各ファイルの消失につき、請求側が必要なバックアップをとっていなかった過失がある旨の相手方の主張（前記⑴ⅱ）は採用できない。\n\n「バックアップはあった。でも退職日の後に削除されて、フォルダは残ってたから気づかなくて、気づいたときは40日過ぎてた。これは請求側の過失じゃない」という話。\n\nバックアップが「あったのに間に合わなかった」という状況を、会社の落ち度には認めなかった。","ruling":"裁判所はこう言いました。\n\n過失相殺は認めない。故意によるファイル削除行為は不法行為に当たる。\n\n相手方の「開発環境が悪かった」「バックアップが不十分だった」という主張は、どちらも退けた。\n\n理由は明快。\n\n「これは相手方が故意にやったこと」。\n\n故意でやった場合、相手の管理体制の甘さを過失相殺の理由にするのは難しい。\n\nあ、今思い出したんですけど、「故意」と「過失」って法律用語で意味が違うんですよね。故意は「わかってやった」、過失は「不注意でやった」。今回は「わかってやった」だから、相手方には弁解の余地がほぼない。\n\n損害額は約570万円。これに相手方の家族2名が身元保証人として連帯責任を負う形になった。\n\n2500万円の請求のうち認められたのは570万円。でも会社的には「ファイルを消されて570万円の損害」というのが確定したわけで、しかも身内まで巻き込まれた。\n\nどちらにとっても、いい結末ではない。","takeaway":"で、結局なにが大事なの？\n\n・「故意」でやった場合、相手の管理が甘くても過失相殺は認められにくい。悪意は言い訳を封じる\n・退職前に不審な行動をすると、発覚したとき全部証拠になる。バッチファイルも残る\n・バックアップは40日では足りないこともある。「退職日以降に発動する爆弾」には無力\n・身元保証人は連帯責任を負う。誰かの保証人になるときは覚悟を持って\n\n「退職日に爆弾を仕掛けるエンジニア」、技術は高かったのかもしれない。でも使う方向が完全に間違っていた。","one_liner":"退職の復讐をエンジニアリングで実現しようとしてはいけない。技術は善のために使え。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"元従業員"},{"role":"会社側","icon":"🏢","side":"plaintiff","desc":"メーカー"}],"lessons":["証拠がないと詰む","辞め方を間違えた","損害、証明できる？"]},{"original_title":"東京地判令6.12.23（プログラムの著作物性・否定）","url":"https://itlaw.hatenablog.com/entry/2025/02/22/215001","court":"東京地判","date":"令6.12.23","year":"令和6年（2024年）","topic":"プログラムの著作物性・否定","categories":["著作権","プログラム・システム"],"fun_headline":"【悲報】自作プログラム、著作権で保護されなかった件","hook":"「俺が作ったんだからパクるな」って思いますよね。\n\nそれ、めちゃくちゃ自然な感情じゃないですか。\n\nでも裁判所はそんなに優しくないんですよ。「それ、本当にあなたのオリジナルですか？」って聞いてくるんです。\n\n今日の話は45万円をめぐるバチバチの話なんですけど、エンジニア全員が知っておくべき内容なのでぜひ聞いてください。","summary":"・絡んでる金額: 45万円\n・テーマ: プログラムの著作物性・否定\n・著作権がらみの争い","what_happened":"じゃあ何があったか、順番に話しますね。\n\n権利者（個人）は、相手方の頼みで畳店の業務管理ソフトを作りました。\n\n畳店専用ソフト。いいですね。ニッチ。\n\nここで僕の話をさせてほしいんですけど、僕の地元にも畳屋さんがあって、どんな注文管理してるんだろうってずっと気になってたんですよ。まさかエクセルVBAで動いてたとは思わなかった。話を戻します。\n\nで、このソフトにいくつか不具合が出たんですね。代金の話でも揉め始めた。\n\n権利者は「そのソフト、まだ無断で使ってますよね？　著作権侵害ですよ」と主張して、削除を求めた。\n\n相手方は「バグだらけだから契約解除します」と言ってソフトを削除した。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。要するに「やっぱやめます」を法的にやること。お互い返金・返品義務が発生する。\n\nで、ここからがヤバいんですけど。\n\n権利者、削除した後も「著作権侵害で損害賠償45万円よこせ」って訴えたんですよ。\n\nもう消えてるのに。でも気持ちはわかる。めちゃくちゃわかる。","issue":"要するに何が問題だったの？ってことを整理しましょう。\n\nこのプログラムは「著作物」として認められるか？\n\nここテストに出ます。\n\n【ちょっと解説】著作物性── 「それ、著作権で保護される\"著作物\"ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\n要するに「あなたにしか書けないコードですか？」ってことです。ありふれた書き方だったら著作権は発生しないんですよ。\n\n「え、でも僕が書いたじゃん」ってなりますよね。なります。でも裁判所はそういう話をしていない。","ruling":"裁判所はこう言いました。\n\n著作物性を否定。つまり権利者のプログラムは著作権で保護されない、という結論です。\n\n理由がめちゃくちゃ細かく書かれてて、読んでると「あ、これはキツい」ってなります。\n\n権利者は、このプログラムのソースコードのうち、\n\n①製品名のドロップダウンリストを表示する機能に関する部分（以下「①部分」という。）、\n\n②顧客の名前を検索、確定する機能に関する部分（以下「②部分」という。）、\n\n以上の２点を赤色でマーキングし、当該２点を創作的表現部分として主張するものと解されるところ、権利者は、裁判所からの繰り返しの釈明にかかわらず（略）、これらが創作的表現に該当する理由を具体的に主張するものではない。\n\n「繰り返しの釈明にかかわらず」ってところ、怖すぎる。裁判所が何度聞いても答えられなかったってことじゃないですか。\n\nさらに続きます。\n\nこの点を措き、権利者の主張について精査しても、①部分については、権利者の主張は、ＡｃｔｉｖｅＸコントロールのコンボボックスを使用し、フォントやフォントサイズをカスタマイズ可能にするという、単なるアイデアをいうものにすぎない。念のため、①部分の内容についてみても、（略）エクセルにおいて標準仕様として用意されているＡｃｔｉｖｅＸコントロール及びＡｃｔｉｖｅＸコントロールのコンボボックスを用いて項目をドロップダウンリストとして選択可能とさせるものであって、これらを使用してフォント名及びフォントサイズをカスタマイズする手法自体は、極めてありふれたものにすぎない。\n\n更に念のため、これらの機能に対応するソースコードについてみても、使用されている指令及びその組合せにおいて、権利者の個性が表れているものといえないことは明らかである。\n\n「念のため」が2回出てきてる。これ裁判所が「念を押しても念を押してもダメでした」って言ってるんですよ。\n\nちなみに全然関係ないけど「念のため」って言葉、職場で使いすぎると「根拠ない」って思われるやつですよね。で、\n\nまた、②部分についても、権利者の主張は、ユーザフォーム画面のコンボボックスで、カタカナ行のドロップダウンリストから目的のカタカナ行をマウスで選択して、表示されたリストボックスから目的の名前と電話番号をマウスでクリックすることで顧客の名前を選択可能にするという、単なるアイデアをいうものにすぎない。念のため、②部分の内容についてみても、（略）エクセルにおいて標準仕様として用意されているユーザフォームのコンボボックスとリストボックスを用いるものであり、コンボボックスとリストボックスを用いてマウスで値を選択させ、リストボックスの項目が選択されたときに実行されるＣｈａｎｇｅイベントを用いることにより、マウスで選択された値を取得することを可能とするものであって、これらの手法自体は、いずれも極めてありふれたものにすぎない。\n\n更に念のため、これらの機能に対応するソースコードについてみても、使用されている指令及びその組合せにおいて、権利者の個性が表れているものといえないことは明らかである。\n\nこれらの事情の下においては、権利者の主張は、アイデアをいうものに帰し、このプログラムに表現上の創作性を認めることはできない。\n\nつまりこういうことです。「エクセルの標準機能を普通に使っただけのコードに、あなたらしさはありませんでした」。\n\n裁判所、めちゃくちゃ冷静。ちょっと好き。\n\nその他の争点についても権利者の主張は認められず、請求は全部棄却されました。","takeaway":"で、結局なにが大事なの？\n\n・プログラムの著作権は「あなたらしい表現」があって初めて成立する。ありふれた書き方は保護されない\n・「アイデア」と「表現」は別物。コンボボックスで検索する「発想」は著作権で守れない\n・裁判所から何度聞かれても答えられない主張は負ける。準備と説明が命\n・フリーランスで開発する人は、契約書に「著作権の帰属」を明記しておくこと。後から揉めると地獄\n\nエクセルの標準機能を使ったコードは、たぶん著作権では守れません。以上。","one_liner":"「俺が作った」は著作権じゃない。「俺にしか作れなかった」が著作権だ。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"フリーランスSE"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"畳店"}],"lessons":["著作権は万能じゃない","「完成」って何？"]},{"original_title":"東京地判令6.10.10（代理店による競業避止義務違反）","url":"https://itlaw.hatenablog.com/entry/2025/06/26/202141","court":"東京地判","date":"令6.10.10","year":"令和6年（2024年）","topic":"代理店による競業避止義務違反","categories":["営業秘密"],"fun_headline":"【実話】代理店が「同じサービス」を自分で売り始めた結果どうなったか","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n誰かのビジネスを「代わりに売ってあげてる」立場の人が、そのビジネスとほぼ同じやつを自分で始めたとしたら。\n\nどうなると思います？\n\n770万円の損害賠償請求が飛んできます。今日はそういう話です。","summary":"・絡んでる金額: 770万円\n・テーマ: 代理店による競業避止義務違反\n・営業秘密の話","what_happened":"順を追って話しますね。\n\n会社側は「ネットの履歴書」ってサービスをやってました。\n\n何をするサービスかというと、採用候補者のネット上の情報を集めて分析して企業に報告する、というやつです。\n\nここで僕の話をさせてほしいんですけど、就活のとき自分のSNSを掃除しまくった記憶があって、こういうサービスが普及してるなら掃除の仕方も変わってきますよね。まあ僕にはもう関係ない話ですけど。話を戻します。\n\n元社員は会社側と「販売代理店契約」を結びました。\n\n【ちょっと解説】販売代理店契約── 「あなたのサービスを代わりに売ってあげますよ」という契約。売った分だけ手数料もらえる仕組み。\n\nこの契約には「競業避止義務」と「秘密保持義務」が入ってました。\n\n競業避止義務ってのは要するに「うちのライバルになること、やめてくださいね」という約束です。\n\nで、ここからがヤバいんですけど。\n\n元社員、自分で採用リスク調査サービスを始めちゃったんですよ。「Ｒ」という名前で。\n\n会社側のサービスの代理店をやりながら、ほぼ同じサービスを自分で売り始めた。\n\nこれ、居酒屋で考えると「チェーンの居酒屋でバイトしながら、隣に同じメニューの個人居酒屋開いた」みたいな話ですよ。え、ダメでしょそれ。\n\n会社側は激おこで、差止めと770万円の損害賠償を請求しました。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。","issue":"で、何が問題になったかというと──\n\n「競業避止義務に違反してるか」\n\n「品質を誤認させる表示があったか」\n\n「差止めと損害賠償は認められるか」\n\nの3点です。全部大事なやつ。","ruling":"裁判所はこう言いました。\n\n（１）競業避止義務違反について\n\nまず違反の有無。裁判所は事実をかなり丁寧に整理した上で、こう述べました。\n\nア 　元社員は、会社側に対し、この契約 3 条 2 項 4 号に基づき、「本サービスを…誤認されるサービスを行ってはならない」という競業避止義務を負う。また、本件事業に関し、元社員が会社側との関係で代理商の地位にあることは当事者間に争いがないところ、代理商は、許可なく「自己又は第三者のために会社の事業の部類に属する取引をすること」を禁止されている。したがって、元社員は、この観点からも、会社側に対して競業避止義務を負う。\n\nつまり、契約上も法律上も、元社員には「同じことしちゃダメ」の義務があったってことです。\n\nイ 　前提事実及び前記各認定事実によれば、本件事業及びＲ事業は、いずれも、広く採用活動を行う顧客から提供を受けた求職者等の履歴書や職務経歴書等の情報を用いて、当該求職者等に係る WEB 調査及びその評価を行うサービスといえる。このため、Ｒ事業は、本件事業と同種又は類似するサービスであり、会社側が事業として行う本件事業の部類に属する取引と認められる。（略）\n\nまた、本件提案書及び本件申込書とＲ提案書及びＲ申込書の記載内容の同一性又は類似性並びにこの契約締結及びその前後の経緯に鑑みると、元社員は、本件事業に関して会社側から提供された資料に示された情報をもとにＲ提案書その他Ｒ事業に関する資料等を作成し、Ｒ事業に使用したものと理解される。そうすると、元社員は、会社側に対するこの契約上の競業避止義務にも違反したものといえる。\n\n提案書や申込書が「ほぼ同じ内容」だったのがバレた。あ〜〜〜〜。つらい。\n\n機密保持義務の違反も認定されました。\n\n元社員は、この契約上「機密」とされる原告の固有の「営業上その他の業務上の情報」を「本契約の目的以外に使用し」たものといえ、会社側に対するこの契約上の機密保持義務に違反したものと認められる。\n\n僕がこの当事者だったら、三日は立ち直れないと思います。マジで。\n\n（２）品質誤認表示について\n\nＲ事業の資料には「利用企業数1,000社以上」とか「レポート納品数180,000件以上」とか書かれてましたが、\n\n「利用企業数 1,000 社以上」、「レポート納品数 180,000 件以上」、「業種・規模を問わず様々な企業様にご活用いただいております。」\n\nこれについては「間違いだという証拠がない」として品質誤認は認められませんでした。\n\nここだけ元社員が勝った。1勝2敗ってとこですね。\n\n（３）差止めと損害賠償の可否\n\n差止め（やめさせること）については、契約がすでに終了していたため認められませんでした。\n\nちなみに全然関係ないけど「後の祭り」って言葉、こういうときのためにある言葉だと思います。\n\nでも損害賠償は認められました。会社法の推定規定を使って、\n\n（代理商の競業の禁止）\n第十七条　代理商は、会社の許可を受けなければ、次に掲げる行為をしてはならない。\n一　自己又は第三者のために会社の事業の部類に属する取引をすること。\n二　（略）\n２　代理商が前項の規定に違反して同項第一号に掲げる行為をしたときは、当該行為によって代理商又は第三者が得た利益の額は、会社に生じた損害の額と推定する。\n\nこの規定を使って、Ｒ事業の売上から経費を引いた利益、約170万円が損害として認定されました。\n\n770万円を請求して170万円が認められた。う〜〜ん。","takeaway":"で、結局なにが大事なの？\n\n・代理店契約には「競業避止義務」が入っていることが多い。契約書をちゃんと読もう\n・資料の使い回しはバレる。提案書のフォーマットまで似てたら言い訳できない\n・契約終了後は差止めができなくなることも。タイミングが命\n・損害賠償は「相手が得た利益」で計算されることがある。儲けた分だけ返せ、という話\n\n他人のビジネスで学んだことを使って同じビジネスを始めたら、そりゃ怒られる。","one_liner":"代理店契約は「弟子入り」じゃない。独立する前に契約書を読め。","parties":[{"role":"会社側","icon":"🏢","side":"plaintiff","desc":"情報収集会社"},{"role":"元社員","icon":"👤","side":"defendant","desc":"元代理店"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["契約書読んどけば…","証拠がないと詰む","「完成」って何？"]},{"original_title":"大阪地判令6.7.30（ソースコードの秘密管理性）","url":"https://itlaw.hatenablog.com/entry/2024/09/30/223848","court":"大阪地判","date":"令6.7.30","year":"令和6年（2024年）","topic":"ソースコードの秘密管理性","categories":["プログラム・システム","営業秘密"],"fun_headline":"元社員が競合会社を作った結果、ソースコードの「秘密」認定で全部ひっくり返った話","hook":"みなさん「秘密」って言葉の重さ、ちゃんと知ってます？\n\n法律の世界だと「秘密です」って言い張るだけじゃ秘密として認められないんですよ。\n\n「秘密管理性」っていう要件があって、それを満たして初めて「営業秘密」として守られる。\n\n今日の話は、元社員が丸ごと引き抜かれて競合会社を作った医療機器業界の話です。スケールがデカすぎて笑えない。","summary":"・テーマ: ソースコードの秘密管理性\n・営業秘密の話","what_happened":"ちょっと長くなるけど大事な話なので付き合ってください。\n\n原告はマンモグラフィ（乳がん検診で使う画像診断機器）のシステムを作って売っている会社です。\n\nC++で書いたプログラムが入ってました。医療系ソフト、たしかにC++が多い。\n\nここで僕の話をさせてほしいんですけど、マンモグラフィって単語を最初に聞いたとき「マンモス？」って思ったんですよね。全然関係ないし今日のテーマとも関係ない。話を戻します。\n\n被告会社、平成24年に同じくマンモグラフィ画像診断システムを作り始めます。C#で書いたやつで。\n\nで、この被告会社の販売部門を立ち上げた人が誰かというと、元原告社員のＰ２さん。\n\nさらに開発を担当したＰ３さん、Ｐ４さんも、元原告社員。\n\nもう、わかりますよね。\n\n「元社員が会社の技術を持ち出して競合を作った」という疑惑。\n\n僕がこの当事者だったら、三日は寝込む。いや一週間。\n\n原告は「ソースコードを不正に持ち出した」として、差止めと損害賠償を請求。著作権侵害も主張しました。\n\n【ちょっと解説】営業秘密── 不正競争防止法で保護される企業秘密。ただし「秘密管理性」「有用性」「非公知性」の3要件を満たす必要がある。「うちの秘密です」と言い張るだけじゃダメ。\n\n【ちょっと解説】不正競争防止法（ふせいきょうそうぼうしほう）── 営業秘密の持ち出し、商品の模倣など、ズルい競争方法を規制する法律。略して「不競法」。\n\n原告の請求にある5号、8号は「悪いと知りながら秘密を受け取った人への請求」の類型で、10号は「不正に作られた製品を売る行為」への請求です。","issue":"裁判所に聞きたかったのはこういうこと。\n\nそのソースコード、ちゃんと「秘密」として管理されてましたか？\n\nそして被告製品は原告のプログラムを複製・改変して作られましたか？\n\nこの2点です。特に「秘密管理性」が今日のキモです。\n\n（２）著作権侵害について\n\n判決文からは明らかではないですが、両社のソースコードを実際に並べて比べたようです。\n\n被告が令和4年当時のソースコードを証拠として出したところ、\n\n原告が証拠として提出したソースコードと被告らが証拠として提出したソースコードには、記述内容や構成等に大きな違いがあり、仮に原告提出のソースコードの創作性（著作物性）を前提としても、被告ら提出のソースコードについて、原告提出のソースコードの表現部分において同一性を有する又は表現上の本質的な特徴を直接感得することができるとは認め難い（略）。したがって、被告各ソフトウェアのうち、(a)NCView に係る令和４年２月ないし３月当時のソースコード、(c)XronoQR に係る同年３月当時のソースコード、(d)DcmSend に係る同月当時のソースコードは、いずれも、原告各ソフトウェア（原告ソースコード）のうち、(a)MGView、(c)DcmQR 及び(d)EzSend に係るソースコードを複製又は翻案したものとは認められず、原告のプログラム著作権を侵害するとは認められない。 \n\n【ちょっと解説】著作物性── 「それ、著作権で保護される著作物ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\nつまり「見た目が全然違うから、コピーしたとは言えない」という結論。\n\n原告は「平成30年時点のソースコードはコピーだった」と主張したんですけど、その時点のコードは比較されず、間接的な証拠だけでは著作権侵害を立証できなかった。","ruling":"で、裁判所はどう判断したか。\n\n著作権侵害については認めませんでした。\n\nソースコードを比べたら「見た目が全然違う」。だからコピーとは言えない、という判断です。\n\nあ、今思い出したんですけど「証拠を出す義務は主張した側にある」ってルール、こういうときにめちゃくちゃ重要なんですよね。過去のコードがどうだったかを証明できなかった側が負ける。\n\n裁判所の判断は「証拠で見せてくれた範囲では、コピーとは言えない」でした。","takeaway":"で、結局なにが大事なの？\n\n・「営業秘密」として守りたいなら、秘密だという管理をしていることが必要。アクセス制限・ラベル・誓約書が証拠になる\n・「言った」「言わなかった」は裁判では通用しない。書面に残ってない話は存在しないのと同じ\n・ソースコードを証拠として使うなら、いつ時点のものかが重要。後から書き換えられたら比較できない\n・元社員が競合を作るのは止められない。でも秘密をちゃんと守っていれば法的に戦える\n\n秘密は「そう扱って初めて」秘密になる。","one_liner":"「秘密です」と言うだけじゃ秘密じゃない。秘密として扱って初めて秘密になる。","parties":[{"role":"元社員","icon":"👤","side":"defendant","desc":"競合メーカー"},{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"医療機器メーカー"}],"lessons":["契約書読んどけば…","証拠がないと詰む","著作権は万能じゃない"]},{"original_title":"名古屋地判令6.5.31（システムの完成、PM責任等）","url":"https://itlaw.hatenablog.com/entry/2024/08/31/080414","court":"名古屋地判","date":"令6.5.31","year":"令和6年（2024年）","topic":"システムの完成、PM責任等","categories":["プログラム・システム","PM・開発管理","瑕疵・完成","責任・損害"],"fun_headline":"【全PMが震えた】1300万円のシステム、「完成してない」と言われた結果","hook":"プロジェクトマネージャーのみなさん、今日も元気に働いてますか。\n\n今日の判例は、PMをやっているすべての人に読んでほしいやつです。\n\n「システム完成した？」「完成してない」「いや完成してる」で1300万円が宙ぶらりんになる話。\n\nこういうのを「双方の言い分が食い違うやつ」といいます。裁判所が大好きなパターン。","summary":"・絡んでる金額: 1300万円\n・テーマ: システムの完成、PM責任等\n・プロジェクト管理の問題","what_happened":"順を追って説明しますね。\n\n発注側（ベンダ、作る側）は、開発側（ユーザ、使う側）から生産管理システムの開発を頼まれました。\n\n代金は約1300万円。着手金として半分を先払いで受け取り、残りは「検収後」に払ってもらう契約。\n\n【ちょっと解説】検収（けんしゅう）── 「確認しました、OKです」と納品物を正式に受け取ること。これが終わると基本的に「やっぱダメ」とは言いにくくなる。\n\n下請けのＲ社も開発に入って、作業が始まりました。\n\nで、ここからがヤバいんですけど。\n\nリリース予定は平成30年5月。でも遅延した。\n\n同年9月には「操作が開始された」らしい。らしい、というのは「本格稼働」じゃなくて「操作してみた」レベルだったということです。\n\nその後も仕様についての協議が続いて、「不具合がある」という指摘が続いて、令和元年8月にはシステムの稼働が中止されました。\n\nここで僕の話をさせてほしいんですけど、「稼働中止」ってシステム開発の文脈で聞くと本当に怖い言葉なんですよ。誰も使いたくない言葉。なのにこうなってしまった。話を戻します。\n\n発注側は残代金を請求。払ってもらえないので「システムは完成してます」と主張して訴えました。\n\nさらに「当初の仕様以外の対応もしたので3500万円くれ」という請求も追加。\n\n【ちょっと解説】協力義務── ユーザ（発注側）がベンダに適切に協力する義務。要件を決めない、レビューしない、連絡を無視する──こういうのは義務違反になりうる。","issue":"で、何が問題になったかというと──\n\n（１）このシステム、完成してたの？\n\n（２）完成してないなら誰のせい？\n\n（３）追加作業の報酬は払ってもらえる？\n\nの3つです。全部大事なやつ。特に（１）が核心。","ruling":"さあ、裁判所の答えです。\n\n裁判所は事実を丁寧に整理して判断を下しました。\n\nあ、今思い出したんですけど「システムの完成」って何をもって完成とするかって話、IT業界的にめちゃくちゃ重要で、契約書に書いてないと後で絶対揉めるんですよね。今日の話がまさにそれです。\n\nシステムの「完成」とは何か。裁判所は「予定していた工程が終了しているかどうか」で判断することが多いです。\n\n「完璧に動くか」じゃなくて「工程が終わったか」。ここが大事なとこなんで簡単に言うと、「リリースまでの工程を全部こなしたか」が基準になる。\n\n開発側が協力義務を果たしていたかどうかも問われました。仕様が決まらない、レビューしてもらえない、そういう状況でベンダが作業を進められなかったとしたら、ユーザ側にも責任がある。\n\n1300万円のシステムで、どちらがどれだけ悪いか。裁判所はこれを判断しました。\n\n追加報酬3500万円については、当初の契約に含まれる範囲なのかどうかが争点。「やってあげた」と「それは最初から仕様に含まれてた」は全然違う話なので、記録が重要になります。","takeaway":"で、結局なにが大事なの？\n\n・「完成」の定義は契約書に書いておくこと。「予定工程が終了したら完成」など具体的に\n・検収の条件も書いておく。「何をもってOKとするか」が曖昧だと後で絶対揉める\n・追加作業をしたなら、その都度「これは追加です」と書面で残す。口頭ではダメ\n・ユーザも協力義務を負う。要件を決めない、レビューしないは義務違反になりうる\n\n契約書は作るとき面倒だけど、裁判になったら全部そこで決まる。","one_liner":"「完成した」「してない」で1300万円が消える。完成の定義は最初に書け。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ITベンダ"},{"role":"開発側","icon":"💻","side":"defendant","desc":"製造業ユーザ"},{"role":"下請業者","icon":"🔧","side":"third","desc":""}],"lessons":["契約書読んどけば…","「完成」って何？","金の話は最初にしろ"]},{"original_title":"東京高判令6.5.16（文化シヤッターvs日本IBM控訴審）","url":"https://itlaw.hatenablog.com/entry/2024/08/21/232446","court":"東京高判","date":"令6.5.16","year":"令和6年（2024年）","topic":"文化シヤッターvs日本IBM控訴審","categories":["その他"],"fun_headline":"【控訴審】文化シヤッターvs日本IBM、8億円の攻防の続き","hook":"8億円って言葉を聞いて「ふーん」てなれる人、どのくらいいますか。\n\n僕には無理です。8億円、想像もできない。\n\nでも今日の判例はそういうスケールの話です。\n\n文化シヤッターと日本IBMが「システム開発が失敗した」をめぐって戦った裁判の控訴審。一審の続きです。","summary":"・絡んでる金額: 8億円\n・テーマ: 文化シヤッターvs日本IBM控訴審","what_happened":"話を整理しましょう。\n\n日本IBM（ベンダ）が、セールスフォースのプラットフォームを使ったシステム開発を文化シヤッター（ユーザ）から受けました。\n\nUATまで進んだけど、中止になった。\n\n【ちょっと解説】PM義務── ベンダ（開発側）がプロジェクトを適切に管理・推進する義務。進捗がヤバいなら早めにアラートを出せ、という話。\n\nUATって何かというと「ユーザー受け入れテスト」。要するに「実際に使う人が試してみるテスト」です。これが終わったら「じゃあ本番で使います」になるはずだった。\n\nでも中止になった。\n\nここで僕の話をさせてほしいんですけど、「UAT完了直前で中止」ってシステム開発あるあるで、関わった人全員がつらいやつなんですよね。一番ゴールに近いところで止まる。これがまたキツい。話を戻します。\n\n文化シヤッターは「ベンダのせいで失敗した」として約27.8億円の損害賠償を求めました（本訴）。\n\n日本IBMは「いや、ユーザのプロジェクト管理が悪かった」として約12億円の損害賠償を求めました（反訴）。\n\nお互い訴えてる。スケールが違う。\n\n一審では、ベンダ（日本IBM）の責任を認めて、ユーザ（文化シヤッター）の過失が15%あるとしました。損害として認定されたのは85%の約19.8億円。\n\nいや、そうはならんやろ。なっとるやないか。\n\n今回は控訴審。一審の判断に対して「おかしい」と言った側が上に持ち込んだやつです。","issue":"で、裁判所に聞きたいことはこういうこと。\n\n控訴審では基本的に一審の認定が維持されています。\n\n「一審でこう判断されたけど、それって正しかったの？」という補足的な主張に対する判断が今回のポイント。\n\n要するに「8億円くらいの差を巡って、追加の言い訳が通るかどうか」です。","ruling":"裁判所、こう言いました。\n\n判決文では、ベンダ（日本IBM）が「一審本訴被告」、ユーザ（文化シヤッター）が「一審本訴原告」と表記されています。ちょっと読みにくいですけど。\n\nちなみに全然関係ないけど、裁判所の文書って「一審本訴被告」とか「原審被控訴人」とか、読むのがしんどい言葉がたくさん出てきます。こういうのを読めるようになる法律家の人たち、すごいと思う。尊敬。\n\n控訴審の判断としては、一審の認定を基本的に維持しつつ、控訴審で新たに出てきた主張にも丁寧に答えています。\n\nベンダのPM義務違反は引き続き認定。ユーザ側の過失も引き続き15%。\n\nつまり大きな結論は変わらない。8億円規模の損害賠償は維持されました。\n\n「控訴したけど変わらなかった」パターン。こういうの、めちゃくちゃ多いんですよ実は。一審を覆すのって相当難しい。","takeaway":"で、結局なにが大事なの？\n\n・ベンダのPM義務は「成功させる義務」じゃなくて「適切に管理する義務」。でも管理できてないと負ける\n・ユーザもプロジェクト管理に責任を持つ。「全部ベンダのせい」は通らないことが多い\n・一審で負けても控訴できるけど、逆転は難しい。最初の裁判でしっかり主張することが大事\n・大規模システム開発のトラブルは双方に責任があることが多い。証拠と記録が全てを決める\n\n8億円でも、証拠がなければ取れない。記録を残せ。","one_liner":"大規模プロジェクトの失敗は「誰のせいか」より「証拠があるか」で決まる。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"文化シヤッター"},{"role":"開発側","icon":"💻","side":"defendant","desc":"日本IBM"}],"lessons":["証拠がないと詰む","PM不在の悲劇"]},{"original_title":"東京高判令6.1.31（瑕疵か否か）","url":"https://itlaw.hatenablog.com/entry/2025/09/23/163207","court":"東京高判","date":"令6.1.31","year":"令和6年（2024年）","topic":"瑕疵か否か","categories":["瑕疵・完成"],"fun_headline":"【7年戦争】「バグです」「いえ仕様です」の言い争い、ついに裁判所が決着をつけた","hook":"「これバグですよね？」「いえ、仕様です」\n\nIT業界で何百万回も繰り返されてきたこの会話が、ついに裁判所まで持ち込まれたんですよ。\n\n2800万円の返金を求めて。7年かけて。\n\nちょっと待ってこれヤバいから最後まで読んで。","summary":"・絡んでる金額: 2800万円\n・テーマ: 瑕疵か否か\n・完成したかどうかの争い","what_happened":"求人情報の会社（発注側）が、求人票の文字情報を自動で組版してウェブに反映するシステムを作ろうとしたんですよ。\n\nで、ベンダ（開発側）に頼んで、パッケージソフトをカスタマイズしてもらう契約を結んだわけです。\n\n基本契約、要件定義個別契約、開発業務個別契約の3本立てで。\n\nここで僕の話をさせてほしいんですけど、僕も昔アプリを発注しようとして「この機能追加できますか？」「できます！」の会話だけで話を進めたことがあって、まあ大変なことになったんですよね。話を戻します。\n\nで、要件定義を始めてから2年以上経っても、システムが一向に完成しない。\n\n2年ですよ。2年。\n\nその間、要件定義のやり直しが発生したり、追加費用の話で折り合いがつかなかったり、大変なことになっていました。\n\nで、ここからがヤバいんですけど——\n\n発注側は「納期に納品されなかった、納品された機能にもバグがある」として、契約をすべて解除。支払い済みの2800万円の返還を求める裁判を起こしました。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n\n発注側の気持ち、わかる。めっちゃわかる。2年待ってシステム完成しなかったら泣きながら法律事務所に電話する。\n\nところが、開発側も黙っていなかった。\n\n「システムは稼働してるじゃないですか。一部未完成があるとしても、それは発注側が協力してくれなかったからでしょ」\n\nとして、未払報酬の約1650万円を逆に請求してきた（反訴）。\n\n【ちょっと解説】協力義務── ユーザ（発注側）がベンダに適切に協力する義務。要件を決めない、レビューしない、連絡を無視する──こういうのは義務違反になりうる。\n\n一審（東京地裁）は「システムに瑕疵あり、完成とも言えない、解除原因に該当する」として発注側の請求をすべて認めました。開発側の反訴は棄却。\n\n【ちょっと解説】瑕疵（かし）── 法律用語で言う「バグ」。正確には「契約で約束した品質を満たしていない部分」のこと。\n\n開発側が控訴して、これが本件の控訴審です。裁判が始まってからだけでも数年。トータルで7年の闘いです。\n\n7年ですよ。7年。僕だったら途中で引っ越してます。","issue":"要するに何が問題だったの？\n\n複数の争点があるんですが、主なものを整理します。\n\nここテストに出ます。\n\n（０）開発側が提出した「説明文書」の信用性\n\n協議の過程で開発側が出した文書に、「遅延の要因は弊社担当社員の退職と人員不足」「仕様変更が度重なった」みたいな、自分に不利なことが書いてあったんですよ。\n\n普通こんなこと書かないですよね？これが証拠として使えるかどうかも争点になりました。\n\n（１）仕様は要件定義書で確定していたか\n\n被告側：「要件定義書に書かれたものは全部作った。発注側が後から大量に仕様変更を追加してきた」\n\n原告側：「要件定義書の後も協議で要件を確定させる合意があった」\n\n典型的な「それ仕様変更？それとも最初からの要件？」問題です。\n\n（２）バグ（瑕疵）があったか\n\n複数の不具合について「これは瑕疵か、それとも仕様の範囲内か」が争われた。\n\n（３）契約解除の原因があったか\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\n発注側は「納入遅延」「品質保証条項違反」「バグの修正義務違反」など、多数の解除原因を主張していた。\n\n（４）未払報酬は払うべきか（開発側の反訴）\n\n開発側は「発注側の協力義務違反があったから全額よこせ」という主位的請求と、「少なくとも完成割合81.8%分は払え」という予備的請求の2段構えで来ていた。\n\n81.8%って中途半端な数字、なんか測ったんですかね。","ruling":"さあ、裁判所の答えです。\n\n控訴審（東京高判）は、一審の基本的な判断を維持しつつ、争点ごとに丁寧に判断を示しました。\n\n裁判所、めっちゃ冷静。好き。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n・「バグか仕様か」は最終的に裁判所が決める。だから要件定義書に具体的な品質基準を書いておくこと\n・「完成」の定義を契約書に書いておくこと。書いてないと7年かかる\n・ベンダが自分に不利なことをメールや文書に書いてたら、それは証拠になる。逆も然り\n・協力義務は発注側にもある。「あとはよろしく」で放置すると、いざというとき立場が弱くなる\n\n7年戦争を経て言えることは一つ。要件定義書はちゃんと書こう。","one_liner":"「バグか仕様か」の答えを裁判所に出してもらうのに7年かかる。契約書に書けば1日で済む。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"求人情報会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ソフト開発会社"}],"lessons":["契約書読んどけば…","「完成」って何？","金の話は最初にしろ"]},{"original_title":"大阪地判令6.1.29（プログラム著作物性と黙示的許諾の有無）","url":"https://itlaw.hatenablog.com/entry/2024/04/13/003146","court":"大阪地判","date":"令6.1.29","year":"令和6年（2024年）","topic":"プログラム著作物性と黙示的許諾の有無","categories":["著作権","プログラム・システム"],"fun_headline":"【1億2000万円の請求】自分が書いたコード、著作権あると思ってます？ない場合があるって聞いたら震えた","hook":"ちょっと待ってこれ聞いたら驚くから心の準備して。\n\n自分が書いたコード、「著作物だから無断で使ったら著作権侵害だ」って思ってますよね？\n\n僕もそう思ってました。\n\nでも裁判所的には「それ、黙示的に許諾したよね？」ってなるケースがあるんですよ。\n\n1億2000万円の請求が、11万円の賠償に着地した判例の話をします。","summary":"・絡んでる金額: 2000万円\n・テーマ: プログラム著作物性と黙示的許諾の有無\n・著作権がらみの争い","what_happened":"ここからが本題です。\n\n会社側のプログラマとして働いていた権利者という個人がいました。\n\n権利者は会社側を退職した後も、会社側からプログラム開発の委託を受け続けて、納品していた。\n\nちなみに全然関係ないけど、退職後も元の会社から仕事を受けるフリーランス的な関係って、なんか一番揉めやすいなと個人的に思ってます。で、\n\n権利者は「プログラム１から６の6本について、会社側が無断で複製したり改変したりしている」として、著作権侵害・著作者人格権侵害を主張して合計約1億2000万円の損害賠償を求めました。\n\n1億2000万円。\n\n1億2000万円ですよ。\n\nこれ、ラーメン屋で「替え玉チャーシュー増量で」って頼んだら「1億円です」って言われるくらいの衝撃です。（例えが下手でごめんなさい）\n\nで、ここからがヤバいんですけど——\n\n元社員側は「このプログラムは、ある現場で使った後、別の現場でも使うことが最初から想定されていた。だから複製してもOKという合意があった」と主張していた。\n\n「え、でもそんな話した記憶ない」という権利者側。\n\n「言わなくてもわかるじゃないですか」という元社員側。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。レストランで「カレーください」と注文するようなもので、カレーが出てこなかったら契約違反。","issue":"で、結局何が問題になったかというと。\n\n（２）承諾の有無\n\n会社側は「プログラムは別の現場で複製して使うことが当然予定されていた。元社員側はそれまで利用許諾条件も何も言ってこなかったから、承諾があったも同然」と主張していた。\n\n裁判所は次のように述べて、一定の限度での利用について黙示の合意があったと認定した。\n\n本件各プログラムの中には、明示的に異なる現場で用いることを前提とする仕様が採用されたものがあること、本件各プログラムはいずれも発注の原因となった現場と異なる現場で用いることについてプログラムの仕様上の制限はないとうかがわれること、権利者自身、一つの現場が終了したと見込まれる後も、プログラムの修正に応じるなどしていること、権利者自らソースコードを納品したものもあることに加え、元社員側が、平成２年に独立した後、多数回にわたって会社側から依頼されたプログラムを制作、納品し、平成２０年１２月から平成２１年４月までの間は、会社側に採用されてプログラム制作業務に従事していたことからすれば、計測業務における会社側のプログラムの利用実態（プログラムを一つの現場で利用するだけでなく他の現場においても複製、変更又は改変（カスタマイズ）して利用していたことを含む。）から、自己が制作して納品したプログラムが会社側により複数の現場で利用され得ることを認識していたものとみられることが認められる。これらの本件においてうかがわれる事情からすると、本件各プログラムの開発に係る各請負契約において、成果物が、少なくとも会社側の内部で使用される限りにおいては、他の現場における使用や改変を許容する旨の黙示の合意があったものというべきである。\n\n裁判所の言ってることを超ざっくり言うと——\n\n「30年以上会社側と仕事してきて、プログラムが複数現場で使われてること知ってたよね？ソースコードまで渡してたよね？だったら暗黙的にOKって言ってたのと同じでしょ」\n\nということ。\n\nあ、今思い出したんですけど、「言わなくてもわかる」って人間関係でも同じ議論になりますよね。わかりません。明示的に言ってください。\n\nその結果、複製権侵害・同一性保持権侵害は否定された。\n\nただし、一部のプログラムは起動画面に会社側の社名しか載ってなくて元社員側の名前がなかったので、氏名表示権侵害だけが認められて、11万円の損害賠償が認められました。\n\n1億2000万円の請求が11万円に着地。","ruling":"裁判所、こう言いました。\n\n「黙示の合意あり。複製してもOKだった。ただし氏名表示権は侵害してる」\n\nという結論。なるほどね。\n\n裁判所、めっちゃ冷静。好き。","takeaway":"で、結局なにが大事なの？\n\n・「使っていい範囲」は契約書に明示しておくこと。「言わなくてもわかる」は通用しない\n・フリーランスでコードを納品するときは、利用許諾の範囲を必ず書面で決めておく\n・長年の取引慣行は「暗黙の合意」と見なされることがある。知らなかったではすまない\n・著作者人格権（氏名表示権）は契約で譲渡できないので、「名前を残す」ことを契約書に書いておこう\n\n著作権の話をすると、だいたい最後に「で、結局どうすればいいの」ってなる。答えは「書面で決めておく」。以上。","one_liner":"「言わなくてもわかるでしょ」は、1億2000万円の請求が11万円に着地するやつ。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"フリーランスSE"},{"role":"元社員","icon":"👤","side":"defendant","desc":"建設業者"}],"lessons":["契約書読んどけば…","「完成」って何？","辞め方を間違えた"]},{"original_title":"大阪地判令6.1.16（棋譜データの利用と配信）","url":"https://itlaw.hatenablog.com/entry/2024/02/03/150700","court":"大阪地判","date":"令6.1.16","year":"令和6年（2024年）","topic":"棋譜データの利用と配信","categories":["ネット・コンテンツ"],"fun_headline":"【将棋ユーチューバー受難】棋譜で評価値放送してたら著作権侵害で動画消された→裁判で逆転勝利した話","hook":"将棋の対局を見ながら「AIの評価値こんな感じです〜」って解説動画を出してたユーチューバーがいたんですよ。\n\nそしたら突然、著作権侵害で動画を消されたんです。\n\n「いや待って、棋譜って事実じゃないの？著作権あるの？」\n\n僕もこれ読むまでまったくわかってなかったんですけど、裁判所の答えがめちゃくちゃ興味深かったので報告します。","summary":"・絡んでる金額: 338万円\n・テーマ: 棋譜データの利用と配信\n・ネット上の問題","what_happened":"ここからが本題です。\n\n元社員側さんは、いわゆる「将棋ユーチューバー」。\n\n被告会社側が配信する中継動画を見て、そこで得た棋譜情報をもとに、盤面を表示しながら将棋AIの評価値も表示する「評価値放送」という動画をYoutubeとツイキャスで配信していました。\n\nここで大事なのは——\n\n権利者は会社側の動画の映像・画像・音声はいっさい使っていない。\n\n使ったのは「対局の手順という情報」だけ。\n\nちなみに全然関係ないけど、「野球の試合結果をツイートするのは著作権侵害か」とか「スポーツの得点速報は？」とかも似たような議論があるんですよね。で、\n\n会社側がYoutubeとツイキャスに「この元社員側の動画、うちの著作権侵害してます」という削除申請を送った。\n\nYoutubeとツイキャスはその申請を受けて、元社員側の動画を配信停止にしました。\n\n僕がこの立場だったら転職サイト開いてると思う。いや一週間かも。\n\nで、ここからがヤバいんですけど——\n\n元社員側は「著作権侵害なんてしてない。なのに著作権侵害だと虚偽の通知をして動画を消したのは不正競争行為だ」として、会社側を逆に訴えたんです。\n\n・差し止め（「著作権侵害する」と第三者に言うな）\n・信頼回復措置（プラットフォームに「侵害してない」と通知しろ）\n・約338万円の損害賠償\n\nを求めました。\n\n【ちょっと解説】不正競争防止法（ふせいきょうそうぼうしほう）── 営業秘密の持ち出し、商品の模倣など、ズルい競争方法を規制する法律。略して「不競法」。","issue":"両者の言い分が食い違ったポイントはここ。\n\nまず前提として、元社員側が「ユーチューバーとして動画を配信して収益を得ている」という営利事業が、削除申請によって侵害されたことは認められていた。\n\n元社員側は、ユーチューブ及びツイキャスにおいて、この動画を配信して収益を得ていたところ、本件削除申請は、グーグル等のプラットフォーマーに対し、この動画が会社側の著作権を侵害する違法なものであることを摘示する内容であり、（略）動画配信によって収益を得ることが少なくとも一定期間停止されたことがそれぞれ認められる。そうすると、本件削除申請は、元社員側がこの動画の配信という営利事業を遂行していく上での信用を害するものとして、元社員側の「営業上の利益」を侵害したと認められる。\n\nで会社側は「元社員側の動画は棋譜情報をタダ乗り（フリーライド）しているから、そもそも法的に保護される利益じゃない」と主張してきた。\n\nそして「王将戦の棋譜利用ガイドライン」を根拠として出してきた。\n\nこの時点で嫌な予感がしますよね（会社側にとって）。はい、的中です。\n\nしかし、棋譜は、公式戦対局の指し手進行を再現した「盤面図」及び符号・記号による「指し手順の文字情報」を含むものと認められるところ、この動画で利用された棋譜等の情報は、会社側が実況中継した対局における対局者の指し手及び挙動（考慮中かどうか）であって、有償で配信されたものとはいえ、公表された客観的事実であり、原則として自由利用の範疇に属する情報であると解される。同ガイドラインは、棋譜の利用権等を王将戦主催者が独占的に有する旨規定するが、王将戦主催者が、元社員側を含めた会社側の実況中継の閲覧者の関与なく一方的に定めたものであり、元社員側に対して法的拘束力を生じさせるものであるとはいえない。また、前記１のとおり、この動画は会社側の著作権を侵害するものではなく、その他、元社員側が、会社側の配信する棋譜情報を利用することが不法行為を構成することを認めるに足りる事情はない。したがって、会社側の前記主張は、その前提を欠き、採用できない。\n\n裁判所、めっちゃ冷静。好き。\n\n要するに——棋譜（手の進行という事実情報）は「客観的事実」なので著作権は発生しない。ガイドラインで「うちが独占的に持ってる」と書いても、当事者が同意してない一方的な規約は法的拘束力がない、ということ。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\n【ちょっと解説】逸失利益── 「あの事故がなければ得られたはずの利益」のこと。動画が止まってる間の収益損失とか。","ruling":"で、裁判所はどう判断したか。\n\n不法行為の成立を認め、逸失利益等、約100万円余りの損害賠償が認められました。\n\nさらに、侵害申請行為の差し止めと（ツイキャスに対しては）信用回復措置も認められた。\n\n棋譜は著作物じゃない。自由に使える。削除申請は不正行為だった。\n\nということで決着。","takeaway":"で、結局なにが大事なの？\n\n・棋譜（将棋・囲碁の手順という事実情報）には著作権は発生しない。事実は誰でも使っていい\n・「うちのガイドラインに従え」という一方的な規約は、相手が同意してなければ法的拘束力がない\n・著作権侵害を「虚偽に」申告して相手の営業を妨害すると、逆に不正競争行為で訴えられる\n・「公表された事実」と「著作物」の区別はしっかりつけよう\n\nインターネットで何かやるとき、「これ裁判になったらどうなる」って一瞬考えてみよう。マジで。","one_liner":"事実に著作権はない。ガイドラインで縛ろうとしても、同意してない人には効かない。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"将棋YouTuber"},{"role":"元社員","icon":"👤","side":"defendant","desc":"将棋配信者"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["著作権は万能じゃない","秘密は管理してナンボ","辞め方を間違えた"]},{"original_title":"東京地判令5.11.24（４段階での分割契約の意義）","url":"https://itlaw.hatenablog.com/entry/2025/03/30/155654","court":"東京地判","date":"令5.11.24","year":"令和5年（2023年）","topic":"４段階での分割契約の意義","categories":["契約・報酬"],"fun_headline":"【全ITエンジニア必読】「請負か準委任か」より重要な話。4段階分割契約、裁判所の答えが予想の斜め上だった","hook":"突然ですが聞いていいですか。\n\n「この契約、請負？それとも準委任？」\n\nIT業界でめちゃくちゃ重要なこの問いに対して、裁判所が「どっちでもいい、そんな話より各段階ごとの話をしましょう」という答えを出した判例があるんですよ。\n\nこれ、かなりヤバい話なんで最後まで読んでください。","summary":"・絡んでる金額: 297万円\n・テーマ: ４段階での分割契約の意義\n・契約とお金の話","what_happened":"ここからが本題です。\n\n介護支援サービスのシステムを作ろうとしたユーザ（発注側）とベンダ（開発側）がいました。\n\nまず業務委託基本契約を結んで、次に要件定義の個別契約を結んで、297万円が支払われた。\n\nここで全然関係ない話をさせてほしいんですけど、僕の家の近くに4段階でラーメンの辛さを選べる店があって、どれを選んでも「思ってたのと違う」ってなるんですよ。話を戻します。\n\n開発フェーズの契約は4段階に分かれていました。\n\n1. 機能開発（1回目）\n2. 機能開発（2回目）\n3. 動作確認テスト\n4. ユーザテスト指摘対応及びリリース作業\n\n発注側はフェーズ1の代金等として約800万円を支払いました。\n\nで、ここからがヤバいんですけど——\n\nユーザテストのフェーズまでは進んだんですが、システムはリリースされなかった。\n\nリリースされなかったんですよ。お金は払ったのに。\n\n発注側の気持ち、わかる。めっちゃわかる。つらい。\n\n発注側は「システムを完成させる約束を守らなかった」として、損害賠償約1200万円を請求（本訴）。\n\n開発側は逆に「完成した分の仕事はしたんだから報酬を払え」と約800万円を反訴請求。\n\n【ちょっと解説】検収（けんしゅう）── 「確認しました、OKです」と納品物を正式に受け取ること。これが終わると基本的に「やっぱダメ」とは言いにくくなる。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。","issue":"ここからが法廷バトルの核心部分。\n\nこの契約の性質が問題になった。\n\n原告側：「これは請負契約だ。システムが完成してないんだから債務不履行。報酬も払わなくていい」\n\n被告側：「アジャイル方式で開発してたから準委任契約だ。完成責任はない。やった分だけ払え」\n\nここテストに出ます。\n\n「請負か準委任か」というIT業界最大の争いが、また繰り広げられた。\n\n","ruling":"裁判所、こう言いました。\n\n裁判所は「請負か準委任かを決める必要はない」という斜め上の答えを出した。\n\n【ちょっと解説】準委任（じゅんいにん）── 「結果は約束しないけど、プロとしてちゃんとやります」という契約。美容院で「いい感じにしてください」と言うのに近い。SES契約はだいたいこれ。\n\nこの契約は、基本契約を締結した上で、個別契約を別途締結するというもので、個別契約として、平成２９年１０月１日にサービス対応範囲の決定等の契約がされ、要件定義が作成された後、同年１２月１７日に機能開発等の契約がされている。そして、後者の契約においては、機能開発（１回目）から作業として４つの段階が記載され、段階ごとに金額や納品日が定められているのであって、実際に、原告も機能開発（１回目）に対応する代金を支払っている。これらの経過からすると、段階ごとに報酬が発生するということ自体は発注側においても認識していたものと解される。\n\nそして、この契約の基本契約には、開発側が個別契約に基づいて成果物を作成することが定められており、平成２９年１２月１７日付個別契約においても、各段階における納品物がそれぞれ定められている（乙２４）ものの、そのような文言等からただちに、この契約が全体を通して一つの請負契約であり、最終的な仕事の完成をもって報酬が発生するものと解することはできず、上記の経過を踏まえれば、開発したシステムのリリースに向けて、各段階ごとに、その段階における開発側の債務を履行した場合には報酬が発生する契約であると解され、そのことは、この契約を請負契約と解するか準委任契約と解するかによって変わるものではない。\n\n裁判所の言ってることをざっくり言うと——\n\n「フェーズごとに金額と納期が決まってたんでしょ？フェーズ1の代金も払ったでしょ？だったら各フェーズを完了したら報酬が発生する契約だよね。請負か準委任かって議論は関係ない」\n\nということ。意味がわかる。意味がわからない。両方同時に感じた。\n\nその上で、「発注側が改善要望を出していたことは認めるけど、それは要件定義を超えた追加要望であってバグじゃない。だから開発側に債務不履行は認められない」とした。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。レストランで「カレーください」と注文するようなもので、カレーが出てこなかったら契約違反。\n\n結果——フェーズ1〜3（機能開発1・2回目、動作確認テスト）までは完了したとして、その分の開発側の報酬請求（反訴）は認容。発注側の請求はすべて棄却。\n\nという結論。なるほどね。","takeaway":"で、結局なにが大事なの？\n\n・「フェーズ完了ごとに報酬発生」という構造にすると、請負か準委任かに関わらずそれが基準になる\n・各フェーズの完了条件（何ができたら終わりか）を契約書に具体的に書いておくこと\n・「要望を出した＝バグの修正要求」とは認められない。要件定義外の追加は別途交渉が必要\n・検収の記録を残すこと。「この段階は終わった」という合意の証拠が裁判では決め手になる\n\n「請負か準委任か」より「各フェーズで何が完了条件か」のほうが大事だった。","one_liner":"「請負か準委任か」より「各フェーズの完了条件が契約書に書いてあるか」のほうが1000倍重要。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"介護事業者"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ITベンダ"}],"lessons":["契約書読んどけば…","証拠がないと詰む","「完成」って何？"]},{"original_title":"東京高判令5.10.30（破産者マップに対する行政処分）","url":"https://itlaw.hatenablog.com/entry/2026/03/25/214313","court":"東京高判","date":"令5.10.30","year":"令和5年（2023年）","topic":"破産者マップに対する行政処分","categories":["プライバシー"],"fun_headline":"【悲報】「政治団体として運営します」作戦、裁判所に一瞬で見破られる。破産者マップ事件の全貌","hook":"みなさん「破産者マップ」って覚えてますか。\n\n官報に掲載された破産者の氏名と住所を地図に表示するサービスで、一時期かなり話題になったやつです。\n\n個人情報保護委員会に「やめろ」と命令されても止まらなくて、今度は「政治団体として運営します」という謎の戦法を使ってきた。\n\n裁判所はそれにどう答えたか。\n\nちょっと待って、これ読んだら驚くから。","summary":"・テーマ: 破産者マップに対する行政処分\n・個人情報の話","what_happened":"順を追って説明しますね。\n\nまず「破産者マップ」というサービスがあった。\n\n官報（国が出す公式の広報紙みたいなもの）に載っている破産者の情報——氏名と住所——をデータベース化して、検索できるようにしたウェブサービスです。\n\nここで僕の話をさせてほしいんですけど、官報って普通の人はほぼ読まないじゃないですか。それを検索できるデータベースにするというのは、技術的には面白いんですけど、倫理的には…って感じですよね。話を戻します。\n\n個人情報保護委員会（個情委）は、このサービスを運営するａ社に対して「やめなさい」という命令（行政処分）を出した。\n\nａ社は「その命令はおかしい、執行停止してくれ」と裁判所に求めたが、却下された。\n\nで、ここからがヤバいんですけど——\n\nその直後に、ａ社と所在地・代表者が完全に同じ「政治団体側」という政治団体が設立されて、このサービスの運営がそっちに移管された。\n\nえっ。マジで？\n\n個情委は「見え見えですよ」として今度は政治団体側に対して処分を出した。\n\n・個人情報保護法23条1項違反\n・このサービスを通じた個人データの提供を停止すること\n\n政治団体側は「その処分は違法だ」として、国（相手方）を訴えた。\n\n一審（東京地裁）は政治団体側の訴えを棄却。政治団体側が控訴したのが本件。\n\n【ちょっと解説】引用── 他人の著作物を自分の著作物の中に取り込むこと。「出所の明示」「主従関係」「必然性」などの要件を満たせば、著作権者の許諾なしでOK。","issue":"で、何が問題になったかというと——\n\n政治団体側は以下の3つを主な根拠として処分の取消しを求めていた。\n\nここテストに出ます。\n\n（1）「政治団体」だから適用除外のはず\n\n個人情報保護法76条1項5号は「政治団体の用に供する目的」なら義務の適用が除外されるという規定がある。「うちは政治団体だからこの法律の縛りを受けない」という主張。\n\n（2）「報道目的」だから適用除外のはず\n\n同じく「報道の用に供する目的」も除外規定がある。「官報の情報を周知するのは報道だ」という主張。\n\n（3）財産保護のために必要だから除外事由に当たるはず\n\n法律には「人の生命・身体・財産の保護のために必要な場合」は第三者提供できるという例外がある。「破産者情報を提供することで取引相手を守れる」という主張。","ruling":"裁判所、こう言いました。\n\nまず「政治団体」かどうかについて——\n\n政治団体側は、ａ社において個人情報保護法所定の命令等を受けることを回避し、このサイトを継続させるという目的で設立されたものと認めるのが相当である。そして、（略）上記事実に加え、本件全証拠によってもａ社が同法７６条１項５号所定の「政治団体」に該当すると認めるに足りないことを併せ考えると、政治団体側についても同法７６条１項５号所定の「政治団体」に該当するとは認められず、また、このサイトの運営が「政治活動（これに付随する活動を含む。）の用に供する目的」でされていたと認めるに足りる証拠もない。\n\n「処分逃れのために設立した団体ですよね、政治団体じゃないですよね」と一発で見抜かれた。\n\n次に「報道」かどうかについて——\n\n個人情報保護法所定の「報道」とは、不特定かつ多数の者に対して客観的事実を事実として知らせることをいうが、政治団体側の規約における目的（第２条）をみても、「不特定かつ多数の者に対して客観的事実を事実として知らせる」旨は掲げられておらず、むしろ「官報が公告している個人が特定できる情報（中略）の流通を一律的に規制している個人情報保護法について反対すること」が掲げられていることに照らすと、政治団体側は、この目的を達成するために破産者等の破産手続等に係る個人情報を取捨選択することなくこのサイトにそのまま提供しているということができ、「事実として知らせる」ことを目的としてはいないというべきである。\n\n「規約に書いてある目的が『個人情報保護法に反対すること』になってますよね？それは報道じゃないですよね」と、自分たちの規約で自滅した形。\n\n「財産保護のために必要」かどうかについても否定された。\n\n個人情報保護法において、同項の適用除外事由の一つとして「人の生命、身体又は財産の保護のために必要がある場合」が定められているところ、同項の上記の趣旨を踏まえると、同号の事由に該当するか否かの判断に当たっては、個人データの提供により本人が被るおそれのある権利利益の侵害を考慮してもなお第三者の権利利益保護の要請が上回る等の事情があるか否かを検討する必要がある。\n\nそこで検討するに、破産手続等に至る過程や破産手続等後の状況といった事柄は個別性が高いものであるから、破産者等の破産手続等に係る情報を取引相手等の第三者に提供することが直ちに取引相手の財産の保護に資するとは一概にはいい難い。\n\nこの時点で嫌な予感がしますよね。はい、的中です。\n\n（略）このように、このサイトによって破産者等の破産手続等に係る情報を提供しないことにより取引相手等が被り得る財産の侵害は抽象的なものにとどまるのに対し、破産者等の破産手続等に係る情報が第三者に提供されることにより破産者等が被り得る権利利益の侵害は具体的なものといえる。\n\n（略）このサイトにより提供されている個人データには本人の氏名及び住所が含まれ、政治団体側が個人データ作成時に本人に連絡を取ることは可能であるから、「本人の同意を得ることが困難であるとき」に該当すると認めることはできない。\n\n最後に「重大な権利利益の侵害が切迫している」かどうかについて——\n\n個人の重大な権利利益の侵害が切迫」しているといえるか否かについては、権利利益を侵害される個人の数の多さや個々の権利利益侵害の程度の大きさ（問題となる個人情報の性質、取扱いの目的・方法等に起因する個人の権利利益の侵害の深刻さ等）を踏まえて総合的に判断するべきものである。\n\nこのサイトは、官報に掲載された破産者等の破産手続等に係る情報を第三者に提供していることから、権利利益を侵害される個人の数は多数に上る。そして、特定の個人が過去に破産手続等を受けたという事実は、当該個人の経済的信用性に関する評価等に影響を及ぼすものであり、一般に知られたくない機微な情報に該当するところ、上記事実に係る情報を不特定多数の者に容易に知られる状況に置かれた場合に侵害され得る権利利益は、そのような情報を取得した側の目的に応じて広範囲に及び、当該個人の社会経済を含む生活全般に影響が生じるおそれがある。また、前提事実(1)アのとおり、このサイトにおける個人データの提供方法は、氏名又は住所を入力し検索機能を利用すること等により、不特定多数の者が容易に当該対象の情報に到達することができるというものであり、一旦不特定多数の者に伝播すると、短期間で広範囲に拡散し得る性質を有することから原状回復は困難であるため、個人の権利利益の侵害の程度は深刻なものといえる。\n\n以上によれば、政治団体側が本件勧告に係る措置をとらなかったことにより、本件処分時において「個人の重大な権利利益の侵害が切迫」していたと認められる。\n\n控訴審で新たに追加された主張についても、特に見るべき点はなく、いずれも退けられた。\n\n裁判所、バッサリ。","takeaway":"で、結局なにが大事なの？\n\n・行政処分を逃れるために別法人を作っても、目的が同じなら「同一視」される\n・自分たちで作った規約・ウェブサイトの記載が、裁判で自分に不利な証拠になることがある\n・「公開されている情報」でも、それをまとめて検索できるようにすると個人情報の問題になりえる\n・「取引相手の財産保護のため」という理由は、被害者のプライバシー侵害より抽象的なら認められない\n\n個人情報の取り扱い、他人事だと思ってると痛い目を見る。マジで。","one_liner":"「法律の抜け穴として政治団体を作る」作戦、裁判所には1秒で見抜かれる。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"個情委(国)"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["証拠がないと詰む"]},{"original_title":"東京地判令5.10.4（グーグルマップと個人情報データベース等）","url":"https://itlaw.hatenablog.com/entry/2024/04/01/221951","court":"東京地判","date":"令5.10.4","year":"令和5年（2023年）","topic":"グーグルマップと個人情報データベース等","categories":["プライバシー"],"fun_headline":"【驚愕】グーグルマップに載ってても「個人情報の無断提供」にはならなかった件","hook":"今日の話、個人情報の話なんですけど。\n\n「自分の情報がグーグルマップに勝手に載ってる！」ってなったとき、法律的にどうなるか、みなさん知ってます？\n\n僕は知らなかった。まったく知らなかったし、調べてみたら「そういうことか……」ってなった。\n\n今日はその「そういうことか」の話をします。","summary":"・絡んでる金額: 40万円\n・テーマ: グーグルマップと個人情報データベース等\n・個人情報の話","what_happened":"主人公は法律事務所を経営する本人側です。\n\n本人側の事務所がグーグルマップに載っていて、そこに口コミが投稿された。\n\nそれ自体はよくある話なんですけど、本人側はこう主張した。\n\n「これ、個人情報保護法（個情法）に違反してる！　同意なく第三者に提供するな！　削除して！　あと慰謝料40万円払って！」\n\nここで僕の話をさせてほしいんですけど。\n\nグーグルマップって、口コミを書こうとすると「この場所についてレビューを書く」みたいな流れになるじゃないですか。あれって地図に紐づいてるんですよね。「場所」の情報として整理されてる。\n\n話を戻しますね。\n\n本人側の主張のポイントはここです。\n\nグーグルマップは個人事業主の情報に索引をつけて検索できるようにした「個人情報データベース等」に当たる、と。\n\n【ちょっと解説】個人情報データベース等── 個人情報をコンピューターで検索できるように体系的に整理したもの。住所録や顧客リストのイメージ。\n\n個人情報データベースに含まれる情報は「個人データ」になる。個人データを本人の同意なく第三者に提供したら違法。だから止めろ、という論理展開です。\n\nで、ここからがヤバいんですけど、グーグルはこれに対して「いや違います」と応戦した。\n\n裁判所の答えは……。","issue":"要するに何が問題だったの？\n\nグーグルマップって「個人情報データベース等」なの？　それとも違うの？\n\nここテストに出ます。\n\n個情法では「個人情報データベース等」はこう定義されてます。\n\n（定義）\n第十六条　この章及び第八章において「個人情報データベース等」とは、個人情報を含む情報の集合物であって、次に掲げるもの（略）をいう。\n一　特定の個人情報を電子計算機を用いて検索することができるように体系的に構成したもの\n\n「個人情報として」体系的に整理されてるか、というのがキモです。\n\n本人側は「個人事業主に索引をつけて検索できるようにしてある、これが個人情報データベースだ」と主張した。\n\nグーグルマップは「地図」として整理されてる。「個人情報」として整理されてるわけじゃない。ここが争点になった。","ruling":"裁判所はこう言いました。\n\nグーグルマップでは、地図上に存在する、個人・法人を含む（場所に関連した）事業主のほか、川や山、道路や公園などの地名や企業名等特定の「場所」に関して口コミ情報として、ユーザーが投稿できるようにされており、当該「場所」に関する情報を検索して抽出する索引が付されたデータベース機能が備わっている（弁論の全趣旨）。換言すれば、地図上の地点に結び付けて電子掲示板のスレッドが立てられている状況であって、地図情報の索引に従って検索すると、電子掲示板の内容がみられるデータベースということができる。ところで、個人情報データベース等に該当するか否かについて、立法の過程（乙８）にも鑑みれば、インターネットの検索エンジンのように、検索した結果、たまたま個人情報が検索できる場合を含まないものとされ、個人情報データベース等に該当するためには、個人情報として体系的に構成され、索引が付されている情報を検索することが可能であることがその要件であると解される。グーグルマップは、前記認定のとおり、地図上の地点に関する情報を、体系
