\nここで僕の話をさせてほしいんですけど、「孫請け」ってなんか宿命を感じますよね。下に行けば行くほど、上の決断の影響をもろに受ける。僕も下っ端のバイトをやってた頃、そういう理不尽をよく感じてました。話を戻します。\n\n発注側開発側間では、契約を8本も結んでいます。えっ、8本。\n\n- 契約１：子機・親機・中継機の初期開発設計と1次試作品の製作　約1586万円\n- 契約２：約321万円\n- 契約３：約948万円\n\n……以下、全部で8本、合計で数千万円規模です。\n\nで、代金が支払われたのは契約１の全額と、契約２・３の半額だけ。残りは未払いです。\n\n開発側の言い分は「仕様を満たしてないから払わない」。\n\nちなみに全然関係ないけど、「仕様を満たしてない」って言葉、IT業界でいちばん揉める言葉のトップ3に入ると思います。\n\n発注側はもちろん「いや、ちゃんと作りましたよ」と反論。未払い報酬の約1186万円と、仕様提示が遅れたことや量産中止を求めたことによる損害賠償として合計約1645万円を請求しました。\n\n開発側は逆に「そもそも取締役会の決議を経てないから契約が無効だ」として、すでに払った約2220万円を返せという反訴まで起こした。\n\nこの戦場感、すごくないですか。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n開発側の主張はこう：「発注側が納入した試作品は合意した仕様を満たしてなかった。それに検収もしてない。だから代金は払わなくていい。」\n\n【ちょっと解説】検収（けんしゅう）── 「確認しました、OKです」と納品物を正式に受け取ること。これが終わると基本的に「やっぱダメ」とは言いにくくなる。\n\n発注側の主張はこう：「そんな仕様の合意なんてしてないし、ちゃんと作って納品した。検収は関係ない。払え。」\n\n両者の言い分、平行線です。裁判所が真ん中に入って判断するしかない。","ruling":"さあ、裁判所の答えです。\n\nまず「仕様の合意はあったのか」について、裁判所は「開発側が主張するような仕様の合意はなかった」と認定しました。開発側、出鼻をくじかれる。\n\nそのうえで「検収がないと代金を払わなくていいの？」について、裁判所はこう言いました。\n\nこの契約１、２及び４は、発注側が、発注側と開発側との間で確定された仕様に基づき製品を製作し、開発側に納入することを内容に含むものであり、請負契約としての性質を有するものであるところ、かかる目的物の引渡しを内容に含む請負契約において請負人が仕事を完成させたといえるためには、請負人が当初の請負契約で予定していた仕事の最終の工程まで終えて、注文者に目的物を引き渡すことが必要である一方、必ずしも、注文者における目的物の検収を要するものではないと解するのが相当である。\n\nつまり「請負契約において、検収は仕事完成の条件じゃない」ということ。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。レストランで「カレーください」と注文するようなもので、カレーが出てこなかったら契約違反。\n\nさらにこう続きます。「仮に検収が条件だったとしても、取引基本契約書では『開発側は納入から10営業日以内に検収するものとする』と定めていた。開発側がその期間内に不合格通知を出した証拠がない。だから検収完了と見なす。」\n\n裁判所、めっちゃ冷静。好き。\n\n結果として、未払い代金の限度で発注側の請求が認められました。仕様提示の遅れや量産中止による損害賠償は認められませんでしたが、メインは勝った。","takeaway":"で、結局なにが大事なの？\n\n- 請負契約において、検収は仕事完成の必須条件ではない。 最終工程まで終えて引き渡せばOK\n- 「検収しないから払わない」は通じない場合がある。 特に期限内に不合格通知を出してないと「検収完了」扱いになることも\n- 「仕様の合意」は書面に残せ。 口頭の合意は裁判で証明するのが地獄\n- 自分の契約が「請負」か「準委任」か確認しろ。 請負は完成責任あり、準委任は善管注意義務\n\nこれ、ラーメン屋さんに「ラーメン出してもらったけど、食べてないから代金払わなくていい？」と聞いたら「出したんだから払え」って言われるのと同じ話です。食べる義務は発注者側にある。","one_liner":"「検収してない」は代金拒否の魔法の言葉じゃない。10営業日以内に文句を言え。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"IoT開発会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"発注元企業"}],"lessons":["契約書読んどけば…","証拠がないと詰む","「完成」って何？"]},{"original_title":"東京地判令4.6.17（PaaSを使ったシステム開発の頓挫　文化シヤッター・日本IBM）","url":"https://itlaw.hatenablog.com/entry/2022/07/18/202916","court":"東京地判","date":"令4.6.17","year":"令和4年（2022年）","topic":"PaaSを使ったシステム開発の頓挫　文化シヤッター・日本IBM","categories":["プログラム・システム"],"fun_headline":"【8億円】文化シヤッターvs日本IBM、夢のシステム開発が「全部ベンダのせい」で終わった話","hook":"みなさん、「8億円のシステム開発が頓挫したらどうなるか」って考えたことありますか。\n\n僕はないです。スケールが違いすぎて。\n\nでも2022年の裁判では、文化シヤッターが日本IBMに「約28億円の損害賠償」を求めた事件が決着しました。\n\n最終的に日本IBMが85%の責任を負うという判決が出て、IT業界がザワついた案件です。\n\nこれ、「ベンダが悪い」「ユーザーが悪い」の話じゃなくて、「契約ってこわいな」という話なんですよ。","summary":"・絡んでる金額: 8億円\n・テーマ: PaaSを使ったシステム開発の頓挫　文化シヤッター・日本IBM\n・システム開発のトラブル","what_happened":"ちょっと長くなるけど、大事な話なので付き合ってください。\n\n文化シヤッター（X）は、販売管理システムを新しくしたかった。それを日本IBM（Y）に委託しました。\n\n使ったのはセールスフォースのプラットフォーム（PaaS部分）。よくあるSaaSじゃなくて、PaaSを使ってカスタム開発するという、わりと攻めた手法です。\n\n【ちょっと解説】準委任（じゅんいにん）── 「結果は約束しないけど、プロとしてちゃんとやります」という契約。美容院で「いい感じにしてください」と言うのに近い。SES契約はだいたいこれ。\n\nここで要注意なのが契約内容です。IBMとの契約には共通約款があって、こう書いてありました。\n\n- 「この契約は請負じゃなくて準委任です。完成の保証はしません」\n- 「IBMの損害賠償責任は、そのサービスの料金相当額が上限です」\n\nえっ。マジで？\n\n「料金相当額が上限」ってことは、支払った金額以上の損害は補償されないってことですよ。これが後でものすごく効いてくる。\n\nで、開発が始まるわけです。一次要件定義、二次要件定義と進んで、設計・開発フェーズへ。\n\nここで問題が起きます。仕様が固まらないまま次のフェーズに進んじゃったんですよ。しかも「アジャイル開発でやりましょう」と言っといて、実際はウォーターフォール型で進んでた。\n\nここで僕の話をさせてほしいんですけど、「アジャイルって言いながら結局ウォーターフォール」って、IT業界あるあるすぎて思わず笑ってしまいました。これ他人事じゃない。話を戻します。\n\n2016年3月にシステム結合テスト（SIT）が始まったけど、難航して中断。ユーザ受入テスト（UAT）も8月から始まったけど、エラーが続出して難航。\n\n2017年1月、IBMの要員が撤収します。\n\nIBMは一度、ニューヨークの米国本社の専門家チームと協議して「スコープを大幅に縮小して、標準部品を最大活用する」という再提案をします。でも再開には至らず。\n\n2018年7月、個別契約が解除されて完全に終了しました。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n\nユーザー側は「被告側のせいで全部ダメになった」として約27.8億円の損害賠償を請求。被告側はユーザー側に対して「ユーザー側のプロジェクト管理が悪かったから」として約12億円の反訴も起こしました。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n大きく「被告側の責任はどこまでか」「ユーザー側の責任はどこまでか」「損害額はいくらか」という三本柱の争いです。\n\n特にポイントは「過失相殺」。つまり、両方が悪いとしたら、それぞれ何%ずつ責任を取るのかという話。\n\n裁判所は被告側の責任を85%、ユーザー側の責任を15%と認定しました。\n\nなんでユーザー側にも15%の責任があるかというと、こういう事情が認定されています。\n\n- 仕様変更が頻繁に起きて、プロジェクト管理を困難にした\n- 「仕様変更は今後しません」という趣旨の発言はしたけど、それは書面の合意じゃなかった\n- 被告側が「仕様変更だ」と主張するものの一部は、実はバグだった\n- 動く画面を見せながら仕様を確定するやり方をあまりしなかったので、ユーザー側が仕様をイメージしにくかった\n\nこの最後の点、面白いですよね。「動く画面を見せない」のがユーザー側の責任にされてる。ユーザー側も悪かったと。","ruling":"裁判所、こう言いました。\n\n過失相殺の割合について、こう述べています。\n\nこれらの事情を考慮すれば、原告の損害賠償請求にはなお一定の過失相殺を認めるべきであるものの、その程度はそう大きいとはいえないというべきであり、上記のような諸点を勘案すると、公平の見地から、原告の被った損害のうち、被告に帰責すべき部分は、その８５％の範囲にとどまるものと解するのが相当である。\n\nつまり「ユーザー側にも落ち度はあるけど、そこまで大きくない。被告側が85%悪い」。\n\n裁判所、めっちゃ冷静。好き。\n\n計算すると、約23.3億円の損害額に85%をかけて約19.8億円が認容。\n\nこれ、個別契約の合計金額を下回るので「損害賠償の上限をサービス料金相当額とする」という責任限定条項の適用もなくなりました。文化シヤッター的には上限条項という罠を回避できた形。\n\n被告側の反訴（ユーザー側への約12億円請求）は全部棄却。被告側からの請求はゼロです。\n\nあ、今思い出したんですけど、IBMがニューヨーク本社まで専門家を呼んで再提案したのに、それでも再開できなかったっていうの、これかなりやばい状況ですよね。","takeaway":"で、結局なにが大事なの？\n\n- 「準委任」と書いてあっても、プロジェクト管理義務は免れない。 ベンダは「ちゃんとやります」の責任がある\n- 仕様変更は書面で合意しろ。 口頭で「今後変えません」と言っても証拠にならない\n- 責任限定条項、ちゃんと読め。 「料金相当額が上限」の条項、今すぐ自社の契約書を確認してください\n- ユーザー側もプロジェクト管理義務がある。 「仕様決めないのはベンダのせい」は通じない\n\n今気づいたんですけどこの案件、IBMがニューヨークまで行って専門家と協議してるんですよ。それでもダメだったっていう。スケール感が違いすぎる。","one_liner":"システム開発、一番難しいのはコーディングじゃなくて合意形成。それが崩れると8億円が消える。","parties":[{"role":"被告側","icon":"⚖️","side":"defendant","desc":"日本IBM"},{"role":"ユーザー側","icon":"👤","side":"plaintiff","desc":"文化シヤッター"}],"lessons":["契約書読んどけば…","「完成」って何？","PM不在の悲劇"]},{"original_title":"横浜地判令4.6.17（ヤフオクの契約成立時期、錯誤、逸失利益等）","url":"https://itlaw.hatenablog.com/entry/2023/03/05/064253","court":"横浜地判","date":"令4.6.17","year":"令和4年（2022年）","topic":"ヤフオクの契約成立時期、錯誤、逸失利益等","categories":["契約・報酬"],"fun_headline":"【ヤフオク】落札したのに「この価格では売れません」→ 裁判所「それは債務不履行です」","hook":"みなさん、ヤフオクって使ったことありますか。\n\n僕はあります。昔、何かを売りました。もう何を売ったか覚えてないけど。\n\nで、きょうの話なんですけど、ヤフオクで落札したのに「この価格では売れません」って言われた人が裁判を起こした案件があります。\n\n金額は10万円くらい。裁判費用の方が高そうな金額ですけど、それでも訴えた。\n\n「ネットのオークションって法的にどういう扱いなの？」という話なので、けっこう面白いですよ。","summary":"・絡んでる金額: 10万円\n・テーマ: ヤフオクの契約成立時期、錯誤、逸失利益等\n・契約とお金の話","what_happened":"経緯を時系列で整理します。日付は全部令和3年4月26日の話です。\n\n発注側が、開発側が出品した腕時計に92,000円で入札しました。\n\nしかし発注側より高い金額で入札した人が2人いた。上から「第1落札者」「第2落札者」と呼びましょう。発注側は補欠の位置にいる。\n\nここで謎の展開が起きます。\n\n- 21:37　開発側が第1落札者を「落札者削除」という方法で取り消した\n- 21:42　開発側が第2落札者も同じく取り消した\n- ここで発注側が補欠から繰り上がった\n\nいや、おかしくないですか？ なんで上位2人を消してるの？\n\n- 21:52　発注側は落札に同意するか確認されて、同意した\n- 21:57　発注側は代金92,000円と送料を支払って、取引ナビから「よろしくお願いいたします」と送った\n- 22:04　開発側が発注側に「この価格では売れません」と連絡した\n\nここで僕の話をさせてほしいんですけど、「よろしくお願いします」ってメッセージを送った7分後に「この価格では売れません」って返ってきたら、僕ならしばらくスマホを置けないと思います。動悸がすごい。話を戻します。\n\nその後、開発側は「発注側の都合でキャンセルした」という形にして、発注側を落札者から削除しました。\n\nちなみに全然関係ないけど、「都合でキャンセル」という表現、全部相手のせいにできる便利な言葉ですよね。でも証拠が残ります。記録って怖い。\n\n発注側が裁判を起こした理由は二つ。\n\n①債務不履行に基づく損害賠償として逸失利益（約10万円）の請求\n②開発側が「発注側のせいでキャンセル」という評価をしたことについて、不法行為に基づく慰謝料（3万円）の請求\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\n一審では②だけ認めて①は認めなかったので、発注側が控訴したのがこの裁判です。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n「逸失利益」を認めるかどうか、です。\n\n【ちょっと解説】逸失利益── 「あの事故がなければ得られたはずの利益」のこと。システムが止まってる間の売上損失とか。今回は「安く買えたはずなのに買えなかった差額」。\n\n発注側の主張は「この時計は20万円相当なのに92,000円で買えるはずだったのに、その差額10万円弱が損害だ」というもの。\n\n問題は「この時計の価値を証明できるか」です。\n\n「20万円相当」と主張しても、証拠がないと裁判所には認められない。\n\nじゃあどうやって証明するか。ここがポイントです。","ruling":"裁判所、こう言いました。\n\n発注側が本件時計を落札した時点で、当該時計が２０万円相当であったことを裏付ける的確な証拠はない。他方、開発側は、原審で提出した答弁書において、最低でも１５万円で売却しようと思っていた旨主張しており、本件時計が上記時点で１５万円相当の価値を有することを認めている。したがって、発注側は、開発側がこの取引を履行していれば、１５万円相当の本件時計を取得できたはずであるから、発注側には、開発側の債務不履行により、１５万円から控訴人が支払うはずであった９万２５２０円を控除した残額５万７４８０円の損害が発生したと認めるのが相当である。\n\n裁判所、めっちゃスマート。\n\n「発注側が言う20万円の証拠はない。でも開発側自身が『最低15万円で売りたかった』と言ってる。その差額が発注側の損害だ」という論法。\n\n敵の自白を証拠に使う、これ鮮やかすぎませんか。\n\n結果として、15万円から92,520円を引いた57,480円が損害として認められました。発注側が主張した10万円より少ないけど、ゼロじゃない。\n\nあ、今思い出したんですけど、開発側が答弁書に「15万円で売りたかった」と書いちゃったの、これ証拠として使われるとは思ってなかったんですかね。法廷で書いたものは全部記録に残ります。","takeaway":"で、結局なにが大事なの？\n\n- ネットオークションの落札も法的な契約。 「この価格では売れません」は債務不履行になる\n- 損害の証明は具体的な数字で。 「20万円相当」と言うなら証拠が必要。証拠がない主張は通らない\n- 裁判で提出する書類には本当のことだけ書け。 相手の書面に書いてあることが証拠になる\n- 逸失利益は「得られたはずの利益」。 差額を請求できるが、証明責任は請求する側にある\n\nヤフオクの「落札者削除」機能、こんな使い方したらダメですよ、というのが今回の教訓です。","one_liner":"「この価格では売れません」は、売り始めた後に言ったら契約違反。ネットも現実も同じ。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"落札者(個人)"},{"role":"開発側","icon":"💻","side":"defendant","desc":"出品者(個人)"}],"lessons":["証拠がないと詰む","損害、証明できる？"]},{"original_title":"東京地判令4.5.31（テスト設計書ひな型の著作物性・営業秘密該当性等）","url":"https://itlaw.hatenablog.com/entry/2023/04/09/142453","court":"東京地判","date":"令4.5.31","year":"令和4年（2022年）","topic":"テスト設計書ひな型の著作物性・営業秘密該当性等","categories":["著作権","営業秘密"],"summary":"・絡んでる金額: 5万円\n・テーマ: テスト設計書ひな型の著作物性・営業秘密該当性等\n・著作権がらみの争い","fun_headline":"【前職のファイル持ち出し】退職エンジニアの末路が想像以上にエグかった件","hook":"退職するときに「あ、このファイル、転職先でも使えそう」ってなったことないですか。\n\nないですか。そうですか。じゃあ僕だけかもしれない。\n\nでも今日紹介する人は本当にやっちゃったんですよ。しかも裁判まで行った。5万円の話で裁判まで行くってちょっとすごくないですか。ヤバい。","what_happened":"さて本題です。登場人物を整理しますね。\n\n相手方１は、ソフトウェアテスト専門会社の権利者に2017年5月に入社。グループ長まで務めたあと2018年7月に退職。\n\nここで「え、グループ長？」って思いますよね。うん、そうなんです。それなりの立場の人なんです。\n\nで相手方１、退職後はＡＩ研究開発・テスト業務をやる相手方２社に転職しました。華々しい転職ですよ。おめでとうございます。\n\n問題はここからです。\n\n相手方１は入社時と退職時の両方で「秘密守ります」「競業避止します」って誓約書に署名してたんです。\n\n【ちょっと解説】競業避止義務── 辞めた後に「ライバル会社で同じことをやらない」という約束。誓約書に書いてあると原則として守らないといけない。\n\nで、ここからがヤバい。\n\n相手方１は退職の直前に、権利者のテスト設計書ひな型（本件ファイル１）をチャットツールの自分のアカウントにアップロードしたんですよ。\n\nつまり個人アカウントに「持ち出した」わけです。\n\nここで僕の話をさせてほしいんですけど、僕も昔引っ越しのとき前の部屋の鍵をうっかり返し忘れたことがあって、でもそれは全然関係ない話ですね。話を戻します。\n\n相手方２社に転職後、そのファイルをダウンロードして、社内研修資料として使いました。さらにそれを使ってテスト設計書まで作って、お客さんに納品してしまった。\n\n権利者はたまらず請求しました。約12.5万円。大きくはない金額ですが、請求の内容がすごい。不当利得・債務不履行・不法行為・著作権侵害・営業秘密侵害と、ぜんぶ盛り状態です。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\n【ちょっと解説】営業秘密── 不正競争防止法で保護される企業秘密。ただし「秘密管理性」「有用性」「非公知性」の3要件を満たす必要がある。「うちの秘密です」と言い張るだけじゃダメ。","issue":"要するに何が問題だったの？\n\nポイントは「このファイルは法律で守られるものだったのか」という話です。\n\n具体的には2つ。\n\n①著作物として守られるか？\n②営業秘密として守られるか？\n\nここテストに出ます。\n\n（５）営業秘密該当性\n\n裁判所は「秘密として管理されてましたか？」という点を厳しくチェックしました。\n\n【ちょっと解説】秘密管理性── 「ちゃんと秘密として管理していましたか？」という要件。パスワードもかけず共有フォルダに置いてたら、秘密とは認めてもらえない。\n\n権利者は「パスワードかけてた」「持ち出し禁止の掲示をしてた」「誓約書も取ってた」と頑張って主張したんですが……\n\n権利者は、\n\n①各従業員はＩＤとパスワードを入力しなければ業務用パソコンを使用することができなかった、\n\n②ＵＳＢメモリなどをパソコンに接続しても社内情報の持ち出しができない技術的な設定を施していた、\n\n③社内に情報の持ち出しを禁止する旨の掲示をしていた、\n\n④機密情報管理規程として原告が保有する全ての情報を第三者に漏らしてはならないことを定めていた、\n\n⑤退社時には秘密保持義務や競業避止義務を定めた誓約書を提出させていたなどと主張する。\n\nしかし、仮にこのような事情があったとしても、それらの事情は、各事柄の性質に照らし、権利者が本件各ファイルについて営業秘密としての格別の取扱いをしていたことを示すものとまではいえず、（引用者注：本件各ファイルには、個別案件のテスト結果や個人情報等の記載がないことや、マル秘表示もなく、パスワードも設定されず、誰でもアクセス可能であったこと等を挙げて）本件各ファイルが権利者において秘密として管理されていたと認められないことを左右するものではないというべきである。\n\n裁判所、冷静すぎる。好き。\n\nつまり「会社全体のセキュリティ対策はしてたけど、このファイル自体には何もしてなかったですよね？」ってことです。\n\nファイルに「マル秘」のラベルすら貼ってなかった。パスワードもかけてなかった。誰でもアクセスできる場所に置いてあった。\n\nこれじゃ「秘密として管理してた」とは言えないんですよ。\n\n「うちの秘密です！」って叫んでも、ファイルが丸裸だったら裁判所には通じない。","ruling":"裁判所、こう言いました。\n\nテスト設計書ひな型の著作物性について：プログラムのロジックが一通りに決まるようなものは「表現の選択の幅がない」から著作物とは認めにくい。\n\n営業秘密該当性について：ファイルにマル秘表示もなく、パスワードもなく、誰でもアクセスできる状態だった。これじゃ「秘密として管理してた」とは言えない。\n\nというわけで、著作権侵害も営業秘密侵害も認められませんでした。\n\nちなみに全然関係ないけど、「マル秘」ってスタンプ、文具屋で普通に売ってるんですよね。あれ、法的に意味あるんだなって今回知りました。で、\n\n結局権利者の請求はほぼ退けられる形になりました。5万円の請求のために弁護士費用がいくらかかったんだろうと思うと、僕だったら泣きながら寝ます。","takeaway":"で、結局なにが大事なの？\n\n- 秘密にしたいファイルには必ずマル秘表示とアクセス制限を。「うちの秘密です」と言うだけでは法律上守られない\n- 著作物として守られるには「創作性」が必要。テンプレ的なものは著作物と認められにくい\n- 退職するときはファイル持ち出しNG。「ちょっと参考にするだけ」が訴訟の入り口になる\n- 誓約書は署名したら守れ。でも会社側も守りたいものは守り方を考えよう\n\n秘密は「秘密」って書かないと秘密にならない。これ本当に笑えない話です。","one_liner":"秘密は「秘密」って書かないと秘密じゃない。ファイルに何も書いてなかったら裁判所も守れない。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"SWテスト会社"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"元従業員会社"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["著作権は万能じゃない","秘密は管理してナンボ","セキュリティ甘すぎ"]},{"original_title":"東京地判令4.4.22（ゲームキャラクター画像の類似性とインラインリンク）","url":"https://itlaw.hatenablog.com/entry/2023/01/28/121059","court":"東京地判","date":"令4.4.22","year":"令和4年（2022年）","topic":"ゲームキャラクター画像の類似性とインラインリンク","categories":["ネット・コンテンツ"],"summary":"・テーマ: ゲームキャラクター画像の類似性とインラインリンク\n・ネット上の問題","fun_headline":"【衝撃】リンクを貼っただけなのに著作権侵害って言われた話、結末がヤバすぎた","hook":"リンクを貼ったら著作権侵害になると思いますか。\n\n「え、リンクって普通にするじゃん」って思いますよね。僕もそう思います。\n\nでもこれが実際に裁判になったんですよ。しかもゲーム会社同士の話で、SNSの「貼り付け」が問題になった。今日の話ヤバいから最後まで付き合ってください。","what_happened":"順を追って説明しますね。\n\n登場人物はこの3人。\n\n- 原告側：中国のゲーム会社。オンラインゲームＡを日本で配信\n- 被告側：香港のゲーム会社。オンラインゲームＢを配信\n- Ｄ：ゲーム動画を作ってYouTubeに投稿してた第三者\n\n権利者は「相手方ゲームのキャラクター画像が、うちのゲームのキャラクターに似すぎてる！著作権侵害！」と怒りました。\n\nあ、今思い出したんですけど、ゲームキャラのパクり騒動って定期的に起きますよね。スマホゲームのアイコンとかで「これ絶対真似しただろ」ってやつ。あれ全部訴訟になるわけじゃないんですが、今回はなった。話を戻します。\n\n問題はもう1個あって、こっちが今日のメインです。\n\n相手方が自社のフェイスブックページに「Ｄがアップした動画へのリンク」を貼ったんです。いわゆるインラインリンクというやつです。\n\n【ちょっと解説】インラインリンク── リンク先の画像や動画を、自分のページに直接埋め込んで表示させる仕組み。ユーザはリンク先に飛ばず、そのままコンテンツを見られる。\n\nその動画の中に、なぜか（おそらく偶然）権利者ゲームのキャラクター画像が映り込んでいた。\n\n権利者「それも著作権侵害だ！」\n相手方「は？動画はＤが作ったやつで、僕はリンク貼っただけなんですけど？」\n\n僕が相手方の立場だったら「え、え？」となる。えっていうかなった。え。","issue":"要するに何が問題だったの？\n\n主に「インラインリンクを貼った行為が著作権侵害になるか」という話です。\n\n権利者は「リンクを貼ったせいで画像が見えるようになった。それが侵害でしょ」と主張した。\n\nでも裁判所の見方はこうでした。\n\n本件リンク設定行為は、この動画の表紙画面である相手方画像１をリンク先のサーバーから本件ウェブページの閲覧者の端末に直接表示させるものにすぎず、相手方は、本件リンク設定行為を通じて、相手方画像１のデータを本件ウェブページのサーバーに入力する行為を行っていないものと認められる。そうすると、前記(2)アのとおりこの画像１を複製したものと認められる相手方画像１を含むこの動画を相手方ｏｕＴｕｂｅが管理するサーバーに入力、蓄積し、これを公衆送信し得る状態を作出したのは、この動画の投稿者であって、相手方による本件リンク設定行為は、この画像１について、有形的に再製するものとも、公衆送信するものともいえないというべきである。\n\nつまり「動画をアップしたのはＤで、相手方はリンク貼っただけ。相手方が複製したわけでも公開したわけでもない」ってこと。\n\n【ちょっと解説】公衆送信権── 著作権の一種で、著作物をインターネット等で公衆に送信する権利。無断でネットにアップすると侵害になる。\n\n権利者はさらに「でも閲覧者が操作しなくても見えるじゃん」「リンクがなければ見れなかったじゃん」「相手方は宣伝に使って利益を得てるじゃん」と反撃しましたが……\n\nしかし、上記①についてみると、単に、本件ウェブページに相手方画像１を貼り付ける等の侵害行為がされた場合と同一の結果が生起したことをもって、本件リンク設定行為について、複製権及び公衆送信権の侵害主体性を直ちに肯定することはできないというべきである。\n\n裁判所、全部退けた。冷静すぎて怖い。\n\nまた、上記②についてみると、仮に枢要な行為に該当することが侵害主体性を基礎付け得ると解したとしても、本件リンク設定行為の前の時点で既にこの動画の投稿者によるこの画像１の複製行為が完了していたことに照らすと、本件リンク設定行為がこの画像１の複製について枢要な行為であるとは認め難いというべきである。なお、この動画は、本件ウェブページを閲覧する方法によらずとも、この動画が投稿された相手方ｏｕＴｕｂｅの\n「Ｄ」のページにアクセスすることによっても閲覧することができるから、本件リンク設定行為がこの画像１の公衆送信にとって枢要な行為であるとも認められない。\nさらに、上記③についてみると、本件全証拠によっても、本件リンク設定行為により相手方がどの程度の利益を得ていたのかは明らかではないから、その点をもって、相手方がこの画像１の複製及び公衆送信の主体であることを根拠付けることはできない。","ruling":"いよいよ判決です。\n\nキャラクターの類似性については、それぞれのキャラクターを一個一個比較して検討しました。似てるかどうかは「表現の具体的な特徴が共通しているか」で判断されるわけです。\n\nインラインリンクについては、相手方勝訴。リンクを貼っただけでは著作権侵害にはならないということで決着。\n\nここで僕の話をさせてほしいんですけど、SNSでリンクシェアするとき「これって許可いるのかな」って思ったことが一度もなかったんですよ。でもこれ裁判になってたんですね。今後ちょっと怖くなりそう。でも判決ではOKと言ってるので大丈夫です。たぶん。","takeaway":"で、結局なにが大事なの？\n\n- リンクを貼る行為は、原則として著作権侵害にはならない。でも画像を自分のサーバーにコピーして表示したらアウト\n- 「誰がやったか」がめちゃくちゃ大事。リンクの先でやらかしたのが別人なら、貼った側の責任は問いにくい\n- キャラクターの著作権は「表現の具体的な特徴」で判断される。「雰囲気が似てる」だけじゃ侵害にならないこともある\n\nリンクは貼っていい。でも著作権違反のコンテンツをそのままコピーしたらダメ。当たり前のようで、実際に裁判で確認されたの、地味に重要。","one_liner":"リンクを貼っただけでは著作権侵害にならない。でもコピーしたらアウト。この差、でかい。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"中国ゲーム会社"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"香港ゲーム会社"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["パクリの立証は地獄"]},{"original_title":"東京地判令4.4.22（レベニューシェア型取引における説明・情報提供義務）","url":"https://itlaw.hatenablog.com/entry/2022/08/03/222735","court":"東京地判","date":"令4.4.22","year":"令和4年（2022年）","topic":"レベニューシェア型取引における説明・情報提供義務","categories":["その他"],"summary":"・絡んでる金額: 600円\n・テーマ: レベニューシェア型取引における説明・情報提供義務","fun_headline":"「更新率40%になります」→実際7.5%でした。マカフィーvsサードウェーブ、16億円の恨み","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n「売上の見込みが40%のはずが、実際は7.5%でした」っていう話、これをビジネスでやったらどうなるか。\n\n答えは「16億円の損害賠償請求」です。ヤバい。今日はそういう話です。","what_happened":"順を追って説明しますね。\n\n登場人物はこの2社。\n\n- サードウェーブ（原告）：GALLERIAというゲーミングPCで有名なBTOメーカー\n- マカフィー（被告）：あのウィルス対策ソフトのやつ\n\nこの2社、2009年から取引してたんです。内容はこう。\n\nサードウェーブがPCを売るとき、マカフィーのソフトをあらかじめインストールしておく。ユーザが「有効期限切れたから続けて使いたい」と更新したら、その更新料の一部をサードウェーブがもらう。いわゆるレベニューシェアってやつです。\n\n【ちょっと解説】レベニューシェア── 「売上を分け合う」という契約形態。固定報酬じゃなく、実際の収益から割合で分配される。儲かれば両方うれしいけど、儲からなかったときの責任分担がむずかしい。\n\n2014年から新モデル契約に切り替えました。内容は「全PCにマカフィーの15カ月版を入れる。サードウェーブが1台あたり600円のライセンス料を払う。ユーザが更新したら更新料の50%をもらう」というもの。\n\nここで僕の話をさせてほしいんですけど、スマホゲームで「無料でダウンロードできます。でも強くしたかったら課金」みたいな構造、あれとちょっと似てますよね。入口は無料だけど、ハマったら払ってもらう。話を戻します。\n\nさてここからが本番です。\n\nサードウェーブによると、マカフィーの担当者が契約締結前にこう言ったそうです。「更新率は40%と見込まれます。3年で約6.4億円のレベニューシェアになりますよ」と。\n\nで、実際の更新率は7.5%でした。\n\n40%が7.5%ですよ。居酒屋で例えると「このメニュー40人前くらい食べられますよ」って言われて頼んだら7.5人前しかなかったみたいな話です。いや全然違うか。でもそれくらいの落差です。\n\nサードウェーブは「誤った情報を信じて契約したせいで損した。不法行為だ」として16億円の損害賠償を請求しました。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。","issue":"で、裁判所に聞きたいことはこういうこと。\n\n「見込みを伝えること」が不法行為になるか、という話です。\n\nここテストに出ます。\n\nポイントは「40%という見込みは、故意または過失による虚偽の説明だったのか？」ということ。\n\n要するに「嘘をついたのか、それとも外れただけなのか」です。\n\n予測が外れることは普通にあります。でも「根拠のない数字で相手を丸め込んだ」なら不法行為になりえる。\n\nこの差をどう判断するかが争点でした。","ruling":"裁判所、こう言いました。\n\n「更新率40%」という見込みについて裁判所は慎重に検討した様子で、当時の状況や担当者の発言の証拠を丁寧に確認しています。\n\nちなみに全然関係ないけど、ビジネスで「見込みです」「想定です」「試算では」って言葉、どこまで信じていいか毎回迷いますよね。今日の話を読んで余計に迷うようになりました。で、\n\n裁判所の判断は「説明義務違反の有無」と「損害額」について丁寧に判断し、サードウェーブの請求の一部について認容する判断をした事案です。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n- 見込みや試算を相手に伝えるときは根拠を示せ。「たぶんこれくらい」で丸め込んだら不法行為になる可能性がある\n- レベニューシェア契約では「更新率」などの前提数値が命。契約前にちゃんと根拠を確認しよう\n- 「想定が外れました」で16億円の訴訟になる。見込みの説明は慎重に、文書で残すべき\n- 他人の失敗から学ぶのが一番コスパがいい。この判例はその最たる例です\n\nビジネスの「見込み」は根拠と一緒に文書で出せ。口頭の数字は後から「言った言わない」になる。","one_liner":"見込みは根拠とセットで文書に残せ。口頭の数字が16億円の訴訟になる。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"サードウェーブ"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"マカフィー"}],"lessons":["金の話は最初にしろ","損害、証明できる？"]},{"original_title":"東京地判令4.4.15（Amazonで購入した製品の発火とその責任）","url":"https://itlaw.hatenablog.com/entry/2022/10/27/235120","court":"東京地判","date":"令4.4.15","year":"令和4年（2022年）","topic":"Amazonで購入した製品の発火とその責任","categories":["責任・損害"],"summary":"・絡んでる金額: 30万円\n・テーマ: Amazonで購入した製品の発火とその責任\n・責任の所在を巡る争い","fun_headline":"【実話】Amazonで買ったモバイルバッテリーが発火→家が燃えた→Amazonに請求→結果がヤバい","hook":"みなさんAmazonで買い物しますよね。僕もします。毎週します。\n\n今日の話を聞いたら、ちょっと怖くなるかもしれません。\n\n「Amazonで買った商品が発火して家が燃えた。Amazonに賠償してもらえるか」という裁判です。どういうこと。","what_happened":"ちょっと長くなるけど、大事な話なので付き合ってください。\n\n個人側がAmazon（相手方）のサイトでモバイルバッテリーを購入。でも販売者として表示されていたのは第三者という別の業者でした。\n\nここ大事なとこです。\n\nAmazonのマーケットプレイスっていう仕組み、知ってますか。Amazonのサイト上に他の販売業者が出品できる仕組みです。Amazonが直接売ってるやつと、マーケットプレイス出品者が売ってるやつがある。今回はこの「別の業者が売ってた」パターンです。\n\n購入から約1年半後、そのバッテリーが発火。個人側の自宅の一部が燃えました。\n\n個人側の気持ち、わかる。めっちゃわかる。つらすぎる。\n\n個人側は販売業者の第三者に連絡しようとしたけど、連絡が取れない。\n\nＡｍａｚｏｎに「なんとかしてくれ」と仲介を頼んだら「販売者と直接やり取りしてください」と言われた。\n\nここで僕の話をさせてほしいんですけど、僕も昔ネット通販でトラブルがあって出品者に連絡しようとしたら返事が来なくて3週間悩んだことがあります。あれは精神的によくなかった。でもそんなレベルじゃない話ですね。話を戻します。\n\n個人側は約2年かけてようやく中国法人との和解を成立させました。でもそれで終わりにしなかった。今度はAmazonに「あなたも責任があるはずだ」と30万円の損害賠償を請求しました。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。","issue":"で、裁判所に聞きたいことはこういうこと。\n\nAmazonのようなプラットフォーム（場を提供してるだけの会社）に、出品業者の問題について責任があるか？という話です。\n\n個人側は具体的にこう主張した。\n\n- Amazonは出品審査をちゃんとすべきだった（それを怠った）\n- Amazonは保険・補償制度を整備すべきだった（それもしなかった）\n- 連絡先として使えない電話番号が表示されてた（特定商取引法違反じゃないか）\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。","ruling":"裁判所、こう言いました。\n\nまず出店・出品審査義務については否定した。\n\n原告は、上記アの主張の根拠として、消費者委員会内に設けられたオンラインプラットフォームにおける取引の在り方に関する専門調査会が作成した報告書（甲１０。以下「この報告書」という。）を挙げる。\nしかし、この報告書は、そもそも作成されたのが平成３１年４月と本件売買契約から約２年１０か月も後である上、その内容も、プラットフォーム事業者の出店・出品審査の関係では、利用者の安心、安全に向けた「提言」としてのものであり、直ちに上記アの主張の裏付けとなるものではない。\n\n裁判所のまとめ方がめちゃくちゃ冷静。好き。\n\n「その報告書、事故の3年後に作られたやつですよね？しかも提言であって義務ではないですよね？」という話です。\n\nまた、保険・補償制度についても否定。\n\nこの報告書中の保険・補償制度に係る提言は、インターネット取引に関するアンケート調査の結果、プラットフォーム事業者において行ってほしいサービスとして、詐欺に遭った場合の返金、消費者トラブルにあった場合の補償を求める回答が約１割程度見られたことを受けたものであるから、一定の場合に代金の一部又は全部を返金するという被告が採用済みの「マーケットプレイス保証制度」は、上記提言に沿ったものと認められるとともに、いずれにせよ、原告が主張するような保険・補償制度の構築をプラットフォーム事業者に義務付ける趣旨のものとは認められない。\n\nここ、大事なとこです。赤線引いてください。\n\n「Amazonはすでにマーケットプレイス保証制度を持っている。それで十分では？」という裁判所の見方です。\n\nさらには不法行為責任についても否定した。\n\n本件バッテリーについては、出品者への連絡先として電話番号が記載され、それとは別に、連絡用のフォームも用意されていて、現に、原告は、上記フォームを利用してオーキーらと連絡を取り、本件和解を成立させているのである。この過程で、本件バッテリーに係る本件特商法表示として記載された電話番号に電話を架けたが誰も出なかったとしても、そのことから当然に、本件バッテリーの出品者について本件特商法表示の不備があるということにはならず、まして、被告について、上記本件特商法表示に関する義務違反があると認めることはできない。また、原告は、オーキージャパンないしオーキーらへの連絡方法が限られ迅速な対応が受けられなかったとも指摘するが、そもそもオーキージャパン等といつどのように連絡を取ろうとしたか（電話を何回架けたかを含む。）について、具体的な主張立証をしていない上、中国法人であるオーキーらとの連絡方法として電話及び上記フォーム以外に何を想定しているのかも不明である。いずれにしろ、オーキージャパン等の対応の遅れがあったとして、その責任を被告に負わせるべき根拠は認め難い。\n\n「フォームで連絡できたんだから、そこまで言いますか」という感じの裁判所の判断です。\n\nその他の主張も全部退けられた。個人側の30万円の請求は認められませんでした。","takeaway":"で、結局なにが大事なの？\n\n- Amazonマーケットプレイスで買うとき、販売者がAmazonじゃない場合がある。問題が起きたらまず販売者に連絡\n- プラットフォーム事業者に無限の責任はない。「場を提供してるだけ」という立場は法的に一定の保護がある\n- 連絡先や証拠は都度記録しておけ。「連絡しようとしたけど誰も出なかった」は具体的な記録がないと弱い\n- 不満をぶつける前に、何回連絡したかメモしておこう。裁判所は記録がないと信じてくれない\n\n責任の所在は「法的義務があったか」で決まる。「なんとかしてほしかった」は理由にならない。","one_liner":"Amazonが悪い、は法的には通らない。通販トラブルは販売者を特定して記録を残せ。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"Amazon"},{"role":"個人側","icon":"👤","side":"plaintiff","desc":"消費者(個人)"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["証拠がないと詰む","プラットフォームの罠"]},{"original_title":"東京地判令4.3.29（納期変更の合意と現行踏襲の不達成）","url":"https://itlaw.hatenablog.com/entry/2023/08/03/191703","court":"東京地判","date":"令4.3.29","year":"令和4年（2022年）","topic":"納期変更の合意と現行踏襲の不達成","categories":["瑕疵・完成"],"summary":"・絡んでる金額: 3000万円\n・テーマ: 納期変更の合意と現行踏襲の不達成\n・完成したかどうかの争い","fun_headline":"【3000万円の争い】「完成してます」「してないだろ」システム開発の永遠の戦い、裁判所の答えが予想外だった","hook":"「バグです」「仕様です」\n\nIT業界で一番消耗する会話がついに法廷へ行きました。\n\n今日紹介するのは「システム完成してる・してない」で3000万円の請求になった話です。みなさん他人事じゃないですよ。特にIT関係の人、最後まで読んで。","what_happened":"ちょっと長くなるけど、大事な話なので付き合ってください。\n\n登場人物はこの2社。\n\n- 開発側：システムを作る側\n- 発注側：システムを発注した側\n\nあと第三者という会社（発注側の取引先）も連携先として絡んできます。\n\nまず開発側と発注側は「要件定義書を作りましょう」という支援業務から始めて、無事にその代金は支払われました。よかったよかった。\n\nその後、本命の「ソフトウェア開発業務委託契約」を2017年6月に締結。契約上の納期は2017年10月31日でした。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。レストランで「カレーください」と注文するようなもので、カレーが出てこなかったら契約違反。\n\nでも2018年3月13日、発注側が開発側に「解除します」と通知しました。納期から5ヶ月も経ってから。\n\nここで僕の話をさせてほしいんですけど、「もう終わりにします」って連絡が来るの、システム開発に限らず精神的にキツいですよね。僕は昔バイト先に「明日から来なくていい」って言われたことがあって、あれは地獄でした。全然関係ない話ですね。話を戻します。\n\n開発側は「正当な理由のない開発中止だ」として3000万円を請求（本訴）。\n\n発注側は「いや完成してなかったから解除したんだ。払ったお金返せ」として反訴。\n\n壮絶な戦いが始まりました。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。","issue":"要するに何が問題だったの？\n\n発注側が「このシステム、完成してないよ！」と主張した理由を見ていきましょう。\n\n発注側の言い分のポイントは「現行システムと違うところがある。現行踏襲するのが当然だろ」ということ。\n\nでも裁判所はこう言いました。\n\n現行のシステムとこのシステムとの間に機能や使用方法について相違があるとしても、現行のシステムの機能や使用方法がこの開発契約上の仕様になっているとは限らず、要件定義書の作成、この開発契約の締結に続く設計の段階で、発注側から要望し、それが仕様に落とし込まれない限り、この開発契約の内容・目的になっていると認めることは困難である。\n\nつまり「現行システムと同じにしてほしいなら、ちゃんと仕様書に書かないとダメでしょ」ということです。\n\nこの点につき、発注側は、現行のシステムを所与の前提として、このシステムを開発すべきである旨主張するが、開発側は、現行のシステムの機能を知り得る立場にはない以上、発注側において、求める機能を説明し発注しなければ、この開発契約において要求される機能となり得ないことは明らかであって、発注側の上記主張は採用の余地はない。\n\n「ベンダは現行システムを知るわけがない。ユーザが説明して発注しないと仕様にはなりません」という裁判所の一言、刺さりますね。\n\nここテストに出ます。\n\n発注する側が「まあ以前と同じようにお願いします」と言うだけでは、法的には「お願いしたことにはならない」わけです。","ruling":"さあ裁判所の答えです。\n\n発注側が挙げた13カ所の問題点について、裁判所は1個1個丁寧に検討しました。\n\nそして「いずれも目的適合性を欠くとは言えない」と判断しました。\n\nつまり「発注側が主張した不完全な点は、契約上の仕様に違反していない」ということです。\n\nちなみに全然関係ないけど「13カ所全部ダメでした」って言われた発注側の担当者、翌日どんな顔で出社したんだろう。つらい。\n\n結論として「発注側が開発側の開発を妨害した形になったから、発注側の責任で履行不能になった」と裁判所は判断しました。\n\n開発側の請求は大部分が認容。3000万円の大半が開発側に支払われる形になりました。\n\n発注側の立場だったら泣く。泣きながら弁護士に電話する。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n- 「現行踏襲」は仕様書に書かないと仕様にならない。「以前と同じで」だけでは法的にノーカウント\n- 発注側は求める機能を具体的に説明して発注する義務がある。ベンダは以前のシステムを知る立場にない\n- 契約解除は最終手段。解除する側が要件を満たさないと、解除した側が3000万円払う羽目になる\n- 「完成」の基準は契約書に明記しよう。「完成してる・してない」の争いを防ぐ唯一の方法\n\n「なんとなく以前と同じ感じで」が3000万円の訴訟になる。要件定義はちゃんとやれ。","one_liner":"「現行踏襲で」は仕様書に書かないと仕様じゃない。口頭の依頼は法廷では存在しない。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ITベンダ"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ユーザ企業"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["「完成」って何？"]},{"original_title":"知財高判令4.3.24（ビジネスソフトウェアの表示画面に関する著作権侵害（控訴審））","url":"https://itlaw.hatenablog.com/entry/2022/06/18/155135","court":"知財高判","date":"令4.3.24","year":"令和4年（2022年）","topic":"ビジネスソフトウェアの表示画面に関する著作権侵害（控訴審）","categories":["著作権","プログラム・システム"],"fun_headline":"【衝撃】「俺の画面、著作権あるよね？」→ 裁判所「ないです」だった件","hook":"ちょっと待って、これ聞いたら驚くから。\n\n「自分が作ったソフトウェアの画面デザイン、著作権で守られてるよね？」って思ってる人。\n\nいますよね。全員そう思ってますよね。\n\n僕もそう思ってたんですよ。でもこの判例を読んで「あ、全然そんなことないんだ」ってなりました。マジで。","summary":"・テーマ: ビジネスソフトウェアの表示画面に関する著作権侵害（控訴審）\n・著作権がらみの争い","what_happened":"話を整理しますね。\n\nまずこれ、一審（東京地裁）で負けた権利者が「納得いかん！」と控訴した話です。\n\n一審でも「画面に共通部分あるよね」って認めてくれたんです。でも「その共通部分、著作権的に守る価値のある表現じゃないね」って言われた。\n\nここで僕の話をさせてほしいんですけど、僕、昔バイト先でPOPを手書きで作ったことがあって。めちゃくちゃ頑張って作ったんですよ。でも店長に「他のお店でも同じようなPOP作ってるから、これ特別じゃないよ」って言われたことがあって。あのときの気持ちはわかる。話を戻します。\n\nで、権利者、諦めずに控訴。しかも今度は「不法行為」とか「顧客引き抜いた」とかの主張も追加して挑んできた。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問えるやつ。要するに「契約書なくても訴えられる」ということ。\n\n権利者の主張はこういうことです。「個々のボタンとか配置とか部品単位で見るから創作性がないって言われるんだ。全体で見てよ！」\n\nなるほど。わかる気がする。部品一個一個は普通でも、組み合わさったら独自じゃないですか、みたいな。\n\nここで全然関係ない話なんですけど、ラーメン屋って麺もスープも別々なら普通なのに、合わさったら唯一無二の味になりますよね。話を戻します。\n\nさて裁判所はどう判断したか。","issue":"要するに、何が問題だったの？\n\nここテストに出ます。\n\nビジネスソフトウェアの画面の「著作権」って、どうやって判断するの？ということです。\n\n権利者の言い分は「パーツをバラバラに見るな、全体で見ろ」。\n\n裁判所一審の判断は「個々のパーツに創作性ないから全体でもない」。\n\n二審で権利者が「その判断の仕方が間違ってる！」と声を上げた。\n\n権利者はこう主張していました。\n\nア　ビジネスソフトウェアのディスプレイ（ＵＩ，Ｕ権利者）の創作性・表現の選択の幅について\n(ｱ)　原判決は，控訴人製品及び被控訴人製品の各画面を個別に取り上げ，その共通部分を抽出して比較して創作性の判断を行っているところ，控訴人製品のような一覧困難な創作物における創作的表現の判断においては，①共通部分を分析的に切り出してその創作性を判断した上で，②それを踏まえて控訴人製品において問題とされる箇所全体をひとまとまりとして捉えて，創作性のある表現といえるかを検討すべきである。\n\nしかるに，原判決は，ビジネスソフトウェアにおける技術的思想の表現について，分析的に判断するあまり，断片的な評価に陥り，共通部分を分析的に切り出して判断をしたにとどまっており，控訴人製品と被控訴人製品とで特に問題とされる一致箇所（特に，書籍データの分析・表示・発注・管理画面の表示）をひとまとまりとして捉えて創作性を判断するというプロセスを経ない結果，控訴人製品がいかにその技術的思想が効果的に表現されたものであるかの判断を誤っている。","ruling":"いよいよ判決です。\n\n裁判所は、ざっくり言うと「全体でまとめて見ても結論変わらんよ」と言いました。\n\n裁判所、めっちゃ冷静。好き。\n\n控訴人表示画面と被控訴人表示画面の対比に係る判断は，同１(3)のとおりであって，控訴人表示画面と被控訴人表示画面の共通する部分をひとまとまりにして検討することによって，上記判断が左右されるものではない。ビジネスソフトウェアのディスプレイ（表示画面）における表現の創作性について丁寧な検討が必要であるという一般論の主張も，上記判断に影響しない。控訴人が②データ分析等画面に多数散りばめられていると主張する表現上の工夫のうち，発注操作を行う欄の配色については，創作者の思想又は感情が創作的に表現されているといえる程度の特徴を有するものとは認められず，同欄の位置や詳細情報を画面の下方に配置することは，書店業務を効率的に行うという観点から通常想定される範囲内のものである。控訴人の主張する②データ分析等画面における素材の選択及び配列における選択の幅についても，訂正して引用した原判決の第４の１(4)で判断したとおりである。\n\nつまりこういうことです。「ボタンの色とか配置って、その業務をやるなら誰でも似たような設計になるよね。それって創作性とは言えない」。\n\nこれって要するに、書店のソフトって書店の業務に最適化したら自然とあの形になるよね、という話です。\n\nあ、今思い出したんですけど、Excelの表って世界中の誰が作っても似たような形になりますよね。売上管理とか。それと同じ話かもしれない。","takeaway":"で、結局なにが大事なの？\n\n・「俺の画面には著作権がある」は思い込みかもしれない。業務系ソフトの画面は「誰でも似たような設計になる」と判断されやすい\n・著作権を主張したいなら「ここが独自の創作的表現だ」と言える部分を作っておくこと\n・パーツ単位でも全体でも、「ありきたり」と判断されたら終わり。設計段階から差別化を意識しよう\n・競合に画面を真似られた気がしても、裁判はかなりのハードルがある。戦う前に弁護士に相談を\n\n最後に一言。著作権の壁は思ったより厚い。でも思ったより薄い部分もある。どっちかは弁護士に聞いてください。","one_liner":"「俺の作った画面、著作権あるよね？」── その自信、裁判所の前では砕け散る可能性がある。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"ソフト会社"},{"role":"利用側","icon":"⚖️","side":"defendant","desc":"競合ソフト会社"}],"lessons":["著作権は万能じゃない"]},{"original_title":"東京地判令4.3.15（ソースコード引渡し義務の有無）","url":"https://itlaw.hatenablog.com/entry/2024/03/09/154811","court":"東京地判","date":"令4.3.15","year":"令和4年（2022年）","topic":"ソースコード引渡し義務の有無","categories":["プログラム・システム"],"fun_headline":"【全エンジニア必読】「ソースコード、渡す義務ある？」→ 裁判所の答えが怖すぎた","hook":"エンジニアのみなさん、ちょっと聞いてほしいんですけど。\n\n「開発を頼まれて、完成したけどソースコードは渡さなかった」って状況、あり得ると思います？\n\nこの判例の答えは「それ、裁判になります」でした。\n\nしかも話がもっとヤバいのは、担当エンジニアが途中で亡くなって、最新のソースコードがどこにあるか誰もわからなくなった、というとこから始まるんですよ。","summary":"・絡んでる金額: 170万円\n・テーマ: ソースコード引渡し義務の有無\n・システム開発のトラブル","what_happened":"順を追って説明しますね。\n\n発注側（発注側）が被告側（受注側）に姿勢計測システムのソフト開発を委託しました。\n\nここ大事。契約書、なし。見積書と注文書だけ。\n\nここで僕の話をさせてほしいんですけど、僕、昔友達と「割り勘ね」って口頭で約束したらその後「やっぱ奢って」って言われたことがあって。証拠がない約束って本当に怖いんですよ。話を戻します。\n\n平成29年に最初の納品。実行ファイルが届いた。代金170万円支払い済み。\n\nその後も改良・機能追加が続いて、合計330万円ほど支払われた。\n\nここからがヤバいんですけど。\n\n平成31年4月。このソフト開発を一人でやってた担当者のDさんが死亡した。\n\n発注側は「最新のソースコード渡して」と被告側に言ったが、被告側が調査しても最新版は見つからなかった。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。要するに「やるって言ったじゃん」のやつ。\n\n発注側は「ソースコードが来ない。これは債務不履行だ。払ったお金、全部返せ」と訴えた。金額は約345万円。\n\nちょっと待ってこれ、被告側の立場も相当しんどくないですか。担当者が亡くなって、ソースコードもなくて、訴えられて。つらすぎる。","issue":"両者の言い分が食い違ったポイントはここ。\n\n（１）そもそも契約って一個なの？それとも別々？\n\n発注側は「最初から最後まで一個の請負契約」と主張。被告側は「最初の開発と後の改良は別々の契約。しかも準委任」と主張。\n\n【ちょっと解説】準委任（じゅんいにん）── 「結果は保証しないけど、プロとしてちゃんとやります」という契約。SES契約とかがこれ。「完成」の義務がないのがポイント。\n\n（２）ソースコードを渡す義務、あった？\n\n発注側は「渡す合意があった」、被告側は「そんな合意してない」。\n\nここテストに出ます。この二点が全部です。","ruling":"いよいよ判決です。\n\n（１）について、裁判所は「契約は別々だった」と判断。\n\n本件計測システムの開発は，試作品を作成した上で，システム計測精度，施工管理項目の妥当性等を確認し，有効性の評価を行うなどして，その都度，改良を加えながら行うことが予定されており，本件計測システムの一部であるこのソフトウェアの開発についても，改良を加えながら行うことが予定されていたこと，そのような状況の下で，発注側及び被告側は，当初の契約として，被告がこのソフトウェアの開発作業を行い，原告が代金として１６０万円を支払う旨に合意したことが認められる。これらの事実によれば，当初の発注の時点で，原告側と被告側との間においては，このソフトウェアの開発のみならず，その後の改良や機能の追加作業の発注が予定されていたものといえる。\n\nもっとも，当初の発注の時点で当事者が取り交わした見積書及び注文書においては，（略）完成を目的としていたことを示す記載や，発注内容として改良及び機能の追加が含まれていることを示す記載は見当たらない。また，被告側においてはこのソフトウェアの開発に関する打合せや実際の作業をＤのみが行っていたのであり，被告側の受注は，Ｄ個人の能力や経験が見込まれて契約に至ったものといえる。そして，開発作業の納期についても，発注書上，「打合せによる」などとされており，当初の発注の時点で，被告側による開発作業として，どこまで想定されていたのかは納期の点ら見ても明らかではない。\n\n続いて「個別契約ごとにソースコードを渡す合意があった」と認定。裁判所はこう言いました。\n\nソフトウェアの改良又は機能の追加やバグの修正を行うためには実行ファイルに加えてソースコードが必要となることからすれば，各開発段階における個別契約においては，それぞれ成果物としてソースコードの引渡しが含まれていたと見るのが当事者間の合理的意思に合致するといえる。このことは，Ｄの死亡後，原告側が被告側に発注した他のソフトウェアの最新のソースコードを被告側から受領したほか，原告側の従業員であるＣからこのソフトウェアの最新のソースコードの引渡しを求めたのに対し，被告側代表者は，Ｄの遺族にパソコンの引渡しを求めている旨を回答し，ソースコードの引渡しを否定していないことからも裏付けられているといえる。\n\nこれらの事情によれば，原告側と被告側との間においては，各開発段階の個別契約において，成果物として，実行ファイルに加えて，ソースコードを引き渡す旨の合意があったと認めるのが相当である。\n\nつまり「ソースコードがないとバグ修正もできないでしょ。渡す義務があったのは当然」という判断。\n\nここで全然関係ないんですけど、鍵を渡さずに「この部屋使っていいよ」って言うやつが世界最悪な大家ですよね。話を戻します。\n\n最終的に、改良・機能追加フェーズの代金161万円分について債務不履行を認定。被告側のソースコード管理の不備を認めました。\n\nこのソフトウェアの開発のうち，改良及び機能の追加の各段階における個別契約に基づいて支払われた合計１６１万００９４円については，成果物のうち実行ファイルの引渡しがされた事実が認められるものの，ソースコードの引渡しがされた事実が認められない。そして，上記のとおり，このソフトウェアの開発は，当初の発注の時点で，継続的に改良が行われることが予定されていたこと，また，ソースコードの引渡しがなければ改良やバグの修正といった作業を行うことができないことからすれば，その引渡しがなければ契約の目的を達成することができないといえる。そうすると，当該金額については，被告側の債務不履行と相当因果関係のある損害に当たる。","takeaway":"で、結局なにが大事なの？\n\n・ソースコードを渡す義務があるかどうか、契約書に明記しよう。「常識的にそうでしょ」は通じないこともある\n・でも裁判所は「ソースコードなしに改良できないでしょ、渡す義務あるのが合理的」とも言ってくれた\n・契約書のない取引は本当にやめて。見積書・注文書だけで進めると後でめちゃくちゃ揉める\n・担当者が一人だと、その人に何かあったときにプロジェクトごと詰む。属人化は最大のリスク\n\n最後に一言。契約書がないから安心、じゃなくて、契約書がないから危険。","one_liner":"実行ファイルだけ渡してソースコードを渡さないのは、カギなしで家を売るのと同じです。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"システム会社"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"ソフト開発会社"}],"lessons":["契約書読んどけば…","証拠がないと詰む","「完成」って何？"]},{"original_title":"東京地判令4.2.25（SEO対策業務の実施と報告義務）","url":"https://itlaw.hatenablog.com/entry/2022/10/28/235547","court":"東京地判","date":"令4.2.25","year":"令和4年（2022年）","topic":"SEO対策業務の実施と報告義務","categories":["その他"],"fun_headline":"「SEO対策やりました」→「証拠は？」→「提示できません」→ 裁判で全敗した話","hook":"これ本当に起きた話なんで。\n\n「SEO対策やりました。でも何をやったかは教えられません。効果があるかどうかはGoogleが評価するもので、あなたが評価するものじゃありません」って言ったSEO業者が裁判になりました。\n\nもう一回言いますね。\n\n「あなたが評価するものじゃありません」って言ったんですよ。お金払った依頼人に向かって。\n\nこの話、最後まで読んでください。","summary":"・絡んでる金額: 140万円\n・テーマ: SEO対策業務の実施と報告義務","what_happened":"順を追って説明しますね。\n\n不動産業の原告、SEO対策業者の被告に約140万円払いました。\n\n【ちょっと解説】SEO── Googleの検索結果で自分のサイトを上位に表示させるための施策のこと。上位に出ると人が来る。来ると商売になる。というやつ。\n\n原告、しばらく待ってもアクセス数が全然増えない。\n\nおかしいと思って自分でアクセス解析ツールで確認したら、本当に全然変わっていなかった。\n\nそこで被告に「何やったか教えて。効果の検証結果も報告して」と依頼した。\n\nそしたら被告の担当者からこういうメールが来た。\n\n「ＳＥＯ対策につきましての証明に関しましては，提示出来ません」\n\n「ＳＥＯ対策は，Ｇｏｏｇｌｅが評価するものでございまして，Ａ様（原告代表者）が評価するものでございません。」\n\n「外部対策は実施しているため，ご返金は出来ません」\n\n「ご納得されるかはＡ様のお気持ち次第にはなりますので，ご納得されないとのことでも，ご返金は出来ません」\n\n読んで「はあ？」ってなりました？ 正常です。\n\nここで全然関係ない話なんですけど、居酒屋で料理を頼んで、30分待って、「何か作ってます？」って聞いたら「作ってます。でも何を作ってるかは教えられません。料理の評価はシェフがするもので、あなたがするものじゃありません」って言われたら、その居酒屋には二度と行きませんよね。話を戻します。\n\n原告は契約を解除して、払った140万円の返還を求めて訴えた。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。「やった」と言い張るだけで何も示せなかったら、やってないのと同じ扱いになりえます。","issue":"要するに、何が問題だったの？\n\nここテストに出ます。二点あります。\n\n（１）被告はちゃんと仕事したの？\n\n（２）被告には「報告する義務」があったの？\n\n特に（２）が面白くて、被告は「被リンク用サイトは秘密にするって契約に書いてある。だから報告義務はない」と主張した。\n\nそういう約定があったのは本当らしい。でも裁判所の判断は……？","ruling":"裁判所、こう言いました。\n\nまず（１）仕事したかどうかについて。\n\n裁判所は「証拠を何も出さないなら、やってないのと同じ」と判断。\n\n(1) 　被告は，原告サイトに最適な被リンク用サイトを選定し，原告サイトと関連する内容の被リンク用サイトのコンテンツを作成したうえ，原告サイトのＵＲＬを掲載したと主張するが，口頭弁論の終結に至るまで，これらの業務を行ったことを示す客観的資料を何ら提出しない。\n\n（略）\n\nさらに，①この契約は，対象検索サイトにおいて原告サイトを検索結果の上位に表示させる目的で締結されたものであること，②Ｃも，被リンク用サイトとしてどのようなウェブサイトを選ぶかが重要である，基本的なワードをしっかり入れたコンテンツ作りやリンク設定をしてグーグルにアピールできるようにしている旨述べていること（証人Ｃ）等の事情を勘案すれば，この業務には，外部ウェブサイトから原告サイトに被リンクを設定することに加え，被リンク用サイトを検索エンジンから高い評価を受けられるものとすることや効果的なアンカーテキストを設定すること等も当然含まれ，このことは原告・被告間の共通認識となっていたものと認められる。しかるに，被告は，（略）実際に検索エンジンから高い評価を受けられる被リンク用サイトを選定・準備したことや原告サイトへ外部リンクを張った被リンク用サイトの数や種類，アンカーテキストの内容等を一切明らかにしない。\n\nこれらの事情に照らせば，被告はこの業務を実施していないものと認めるほかなく，被告にはこの業務の実施義務違反があったといえる。\n\nつまり「やった証拠を裁判でも出せなかったんだから、やってないとしか言いようがない」。\n\n次に（２）報告義務について。被告は「被リンクサイトは秘密にするって書いてあるから報告義務ない」と主張したが、裁判所は容赦なかった。\n\n (1) 　被告は，この契約の受任者として，原告の請求があるときは，事務処理状況の報告義務を負い，また，この契約の終了後は，遅滞なくその経過及び結果を報告する義務を負う。\n\nこれに対し，被告は，本件条項（引用者注「被リンク用サイトを原告に開示しない」との約定）を理由に，被告がこの業務の実施について原告に対する報告義務を負わないと主張するが，本件条項は「当該リンク設定を行った被リンク用サイト」を原告に開示しないことを定めるにすぎず，被告が事務処理状況等の報告義務を一切負わないことまで定めるものとは到底解し得ないから，被告の主張は採用できない。\n\n「被リンクサイトを隠せる」と「何もかも報告しなくていい」は全然違う。そう言われた。\n\n (2) 　そして，被告は，上記１(4)のとおり，原告代表者から，①被告の行ったこの業務の内容，②当該業務に支出した費用の明細及び③この業務による効果の検証結果を報告するよう求められたにもかかわらず，Ｅにおいて，「ＳＥＯ対策につきましての証明に関しましては，提示出来ません」，「ＳＥＯ対策は，Ｇｏｏｇｌｅが評価するものでございまして，Ａ様（判決注：原告代表者）が評価するものでございません。」，「外部対策は実施しているため，ご返金は出来ません」，「ご納得されるかはＡ様のお気持ち次第にはなりますので，ご納得されないとのことでも，ご返金は出来ません」などと記載したメールを送信して，原告が報告を求めた事項について一切回答できないことを明らかにしたのであるから，被告には，この業務の実施についての報告義務違反があったと認められる。\n\n裁判所、そのメール引用してます。全部引用してます。証拠として残ってますよ、このメール。\n\n結果、原告が払った金額の全額が損害として認められた。全額返ってきた。","takeaway":"で、結局なにが大事なの？\n\n・業務を委託したら「何をやったか報告させる権利」がある。それは契約書に書いてなくてもある\n・「証拠を出せない」は「やっていない」と同じ扱いになりうる。裁判所はそう判断する\n・SEO業者を使うなら「月次報告」「実施内容の開示」を契約書に明記しよう\n・あのメール、全部証拠に使われた。業者とのやりとりは全部保存しておこう\n\n最後に一言。「Googleが評価するものです」って言ったSEO業者、裁判所に評価されました。","one_liner":"「証拠は提示できません」は、裁判所では「やっていません」と同じ意味です。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"不動産業者"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"SEO業者"}],"lessons":["契約書読んどけば…","プラットフォームの罠"]},{"original_title":"東京地判令4.2.16（幹部社員による競合他社への引抜行為）","url":"https://itlaw.hatenablog.com/entry/2022/04/29/225703","court":"東京地判","date":"令4.2.16","year":"令和4年（2022年）","topic":"幹部社員による競合他社への引抜行為","categories":["その他"],"fun_headline":"【1億円訴訟】退職した幹部が部下を根こそぎ引き抜いた結果、どうなったか","hook":"みなさん、転職したことあります？\n\n僕はあるんですけど、転職するとき「前の会社の同僚を全員連れていこう」とは思わなかったですよ。\n\nでも今日の判例の人は思ったんです。しかも実行した。\n\nそして訴えられた。1億円以上で。","summary":"・絡んでる金額: 4000万円\n・テーマ: 幹部社員による競合他社への引抜行為","what_happened":"話を整理しましょう。\n\n原告側（コンサルティング会社、合同会社）で、セキュリティ部門の責任者だった被告が退職した。\n\n被告、退職した後（というか在職中から）、部下や同僚を「うちに来ない？」と誘って、競合のe社に転職させた。\n\nここ大事なとこなんで簡単に言うと。「自分が転職するとき、チームごと引き連れた」ということ。\n\nここで僕の話をさせてほしいんですけど、僕が昔いたバイト先で、バイトリーダーが突然辞めて、その翌週に同期のバイトが5人一気にいなくなったことがあって。あのときの店長の顔、今でも覚えてます。すごく顔色が悪かった。話を戻します。\n\n引き抜かれた主な人たち。\n\n- Bさん（マネジャー）：被告の退職後にe社に転職\n- CさんDさんEさん（チームメンバー）：退職・転職の勧誘を受けた。Cは思いとどまり、D・Eはe社に転職\n- Fさん（リクルーティング部門マネジャー）：被告の退職後にe社に転職\n\n原告側の社内規程にはこう書いてあった。\n\n執行役員規程１０条２項，パートナー規程９条１１項\n\n　パートナーは，退任後に原告側と同一又は類似する事業に従事させることを目的として，原告側の従業員等に対し引き抜き工作をしてはならない。退任パートナーは，退任後１年以内に原告側又はグループの他法人から他の従業員等を引き抜いた場合には，当該従業員等の前の１年間の報酬額（賞与金額を含む。）相当の金額を原告側又は当該法人に支払わなければならない。（「本件引き抜き禁止条項」）\n\n社員報酬規程１０条３項\n\nパートナーへの退職慰労金の支給後に，当該パートナーについて，①在任中の行為につき除名に相当する事由が発見された場合，②会社に損害若しくは不利益をもたらしたと経営会議が認めた者に該当することが判明した場合には，原告側が当該パートナーに支給した退職慰労金の返還を求めることができる。\n\n被告、退職時に「引き抜きしません」という誓約書も書いていた。退職金として875万円も受け取っていた。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。誓約書を書いて、退職金をもらって、その後引き抜きをしたら、まさにこれ。","issue":"で、何が問題になったかというと──\n\n原告側が被告に請求したのは合計約1億1000万円。内訳はこんな感じ。\n\n- 引き抜いた人たちの1年分の報酬相当額：約4000万円\n- デジタルフォレンジック（証拠保全調査）費用など：約4000万円\n- 弁護士費用など：合計で約6000万円\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。誓約書があっても、なくても、故意に損害を与えたら責任を問える。\n\n争点は主に「賠償額はいくらになるのか」でした。特に「調査費用は払ってもらえるのか」が大きなポイントでした。","ruling":"さあ、裁判所の答えです。\n\n裁判所は、引き抜いた4名（B・D・E・F）の1年分の報酬相当額として約4200万円の損害を認定しました。\n\nただし、X側が請求した調査費用6000万円については認めませんでした。\n\n理由はこうです。「引き抜き禁止条項は、損害賠償の額をあらかじめ決めた条項（損害賠償額の予定）だ。だから、その金額を超えた請求はできない」と判断した。\n\nここ全然関係ないけど、保険みたいな話ですよね。「もしこうなったらこの金額払います」って決めてたら、それ以上は請求できない。話を戻します。\n\nさらに、退職金875万円の返還も認めた。\n\n最終的な認容額は約4200万円＋約800万円＝約5000万円。\n\n1億1000万円を請求して、5000万円が認められた。それでも5000万円。","takeaway":"で、結局なにが大事なの？\n\n・退職時の誓約書、ちゃんと守ろう。守らないと退職金まで返還を求められる\n・「引き抜き禁止条項」は、損害賠償額の上限も決めてしまうことがある。条項の設計は弁護士に相談を\n・幹部が抜けるとき、チームごと持っていかれるリスクがある。鍵となる人材を1人に依存しない組織づくりを\n・デジタルフォレンジック調査費用（4000万円）は認められなかった。調査費用が無駄になることもある\n\n最後に一言。「誓約書」はただの紙じゃない。破ったら5000万円で返ってくる。","one_liner":"退職金もらって誓約書も書いて、でも引き抜いた。その後に待ってたのは5000万円の請求書だった。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"コンサル会社"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"元業務執行社員"}],"lessons":["辞め方を間違えた","損害、証明できる？"]},{"original_title":"東京地判令4.1.12（脆弱性あるサイトを構築したベンダの責任）","url":"https://itlaw.hatenablog.com/entry/2025/10/18/174618","court":"東京地判","date":"令4.1.12","year":"令和4年（2022年）","topic":"脆弱性あるサイトを構築したベンダの責任","categories":["PM・開発管理","セキュリティ","責任・損害"],"fun_headline":"【悲報】ECサイト作ったベンダ、クレカ情報漏洩の責任を1000万円分取らされる","hook":"ITエンジニアとかWebデザイナーやってる人、聞いてください。\n\n「クレカ決済できるECサイトを作って欲しい」って依頼、ありますよね。\n\nそのサイト、セキュリティの要件を満たしてますか？\n\n今日の判例は「セキュリティ要件を満たさないサイトを作ったベンダが1000万円の責任を負った」という話です。\n\n怖いから最後まで読んでほしい。","summary":"・絡んでる金額: 1027万円\n・テーマ: 脆弱性あるサイトを構築したベンダの責任\n・プロジェクト管理の問題","what_happened":"順を追って説明しますね。\n\n2017年、発注側が開発側に「ホームページとオンラインショップを作って」と依頼。\n\n開発側が2017年5月にサイトを納品した。\n\nここで全然関係ない話なんですけど、僕、昔引っ越したとき新居の鍵をもらったら、前の住人の荷物がまだあって、不動産屋に「ちゃんと確認してから渡してくれ」と思ったことがあって。納品って大事ですよね。話を戻します。\n\n2020年7月。決済代行会社から「このサイト、クレカ情報が漏れてる疑いがある」と連絡が来た。\n\n調査したらこうなっていた。\n\n- ログファイル（admin.log）が公開領域にそのまま置いてある\n- 管理画面へのアクセス制御がない\n- そのログのセッションIDを使って管理画面に不正ログインできる状態だった\n\nここからがヤバいんですけど。\n\n攻撃者は実際に侵入して、バックドアファイルを設置して、クレジットカード情報を抜き取っていた。\n\nさらにこのサイト、PCI-DSS（クレカ業界のセキュリティ規格）の要件6に準拠していないという調査結果も出た。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。クレカ情報を扱うサイトを作るって言ったのに、セキュリティ要件を満たしてなかった、これがまさにそれ。\n\n発注側は、フォレンジック調査費用・カード再発行費用・不正利用被害賠償・サイト閉鎖中の機会損失など合計約1027万円の損害賠償を請求した。\n\n発注側は制作会社Yだけでなく開発側の代表取締役Y1個人にも請求した。「取締役として業務を監督する義務があったのに怠った」という理由で。","issue":"さあ、何が揉めたのかというと。\n\nベンダに「債務不履行」があったかどうか。\n\nつまり、クレカ決済機能があるECサイトを作るとき、セキュリティ要件を満たす義務があるかどうかが問われた。\n\nここテストに出ます。「セキュリティ要件を満たすのは当然の義務か？」","ruling":"裁判所、こう言いました。\n\n開発側が強く争わなかったこともあり、発注側の主張がほぼそのまま認められた。\n\n開発側は，このサイトがオンラインショップの機能を有し，顧客のクレジットカード情報を扱うのであるから，このサイトを構築するにあたって，顧客情報が漏洩することのないよう，クレジットカード会社が定めるセキュリティの要件を満たすよう，サイトを構築するべき義務があるところ，その義務を怠り，このサイトから顧客のクレジットカード情報が漏洩する原因を作ったのであるから，開発側のこの契約の履行は契約の要求水準を満たさない不適合があったものというべきである。また，開発側１は，開発側の唯一の取締役として，業務の監督を行うべき義務があるが，上記のような開発側の業務の遂行状況は，基本的な義務を怠ったものといえ，開発側１としても重大な過失によって監督義務を怠ったものといえる。\n\nつまりこういうことです。「クレカ情報を扱うサイトを作るなら、セキュリティ要件を守るのは当たり前。守らなかったから情報が漏れた。それは開発側の責任」。\n\nしかも代表取締役Y1個人にも責任があると認定した。会社だけじゃなく個人も。\n\nここで僕の話をさせてほしいんですけど、お店でバイトするとき「ちゃんとしてね」って言われますよね。「ちゃんと」の内容は説明されなくても、食中毒を出したらまずいとか、釣り銭を間違えてはいけないとか、わかるじゃないですか。裁判所もそのレベルで判断してます。話を戻します。\n\n損害については、サイト閉鎖中（15日間）の機会損失として直近3ヶ月の日平均売上×15日分を認めた上で、自社従業員の人件費を除いた約1009万円を認容した。","takeaway":"で、結局なにが大事なの？\n\n・ECサイト（クレカ決済あり）を作るなら、PCI-DSS準拠は「オプション」じゃなくて「義務」\n・セキュリティ要件は契約書に明記されてなくても、黙示的に義務があると判断されうる\n・ログファイルを公開領域に置く、管理画面にアクセス制御なし──これは基本中の基本。外注しても確認しよう\n・制作会社の代表取締役個人も責任を負わされた。発注側も「ちゃんと作ってもらえてるか」を確認する義務がある\n\n最後に一言。セキュリティの穴は、漏れてから気づいても手遅れ。","one_liner":"クレカ情報を扱うサイトを作るなら、セキュリティは「できればいいな」じゃなくて「義務」です。裁判所がそう言ってた。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"EC事業者"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ウェブ制作会社"}],"lessons":["セキュリティ甘すぎ"]},{"original_title":"東京地判令3.12.20（SES契約における期間途中での撤収）","url":"https://itlaw.hatenablog.com/entry/2022/08/06/140419","court":"東京地判","date":"令3.12.20","year":"令和3年（2021年）","topic":"SES契約における期間途中での撤収","categories":["契約・報酬"],"fun_headline":"【実話】「御社の要員、全員撤退します」って言ったら損害賠償になった件","hook":"怒りに任せてメール送ったことって、ありますか。\n\n「もういい！全部終わりにしてやる！」ってやつ。\n\n僕はあります。で、だいたい後悔する。\n\nでも今日の話の登場人物、メールを送った結果が裁判所まで行くんですよ。怖すぎる。","summary":"・テーマ: SES契約における期間途中での撤収\n・契約とお金の話","what_happened":"登場人物を整理しますね。\n\n発注側というのが中間業者みたいな会社で、A社・B社・C社からシステム開発の仕事を受けてたんですよ。で、そのためのエンジニアを開発側から調達してたわけです。\n\n【ちょっと解説】SES（システムエンジニアリングサービス）── エンジニアの労働力を提供する契約形態。法的には準委任か派遣のどちらかに分類される。\n\nここで僕の話をさせてほしいんですけど、SESって言葉、業界にいないと全然知らないじゃないですか。僕も最初「Seriously？」みたいな顔で聞いてました。関係ないですね。話を戻します。\n\nA社にアサインされたエンジニアが「GitやRailsのコマンドがわからないレベルだ」ってクレームを受けるわけです。\n\n発注側が開発側に「A社さん5月22日で契約解除したいって言ってるんですけど」って連絡する。\n\n開発側は「は？コマンド知らないくらいで問題ないでしょ。あと契約書には1カ月前通知って書いてあるし」って反論する。\n\nここまではまあわかる。よくある話っぽい。\n\nで、ここからがヤバいんですけど。\n\n発注側と開発側のやり取りがどんどんヒートアップしていって、開発側の代表者、5月18日についにメールを送ります。\n\n貴殿のメールの文面や電話のやりとりから，非常に失礼かと思われますので，御社にお世話になっている要員は５月末にて，全員撤退させていただきます。\n\n全員撤退。\n\nA社の件だけで怒ってたのに、B社・C社のエンジニアも巻き込んで全員引き揚げると言い出す。\n\n発注側は「いや関係ないでしょ」って反論したんですけど、結果的にA社とC社のエンジニアは契約期間の途中で撤収。残ったのはB社のエンジニアだけでした。\n\nC社のエンジニアを巻き込まれた側からすると「えっ私も？」ってなりますよね。意味がわからない。\n\nそれで発注側が開発側を訴えて、開発側も発注側を訴えて（反訴）、という展開になります。\n\nちなみに全然関係ないけど、こういう「怒った勢いで全部やめる」って判断、僕も引っ越しの準備しながらやったことあります。全然関係ないですね。","issue":"要するに何が問題だったの？ってことを整理するとこうなります。\n\n発注側と開発側の、それぞれの債務不履行の有無。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。弁償してね、ってなる。\n\nつまり「先に契約を破ったのはどっちか」ですね。ここテストに出ます。\n\n発注側側の主張：「開発側がエンジニアを途中で引き揚げたのが債務不履行」\n開発側側の主張：「発注側が不当に解除の申し出をしたから悪い。しかも下請法違反とか偽装請負とかしてたでしょ」\n\n双方が「悪いのは向こう」って言い合ってる状況です。","ruling":"裁判所、こう言いました。\n\nまず発注側が「解除の申し出」をしたかどうかという点。裁判所はこう述べました。\n\n上記発注側から開発側に対する同月８日付けのメールは，Ａ社からの苦情及び契約解除の要請に対し考えられる対応として「・事実関係確認・勝てるロジック作り・ロジック無い場合，５／２２（金）で許容の旨の返信」を上げたものであって，本件個別契約１の解約の申し出を行ったものとはいえない。また，（略）発注側が開発側に対し「ロジック無い場合，５／２２（金）で許容の旨の返信→こちらは，弊社としても伸ばせるように圧力をかけていきます。」との記載のあるメールを送付するなど，同月１１日から同月１８日までの間に発注側と開発側の間でＡ社からの苦情にどのように回答するかを検討し，同社との業務委託契約の継続を図るためのやり取りをしていることが認められ，このような事情からしても，発注側が，開発側に対し，本件個別契約１の解約の申し出を行ったとは認められない。\n\nつまりこういうこと。\n\n発注側のメールは「解除します」じゃなくて「どう対応するか考えよう」だったので、解約の申し出にはあたらない。\n\n発注側は契約を破ってない。\n\n開発側のほうが「全員撤退」というメールを送って、実際にエンジニアを引き揚げた。それが債務不履行です、と。\n\n裁判所、めっちゃ冷静。好き。\n\n開発側がさらに「発注側は下請法違反だ！偽装請負だ！」とも主張してたんですけど、裁判所はそこはあまり深く掘らずに開発側の主張を退けました。\n\nあ、今思い出したんですけど「勝てるロジック作り」って書いてあるメールが証拠として出てくるの、怖くないですか。社内でカジュアルに書いたやつが法廷に出てくる。僕が当事者だったら泣きながら引っ越します。\n\n結論として、開発側の債務不履行によって発注側に生じた損害として、残期間分の業務委託料の利益相当額、合計約14万円の賠償が認められました。\n\n少ない。でも契約期間が短かったので仕方ない（1カ月80万円くらいの案件が数週間分）。\n\n発注側は「更新される予定だったから、もっと長期分の損害を認めてほしい」とも主張してたんですけど、更新の予定があったとまでは認められないとして却下されています。","takeaway":"で、結局なにが大事なの？\n\n・怒りに任せてメールを送るな。「全員撤退します」はリスクが高すぎる\n・契約解除は書面で、要件（1カ月前通知とか）を守って行うこと。守らないと自分が債務不履行になる\n・「更新される予定」は口約束では認められない。更新の合意は文書に残せ\n・社内メールは証拠になる。「勝てるロジック作り」みたいな書き方はしない\n\n感情に任せた行動が、数年後に裁判所で読み上げられる。それがITの世界です。","one_liner":"怒りに任せたメールは、後で証拠になる。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"SES会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"SES発注会社"},{"role":"下請業者","icon":"🔧","side":"third","desc":""},{"role":"関連会社","icon":"🏢","side":"third","desc":""}],"lessons":["契約書読んどけば…"]},{"original_title":"東京高決令3.12.14（ベンダ内部の評価文書の提出義務）","url":"https://itlaw.hatenablog.com/entry/2024/08/04/185108","court":"東京高決","date":"令3.12.14","year":"令和3年（2021年）","topic":"ベンダ内部の評価文書の提出義務","categories":["PM・開発管理"],"fun_headline":"「社内資料だから出せません」は通じなかった。日本IBMが文書提出を迫られた話","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n「社内で作った資料だから見せられない」って言い訳、まあわかるじゃないですか。\n\n企業秘密とか、内部の議論とか、そういうやつ。\n\n でも裁判になったら、その「見せられない」が通じないケースがあるんですよ。\n\n今日の話、IT系プロジェクトに関わったことのある人は他人事じゃないと思います。","summary":"・テーマ: ベンダ内部の評価文書の提出義務\n・プロジェクト管理の問題","what_happened":"話を整理しますね。\n\nまず背景として、文化シヤッターという会社が日本IBMに「基幹システムを作ってくれ」と頼んだんですよ。\n\nで、それが失敗した。\n\nシステムが完成しなかったんです。\n\n文化シヤッターが日本IBMを訴えた（これは別の判例）。\n\nその裁判の途中で、文化シヤッター側が「あなたたち、アメリカ本社のセールスフォース専門チームに相談してたでしょ。その資料、出してよ」と言い出したわけです。\n\n【ちょっと解説】文書提出命令── 裁判で「その資料を証拠として出しなさい」と裁判所が命令できる手続き。民事訴訟法221条に基づく。\n\nここで僕の話をさせてほしいんですけど、「アメリカ本社のセールスフォース専門チーム」って言葉、めちゃくちゃかっこいいですよね。どんな部屋で働いてるんだろう。ガラス張りの会議室でMacBook開いてそう。全然関係ないですね。話を戻します。\n\n日本IBM側は「その文書は社内検討用に作ったもので、外に出す予定じゃなかった。出せません」と拒否します。\n\nで、ここからがヤバいんですけど、一審裁判所（東京地裁）は「いや、出しなさい」と命令する。\n\n日本IBMが「それはおかしい」と高裁に不服申し立て（抗告）をして、この判決が出たわけです。\n\nちなみに全然関係ないけど、こういう「資料見せて」「嫌です」「いや見せて」みたいなやり取り、小学生のノート貸し借り以来やってないなって思いました。","issue":"何が問題だったかというとですね。\n\n「自己利用文書」かどうか、という点です。\n\n要するにこういうこと。\n\n「社内だけで使う目的で作った文書は、裁判でも出さなくていい」というルールが法律にあるんですよ。\n\nじゃあ今回の「特別チームとの協議文書」は社内文書なの？それとも出さないといけないの？\n\nここテストに出ます。\n\n日本IBM側の言い分：「社内検討のために作った文書だから、専ら内部利用のものだ。出せない」\n\n文化シヤッター側の言い分：「その文書にシステムが完成できなかった原因が書いてあるはずで、うちの訴訟に直接関係ある文書だ。出せるはずだ」\n\nどちらの言い分が正しいかを裁判所が判断する、という構図です。","ruling":"裁判所、こう言いました。\n\nまず「自己利用文書かどうか」の判断基準はこう示しています。\n\nある文書が，その作成目的，記載内容，これを現在の所持者が所持するに至るまでの経緯，その他の事情から判断して，専ら内部の者の利用に供する目的で作成され，外部の者に開示することが予定されていない文書であって，開示されると個人のプライバシーが侵害されたり個人ないし団体の自由な意思形成が阻害されたりするなど，開示によって所持者の側に看過し難い不利益が生ずるおそれがあると認められる場合には，特段の事情がない限り，当該文書は民事訴訟法２２０条４号ニ所定の「専ら文書の所持者の利用に供するための文書」に当たると解するのが相当である（最高裁平成１１年（許）第２号同年１１月１２日第二小法廷決定・民集５３巻８号１７８７頁）。\n\n長い。要するにこういうこと。\n\n「社内専用で、外に出したら不利益がある文書なら出さなくていい」\n\n両方の条件を満たす必要があるわけです。\n\n裁判所は次に「この文書は出さないと日本IBMにとって不利益があるか」を判断します。\n\n確かに，本件協議結果文書及び本件協議過程文書の記載内容は相手方の履行不能の成否に関連するものであるといえるし，相手方は，平成２９年２月２２日の申立人との打合せにおいても，申立人に対し，特別チームと解決策の協議を行う旨や，相手方のアメリカ法人の調査は既に行っており申立人の要望に応えるために何とか対応できないかの検討を行っている旨を伝えていることがうかがわれる（甲（内）２９－２－２２）。そうすると，申立人においてその検討の結果が何らかの形で適時に開示される旨の期待を有していたとしても無理からぬ面はあるといえる。\n\nしかしながら，本件協議結果文書及び本件協議過程文書は，飽くまで相手方内部（そのアメリカ法人に属する特別チームを含む。以下同じ。）での検討のために作成された文書であるから，上記事情を踏まえても，相手方が申立人への本件協議結果文書及び本件協議過程文書自体の開示を予定していたとまでは直ちには認め難く，また，本件協議結果文書及び本件協議過程文書が申立人の利益のために作成されたものであるともいえない。\n\nここ、エンジニアなら身に覚えがある人いるんじゃないですか。\n\n「お客さんに見せるつもりで作ってないメモ」って、山ほどあるじゃないですか。\n\nSlackの社内チャンネルとか、コメントアウトしたコードのメモとか。\n\nあれ、裁判になったら出てくる可能性があるわけですよ。怖すぎる。\n\n結論として、裁判所は「特別チームとの協議結果・過程の文書は出しなさい」と判断しました。\n\nただし一部例外があって、見積もりツール（Excelシート）については別の話になります。\n\n原審相手方は，この文書３について，原審相手方とその親会社であるＩＢＭコーポレーション社内で使用されている，ＳＦを用いた開発を行うプロジェクトに要する費用を見積もるためのＥｘｃｅｌシートで作成されたツールであって，原審相手方がシステム開発ベンダとして有する知見やノウハウを用いて作成した見積ツールであり，競争力の源泉であって，通常社外に開示されることはない営業秘密にも該当する重要なノウハウである旨主張する。\n\n【ちょっと解説】営業秘密── 不正競争防止法で保護される企業秘密。ただし「秘密管理性」「有用性」「非公知性」の3要件を満たす必要がある。「うちの秘密です」と言い張るだけじゃダメ。\n\nこの見積もりツールについては「出したら競業他社との競争に影響が出る」と認められて、開示の対象から除外されました。\n\n裁判所、めっちゃ細かく仕分けしてる。好き。\n\n当審におけるインカメラ手続による審理の結果等によれば，この文書３は，原審相手方が開発を行うプロジェクトに要する費用を見積もるためのツールであることが認められ，この文書３が開示された場合には，原審相手方内部における見積もりの計算方法が明らかとなり，原審相手方の営業における競争力に影響を与えるものであるということができる。そして，原審申立人は原審相手方の競争他社とはいえないものの，この文書３については，その内容に照らし，原審相手方が閲覧制限の申立てを行うなどしてもなお看過し難い不利益を被るおそれがあるということができるノウハウが含まれていると認めることができる。\n\nつまり「技術調査の結果レポートは出せ、でも見積もりのノウハウが詰まったツールは出さなくていい」という結論です。","takeaway":"で、結局なにが大事なの？\n\n・社内文書は「出さなくていいもの」と「出さないといけないもの」がある。裁判になってから初めて知るのは遅い\n・「営業秘密だから出せない」は、ちゃんと秘密管理されてないと通じない。ラベルを貼るだけじゃ足りない\n・プロジェクト中の社内チャットやメモも証拠になりうる。書き方に気をつけよう\n・「内部専用」と「相手に不利益」の両方が揃って初めて開示拒否できる\n\n裁判所は思ったより細かく仕分けしてくれる。でも「細かく仕分けされる」時点でもう十分しんどい。","one_liner":"社内文書でも、裁判所には見せなきゃいけないものがある。「社内だから」は言い訳にならない。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"文化シヤッター"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"日本IBM"}],"lessons":["秘密は管理してナンボ"]},{"original_title":"東京地判令3.12.10（ツイートにおけるスクショの添付と引用）","url":"https://itlaw.hatenablog.com/entry/2021/12/30/153655","court":"東京地判","date":"令3.12.10","year":"令和3年（2021年）","topic":"ツイートにおけるスクショの添付と引用","categories":["著作権","ネット・コンテンツ"],"fun_headline":"【全Twitter民に届け】スクショをツイートに貼るのは著作権侵害でした","hook":"みなさん、Twitterでスクショ貼ったことありますか。\n\n「この人のツイート、ヤバくない？」って晒すやつ。\n\n僕はやったことないですけど、タイムラインでよく見ます。\n\nで、これって実は著作権侵害になる可能性があるんですよ。\n\n「え、ツイートって著作物なの？」ってなりますよね。なりました。今日その話をします。","summary":"・テーマ: ツイートにおけるスクショの添付と引用\n・著作権がらみの争い","what_happened":"順を追って説明しますね。\n\n権利主張側（ここでは原告をX、Twitterの会社を別で考えてください）が、自分のツイートをスクショして貼ったツイートが4つあって、「これ著作権侵害だ」と言い出したわけです。\n\n権利主張側はまずTwitter社に「誰がこのスクショをツイートしたか教えて」とIPアドレス等の開示を求め、それを取得した上で、今度はインターネットプロバイダ（利用側）に「そのIPアドレスの人の住所・氏名を教えて」と発信者情報開示を求めました。\n\n【ちょっと解説】プロバイダ責任制限法── ネット上で権利を侵害された場合に、プロバイダに対して「投稿者の情報を教えてくれ」と請求できる法律。誹謗中傷対策などで使われる。\n\nここで僕の話をさせてほしいんですけど、IPアドレスから個人情報が特定できる流れって、知ってはいても実際に使われると怖いですよね。「ネットは匿名じゃない」って言葉、こういう判例で読むと急に実感します。全然関係ないですね。話を戻します。\n\nで、問題は「そのスクショは著作権侵害か」という点なんですよ。\n\n投稿者側の言い分としては「権利主張側のツイートに批評コメントをつけてスクショ貼った、これは引用だ」というものでした。\n\n【ちょっと解説】引用── 他人の著作物を自分の著作物の中に取り込むこと。「出所の明示」「主従関係」「必然性」などの要件を満たせば、著作権者の許諾なしでOK。\n\nちなみに全然関係ないけど、「引用」って言葉、便利すぎて乱用されがちですよね。なんでも「引用です」って言えばOKだと思ってる人、多い気がします。","issue":"要するに何が問題だったの？\n\n「スクショをツイートに貼るのは引用として認められるか」\n\nここテストに出ます。\n\n引用として認められるには条件があって、大ざっぱに言うと「正当な目的で、自分のコンテンツが主で引用部分が従、かつ公正な慣行に合致している」必要があります。\n\n投稿者は「権利主張側の言動を批評する目的でスクショを貼った。これは引用だ」と主張しました。\n\nでも裁判所はこう言います。\n\nツイッターの規約は，ツイッター上のコンテンツの複製，修正，これに基づく二次的著作物の作成，配信等をする場合には，ツイッターが提供するインターフェース及び手順を使用しなければならない旨規定し，ツイッターは，他人のコンテンツを引用する手順として，引用ツイートという方法を設けていることが認められる。そうすると，本件各投稿は，上記規約の規定にかかわらず，上記手順を使用することなく，スクリーンショットの方法でX各投稿を複製した上ツイッターに掲載していることが認められる。そのため，本件各投稿は，上記規約に違反するものと認めるのが相当であり，本件各投稿においてX各投稿を引用して利用することが，公正な慣行に合致するものと認めることはできない。\n\nまた，前記認定事実によれば，本件各投稿と，これに占めるX各投稿のスクリーンショット画像を比較すると，スクリーンショット画像が量的にも質的にも，明らかに主たる部分を構成するといえるから，これを引用することが，引用の目的上正当な範囲内であると認めることもできない。\n\nつまりこういうこと。\n\nTwitterには「引用ツイート」という機能があるのに、わざわざスクショを使って貼ったのはTwitterの規約違反。規約違反なんだから、公正な慣行に合致してない。引用として認められない。\n\nさらに、スクショ画像がツイート全体の「主」になっていて、コメントが「従」になってる。これは引用の主従関係が逆。\n\n2つの理由でアウト。\n\nあ、今思い出したんですけど、「引用ツイートじゃなくてスクショを使う」って、だいたい相手の鍵垢や削除済みツイートを保存して貼るときですよね。その時点でかなりグレーな行為だったわけだ。","ruling":"裁判所、めっちゃ論理的に詰めてきました。\n\n引用が成立しない→著作権侵害が成立する→発信者情報を開示せよ、という流れで、利用側（プロバイダ）に対して発信者情報の開示を命じました。\n\nスクショを貼った人の住所・氏名が権利主張側に渡ることになります。\n\n怖すぎる。\n\nちなみに、ツイートが「著作物」かどうかという点も問われることがありますが、この判例では著作物性については特に争われず、引用の要件のほうが問題になりました。短文でも創作性があれば著作物になりうる、という整理で進んでいます。","takeaway":"で、結局なにが大事なの？\n\n・他人のツイートをスクショしてそのまま貼るのは著作権侵害になりうる。引用ツイート機能を使え\n・「引用」として認められるには「主従関係」「公正な慣行」などの条件がある。コメント1行でスクショだけ大きいのはアウト\n・「ネットは匿名」は幻想。プロバイダ経由でIPアドレスから身元が特定される\n・Twitterの規約違反が著作権法上の判断にも影響する。規約、たまには読もう\n\n「引用ツイート」という機能があるのに使わなかった、それだけで負けた案件です。","one_liner":"スクショを貼るな。引用ツイートを使え。それだけで著作権侵害にならなかった。","parties":[{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"ツイート投稿者"},{"role":"利用側","icon":"⚖️","side":"defendant","desc":"プロバイダ"}],"lessons":["著作権は万能じゃない"]},{"original_title":"東京地判令3.12.3（サイト開発の遅れによる契約解除の可否）","url":"https://itlaw.hatenablog.com/entry/2022/11/26/172813","court":"東京地判","date":"令3.12.3","year":"令和3年（2021年）","topic":"サイト開発の遅れによる契約解除の可否","categories":["契約・報酬"],"fun_headline":"【悲報】ウェブサービス開発を発注したら進捗も連絡も来なくなった件","hook":"「スケジュールもテスト画面も見せてもらえない」って状況、想像してみてください。\n\n発注した側だとして。\n\n500万円近く払ってるのに、何も来ない。連絡しても「検討中です」しか言わない。\n\n僕だったら5分で発狂します。\n\n今日の話、これがリアルに起きた裁判の話です。","summary":"・絡んでる金額: 8000円\n・テーマ: サイト開発の遅れによる契約解除の可否\n・契約とお金の話","what_happened":"で、何が起きたかというと。\n\n発注側が「美容業界向けのウェブサービスを作ってくれ」と開発側に依頼したんです。\n\nメーカーやディーラー、ユーザーが情報交換できるプラットフォームみたいなやつ。\n\n途中でクレジットカード決済機能も追加して、最終的に代金は496万8000円になりました。\n\n発注側はそのほぼ全額を3回に分けて先に払った。\n\nここで僕の話をさせてほしいんですけど、「先払い」って怖くないですか。ラーメン屋で先払いするのも一瞬緊張するのに、500万円を先払いって。僕にはたぶん一生できない。話を戻します。\n\nで、納期の2019年3月を過ぎても、完成しない。\n\n発注側が進捗を確認しても、開発側から具体的な返答が来ない。\n\n4月25日、4月26日、5月8日、5月10日と確認しても、具体的な進捗状況の回答なし。\n\nそして5月31日、発注側がついにこう言います。\n\nスケジュールやテスト画面もいただけなく，全く状況が分かりませんし，これ以上進めるのは不安です。\n\nもうプロダクトはいただかなくて結構ですので，最短で返金をお願いしたく思います。\n\n「もういらない、返金して」\n\nわかる。めっちゃわかる。つらい。\n\nその後発注側は正式に契約解除を通知して、払った493万6000円と損害賠償約380万円を請求します。\n\nちなみに全然関係ないけど「最短で返金をお願いします」ってメール、書いたことある人いますか。あの感情がこもった一文、リアルで胸が痛い。","issue":"両者の言い分が食い違ったポイントはここ。\n\n開発側の言い分：「デザインの確定が遅かったのはX側のせい。あと仕様が途中で変わった」\n発注側の言い分：「デザイン確定後1カ月半で完成するって言ったのに、それ以上かかってる。遅れは開発側のせい」\n\n裁判所はどっちの言い分が正しいかを判断しました。\n\nＣからデザインが提出されたのは平成３１年２月１１日，修正を経てデザインが確定したのは同月２６日であり，開発側の上記主張を前提としても，このアプリは，それから１か月半後の同年３月下旬頃ないし４月中旬頃までには完成していなければならないはずであるが，実際には，（略）開発側は，発注側から同年４月２５日，同月２６日，令和元年５月８日及び同月１０日に進捗状況を確認されたのに対しても，具体的な進捗状況を回答していないことが認められる。（略）\nそうすると，このアプリの完成が本件納期変更合意により定められた納期の平成３１年３月末日を大幅に徒過した原因は，発注側の責に帰すべきデザイン確定の遅れ以外に，開発側の作業の遅れが寄与した部分が相当程度大きいものといわざるを得ず，履行期を徒過したことにつき開発側に帰責事由がないとはいえない。\n\nまた開発側は「仕様追加があったから遅れた」とも主張しましたが、これも退けられています。\n\nまた，開発側は，このアプリの開発において発注側から仕様の追加変更がされたと主張する。しかしながら，発注側代表者から仕様の追加変更を求められた際に，開発側代表者やＤがそのような作業をすれば履行期に間に合わないなどと説明した形跡はなく，開発側が発注側から求められた仕様の追加変更に応じたため作業が遅れたことを裏付けるに足りる証拠は提出されていない。したがって，上記主張は採用することができない。\n\nつまりこういうこと。\n\n「仕様変更で遅れた」と言うなら、「これやったら間に合いません」と言った証拠が必要。\n\n言わずに受け入れた仕様変更は、言い訳にならない。\n\n裁判所、めっちゃ冷静。好き。\n\nあ、今思い出したんですけど「進捗状況を確認されても具体的な返答がない」って状況、エンジニアとして心当たりがある人、いますよね。答えにくいときほど返答しにくくなる。でもそれが証拠として積み上がっていくんですよ。怖い。","ruling":"さあ、裁判所の答えです。\n\n開発側の債務不履行が認められて、発注側が払った代金の全額（493万6000円）の返還が命じられました。\n\nさらに、発注側がデザイン費用として外部デザイナーに払った100万円も損害として認定。\n\nただし発注側が求めていた「約380万円の損害賠償」については、全額は認められませんでした。\n\n従業員の時間外労働とか、機会損失みたいな部分は「証拠が足りない」「因果関係が不明」として退けられています。\n\n払ったお金は戻ってきた。でも全部の損害は認められなかった、という結論です。","takeaway":"で、結局なにが大事なの？\n\n・進捗確認には必ず「具体的な回答」をもらうこと。「検討中」は返答じゃない\n・仕様変更を受け入れるなら「これにより納期が△日延びます」と書面で合意しろ。口頭で受けたら証拠にならない\n・発注側も「先払い全額」は避けよう。マイルストーン払い（進捗に応じた支払い）を交渉しろ\n・契約解除の前に書面で催告すること。手順を踏まないと解除が無効になることも\n\n「スケジュールもテスト画面も見せてもらえない」状態になる前に、動いておくべきだった。","one_liner":"進捗報告のないベンダへの500万円は、裁判所が取り返してくれる。でも裁判するくらいなら最初から証拠を残せ。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"美容情報会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ウェブ開発会社"}],"lessons":["証拠がないと詰む","損害、証明できる？"]},{"original_title":"東京地判令3.12.2（パッケージソフト導入時のベンダの調査・説明責任）","url":"https://itlaw.hatenablog.com/entry/2022/11/19/003613","court":"東京地判","date":"令3.12.2","year":"令和3年（2021年）","topic":"パッケージソフト導入時のベンダの調査・説明責任","categories":["PM・開発管理","責任・損害"],"fun_headline":"【悲劇】クリニックにパッケージソフトを入れたら「2カ月先の予約が取れない」仕様だった件","hook":"今日の話、お医者さんが登場します。\n\n医師がシステムを発注して、システムが使えなくて、420万円の裁判になった話。\n\nちょっと待ってこれ聞いたら驚くから。\n\n「予約が2カ月先までしか入れられない」って仕様、導入前に誰も言わなかったんですよ。\n\nそれって調べる義務があったんじゃないの？ って話です。","summary":"・絡んでる金額: 420万円\n・テーマ: パッケージソフト導入時のベンダの調査・説明責任\n・プロジェクト管理の問題","what_happened":"話を整理しますね。\n\n医師発注側が、クリニックの予約や売上管理のためにパッケージソフトを導入しようとして、ベンダ開発側と契約しました。\n\n【ちょっと解説】パッケージソフト── あらかじめ作られた汎用のソフトウェア。ゼロから作るより安くて早いけど、カスタマイズの限界がある。\n\nここで僕の話をさせてほしいんですけど、「パッケージソフトを入れる」って、なんか簡単そうに聞こえますよね。Excelをインストールするみたいな感じで。でも実際は「そのクリニックの業務にちゃんと合うか」を確認するのが超重要で、そこをサボると今日みたいなことになります。全然関係ないですね。話を戻します。\n\n試験導入したら、問題が発覚しました。\n\n「予約が2カ月先までしか入れられない」\n\nクリニックって半年先、1年先の予約を入れることがあるじゃないですか。\n\nそれが2カ月先までしかできない。\n\nこれってパッケージソフトとしての基本的な仕様なんですけど、開発側は事前にこれを調べて説明してなかったわけです。\n\n発注側は「ちゃんと調査して説明する義務があったはずだ」として、開発側を不法行為で訴えました。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。交通事故みたいなイメージ。\n\nちなみに全然関係ないけど、「試験導入してから問題に気づく」パターン、IT系あるあるですよね。本番切り替え前に試験環境で試す大切さを裁判所まで行って学ぶことになるとは。","issue":"で、何が問題になったかというと──\n\n「ベンダに調査・説明義務があったか」という点です。\n\n裁判所は開発側に「調査・説明義務違反」があったと認定しました。\n\nつまり「パッケージソフトを売る側は、そのソフトがお客さんの業務に合うかどうかを事前に調べる義務がある」ということです。\n\nここテストに出ます。\n\n次に「損害として何が認められるか」が問題になりました。\n\n発注側が請求していたのは：\n・ソフトの利用代金として払った約300万円\n・ネットワーク工事代金約35万円\n・従業員の超過勤務手当約11万円\n・慰謝料\n・弁護士費用相当額\n\n","ruling":"で、裁判所はどう判断したか。\n\n開発側の調査・説明義務違反は認めた上で、損害の範囲をこう仕分けしました。\n\n・ソフト代金（約300万円）：認める\n・ネットワーク工事代金（約35万円）：認める（「調査義務を果たしていれば工事もしなかった」という因果関係あり）\n・従業員の超過勤務手当（約11万円）：認めない（因果関係が不明）\n・慰謝料：認めない\n・弁護士費用：損害額の約1割を認める\n\n合計で約370万円の損害が認められました。\n\n裁判所、めっちゃ細かく仕分けしてる。「これは関係ある、これは関係ない」って冷静に切り分ける。好き。\n\nあ、今思い出したんですけど「慰謝料が認められない」のって、財産的損害が認められてるから精神的損害まで別に補償しなくていい、という論理なんですよね。つまり「お金は返ってくるけど、精神的苦痛はノーカン」みたいな。なんか釈然としない。でもそれが法律です。","takeaway":"で、結局なにが大事なの？\n\n・パッケージソフトを売るベンダには「業務に合うか調査する義務」がある。これ知らないベンダ多い\n・発注する側も「試験導入は本番前に必ずやる」を徹底しよう。後から気づいても遅い\n・「工事費用も含めて損害」と認められた点が重要。ソフト代だけじゃなく付随コストも請求できる\n・損害賠償は「因果関係が証明できるもの」しか認められない。記録をちゃんと残せ\n\n420万円の裁判で370万円戻ってきた。でもその間に失った時間と労力は戻らない。","one_liner":"パッケージソフトを売るなら、まずそれがお客さんの業務に合うかどうか調べろ。それがプロの仕事だ。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"医師"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ソフトベンダ"}],"lessons":["損害、証明できる？"]},{"original_title":"東京地判令3.11.30（他人にアカウントを貸与した者に対する救済の要否）","url":"https://itlaw.hatenablog.com/entry/2022/10/29/155731","court":"東京地判","date":"令3.11.30","year":"令和3年（2021年）","topic":"他人にアカウントを貸与した者に対する救済の要否","categories":["利用規約・消費者"],"fun_headline":"【悲報】ゲームのアカウントを人に貸したら二度と戻らなかった件","hook":"利用規約って、読んでないじゃないですか。みんな。読んでない。\n\nインストールするたびに「同意する」を押し続けた結果、自分が何に縛られているかもわからないまま生きている。\n\n今日の判例は、そういう「読んでなかった人」が裁判所に持ち込んだ話です。\n\nで、結果どうなったか。まあ予想はつくと思うんですけど。","summary":"・テーマ: 他人にアカウントを貸与した者に対する救済の要否\n・利用規約の問題","what_happened":"ちょっと整理しますね。\n\nユーザー側はスマホゲームをやってたんですよ。\n\nで、自力でクリアできないステージがあって。詰まったわけですね。\n\n「プロにやってもらおう」と思ったんでしょう。ネット掲示板でプレイ代行者を募集した。\n\nここ、気持ちはわかる。めちゃくちゃわかる。つらいんですよね、詰まるって。\n\nちなみにここで全然関係ない話なんですけど、僕も昔スマホゲームで詰まって知らない人に頼もうかと思ったことがあります。結局やめたんですけど、あのときやめておいてよかったと今回の判例を読んで心底思いました。話を戻します。\n\nユーザー側は、応募してきた人に引き継ぎIDと引継パスワードを教えて、アカウントを渡した。\n\nで、その人と連絡が取れなくなった。\n\nアカウントも当然、消えた。\n\n怖すぎる。\n\nユーザー側はゲーム会社サービス側に「新しい引き継ぎIDとパスワードを発行してください」と求めた。要するに「助けてください」ってこと。\n\nなお、サービス側のこのアプリの利用規約にはこう書いてありました。\n\n２．８　利用者は，このアプリへのアクセス，このアプリの利用に必要な携帯端末を自己の責任で維持するものとし，利用者が被告に対して有する権利及び義務は，当該利用者に一身専属し，譲渡できない。\n\n３．１(1)　利用者は，自身のアカウント情報（アカウントＩＤ等）及び登録したパスワードを第三者に使用させてはならない。利用者は，被告の承諾なくアカウント情報を第三者に開示，貸与，売買，贈与又は譲渡等することができない。\n\n「読んでないんですけど？」って思ったそこのあなた、全員同罪です。","issue":"要するに何が問題だったの？\n\nサービス側は、ゲームの利用契約上、ユーザー側に引き継ぎIDおよび引継用パスワードを発行する義務を負うか。\n\nここテストに出ます。「規約を破ったユーザーをゲーム会社が助ける義務があるか」という話です。\n\n答えは想像できると思うんですけど、続けます。","ruling":"いよいよ判決です。\n\n裁判所はめちゃくちゃ冷静にこう言いました。\n\nこのアプリの利用規約においては，アカウントの貸与や譲渡の禁止が重ねて規定されており，このアプリを利用する際に利用者が最低限遵守しなければならない義務であると認められる。\n\nそうすると，自力ではクリアできないキャラクターの登場に困り，インターネットの掲示板で応募してきたプレイ代行者に引き継ぎＩＤと引継用パスワードを教えたとする原告の事実関係を前提とすると，原告は，このアプリにおいて最低限遵守しなければならない義務に違反しており，前提事実(1)，(3)によれば，被告は，原告のアカウントを停止又は削除することができるのであって，原告にとって不利益の少ない措置である引き継ぎＩＤと引継用パスワードの発行を拒否することは当然に許される。\n\nつまりこういうことです。\n\n「規約に貸し禁って書いてありましたよね？　書いてありましたよね？　なので助けなくていいです」。\n\n裁判所、まじで容赦ない。好き。\n\nちなみに「でも読んでなかったし」は法律上、一切の言い訳になりません。これ本当に怖い話です。\n\nあ、今思い出したんですけど、Amazonの利用規約って確か数万文字あるらしいんですよ。読んだことある人いますか。いないですよね。全員同意してるのに。こわい世界。","takeaway":"で、結局なにが大事なの？\n\n・利用規約は「読まなくても同意したことになる」。「知らなかった」は通用しない\n・アカウントの貸し借り・売買は、たいていの規約で禁止されている。やるとアカウントが消えても文句言えない\n・「プレイ代行業者」に頼む行為は、規約違反になることが多い。詰まったらゲームを休もう\n・困ったときにゲーム会社が助けてくれるかどうかは、自分が規約を守っていたかどうかによる\n\n身も蓋もない結論：利用規約を守れ。以上。","one_liner":"「読んでないから知らなかった」が通じるのは、テスト前日の言い訳だけです。","parties":[{"role":"ユーザー側","icon":"👤","side":"plaintiff","desc":"ゲームユーザ"},{"role":"サービス側","icon":"🌐","side":"defendant","desc":"ゲーム運営会社"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["規約、読んだ？"]},{"original_title":"東京地判令3.11.25（アジャイル型開発の未完成とベンダの責任）","url":"https://itlaw.hatenablog.com/entry/2024/10/20/141111","court":"東京地判","date":"令3.11.25","year":"令和3年（2021年）","topic":"アジャイル型開発の未完成とベンダの責任","categories":["PM・開発管理","瑕疵・完成","責任・損害"],"fun_headline":"【実録】2000万払って「アプリとして破綻してます」と言われた男の話","hook":"ちょっと待ってこれ聞いたら驚くから。\n\nソフトウェア開発に2450万円払って、ベンダから「アプリとして破綻してます」って言われた事件があるんですよ。\n\nベンダが自分で言うんですよ。「破綻してます」って。\n\nそれでも裁判で負けるの、発注者側が。意味がわからない。でも理由がある。今日はそれを話します。","summary":"・絡んでる金額: 2450万円\n・テーマ: アジャイル型開発の未完成とベンダの責任\n・プロジェクト管理の問題","what_happened":"登場人物を整理しましょう。\n\n原告側：eスポーツ事業の会社。ゲーマー向けソーシャルアプリを作りたかった。\n\n被告側：開発ベンダ。アプリを作ってあげますという会社。\n\n2016年8月、二社は契約を結んだ。報酬は合計2450万円。\n\nここでまず重要な話があります。\n\n契約前の交渉で、発注側が「検収に合格しなかったら返金して」と求めたんですよ。普通の発想ですよね。で、開発側がなんと言ったか。\n\n【ちょっと解説】準委任（じゅんいにん）── 「結果は約束しないけど、プロとしてちゃんとやります」という契約。美容院で「いい感じにしてください」と言うのに近い。SES契約はだいたいこれ。\n\n「準委任契約は業務の遂行そのものが目的ありますので、貴社の意向に沿って開発は行いますが，返金対応は致しかねます。スケジュール通りの進行の為には，インフラ担当，デザイン関連の貴社側担当部分等の進捗によっても影響が出てくる部分となりますので，弊社側のみで担保しきれない部分があることもご了承下さい。」\n\n「返金しません、完成も保証しません、でもよろしく」。これが最初の交渉です。\n\n僕が発注側の立場だったら、この時点で絶対に断ります。でも発注側は断らなかった。\n\nちなみに全然関係ないけど、「値引きを行うからには融通を」みたいな交渉、居酒屋の会計でも似たようなことありますよね。「安くするから量は少なくて」みたいな。あれと似た構造。話を戻します。\n\n開発側はこうも言いました。\n\n「値引きを行うからには，スケジュールや仕様の面で融通を効かせて頂けるとありがたい。開発を進めた部分のお金が頂けないという事は無しでお願いしたい。」\n\nこうして「返金なし」「完成保証なし」の契約が結ばれ、発注側は2000万円を開発側に払いました。\n\nで、ここからがヤバいんですけど。\n\n期限を過ぎてもソフトは完成しなかった。2017年8月、開発側から発注側へのメッセージが届く。\n\n「現状の機能で一旦リリースはちょっと厳しい」\n\n「（リリースするのは）ブラッシュアップフェーズを設けてからにしたい」\n\n「以前打ち合わせでもお話にあった，全体的に，何やるためのもの？って感じはあります」\n\n「アプリとして破綻しているって感じです」\n\n「アプリとして破綻してます」。\n\n自分で作ってるのに。自分で言ってる。\n\nその後、いったん未完成品が納品され、12月までやり取りが続いたが、結局開発は頓挫。発注側は2000万円の返還などを求めて訴えた。","issue":"要するに何が問題だったの？\n\nメインの争点は「ベンダにプロジェクトマネジメント義務違反があったか」です。\n\n【ちょっと解説】PM義務── ベンダ（開発側）がプロジェクトを適切に管理・推進する義務。進捗がヤバいなら早めにアラートを出せ、という話。\n\n発注側の主張：「ベンダとしてちゃんとプロマネしなかった。追加費用の主張ばかりで何もしなかった」\n\n開発側の反論：「ちゃんと助言したし、仕掛品も渡したし、やれることはやった」\n\nどちらが正しいか。裁判所が判断します。\n\nまず、裁判所はベンダのPM義務の一般論をこう述べました。\n\nソフトウェアの開発に係る契約であるこの契約の特質に鑑みると，ソフトウェア開発を担うベンダである開発側は，このソフトウェアの開発に当たり，ユーザーである発注側に対し，ベンダとして通常求められる専門的知見をもってこのソフトウェアの開発を進め，得られた情報を集約・分析して原告に必要な説明を行い，その了解を得ながら必要な修正及び調整等を行いつつ，このソフトウェアの完成に向けた作業を適切に行うべき義務（プロジェクトマネジメント義務）を負っていたものと認められる。\n\nここテストに出ます。「ベンダはちゃんとPMしなきゃいけない」。これは裁判所も認めてる。","ruling":"じゃあ開発側がPM義務違反をしたかどうか。\n\n裁判所はこう言いました。\n\n（開発側は）このソフトウェアに機能を盛り込みすぎであり，現状の予算で作製することは困難であるとの懸念を示し，機能を絞った上でブラッシュアップフェーズを設けて作製すべきであるとの意見を述べた上で，発注側に対して本件仕掛品を送信して具体的な検討を促しており（前記１(7)，(8)），前記２において説示したとおり，かかる懸念及び意見はもっともなものであったと認められる。すなわち，開発側は，このソフトウェアの仕様の作成は発注側の役割であるとして，漫然と放置していたわけではなく，打合せを基にこのソフトウェアの開発を進め，本件仕掛品を基に発注側に必要な助言を行った上で，このソフトウェアの完成に向けた提案を行っていたと認められるのであり，プロジェクトマネジメント義務を果たしていたものと認められる。\n\nつまりこういうことです。\n\n「『機能盛り込みすぎ』『予算足りない』と警告して、未完成品を渡して、追加提案もした。放置してない。だからPM義務違反なし」。\n\n裁判所、めっちゃ冷静。好き。\n\nそして発注側の請求はすべて棄却されました。\n\n2000万、戻ってこなかった。\n\nここで僕の話をさせてほしいんですけど、「アプリとして破綻してます」って言われたのに義務違反じゃないって、要するに「警告はしてた」ってことが重要だったわけですよ。言ったもん勝ちみたいな話で、なんか腑に落ちないけど、法律的には筋が通ってる。話を戻します。","takeaway":"で、結局なにが大事なの？\n\n・「準委任」は完成を保証しない契約。発注前に「請負」か「準委任」か確認しろ\n・返金条件・検収条件は契約書に具体的に書け。口頭の「なんとかします」は法的に無価値\n・ベンダのPM義務は「成功させる義務」ではなく「ちゃんと警告して管理する義務」。警告してたら負けない\n・「アプリとして破綻してます」と自分で言っても、警告さえしていれば義務違反にならない。怖い\n\n一言で言うと：準委任は「頑張ります」であって「完成させます」ではない。","one_liner":"準委任契約とは「完成する義務はないけど頑張る義務はある」という魔法の契約。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"eスポーツ会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"アプリ開発会社"}],"lessons":["「完成」って何？","金の話は最初にしろ","PM不在の悲劇"]},{"original_title":"東京地判令3.11.19（ゲーム内の誤表示と取消しの可否）","url":"https://itlaw.hatenablog.com/entry/2022/10/21/223610","court":"東京地判","date":"令3.11.19","year":"令和3年（2021年）","topic":"ゲーム内の誤表示と取消しの可否","categories":["ネット・コンテンツ"],"fun_headline":"【4900円の悲劇】ゲームに騙されて課金したのに、返金してもらえなかった理由がヤバすぎた","hook":"今日の話、ちょっと人ごとじゃないから聞いて。\n\nゲームが誤表示で「このガチャ引いたら欲しいキャラ確定でもらえます」って出してたんですよ。\n\nで、信じて課金した。\n\n嘘でした。\n\nちゃんと取り消せると思うじゃないですか。消費者保護っていうやつで。\n\nでも取り消せなかった。なぜか。これが今日の話です。","summary":"・絡んでる金額: 4900円\n・テーマ: ゲーム内の誤表示と取消しの可否\n・ネット上の問題","what_happened":"話を整理しましょう。\n\nオンラインゲームのユーザー権利者が、ゲーム内の「お知らせ」画面を見た。そこには、とあるガチャを引いたら「欲しいキャラが確定でもらえる」という表示があった。\n\n権利者はそれを信じて、約9時間のあいだその表示が出てた時間帯に、ゲーム内通貨4900円分を購入してガチャを引いた。\n\nその後、運営相手方が「誤表示でした」と謝罪し、該当ユーザーにゲーム内通貨を返還した。\n\nここまでは「ゲーム会社が誠実に対応した話」に見えるんですよ。\n\nでもここからがヤバい。\n\n権利者は、返還してもらったゲーム内通貨を「全部使った」んですよ。\n\nここ、重要です。全部使った。\n\nちなみにここで全然関係ない話なんですけど、僕もポイント還元されたらすぐ使っちゃうタイプなんですよね。使ってから「あれ、これ問題のやつと紐付いてたっけ」ってなることある。みなさんはそういうことないですか。ちょっと心当たりある人いるでしょ。話を戻します。\n\n権利者はその後、「誤表示は不法行為だ」「消費者契約法の不実告知だ」として、相手方に4900円の返還などを求めて訴えた。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。","issue":"両者の言い分が食い違ったポイントはここ。\n\n本件ガチャに関して、相手方に権利者への不当利得返還義務があるか。\n\nつまり「誤表示で買わせた4900円を、返す義務があるか」という話です。\n\n消費者契約法では、事業者が嘘の情報を伝えて消費者に契約させた場合、消費者はその契約を取り消せます。これを「不実告知による取消し」といいます。\n\n権利者には取消権があったはずです。問題は「使えたかどうか」じゃなくて、「ちゃんと使ったかどうか」でした。","ruling":"裁判所の判断、二段階で来ます。\n\nまずフェーズ1。裁判所は「取消し自体は可能だった」と認めました。\n\n本件誤表示は，新★４□□を欲する利用者にとって，○○を購入するか否か，本件ＳＴＥＰ１ないし３を引くか否かについて判断する際に通常影響を及ぼす事項について真実と異なることを告げるものであり，消費者契約法の不実告知に当たるというべきである。（略）\n\nそして，権利者が，本件オーダーの提供が始まってからわずか約２時間以内に，本件購入契約を締結するとともに本件ＳＴＥＰ１ないし３を引いたこと（前提事実(4)），（略）に照らせば，権利者は，本件誤表示により，本件ＳＴＥＰ３を引けば新★４□□・１枚が確実に提供されるものと誤信して，本件購入契約，本件ＳＴＥＰ２契約及び本件ＳＴＥＰ３契約を締結したものと認められる。したがって，権利者は，消費者契約法に基づき各契約を取り消すことが可能であったといえる。\n\nここまでは「権利者の言うとおり」です。騙された、取消可能、と裁判所も認めた。\n\nでもフェーズ2で全部ひっくり返ります。\n\n不実告知により締結した契約を「追認をすることができる時」とは，不実告知による誤認が解消した時，すなわち，消費者が告げられた重要事項が真実と異なることに気づいた時をいうと解されるところ，本件ＳＴＥＰ３を引けば新★４□□・１枚が確実に提供されるという本件告知画面の内容に反して，新★４□□・１枚が提供されなかったことを権利者が認識した以上，その時点で，不実告知による誤認は解消されたものと認められる。そして，法定追認事由である民法の「全部又は一部の履行」には，取消権者が，債権者として相手方からの履行を受領する場合も含まれると解されるから（大判昭和８年４月２８日民集１２巻１０４０頁参照。なお，当該解釈について当事者間に争いはない。），権利者が，本件ＳＴＥＰ３を引いた結果が本件告知画面の内容と異なっていることを認識しながら，本件ＳＴＥＰ２，３で当選した□□・２２枚を全て受領したことは，本件購入契約，本件ＳＴＥＰ２契約及び本件ＳＴＥＰ３契約に基づく相手方の履行を受け容れたものといえ，上記法定追認事由に該当するものと認められる。\n\n長いんで簡単に言いますね。\n\n「嘘だと気づいたあとに、返ってきたゲーム内通貨を全部使ったよね？　それって『この契約でいいです』って認めたことになるよ。だから取消し権は消えたよ」。\n\n「法定追認」ってやつです。つまり「受け入れたら認めたことになる」ってこと。\n\n裁判所、容赦ない。でも論理は通ってる。\n\n権利者の請求はすべて棄却されました。","takeaway":"で、結局なにが大事なの？\n\n・ゲームの誤表示でも「返金してもらえる可能性はある」。ただし速攻で取消しを主張しないとダメ\n・問題に気づいたあとに、返還されたアイテムや通貨を使うと「認めた」と見なされて取消し権を失う\n・「嘘だとわかっていながら受け取る」行為は法的に「承諾した」と解釈される。これが法定追認\n・変なことがあったらすぐ申し出ろ。時間が経つほど選択肢が減る\n\n一言でまとめると：怒る前に使うな。使ったら認めたことになる。","one_liner":"「嘘つかれた！」と怒るのは全部使い切ってからじゃ遅い。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"ゲームユーザ"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"ゲーム運営会社"}],"lessons":["証拠がないと詰む"]},{"original_title":"東京地判令3.9.30（アジャイル開発における開発言語・納期の合意）","url":"https://itlaw.hatenablog.com/entry/2022/05/04/231359","court":"東京地判","date":"令3.9.30","year":"令和3年（2021年）","topic":"アジャイル開発における開発言語・納期の合意","categories":["瑕疵・完成"],"fun_headline":"【2000万円の教訓】「アジャイルだから納期は曖昧で」が通じなかった件","hook":"みなさん、「アジャイル開発」って聞いたことありますか。\n\n柔軟に、反復的に、変化に対応しながら作っていく開発手法です。\n\nつまり「仕様変わってもOK」「納期も柔軟に」「とにかく動かしながら考えよう」みたいな感じ。\n\nで、これが裁判になりました。\n\n「柔軟に」って言ってたはずなのに、なぜ。","summary":"・絡んでる金額: 2000万円\n・テーマ: アジャイル開発における開発言語・納期の合意\n・完成したかどうかの争い","what_happened":"登場人物を整理します。\n\n原告側：会社を設立しようとしていた人。ウェブサービスを作りたかった。\n\n被告側：開発ベンダ。月額2000ドルで開発します、という会社。\n\nアジャイル方式で開発することにした。契約書は後追いで作ることにした。\n\nここ、もうすでに怖い。契約書後追い、アジャイル、全部ふわっとしてる。\n\nちなみにここで僕の話をさせてほしいんですけど、「後でちゃんとやろう」と言ったこと、だいたいちゃんとやらないですよね。それが「後で契約書書こう」ってなったとき、怖すぎませんか。話を戻します。\n\nこのウェブサービスは、もともと第三者が開発した原型があって、それに追加・改良していく予定でした。\n\n発注側は代金を払い続けた。しかしサイトはまったく機能しなかった。\n\n開発が遅延した。動かなかった。\n\n発注側は怒って、開発側を訴えた。既払い代金の返還、逸失利益、慰謝料など、合計で約2000万円を請求。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\nえっ。マジで？　と思ったあなた、正常です。\n\nそして裁判所は、開発側の債務不履行を認めました。ソースコードの引き渡し拒否や、エンジニアの稼働状況の虚偽報告も不法行為と認定。","issue":"さあ、何が揉めたのかというと。\n\n「損害がいくらか」という話になります。\n\n裁判所が認定した損害はこれです。\n\n- 既払金　約100万円\n- 原型部分のウェブサイト構築費用（発注側が第三者に支払った部分）　約7000米ドル\n- ＡＷＳ費用　約100米ドル\n- コード履歴分析費用（開発側が格納したとするＡＷＳにアクセスできなかったため、第三者の支援を受けた費用）　約1000米ドル\n\n「え、それだけ？」ってなりますよね。\n\n2000万円請求したのに。\n\n【ちょっと解説】逸失利益── 「あの事故がなければ得られたはずの利益」のこと。システムが止まってる間の売上損失とか。\n\n発注側が主張した逸失利益（「サービスが完成していれば得られたはずの売上」）は、「設立予定の会社の計画数値に過ぎない。根拠がない」として退けられました。\n\n慰謝料も「財産的損害で十分補われるから原則として不要」として退けられました。\n\nここ、エンジニアなら身に覚えがある人いるんじゃないですか。「でかい損害があったはずなのに、証明できないと認められない」っていう。","ruling":"まとめると、裁判所の答えはこうです。\n\n「開発側がダメだったのは認める。でも発注側が請求した損害のほとんどは、根拠がなくて証明できていない。だから認められる損害はわずかだ」。\n\nあ、今思い出したんですけど、「いくら損害を受けたか」って、証明するのがめちゃくちゃ難しいんですよ。感覚では「絶対損した」ってわかっても、法律的に証明できなければゼロ扱いになる。これが裁判の怖いところです。\n\n結果として、発注側が回収できたのは2000万円のうちのほんの一部でした。\n\n裁判所は正しいことを言っている。でも発注側の気持ち、わかる。めっちゃわかる。つらい。","takeaway":"で、結局なにが大事なの？\n\n・損害賠償を請求するなら「損害の証拠」が必要。「絶対損した」じゃ認められない\n・逸失利益（得られたはずの利益）は証明が難しい。計画書だけでは足りない\n・受入テストの条件と合否基準は事前に合意しておけ\n・トラブルの記録は丁寧に残せ。裁判では「書いてある・書いてない」で決まる\n\n教訓：損害は感覚じゃなく証拠で語れ。","one_liner":"「絶対損したはず」は法廷では何も意味しない。証拠だけが正義。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"スタートアップ"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ウェブ開発者"},{"role":"第三者","icon":"👥","side":"third","desc":"このウェブサービス"}],"lessons":["証拠がないと詰む","「完成」って何？","損害、証明できる？"]},{"original_title":"知財高判令3.9.29（放置系RPGの著作権侵害）","url":"https://itlaw.hatenablog.com/entry/2021/12/25/231816","court":"知財高判","date":"令3.9.29","year":"令和3年（2021年）","topic":"放置系RPGの著作権侵害","categories":["著作権"],"fun_headline":"【4800万円の戦い】放置系RPGが「パクられた」と訴えたら、裁判所に全部否定された件","hook":"ねえ、放置系RPGって知ってますか。\n\nゲームを起動しないでもキャラがひたすら戦い続けて、ログインするとアイテムが貯まってるやつ。\n\nあれ、「ジャンルが同じ」「見た目が似てる」「ゲームシステムが似てる」で著作権侵害って言えると思います？\n\n言えないです。今日はその話です。","summary":"・絡んでる金額: 4800万円\n・テーマ: 放置系RPGの著作権侵害\n・著作権がらみの争い","what_happened":"で、何が起きたかというと。\n\n放置系RPGのＡゲーム（以下「権利者ゲーム」）の著作権を持つ権利者が、同じジャンルのＢゲーム（以下「相手方ゲーム」）を配信する相手方を訴えた。\n\n「うちのゲームをパクった。著作権を侵害した。4800万円払え、ゲームを止めろ、データを消せ」。\n\n【ちょっと解説】公衆送信権── 著作権の一種で、著作物をインターネット等で公衆に送信する権利。無断でネットにアップすると侵害になる。\n\n強い。全部盛りの請求ですね。\n\nここで一審（東京地裁）は、権利者ゲームの著作権を持っていることは認めつつ、「ゲームの構成・機能・画面配置・プログラムのソースコード、どれをとっても権利者ゲームをパクったとは言えない」として、権利者の請求を全部棄却しました。\n\n権利者は控訴した。\n\nここまで読んで「うわぁ……」ってなった人、正常です。\n\nここで僕の話をさせてほしいんですけど、「同じジャンル」って著作権的にはなーんも関係ないんですよ。「放置系RPGというジャンル」はアイデアで、アイデアには著作権がない。これ、知らない人多いと思う。話を戻します。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\n控訴審で権利者は、著作権侵害の主張に加えて、「一般不法行為による損害賠償請求」も追加しました。","issue":"で、何が問題になったかというと──\n\n権利者ゲームと相手方ゲームについて、著作権侵害があったかどうかです。\n\n権利者は「ゲームの構成・機能・画面配置の組み合わせが似ている」「プログラムも複製・翻案されている」と主張。\n\nここテストに出ます。「著作権侵害が認められるには、表現が具体的に同じでないとダメ」ということ。\n\n「考え方が似てる」「コンセプトが同じ」では著作権侵害にならない。ゲームのジャンル・システム・ルールはそれ自体では保護されない。具体的な表現（グラフィック・文章・コードの書き方など）が一致していないとアウトにならない。\n\n権利者はこれを証明できたのか。","ruling":"いよいよ判決です。\n\n控訴審（知財高裁）は、基本的に一審判決を引用する形で判断しました。\n\n裁判所の結論は「著作権侵害なし」。\n\nゲームの構成・機能・画面配置については、「ゲームジャンルとしての共通性であり、具体的な表現の同一性ではない」。\n\nソースコードについても、「コードの具体的な内容が一致しているとは認められない」。\n\n要するに：「ジャンルが同じ」「システムが似てる」「画面のレイアウトが近い」は著作権侵害にならない。具体的な表現がまったく同じじゃないとアウトにならない。\n\n裁判所、めっちゃ冷静。好き。\n\nちなみに全然関係ないけど、「著作権」って響き、なんか守ってくれそうじゃないですか。でも実際は「表現」しか守らないので、アイデアを盗まれても法律上は何もできないことが多い。これ、知っておくと損しない知識です。\n\n権利者の請求は控訴審でも棄却されました。4800万円、1円も取れなかった。","takeaway":"で、結局なにが大事なの？\n\n・著作権はアイデア・システム・ジャンルを守らない。守るのは「具体的な表現」だけ\n・「同じジャンルで似たゲームを作る」のは著作権侵害にならないことが多い\n・著作権侵害を主張するなら「どの具体的な表現が一致しているか」を示せないと話にならない\n・コードや画像など「そのもの」のコピーでなければ、著作権侵害は認められにくい\n\n身も蓋もない結論：アイデアは守られない。表現だけが守られる。","one_liner":"著作権は「考え方」を守らない。守るのは「言い方」だけ。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"ゲーム会社"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"競合ゲーム会社"}],"lessons":["証拠がないと詰む","パクリの立証は地獄"]},{"original_title":"東京地判令3.9.28（検収の成否）","url":"https://itlaw.hatenablog.com/entry/2024/10/05/161016","court":"東京地判","date":"令3.9.28","year":"令和3年（2021年）","topic":"検収の成否","categories":["契約・報酬"],"fun_headline":"【3840万円事件】「お金払ってたら検収したことになるんですよ」と裁判所に言われた話","hook":"「検収書を渡してない」「手付金も返してない」のに、検収したとみなされることってあるんですよ。\n\n僕これ初めて知ったとき「え？それってどういうこと？」ってなりました。お金払ってたら認めたことになるんだって。こわい。\n\nIT業界で3840万円の争いになった事件、一緒に見ていきましょう。","summary":"・絡んでる金額: 3840万円\n・テーマ: 検収の成否\n・契約とお金の話","what_happened":"話を整理しましょう。\n\nベンダ（被告、開発側）は、ユーザ（原告、発注側）から、平成29年8月9日、旅行代理店事業向けのシステムの開発を請け負いました。請負報酬は3840万円。検収を終えた翌月から毎月80万円ずつ払う約束です。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。ラーメン屋で「醤油ラーメンください」と注文するのと同じで、ラーメンが来なかったら契約違反。\n\nで、手付金として345万6000円を先払い。この手付金は「検収に合格したら返す」という約束でした。\n\n【ちょっと解説】検収（けんしゅう）── 「確認しました、OKです」と納品物を正式に受け取ること。これが終わると「やっぱダメ」とは言いにくくなる。ここがこの事件の核心です。\n\nシステムは平成30年4月4日に引き渡され、4月から8月の間に合計400万円が支払われました。\n\nここで僕の話をさせてほしいんですけど、お金って払ったあとに「これ払わなければよかった」ってなることありますよね。引っ越し業者に荷物を壊されたのに先払いしてしまったときの絶望感。完全に別の話なんですけど今思い出しました。話を戻します。\n\n開発側は検収書を受領しておらず、手付金も返していません。\n\nで、ここからがヤバいんですけど。\n\n発注側は同年8月ごろ、「このシステムにバグがある」というリストを開発側に送りつけながら「納品・検収は終わっていない」として契約解除の意思表示をします。手付金345万6000円＋支払済400万円、合計745万6000円の返還を要求（本訴）。\n\n一方の開発側は「仕事は完成している」として残代金約3100万円の支払いを要求（反訴）。\n\nつまり双方が「こっちがもらう側だ」と言って法廷で戦うことになったわけです。こわすぎる。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n","issue":"要するに何が問題だったの？\n\n「検収、したの？してないの？」\n\nここに尽きます。ここテストに出ます。\n\n発注側は「してない」と言い、開発側は「した」と言う。検収書は交わしていない。手付金も返されていない。でもお金は5ヶ月払っていた。\n\nどっちが正しいのかを裁判所に判断してもらうことになりました。","ruling":"いよいよ判決です。\n\nまず前提として、システムの仕様は何かという問題。平成29年9月6日に「原型の最終確認」という文書が取り交わされていたので、これで仕様は確認済みと認定されました。\n\n発注側は「それ以外の機能も随時修正・変更していく約束だった」と主張しましたが、書面に残ってないとして却下。ここも怖いポイントです。\n\n裁判所はこう言いました。\n\n開発側が発注側に対して本件引渡しをしたこと，その後に発注側が運営していた旅行商品販売システムは，本件各機能及び本件個別的機能等を有していたほか，画面表示についても配色や表示順の一部等を除いてこのシステムと同一であったこと，開発側からこのシステムの製作業務を受託したＢの担当者が発注側担当者に対してこのシステムの納品を報告したと読み取れるメッセージを送信したこと，発注側が本件引渡しを受けた平成３０年４月から５か月間，ほぼ毎月にわたって，毎月末日頃に，検収後に支払う約束であった報酬と同額の金員を開発側に対して支払っていることなどの事情が認められ，これらの事情からすれば，開発側は，本件各機能を具備したこのシステムの製作に係る全工程を終え，その成果物を原告に引き渡し，発注側がこれを検収したものと認めるのが相当である。\n\n発注側が，本件引渡しを受けて上記報酬の支払を開始した後に，このシステムに存在していたとする瑕疵（バグ等）を一覧表にしてこれを開発側に対して送付した事実，開発側が，検収書を発注側から受領していない事実，検収後に返還すべき旨が合意されていた手付金を発注側に対して返還していない事実は，上記認定を妨げるものではない。\n\n「検収書ない」「手付金も返ってない」を盾に「検収してない！」と言いたかった発注側の立場から見ると、ちょっとキツい結果ですよね。裁判所、めちゃくちゃ冷静。好き。\n\nつまりこういうことです。「5ヶ月間、毎月ちゃんと検収後の報酬と同額を払ってたんだから、実質的に検収を認めたでしょ」という判断です。\n\n【ちょっと解説】瑕疵（かし）── 法律用語で言う「バグ」。正確には「契約で約束した品質を満たしていない部分」のこと。\n\nよって、発注側の本訴請求はすべて棄却。開発側の反訴請求（残代金の支払い）が認められました。発注側は手付金どころか、まだ払っていない残代金まで払わないといけないことになりました。","takeaway":"で、結局なにが大事なの？\n\n・検収条件は契約書に具体的に書け。 「何をもって検収完了とするか」が曖昧だと、お金を払った事実で判断される\n・お金を払い続けるのは「認めた」サイン。 文句があるなら払うな。払いながら「検収してない」は通じにくい\n・仕様変更の約束は必ず書面に残せ。 口約束は法廷では「なかった話」になる\n・検収書の受領・手付金の返還は確実に実行。 証拠として機能する\n\nこの事件、発注側側の気持ちはわかるんですよ。バグがあったのに…という思いはあったと思う。でも「払い続けた」という事実が全部持っていってしまった。つらい。","one_liner":"お金を払うのは最強の意思表示。文句があるなら払うな。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"旅行代理店"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ITベンダ"}],"lessons":["契約書読んどけば…","「完成」って何？","金の話は最初にしろ"]},{"original_title":"大阪地判令3.9.27（ハッシュタグと商標的使用）","url":"https://itlaw.hatenablog.com/entry/2021/10/17/144501","court":"大阪地判","date":"令3.9.27","year":"令和3年（2021年）","topic":"ハッシュタグと商標的使用","categories":["その他"],"fun_headline":"【メルカリ事件】ハッシュタグを付けただけで商標権侵害になりました、という話","hook":"ちょっと待ってこれ聞いたら驚くから。\n\nメルカリで手作りのバッグを売るとき、「#シャルマントサック」というハッシュタグを付けたら商標権侵害で訴えられる、って知ってました？\n\n「え、ハッシュタグって検索のためのやつじゃないの？」って思いますよね。僕もそう思いました。でも裁判所の答えは違った。\n\nこれ、メルカリやってる人は全員他人事じゃないです。","summary":"・テーマ: ハッシュタグと商標的使用","what_happened":"登場人物を整理しますね。\n\n原告側は「シャルマントサック」という商標の権利者。かばん系の商品に登録した商標です。\n\n被告側は趣味でハンドメイドのバッグを作ってメルカリで売っていた個人の方。自分の商品紹介ページに「#シャルマントサック」というハッシュタグを付けていました。\n\nここ、大事なとこなんで簡単に言うと、被告側は「シャルマントサック好きな人にも見てもらえるように」という感じでハッシュタグを使っていたわけです。悪意があったかどうかはわかりませんが、まあ普通にやりそうなことですよね。\n\nあ、今思い出したんですけど、僕も昔Twitterで関係ないハッシュタグ付けてたことあります。「#猫好きと繋がりたい」とか付けてたのに猫飼ってなかった。全然似てない話ですね。話を戻します。\n\nちなみに全然関係ないけど「シャルマントサック」ってすごい名前ですよね。なんか宝石みたいな響き。気になって調べたくなりました。で、話を戻します。\n\n原告側はこれを見て「うちの商標を使ってる！」として差止めを求めて訴えを起こしました。\n\n被告側の言い分は二つ。\n\n一つ目「私は趣味でやってるだけだから『業として』やってるわけじゃない」。\n\n二つ目「ハッシュタグは検索のための記号であって、商標として使っているわけじゃない」。\n\n一見、どちらも筋が通ってるように見えますよね。でもここからが怖いんですよ。","issue":"要するに何が問題だったの？\n\n争点は二つです。ここテストに出ます。\n\n（１）「業として」やってたの問題\n\n商標法では、商標として保護されるのは「業として」使う場合に限られます。被告側は「趣味でやってただけ」と主張。これが認められれば商標法は適用されない。\n\n（２）ハッシュタグは「商標的使用」なの問題\n\n商標権が侵害されるには、相手が「商標として使っている」必要があります。被告側はあくまでSNSの検索機能のために付けたタグだと主張。「ブランド名として使ったわけじゃない」ということ。\n\nどっちの言い分が通るか。裁判所に聞いてみましょう。","ruling":"いよいよ判決です。\n\n（１）業としての使用について\n\n裁判所はこう言いました。\n\n「業として」（法２条１項）とは，反復継続して行うことを意味し，営利目的であるか否かは問わない。\n\nつまり「趣味でも関係ない、繰り返しやってたら『業として』だ」ということ。被告側は1年以上にわたって複数の商品をメルカリで販売していたので「業として」に該当と認定されました。\n\n「趣味でやってただけ」は通用しないわけです。これ怖すぎる。\n\n（２）商標的使用について\n\n続いてこちらも認められました。裁判所、容赦ない。\n\nオンラインフリーマーケットサービスであるメルカリにおける具体的な取引状況をも考慮すると，記号部分「#」は，商品等に係る情報の検索の便に供する目的で，当該記号に引き続く文字列等に関する情報の所在場所であることを示す記号として理解される。このため，YサイトにおけるY標章１の表示行為は，メルカリ利用者がメルカリに出品される商品等の中から「シャルマントサック」なる商品名ないしブランド名の商品等に係る情報を検索する便に供することにより，Yサイトへ当該利用者を誘導し，当該サイトに掲載された商品等の販売を促進する目的で行われるものといえる。このことは，メルカリにおけるハッシュタグの利用につき，「より広範囲なメルカリユーザーへ検索ヒットさせることができる」，「ハッシュタグ機能をメルカリ上で使うと使わないでは，商品閲覧数や売り上げに大きく差が出ます」などとされていること（いずれも甲７）からもうかがわれる。\n\nまた，YサイトにおけるY標章１の表示は，メルカリ利用者が検索等を通じてYサイトの閲覧に至った段階で，当該利用者に認識されるものである。そうすると，当該利用者にとって，Y標章１の表示は，それが表示されるYサイト中に「シャルマントサック」なる商品名ないしブランド名の商品等に関する情報が所在することを認識することとなる。これには，「Yサイトに掲載されている商品が「シャルマントサック」なる商品名又はブランド名のものである」との認識も当然に含まれ得る。\n他方，Yサイトにおいては，掲載商品がハンドメイド品であることが示されている。また，Y標章１が同じくハッシュタグによりタグ付けされた「ドットバッグ」等の文字列と並列的に上下に並べられ，かつ，一連のハッシュタグ付き表示の末尾に「好きの方にも…」などと付されて表示されている。これらの表示は，掲載商品がY自ら製造するものであること，「シャルマントサック」，「ドットバッグ」等のタグ付けされた文字列により示される商品そのものではなくとも，これに関心を持つ利用者に推奨される商品であることを示すものとも理解し得る。しかし，これらの表示は，それ自体としてY標章１の表示により生じ得る「Yサイトに掲載されている商品が「シャルマントサック」なる商品名又はブランド名である」との認識を失わせるに足りるものではなく，これと両立し得る。\nこれらの事情を踏まえると，YサイトにおけるY標章１の表示は，需要者にとって，出所識別標識及び自他商品識別標識としての機能を果たしているものと見られる。すなわち，Y標章１は，需要者が何人かの業務に係る商品又は役務であることを認識することができる態様による使用すなわち商標的使用がされているものと認められる。\n\n長い引用でしたが、要するに「見た人がそのブランドの商品だと思う可能性がある以上、商標として機能してる」ということ。「ハンドメイドって書いてあるから区別できる」という被告側の言い分は通りませんでした。\n\n結果、差止めが認められました。ハッシュタグ一つで。","takeaway":"で、結局なにが大事なの？\n\n・他人の商標をハッシュタグに使うのは危険。 「検索のため」は言い訳にならない\n・趣味でフリマ出品してても「業として」の対象になりうる。 1年以上継続してたらアウトの可能性\n・ハッシュタグは「タグ」ではなく「商標的表示」として見られることがある。 インターネット上の常識と法律の常識はズレてる\n・知らなかったでは済まない。 出品前に商標を確認する癖をつけよう\n\nメルカリで出品してる人、今すぐ自分のハッシュタグを見直した方がいいかもしれません。マジで。","one_liner":"「ハッシュタグは検索のため」は法廷では通じない。タグは看板と同じ。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"商標権者"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"メルカリ出品者"}],"lessons":["証拠がないと詰む"]},{"original_title":"東京地判令3.9.17（書店向けソフトウェア表示画面の著作権侵害成否）","url":"https://itlaw.hatenablog.com/entry/2022/01/24/231258","court":"東京地判","date":"令3.9.17","year":"令和3年（2021年）","topic":"書店向けソフトウェア表示画面の著作権侵害成否","categories":["著作権","プログラム・システム"],"fun_headline":"【衝撃】「画面が似てる！著作権侵害だ！」と訴えた結果がヤバすぎた件","hook":"突然ですが聞いていいですか。\n\nあなたが1年かけて作ったソフトウェアの画面を、元社員が転職先で丸パクリしたとしたら？\n\n「著作権侵害で訴えてやる！」ってなりますよね。僕でもなります。\n\nでも、裁判所の判断は「著作権侵害じゃない」でした。\n\nえ、なんで？ってなった人、一緒に読んでいきましょう。4200万円の戦いです。","summary":"・絡んでる金額: 4200万円\n・テーマ: 書店向けソフトウェア表示画面の著作権侵害成否\n・著作権がらみの争い","what_happened":"さて、登場人物を整理します。\n\n権利者は書店向けの業務管理システムを提供している会社です。売上分析、在庫管理、発注・仕入れ・返品管理など、書店の仕事をまるっとこなすASPシステムを持ってます。\n\n相手方も同じく書店向けの業務システムを提供しています。そしてここが重要。相手方のトップは権利者の元取締役なんです。退任後に相手方を立ち上げた。\n\nここで僕の話をさせてほしいんですけど、「辞めた会社と同業で起業」ってドラマみたいですよね。実際のビジネスの世界ではよくある話らしいですけど、残された側からしたらたまったもんじゃないですよね。話を戻します。\n\n権利者は相手方のシステムの画面を見て「これ、うちの画面を複製・翻案したものだ！」として差止めと約4200万円の損害賠償を請求しました。\n\n【ちょっと解説】不正競争防止法（ふせいきょうそうぼうしほう）── 営業秘密の持ち出し、商品の模倣など、ズルい競争方法を規制する法律。略して「不競法」。\n\nあ、ちなみに全然関係ないけど「ASP」って今あまり聞かなくなりましたよね。SaaSって言い方が主流になった感じ。で、この事件の話に戻りますね。\n\nつまり「元取締役が辞めてから似たシステム作った。パクリだ。4200万円払え」という戦いです。画面の見た目が問題になった、割と珍しい事件です。","issue":"要するに何が問題だったの？\n\n争点は二つです。ここテストに出ます。\n\n（１）表示画面の複製又は翻案該当性\n\n相手方の画面は権利者の画面を「複製」または「翻案」したものか。要するに、パクったと言えるのか。\n\n（２）編集著作物としての著作権侵害の成否\n\n仮に個々の画面は著作物じゃなくても、複数の画面を組み合わせた構成として著作権は保護されるのか。\n\nどっちも「著作権が成立するかどうか」という話です。似てても著作権がなければ侵害にならない。これが著作権の難しいところです。","ruling":"さあ、裁判所の答えです。\n\nこの事件、実は判決文に裁判所の具体的な判断の引用が残っていませんでした。ただ、元の解説から判断の方向性はわかります。\n\n裁判所が判断する「著作物かどうか」のポイントは「創作性があるか」です。\n\nここ大事なとこなんで簡単に言うと、書店向け業務システムの画面って「こう表示するしかない」という機能的な制約が強い。在庫数を表示するなら数字を出すしかない。発注画面なら商品名・数量・金額の入力欄が必要。\n\n「表現の選択の幅」がほぼないものは著作物として保護されない。これが著作権法の考え方です。\n\nラーメン屋で言ったら「醤油ラーメン・豚骨ラーメン・味噌ラーメンのメニューがある」という事実自体には著作権はない、みたいな話です。並べ方がほぼ一択なら独自性がないってこと。\n\n裁判所、冷静すぎる。でも論理は通ってるんですよね。","takeaway":"で、結局なにが大事なの？\n\n・「似てる」と「著作権侵害」は別の話。 創作性がないと保護されない\n・機能的・必然的なUI設計は著作権で守られにくい。 「こう作るしかない」画面は要注意\n・元社員の競合起業を防ぎたいなら秘密保持契約と競業避止義務を明文化しておこう。 著作権だけでは限界がある\n・訴える前に「これは本当に著作物か」を弁護士に確認する。 負けると費用だけかかる\n\n権利者の気持ち、わかる。めっちゃわかる。似てるのに負けるの、つらい。","one_liner":"「似てる」の感情と「著作権侵害」の法律は、意外と遠い。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"ソフト会社"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"競合ソフト会社"}],"lessons":["著作権は万能じゃない","秘密は管理してナンボ","辞め方を間違えた"]},{"original_title":"東京地判令3.8.3（サービス利用契約の成否）","url":"https://itlaw.hatenablog.com/entry/2024/07/17/202901","court":"東京地判","date":"令3.8.3","year":"令和3年（2021年）","topic":"サービス利用契約の成否","categories":["契約・報酬"],"fun_headline":"「正式に発注します」メール一通が4.4億円の争いになった件","hook":"「正式に発注させていただきたく存じます。」\n\nこのメール一行、送ったことありますか？受け取ったことは？\n\nこれって契約成立なの？ならないの？3600万円の初期費用をめぐって裁判になった事件があります。最終的に請求額は4.4億円まで膨らみました。\n\nこわい話なので、一緒に読んでいきましょう。","summary":"・絡んでる金額: 3600万円\n・テーマ: サービス利用契約の成否\n・契約とお金の話","what_happened":"話を整理しましょう。\n\n発注側は「クラウドファイリングサービス」を提供する会社。開発側は発注側のサービスを次期基幹系システムに導入しようとしていた会社です。\n\n発注側は開発側に対し、初期費用約3600万円・月額費用約290万円の見積書を提示。開発側は2015年8月26日の経営会議で「このサービスの利用方針を了承」する旨を発注側に伝えました。\n\nちなみに全然関係ないけど「利用方針を了承」って言葉、めちゃくちゃ曖昧ですよね。「了承」って「わかった」なのか「やる」なのかどっちなんだ。日本語の怖さがここにある。で、話を続けます。\n\nさらに別プロジェクトでも話が進んでいて、開発側の担当者が発注側の担当者に「正式に発注させていただきたく存じます。」というメールを送信しました。ただし続けて「見積の内容に注文がある」と条件をつけており、発注側はそれをもとにAさらに見積書を出し直しています。\n\nここで僕の話をさせてほしいんですけど、メールで「正式に発注します！」って言っておいて実は条件の交渉中、みたいなこと日常的にありますよね。「飲み行こう！」と言いながら日程を全然決めない人みたいな。完全に別の話ですね。話を戻します。\n\nで、ここからがヤバいんですけど。\n\n2015年12月14日、開発側はいきなり「このサービスの採用を見送る」と通知。作業の一部として750万円は払うが、サービス提供は2016年3月31日で終わり、という内容でした。\n\n発注側は激怒。「契約は成立していた。解約は債務不履行だ」として約4.4億円の損害賠償を請求します。\n\n【ちょっと解説】契約締結上の過失── 契約の交渉段階でのやらかし。「やるやる」と言って期待させておいて突然「やっぱやめた」みたいなケース。法律上は「信義則違反」として責任を問えることがある。\n","issue":"要するに何が問題だったの？\n\n「この契約、成立してたの？してないの？」\n\nここが全てです。ここテストに出ます。\n\nもし契約が成立していれば「解除は債務不履行」で発注側の勝ち。成立していなければ「単なる交渉決裂」で4.4億円は払わなくていい。\n\n「発注します」メールと「利用方針の了承」が法的に契約になるのか。裁判所の答えを聞きましょう。","ruling":"で、裁判所はどう判断したか。\n\nこの事件、元の記事では裁判所の判断の詳細な引用が省略されていましたが、判断の骨格はこうです。\n\n「正式に発注させていただきたく存じます」というメールのあとに見積を出し直している、つまり内容についてまだ合意に至っていない段階でした。\n\n「経営会議での了承」も最終的な合意ではなく、導入の検討を進めるという内部決定に過ぎないと見られる可能性がある。\n\n居酒屋で考えると、「今日飲みに行こうか」と言っておいて「じゃあどのお店にする？」と聞いてる段階では「飲み会の契約」は成立していない、みたいな話です。\n\n契約には「申込み」と「承諾」が必要で、その内容が明確に合致しないといけない。「雰囲気はもうやる感じだった」は法廷では通じないわけです。\n\n裁判所、めちゃくちゃシビア。でも正しい。\n\nただし「契約締結上の過失」については別途検討される余地があります。「やるやる詐欺」で相手に損害を与えた場合、信義則上の責任が発生することもある。完全に免責にはならない可能性もあります。","takeaway":"で、結局なにが大事なの？\n\n・「発注します」メール一本では契約は成立しない。 金額・期間・内容が揃って初めて契約\n・「了承」「検討します」「進める方向で」は全部交渉中。 公式の発注書・契約書が来るまで信じるな\n・交渉段階のやりとりはすべて記録する。 「言った言わない」は書面でしか証明できない\n・「やるやる」と言って急にやめるのも責任が発生しうる。 相手を期待させすぎると「過失」を問われることも\n\n契約が成立したかどうかの判断、難しいんですよ本当に。でもそれが「書面を残せ」という教訓につながります。","one_liner":"「発注します」と「発注した」の間には、宇宙の広さがある。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ITベンダ"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ユーザ企業"}],"lessons":["契約書読んどけば…"]},{"original_title":"東京地判令3.6.18（著作権侵害と表明保証違反）","url":"https://itlaw.hatenablog.com/entry/2021/12/12/112821","court":"東京地判","date":"令3.6.18","year":"令和3年（2021年）","topic":"著作権侵害と表明保証違反","categories":["著作権"],"fun_headline":"【3億円M&A事件】「著作権の問題はありません」と言いながら隠してた話、怖すぎる","hook":"みなさん「表明保証」って知ってますか。\n\n知らなくても大丈夫です。今から一緒に知りましょう。\n\n簡単に言うと「この会社を買うとき、売り手が『うちの会社はこういう状態です』と宣言すること」です。\n\nで、その宣言が嘘だったらどうなるか。3億2000万円でM&Aをした結果、著作権侵害が発覚して2億円の和解金を払う羽目になったという話が今日のやつです。こわすぎる。","summary":"・絡んでる金額: 2000万円\n・テーマ: 著作権侵害と表明保証違反\n・著作権がらみの争い","what_happened":"さて、登場人物を整理します。\n\n相手方はａ株式会社の代表取締役で株式100%の保有者。接骨院用のレセプト発行システムとか鍼灸マッサージ管理システムを売っている会社です。\n\n権利者と相手方は平成30年3月29日、権利者が相手方からａ社の全株式を3億2000万円で買う株式譲渡契約を結びました。いわゆるM&Aです。\n\nこの契約に「表明保証条項」が含まれていて、中にこういう記述がありました。\n\nａ社が制作し販売する接骨院用レセプト発行システム「○○」及び鍼灸マッサージ管理システム「△△」について，ａ社が著作権を含む一切の権利を保有し，制限事項はない\n\nつまり「うちのシステムに著作権上の問題は一切ない」と宣言したわけです。\n\nさらにこの契約、「表明保証に違反したら相手方が補償する」という条項もありました。\n\nで、ここからがヤバいんですけど。\n\nM&A実行の直後、発覚しました。ａ社のシステム、ＰＣ1台につき1ライセンス必要なランタイム（実行プログラム）について、ＣＤ-ＲＯＭを複製して必要数分のライセンスを買わずに販売していたことが。\n\nこれ、ラーメン屋で言ったら「うちの店のラーメンは全部自家製です」と言いながら、実はパックのスープを買って使ってた、みたいな話です。しかも3億円で買った後に発覚する。\n\nちなみに全然関係ないけど「ランタイム」って言葉、IT系以外の人には「？」ってなりますよね。プログラムを動かすために必要な実行環境のことです。それのライセンスを複製してたということ。で、話を戻します。\n\nＦ社（著作権者）の算定では損害賠償額は約5.9億円。ただし交渉の結果、ａ社がＦに2億円を払って和解しました。\n\nそこで権利者は「お前が嘘をついたせいで2億円の損害が出た」として相手方に補償を求めました。","issue":"で、結局何が問題になったかというと。\n\n表明保証条項の違反による補償義務はあるのか。\n\n相手方の反論は二つ。\n\n一つ目「著作権の問題はM&Aの判断に影響しない些細なことだった」。\n\n二つ目「権利者はデューデリジェンス（買収前の調査）をしていたんだから、自分で調べられたはず。故意または過失がある」。\n\n【ちょっと解説】デューデリジェンス── M&Aの前に「この会社、本当に大丈夫？」と財務・法務・ビジネスを調査すること。略して「DD」。\n\n相手方、なかなか強気の反論です。でもここで裁判所がとんでもない事実を発掘します。","ruling":"で、裁判所はどう判断したか。\n\n裁判所はDDの経緯についてこう認定しました。\n\n権利者及び（略）Ｂらは，平成２９年７月１６日から約１か月間，ａ社に対して法務，会計及び営業のデュー・ディリジェンスを実施した。\nこの際，権利者及びＢらは，相手方からａ社の従業員に接触することは控えてほしいとの意向を示されたことから，ａ社の従業員に接触しなかった。\n\nはい。相手方は権利者にDD中、従業員への接触を禁止していたんです。なぜかというと……\n\n相手方は，本件著作権侵害について，権利者に知られないようにするため，Ｃを含めたａ社の従業員らに対し，「この話は誰にもするな。」，「他社に漏れたら大変なことになる。」，「言ったらクビだ。」などと告げていた。\n\nえっ。マジで？\n\n従業員に「口止め」してたんです。「言ったらクビだ」というパワーワード付きで。\n\nこれで
