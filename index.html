「権利者はDDで自分で調べられた」という反論は完全に詰んでいます。調べようとしても調べられないように工作してたんだから。\n\nさらに、この契約10条の「プロ・サンドバッギング条項」（権利者が知っていても補償義務は消えないという条項）は一度相手方から削除を求められたが、交渉の結果残されたことも認定。\n\nこれを踏まえて、裁判所はこう言いました。\n\n本件著作権侵害はａ社の商材によるＦの著作権の侵害があったことを内容とするものであり，この契約の代金が３億２０００万円であるところ，本件著作権侵害についてａ社がＦに対して和解金２億円を支払ったことに照らせば，本件著作権侵害がこの契約を締結するか否かの決定に影響を及ぼし得る事項について重大な相違や誤りではなかったということはできず，上記の相手方の主張は前提を欠くものであって採用できない。\n\n相手方は，この契約を締結する前である平成２９年２月頃までには，Ｂに対し，本件著作権侵害を伝えていた旨を主張し，相手方作成の陳述書には同旨の記載がある。\nしかし，上記記載は，本件著作権侵害を知らなかった旨のＢの証言等及び相手方がａ社の従業員に対して本件著作権侵害について口止めをしていた旨のＣの証言等と整合しないこと，ａ社の株式譲渡の代金については，相手方は協議開始の当初から３億円以上を希望し，この契約の代金も３億２０００万円とされたものであるところ，本件著作権侵害について，ａ社と富士通との間の交渉において，本件会社のＦに対する本件著作権侵害に係る損害賠償債務の額は（略）富士通によれば約５億９０００万円と算定され，交渉の結果，ａ社がＦに対して和解金２億円を支払うこととなったことからすると，仮にＢが本件著作権侵害を伝えられていたとすれば，権利者が代金の減額等の交渉をせずにこの契約を締結するとは考え難いところ，そのような交渉がされた形跡がないことに照らすと，上記記載を採用することは困難であって，上記の相手方の主張は採用できない。\n\nつまり「3億2000万円で買った会社に5.9億の著作権侵害リスクがあったなら、それは判断に影響する話でしょ」という至極まっとうな判断です。\n\n裁判所、証拠を全部洗い出して相手方の嘘をすべて潰していった。怖すぎる。好き。\n\n結果、表明保証違反による補償義務を認め、和解金2億円の全額を支払うよう命じました。","takeaway":"で、結局なにが大事なの？\n\n・表明保証は「嘘をついたら補償します」という約束。 軽く書かないこと、軽く読まないこと\n・口止めして隠したことは証拠が残る。 「言ったらクビだ」系の発言は絶対にやめろ\n・M&Aのデューデリジェンスは従業員へのアクセスを確保して行う。 接触禁止を要求してくる売り手には注意\n・プロ・サンドバッギング条項は意味がある。 「知ってた」を証明されても補償義務が消えない仕掛けを入れておこう\n\nこの事件、相手方が最初から正直に話していれば買収価格が下がるだけで済んだかもしれない。隠したせいで2億円払うことになった。","one_liner":"隠蔽は問題を解決しない。問題に2億円の利子をつけるだけ。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"株式取得者"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"株式売主"}],"lessons":["証拠がないと詰む","損害、証明できる？"]},{"original_title":"知財高判令3.5.17（職務著作の成否と著作権法47条の3の適否）","url":"https://itlaw.hatenablog.com/entry/2022/09/03/200751","court":"知財高判","date":"令3.5.17","year":"令和3年（2021年）","topic":"職務著作の成否と著作権法47条の3の適否","categories":["著作権"],"fun_headline":"【悲報】プログラム途中で投げたSEさん、著作権バトルに発展してしまう","hook":"仕事の途中で「もう無理！やーめた！」ってなること、あるじゃないですか。\n\nでも「やーめた」の後に、相手がそのプログラムを勝手に改造して使い続けたら？\n\nそれ、裁判になるんですよ。今日はそういう話です。","summary":"・絡んでる金額: 105万円\n・テーマ: 職務著作の成否と著作権法47条の3の適否\n・著作権がらみの争い","what_happened":"整理しますね。\n\n権利者、もともとSEをやってた人です。\n\nある日、相手方という学校法人（大学や専門学校を運営してるとこ）から「情報処理科の非常勤講師やってください」と頼まれます。\n\nさらに「教務管理システムも作ってください」とも頼まれました。\n\n要するに、学生の名前・出欠・成績を管理するシステムを開発する仕事ですね。\n\n権利者、がんばってシステムを作って、開発費として105万円もらいます（ただし、権利者は「全額もらってない」と言ってる）。\n\nここで僕の話をさせてほしいんですけど。昔バイト先でちゃんと給料が振り込まれてなくて、コンビニのATM前で固まったことがあります。あれは怖かった。話を戻します。\n\nで、権利者、途中で「一身上の都合」により開発業務をやめると言って、作業を中断しました。\n\n相手方はその時点で受け取っていたプログラムを、自分たちで改良しながら使い続けたわけです。\n\nいやいやいや。ちょっと待って。\n\n権利者は「それ勝手に改造したら著作権侵害だろ」と言って、相手方に対して500万円を請求しました。\n\n【ちょっと解説】公衆送信権── 著作権の一種。ざっくり言うと「インターネットとかで人に送信する権利」のこと。無断でネットにアップしたら侵害になる。","issue":"要するに、何が問題だったの？\n\n相手方が勝手にプログラムを改造したこと、これが著作権侵害にあたるかどうかです。\n\n相手方側の言い訳は「著作権法の範囲内の改変だよ」というもの。\n\nここテストに出ます。\n\n裁判所が見たのは「相手方が加えた改変って、本当に必要な範囲だったの？」という点でした。\n\nで、裁判所はこう言いました。\n\n相手方プログラム（注：権利者が相手方に交付したプログラムは）本来，Ｂ（注：相手方の担当者）自身がこのシステムを理解するために利用されることが予定されていたものと認められるところ，Ｂが相手方プログラムに加えた前記アの変更は，その内容からして，上記の目的に沿ってＢ自身がこれを使用することができる状態にしたにとどまらず，本来予定されていない新たな機能の追加を行うものであったというべきであるから，著作権法に定める「必要と認められる限度」の翻案であるとも，著作権法，４号に定める「必要な改変」ないし「やむを得ないと認められる改変」とも認められない。\n\nつまりこういうことです。\n\n「理解するためだけじゃなくて、新しい機能まで追加してるじゃないですか。それは『必要な改変』じゃないですよ」ということ。\n\n裁判所、めっちゃ冷静。好き。\n\nちなみに全然関係ないけど、「必要な限度」って言葉、会社でも家庭でも使える便利な言葉ですよね。「必要な限度を超えてる」って言われたことある人、そっとコメントください。で、話を戻します。\n\nということで、相手方の著作権侵害が認定されました。権利者に生じた損害は20万円と認定され、原審は相手方に20万円の支払いを命じました。\n\nその後、権利者も相手方も控訴しましたが、知財高裁はどちらも棄却。原審の結論がそのまま維持されました。","ruling":"で、裁判所の最終判断はこうです。\n\n裁判所が引用文の出どころを説明するのが面白かったので補足します。以下はすべて原審（東京地判令2.11.16）の判断で、控訴審でもそのまま維持されたやつです。\n\n【ちょっと解説】翻案権── 元の作品を改変・アレンジする権利のこと。勝手に「改良版」を作ったらアウト。\n\n相手方による改変は「必要な限度を超えた新機能追加」であり、著作権侵害。損害は20万円。\n\n控訴審でも同じ結論。権利者も相手方も、控訴して損した感じになりました。\n\nはい、裁判所はこう言いました。以上。","takeaway":"で、結局なにが大事なの？\n\n・プログラムの著作権は「誰が作ったか」で変わる。社員が会社で作ったなら会社の著作物（職務著作）。外部委託なら委託先の著作物。ここめちゃ重要\n・改造する前に「これ、権利どこにあるの？」を確認しよう。改造したあとに訴えられても遅い\n・中途半端に開発を引き受けて途中でやめると、残ったプログラムの扱いでトラブルになる\n・「使っていいよ」の範囲は口頭じゃなく書面で明確にしておこう。「改良もしていいの？」まで確認するくらいがちょうどいい\n\nそして一番大切なこと。人のプログラムを勝手にいじったら、裁判所がちゃんと見てますよ。","one_liner":"他人のコードをいじる前に、「これ誰の著作物？」を確認しろ。以上。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"フリーランスSE"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"学校法人"}],"lessons":["著作権は万能じゃない"]},{"original_title":"東京高判令3.4.21（野村vsIBM控訴審判決）","url":"https://itlaw.hatenablog.com/entry/2021/06/20/020351","court":"東京高判","date":"令3.4.21","year":"令和3年（2021年）","topic":"野村vsIBM控訴審判決","categories":["その他"],"fun_headline":"全ITエンジニアが震えた「野村 vs IBM」36億円バトル、まさかの犯人はFさんだった","hook":"ちょっと待って、これ聞いたら驚くから。\n\n「システム開発が失敗して36億円の損害賠償請求」って話があるんですよ。\n\nそれだけで十分ヤバいんですけど、裁判所が出した結論がさらにヤバい。\n\n「主な原因はIBMじゃなくて発注側（野村）にあります」\n\n…え？ 請求した側が悪いの？ 今日はそういう話です。","summary":"・絡んでる金額: ３６億円\n・テーマ: 野村vsIBM控訴審判決","what_happened":"で、何が起きたかというと。\n\n野村HDがIBMに頼んで、証券業務のシステムを作ろうとしました。2022年1月稼働目標で、何年もかけて進めていたプロジェクトです。\n\nでも、これが難航しました。\n\n最終的に「稼働開始のリスクが高すぎる」として開発を中断、野村HDが断念しました。\n\n【ちょっと解説】債務不履行── 要するに「約束破り」のこと。「ちゃんとシステムを作るって言ったじゃないか」という話。\n\n野村HDはIBMに対して「約束を守らなかった、不法行為もあった」として36億円を請求。\n\nIBMは逆に「野村から報酬の未払いがある」として5億6000万円の反訴。\n\nここで一度、深呼吸しましょう。\n\nここで僕の話をさせてほしいんですけど。プロジェクトが炎上するとき、だいたい「誰のせい？」問題が出てきますよね。僕が昔アルバイトでシフトを組む係をやっていたとき、シフトが壊滅的に崩壊したことがあって、なぜか僕のせいになりました。ちょっと違う話でしたね。話を戻します。\n\n判決文には45,000字の詳細な事実認定が含まれていて、読みやすく書かれているとのこと。45,000字ですよ。卒論より長い。\n\n裁判所は一人の人物にフォーカスしています。野村証券の投資顧問部に所属する「Ｆさん」という人物です。\n\n 野村証券においては，●●業務は投資顧問部の担当であった。投資顧問部内においては，●●のフィー計算徴収業務につき，その業務知識やルール（詳細複雑なフィー徴収の要件や計算手法を含む。）が特定の１名の社員（Ｆ）に属人的に独占されていた。野村証券の他の社員全員にとっては，フィー徴収の業務内容がブラックボックス化していて，Ｆに聞かなければ把握できないという実態にあった。ＩＢＭの社員は，この開発業務が本格化する前（平成２３年４月に概要設計フェーズに入る前）は，このような実態を知らなかった。この開発業務が本格化した後においては，ＩＢＭの社員がＦ以外の野村証券の社員にフィーの計算徴収業務に関する質問をしても，回答が得られないのが常であった。\n\nつまり、業務のルールや計算方法を一人だけが知っていて、他の誰も把握できない状態だったということ。\n\nＦさんへのヒアリング機会に、こんなことが起きていました。\n\n （PoCの段階において）\n\n投資顧問部のＦは，同月１４日から１７日までに行われた検証実行セッションの半分以上に出席したが，フィー計算徴収業務の詳細複雑さが原因で，カスタマイズの規模の著増，ひいては開発期間の長期化をもたらし，平成２５年１月の（略）稼働開始を困難にする大きなリスクがあることを，指摘しなかった\n\nわかります？ 知ってたのに言わなかったんです。\n\n （カスタマイズ範囲を削減するという議論の場において）\n\n同席していたＦは，いまだフィー徴収業務の詳細複雑な内容の全体像をヒアリングの機会にＩＢＭに伝えていなかったため，ＩＴ戦略部長から指摘のあった大きな工数追加が今後も生じる可能性を認識していた。しかし，Ｆは，ＩＴ戦略部長の前記発言（注：さらなる工数増加は発生しないか，という問いかけ）があったにもかかわらず，前記発言に対しては沈黙を貫いた。\n\nヤバい。沈黙を貫いた。\n\nさらにＦさんはこんなことも言っていました。\n\n Ｆが新たな業務要件（略）を追加した上，「今後もＩＢＭ側に伝えきれていない要件が見つかる可能性がある」と発言した。なお，Ｆは，その後も，他罰的かつ攻撃的な（野村ＨＤらの証拠説明書の表現によれば「極めて辛辣な」）苦情を述べることを繰り返した\n\n意味がわからない。「まだ言ってないことがある」って自分で言っといて、IBMに文句を言い続けるの？\n\nあ、今気づいたんですけど、このＦさんって社内で相当なキーパーソンだったはずなのに、プロジェクトに関してはものすごく非協力的だったということですよね。これって組織あるあるじゃないですか。「俺の仕事を変えられたくない」という守りに入った人間が一人いると、プロジェクト全体が崩壊する。怖すぎる。\n\n パッケージ開発に通じたＡ２３（注：IBMの担当）は，野村証券の現行業務をパッケージに合わせた業務に変更するために，投資顧問部担当者らの現行業務維持の牙城を突破しようと試みたが，投資顧問部のＦらの頑強な抵抗と妨害の前に，目的を達成することができなかった。\n\n「頑強な抵抗と妨害」という表現が出てきました。裁判所が使う言葉じゃないですよね、これ。","issue":"で、何が問題になったかというと──\n\nこのプロジェクトの失敗、結局「誰のせい？」が争点です。\n\n野村HD「IBMが完成させる義務を果たさなかった」\nIBM「いや、準委任契約だから完成させる義務はそもそもないし、野村側に問題があった」\n\n【ちょっと解説】準委任（じゅんいにん）── 「結果は約束しないけど、プロとしてちゃんとやります」という契約。美容院で「いい感じにしてください」と言うのに近い。SES契約はだいたいこれ。\n\n個別の契約ごとに裁判所が判断しています。\n\nテスト・移行に関する個別契約14について、裁判所はこう言いました。\n\n 本件個別契約１４は，ＳＴＡＲとの総合テスト及びデータ移行等の準備及び実施の支援を行う準委任契約（仕事の完成を目的とした請負契約ではない）であり，「２４０．６人月」の提供終了又はサービス期間の終了（平成２５年１月４日）のいずれか早い日にサービスの提供を終了するものとされている。そうすると，ＩＢＭは，総合テストを経てこのシステムをバグのない状態に仕上げ，データ移行を終えるなどして平成２５年１月４日にこのシステムをＳＴＡＲと同時に稼働開始する債務を本件個別契約１４に基づいて負うものではない。ＩＢＭは，受任者として，このシステムの平成２５年１月４日稼働開始を目標として誠実にサービスを提供すべき善管注意義務を負うにとどまる。したがって，ＩＢＭがこのシステムを完成させる義務を負うことを前提とする本件個別契約１４の履行不能の主張は，理由がない。\n\n【ちょっと解説】善管注意義務（ぜんかんちゅういぎむ）── 「その道のプロなら当然気をつけますよね」という義務。「なんとなく頑張りました」は通らない。\n\nつまり、「準委任契約なんだからシステムを完成させる義務はそもそもない」という判断。\n\nそして信頼関係の破壊についての判断がこれ。\n\n このシステムが前記の時点において改善を要する点を多数抱えていたことは前記認定のとおりであるが，双方にその原因があり，特に下流工程の基本設計フェーズに入った後も，さらには当初はテスト期間と想定されていた平成２４年に入ってからもＣＲ（変更要求）を繰り返して，工数の著しい増大とテメノス社の作業の手戻りと遅れを繰り返し誘発し，テメノス社からプログラム製作作業の十分な時間的余裕を奪った野村証券側に，より大きな原因があることが，明らかである。そうすると，仮に百歩譲って前記の時点で履行不能であると評価することが可能であるとしても，その帰責事由の多くは野村ＨＤらの側に多々あるのであって，ＩＢＭの帰責事由と評価することは困難であるというほかはない。\n\n （略）\n\n野村ＨＤらが，一方的にＩＢＭを嫌忌していたにとどまる。しかも，同日の時点においてビジネスがうまくいかないことの主たる原因が野村ＨＤらの側に多々あることは，前記認定事実から明らかである。ＳＴＡＲ及びこのシステム以外のＳＴＡＲのサブシステムがビジネス上の目標を達成して予定通り平成２５年１月に稼働開始したことからすれば，ビジネス上の目標不達成となった唯一のシステムであるこのシステム（ＳＭＡＦＷ）の担当者らが，野村グループの中で非難の目にさらされていたことは容易に推認することができ，社内説明用のスケープゴートとして，ＩＢＭを必要以上に悪者扱いして，ビジネスパートナーとして信頼するに値しないと社内説明していた可能性は，高いものとみられる。いずれにせよ，信頼関係の点は，野村ＨＤらが主張する履行不能を根拠付けるものとはいえない。\n\n「スケープゴートとしてIBMを悪者にしていた可能性が高い」って裁判所が言ってる。これは強い。","ruling":"いよいよ判決です。\n\nIBMに対する野村側の請求は全部棄却されました。\n\n逆にIBMの反訴（未払い報酬の請求）は一部認容。\n\nついでにもう一つ。プロジェクト中、IBMの担当者がわりと謝ったり問題を認めたりする発言・文書を残していたんですが、裁判所の判断はこうです。\n\n この開発業務の節目において，ＩＢＭの担当者から，その時々の問題点の発生原因がＩＢＭ側にあるかの発言や文書記載がされることがある（略）。ＩＢＭは報酬を受領する側，野村ＨＤは報酬を支払う側であるから，ＩＢＭがプロジェクトの続行を希望して，低姿勢な態度に終始して，自己の問題点は指摘するが，野村ＨＤ側に問題があってもこれをあまり指摘しない言動に出るのは，自然なことである。このようなＩＢＭの言動を，それのみで直ちにＩＢＭの帰責事由の根拠と評価することは，不適当である。\n\n「ベンダが謙虚な態度を取るのは自然なことだから、謝った発言だけで帰責事由の証拠にはならない」という判断。\n\n裁判所、ベンダの気持ちをわかりすぎている。\n\nはい、裁判所はこう言いました。以上。","takeaway":"で、結局なにが大事なの？\n\n・契約が「請負」か「準委任」かを明確にしよう。請負は完成の責任あり、準委任はプロとして誠実にやればいい。この違いは超重要\n・要件は全部言え。「まだ伝えていない要件がある」は地雷。プロジェクトが爆発する\n・発注側も責任を負う。「俺が金払ってるんだから失敗したらベンダのせい」は通らない\n・ベンダが謙虚に謝った発言は、裁判で不利な証拠にはなりにくい。でも油断はするな\n\n一番の教訓は「Ｆさんみたいな人物を放置しない」です。業務知識を一人に独占させると、プロジェクトが死ぬ。","one_liner":"発注側が「俺は被害者だ」と思い込んだとき、裁判所は一番冷静になる。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"野村HD"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"IBM"}],"lessons":["証拠がないと詰む","「完成」って何？","金の話は最初にしろ"]},{"original_title":"東京地判令3.3.24（１ライセンスでの利用可能範囲と違約金合意）","url":"https://itlaw.hatenablog.com/entry/2021/08/08/221130","court":"東京地判","date":"令3.3.24","year":"令和3年（2021年）","topic":"１ライセンスでの利用可能範囲と違約金合意","categories":["その他"],"fun_headline":"【衝撃】「1ライセンスでこっそり複数使ってた」結果、違約金7500万円になった件","hook":"みなさん、ソフトウェアのライセンス、ちゃんと守ってます？\n\n「1台のPCに1ライセンス」って書いてあるのに、バックアップを切り替えてうまいこと複数で使ってる……なんてことをすると、どうなるか知ってます？\n\n今日はそれをやってしまった人の話をします。\n\n違約金、7500万円でした。","summary":"・絡んでる金額: 42万円\n・テーマ: １ライセンスでの利用可能範囲と違約金合意","what_happened":"で、何が起きたかというと。\n\n原告側はメタボ健診に関するデータ作成プログラムの著作権者です。\n\n被告側はそのプログラムを「1ライセンス分」だけ購入して使っていました。\n\nところが被告側、気づいてしまったんですよ。\n\n「バックアップデータを切り替えたら、1台のPCで複数の医師会の作業ができるじゃん？」と。\n\n居酒屋で言ったら、「1杯頼んだら何杯でも注いでいい裏技を発見した」みたいな話ですよ。それはアウトですよ。\n\n被告側はその方法で、本来ライセンス契約してた1つの医師会だけでなく、複数の医師会の業務を処理していました。長い間。こっそりと。\n\nここで僕の話をさせてほしいんですけど。昔、友達と2人でサブスクのアカウントを「家族プラン」と称して共有してたことがあります。厳密にはグレーだったんですが、それとはレベルが違う話でした。話を戻します。\n\n原告側がプログラムのアップデート（平成30年）の移行作業中に、この事実に気づきました。\n\n原告側、書面で被告側に説明を求めます。\n\n被告側の返答がこれ。「誠実に調査したところ、本日までに不正利用は認められませんでした。」\n\nいや、認められなかったってどういうこと？ 自分でやってたんでしょ？\n\nその後、被告側は「アンインストールしました」という報告書を提出。\n\nでも原告側が証拠保全を申し立てたところ、被告側のPC11台すべてにプログラムがインストールされたままでした。\n\nここからが本番です。覚悟してください。\n\n平成30年の新契約では「ライセンス違反で使った場合、1医師会あたり月額42万円の違約金」という条項が入っていました。\n\n【ちょっと解説】債務不履行── 要するに「約束破り」のこと。「ライセンスの範囲内で使うって言ったじゃないか」という話。","issue":"両者の言い分が食い違ったポイントはここ。\n\n「違約金の7500万円、高すぎて無効でしょ？」という被告側の主張です。\n\n違約金って、あまりに高額すぎると「公序良俗に反する」として無効になることがあります。\n\n被告側はそれを狙った。\n\nでも裁判所はこう言いました。\n\n当該合意がされた経緯を検討すると，（略）被告側は，本件平成２０年契約に違反して，ライセンス数を上回る多数の医師会の業務において継続的にこのプログラムを使用しており，（略）平成３０年３月の本件新プログラムへの移行作業の際に，上記の被告側の使用状況が原告に発覚したことで，本件平成３０年契約においては，府中市医師会に加えて，契約の対象とする医師会が追加され，それとともに，本件違約金合意が締結されたものである。そうすると，本件違約金合意は被告側による過去の不正使用を踏まえて，それを抑止するために設けられたものと解されるから，前記のとおり，被告側による継続的な不正使用が長期間発覚しなかったことも考慮すれば，本件違約金合意を設ける必要性は高かったといえる。\n\n また，本件違約金合意は，いずれも事業者である原告側と被告側とが，レンタル契約書において，被告側がこのプログラムを使用できる医師会名を明示した上で，それ以外の医師会の利用については違約金支払義務が発生する旨を記載したものであって（略），合意内容とその違反の範囲は明確である。さらに，本件平成３０年契約においては，（略）このプログラムの使用に係る医師会を１か月単位で増減させることが可能であったから，被告側において，本件違約金合意に反しないようにこのプログラムを使用することに特段の障害はなかったといえる。\n\n このような事情からすれば，本件違約金合意における違約金額が通常のライセンス料の１０倍という額であったことを考慮しても，本件違約金合意が公序良俗に反するとはいえず，被告側の上記主張は理由がない。\n\nつまり「バレてから結んだ違約金合意だから、その高額さには必要性があった」ということです。\n\n裁判所、めっちゃ筋が通ってる。怖い。\n\nちなみに全然関係ないけど、「通常の10倍の違約金が有効」って、感覚的に納得できますよね。一回バレた後に「もうやりません」って言いながら同じことやってたら、そりゃ厳しい条件で結ばれますよ。で、話を戻します。\n\nさらに、インストールしたままにしていたことで著作権法のみなし侵害も認められ、差し止めと廃棄請求まで認められました。","ruling":"いよいよ判決です。\n\n違約金7500万円分の請求（対象期間7月〜11月の5か月分）は有効と認められ、著作権侵害による差し止め・廃棄も認容。\n\n被告側の「高すぎて無効」という主張は全滅しました。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n・ライセンスの範囲は契約書に書いてある通りに守ろう。「うまくやれば複数使える」はアウト\n・バレたときに嘘をつくと、あとで証拠保全という手が使われる。嘘は倍返しで跳ね返ってくる\n・高額な違約金条項、「無効では？」と思っても、バレた後に結ばされた契約なら有効になりやすい\n・「インストールしたまま」というのも問題になる。アンインストールを証明できない状態は危険\n\nライセンスは読め。違反したら素直に謝れ。嘘はつくな。以上。","one_liner":"「バレなきゃいい」は「バレたら終わり」の言い換えにすぎない。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"ソフト著作権者"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"医師会関連法人"}],"lessons":["契約書読んどけば…","証拠がないと詰む"]},{"original_title":"東京地判令3.3.17（履行の提供が認められて履行遅滞の責任が否定された事例）","url":"https://itlaw.hatenablog.com/entry/2023/07/22/155128","court":"東京地判","date":"令3.3.17","year":"令和3年（2021年）","topic":"履行の提供が認められて履行遅滞の責任が否定された事例","categories":["責任・損害"],"fun_headline":"「納期に遅れたのはお前のせい」→「いや、確認してくれなかったのはそっちでしょ」→裁判へ","hook":"「誰のせいなの、これ」\n\nシステム開発でトラブルになったとき、だいたいこうなりますよね。\n\n今日の案件、その「誰のせい」問題が約1億6000万円の請求に発展した話です。\n\nでも結末がちょっと面白いというか、開発会社側が「いや、むしろこっちはちゃんとやってたよ？」と逆転するんですよ。","summary":"・絡んでる金額: 4000円\n・テーマ: 履行の提供が認められて履行遅滞の責任が否定された事例\n・責任の所在を巡る争い","what_happened":"で、何が起きたかというと。\n\n有名寝具メーカーの代理店をやっているＫさんと、その再委託先のＦさんがいます。\n\n2人は「代理店の受発注業務に使うシステムを作ってほしい」と被告（開発会社）に頼みました。\n\n契約内容はこう。\n\n- 業務名：在庫管理システム開発\n- 納期：平成26年3月31日\n- 委託料：785万4000円\n\nわかります？ この怖さ、伝わってます？\n\nここで問題が起きました。\n\n依頼した側（原告ら）が、既存システムの設計書を持っていなかったんです。\n\n設計書がないと、開発会社（被告）は何を作ればいいのか分かりません。\n\n【ちょっと解説】債務不履行── 要するに「約束破り」のこと。「約束した通りのシステムを作らなかった」という主張。\n\nなので被告は、既存システムを実際に動かしてもらいながら、帳票を見ながら、手探りで開発を進めました。\n\n「設計書を確認してください」と被告が提示しても、「実際に動かしてみないとわからない」と言われて確認してもらえないことも多かった。\n\nここで僕の話をさせてほしいんですけど。「とりあえず作ってみてから判断する」みたいなお客さん、よくいますよね。僕がバイトでチラシ作ったとき「なんか違う」と言われて7回作り直しさせられたことがあります。方向性を最初に決めてくれ。話を戻します。\n\n途中でEDI部分の追加開発依頼も来ました（契約書なし）。\n\n納期は3度延期されて、最終的に平成26年8月31日。9月1日本番稼働予定。\n\nでも予定通りにはいきませんでした。\n\nちなみに全然関係ないけど、「本番稼働の前日に何かがある」という法則、IT業界あるあるすぎて怖い。で、話を戻します。\n\n9月30日、被告が「完成しました」としてプログラムをインストール、確認を求めました。\n\n原告らの反応：「帳票の確認をしないとわからない」として、プログラムを起動させなかった。\n\n被告は帳票を別途印刷して原告に郵送しました。\n\n原告らはそれでも「システムは完成していない」として、Ｋさんが約9600万円、Ｆさんが約6800万円を請求しました。","issue":"で、結局何が問題になったかというと。\n\n大きく2つ。\n\n1. 納期に遅れた責任は被告にあるの？（履行遅滞の問題）\n2. そもそもシステムは完成してるの？（完成の有無）\n\nここテストに出ます。\n\n","ruling":"で、裁判所はどう判断したか。\n\n裁判所は、履行遅滞（納期の遅延）と、システムの完成に分けて判断しました。\n\n納期遅延について：\n\n被告は「完成しました、確認してください」とプログラムをインストールして確認を求めました。\n\nこれが「履行の提供」として認められました。\n\n「受け取る側が確認を拒否したなら、それは開発会社の遅延ではない」という判断です。\n\n要するに「出したけど受け取ってもらえなかった」というのは、こっちのせいじゃないよ、ということ。\n\nシステムの完成について：\n\n開発会社は設計書もない状態でシステムを手探りで作り上げ、完成を主張しました。\n\nそして「確認してくれなかったのはそっちでしょ」と言えた。\n\nこれ、逆転の発想なんですよ。「納期を守れなかった」と責められる立場だったのに、「履行の提供はした」という事実で守備を固めた。\n\n裁判所、バッサリ。","takeaway":"で、結局なにが大事なの？\n\n・「完成を確認してください」と言ったときの記録を残そう。確認を拒否された事実も記録する\n・設計書がない状態で開発を始めるのは危険。「動かしながら確認」は争いの元\n・追加開発の依頼は必ず書面で。口頭だと「言った・言わない」になる\n・「納期を守れなかった」と攻められても、「提供はした・確認を拒否されたのはそっち」という反論が成立することがある\n\nシステム開発のトラブルは、証拠の積み上げが全て。","one_liner":"「誰のせい」を決めるのは裁判所。でも裁判所が判断するのは「証拠があるかどうか」だ。","parties":[{"role":"会社側","icon":"🏢","side":"plaintiff","desc":"寝具代理店"},{"role":"被請求側","icon":"⚖️","side":"defendant","desc":"ソフト開発会社"}],"lessons":["契約書読んどけば…","証拠がないと詰む","「完成」って何？"]},{"original_title":"東京地判令3.1.26（Googleマイビジネスアカウント不適切運用の責任）","url":"https://itlaw.hatenablog.com/entry/2021/11/28/205728","court":"東京地判","date":"令3.1.26","year":"令和3年（2021年）","topic":"Googleマイビジネスアカウント不適切運用の責任","categories":["利用規約・消費者","責任・損害"],"fun_headline":"Googleの規約を破ってアカウント停止→店が「閉業」扱いに→3ヶ月で200万円請求した話","hook":"アプリを入れるとき、利用規約を全部読んでる人ってこの世に何人いるんですかね。\n\n僕はゼロです。スクロールして「同意する」を押す機械に成り果てています。\n\n今日の話は、Googleの利用規約を「読んでいたけど守らなかった」業者が引き起こしたトラブルです。\n\n飲食店のGoogleアカウントが停止されて「閉業」と表示され、その間の損害を巡って裁判になりました。","summary":"・絡んでる金額: 10万円\n・テーマ: Googleマイビジネスアカウント不適切運用の責任\n・利用規約の問題","what_happened":"お待たせしました。ここからが事件です。\n\n六本木で飲食店を運営しているユーザー側がいます。\n\n2018年11月、サービス側というMEO業者と契約を結びました。\n\n「Googleマイビジネスのアカウントを預けるので、うまいこと検索上位に表示されるように管理してください」という内容です。\n\n【ちょっと解説】MEO（Map Engine Optimization）── 「マップ最適化」のこと。Google検索で地図上位に出るよう工夫すること。「六本木 居酒屋」で検索したとき一番上に出るようにする作業ですね。\n\n最初はうまくいっていたんですが、2019年5月、アカウントが突然停止されました。\n\n理由：口コミ投稿がなりすましだと判断されたから。\n\nわかります？ この怖さ、伝わってます？\n\nサービス側は「早く復活させよう」と思って、停止中に同じアカウントで新しいページを作成しました。\n\nそれがGoogleの利用規約違反で、2度目の停止。\n\nそれでもまた同じ対応をしたら、3度目の停止。\n\nここで僕の話をさせてほしいんですけど。同じ失敗を3回繰り返す人、いますよね。僕も昔、全く同じパスワードを忘れて3回アカウント再設定したことがあります。でも規約違反を3回繰り返すのは、さすがに別の話ですよね。話を戻します。\n\n停止から復旧までに3ヶ月かかりました。\n\nその間、Google上ではユーザー側の店が「閉業」と表示されていました。\n\n閉業。閉業って書いてあったんですよ。営業してる店に。\n\nサービス側はユーザー側に、受領済みの報酬10万円を返金しました。\n\nユーザー側はサービス側に対して、約200万円の損害賠償を求めました。","issue":"で、裁判所に聞きたいことはこういうこと。\n\n200万円の損害、認められるの？　という話です。\n\n特にポイントになったのが「逸失利益」の計算。\n\n【ちょっと解説】逸失利益── 「あの事故がなければ稼げていたはずのお金」のこと。アカウント停止がなければ得られた売上の話。\n\nユーザー側は「テレビで紹介されたり、絶好調タイミングだったのに！」と主張しました。\n\n裁判所が売上データをしっかり確認した結果がこれです。\n\nこのアカウントが同年６月１７日に３度目の利用停止となってから同年８月３０日に復旧するまでの間は，本件店舗のページが存在していなかったため，本件店舗の情報は，「六本木　居酒屋」などのキーワードによる検索（間接検索）ではグーグル検索結果に表示されなくなっていた（弁論の全趣旨）。もっとも，この間も店名による検索（直接検索）を行えば，本件店舗にかかる食べログ，レティ，ツイッター，フェイスブック及びウェブサイト等がグーグル検索結果に表示されていた（乙４，５）。\n（略）\n本件店舗の売上げの推移を見ると，令和元年６月から８月の月別平均売上額は１１３万８１１６円であり，その直前の３か月（同年３月から５月）の月別平均売上額１３５万８９８５円と比べて２２万０８６９円減少しているものの，６月の売上額は１３０万１３８０円であって，５月の売上額１２７万４８８０円より増額している。また，年間を通した月別平均売上額は，平成３０年が１０３万４１５９円であるのに対し，令和元年（平成３１年）は１１８万６８８０円であって増額している。\n以上を総合すると，このアカウントが利用停止になったことによるユーザー側の集客ないし売上げへの影響は否定できないものの，限定的であったというべきである。そして，平成３０年６月から８月の月別平均売上額（１２３万０２７６円）と令和元年の同時期の月別平均売上額（１１３万８１１６円）との差額が９万２１６０円であることも勘案するなら，このアカウントが利用停止になったことと因果関係のある原告の逸失利益は，３０万円と認めるのが相当である。\n\nつまり「確かに影響はあったけど、食べログやTwitterでも検索できたし、売上の落ち方もそこまでじゃなかったから30万円が妥当」という判断。\n\n「テレビに出た時期だったから」という主張も、他の要因もあるとして認められませんでした。\n\nちなみに全然関係ないけど、「損害を主張するときは数字で証明する」ってすごく大事なんですよね。感情的に「大損害でした！」と言っても、売上データが追いついてなかったら裁判では通らない。で、話を戻します。","ruling":"さあ、裁判所の答えです。\n\nサービス側による不適切なアカウント運用は責任あり、と認められました。\n\nただし損害は30万円（3ヶ月の逸失利益）のみ。200万円の請求に対して30万円です。\n\n人件費などその他の損害は認められませんでした。\n\n裁判所、バッサリ。","takeaway":"で、結局なにが大事なの？\n\n・アカウントを外部業者に預けるときは「もし停止されたらどうするか」を契約に書いておこう\n・Googleの利用規約違反を規約違反で解決しようとすると、さらに深みにはまる（3度停止がそれ）\n・「閉業」表示は本当にヤバい。実態が損害として認められにくくても、信用の毀損は大きい\n・損害賠償を請求するなら、売上データなど数字で証明できるものを用意しておこう。感情的な主張は裁判所には通らない\n\nGoogleのアカウント停止は他人事じゃない。","one_liner":"Googleのルールを破った結果は、Googleが一番厳しく執行する。業者も例外じゃない。","parties":[{"role":"ユーザー側","icon":"👤","side":"plaintiff","desc":"飲食店"},{"role":"サービス側","icon":"🌐","side":"defendant","desc":"MEO業者"}],"lessons":["証拠がないと詰む","規約、読んだ？","プラットフォームの罠"]},{"original_title":"高松地丸亀支判令3.1.23（電子計算機損壊等業務妨害罪の成否）","url":"https://itlaw.hatenablog.com/entry/2021/05/08/153846","court":"高松地丸亀支判","date":"令3.1.23","year":"令和3年（2021年）","topic":"電子計算機損壊等業務妨害罪の成否","categories":["その他"],"fun_headline":"【無罪】「メンテのためです」と言い張ったらホントに無罪になった件","hook":"これ聞いたら驚くから。\n\n会社に不満があって、業務用のプログラムをこっそり書き換えた人がいるんですよ。\n\n「でもそれって犯罪じゃないの？」って思うじゃないですか。\n\nそう思いますよね。普通そう思う。\n\nでも裁判所の答えがね、ちょっと待ってってなるんですよ。","summary":"・テーマ: 電子計算機損壊等業務妨害罪の成否","what_happened":"事件の概要、説明しますね。\n\nAさんという人がいました。輸入雑貨の会社に勤めてたんですけど、待遇に不満があった。\n\nそれで何をしたかというと、会社の発送業務用プログラムのソースコードを書き換えたんですよ。\n\n書き換えた結果、そのプログラムが動かなくなった。\n\nその日の発送業務約700件のうち、140件ができなくなりました。\n\n140件ですよ。ぜんぜん少なくない。\n\nここで僕の話をさせてほしいんですけど、僕も昔バイト先のパソコンの設定を「ちょっとよくしようとして」むしろ壊したことがあるんですよね。謝り倒した思い出がある。話を戻します。\n\nで、Aさんはそのまま有給を使って退職してたわけです。状況、完全に怪しい。\n\nでも書き換えたコードには「メンテナンス用チェック」って書いてあった。\n\nそして、不等号一か所を直せば復旧できる、という話でした。\n\nで、ここからがヤバいんですけど。\n\nAさんは「2019年から2020年に変わったときにプログラムが誤作動する可能性があると思って、確認作業を忘れないようにわざと動かなくした」と主張するわけです。\n\nあのー、付せんに書けばよくないですか？ って話なんですが、それはそれとして。","issue":"要するに何が問題だったの？ って話をしますね。\n\nAさんが「業務妨害の目的でやったかどうか」、つまり故意があったかどうかが争点です。\n\n【ちょっと解説】故意── わざとやったかどうかのこと。「うっかりやった」と「わざとやった」では罪の重さが全然違う。電子計算機損壊等業務妨害罪は「故意」がないと成立しない。\n\nここテストに出ます。\n\n検察「いや完全に嫌がらせでしょ」\nA「いや確認忘れ防止です」\n\nこの二択、裁判所はどっちを信じるか、という戦いでした。","ruling":"いよいよ判決です。\n\n裁判所はまず、Aさんの主張がおかしいかどうかを検討しました。\n\n「付せんとかカレンダーに書けばいいのに、プログラムを止める方法を選ぶのは合理的じゃない」という点について、裁判所はこう言ってます。\n\n (1) 　本件書換えの目的について，検察官は，このプログラムを作動しないようにすることによって本件会社の業務を妨害するためであったと主張するのに対し，被告人は，２０１９年から２０２０年になった際にこのプログラムが誤作動する可能性があるのではないかと思いついたことから，このプログラムのソースコードを見て誤作動するかどうかの確認作業をする必要があると考え，その確認作業をすることを確実に思い出すように，適当な日付として約１か月後の令和元年９月１日午前９時になるとこのプログラムが作動しなくなるようにした旨述べる。\n\n(2) 　この点について，本件書換えは，同日午前９時になるとこのプログラムが作動しなくなるようにするものであるものの，ソースコードのうち不等号１文字を変更することによって復旧することが可能なものであり，本件会社の業務に与える影響も限定的なものである。また，本件書換えによって加えられたソースコードの中に「メンテナンス用チェック」との記載がされていることは，本件書換えの目的についての被告人供述を一定程度裏付けるものといえる。\n\nここからが本番です。覚悟してください。\n\n（中略）\n\n検察官は，ソースコードの確認作業をすることを思い出すための方法としてこのプログラムを作動しないようにすることは極めて不自然である旨主張する。確かに，被告人は，本件書換えをするために３０分程度の時間を使っているところ，確認作業をするのを思い出すための方法としては，カレンダーに記入したり，付せんに記載する，携帯電話の予定表機能を使用するなどより簡易な方法があることから，本件書換え行為は合理的な方法とは評価し難い。しかし，前記(2)の事情も踏まえると，単に合理的な方法でないというだけで，被告人が確認作業をすることを思い出す目的で本件書換えをした可能性を否定することはできない。\n\nこの点について，証人Ｄは，確認作業をすることを思い出すためというような目的でコンピュータのプログラムを止めることはあり得ない旨述べるところ，同人はコンピュータのソフトウエアの開発等をする会社の代表取締役及びシステムエンジニアであり，メンテナンスチェックの方法について，本番系とは別に検証系を立ち上げて動作確認をするのが当たり前であるというような発言内容などに照らせば，その供述内容は，同人の経営する会社が顧客から保守管理等を頼まれた場合を想定しているものと思われる。しかし，このプログラムは，代表者を含めて３人という規模である本件会社でのみ使用されるものであり，また，被告人が作成したもので，主に使用するのも被告人であったことなどに照らせば，このプログラムは他の会社のシステムエンジニアに依頼をしてメンテナンスをするようなものとは考え難く，証人Ｄの述べる一般論を本件に当てはめて考えることは相当でない。\n\nつまり、「合理的じゃないからって、やましい目的があったとは言い切れない」という判断です。\n\n裁判所、めっちゃ慎重。好き。\n\nで、結論は無罪。\n\nAさんは業務妨害を目的として書き換えをしたわけではないとして、故意がないから無罪になりました。\n\n僕がこの当事者だったら、三日は寝込む。無罪でも有罪でも。","takeaway":"で、結局なにが大事なの？\n\n- 「メモ代わりにプログラム止めた」は通じる可能性がある。 ただし状況証拠が揃ってたらアウト\n- 故意の証明は難しい。 検察が「わざとだ」と証明できなければ無罪になる\n- コードにコメントを書いておくのは大事。 「メンテナンス用チェック」の一言が今回は効いた\n- 3人規模の会社と大企業じゃ、常識が違う。 裁判所も文脈を見て判断する\n\n最後に一言。付せんでよかった。","one_liner":"「わざとじゃない」と言い続けた者が勝つ。証拠がなければ。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"検察官"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"元従業員(A)"}],"lessons":["証拠がないと詰む"]},{"original_title":"大阪地判令3.1.21（プログラムの著作物性（肯定）","url":"https://itlaw.hatenablog.com/entry/2021/05/03/230701","court":"大阪地判","date":"令3.1.21","year":"令和3年（2021年）","topic":"プログラムの著作物性（肯定","categories":["著作権","プログラム・システム"],"fun_headline":"【4000万円】競艇の自動購入ソフトをパクったら著作権でボコられた件","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n競艇の舟券を自動で買ってくれるソフトウェアがあるんですよ。\n\nそれを作った人がいて、別の人がそれをパクって売ったんですよ。\n\nパクられた人が「著作権侵害だ！」と訴えたわけですけど、\n\n「プログラムって著作物として守られるの？」って話になるんですね。\n\n答えは守られます。でもその理由が面白い。","summary":"・絡んでる金額: 4000万円\n・テーマ: プログラムの著作物性（肯定\n・著作権がらみの争い","what_happened":"話を整理しますね。\n\n権利主張側たちは、競艇の舟券を自動で買ってくれるソフトを作って売ってました。\n\nいわゆる「あらかじめ設定した条件に従って自動購入」するやつです。\n\nここで僕の話をさせてほしいんですけど、競艇って馬よりボートで走るやつですよね。僕はどっちもやったことないんですけど、自動で買えるソフトが売れるくらいには人気なんですね。話を戻します。\n\n利用側という人がいて、そのソフトを手に入れて、こう思ったわけです。\n\n「逆コンパイルして中身見たら、自分でも作れるんじゃ？」\n\n【ちょっと解説】逆コンパイル── プログラムの完成品（バイナリ）を人間が読めるソースコードに戻す作業。料理で言うと、完成した料理を食べてレシピを逆算するようなもの。\n\nで、利用側はソフトの中身を解析して、似たようなソフトを作って売り始めた。\n\nここからがヤバいんですけど、GUIDという自動生成IDが完全一致してたんですよ。\n\nGUIDって、Visual Studioが自動でつける番号で、世界にひとつしかない識別子です。\n\nそれが一致してる時点で「完全にコピーしましたよね？」っていう話なんですよね。\n\n権利主張側は利用側に対して損害賠償を請求。金額は4000万円の損害のうち2800万円（一部請求）。\n\nちなみに全然関係ないけど、「一部請求」って言って少なく訴えておいて、後で追加請求できる仕組みがあるんですよね。法律、なかなか戦略的。","issue":"で、何が問題になったかというと──\n\n権利主張側のプログラムって、そもそも著作権で守られる「著作物」なの？ という点です。\n\n【ちょっと解説】著作物性── 「それ、著作権で保護される\"著作物\"ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\nここテストに出ます。\n\n「プログラムは書き方がだいたい決まってるから著作物じゃない」という主張もあり得るんですよ。\n\nVisual BasicやVisual Studioで書いたコードって、割と定型的な書き方になりがちで、「それって誰でも同じように書くよね？」って言われたら反論しにくいこともある。\n\n要するに「あなたのコード、オリジナリティある？」という話です。","ruling":"いよいよ判決です。\n\n裁判所はまず一般論として言います。\n\n プログラムに著作物性があるというためには，指令の表現自体，その指令の表現の組合せ，その表現順序からなるプログラムの全体に選択の幅があり，かつ，それがありふれた表現ではなく，作成者の個性，すなわち，表現上の創作性が表れていることを要するといわなければならない\n\nつまり「書き方に選択の余地があって、実際に独自の選択をしているか」が重要、ということです。\n\nで、権利主張側のソフトを見てみると──\n\n Xプログラムは，市販のプログラム開発支援ソフトウェアである Microsoft　Visual　Studio を使用して Microsoft　Visual　Basic 言語で記述されているから，ソースコードを個別の行についてみれば，標準的な構文やありふれた指令の表現が多用されており，独創的な関数等は用いられていない。\n\nここまで読んで「うわぁ……」ってなった人、正常です。\n\n一行ずつ見たら、ありふれた書き方なんですよ。でも、続きがある。\n\n裁判所は「個々の行」じゃなくて「組み合わせ方」を見て、こう判断しました。\n\n画面レイアウトの生成方法も、設定の保存構造も、自動運転の制御も、HTML解析の方法も──それぞれ「こういう結果を得るためにどう書くか」には選択肢がいくつもある。で、権利主張側はその中から独自の方法を選んで組み合わせていた、と。\n\n Xプログラムは，市販のプログラム開発支援ソフトウェアである Microsoft　Visual　Studio を使用して Microsoft　Visual　Basic 言語で記述されているから，ソースコードを個別の行についてみれば，標準的な構文やありふれた指令の表現が多用されており，独創的な関数等は用いられていない。\n\n裁判所はさらに、GUIDの一致などから「完全に複製しましたよね」と認定して、利用側の言い訳を全部却下。\n\n損害額は4240万円と認定されて、権利主張側の請求2800万円がまるごと認められました。\n\nあ、今思い出したんですけどこの記事もう結構長くないですか？ でも大事なとこが続くのでもうちょっとだけ。","takeaway":"で、結局なにが大事なの？\n\n- プログラムの著作権は「組み合わせ方のオリジナリティ」で決まる。 一行ずつは普通でも、全体として独自ならOK\n- GUIDが一致したら終わり。 コピーしたことの動かぬ証拠になる\n- 逆コンパイルして「参考にした」は言い訳にならない。 やるなら完全に独自実装で\n- 自分のコードに著作権があると思うなら、独自の工夫をちゃんと文書化しておこう\n\n最後に一言。パクるくらいなら自分で書け。以上。","one_liner":"コードの著作権は一行じゃなく「組み合わせ方」で守られる。パクるの、バレるよ。","parties":[{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"ソフト開発者"},{"role":"利用側","icon":"⚖️","side":"defendant","desc":"競合販売者"}],"lessons":["証拠がないと詰む","著作権は万能じゃない","パクリの立証は地獄"]},{"original_title":"東京地判令2.12.22（コンサル・開発契約の法的性質）","url":"https://itlaw.hatenablog.com/entry/2021/03/22/224220","court":"東京地判","date":"令2.12.22","year":"令和2年","topic":"コンサル・開発契約の法的性質","categories":["契約・報酬"],"fun_headline":"【闇深】「ソフト開発」と「コンサル」を物々交換した結果、地獄を見た話","hook":"みなさん、物々交換って知ってますよね。\n\n「これあげるから、あれくれ」ってやつ。\n\n今日の話、お金のやり取りじゃなくて「コンサル料の代わりにソフト開発で払う」という契約のケースです。\n\nこれ、聞いた瞬間「あ、ヤバい匂いがする」って思いますよね。\n\n正解です。ヤバかった。","summary":"・絡んでる金額: 10万円\n・テーマ: コンサル・開発契約の法的性質\n・契約とお金の話","what_happened":"で、何が起きたかというと。\n\n発注側はシステムエンジニアで、ボードゲームカフェも経営してる人です。この情報、多い。\n\n開発側と業務委託の基本契約を結んで、2つの個別契約をやることにした。\n\nひとつ目。開発側が発注側に月額10万円でコンサルをする契約。\n\nふたつ目。発注側が開発側のために「着物や帯のアドバイスが表示されるソフト」を開発する契約。\n\nここで僕の話をさせてほしいんですけど、着物ってちゃんと選ぼうとすると本当に難しいんですよね。僕は袴を一回着たことあるんですけど、何が何やらわかりませんでした。話を戻します。\n\nで、このソフト開発の報酬が決まってないんですよ。\n\n「コンサル料は本来月額30万円だけど、安くする代わりにソフト開発で払ってね」という構造。\n\nつまり、実質20万円分のソフト開発をコンサル代の一部として提供する、みたいな話です。\n\nちなみに全然関係ないけど、この「物々交換的な契約」、税務的にもなかなかめんどくさくなりそうですよね。知らんけど。\n\nで、案の定発注側と開発側は仲違いして、発注側が契約解除を通知した。\n\nここ、大事なとこなんで簡単に言うと、「俺はもうやめる、3ヶ月後に終わり」と言ったわけです。\n\n開発側は「その解除は無効だ」と言って争いになりました。","issue":"ここからが法廷バトルの核心部分。\n\n問題は「2つの契約、法律的にどっちの種類の契約なの？」という話です。\n\n【ちょっと解説】準委任（じゅんいにん）── 「結果は約束しないけど、プロとしてちゃんとやります」という契約。美容院で「いい感じにしてください」と言うのに近い。SES契約はだいたいこれ。\n\n【ちょっと解説】請負── 「完成品を納品します、完成したら報酬もらいます」という契約。家の建築がわかりやすい例。完成しなかったらお金もらえない。\n\nここテストに出ます。\n\n準委任なら民法651条で比較的自由に解除できる。\n\n請負なら解除の条件が変わってくる。\n\nだから開発側としては「あの契約は請負だ、勝手に解除できない」と主張したわけです。","ruling":"さあ、裁判所の答えです。\n\n裁判所は「2つともに準委任です」と言いました。\n\nコンサル契約については：\n\n 本件コンサルティング業務は，法律行為ではない事務にほかならず，よって，本件コンサルティング契約は，改正前民法所定の準委任契約とみることができる。\n\nまあそうですよね、って感じ。\n\n問題はソフト開発契約のほうです。「開発してソフトを納品する」なら普通は請負っぽいですよね。でも裁判所はこう見た。\n\n ①開発側の意向により，（略）要件定義，基本設計，詳細設計，開発，テスト実施という通常のシステム開発の手順をあえて踏まずに，完成品の仕様を決めることなく，要件定義も行わないまま，まず発注側が一応のものを製作してその仕掛品に対して適宜開発側から修正の要望を受け，その都度同要望を製作過程に反映させていくという方法が採用されたこと\n\n②発注側は，同方法に従い，Y代表者から送られたメールや資料を読解してその趣旨に沿うような実装等を自ら考え，作業を進めていったが，Y代表者の意図を理解できないこともあったこと\n\n③完成品の仕様が決められていないために，発注側において作業の早い段階から進め方に苦慮していたこと\n\nが認められる。これらの事実によれば，このソフトウェア開発契約においては，最終的に開発を遂げるべきソフトウェアの内容が具体的に確定していなかったものということができる。また，上記のとおり，XY間において，本件コンサルティング契約の報酬のうち２０万円は，このソフトウェア開発契約に基づく発注側の開発側に対する労務の提供をもって支払に代える旨の合意が成立したものと認められるところ，これは，このソフトウェア開発業務の対価が開発の進捗や完成度にかかわらず毎月発生することを前提としている。これらの点に鑑みると，このソフトウェア開発契約も，改正前民法所定の準委任契約に該当すると解すべきである。\n\nつまり──要件定義なし、仕様なし、完成の定義なし。これって「完成品を約束した契約」じゃないですよね、という話。\n\n裁判所めっちゃ冷静。好き。\n\nで、準委任なので解除は有効。\n\nさらに解除後も発注側が報酬を払い続けてたことについては「それ不当利得だから返してね」とも言われました。\n\n開発側からすると全部裏目に出た結果です。","takeaway":"で、結局なにが大事なの？\n\n- 「請負か準委任か」は契約書の見た目じゃなく実態で決まる。 仕様が決まってなければ準委任と見なされうる\n- 要件定義をちゃんとやれ。 「なんとなく作る」は後で争いの種になる\n- 物々交換みたいな複雑な報酬体系は、後で「言った言わない」になる。 文書に残せ\n- 準委任は原則いつでも解除できる。 ただしタイミングが悪いと損害賠償が発生することも\n\n最後に一言。「なんとなくよろしく」で始まる開発、だいたいあとが怖い。","one_liner":"仕様を決めずに開発を始めた時点で、それはもう準委任です。覚悟してください。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"SE兼カフェ経営者"},{"role":"開発側","icon":"💻","side":"defendant","desc":"コンサルタント"}],"lessons":["「完成」って何？","金の話は最初にしろ"]},{"original_title":"東京地判令2.12.21（暗号通貨交換所によるサービス停止の責任）","url":"https://itlaw.hatenablog.com/entry/2022/12/03/151643","court":"東京地判","date":"令2.12.21","year":"令和2年","topic":"暗号通貨交換所によるサービス停止の責任","categories":["暗号資産・ブロッキング","責任・損害"],"fun_headline":"【コインチェック事件】1000ETH送れなかった → 3500万円請求した結果","hook":"2018年にコインチェックから580億円分のNEMが盗まれた事件、覚えてますか。\n\n当時ニュースすごかったですよね。\n\n今日はその事件の「被害を受けた側の一人」が交換所を訴えた裁判の話です。\n\n「送金しようとしたのに止められた、その損害を払え」という話なんですけど、\n\n裁判所の答えが「いや、それは払わなくていい」でして。\n\nなんで？ って思いますよね。ちゃんと説明します。","summary":"・絡んでる金額: 11万円（1ETHあたり）\n・テーマ: 暗号通貨交換所によるサービス停止の責任\n・仮想通貨関連","what_happened":"話を整理しましょう。\n\n2018年1月26日、Y（仮想通貨交換業者、当時の名称）がサイバー攻撃を受けて、NEM大量流出事件が起きました。\n\nそれって要するに、外部の攻撃者にお金を全部盗まれたみたいな話です。\n\n請求側はこの交換所に口座を持ってて、事件当日に「イーサリアム1000ETH を海外の取引所に送ってくれ」と指示したんですね。\n\nこの時点の1ETHが約11万円。つまり全部で11億円分。マジ？ ヤバい。\n\nでも相手方は送金しなかった。\n\nその後、相手方は3月12日に「その送金指示、キャンセルしますね」と通知してきた。\n\nこの時点では1ETHが約7.5万円に下がってた。\n\nここで全然関係ない話なんですけど、仮想通貨ってこういうときに「あのときに動いてれば」ってなるやつですよね。株もそうですけど、そのプレッシャーに僕は絶対耐えられない。話を戻しますね。\n\nその後相手方は3月30日に、保有するイーサリアム約1200ETHを約4800万円で売却した。\n\n請求側は「事件直後に送金してくれてれば、値下がり分の損害は出なかった。3500万円払え」と訴えた。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\n一方で利用規約にはこう書いてありました。\n\n相手方は，ハッキングその他の方法により相手方の資産が盗難された場合，登録ユーザーに事前に通知することなく，サービスの利用の全部又は一部を停止又は中断することができる。\n\nこういう免責条項、みんなちゃんと読んでますか。僕は読んでないです。読もうと思います。","issue":"両者の言い分が食い違ったポイントはここ。\n\n「送金を止めたのは利用規約に基づく正当なサービス停止か、それとも契約違反か」という話です。\n\n【ちょっと解説】善管注意義務（ぜんかんちゅういぎむ）── 「その道のプロなら当然気をつけるでしょ」という注意義務。ITベンダなら、既知の脆弱性対策くらいやれよ、という話。\n\n請求側はさらに「ちゃんとコールドウォレットで管理してれば盗まれなかったじゃないか、善管注意義務違反だ」とも主張してました。\n\n【ちょっと解説】コールドウォレット── インターネットにつながっていない、オフラインの財布。繋がってないから盗まれにくい。逆にホットウォレットはオンラインで便利だけどリスクがある。\n\nここテストに出ます。","ruling":"さあ、裁判所の答えです。\n\nまず「送金止めたのは正当か」について：\n\n相手方は，本件利用契約上，原則として，登録ユーザーの依頼に基づき，相手方所定の方法に従い，ユーザー口座からの金銭の払戻し又は仮想通貨の送信に即座に応じる義務があったから，相手方が即座に本件送信指示に対応しなかったことは，本件規約に掲げられたサービスの停止が許容される場合に該当しない限り，請求側に対する債務不履行を構成するというべきである。\n\nここまでは「原則として送金する義務あり」という話。\n\nじゃあ今回は「停止が許容される場合」に当たるか？\n\n裁判所が認定した事実：\n- 事件はAM0:02に発生\n- 相手方はAM11:25頃に異常を検知\n- AM11:42に全通貨の送金停止を指示\n- AM11:48に規約に基づく停止措置が実施された\n\n請求側の送金指示はその時点ですでに停止後。だから「従わなくていい状況だった」と認定されました。\n\n次に「コールドウォレット使わなかったのは善管注意義務違反か」について、これが面白い。\n\n 　（ア）　前記ア（イ）ｄのとおり，Ｃは，本件事件発生当時，ＮＥＭに対応した既存のコールドウォレットとして，平成２９年１２月下旬に発売されたコールドウォレットが存在していたものの，同ウォレットは個人向けであり，未だ仮想通貨交換業者である被告が利用できるコールドウォレットの開発に必要なＮＥＭの暗号化の方式及びハッシュ関数の情報や知見の蓄積が十分でなく，ＮＥＭのソフトウェア開発キットにおいてもソースコードを読み解くことに困難があったとの意見を述べていること（前記ア（イ）），本件事件当時，被告以外で唯一，国内でＮＥＭを取り扱い，世界的に見ても多量にＮＥＭを保有していたｃ社も，これらをホットウォレットで管理していたこと（前記ア（ウ）），相手方がコールドウォレット対応を終え，同年６月７日にＮＥＭの出金及び売却のサービスを再開するまでに約４か月を要したこと（前提事実(4)オ）に照らせば，本件事件当時，仮想通貨交換業者において，顧客のＮＥＭを保管することができるような機能と安全性を備えたコールドウォレットが存在したとは認められない。\n\nつまり「当時のNEM向けコールドウォレット、業者が使えるものがそもそも存在しなかった」という話です。\n\n「コールドウォレットで管理すべきだった」という主張に対して、「その時点でそれが技術的に可能だったとは言えない」と裁判所に言われてしまいました。\n\n事件後に「もっとちゃんとしろよ」という指摘が金融庁からあったことについても、\n\nしかしながら，これらの声明等による指摘は，いずれも本件事件発生後に，コールドウォレットに対応していれば本件事件を防ぐことができたという観点からされたものにすぎず，これらの指摘をもって，本件事件当時，現実にコールドウォレットによってＮＥＭを管理することが容易であったと認められるものではない。\n\n「後から言われても、それは当時の話とは別」という判断。\n\n裁判所、めっちゃ公平。好き。\n\n結論：請求側の請求はすべて棄却。\n\n以上によれば，相手方が，善良なる管理者として安全かつ安定的なシステムを構築するとの注意義務に違反したと認めることはできないし，そもそも，本件条項が定められた主たる目的は，悪意の外部侵入者から請求側を含む顧客財産を保護するためのものと解されるところ，本件事件により現に相手方の資産が盗難された以上，何らの手当てもしないままサービスの提供を続ければ，更なる盗難の可能性を否定できないことからすれば，相手方は，顧客の財産を善良なる管理者としで保護すべき注意義務を果たすために，本件条項に基づき本件停止措置を実施したといえるのであって，相手方が，本件事件発生を受けて本件条項に基づき本件停止措置をとった結果，本件送信指示に従わなかったことをもって，本件利用契約に違反する債務不履行があったということはできない。","takeaway":"で、結局なにが大事なの？\n\n- 利用規約の免責条項は本当に効く。 「読んでなかった」は通じない\n- 「当時できなかった」は免責になりうる。 ただし業界全体でできてなかった場合に限る\n- 後から出てくる批判は当時の義務の証拠にならない。 事後的な指摘で過去の責任を問うのは難しい\n- 仮想通貨は価格変動リスクも技術的リスクも利用者が負う部分が大きい\n\n最後に一言。利用規約、読んどけ。マジで。","one_liner":"「利用規約に書いてある」は思ったより強い。盗まれた取引所が勝った。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"仮想通貨交換所"},{"role":"請求側","icon":"💼","side":"plaintiff","desc":"仮想通貨利用者"}],"lessons":["規約、読んだ？","セキュリティ甘すぎ"]},{"original_title":"横浜地判令2.12.11（訴訟手続での個人データの提出）","url":"https://itlaw.hatenablog.com/entry/2021/11/21/094854","court":"横浜地判","date":"令2.12.11","year":"令和2年","topic":"訴訟手続での個人データの提出","categories":["その他"],"fun_headline":"【大量懲戒請求】裁判の証拠に個人情報リストを出したらプライバシー侵害になるの？","hook":"みなさん「大量懲戒請求事件」って聞いたことありますか。\n\nネットで弁護士に対して組織的に大量の懲戒請求をした事件です。\n\nその弁護士たちが、懲戒請求をした人々を逆に訴えた。\n\nで、その裁判で「懲戒請求者の名前と住所が書かれたリスト」を証拠として出したんですよ。\n\nこれってプライバシー侵害にならないの？ という話です。\n\n結論から言うと、ならなかった。でもなぜか、が面白い。","summary":"・テーマ: 訴訟手続での個人データの提出","what_happened":"で、何が起きたかというと。\n\nインターネット上のブログで呼びかけがあって、弁護士に対して大量の懲戒請求がなされました。\n\n懲戒請求って、「この弁護士、ちゃんと仕事してないから処分してくれ」と弁護士会に申し立てることです。\n\nそれが組織的に、大量に来たわけです。\n\nここで僕の話をさせてほしいんですけど、僕は弁護士に懲戒請求された経験も、したこともないんですけど、なんか想像するだけで胃が痛い。両方の立場で。話を戻します。\n\n弁護士たちは「これは嫌がらせだ」として、懲戒請求をした人たちを逆に損害賠償で訴えました（別件訴訟）。\n\nその別件訴訟で、弁護士会が作成した「懲戒請求者の氏名・住所等が書かれたリスト」を証拠として裁判所に提出したんです。\n\nマスキング処理なし。全部そのまま。\n\nちなみに全然関係ないけど、裁判の記録って原則的に誰でも閲覧申請できるんですよ。知ってました？ 僕は知らなかった。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\nで、リストに名前が載ってた人たちが「それはプライバシー侵害だ、不法行為だ、謝罪と賠償を求める」と訴えた、というのが今回の話です。","issue":"で、何が問題になったかというと──\n\n「裁判の証拠として個人情報を提出する行為は、プライバシー侵害の不法行為になるか」という話です。\n\nここテストに出ます。\n\n普通に考えると「住所とか名前をマスキングもせず裁判所に出したらダメでしょ」って思いますよね。\n\n思いますよね？\n\nでも訴訟って、証拠を出さないと裁判にならないじゃないですか。\n\n「プライバシーが気になるから証拠を出せません」ってなったら、そもそも裁判ができない。\n\n個人情報保護 vs 司法の機能、どっちを優先するか、という戦いです。","ruling":"裁判所、こう言いました。\n\n裁判所はまず「プライバシー侵害かどうかの判断方法」を示しました。\n\n個人のプライバシーに属する事実をみだりに公表されない利益は，法的保護の対象となるというべきであるが，プライバシーの侵害については，その事実を公表されない法的利益とこれを公表する理由とを比較衡量し，前者が後者に優越する場合に不法行為が成立するものと解される（略）。\nそして，民事訴訟における主張立証活動は，それ自体は事実の公表を目的とする行為ではないものの，訴訟記録が閲覧可能な状態に置かれることなどにより，第三者がその事実を知り得る状態に至り，結果的に公表と同様の効果をもたらすことがあるため，プライバシーの侵害の成否が問題となり得る。このような場面では，その事実を公表されない法的利益と当該主張立証活動に係る法的利益とを比較衡量し，前者が後者に優越する場合に不法行為が成立するものと解されるが（なお，前者が後者に優越する場合であっても，違法性阻却事由があるときには，不法行為が成立しないことは，言うまでもない。），その判断に際しては，当事者が主張立証活動を尽くし，裁判所がこれを踏まえて事実認定及び法的判断を行うことにより私的紛争の適正な解決を実現するという民事訴訟の性格上，当事者の主張立証活動の自由を保障する必要性が高いことを踏まえることが重要である。\n\nつまり、「プライバシーを守る利益」と「証拠を出す必要性」を天秤にかけて、前者が重ければ不法行為、後者が重ければOK、という話です。\n\nあ、今思い出したんですけど「比較衡量」って法律でよく出てくる言葉なんですよね。つまり「どっちが大事か、バランスで考える」ってことです。\n\nで、今回のバランス判断はこうなりました。\n\n本件各個人情報が本件大量懲戒請求者(1)に係る情報であることは，本件各選定者らの意思に基づかずにみだりにこれが公表されることにより，本件各選定者らの社会的評価が低下するおそれがあることを意味するものといえる反面，本件大量懲戒請求(1)からいまだ相当な年月を経たとまではいえない今日においては，本件各選定者らが本件大量懲戒請求(1)に係る懲戒請求をしたとの事実は，その性質上，社会一般の関心あるいは批判の対象となるべき事項にかかわるものということもできる（略）。\nウ　他方，本件各提出行為は，別件各訴訟における請求原因事実（被告が当該各訴訟において主張する個々の不法行為〔本件大量懲戒請求(1)のうち，同訴訟において被告が取り上げた個々の懲戒請求〕及びその加害者を特定し，当該行為と相当因果関係のある損害額〔慰謝料及び弁護士費用〕の算定に影響する事情と位置付けられる本件大量懲戒請求(1)の全貌）の立証を目的としたものと理解することができ，直ちにその必要性を否定することは困難である。\n\nここ、大事なとこです。赤線引いてください。\n\nつまり「懲戒請求した事実は社会的な批判の対象になりうるし、証拠として必要性もある、だからプライバシーの利益が優越するとは言えない」という結論です。\n\n裁判所めっちゃ冷静。好き。\n\n本件各個人情報を公表されない法的利益と（結果的にこれを公表することなる）本件各提出行為の理由とを比較衡量しても，直ちに前者が後者に優越するとまでは認められない\n\n個人情報保護法の違反（同意なしの第三者提供）という主張も出たんですけど、「訴訟は例外に当たるし、行政法規の違反がすぐ不法行為になるわけでもない」として却下されました。\n\n結論：原告の請求はすべて棄却。","takeaway":"で、結局なにが大事なの？\n\n- 裁判の証拠提出は、プライバシー侵害の例外になりやすい。 「訴訟の必要性」は強い理由になる\n- 個人情報保護法違反と不法行為は別の話。 法律を破っても、それだけで不法行為にはならないことがある\n- 「社会的批判の対象になる行為」をした人は、プライバシー保護が薄くなる場合がある\n- マスキングなしで出しても今回は大丈夫だったけど、できるならしておいたほうが安全\n\n最後に一言。裁判で戦う覚悟をするなら、自分の情報が証拠になることも覚悟せよ。","one_liner":"訴訟の証拠提出は「プライバシー侵害」の例外になる。裁判で戦うとはそういうことだ。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"懲戒請求者"},{"role":"第三者","icon":"👥","side":"third","desc":""},{"role":"被告","icon":"⚖️","side":"defendant","desc":"弁護士"}],"lessons":["証拠がないと詰む","損害、証明できる？"]},{"original_title":"東京高判令2.12.10（ハッキングによる暗号資産流出の責任）","url":"https://itlaw.hatenablog.com/entry/2022/04/17/204100","court":"東京高判","date":"令2.12.10","year":"令和2年","topic":"ハッキングによる暗号資産流出の責任","categories":["セキュリティ","暗号資産・ブロッキング","責任・損害"],"fun_headline":"【実話】パスワード使い回した結果、ビットコイン7.9枚が消えた男の話","hook":"「パスワードの使い回しはやめましょう」って、もう何万回言われてきた話じゃないですか。\n\nでも今日紹介する判例の人、その警告を無視した結果、約7.9ビットコインを盗まれました。\n\n2021年のレートで言ったら、余裕で数千万円です。怖くないですか。怖い。\n\nしかも裁判でも負けたんですよ。これ、笑えないやつです。","summary":"・テーマ: ハッキングによる暗号資産流出の責任\n・セキュリティ事案","what_happened":"で、何が起きたかというと。\n\n被害者側は、相手方が運営する仮想通貨の取引サービスを使ってました。\n\nで、平成30年1月27日。何者かが韓国のＩＰアドレスからこのアカウントにログインして、短時間で約7.9BTCを外部に送金してしまった。\n\n「あっ、ちょっと待って」っていう間に全部なくなってる。これ、ホラーだと思う。本当に。\n\nちょっとここでセキュリティの仕組みの話をさせてほしいんですけど。\n\nこのサービス、外部送金には「二段階認証」が必要だったんですよ。つまりパスワード＋ワンタイムパスワードの2つを入力しないといけない。ここ大事なとこなんで簡単に言うと、鍵が2つあるから安全なはずだった、ということ。\n\n被害者側はワンタイムパスワードを「登録メールアドレスに送る」方式を選んでました。\n\nそこで相手方側は「メール方式はメールがハックされると突破されるリスクがあります。SMSか認証アプリがおすすめです」ってちゃんと警告メールを送ってた。\n\nうわあ。\n\nさらにメール方式の場合は追加でPINコード（4桁の暗証番号）の入力も必要でした。\n\nで、ここからがヤバいんですけど。\n\n被害者側、このPINコードに、転送先メールアカウントのパスワードの一部と同じ数字を使ってたんです。\n\nここで僕の話をさせてほしいんですけど、僕も昔、銀行のPINコードに誕生日を使ってた時期があって。母親にATMで引き出してもらったことがあります。全然関係ないけど思い出しました。話を戻します。\n\nつまり被害者側、転送先メールアカウントがハックされたら、そこから芋づる式に全部突破される状態だったわけですよ。\n\nこれ当事者だったら胃に穴あく。いや一週間。\n\nそして実際に起きた。正しいログインパスワード、ワンタイムパスワード、PINコードがすべて入力されて、ビットコインが消えた。\n\nこのサービスの利用規約５条２項には、\n\nパスワードまたはユーザーＩＤの管理不十分、使用上の過誤、漏洩、第三者の使用、盗用等による損害の責任は登録ユーザーが負うものとし、当社は一切の責任を負いません。登録ユーザー本人が入力したか否かにかかわらず、パスワードまたはユーザーＩＤの一致により当社が本人認証を行い、本サービスの利用が行われたこと（例えば、登録ユーザーが利用するメールサービス等の他社サービスでパスワードまたはユーザーＩＤが盗まれる等した結果、本サービスの利用が行われたことを含む）を直接または間接の理由として損害が生じた場合を含みます。\n\n……って書いてあった。\n\nこれって要するに「あなたのパスワード管理が甘くてハックされても、うちは知りません」ということ。\n\n被害者側はいくつもの法的根拠で相手方を訴えました。「預けたビットコインを返せ」「売買契約違反だ」「引き渡せ」「せめて自分のものだと確認してくれ」みたいな感じで全部立てた。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\n一審（東京地判令2.3.2）は全部棄却。控訴審が本件判決です。なお控訴審はほぼ一審をそのまま引用したので、以下は一審の判断を中心に紹介します。","issue":"要するに何が問題だったかというと、一言で言えばこれです。\n\n「相手方は利用規約5条2項で免責されるのか？」\n\n被害者側の言い分は「規約に書いてなくても、相手方側がちゃんとセキュリティ対策してなかったんだから免責は認めるな」というもの。\n\n対する相手方の言い分は「利用規約にちゃんと書いてある。うちは悪くない」。\n\nここテストに出ます。「パスワード使い回し」がどれだけヤバいか、裁判所がどう判断したかを見てください。","ruling":"さあ、裁判所の答えです。\n\nまず裁判所は「被害者側のパスワード管理は不十分だった」とはっきり認定しました。\n\n裁判所、めっちゃ冷静。こわい。\n\n被害者側は，このアカウントについて，初回ログインパスワードを変更せずに使用し，ワンタイムパスワードのメール発行を選択し，本件メールアドレスに送信されたメールが自身の用いる別のメールアドレス（以下「転送先メールアドレス」という。）に転送されるように設定した上，転送先メールアドレスのアカウントへのログイン用パスワードの一部として用いていた４桁の数字をこのアカウントのＰＩＮコードとして使い回していたことが認められる。被害者側によるこのアカウントのパスワードの上記管理状況からすれば，一たび転送先メールアドレスのアカウントがハッキングされて同アカウントへのログイン用パスワードが盗用されてしまえば，本件メールアドレスより転送されたメールからこのアカウントのログインパスワード及びワンタイムパスワードが盗用され，ＰＩＮコードも容易に推知される可能性が高いものであったといえる。\nこれらの事情によれば，本件各取引が行われた原因は，被害者側がこのアカウントの初回ログインパスワードを変更せずに使用した上，転送先メールアドレスのアカウントで用いていたパスワードの一部をＰＩＮコードに使い回したため，転送先メールアドレスのアカウントがハッキングされただけでこのアカウントの全ての認証が突破されてしまったことにあると解され，被害者側のパスワード管理が不十分であったことを原因として本件各取引が行われたものというべきである。\n\nはい。「使い回しが原因」と明言されました。\n\nじゃあ相手方のセキュリティ対策はどうだったのか。裁判所はこう言いました。\n\n相手方は，このサービスについて，初回ログインパスワードを変更しないまま利用することが可能な仕組みを採用してはいたものの，被害者側を含む登録ユーザーに対し，初回ログインパスワードを変更するよう注意を喚起するメールを送信するとともに，二段階認証の設定を強く推奨し，ワンタイムパスワードについてメール発行を選択する場合，登録メールアドレスのアカウントがハッキングされると二段階認証が突破される可能性があることを説明し，ＳＭＳ発行又は認証アプリ発行を選択することを推奨する旨のメールを送信していたことが認められる。さらに，メール発行を選択した場合に登録メールアドレスのアカウントがハッキングされると二段階認証が突破される可能性があることへの対策として，メール発行を選択した場合に限り，資産を出金用外部コインアドレスに送付する際に，二段階認証に加えてＰＩＮコードによる認証を要することとしていたものである。\n\nつまり相手方は「警告もしたし、追加対策も取ってた」とされた。\n\nその結果、被害者側の全請求が棄却されました。「ビットコインを返せ」も、「確認だけでも」も、全部ダメ。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n- パスワードは絶対に使い回さない。「面倒くさい」と「ビットコインが消える」を天秤にかけたら答えは明らかすぎる\n- 取引所などの重要サービスはSMSか認証アプリで二段階認証を設定する。メール方式は最弱\n- 利用規約の免責条項は本当に有効になる。「そんな条項意味ないだろ」は通じない\n- 今すぐ自分のパスワードマネージャーを確認して、同じパスワードを使い回してるサービスがあったら即変更する\n\nちなみに全然関係ないけど、パスワードマネージャーって無料のものでも十分すごいですよね。使ってない人は今日から使ってほしい。で、","one_liner":"パスワードの使い回しは、自分の全財産の合鍵を玄関マットの下に置いておくようなもの。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"仮想通貨取引所"},{"role":"被害者側","icon":"🛡️","side":"plaintiff","desc":"仮想通貨利用者"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["規約、読んだ？","セキュリティ甘すぎ"]},{"original_title":"知財高判令2.11.25（プログラム著作物の特定）","url":"https://itlaw.hatenablog.com/entry/2024/12/14/163640","court":"知財高判","date":"令2.11.25","year":"令和2年","topic":"プログラム著作物の特定","categories":["著作権","プログラム・システム"],"fun_headline":"【悲報】「俺が作ったプログラム！」と訴えた男、「そのプログラムって実在するの？」と返される","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n「自分が書いたコードを会社にパクられた」って訴えた人がいるんですよ。\n\nわかる。すごくわかる。それは訴えたくなる。\n\nで、裁判所はなんて言ったかというと。\n\n「そのプログラム、本当に存在するんですか？」\n\nえ？ えーーー？？ そこから？？","summary":"・テーマ: プログラム著作物の特定\n・著作権がらみの争い","what_happened":"話を整理しましょう。\n\n権利者はＣ社という会社に雇われてました。\n\nそのＣ社が後に相手方に吸収合併された。\n\n「吸収合併」って要するに「会社ごと飲み込まれた」ということ。法人がなくなって、別の法人になる。\n\n権利者の言い分はこう。「自分が開発したプログラムを、相手方が無断で複製して第三者に売った。著作権侵害だ。損害賠償を払え。」\n\nこれ、理屈としてはわかりますよね。自分が作ったものを勝手に売られたら怒る。当然。\n\nあと余談なんですけど、権利者はパワハラ・セクハラの被害も主張してました。訴訟の中に「著作権侵害」と「ハラスメント」が同居してるの、読んでてしんどくなる。\n\nで、一審（東京地判令2.3.24）では全部棄却されて、控訴したのが本件です。\n\nここからが本当にヤバいんですけど。\n\n権利者の訴状に「別紙プログラム目録記載のコンピュータプログラムの著作権を有することを確認する」って書いてあって、その別紙には\n\nここ大事なとこです。赤線引いてください。\n\nコンピュータプログラム「Ｖｉｓｕａｌ Ｂａｓｉｃ」\n\nとだけ書いてあった。\n\n……「Visual Basic」って、プログラミング言語の名前ですよね？\n\nそれ、著作権を主張したいプログラムの名前じゃなくて言語の名前じゃないですか？？\n\n僕がこの権利者の弁護士だったら、そこ絶対確認するんですけど。してほしかった。","issue":"要するに何が問題だったかというと、これです。\n\n「権利者が著作権を主張するプログラム、いったいどれのこと？」\n\n相手方側の言い分は「そもそも『そのプログラム』が何か認識してない」。\n\nここ大事です。著作権って「具体的な表現物」を守るもので、「なんかすごいアイデア」とか「有能そうな機能」を守るものじゃない。\n\n権利者が「俺のプログラムをパクった」と言っても、「そのプログラムって具体的にどれ？ソースコードは？」という話になる。\n\nここテストに出ます。著作権の侵害を訴えるには「何が著作物か」を特定しなければならない。","ruling":"さあ、裁判所の答えです。\n\n裁判所、かなりはっきり言いました。\n\n権利者は，このプログラムを創作するに至ったアイディアやこのプログラムの機能について主張するが，それらについてのプログラムの著作物としての具体的な表現（ソースコード等）の主張はなく，権利者が職務の空き時間に作成したと主張するこのプログラムについて，具体的な表現としてのプログラムを認めるに足りる的確な証拠はない。そして，相手方がこのプログラムを複製し，売却したことを認めるに足りる的確な証拠もない。\n\n「アイデアは言ってるけど、実際のソースコードが証拠として出てきてない」ということですね。\n\nさらに裁判所はこう続けます。\n\nまた，著作権法上の「プログラム」は，「電子計算機を機能させて一の結果を得ることができるようにこれに対する指令を組み合わせたものとして表現したもの」をいい，プログラムをプログラム著作物として保護するためには，プログラムの具体的記述に作成者の思想又は感情が創作的に表現され，その作成者の個性が表れていることが必要であると解されるところ，権利者は，このプログラムの具体的記述の内容を主張立証していないから，このプログラムの具体的記述の内容を主張立証していないから，このプログラムが著作権法上の「プログラム」に該当するものと認めることはできない。\n\nつまりこういうこと。\n\n「プログラムを著作物として守ってもらうには、そのプログラムの具体的な内容（ソースコード）を出す必要がある。あなたはそれをしてない。なのでプログラムの存在すら認定できない。」\n\n権利者の全請求、棄却されました。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n- 著作権侵害を訴えるには「具体的な著作物の表現」を特定・証拠提出しないといけない。「なんか作った」では話にならない\n- プログラムの著作物性は「創作的な表現」があるかどうかで決まる。ありきたりな書き方だと著作権が認められないこともある\n- 自分が作ったコードは、いつでも「これが俺の著作物です」と出せる状態で保管しておく。Gitのコミット履歴は証拠になりうる\n- 会社が関わる開発なら「誰の著作権か」を最初に契約書で決めておく\n\n「まさか自分が裁判になるとは」と思ってる人が一番危ない。","one_liner":"「俺のコードをパクった」と言うなら、まず「俺のコード」を証拠として出せ。話はそれから。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"元従業員"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"合併先会社"},{"role":"第三者","icon":"👥","side":"third","desc":"自分が開発"}],"lessons":["証拠がないと詰む","著作権は万能じゃない","パクリの立証は地獄"]},{"original_title":"東京地判令2.11.6（中抜き禁止条項違反の違約金条項の有効性）","url":"https://itlaw.hatenablog.com/entry/2021/11/23/203920","court":"東京地判","date":"令2.11.6","year":"令和2年","topic":"中抜き禁止条項違反の違約金条項の有効性","categories":["その他"],"fun_headline":"インフルエンサーに「直接頼んじゃダメですか？」とDMした企業、300万円請求される","hook":"みなさん、「中抜き」って言葉、聞いたことありますよね。\n\n要するに「仲介業者を飛ばして直接取引する」ことです。\n\nで、今日の判例はそれをやって300万円の違約金を請求された話なんですが。\n\nヤバいのは「禁止って知ってたのに、初回利用の直後にやった」という点で。\n\n怖くないですか。怖い。","summary":"・絡んでる金額: 300万円\n・テーマ: 中抜き禁止条項違反の違約金条項の有効性","what_happened":"話を整理しましょう。\n\n原告側はインフルエンサーと企業をつなぐマッチングプラットフォームを運営してました。いわゆるインフルエンサーマーケティングの仲介業者ですね。\n\n被告側はそのプラットフォームと利用契約を結んだ。\n\nで、この契約に「中抜き禁止条項」があって、「プラットフォームを通さずに直接インフルエンサーに依頼したら、過去1年分の利用料か300万円の低いほうを違約金として払え」と書いてあった。\n\nわかりやすく言うと、「うちのサービス使ってインフルエンサーと出会ったら、そのあとも必ずうちを通して依頼してね。直接連絡したら300万円ね」という約束です。\n\n原告側はその契約のもと、平成30年9月にインフルエンサー10人程度に被告側の宣伝業務を依頼した。\n\nここまでは普通の話。\n\nで、ここからがヤバいんですけど。\n\n同年10月。まだ初回利用からひと月も経ってないのに、被告側はインフルエンサーの一人に対してこんなメッセージを送りました。\n\n突然のご連絡失礼致します。先日投稿を依頼した被告側と申します。実は，次回もＴｗｉｔｔｅｒでのプロモーションを考えており，宜しければ同額の報酬で直接依頼をさせて頂きたいと考えております。\n\n……「直接依頼をさせて頂きたい」って書いちゃってる。\n\nここで僕の話をさせてほしいんですけど、僕も昔バイト先で「次から個人的に頼むよ」って言われてなんか嬉しかったことがあって。でもその人はお店からしたら完全にルール違反だったんだと今さら気づきました。話を戻します。\n\nこのメッセージの証拠があったので、中抜き行為は認定。原告側は300万円の違約金を請求しました。\n\n【ちょっと解説】違約金── 「約束を破ったら○○円払います」と事前に決めておく罰金のこと。損害がいくらかを計算しなくていいので、企業間でよく使われる。","issue":"で、何が問題になったかというと──\n\n被告側の言い分は「300万円は高すぎる。うちの実際の利用料金は19万8000円なのに、その15倍以上の違約金は暴利だ。無効にしろ」というもの。\n\nこれって要するに「罰金、高すぎない？」という話ですね。\n\n法律には「公序良俗に反する契約は無効」という考え方があって、要するに「常識的に見てひどすぎる条件は効力がない」ということ。被告側はこれでGetしようとした。\n\nここテストに出ます。違約金が高額でも、それが有効かどうかは「なぜその金額が設定されたか」で決まる。","ruling":"で、裁判所はどう判断したか。\n\n裁判所は「300万円の違約金は有効」と判断しました。理由はこう。\n\nSは，インフルエンサーとインフルエンサーによる広告効果を必要とする企業とのマッチングを行うことを内容とするものであり，利用者は，Sからインフルエンサーの紹介を受け，インフルエンサーに業務を依頼することができる対価として，原告側に利用料金を支払うことが想定されているということができる。そして，原告側において，利用者がSを介することなく直接インフルエンサーとの間でプロジェクトを依頼する等の中抜き行為が行われる場合，利用者がSに対価を支払うことなく，インフルエンサーの紹介を受け，インフルエンサーに業務を依頼できることとなり，ひとたびそのような行為が行われると，その後，もはやSが利用されることは想定し難くなるものであり，Sを継続的に運営していく上で，利用者がこうした中抜き行為を行うことを抑止する必要性は高いというべきである。\n他方，（略），Sを頻繁に利用したり多数のインフルエンサーを募集したりする場合の利用料金が高額となることも考えられ，３００万円を下限とする違約金自体が上記のような場合を含む利用料金一般との関係で不当に高額であるということはできない。\n\n裁判所の言ってることを噛み砕くと、「プラットフォームの価値は人をつなぐことで、一回中抜きされたら事業が成り立たなくなる。だから抑止力として高めの違約金を設定することは合理的」ということ。\n\nさらにこう続きます。\n\nそして，被告側による中抜き行為との関係についてみると，３００万円を下限とする違約金は，本件利用契約における利用料金が１９万８０００円であったこととの対比では比較的高額であるということができるものの，そのように利用料金が比較的低額にとどまったことについては，被告側が本件利用契約に基づき初回の利用をした直後から中抜き行為を行ったことにも原因の一端があるということができる上，前記２のとおり，被告側による中抜き行為は，短期間の間に複数名のインフルエンサーに対して依頼を行うものであって，その態様は悪質な部類に属するというべきであることを踏まえると，被告による中抜き行為との関係でも，上記違約金が不当に高額であるということはできない。\n\n裁判所に「悪質な部類」って言われてしまった。しかも「初回利用の直後から」もしっかり書かれてる。\n\n結果、違約金300万円＋遅延損害金（年14.6%）が満額認容されました。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n- 利用規約・契約書の禁止事項は本当に禁止されてる。「バレなければいい」は通じない\n- 違約金条項は高額でも有効になる場合がある。「払えない金額だから無効」にはならない\n- 初回利用直後に違反するのは「態様が悪質」とみなされる。心証が最悪になる\n- マッチングプラットフォームを使うときは「中抜き禁止条項があるか」を確認してから使う\n\nちなみに全然関係ないけど、「直接交渉しませんか」のDMって証拠として残りやすいですよね。メールも。「口頭で言った」は言い逃れできても、「送信済み」は消えない。","one_liner":"「バレなければOK」は最も高くつく戦略である。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"プラットフォーム運営"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"利用企業"}],"lessons":["規約、読んだ？","金の話は最初にしろ"]},{"original_title":"東京高判令2.11.5（モバゲー規約控訴審）","url":"https://itlaw.hatenablog.com/entry/2021/07/18/101725","court":"東京高判","date":"令2.11.5","year":"令和2年","topic":"モバゲー規約控訴審","categories":["利用規約・消費者"],"fun_headline":"【完全敗訴】「不適切と判断した場合、うちは責任負いません」という規約、裁判所にボコボコにされた話","hook":"アプリをインストールするとき、利用規約って読んでますか。\n\n僕は読んでません。正直に言います。\n\nでも今日の判例を読んで、ちょっとだけ後悔しました。\n\nモバゲーの規約に「当社が不適切と判断した場合、一切損害を賠償しません」って書いてあって、それを適格消費者団体が訴えたら、裁判所にしっかり「ダメ」と言われた話です。\n\n要するに、「そんな条項書いても無効になる場合がありますよ」という話。消費者にとってはいいニュース。","summary":"・テーマ: モバゲー規約控訴審\n・利用規約の問題","what_happened":"ちょっと長くなるけど、大事な話なので付き合ってください。\n\nモバゲーってご存知ですか。DeNA運営のソーシャルゲームプラットフォームですね。\n\n「適格消費者団体元社員側」という組織が会社側を訴えました。\n\n「適格消費者団体」って何かというと、消費者全体のために、ひどい規約や契約を使っている会社を差し止め請求できる特別な団体のことです。個人でなくてもこういう団体が訴えられる。この制度、地味に良くできてると思う。\n\nここで僕の話をさせてほしいんですけど、昔ゲームアカウントが突然BANされて「なんで？」って思ったことがあるんですよ。で、規約見たら「当社の判断でBANできます」って書いてあって納得した記憶があります。あのとき裁判してたら今日の話と似たような結末だったかもしれない。話を戻します。\n\n問題になった規約はこれです。\n\n 7条（会員規約の違反等について）１　M会員が以下の各号に該当した場合，当社は，当社の定める期間，本サービスの利用を認めないこと，又は，M会員の会員資格を取り消すことができるものとします。（略）\n\nで、その「以下の各号」というのが：\n\nａ　個人情報の虚偽・不正登録や重複登録があった場合\n\nｂ　本サービスを1年以上利用しなかった場合\n\nｃ　他のＭ会員に不当に迷惑をかけたと当社が判断した場合\n\nｄ　本規約および個別規約に違反した場合\n\nｅ　その他，Ｍ会員として不適切であると当社が判断した場合\n\nで、さらにこれが問題の条項。\n\n「３　当社の措置によりM会員に損害が生じても，当社は一切損害を賠償しません。」\n\nわかりますか。「ｃ号やｅ号に該当すると判断したらBANできる」＋「それで損害が出ても責任取らない」という組み合わせです。\n\n「当社が判断した場合」というのが極めて広い。「当社がなんとなくアウトと思ったらアウト」ということになりうる。\n\nそして一審（さいたま地判令2.2.5）はこれを「著しく明確性を欠く」として一部違法と認定しました。\n\n会社側は控訴して、問題のｃ号とｅ号に「合理的に」という言葉を足した。\n\n ｃ　他のＭ会員に不当に迷惑をかけたと当社が合理的に判断した場合\n\nｅ　その他，Ｍ会員として不適切であると当社が合理的に判断した場合\n\n「合理的に」を足せばOKになると思ったわけですね。","issue":"要するに、裁判所に聞きたいことはこういうこと。\n\n「合理的に」という文言を追加すれば、免責条項は有効になるのか？\n\n【ちょっと解説】消費者契約法── 事業者と消費者の間の契約で「消費者に一方的に不利な条項」を無効にする法律。パワーバランスの差を考慮して、消費者を守るためにある。","ruling":"さあ、裁判所の答えです。\n\n「合理的に」を足してもダメでした。\n\n裁判所はこう言いました。\n\n 本件規約７条１項ｃ号及びｅ号にいう「合理的に判断した」の意味内容は極めて不明確であり，会社側が「合理的な」判断をした結果会員資格取消措置等を行ったつもりでいても，客観的には当該措置等が控訴人の債務不履行又は不法行為を構成することは十分にあり得るところであり，会社側は，そのような場合であっても，本件規約７条３項により損害賠償義務が全部免除されると主張し得る。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\n裁判所の言ってること、噛み砕きますね。\n\n「合理的に判断した」という言葉があっても、その「合理的」の基準が不明確なままなので、会社側が「合理的」と判断してやったことが客観的には違法な場合もある。でも規約には「損害が出ても責任取らない」と書いてある。これはダメ。\n\nさらに裁判所はこう続けました。\n\nまた，会社側は，会社側が客観的に損害賠償責任を負う場合は，そもそも本件規約７条１項ｃ号又はｅ号の要件を満たさず，したがって，本件規約７条３項により免責されることもないと主張する。しかし，事業者と消費者との間に，その情報量，交渉力等において格段の差がある中，事業者がした客観的には誤っている判断が，とりわけ契約の履行等の場面においてきちんと是正されるのが通常であるとは考え難い。会社側の主張は，最終的に訴訟において争われる場面には妥当するとしても，消費者契約法の不当条項の解釈としては失当である。\n\nつまり「事業者と消費者は情報量も交渉力も全然違う。だから事業者が間違ったことをしたとき、消費者がそれを正せると楽観視できない」ということ。裁判所、めっちゃ庶民の味方をしてる。好き。\n\n会社側の控訴は棄却されました。その後、会社側はｃ号とｅ号を削除したそうです。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n- 「当社が判断した場合」「不適切と認めた場合」のような曖昧な要件＋「一切責任を負わない」の組み合わせは消費者契約法に引っかかる可能性がある\n- 「合理的に」を一語足すだけでは免責条項の問題は解決しない\n- サービスを作る側は、BAN・利用停止の条件をできるだけ明確に書く必要がある\n- 不当な規約を見つけたら、適格消費者団体への相談という手段がある\n\n「同意する」ボタンを押す前に、規約のｃ号とｅ号的な条項がないか確認しよう。","one_liner":"「当社が不適切と判断した場合、一切責任を負いません」は、裁判所に持ち込んだら意外と戦える。","parties":[{"role":"会社側","icon":"🏢","side":"plaintiff","desc":"消費者団体"},{"role":"元社員","icon":"👤","side":"defendant","desc":"DeNA"}],"lessons":["規約、読んだ？","プラットフォームの罠"]},{"original_title":"知財高判令2.10.28（ウェブサイト構成要素の著作権侵害と権利譲渡の合意）","url":"https://itlaw.hatenablog.com/entry/2021/03/21/153153","court":"知財高判","date":"令2.10.28","year":"令和2年","topic":"ウェブサイト構成要素の著作権侵害と権利譲渡の合意","categories":["著作権"],"fun_headline":"【全敗】ウェブサイトを作ったら「著作権はうちのもの」と言われた開発者、控訴したけど全部棄却された話","hook":"フリーランスか受託でウェブサイト作ったことある人、聞いてほしいんですけど。\n\n「納品したら著作権はどっちのもの？」って、ちゃんと決めてますか。\n\n決めてない人、今日の判例を読んで青ざめてください。\n\nウェブサイトを作った人が「著作権は俺のもの、パクるな、差し止めろ、損害賠償払え」と訴えたら、「いや著作権はクライアントのものです」と言われた話です。怖いですよね。怖い。","summary":"・テーマ: ウェブサイト構成要素の著作権侵害と権利譲渡の合意\n・著作権がらみの争い","what_happened":"ちょっと長くなるけど、大事な話なので付き合ってください。\n\n権利者は相手方にウェブサイトの制作を委託されて、権利者のウェブサイト（このウェブサイト）を開発しました。\n\nここ大事。「委託」です。つまりお金をもらって作った。\n\nで、権利者は「相手方がこのウェブサイトをパクって著作権を侵害した」として、差し止めと損害賠償を請求した。\n\nところが一審（原審）では「このウェブサイトに係る著作物の著作権はすべて相手方に帰属する」と判断された。\n\nえっ、でも作ったのは権利者じゃないですか。なんで？\n\nここで僕の話をさせてほしいんですけど、僕も昔バイト中に書いたメモとか、仕事中に書いた企画書とかって、会社のものだと後から気づいたことがあって。「え、これ俺が書いたのに」と思ったけど、まあそういう契約だったんだな、と。全然関係ないか。話を戻します。\n\n「著作権が相手方に帰属」という判断には理由があるはずで、つまり「権利の移転に合意があった」か「最初から相手方のものだった」という話になる。\n\nこの時点で嫌な予感がしますよね。はい、的中です。\n\n権利者は控訴審でさらに請求を追加しようとしたんですが、一部は「訴訟を遅滞させる」として認められませんでした。これもしんどい。\n\nで、ここからがヤバいんですけど。争点がめちゃくちゃ多い。\n\nプログラムの著作物性、データベースの著作物性、ウェブサイトの表示の著作物性、画像・写真の著作物性、著作権の帰属、差し止めの必要性、権利濫用の有無……。\n\n訴えた側も訴えられた側も、全部争った。","issue":"両者の言い分が食い違ったポイントはここ。\n\n大きく分けると2つ。「そのウェブサイトの各要素は著作物として守られるのか」と「著作権はどっちのものか」。\n\n【ちょっと解説】著作物性── 「それ、著作権で保護される『著作物』ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\n具体的な争点は以下のとおり。\n\n- プログラムの著作物性\n- データベースの著作物性\n- ウェブサイトの表示の著作物性\n- 画像・写真の著作物性\n- 著作権の帰属（相手方への移転の有無）\n- 差し止めの必要性\n- 権利者の権利濫用の有無\n\nここテストに出ます。ウェブサイト制作の受託では「各要素が著作物か」と「著作権が誰のものか」は別の問題として考える必要がある。","ruling":"で、裁判所はどう判断したか。\n\n裁判所は原審の判断を基本的に維持しました。\n\nプログラムの著作物性については「創作性の幅が狭い、あるいは証拠が不十分」として認めない判断。データベース、ウェブサイト表示についても同様の傾向で認めなかった部分が多かった。\n\n著作権の帰属については、制作委託の経緯や双方のやり取りから「相手方へのWebサイトの著作権移転の合意があった」または「職務著作に準じた取り扱いが妥当」という方向で判断されました。\n\nつまりこういうこと。「お金をもらって作ったウェブサイトの著作権は、事情次第でクライアントに帰属することがある。」\n\n権利者の全請求は棄却されました。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n- 受託でウェブサイトを作ったら、著作権は「契約書に何が書いてあるか」次第で決まる\n- 「作った俺のもの」は、契約書に明記しないと主張が難しい場合がある\n- 「著作権はクライアントに移転します」と明記した契約書を締結する前に、対価が十分かを確認する\n- ウェブサイト制作の各要素（プログラム、DB、画像）ごとに著作物性と帰属を整理する必要がある\n\nフリーランスで受託開発してる人は今すぐ契約書のひな型を見直してほしい。ほんとに。","one_liner":"「作った俺のもの」を法律的に通すには、契約書に書いておくしかない。","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"Web制作会社"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"発注者"}],"lessons":["契約書読んどけば…","証拠がないと詰む","著作権は万能じゃない"]},{"original_title":"東京地判令2.10.13（カード情報漏洩事故におけるベンダの責任（否定））","url":"https://itlaw.hatenablog.com/entry/2023/11/02/211456","court":"東京地判","date":"令2.10.13","year":"令和2年","topic":"カード情報漏洩事故におけるベンダの責任（否定）","categories":["PM・開発管理","セキュリティ","責任・損害"],"fun_headline":"【7800万円】カード情報漏洩でベンダを訴えたら「それはあなたの責任では？」と言われた件","hook":"クレジットカードの情報が6500件漏れました。\n被害額は7800万円です。\nで、開発したベンダを訴えました。\n\nここまで聞くと「そりゃベンダが悪い」って思いますよね。\n思いますよね？\n\n裁判所は「いや待って」って言ったんですよ。","summary":"・絡んでる金額: 7800万円\n・テーマ: カード情報漏洩事故におけるベンダの責任（否定）\n・プロジェクト管理の問題","what_happened":"話を整理しましょう。\n\n発注側が運営するＥＣサイトで、顧客のクレジットカード情報が漏れた可能性があると指摘されました。\n発注側はあわててカード決済機能を止めました。正しい判断だと思います。\n\nその後フォレンジック調査、つまり「デジタル鑑識」みたいなやつをやったんですね。\nその結果わかったこと:\n\n- 不正アクセスがあった\n- カード情報はサーバのログに「暗号化されて」入ってた\n- でも復号できる状態だった（暗号化の意味が半分しかない）\n- 漏洩した情報は最大約6500件\n\nここでちょっと僕の話をさせてください。\n僕、昔パスワードを「password123」にしてたことがあって。\nセキュリティ研修で「これが最悪の例です」って出てきたやつそのままでした。\nその節は大変ご迷惑をおかけしました。話を戻します。\n\nで、発注側は開発側に「このサイト、あんたが作ったやろ。あんたが保守してたやろ。だから損害賠償払え」と請求しました。\n金額は約7800万円。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。ラーメン屋で「カレーください」と頼んで、カレーが来なかったら契約違反。\n\nでですね、保守管理の契約金額が気になるんですよ。\n1か月5万円。\n\nちょっと待って。\n1か月5万円の保守で7800万円の責任を取れって言ってるわけですよね？\nこれ、居酒屋で1000円のコース料理頼んで「今夜の全飲み代を払え」って言うみたいな話じゃないですか。","issue":"で、問題になったのはここです。\n\n発注側の言い分:「保守管理契約を結んでいたんだから、セキュリティ対策する義務もあったはず。義務違反だ！」\n\n開発側の言い分:「月5万円の契約でそこまで頼まれてませんけど？」\n\nここテストに出ます。\n\n要するに争点は「安い保守契約で、どこまでの義務を負うか」という話です。\n月5万円のコースで、フルコース相当の責任は負うのか。\n\n裁判所はこの点についてこう言いました。\n\n発注側は，開発側が，低コストでこのサイトの安定稼働に必要な保守及び運営に係るサービスを提供するものであることを認識しつつ，１か月５万円（消費税別）という低額の料金に相当する作業を委託したことが認められ，このソフトウェア及び本件決済モジュールにつき新たな不具合等が判明したなどの事情もないのに，開発側において，本件請負契約に基づき負うことがなかった義務を，本件保守管理契約に基づき新たに負うものとは解されない。","ruling":"裁判所はこう言いました。\n\n「月5万円の保守契約なんだから、それ以上の義務は負わないよね。発注側の請求は全部棄却。」\n\nということで決着。\n\n裁判所、めちゃくちゃ冷静。好き。\n\n「低コストだって発注側は知ってたよね？ なのに高コストの義務を後から要求するのはおかしくない？」\nこれを法律的にきっちり言ってるわけです。\n\nちなみに全然関係ないけど、「月5万円の保守」って何をやってくれるんですかね。\n1日あたり換算すると約1666円。\nコンビニのお弁当1個より安い。\nお弁当1個でECサイトの安全を守る時代ですよ。怖すぎる。\n\n発注側の請求はすべて棄却されました。7800万円の請求、全部ノーです。","takeaway":"で、結局なにが大事なの？\n\n- 契約書に「何をやるか」を具体的に書く。「保守します」だけじゃ何もわからない\n- 料金と責任範囲はセットで決める。安い契約で大きい責任は原則認められない\n- セキュリティ要件は最初に合意する。「なんとなく安全にしといて」は通用しない\n- 重要システムの保守に月5万円は再考した方がいい。絶対に再考した方がいい\n\n月5万円の保守で7800万円の責任を問おうとした話でした。\n契約書は「お互いの期待値のすり合わせ」なんです。おばあちゃんもそう言ってた。","one_liner":"安い契約で大きな責任は取れない。コンビニ弁当代でフルコースを要求するな。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ECサイト運営"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ベンダ"}],"lessons":["セキュリティ甘すぎ","「完成」って何？"]},{"original_title":"東京地判令2.9.24（インスタグラム・ストーリーの投稿と肖像権侵害）","url":"https://itlaw.hatenablog.com/entry/2020/11/23/223802","court":"東京地判","date":"令2.9.24","year":"令和2年","topic":"インスタグラム・ストーリーの投稿と肖像権侵害","categories":["プライバシー","ネット・コンテンツ"],"fun_headline":"【24時間で消えるはずが】インスタストーリーのスクショを別サイトに貼ったら肖像権侵害になった件","hook":"みなさん、インスタのストーリーって使ってますか。\n\n24時間で消えるやつ。\n「消えるから気軽に投稿できる」って感じで使ってる人、多いと思うんですよ。\n\nでも今日の話を聞いたら「え、そうなの？」ってなります。\n消えるはずのものが、消えなかった話です。","summary":"・テーマ: インスタグラム・ストーリーの投稿と肖像権侵害\n・ネット上の問題","what_happened":"ちょっと長くなるけど、大事な話なので付き合ってください。\n\nまず登場人物の整理をします。\n\n- XA：動画を撮った人（夫）\n- XB：動画に映った人（妻）\n- 氏名不詳者：スクリーンショットを撮ってどこかに貼った謎の人物\n- Y：そのサイト（プロバイダ）\n\nXAがXBの動画を撮って、インスタのストーリーにあげました。\nストーリーだから24時間で消えます。\n夫婦間での普通のやりとり、ですよね。\n\nここで僕の話をさせてほしいんですけど。\n僕、友達との写真をよくインスタにあげてるんですけど、「これ、誰かにスクリーンショットされてるかも」なんて考えたことなかったんですよ。\n考えたことなかった、というか、考えたくなかったのかもしれない。\n話を戻します。\n\nで、何者かがこの動画の一部をスクリーンショットして、別のサイトに貼ったんですね。\n\n怖すぎる。\n\nXBはプロバイダに「誰がこれを投稿したか教えて（発信者情報の開示）」と求めました。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問えるやつ。\n\n争点はこれです。\n「もともと夫がインターネットに投稿したものなんだから、肖像権侵害にならないんじゃないの？」\nつまり「自分から公開したものでしょ？」という主張があったわけです。\n\nここからがヤバいんですけど。","issue":"要するに何が問題だったの？\n\n著作権侵害はほぼ争いなし（勝手にスクショして貼り付けたらアウト、これはわかりやすい）。\n\n問題は肖像権のほうです。\n\n「XBはもともとインスタに投稿された動画に映ってた。つまり自分からネットに出てたわけで、肖像権侵害が成立するの？」\n\nここテストに出ます。\n\nポイントは「ストーリーの24時間限定投稿」というところ。\nXBは「24時間で消える形での公開」には許諾していたけど、それ以降も無制限に使われることは許諾していなかった。\nこの違いが決め手になりました。","ruling":"裁判所はこう言いました。\n\n肖像権の侵害を認めました。\n\n 人の肖像は，個人の人格の象徴であるから，当該個人は，人格権に由来するものとして，これをみだりに利用されない権利を有する。そして，当該個人の社会的地位・活動内容，利用に係る肖像が撮影等されるに至った経緯，肖像の利用の目的，態様，必要性等を総合考慮して，当該個人の人格的利益の侵害が社会生活上受忍の限度を超える場合には，当該個人の肖像の利用は肖像権を侵害するものとして不法行為法上違法となると解される。\n\nつまりこういうこと。\n「受忍の限度を超えるか」で判断する。\n我慢できる範囲かどうか、ですね。\n\nこれを本件についてみると，この画像は，XＢを被撮影者とするものである。この画像が含まれるこの動画の撮影及びそれをインターネット上の投稿サイトに投稿したのはXＡであり，XＢは夫であるXＡにこれらの行為を許諾していたと推認され，この画像の撮影等に不相当な点はなく，氏名不詳者は上記投稿サイトからこの動画を入手したものではある。しかしながら，この動画は２４時間に限定して保存する態様により投稿されたもので，その後も継続して公開されることは想定されていなかったと認められる上，XＢが，氏名不詳者に対し，自身の肖像の利用を許諾したことはない。XＢは私人であり，この画像はXＢの夫であるXＡが本人側らの私生活の一部を撮影したこの動画の一部である。そして，この画像は，XＡの著作権を侵害して複製され公衆送信されたものであって，この投稿の態様は相当なものとはいえず，また，別紙投稿記事目録記載の投稿内容のとおりの内容に照らし，この画像の利用について正当な目的や必要性も認め難い。これらの事情を総合考慮すると，この画像の利用行為は，社会生活上受忍すべき限度を超えるものであり，XＢの権利を侵害するものであると認められる。\n\n「24時間で消える」って設定で投稿したものを、無制限に使われるのは許諾してないよね。ということです。\n\n裁判所、正しいことを言ってる。すごく正しいことを言ってる。","takeaway":"で、結局なにが大事なの？\n\n- インスタのストーリーは「消える」が「消せる」ではない。スクリーンショットされたら終わり\n- 「ネットに一度でも出した」＝「何をされても許諾した」にはならない。許諾の範囲がある\n- 他人が映った画像・動画を許可なく転載するのは、肖像権侵害になり得る\n- 自分が撮った写真でも、映ってる人の許諾が必要なことがある\n\nインターネットに出したものがどこに行くかは、誰にも制御できないです。\n「24時間で消えるから大丈夫」という気持ちはよくわかるんですけど。","one_liner":"ストーリーは消えても、スクショは消えない。インターネットはそういう場所。","parties":[{"role":"本人側","icon":"👤","side":"plaintiff","desc":"被撮影者ら"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"プロバイダ"}],"lessons":["証拠がないと詰む"]},{"original_title":"東京地判令2.9.24（準委任契約における報酬請求と善管注意義務違反）","url":"https://itlaw.hatenablog.com/entry/2022/03/24/001127","court":"東京地判","date":"令2.9.24","year":"令和2年","topic":"準委任契約における報酬請求と善管注意義務違反","categories":["契約・報酬"],"fun_headline":"【1766万円請求したら逆に235万円払えと言われた】ITベンダの善管注意義務違反、その全貌","hook":"突然ですが、みなさんは「善管注意義務」って知ってますか。\n\n読み方は「ぜんかんちゅういぎむ」です。\n漢字が8文字もある。怖い。\n\n今日はこれをめぐって「俺は1766万もらう権利がある」「いや逆にお前が235万払え」という喧嘩が起きた話です。\n\n結末が予想外なので最後まで読んでください。","summary":"・絡んでる金額: 367万円\n・テーマ: 準委任契約における報酬請求と善管注意義務違反\n・契約とお金の話","what_happened":"で、何が起きたかというと。\n\nイベント企画会社元社員側が、イベント管理システムの開発を会社側に頼みました。\n\n2016年3月に会社側は開発を始めたんですね。\nここが重要なんですけど——\n\n「契約書がなかった」\n\nいや、そうはならんやろ。なっとるやないか。\n\n4月になってようやく契約書が取り交わされました。\n\n【ちょっと解説】準委任（じゅんいにん）── 「結果は約束しないけど、プロとしてちゃんとやります」という契約。美容院で「いい感じにしてください」と頼む感じ。SES契約はだいたいこれ。\n\nその契約書にはこう書いてありました。\n\n1条2項\n\nこの契約は，会社側が（中略）業務に従事する技術者の労働を元社員側に対し提供することを主な目的とし，民法上の準委任契約として締結されるものとする。したがって会社側は，善良なる管理者の注意義務をもって（中略）業務を実施する義務を負うものとし，原則として成果物の完成についての義務を負うものではないものとする。\n\n3条3項\n\n前各項にかかわらず，元社員側は，会社側のこのサービスの業務遂行義務が果たされていないと判断した場合はその時点で会社側に改善通達を行い，尚も改善されない場合はその通達以降のサービス料の支払義務を負わない。\n\n「完成義務はないけど、プロとしてちゃんとやれよ」ということですね。\n美容師さんが「いい感じにします、ただし綺麗になる保証はしませんが、技術者として最善は尽くします」みたいな立場です。\n\nここで僕の話をさせてほしいんですけど。\n僕、美容院でオーダーするのが苦手で、いつも「適当によろしく」って言ってしまうんですよ。\nで、出てくる結果が毎回「適当」なんですよ。そりゃそうか。\nプロに丸投げするなら、せめて期待値は言語化しないといけないなあと思ってます。\n話を戻します。\n\n3月から5月の発注書の合計は約1766万円（支払われていない）。\n5月25日、元社員側が「開発が遅れてるから中止します」と通知。\n\n会社側「払え（1766万円）」\n相手方「逆に損害賠償を払え（7000万円）」\n\nこの喧嘩、裁判になりました。","issue":"ここからが法廷バトルの核心部分。\n\n「会社側は善管注意義務を果たしたのか」がメインの問いです。\n\n善管注意義務というのは「その道のプロなら当然気をつけるでしょ」という義務のことです。\nITベンダなら、スケジュール管理や工程管理をちゃんとやれよ、という話。\n\nで、裁判所が認定した会社側の義務はこれです。\n\n会社側は，コンピューターシステムのプログラミング等を事業とする株式会社であり，開発業務を担当することが可能な企業としてこのシステムの開発に参画しているところ，開発の着手から間もない時期に開発に必要となる作業項目及び作業期間を示したスケジュール表を作成し，その中で内部設計に分類される「データベース設計」等の３項目を自ら担当することを明らかにしている。会社側は，その後も，このシステムの開発に必要となる作業項目や作業期間を明らかにしたタスク一覧やスケジュール表といった文書を作成し，これを元社員側に示している。これらの事情によれば，会社側は，この契約上，このシステムの開発に向けて必要となる作業項目及び作業期間を明らかにした工程表を策定すべき立場にあり，また，④詳細設計においても，相当程度関与することが予定されていたものと認められる。\n\nこのような会社側の立場や役割に照らせば，会社側は，相手方又は第三者から指示を受けた業務を実施する義務にとどまらず，この契約上の善管注意義務として，このシステムの開発において必要となる作業の内容並びにその作業に必要となる期間及び人員を把握し，適切な工程を示す義務を負っており，相手方から示された仕様の内容が十分でなく，適切な工程を示すことが困難である場合には，仕様を確定する期限を定めるなどの具体的方策を講ずる義務を負っていたと解すべきである。\n\nつまりこういうこと。\n「スケジュール管理をちゃんとやるのがあなたの仕事。仕様が決まらないなら、仕様を決める期限を設定する義務もあった。」","ruling":"さあ、裁判所の答えです。\n\n会社側の義務履行状況について、裁判所が認定したこと:\n\n- 3月時点のスケジュール表に仕様確定期限がなかった\n- 103項目のうち期限までに終えたのは35項目（66%が未完）\n- 再計画後もスケジュールが守られなかった\n- 5月に人員を大量増強したが、稼働には至らなかった\n\nそしてこう言いました。\n\n以上によれば，会社側が，このシステムの開発において必要となる作業の内容並びにその作業に必要となる期間及び人員を把握し，適切な工程を示したとは認められないから，この契約における善管注意義務に違反したというべきである。\n\n義務違反、認定されました。\n\n「ここ大事なとこなんで簡単に言うと」\n会社側の報酬請求は全額認容（1766万円もらえる）だが、相手方への会社側の義務違反も認定された。\n損害として約235万円の支払いが命じられました。\n相手方の反訴の逸失利益（7000万円の大部分）は認められず。\n\n【ちょっと解説】逸失利益── 「あの事故がなければ得られたはずの利益」。システムが止まってる間の売上損失とか。裁判で認められることは少なくて、今回も否定されました。\n\n会社側は1766万円をもらいつつ、235万円を払うという結果でした。\nトータルでは会社側が勝ちに近いんですが、義務違反の認定はされたという、なんとも複雑な結末。","takeaway":"で、結局なにが大事なの？\n\n- 「準委任でも工程管理の義務はある」。完成義務がないからといって、スケジュール管理を怠っていいわけではない\n- スケジュールが遅れそうなら、早めに「仕様を決める期限」を設定して相手に提示する\n- 無断再委託はダメ。絶対。これも債務不履行として認定された\n- 逸失利益（「あったはずの利益」）は裁判でなかなか認められない。証明が難しい\n\n契約の種類と義務の範囲、最初にきっちり確認しましょう。\n「準委任だから完成責任ない」は正しいけど、「だから何もしなくていい」は全然正しくない。","one_liner":"準委任でも怠惰は義務違反。「成果を保証しない」は「手を抜いていい」ではない。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"イベント企画会社"},{"role":"会社側","icon":"🏢","side":"plaintiff","desc":"システム会社"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["契約書読んどけば…","「完成」って何？","損害、証明できる？"]},{"original_title":"最判令2.7.16（リツイートと氏名表示権侵害）","url":"https://itlaw.hatenablog.com/entry/2020/07/22/231952","court":"最判","date":"令2.7.16","year":"令和2年","topic":"リツイートと氏名表示権侵害","categories":["ネット・コンテンツ"],"fun_headline":"【最高裁が判決】リツイートしただけで著作権侵害になるって、え、本当に？","hook":"ちょっと待ってこれ聞いたら驚くから。\n\nリツイートしただけで、著作権侵害になる場合があります。\n\nえ？ って思いましたよね。\n思いましたよね？\n\nしかも最高裁が言ってるんですよ。これ。","summary":"・テーマ: リツイートと氏名表示権侵害\n・ネット上の問題","what_happened":"で、何が起きたかというと。\n\n職業写真家の請求側がいます。\n請求側の写真を、誰かがツイッターのプロフィール画像に無断で使いました（アカウントA）。\nさらにその写真を含むツイートを、アカウントBがしました。\nさらにそれを、アカウントCらがリツイートしました。\n\n請求側はツイッター社に「誰がやったか教えて（発信者情報の開示）」と求めました。\n\nわかります？ この構造の怖さ。\n\n「リツイートしただけの人まで責任追及されてる」んですよ。\n\nここで全然関係ない話なんですけど。\n僕、Twitterで面白い画像をリツイートするのが趣味なんですけど、この判決を読んでから手が止まるようになりました。\n「これ、誰が作った画像なんだろ」って毎回考えるようになった。\n習慣って変わるもんですね。\n話を戻します。\n\n【ちょっと解説】公衆送信権── 著作権の一種。著作物をインターネット等で公衆に送信する権利。無断でネットにアップすると侵害になる。\n\n一審（東京地判）はリツイートによる著作権侵害を否定。\n原審（知財高判）では、リツイートの際に画像がトリミングされて著作者の名前が消えることが問題視され、氏名表示権侵害と同一性保持権侵害が認められました。\n\nで、最高裁まで争われたわけです。","issue":"要するに何が問題だったの？\n\n写真の元の画像には著作者（請求側）の名前が表示されてたんです。\n\nでも、リツイートされてタイムラインに表示されると、Twitterの仕様でトリミングされて、著作者の名前の部分が切れてしまう。\n\n「リツイートした人、お前が著作者の名前を消したことになるんじゃないの？」\n\nこれが問題です。\n\nリツイートした人の主張:「クリックすれば元の画像で著作者名が見えるじゃん。」\n\nここテストに出ます。\n「クリックすれば見える」は「表示した」と言えるのか。","ruling":"最高裁はこう言いました。\n\n原審維持。リツイートによる氏名表示権侵害、認められました。\n\n 本件各リツイート記事中の本件各表示画像をクリックすれば，本件氏名表示部分がある本件元画像を見ることができるとしても，本件各表示画像が表示されているウェブページとは別個のウェブページに本件氏名表示部分があるというにとどまり，本件各ウェブページを閲覧するユーザーは，本件各表示画像をクリックしない限り，著作者名の表示を目にすることはない。また，同ユーザーが本件各表示画像を通常クリックするといえるような事情もうかがわれない。そうすると，本件各リツイート記事中の本件各表示画像をクリックすれば，本件氏名表示部分がある本件元画像を見ることができるということをもって，本件各リツイート者が著作者名を表示したことになるものではないというべきである。\n\nつまりこういうこと。\n「クリックすれば見えるとしても、普通の人はクリックしない。タイムラインで見る時点で著作者名が消えてたら、消した扱いになる。」\n\n裁判所、めちゃくちゃ実態に即した判断してる。好き。\n\nあ、今思い出したんですけど。\n僕、昔インスタで誰かの料理写真をスクショして「今日の晩ごはんです」ってLINEで送ったことあるんですよ。\n完全にアウトですよね。本当に申し訳なかったと思ってます。\n話を戻します。","takeaway":"で、結局なにが大事なの？\n\n- リツイートも著作権侵害になり得る。「シェアしただけ」は免責にならない\n- 「クリックすれば見える」は「表示している」と同じではない。タイムラインで見える状態が重要\n- 写真には著作者名が必要。自分の作品をネットで公開するときは著作者名を入れよう\n- 他人の写真をSNSで使うときは許可を取る。当たり前のことが当たり前に問われる\n\nSNSは「みんながやってるから大丈夫」が通用しない世界になってきています。\nリツイートの前に一秒考えるクセをつけましょう。","one_liner":"リツイートは「シェア」じゃなく「複製」かもしれない。最高裁がそう言ってる。","parties":[{"role":"請求側","icon":"💼","side":"plaintiff","desc":"職業写真家"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"Twitter社"}],"lessons":["著作権は万能じゃない","プラットフォームの罠"]},{"original_title":"東京地判令2.6.15（先行開発と報酬請求の可否）","url":"https://itlaw.hatenablog.com/entry/2022/02/19/121322","court":"東京地判","date":"令2.6.15","year":"令和2年","topic":"先行開発と報酬請求の可否","categories":["契約・報酬"],"fun_headline":"【悲報】「契約書ないけど開発しといたから払って」→「知らん」→「じゃあ裁判で」の全記録","hook":"お金の話って、だいたいめんどくさいですよね。\n\nでも今日の話はめんどくさいを超えてます。\n\n「契約書なしで開発を始めたら、あとで『払わん』と言われた」という話です。\n\nこれ、他人事じゃないですよ。\nIT業界にいる人なら、似たような状況、一度は経験してませんか。","summary":"・絡んでる金額: 2415万円\n・テーマ: 先行開発と報酬請求の可否\n・契約とお金の話","what_happened":"で、何が起きたかというと。\n\n登場人物を整理します。\n\n- X：IT会社（車載通信の開発をしたい）\n- Y：車載ディスプレイのミドルウェア会社\n- D：開発側のえらいひとB（開発本部長）\n\n2012年9月に、発注側と開発側は業務委託の基本契約を結びました。\n「個別の仕事は、注文書のやり取りで決める」という内容でした。\n\nでも、開発側からの具体的な発注がなかなか来ない。\n\n発注側は「じゃあ自社製品として先に作っとこ。開発側と連携して売れればいい」という判断をしました。\n\nちょっとここで深呼吸しましょう。\n\nこれ、わかりますか。\n「お金ももらってないのに開発を始めた」んです。\n発注側の気持ち、わかる。わかるけど。つらい。\n\nその後の展開が壮絶で。\n\n- 開発側に費用折半の覚書案を出した → 押印拒否された\n- 表現を和らげた覚書案を出した → 担当Dさんが開発側の社印じゃなく個人印で署名してくれた\n- 決算期が近づいたので「決算のための書類だから、払わなくていいから預かってほしい」と請求書を出した\n- Dさんは「応じられないけど、まあ預かる」と受け取った\n\nここで僕の話をさせてください。\n僕、昔バイト先に「今月の給料、来月まとめて払えばいいよ」って言ったことがあるんですよ。\nそしたら「え、そういう話になってたっけ？」と言われました。\n「まとめて払う」の合意が取れていなかった。\nお金の話は明示的にしないとダメだと身に沁みました。\n話を戻します。\n\n【ちょっと解説】検収（けんしゅう）── 「確認しました、OKです」と納品物を正式に受け取ること。これが終わると基本的に「やっぱダメ」とは言いにくくなる。\n\n発注側は最終的に2415万円の半額（約1207万円）や、相当額報酬や損害賠償など、様々な形で請求しました。","issue":"で、何が問題になったかというと。\n\n（１）主位的請求：「費用を折半するという合意があったはず」→ 合意は成立してたか？\n\n（２）予備的請求１：合意がなかったとしても、商法の「相当額報酬」が認められるか？\n\n（３）予備的請求２（契約締結上の過失）：開発側は「やる」と思わせておいて、突然やめた。これは不法行為では？\n\n【ちょっと解説】契約締結上の過失── 契約の交渉段階でのやらかし。「やるやる」と言って期待させておいて「やっぱやめた」みたいなケース。\n\n（３）について発注側の主張は:\n- 開発側はちゃんと契約しようとする義務を怠った（A）\n- 発注側を開発側との間で誤解させるような行為をして、損害が広がらないようにする義務も怠った（B）","ruling":"いよいよ判決です。\n\n裁判所はこう判断しました（ざっくり言うと）。\n\n（１）主位的請求：「折半の合意はなかった」→ 認められず\n\n（２）予備的請求１：\n- 基本契約には「注文書で個別契約を成立させる」という手続きがあった\n- 今回はその手続きを踏んでいない\n- 「決算のためだから払わなくていい」と自分で言ってた\n- よって相当額報酬の請求も認められず\n\n（３）予備的請求２：\n- Dの個人印による署名の意味について、発注側がどう解釈したかが問題\n- 裁判所は「開発側の担当者が開発側を代表して契約を締結したと信じ込んだとまでは言えない」と判断\n- つまり「騙された」とは言いにくい状況だった\n- 結果：この請求も認められず\n\n発注側の全請求が棄却されました。\n2415万円の半額を請求しようとして、ゼロでした。\n\n裁判所の判断、めちゃくちゃ厳しいけど、筋は通ってる。","takeaway":"で、結局なにが大事なの？\n\n- 「先行開発」は原則、自己責任。相手の合意なしに始めた開発費は回収できないと思え\n- 口約束・個人印・「預かっといて」では合意の証明にならない\n- 基本契約に「注文書で個別契約を成立させる」とある場合、注文書なしの仕事はリスクが極めて高い\n- 「まあ後で精算しよう」は地獄の始まり。金額と支払い条件は最初に確認する\n\n契約書はラブレターより丁寧に書いたほうがいい。マジで。","one_liner":"「やってから請求」は通用しない。契約なき先行開発は寄付と同じ。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"開発会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"車載機器会社"}],"lessons":["契約書読んどけば…","「完成」って何？","金の話は最初にしろ"]},{"original_title":"東京高判令2.3.25（ベネッセ事件（弁護団）高裁）","url":"https://itlaw.hatenablog.com/entry/2022/09/05/233851","court":"東京高判","date":"令2.3.25","year":"令和2年","topic":"ベネッセ事件（弁護団）高裁","categories":["その他"],"fun_headline":"【実録】4000万人分の個人情報を漏らした結果、慰謝料が「1人あたり1000円」だった件","hook":"これ聞いたら驚くから。\n\n4000万件の個人情報が漏れました。4000万ですよ。日本人の3人に1人です。\n\nで、裁判所が認めた慰謝料、いくらだと思います？\n\n1人あたり1000円です。\n\nコンビニのコーヒーより安い。","summary":"・絡んでる金額: 1000円\n・テーマ: ベネッセ事件（弁護団）高裁","what_happened":"順を追って説明しますね。\n\n通信教育で有名なベネッセって会社があるじゃないですか。そこが個人情報の管理をシンフォームって会社に委託してたんですよ。\n\nでシンフォームがさらに別の会社に再委託して、そのまた先の会社の従業員Aが「私物のスマホで情報ごっそり持ち出して売り飛ばす」という暴挙に出たわけです。\n\n【ちょっと解説】不正競争防止法── 営業秘密の持ち出しや商品の模倣など、ズルい競争方法を規制する法律。略して「不競法」。Aはこれで有罪になってます。\n\n手口がまたヤバくて。会社から貸与されたPCでデータベースにアクセスして、個人情報をPCに保存して、USBケーブルで私物スマホに転送したんですよ。\n\nちょっと待ってください。USB経由での転送に制限かけてなかったの？と思うじゃないですか。\n\nかけてたんですよ、MSCっていう方式には。でもMTPっていう別の方式は制限してなかった。Aはそこを突いた。\n\nここで僕の話をさせてほしいんですけど、昔バイト先でパスワードを「tanaka1234」にしてた上司がいて、「それ大丈夫ですか」って言ったら「誰も知らんから大丈夫」って言われたことがあります。話を戻します。\n\nで、漏れた件数が4000万件ともいわれてるわけです。4000万ですよ。教育関連会社500社以上に情報が流出したって報道もあった。\n\nこれで各地で大量の損害賠償訴訟が起きます。まあそりゃそうですよね。\n\nで、ここからがヤバいんですけど。\n\n最初の大阪の裁判では「損害の立証がない」として請求が棄却されたりもしてます。漏らされた側がもっとひどい目に遭ってるのに。\n\nその後最高裁で差し戻しになって、大阪高裁が出した結論が「1人あたり1000円」。\n\n原告の気持ち、わかる。めっちゃわかる。つらい。\n\nで今回の判決は、「ベネッセ個人情報漏えい被害対策弁護団」が起こした第2次・第5次訴訟の控訴審。1審では被告ベネッセの責任は否定されて、シンフォームだけ責任あり、慰謝料3300円って結論でした。","issue":"要するに何が問題だったの？\n\nメインの争点は「損害額いくらが妥当か」です。\n\n1審が認めた3300円が高いか低いか、という戦いです。\n\nちょっと待って。「3300円が高いか低いか」の裁判をしてるんですよ。コンビニのアイスが買えるかどうかくらいの金額で高裁まで争ってるんですよ。\n\n法律ってそういうもんなのかもしれないですけど、なんか……すごいですよね。\n\n情報の性質について裁判所はこんな風に評価しました。\n\n本件漏えいによって，一審原告らの氏名，性別，生年月日，郵便番号，住所，電話番号，ファクシミリ番号，メールアドレス，出産予定日及び保護者の氏名といった情報が漏えいしたものであるところ，このうち，氏名及び郵便番号・住所，電話番号，ファクシミリ番号及びメールアドレスについては，これらの情報を取得した者において，これらを取得された者に対する連絡が可能となり，また，同情報の使用方法によっては，取得された者の私生活の平穏等に一定の影響が及ぶおそれがある。（略）これらの情報が不正に漏えいした場合には，自己の了知しないところで自己の個人情報が漏えいしたことへの私生活上の不安，不快感及び失望感を生じさせたものとして，精神的損害が生じたと認めるのが相当である。\nもっとも，出産予定日を除くこれらの情報は，人が社会生活を営む上で一定の範囲の他者に開示することが予定されている個人を識別するための情報又は個人に連絡をするために必要な情報でもあるため，思想・信条，病歴，信用情報等とは異なり，個人の内面等に関わるような秘匿されるべき必要性が高い情報とはいえない。また，出産予定日については，予定日にすぎないので，秘匿されるべき必要性の程度が相対的に低い。（略）\nなお，一審原告らは，未成年の一審原告らに関しては，不安，不快感がこれから一生付きまとうなどして，精神的苦痛は成年者とは異なるとも主張するが，本件漏えいによる影響の期間は，成年者であるか未成年者であるかを問わず，個別の事情によるところが大きい一方，自己の了知しないところで自己の個人情報が漏えいしたことへの不安，不快感の程度は，成年者であるか未成年者であるかは問わず，異なるものとはいえないため，成年原告と未成年原告とで精神的損害の程度を格別に扱う理由までを見いだすのは困難であるので，同主張は採用しない。\n\n要約すると「名前とか住所とか電話番号は確かに漏れたら嫌だけど、超プライベートな情報とは言えない。出産予定日もまあ予定だし」ということです。\n\nめちゃくちゃ冷静。裁判所、めっちゃ冷静。好き。\n\nちなみに実害については、ダイレクトメールが増えた気がする程度で、財産的な実害は認められなかったとされてます。","ruling":"いよいよ判決です。\n\n高裁は1審の判断を基本的に維持しつつ、細かいところを調整しました。\n\nベネッセの事後対応については裁判所はこう述べています。\n\nそして，一審被告ベネッセの持ち株会社である株式会社ベネッセホールディングスは，本件漏えいの発覚後に直ちに対応を開始し，情報漏えいの被害拡大を防止する手段を講じ，監督官庁に対する報告及び指示に基づく調査報告を行い，情報が漏えいしたと思われる顧客に対し，本件通知書を送付するとともに，顧客の選択に応じて５００円相当の謝罪品の交付を申し出るなどしている。\n\nつまり「ちゃんと事後対応したことは評価する」という話です。\n\n500円の謝罪品……。もらった人のリアクションが気になりすぎる。\n\nで結論として、認められた慰謝料が1人あたり1000円です。\n\nシンフォームに対しては慰謝料1000円＋弁護士費用100円で計1100円の支払いを命じています。\n\nなお、今回の訴訟で弁護団が追加で主張していた「二次被害」への慰謝料は認められませんでした。\n\n4000万人に、1000円ずつ配るとしたら……400億円ですよ。金額の規模感がおかしくなってきましたね。","takeaway":"で、結局なにが大事なの？\n\n- 個人情報は漏らしたら終わり、じゃなく「その後の対応」も評価される。ベネッセは即時対応と謝罪品で少し有利になってます\n- 再委託の連鎖は本当に危ない。自分が管理してない先で何が起きるか、把握できてる？\n- 損害額は「実害があるか」で決まる。不安感だけでは高額は取れない。逆に言うと、実害が出たら記録を残すと大事\n- USB制限は「全部の方式」に適用しておけ。MSCだけ制限してMTPが開いてたのが命取りでした\n\n1000円という金額で「じゃあ個人情報漏らしてもたいしたことないじゃん」と思わないでください。4000万件×1000円＝400億円のポテンシャルがあるわけです。企業は死にます。","one_liner":"個人情報は漏らした瞬間に負け。いくら対応しても慰謝料1000円にしかならない世界で戦うな。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"個人情報漏洩被害者"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"ベネッセ"}],"lessons":["証拠がないと詰む","秘密は管理してナンボ","損害、証明できる？"]},{"original_title":"東京地判令2.3.19（メニュー構成の編集著作物性）","url":"https://itlaw.hatenablog.com/entry/2020/04/27/232845","court":"東京地判","date":"令2.3.19","year":"令和2年","topic":"メニュー構成の編集著作物性","categories":["著作権"],"fun_headline":"【衝撃】「うちのメニュー画面、パクられた！」→裁判所「それ著作権で保護されません」←えっ","hook":"みなさん、自分が作ったアプリのUIって、著作権で守られてると思ってますか？\n\n僕は守られてると思ってました。さっきまでは。\n\nこの判例読んで、「あ、そうじゃないことがあるんだ」ってなりました。\n\nちょっと待ってこれ聞いたら驚くから。2400万円かけて裁判したのに、全部棄却されたんですよ。","summary":"・絡んでる金額: 2400万円\n・テーマ: メニュー構成の編集著作物性\n・著作権がらみの争い","what_happened":"順を追って説明しますね。\n\nXって会社が「LINE@を使ったマーケティングツール」を作ったんですよ。で、似たようなツールを作って売ってるYって会社に「パクっただろ！」って訴えた話です。\n\n【ちょっと解説】公衆送信権── 著作権の一種で、著作物をインターネットで公衆に送信する権利のこと。無断でネットにアップすると侵害になる。\n\n権利主張側が「うちのはオリジナルだ」と主張したのは、アプリの機能をカテゴリーに分けて階層表示している「メニュー構成」の部分です。\n\nここで全然関係ない話なんですけど、僕もアプリのメニュー設計って結構悩むんですよね。「設定」を上に置くか下に置くか、みたいな。あれ地味に難しい。で、\n\n権利主張側は「このメニューの並び方、これはうちが考えたオリジナルの表現だ。著作権がある」って言ったわけです。\n\nで、ここからがヤバいんですけど。\n\n権利主張側はわざわざ他社商品（A社・B社・C社）との比較表まで用意して「うちとYだけが似てて、他社とは違う。明らかにパクりでしょ」ってやったんですよ。\n\n権利主張側の気持ち、わかる。めっちゃわかる。これだけ準備したら勝てそうじゃないですか。","issue":"要するに何が問題だったの？\n\nX商品のメニュー構成は「編集著作物」として著作権の保護を受けるか、という一点です。\n\n【ちょっと解説】編集著作物── 素材の「選び方」や「並べ方」に創作性がある場合に保護される著作物。例えば「今週の人気レシピ50選」みたいな選択と配列に独自性があるやつ。辞書や百科事典もこれ。\n\nここテストに出ます。「メニューの機能の内容」ではなく「機能の名前の選び方・並べ方」に著作権があるかどうかが争点です。","ruling":"裁判所の判断です。\n\nまず「素材」について。権利主張側はカテゴリー名（「メッセージ」「統計情報」みたいなやつ）が「素材」だと言いましたが、裁判所はこう言いました。\n\n 権利主張側は，本件において，パソコン画面等で表示されるX商品の親カテゴリーから小カテゴリーに至る「各カテゴリー名」が「素材」であって，その「素材」の選択及び配列に創作性が認められるとして，X商品が編集著作物であると主張する。\n\n（略）ここで，権利主張側が素材と主張する「カテゴリー名」は，パソコン等の画面において，X商品において選択することができる機能に対応する画面を示すために，画面の上部に，ロゴ等表示部分の下のやや太い青みがかった線に，白抜き文字で表示されているものであったり（親カテゴリー名，中カテゴリー名），（略）各画面において，ロゴ等表示部分及びカテゴリー名を表示するやや太い青みがかった線の下に，示されるものである（小カテゴリー名）。\n\nこのようなX商品とそこにおけるカテゴリー名の使用の態様に照らせば，これらの「カテゴリー名」は，X商品の異なる画面において，他にも多くの記載がある画面の表示の一部として表示されるものであって，X商品をもって，「カテゴリー名」を「素材」として構成される編集物であるとはいえない。\n\nつまり「カテゴリー名はアプリのおまけみたいなもんで、それ自体が『素材』とは言えない」ということです。\n\n続いて創作性についても。\n\n ＬＩＮＥ＠を用いた集客，マーケティング支援ツールというX商品においてどのような機能を実装するかはアイディアに過ぎず，それ自体は著作権法の保護の対象になるものではない。そして，「素材」たる各カテゴリーの名称の選択についてみると，上記のようなX商品の性質上，各カテゴリーに付す名称は，各カテゴリーが果たす機能を一般化・抽象化し，ユーザーにとって容易に理解可能なものとする必要があるため，その選択の幅は自ずと限定される。そのような視点で選択されたX商品の各カテゴリー名は，それ自体をみてもありふれたものであり，現に，X商品の「メッセージ」，「統計情報」というカテゴリー名は他社商品でも用いられているほか，X商品の「メッセージ」の下に設けられた小カテゴリーの各カテゴリー名や「統計情報」の下に設けられた小カテゴリーの各カテゴリー名と同一ないし類似したカテゴリー名が他社商品においても用いられている。（略）\n\nしたがって，X商品における各カテゴリーの名称は，各カテゴリーが果たす機能を表現するものとしてはありふれたものといえる。\n\n次に，各カテゴリー名の配列についてみても，X商品においては，（略）他社商品に比して複雑な階層構造が採用されており，各カテゴリー名の配列について一定程度の工夫はされていると認められる。\n\nしかし，ユーザーによる操作や理解を容易にするという観点から，実装した機能の中から関連する機能を取りまとめて上位階層のカテゴリーを設定し，機能の重要性や機能同士の関連性に応じて順次下位の階層にカテゴリー分けをしていくというのは通常の手法であり，X商品の各カテゴリー名の配列は，複数の選択肢の中から選択されたものではあるものの，ありふれたものというべきである。\n\n要するに「機能の名前なんて誰が考えても似たようなもんになる。それを並べる方法も普通の手法。だから著作権はない」ということです。\n\n裁判所、めっちゃ冷静。好き。\n\n権利主張側の比較表、あれだけ頑張って作ったのに……。権利主張側の気持ち、察するしかない。\n\n権利主張側の請求はすべて棄却されました。","takeaway":"で、結局なにが大事なの？\n\n- 機能のアイデアは著作権で守れない。「こういう機能を搭載した」というアイデアは著作権の対象外です。特許が必要\n- カテゴリー名や表示の並び方は「ありふれた表現」になりやすい。ユーザーに伝わりやすい言葉を選ぶと、その分だけ独自性は薄れる\n- UIを守りたいなら、独自のビジュアルデザインで勝負する。機能の構成より見た目の表現に工夫を凝らすべし\n- 訴える前に「これ本当に著作権ある？」を確認して。2400万円分の結果がゼロになる前に弁護士に相談を\n\n今気づいたんですけどこの記事もう結構長くないですか？　でも大事な話なんで最後まで読んでください。\n\nちなみに全然関係ないけど、「編集著作物」って語感、なんかカッコよくないですか。言いたくなる。「わたしの作品、編集著作物ですので」みたいな。いや、今回の裁判ではそれが否定されたんですけど。","one_liner":"「パクられた」と「著作権侵害」の間には、裁判所が認めるかどうかという巨大な壁がある。","parties":[{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"LINEツール開発"},{"role":"利用側","icon":"⚖️","side":"defendant","desc":"競合開発会社"}],"lessons":["著作権は万能じゃない","パクリの立証は地獄"]},{"original_title":"東京地判令2.3.13（完成前の解除による既払金の返還）","url":"https://itlaw.hatenablog.com/entry/2022/03/05/113815","court":"東京地判","date":"令2.3.13","year":"令和2年","topic":"完成前の解除による既払金の返還","categories":["契約・報酬","瑕疵・完成"],"fun_headline":"【悲報】2442万円払ったシステム、完成しないまま解除→「証拠がない」で全額返金命令","hook":"突然ですが、みなさんは前払いしたお金が返ってこなかった経験、ありますか。\n\n僕は昔ネットで注文したゲームソフトが届かなかったことがあります。3000円くらい。まあ返金されましたけど。\n\n今日の話は2442万円です。スケールが違いすぎる。\n\nシステム開発を頼んで2442万円前払いして、でも完成しなかったら？","summary":"・絡んでる金額: 2442万円\n・テーマ: 完成前の解除による既払金の返還\n・契約とお金の話","what_happened":"順を追って説明しますね。\n\nX（発注者）がY（受注者）に「建築業向けの勤怠システムのアプリ」と「コマーシャルTシャツの試作品」を作るよう頼んだんですよ。\n\nで、前払いとして合計2442万円を順次払っていったわけです。\n\nここで全然関係ないけど、「勤怠システムとTシャツ」って組み合わせ、なんかいいですよね。プロジェクトの規模感がよくわからない。話を戻します。\n\n問題は開発側が完成を遅滞したことです。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生します。要するに「やっぱりやめた、お金返して」ができる仕組み。\n\n発注側は開発側が約束の期限までに完成させなかったとして、契約を解除して「払ったお金全部返して」と裁判を起こしました。\n\nで、ここからがヤバいんですけど。\n\n開発側は「いや、主要機能の開発は完了してたし！」と反論したんですよ。\n\n「完了してた」のに「完成してない」ってどういうこと？と思いますよね。そこが争点です。\n\nちなみに僕がこの当事者だったら、泣きながら「もう全部なかったことにしたい」って思うやつです。2442万円ですよ。","issue":"で、結局何が問題になったかというと。\n\n「完成してた」かどうかの立証問題です。\n\n開発側は「平成29年1月25日までに主要機能の開発が完了した」と主張しました。\n\nでも裁判所はこう言いました。\n\n開発側は，平成２９年１月２５日までに，このアプリの主要機能である位置情報の取得及び危険エリアの設定についての開発を完了させたと主張する。\nしかし，開発側は，本件において，ソフトウェアの画面を印刷した書面（乙４）を提出するほかは，このアプリの開発の進捗状況を示す客観的な証拠を提出しておらず，上記画面とこのアプリがいかなる関連を有するかも不明であることから，これをもってしても，このアプリの開発がどの程度進捗していたかは不明というほかなく，このアプリの主要機能の開発が完了していたと認めることはできない。\n\n要するに「スクショ1枚だけじゃ完成の証明にならない」ということです。\n\nここ大事なとこなんで簡単に言うと、「言葉で主張するだけじゃダメ、ちゃんとした証拠が必要」ということ。\n\nTシャツについても同様に「納品した証拠がない」として認められず、発注側の請求が満額認容されました。\n\nつまり開発側は2442万円を全額返す羽目になりました。","ruling":"判決はシンプルです。\n\n発注側の全額請求を認容。開発側は2442万円を返せ、ということになりました。\n\n「完成した」と主張するなら「完成した証拠」を出さなきゃいけない。当たり前っちゃ当たり前なんですけど、これができてなかったわけです。\n\nあ、今思い出したんですけど、昔の職場で「仕様書なんて作らなくてもできる人間がやればいい」って言う先輩がいました。その先輩が後でどうなったかは知りません。話を戻します。\n\n裁判所、めっちゃ冷静。ドキュメントなしの主張は全部却下。\n\n居酒屋で言ったら「割り勘ね」って言ったのに後から「やっぱ奢って」って言われるくらいの無茶な話を、2442万円スケールでやってたわけです。","takeaway":"で、結局なにが大事なの？\n\n- 作業の進捗は必ず記録に残す。ログ・コミット履歴・議事録・メール。「言った言わない」は証拠がある側が勝つ\n- 「完成」の定義を契約書に書いておく。「主要機能ができた」と「完成」は別物。基準を明記しておかないと揉める\n- 前払いをするなら、マイルストーンを設けよう。全額先払いはリスクが高い。段階払いにして、各段階で確認する\n- 納品したら受領証・検収書をもらう。「納品した」「してない」の水掛け論を防ぐための書類です\n\n「まさか自分が」と思ってる人が一番危ない。今のうちに自社の契約書を見直そう。","one_liner":"証拠がない完成は、裁判所には存在しないのと同じ。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"発注者"},{"role":"開発側","icon":"💻","side":"defendant","desc":"システム開発会社"}],"lessons":["契約書読んどけば…","証拠がないと詰む","「完成」って何？"]},{"original_title":"東京地判令2.3.4（プログラムの著作物性（否定））","url":"https://itlaw.hatenablog.com/entry/2021/05/05/231134","court":"東京地判","date":"令2.3.4","year":"令和2年","topic":"プログラムの著作物性（否定）","categories":["著作権","プログラム・システム"],"fun_headline":"【全ITエンジニアが震えた】4万行のソースコードに著作権なし、と裁判所が言った日","hook":"ちょっと待ってこれ聞いたら驚くから。\n\nエンジニアが必死に書いた4万行のソースコードに「著作権がない」と裁判所が言いました。\n\nswitch文の使い方も、デバッグログも、コメントも全部「ありふれてる」と言われました。\n\nこれ怖すぎる。エンジニアのみなさん大丈夫ですか。","summary":"・絡んでる金額: 8000万円\n・テーマ: プログラムの著作物性（否定）\n・著作権がらみの争い","what_happened":"さあ、ここから急展開ですよ。\n\nEDINETって知ってますか。上場企業が有価証券報告書とか出す金融庁のシステムです。\n\n権利主張側がEDINETへの提出書類を作るためのソフトウェアを作って、それをD社経由で販売してたわけです。で、利用側が似たようなものをクラウドで提供し始めたのを見て「パクりだ！」として1億8000万円の損害賠償請求をした事案です。\n\nちなみに請求額が1億8000万円で、このバッチの中では最高金額です。気合いの入り方が違う。\n\nここで全然関係ないけど、「XBRL」って文字列、僕は見るたびに「ザブル？」って読んでしまいます。話を戻します。\n\nで、このプログラム、4万ステップ以上のソースコードから成ってるんですよ。4万行ですよ。結構な規模です。\n\nただし、D社が権利主張側に対して「こういう仕様で作ってくれ」という詳細な仕様書を先に渡してたんですよ。\n\nここが命取りになります。\n\nで、ここからがヤバいんですけど。\n\n権利主張側は「うちのプログラムには著作権がある」と主張して、利用側の行為が著作権侵害だと訴えました。\n\n裁判所の判断を読んでいったら、権利主張側の主張が一個一個潰されていく様子が地獄のようでした。","issue":"争点です。\n\nこのプログラムは「著作物」として著作権で保護されるか？\n\n【ちょっと解説】著作物性── 「それ、著作権で保護される\"著作物\"ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\nここ大事なとこなんで簡単に言うと、「誰が書いても同じになるコードには著作権がない」ということです。\n\nプログラムは「機能を実現するための指令の組み合わせ」なので、機能が決まったら書き方の幅が狭くなる。そうすると「創作性」が認められにくくなるわけです。","ruling":"裁判所の判断です。怒濤の否定が続きます。\n\nまずプログラム全体について。\n\n このプログラムは，ＥＤＩＮＥＴにおける取扱いに変更があったことを踏まえ，ユーザーが作成した会計に関するエクセルファイル等を権利主張側－Ｓｍａｒｔに取り込み，会計科目を開示科目に組み替え，編集作業等を経て，宝権利主張側ＢＲＬの形式に変換することを簡易に行うことなどを目的として開発されたものであり，相応の分量のソースコードから成るものである。\n\nしかしながら，（略。注：Ｄ社が権利主張側に提供した資料には）このプログラムに要求される機能及びそれを実現する処理，画面の構成要素等を別紙３このプログラム説明書と同様のものとすることが概ね示されていたと認められる。\n\n要するに「仕様書に全部書いてあったから、あなたが自由に決められる部分は少ない」ということです。\n\n僕なら布団から出られない。一週間は。\n\nで、権利主張側が「ここに創作性がある！」と具体的に主張した箇所を一個一個潰していくんですよ。裁判所が。\n\nswitch文とif-else文の選択について。\n\n 本件ソースコード５には，画面１から画面２に遷移する際に呼び出されるサブルーチンのうち，アップロードしたファイルの種類を判別し，対応する画面を生成する処理が記述されているところ，権利主張側は，本件ソースコード５では，ｓｗｉｔｃｈ文で条件分岐を行っているが，他の表現５のように，ｅｌｓｅ－ｉｆで条件分岐を行うこともできるから，選択の幅があり，ここに権利主張側の個性が表れている旨主張する。\n\n 　しかしながら，（略）ｓｗｉｔｃｈ文は，複数の選択肢の中から式の値に合うものを選び，その処理を行うものであり，ｅｌｓｅ‐ｉｆは，複数の条件のどれに当てはまるかによって異なる処理を行うものであって，いずれも高等学校工業科用の文部科学省検定済教科書（略）に記載されている条件分岐の基本的な制御文であり，３種類以上の場合に分けて条件を指定するときに使用されるものであると認められるから，本件ソースコード５のように，アップロードしたファイルの種類によって場合を分けて条件を指定する必要がある場合に，ｓｗｉｔｃｈ文を使用すること自体は一般的なことであると認められ，そのことに作成者の個性が表れているということはできない。\n\n「高校の教科書に載ってる基本的な制御文」と言われました。えっ。マジで？\n\nデバッグログについて。\n\n 権利主張側は，本件ソースコード１２にデバッグログを出力するコードが挿入されていることにプログラム作成者の個性が表れると主張する。\n\nしかしながら，弁論の全趣旨によれば，プログラムの開発過程において，プログラムの保守及び変更等の必要から，不具合があり得ると考えられるソースコード上にデバッグログを出力するコードを挿入することは一般的に行われていることであると認められるから，デバッグログを出力するコードが挿入されているというだけで，そのことに作成者の個性が表れているということはできない。\n\n「デバッグログを入れるのは一般的」とも言われました。\n\nコメントについて。\n\n 権利主張側は，本件ソースコード１４等におけるコメントの有無及びその内容にプログラム作成者の個性が表れる旨主張する。\n\nしかしながら，（略）プログラムは，電子計算機を機能させて一の結果を得ることができるようにこれに対する指令を組み合わせたものとして表現したものであるところ，コメントは，コンピューターの処理の結果に影響するものではなく，コンピューターに対する指令を構成するものであるとはいえないから，上記のプログラムに当たらない。\n\nコメントは「プログラムじゃない」と言われました。\n\nさらに、4万ステップあることを主張しても。\n\n 権利主張側は，このプログラムはプログラムの著作物に当たるとし，その理由として，\n\n[1]このプログラムは，権利主張側が創作した部分に限っても，合計４万０３８１ステップという膨大な量のソースコードから成り，指令の組み合せ方，その順序，関数化の方法等には無限に近い選択肢があること，\n\n[2]このプログラムにおけるエクセル取込機能及び簡易組替機能は，一般的な用途に使用されるものではないから，これらの機能を実現するためのプログラムがありふれたものであるとはいえないこと，\n\n[3]権利主張側は，NetAdvantage やVisualStudio等の開発ツールを用いながらも，ライブラリ群の中からどのライブラリを用いるべきか，どの順番でライブラリを呼び出させるべきか，どのように加工すべきか，どのようにパラメータを設定すべきかなどに工夫を凝らしており，それらに個性が表れていること，\n\n[4]本件各資料は，いずれも要求定義又は外部設計に関するものにすぎず，Ｄ社が要求している機能を実現するための指令の組合せは記載されていないから，このプログラムに係る選択の幅を狭めるものではないこと\n\nを主張する。\n\nしかしながら，上記[1]について，前記⑴アのとおり，プログラムに著作物性があるというためには，プログラムの全体に選択の幅があり，かつ，それがありふれた表現ではなく，作成者の個性，すなわち，表現上の創作性が表れていることを要すると解されるところ，このプログラムに表現上の創作性があることについて具体的に主張立証されない以上，前記⑴イで認定，説示したとおり，多くのステップ数により記述されていることをもって，直ちに表現上の創作性を認めることはできない。\n\nまた，上記[2]について，権利主張側の主張は，このプログラムの機能の特殊性を指摘するにとどまっているところ，プログラムの機能そのものは著作権法によって保護されるものではなく，特定の機能を実現するためのプログラムであるというだけで，直ちに表現上の創作性を認めることはできない。\n\nさらに，上記[3]について，権利主張側は，ライブラリの使用等にどのような工夫をしたかについて具体的に主張立証しておらず，その点に選択の幅があり，作成者の個性が表れていると認めるに足りない。\n\nまた，上記[4]について，本件各資料にソースコードが具体的に記述されていないとしても，要求されている機能及び処理を実現するための表現に選択の幅があると当然にはいえないから，この点を考慮しても，このプログラムに表現上の創作性を認めるに足りないというべきである。\n\n4万行書いても、「具体的に何が独自か主張できてない」で全部負けました。\n\n全ITエンジニアが震えていい。","takeaway":"で、結局なにが大事なの？\n\n- プログラムの著作物性は「表現の選択の幅」で決まる。機能が決まると書き方の幅が狭くなる。仕様書があるとさらに厳しい\n- 「たくさん書いた」は著作権の根拠にならない。量じゃなくて「あなただけの表現」があるかどうか\n- 自動生成・ライブラリ使用部分は特に弱い。「どのライブラリをどう使ったか」の具体的な工夫を記録しておく\n- パクられたと思ったら、まず「どこが独自なのか」を整理する。ふんわり「全部オリジナル」では裁判で負ける\n\nこういうの僕にはたぶん一生わからない感じがするんですけど、エンジニアのみなさんは「自分のコードに著作権があるかどうか」、一度ちゃんと考えておいたほうがいいかもしれません。","one_liner":"4万行書いても「具体的にどこが独自か」を言えなければ、裁判所には1行と同じ。","parties":[{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"プログラム開発者"},{"role":"利用側","icon":"⚖️","side":"defendant","desc":"クラウド提供会社"}],"lessons":["証拠がないと詰む","著作権は万能じゃない"]},{"original_title":"東京地判令2.2.28（事業譲渡に伴うシステムの仕様書等の引渡義務）","url":"https://itlaw.hatenablog.com/entry/2022/09/15/201125","court":"東京地判","date":"令2.2.28","year":"令和2年","topic":"事業譲渡に伴うシステムの仕様書等の引渡義務","categories":["プログラム・システム"],"fun_headline":"【驚愕】1.5億円でSaaS事業を買収したら設計書が存在しなかった話","hook":"これちょっとつらい話なんですけど。\n\n1.5億円でSaaSビジネスを買収しました。\n\nソースコードを受け取りました。\n\n設計書がありませんでした。\n\n「え、じゃあ設計書ください」と言ったら「最初から存在しないんで」と言われました。\n\n裁判を起こしました。負けました。","summary":"・絡んでる金額: 5億円\n・テーマ: 事業譲渡に伴うシステムの仕様書等の引渡義務\n・システム開発のトラブル","what_happened":"順を追って説明しますね。\n\n被告側が運営してたSaaS事業を、原告側が1.5億円で買い取る契約を結びました。\n\n事業譲渡の契約書に「ソフトウェア一式」が譲渡対象として書いてあって、ソースコードの引き渡しは行われました。\n\nでも、原告側は「ソフトウェア一式」には仕様書・設計書などのドキュメントも含まれているはずだと思ってたわけです。\n\nで、ソースコードだけ渡されて「ドキュメントはないんですか？」と聞いたら……なかったんですよ、元々。\n\n原告側の気持ち、わかる。めっちゃわかる。「いや聞いてないし！」ってなりますよね。\n\n仕様書なしのソースコードって、地図なしで山に登るようなもんですよ。読める人には読めるんですけど、メンテや改修のコストが跳ね上がる。\n\nここで僕の話をさせてほしいんですけど、ドキュメントなしで引き継いだシステムを触ったことがある人は「うわぁ……」ってなってると思います。あの感覚。変数名がローマ字だったりするやつ。話を戻します。\n\n原告側は、ドキュメントがないせいでソースコードを解析してイチから設計し直す必要が生じたとして、開発費用など約6400万円の損害賠償を請求しました。\n\nここまで読んで「うわぁ……」ってなった人、正常です。\n\nで、ここからがヤバいんですけど。\n\n原告側は「ドキュメントがなかったとしても、SaaS事業を継続運営するためには当然必要なはずで、信義則上、引き渡す義務があるはずだ」と主張したわけです。","issue":"で、裁判所に聞きたいことはこういうこと。\n\n「ドキュメントを引き渡す義務があるか」という一点です。\n\n【ちょっと解説】信義則── 「誠実に行動しましょうね」という法律の基本原則。契約書に書いてなくても「それくらい当然でしょ」って義務が認められることがある。\n\n原告側の言い分は「契約書には書いてないけど、信義則上、SaaS事業に必要なドキュメントは渡すべきでしょ」というもの。\n\n被告側の言い分は「ドキュメントは元々存在しないし、契約書にも書いてない。作って渡す義務なんてない」。\n\nこれ、どっちが正しいと思います？\n\nちなみに全然関係ないけど、「デューデリジェンス」って言葉、最初に聞いたとき「デュエルダンジョン？」って思いました。話を戻します。\n\nこれ、どっちが正しいと思います？","ruling":"裁判所の判断です。\n\nまず契約書の話。\n\n裁判所は「譲渡資産目録にドキュメントは書いてない」「クロージング日に存在するものを引き渡す契約だが、ドキュメントはそもそもその日に存在してなかった」として、契約上の引き渡し義務を否定しました。\n\n次に、信義則上の義務についても。\n\n事業譲渡契約を締結するに際して，譲渡対象となる財産が何かということは当事者間の最大の関心事であることが通常であるところ，上記(1)のとおり，このドキュメントは，そもそも作成されて存在していたとは認められず，本件事業譲渡契約による譲渡対象にならないと解されるのである。そうすると，特別の事情の存在が認められない限り，同契約に付随する信義則上の義務として，被告側において改めてこのドキュメントを作成して原告側へ引き渡す義務を認めることができないというべきである。\n\n（略）\n\n原告側において本件事業譲渡契約締結の交渉を担当したＣは，同契約の締結前にこのソフトウェアに係る設計書が存在しないことを被告側側から聞かされていた（上記(1)）にもかかわらず，証拠（証人Ｃ）によれば，原告側は，被告側に対し，同契約の締結前に，このソフトウェアに係る設計書や仕様書などのこのドキュメントの引渡しを求めたことはないことが認められる。また，本件事業譲渡契約の当事者である原告側と被告側との間では，同契約の締結までに，このドキュメントの有無や被告側から原告側への引渡しが検討された形跡すらないのである。しかも，事業譲渡等の企業買収においては，最終の契約締結前に，買収者が対象会社に対する実地調査（デュー・ディリジェンス）を行い，重要な事実等を確認する事例も多いところ，原告側は，このドキュメントの存在を含むこのソフトウェアの状況等を確認するための実地調査を行っていないし，これを被告側に対して求めた形跡もない。それにもかかわらず，本件事業譲渡契約を締結してクロージング日も経過した後に，信義則を根拠として，被告側において改めてこのドキュメントを作成して原告側へ引き渡すことを求めることは，同契約の当事者としては想定外の負担を被告側に課するものというほかなく，これを正当化できるだけの特別の事情は，本件全証拠によっても認めることはできないというほかない。\n\nすごい長い文章なんですけど、要するにこういうことです。\n\n「設計書がないことは事前に聞いてたでしょ。なのに契約前に確認しなかった。デューデリ（買収前の詳細調査）もしてない。契約後に『やっぱり作って渡せ』は無理な話」\n\nいや、そうはならんやろ。なっとるやないか。\n\nしかも逆に被告側からの反訴（保守業務の委託料請求）は認容されました。\n\n原告側の全請求棄却＋被告側への支払い命令。原告側にとって最悪の結末です。","takeaway":"で、結局なにが大事なの？\n\n- M&AやSaaS買収前には必ずデューデリを。ドキュメントの有無・品質も確認事項に入れる。「そんなこと聞いてない」では後から勝てない\n- 「ドキュメントありますか」と事前に聞いておく。聞いて「ない」と言われたなら、それを踏まえた価格交渉か、作成を義務として契約書に入れるか\n- 契約書の譲渡資産目録は細かく書く。「ソフトウェア一式」だけでは仕様書・設計書・テストコード・インフラ設定が含まれるかどうか不明\n- 「言わなくても当然含まれてるはず」は通じない。信義則は万能じゃない。契約書に書いてないことは基本的に諦める覚悟で\n\n技術の話を法律の言葉で説明するの、本当に大変そうでしたよこれ。","one_liner":"M&Aで「設計書ありますか」と聞かないのは、中古車を試乗せずに買うより怖い。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"SaaS事業買収者"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"事業譲渡者"}],"lessons":["契約書読んどけば…"]},{"original_title":"東京地判令2.2.27（アプリ提供契約の成否）","url":"https://itlaw.hatenablog.com/entry/2021/02/18/001855","court":"東京地判","date":"令2.2.27","year":"令和2年","topic":"アプリ提供契約の成否","cat
