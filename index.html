商法512条（相当報酬の請求）は使えないとも判断されました。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n・「やる方向で」は口約束でも法的に問題になる。相手の期待を作ったらちゃんと終わらせろ\n・契約が成立してなくても損害を請求できることがある。「契約書がない=無敵」は幻想\n・逸失利益（儲けるはずだった分）は取りにくい。取れるのは実費コストが基本\n・突然の中止をするなら早めに言え。後になればなるほど相手の損害が増える\n\n最後に一言。「やる空気」を出したなら最後まで責任取ってください。","one_liner":"契約書がなくても「やるやる詐欺」には法的責任が生じる。空気を読んだ側が損をする社会はおかしい。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"システム開発会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"アプリ発注会社"}],"lessons":["契約書読んどけば…","金の話は最初にしろ","損害、証明できる？"]},{"original_title":"東京地判平27.11.24（請負／準委任、民法536条2項）","url":"https://itlaw.hatenablog.com/entry/2024/05/28/224632","court":"東京地判","date":"平27.11.24","year":"平成27年","topic":"請負／準委任、民法536条2項","categories":["契約・報酬"],"fun_headline":"ソーシャルゲームの開発契約で462万円を巡って「請負か準委任か」でガチ揉めした件","hook":"突然ですが、みなさんは契約書をちゃんと読みますか。\n\n僕は読みません。\n\nいや、読まなきゃいけないのはわかってるんですけど、なんか細かくて。\n\nで、今日はそういう話です。\n\n「請負」か「準委任」かで裁判になった話。\n\nこれ、ソーシャルゲームの開発案件なんですけど、この区別が462万円の行方を左右したんですよね。怖すぎる。","summary":"・絡んでる金額: 462万円\n・テーマ: 請負／準委任、民法536条2項\n・契約とお金の話","what_happened":"話を整理しましょう。\n\n開発会社（ベンダ）発注側が開発側より、ソーシャルゲーム２本の開発を受託しました。\n\nそれぞれ「本件第１契約」「本件第２契約」と呼ばれてます。\n\nで、これらの契約にもとづく報酬が支払われていないとして、発注側は合計462万円の支払いを開発側に求めました。\n\n462万円。払ってもらえてないんですよ。作ったのに。\n\nここで僕の話をさせてほしいんですけど、僕も学生のとき友達に頼まれてポスター作って、「後でちゃんと払う」って言われてそのまま払われなかったことがありまして。\n\n金額は僕のほうが全然少ないんですが、気持ちはわかります。つらい。\n\n話を戻します。\n\n発注側としては「仕事したんだから払ってくれ」という話。\n\nでも開発側の側は「完成してないから払わなくていい」と主張。\n\nこの対立の根っこにあるのが「この契約は請負か、準委任か」という問題でした。","issue":"要するに何が問題だったの？\n\n■本件第１契約及び本件第２契約の契約の性質（請負か準委任か）\n\nここテストに出ます。\n\n【ちょっと解説】準委任（じゅんいにん）── 「結果は約束しないけど、プロとしてちゃんとやります」という契約。美容院で「いい感じにしてください」と言うのに近い。SES契約はだいたいこれ。\n\n「準委任」なら完成してなくても報酬は払わないといけない。\n\n「請負」なら完成させて初めて報酬が発生する。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。レストランで「カレーください」と注文するようなもので、カレーが出てこなかったら契約違反。\n\n発注側は「準委任だから完成の有無は関係ない、払え」と主張。\n\n仮に請負だとしても「完成してる」とも主張。\n\n開発側は「請負だ、完成してない、払わない」と主張。\n\nちなみに全然関係ないけど、「準委任か請負か」って、結んだ当人たちでも自覚してない場合が多いらしくて。\n\n契約書に何て書いてあるか、ちゃんと確認したことありますか？\n\nあと今気づいたんですけどこの記事もう結構長くないですか？　まあ大事な話なので続けます。","ruling":"で、裁判所はどう判断したか。\n\n裁判所はまず契約の性質を判断しました。\n\n内容や経緯から「本件第１契約は請負、本件第２契約は準委任」という判断が下されました。\n\n同じ当事者間でも契約ごとに性質が違うって、なかなかドラマチックな展開ですよね。\n\n請負とされた第１契約については「完成・引渡しがあったか」が焦点に。\n\n準委任とされた第２契約については民法536条2項（受領拒絶があれば報酬請求できる）の適用が論点に。\n\n【ちょっと解説】民法536条2項── 相手が「もう要らない」と言って受け取り拒否した場合、それは相手のせいだから報酬は払え、という規定。「受け取らないのはそっちの都合でしょ」理論。\n\n裁判所、めっちゃ細かく丁寧に判断してる。好き。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n・自分の契約が「請負」か「準委任」か確認しよう。今すぐ契約書を開け\n・「完成」の基準は最初に書いておけ。曖昧なまま進めると後で揉める\n・相手が「もう要らない」と言っても、準委任なら報酬を請求できる場合がある\n・契約書を読まない人間は裁判になってから後悔する。おばあちゃんもそう言ってた\n\n最後に一言。462万円の争いで学べることが、この記事にはぎっしり詰まっている。","one_liner":"「請負か準委任か」はただの法律用語じゃなくて、あなたのお金が払われるかどうかの話です。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ゲーム開発会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ゲーム発注会社"}],"lessons":["「完成」って何？"]},{"original_title":"東京地判平27.2.18（要件定義書記載外の仕様）","url":"https://itlaw.hatenablog.com/entry/2019/06/29/121444","court":"東京地判","date":"平27.2.18","year":"平成27年","topic":"要件定義書記載外の仕様","categories":["その他"],"fun_headline":"ECサイト640万円の開発、担当者が消えて下請けがバレて完成せず全額返金になった話","hook":"今日の話、ちょっとシリアスなやつです。\n\nシリアスなんですけど、読んでみると「あ、これ身近だな」ってなる。\n\nECサイトの開発を頼んだら、担当者が途中でいなくなって、下請けに出してたことがバレて、完成しないまま終わった話です。\n\nで、着手金320万円、全額返ってきます。","summary":"・絡んでる金額: 640万円\n・テーマ: 要件定義書記載外の仕様","what_happened":"話を整理しましょう。\n\n平成25年2月7日、セレクトショップを運営する被告側は、原告側にECサイトの開発を委託しました。\n\n報酬は640万円（税別）。着手時に320万円、納品後に320万円を支払う約束。\n\n被告側は着手金の320万円＋税を支払いました。\n\nそこまでは普通の話です。\n\nで、ここからがヤバいんですけど。\n\n同年9月30日、X被告側は覚書を取り交わしました。内容がすごい。\n\n「スケジュール管理を怠った場合には段階的に報酬を3割減額する、納品後の報酬を放棄する、既払いの着手金を返還する」という内容が含まれていました。\n\n原告側はこれにサインしてるんですよ。自分で。\n\nここで全然関係ない話なんですけど、僕も昔バイト先の契約書に「遅刻したら時給を50円下げます」みたいな条項があって、サインした記憶があります。\n\n読んでなかったです。話を戻しますね。\n\n被告側は平成26年2月27日に履行を催告した後、債務不履行を理由に契約を解除。既払い着手金の返還を求めました。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\n一方原告側は被告側に対し「未払の報酬320万円を払え」と本訴。\n\n被告側は「着手金を返せ」と反訴。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n\nここまで読んで「うわぁ……」ってなった人、正常です。\n\n原告側の気持ち、わかる。でも被告側の気持ちも、わかる。つらい。","issue":"で、裁判所に聞きたいことはこういうこと。\n\n（２）本件ECサイトの完成・引渡しの有無\n\n裁判所は「要件定義書に定めた仕様の範囲で完成したかどうか」を判断しました。\n\n原告側は「平成25年11月30日に完成させて引き渡した」と主張。\n\nでも裁判所はこう言いました。\n\n 原告側は，被告側が平成２５年１１月３０日に本件ＥＣサイトを完成させ，これを被告側に引き渡した旨主張するが，原告側が，被告側に対し，同日，実店舗とのポイント連動及び英文サイト構築を含む本件ＥＣサイトを完成させたことを認めるに足りる証拠は全くない。\n\nかえって，（略）\n\n[1]平成２５年９月上旬頃，原告側の担当者であるＣの所在が不明となり，後任のＦは，本件ＥＣサイトの仕様の内容等を十分把握していなかったこと，\n\n[2]Ｆは，Ｄに対し，同年１１月２５日及び同月２７日，本件ＥＣサイトのオープンの目途が未だ立っていない旨を伝えたこと，\n\n[3]Ｆは，同年１２月の時点においても，（略）実店舗とのポイント連動の実現が可能となるか否かを調査していたが，これが不可能であることが後に判明したこと，\n\n[4]被告側は，平成２６年１月１４日に，原告側が本件ＥＣサイトの構築をｇ社に下請発注していたことを知り，その後，原告側にＥＣサイト構築のノウハウがないことや，ｇ社の製作料金が安いことなどから，本件ＥＣサイトの構築をｇ社に直接発注したいとの意向を示したこと，[5]原告側は，被告側に対し，同年２月１７日付けの書面を送付するまでの間，この契約に基づく報酬残金３２０万円の支払を求めることはなかったこと\n\nをそれぞれ認めることができ，これらの事実に照らせば，原告側は，平成２５年１１月３０日の時点及びその後においても，本件ＥＣサイトを完成させるに至っていないものというべきである。\n\n[1]〜[5]を並べると、もうボコボコですよね。\n\n担当者が消えた。後任は仕様を把握してない。「オープンの目処が立ってない」と原告側自身が伝えてた。下請けに出してたことがバレた。お金の催促もしてなかった。\n\n裁判所、全部見てた。","ruling":"いよいよ判決です。\n\n裁判所はECサイトの「完成・引渡し」を否定しました。\n\nその結果：\n\n・原告側の本訴請求（未払報酬320万円）→全部棄却\n・被告側の反訴請求（着手金の返還＋決済代行業者やデータセンタに支払った費用）→全部認容\n\n「全部認容」って、法律用語で「全部認めました」ということです。\n\n原告側、全敗です。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n・担当者が変わったら即確認。仕様の引き継ぎができてないなら要注意\n・「完成した」と言うなら証拠を残せ。口頭で「引き渡した」は裁判では通じない\n・覚書の内容はちゃんと読め。「遅延したら着手金も返す」なんて条項にサインするな\n・下請けに出すなら最初から言え。バレてからじゃ信頼ゼロ\n\n最後に一言。担当者が「所在不明」になった時点でもう終わってた案件でした。","one_liner":"「完成した」は言葉じゃなくて証拠で証明するもの。裁判所は空気を読まない。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"セレクトショップ"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"ECサイト開発会社"},{"role":"下請業者","icon":"🔧","side":"third","desc":""}],"lessons":["契約書読んどけば…","「完成」って何？","PM不在の悲劇"]},{"original_title":"東京地判平27.2.13（クローラによる医療機関データ取得・利用）","url":"https://itlaw.hatenablog.com/entry/2019/12/22/114009","court":"東京地判","date":"平27.2.13","year":"平成27年","topic":"クローラによる医療機関データ取得・利用","categories":["その他"],"fun_headline":"医療機関データベースをクローラで取得された原告側が不法行為を主張した結果、裁判所が出した答えが意外すぎた","hook":"自分が時間とお金をかけて作ったデータベースを、他の会社がクローラで全部取ってったとしたら。\n\n怒りますよね。普通に。\n\n今日はそういう話です。\n\nでも裁判所の答えが、ちょっと予想と違うかもしれない。","summary":"・テーマ: クローラによる医療機関データ取得・利用","what_happened":"順を追って説明しますね。\n\n原告側は医療機関に関する情報データベースを作っていました。\n\nコストと労力をかけて、ちゃんとメンテナンスもしてた。\n\nでも被告側が、クローラを使って原告側のデータベースから情報を取得し、被告側自身のデータベースに組み込みました。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\n原告側は被告側に対し「それ不法行為だ、賠償しろ」と主張して訴訟を起こしました。\n\nここで僕の話をさせてほしいんですけど、クローラって、言葉だけ聞くとなんか虫みたいじゃないですか。\n\n実際はウェブサイトを自動的に巡回して情報を収集するプログラムなんですけど。\n\n話を戻します。\n\nで、原告側が怒るのも当然ですよね。時間とお金かけて集めたデータを、勝手に持っていかれたわけですから。\n\n僕が原告側の立場だったら、たぶん三日は寝込む。","issue":"両者の言い分が食い違ったポイントはここ。\n\n被告側による複製行為の不法行為該当性\n\nつまり「被告側が原告側のデータを取ってったのは違法か？」という問題です。\n\n原告側のデータベースは著作権では保護されないと最初に判断されました。\n\nなぜかというと、医療機関の名前・住所・電話番号というのは「そもそも公開すべき情報」で、構成に創作性がないから。\n\nここ大事なとこなんで簡単に言うと、「誰でも集められる情報をまとめただけでは著作物にならない」ということです。\n\nじゃあ不法行為としては認められるか？\n\nこれが争点でした。","ruling":"で、裁判所はどう判断したか。\n\n裁判所は，上記の事実をもとに，次のように述べて不法行為の成立を否定した。少々長いが適宜省略しながら引用する。\n\n (1) 　原告側は，被告側が営利目的で，Xデータベース上の医療機関情報を収集してYデータベースに組み込んだものであり，著しく不公正な手段を用いて他人の法的保護に値する営業活動上の利益を侵害したから，不法行為責任を負うと主張する。ただし，原告側は，Xデータベースが著作物として保護され，被告側の行為が著作権侵害行為に該当する旨主張しておらず，（略），Xデータベースは，情報の選択又は体系的な構成によって創作性を有しないから，著作物として保護されない。\n\n一般に，データベースがその作成，維持のために費用や労力をかけたものとして独立の経済的価値を有する場合であっても，当該データベースが著作物として保護されない場合には，そのデータベース上の情報を収集し，別個のデータベースに組み込む行為は，情報及びデータベースの内容及び性質，行為の態様及び目的，権利侵害の程度等に照らして，著しく不公正な方法で他人の権利を侵害したと評価できる場合に限り，不法行為を構成するというべきである。\n\nこの時点で嫌な予感がしますよね。はい、的中です。\n\n(2)ア 　（略）Xデータベース上の医療機関情報の主要部分は，病院名，住所，電話番号等の情報で，一般に公開される必要が高く，実際に公開されている情報であるが，Xデータベースは，原告側により相当の費用及び労力をかけて情報を収集，整理して作成，更新されたものであるから，独立の経済的価値を有し，法的保護に値するものである。\n\nイ（ア） 　（略）被告側は，ウェブ上の問診システムの開発を目的として，Xデータベースとは独立にYデータベースを作成したものであり，XデータベースとYデータベースは，医療機関情報のデータベースであるという点で共通するものの，Xデータベースの項目とYデータベースの項目は相当程度異なる。また，（略），Yデータベース上の個々の病院等の情報はXデータベースと実質的に同一の部分が多いが，異なる部分も存在するし，Yデータベース上には，Xデータベースに存在しない病院等の医療機関情報も存在する。\n\nイ）　（略），被告側は，まず，無料で公開されているｂサービスから医療機関情報を収集し，Yデータベース上の病院項目のうちの９割程度に情報を組み込んだ後，同じく無料で公開されている都道府県ウェブサイト，地方公共団体のホームページ及び民間ウェブサイトからクローラを用いて医療機関情報を収集してYデータベースに組み込み，これらに手作業で救急対応の有無等の情報を付け加えるなどしてYデータベースを作成したものであり，その一環として，Xデータベース上のデータも収集した。\n\nその結果，（略），Yデータベースには，Xデータベース上のデータと同一のデータが含まれており，被告側がXデータベース上の医療機関情報の一部をYデータベースに組み込んだことは認められるが，被告側がXデータベースからどの程度の情報をYデータベースに組み込んだかは不明である。また，（略），被告側がYデータベースに組み込み又は組み込んだ可能性のある情報の多くは，他のデータベース上の情報と実質的に一致するものと認められる。\n\n僕がこの立場だったら転職サイト開いてると思う。\n\nウ 　（略），被告側は，ウェブ上の問診システム構築のために助成金を得てYデータベースを作成し，これを無料で公開したものであるのに対し，Xデータベース提供契約を締結した原告側の顧客の事業は，利用者に対して医療機関情報を提供するものであることが窺われるが，その事業の目的や内容は必ずしも明らかではない。したがって，被告側がYデータベースを用いて行った事業と原告側の顧客の事業の内容及び利用者は，相当程度重なるものと考えられるが，同一とまではいえないし，被告側がYデータベースを用いて事業を行うことが，X又は原告側の顧客が行う事業に与える影響がどの程度のものかも明らかではない。また，（略），被告側は，Yデータベースの作成及び公開による利益を得なかった。\n\nエ 　（略），Y従業員は，クローラで情報を収集中に，Xデータベースを公開しているウェブサイトを指定したことが認められるが，その時点で，原告側がこの訴訟で権利主張をしているXデータベースの存在を認識しておらず，Y代表者は，原告側から指摘を受けて，初めてX及びXデータベースの存在を認識するに至ったものと認められる。\n\nオ 　以上のとおり，Xデータベースは，独立した経済的価値を有するものではあるが，医療機関情報の主要部分は一般に公開されることが要請され，実際にも公開されている情報であること，XデータベースとYデータベースは，医療機関情報のデータベースであるという点で共通するものの，項目も，医療機関情報も相当程度異なること，被告側がXデータベース上の医療機関情報の一部をYデータベースに組み込んだことは認められるが，どの程度の情報を組み込んだかは不明であり，組み込み又は組み込んだ可能性のある情報の多くは他のデータベース上のデータと実質的に一致すること，被告側がYデータベースを用いて行った事業が，X又は原告側の顧客のXデータベースを用いた事業にどの程度の影響を及ぼすかは不明であること，被告側は，Xデータベースから医療機関情報を組み込むに当たり，X及びXデータベースの存在を認識していなかったこと等を考慮すれば，被告側の行為を著しく不公正な方法で他人の権利を侵害したと評価することはできない。よって，被告側の行為が原告側の営業活動上の利益を侵害する不法行為を構成するとはいえない。\n\nつまり裁判所の結論は「不法行為にはならない」でした。\n\n原告側は負けました。\n\n裁判所、めっちゃ冷静。好き。でも原告側の気持ちになると、つらい。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n・「苦労して作ったデータベース」は著作権では守られないことがある。公開情報の羅列は著作物じゃない\n・不法行為として認めてもらうには「著しく不公正な方法」が必要。単に競合するだけでは足りない\n・被告側が知らなかったこと・営利目的じゃなかったこと・悪影響が不明だったこと、全部原告側に不利に働いた\n・データを守りたいなら利用規約でクローラを禁止する、技術的制限をかける等の手を打て\n\n最後に一言。「コストをかけて作った」だけでは権利は生まれない。泣けてくる話ですが本当のことです。","one_liner":"苦労して集めたデータも、公開情報の羅列なら著作権で守れない。知れば知るほど「えっ」となる話。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"医療DBサービス会社"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"データ収集業者"}],"lessons":["著作権は万能じゃない","規約、読んだ？","辞め方を間違えた"]},{"original_title":"東京地判平26.11.26（アセンブラの著作物性）","url":"https://itlaw.hatenablog.com/entry/2025/04/13/170845","court":"東京地判","date":"平26.11.26","year":"平成26年","topic":"アセンブラの著作物性","categories":["著作権"],"fun_headline":"【ヤバい】スーファミのパッチコード100行、著作物として認められてしまう","hook":"「アセンブリ言語で書いた100行のコード」って、著作権で守られると思います？\n\n僕は最初「え、さすがにそれは無理でしょ」って思ったんですよ。でも裁判所は「守られます」って言ったんですよね。\n\nちょっと待ってこれ聞いたら驚くから。スーファミのゲームを改造したパッチプログラムが、著作権侵害の被害として認められた話です。","summary":"・テーマ: アセンブラの著作物性\n・著作権がらみの争い","what_happened":"順を追って説明しますね。\n\n権利者は、吸い出し機と呼ばれるツールで、スーパーファミコン用ゲームのオブジェクトコードを逆コンパイルして、パッチプログラムを制作しました。このパッチ、何をするものかというと「モビルスーツの戦闘画面で色を切り替えられるようにする」という機能を持っています。\n\nスーファミのゲームを自分で改造したんですね。\n\nここで僕の話をさせてほしいんですけど、僕も子供のころスーファミのゲームで「なんでこのキャラのカラーが変わらないんだ」って思ったことあって。でも改造しようとか一切思わなかった。才能の差ってこういうとこに出ますよね。話を戻します。\n\nで、何者かがこのパッチをサイトにアップロードしちゃったんですよ。\n\n権利者は「私が作ったパッチが無断でネットにあげられた。著作権侵害です」と主張して、プロバイダ責任制限法という法律を使って、接続プロバイダの相手方に「誰がアップしたか教えてくれ」と発信者情報の開示を請求しました。\n\n【ちょっと解説】公衆送信権── 著作権の一種で、著作物をインターネット等で公衆に送信する権利。無断でネットにアップすると侵害になる。\n\nで、ここからがヤバいんですけど、相手方は「そもそもこのパッチ、著作物じゃないから」と反論してきたんです。\n\n「データ列でしかない」「元のプログラムに縛られてるから創作性がない」というわけです。\n\nこれ、ラーメン屋の麺のレシピを「小麦粉と水を混ぜただけ」って言うようなもんじゃないですか。まあでも法律の世界ではちゃんと検証が必要なわけで。","issue":"要するに何が問題だったの？\n\nこのパッチコード、著作物として認められますか？\n\nもっと砕くと「プログラムにも著作権って発生するの？　100行くらいのアセンブリコードでも？」という話です。\n\nここテストに出ます。著作物として認められるには「創作性」が必要なんですが、プログラムって基本的に「こういう処理をしたいならこう書く」という制約があるから、果たして「創作」といえるのかが問題になりました。","ruling":"さあ、裁判所の答えです。\n\nまず「これはプログラムに該当するか？」という点から。裁判所はこう言いました。\n\n本件色切替パッチは，アセンブリ言語により記述されたもので約１００行のコードからなり，一定の条件の下で当該モビルスーツの色彩が変更されるようにするために，元プログラムから登場機体番号，登場機体の所属，登場機体のレベルに関する情報を読み出し，一定の加工を行った上で，用意しておいたデータベース（甲３６）の情報と対照し，「条件ａ」，「条件ｏ１」，「条件ｏ２」の成否を判定して，所定の場合には色の切替動作を行うようにしたものである。\n\n以上のとおり，本件パッチのうち，少なくとも本件色切替パッチは，複数の指令を組み合わせて電子計算機を機能させ，所定の場合には色の切替動作を行い，所定の場合にはこれを行わないという１つのまとまった仕事ができるように構成されているものと認められるから，「プログラム」に該当する。\n\nはい、プログラムと認定されました。\n\n続いて著作物性です。裁判所はまず基準を示しました。\n\n【ちょっと解説】著作物性── 「それ、著作権で保護される\"著作物\"ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\nプログラムに著作物性があるというためには，指令の表現自体，その指令の表現の組合せ，その表現順序からなるプログラムの全体に選択の幅があり，かつ，それがありふれた表現ではなく，作成者の個性，すなわち，表現上の創作性が表れていることを要する。\n\nそして，「創作的」に表現されたというためには，厳密な意味で独創性が発揮されたものであることは必要ではなく，作成者の何らかの個性が表現されたもので足りるというべきであるが，他方，プログラムの具体的記述自体がごく短く又は表現上制約があるため他の表現が想定できない場合や，表現が平凡かつありふれたものである場合には，作成者の個性が表現されたものとはいえないから，創作的な表現であるということはできない。\n\n裁判所、めっちゃ丁寧に考えてる。好き。\n\nつまり「他にも書き方があったのに、この書き方を選んだ」という「選択の余地」があれば創作性が認められるわけです。\n\nで、具体的なコードを3箇所チェックして、それぞれ「別の書き方もできたよね」ということを確認したうえで、こう結論を出しました。\n\n以上のとおり，数値の突合及びそれに伴う条件分岐にいかなるコマンドをどのように組み合わせるか，条件が成立する場合としない場合の処理をどのような順序で記載するか，どのタイミングでテーブルないしメモリ領域間で情報を移動させるか，共通する処理があるときに共通する部分をまとめて記述するかそれとも個別に記述するかなどについて，本件色切替パッチと異なる表現を採用しても，本件色切替パッチにおいて実現される処理と同様の処理を行うことが可能である。そして，使用可能なコマンドは多数存在すること（甲３８），本件色切替パッチのコード数は約１００行あることからすれば，全体としてみれば，本件色切替パッチにおいて実現される処理を行うために用いうるコマンド，その組み合わせ及び表現順序の選択の余地は大きいものというべきである。\n\n権利者は，それだけの選択の余地がある中で，工夫を凝らして本件色切替パッチを作成したものであるから（甲１４），本件色切替パッチは，ありふれた表現ではなく，何らかの作成者の個性，すなわち，表現上の創作性が表れていると認められる。\n\n著作物と認定。そして問題のファイルはオブジェクトコードレベルで完全一致だったので複製権侵害も認定。発信者情報の開示が認められました。\n\nあ、今思い出したんですけど、昔友達のコードをちょっとコピーして使ったことあって。あれって大丈夫だったのかな。まあ友達だし……ていうか今この話は関係ないですね。","takeaway":"で、結局なにが大事なの？\n\n- 「別の書き方もあったのに選んだ」という事実がコードを守る — 一意に決まる処理なら著作物にならないが、選択の余地があれば認められる\n- パクったコードが完全一致してたら即アウト — オブジェクトコードレベルで一致してたら言い訳の余地がない\n- 自分が書いたコードが著作物かどうか気になったら「別の書き方があったか？」を考えてみる — あったなら守られる可能性がある\n- 人のコードを無断でネットにあげるのは普通に著作権侵害 — たとえ「いいものを広めたかった」という善意でも\n\n最後に一言。著作権の話をすると必ず「で、結局どこまでOKなの」という話になって、答えがケースバイケースすぎて誰も納得しない。それが著作権です。","one_liner":"コードにも著作権はある。でも「選ぶ余地がなかった」コードは守られない。あなたのコード、ちゃんと個性ありますか？","parties":[{"role":"権利者","icon":"©️","side":"plaintiff","desc":"パッチ作成者"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"接続プロバイダ"}],"lessons":["著作権は万能じゃない","パクリの立証は地獄"]},{"original_title":"東京地判平26.10.31（契約の成否・契約締結上の過失）","url":"https://itlaw.hatenablog.com/entry/2020/06/08/231412","court":"東京地判","date":"平26.10.31","year":"平成26年","topic":"契約の成否・契約締結上の過失","categories":["契約・報酬"],"fun_headline":"【悲報】「ほぼ決まりだ」の一言を信じてWeb開発を進めた会社、1円も払ってもらえなかった","hook":"これ聞いたら絶対怖くなるから。\n\n社長から「ほぼこれで決まりだ」って言われたら、みなさんどうしますか。\n\nふつう「決まった」と思いますよね。打ち合わせを重ねて、秘密保持契約も結んで、仕様書も作って、デザインも始めて。\n\nでも裁判所は「それ、契約成立してないよ」って言ったんです。\n\nマジ？　マジでした。","summary":"・絡んでる金額: 1000万円\n・テーマ: 契約の成否・契約締結上の過失\n・契約とお金の話","what_happened":"順を追って説明しますね。\n\n開発側は富裕層向けのウェブサービスを企画して、発注側に対して「予算の上限は1000万円」と伝えてWeb開発の提案を依頼しました。\n\n発注側はプレゼンテーションをしました。開発側のB社長は「ほぼこれで決まりだ」と言いました。\n\nここで「やった！」って思うじゃないですか。思いますよね。\n\nその後、仕様や運用方法の打ち合わせを重ねて、秘密保持契約も締結。発注側はコンセプトマップ、ユーザージャーニーマップ、ページ遷移図、ページレイアウト図、デザインの一部、機能リストなどをどんどん作っていきました。\n\nここで僕の話をさせてほしいんですけど、僕もバイト先で「来月からほぼ正社員みたいな感じで頼むよ」って言われて喜んでたら普通に何も変わらなかったことがあって。これは全然規模が違うし法律の話でもないんですけど。話を戻します。\n\n開発側は平成25年1月15日に「基本契約書の稟議が承認された」と通知して、基本契約書に押印もしました。\n\n発注側は2月8日に「企画・設計500万円、デザイン・開発・テスト500万円」という発注書の文案をメールで送りました。\n\nさらに発注側は「前払いしてもらえないとチームを解散しなければならない」と告げて、開発側も「構わない」と言いました。\n\nで、ここからがヤバいんですけど。\n\n再度プレゼンテーションも行ったのに、開発側は4月23日に突然「業務委託の意思がない」と告げてきたんです。\n\nわかります？　この怖さ、伝わってます？　約半年間、仕様書もデザインも作って、最終的に「やっぱいりません」です。\n\n発注側は「契約は成立してた。お金払え（525万円）」と請求し、「せめて信頼して動いた分の損害（約470万円）を賠償してくれ」と予備的に主張しました。\n\n【ちょっと解説】契約締結上の過失── 契約の交渉段階でのやらかし。「やるやる」と言って期待させておいて突然「やっぱやめた」みたいなケース。正式な契約が成立していなくても、信頼を裏切った損害は賠償しなさい、という考え方。","issue":"要するに何が問題だったの？\n\n（１）そもそも契約って成立してたの？\n\n「ほぼ決まり」「基本契約書に押印」「仕様の打ち合わせを重ねた」があれば契約成立と言えるのか。\n\n（２）契約が成立してないとしても、期待させといてやめたのは損害賠償の対象にならないの？\n\nここテストに出ます。「契約が成立してなくても、信頼させて損害を与えたなら賠償せよ」という考え方があります。それが「契約締結上の過失」です。","ruling":"いよいよ判決です。裁判所、めっちゃ冷静でした。\n\n争点（１）について、契約の成立を否定しました。\n\n 発注側と開発側との間では，このサービスに係るシステム開発の業務委託について，委託報酬の支払条件やこのサービスの仕様に関し最終的に確定するまでには至っておらず，具体的な発注もなされていないのであるから，同委託契約についての合意が成立したとは認められない。（略）\n\nたしかに，（略）XY間では，秘密保持契約を締結するとともに，本件基本契約書が作成されている。しかしながら，（略）平成２４年１０月５日時点で，最終的にこのサービスのシステム開発を発注側に委託することまでは確定しておらず，今後，契約交渉及び仕様の確認作業を行っていく段階であることがうかがわれる。そして，開発側が，本件基本契約書に基づき，業務内容，委託代金，納期等を定めた注文書を発行した事実は認められず，（略）発注側が提示した支払条件について開発側が了承した形跡もないまま，開発側から発注側に対してこのサービスのシステム開発を委託する意思がないことを伝えるに至っていることに照らすと，発注側の上記主張は採用できない。\n\nつまり「基本契約書に押印したとはいえ、金額や仕様が確定してないから契約成立とは言えない」ということです。\n\nちなみに全然関係ないけど、「基本契約書」って名前がついてるから「これで契約した！」ってなりがちですよね。でも中身が重要なんですね。で、\n\n争点（２）についても、否定しました。\n\n たしかに，（略）このサービスのシステム開発については，当初，平成２４年１１月中の運用開始を予定していたことから，契約交渉と開発作業が並行して行われ，（略）発注側は，その一部の業務を遂行していた。しかしながら，（略）発注側と開発側との契約交渉は，同年１０月下旬には，報酬の支払条件及び開発側の財務諸表の開示を巡って進展がみられなくなり，開発側からは，契約交渉と開発作業を同時並行で進めるのではなく，契約の締結を先行させることが提案されるに至っている。さらに，開発側から発注側に対し，同年１１月上旬には，このサービスの納品期限について，平成２５年３月でもかまわない旨が伝えられたことなどを考慮すると，発注側において，このサービスのシステム開発に係る委託契約が締結に至らない可能性のあることはある程度認識し得た上，納品期限との関係で，システム開発を先行させる必要性も乏しくなっていたというべきであり，これらの経緯等に鑑みれば，開発側が，発注側に対し，同委託契約が締結されることについて過大な期待を抱かせ，このサービスのシステム開発作業を行わせたとまではいえない。したがって，開発側について，契約締結段階における信義則違反は認められず，発注側の前記主張は採用できない。\n\n「発注側は10月下旬の時点で契約が成立しない可能性を認識できたはずだ」ということです。裁判所、厳しい。でも確かに交渉が止まってたのにそのまま開発を続けたのは発注側のリスク判断の問題でもあるわけで。\n\n発注側の気持ち、わかる。めっちゃわかる。つらい。でも裁判所は「あなたも気づけたでしょ」って言った。","takeaway":"で、結局なにが大事なの？\n\n- 「ほぼ決まり」は契約ではない — 金額・仕様・発注書が揃うまで正式契約じゃない。社長の発言は気持ちの表明\n- 交渉が止まったら開発も止める — 「契約不成立のリスクを認識できた」と言われたくなければ、交渉が止まった段階で立ち止まるべき\n- 「契約締結上の過失」で逃げ切るのも難しい — 「あなたも気づけたよね？」と裁判所に言われたら終わり\n- 発注書・注文書の発行まで待て — 秘密保持契約や基本契約書は「これから頑張りましょう」という書類。実際の発注書が来てから動こう\n\n最後に一言。「ほぼ決まり」で動いた人の話、今後も絶えることはないと思います。","one_liner":"「ほぼ決まり」は「全然決まってない」と同じ。発注書が来るまで信じるな。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"Web開発会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"富裕層サービス会社"}],"lessons":["契約書読んどけば…","金の話は最初にしろ"]},{"original_title":"東京地判平26.6.10（サービス終了と債務不履行）","url":"https://itlaw.hatenablog.com/entry/2021/05/16/213725","court":"東京地判","date":"平26.6.10","year":"平成26年","topic":"サービス終了と債務不履行","categories":["その他"],"fun_headline":"【朗報？】「勝手にサービス終了された！100万払え！」裁判、ユーザーが負けた件","hook":"みなさん、使ってたアプリが突然終了した経験ってありますか。\n\n僕あります。めちゃくちゃ使ってた乗換案内アプリが突然「サービス終了します」って言ってきて。いやまあ他のアプリで代用できたんですけどね。\n\n今日の話はそれを裁判にまで持ち込んだ人の話です。\n\n「同意なくサービスを終わらせたのは契約違反だ、100万払え」という話。裁判所、なんと言ったでしょうか。","summary":"・絡んでる金額: 100万円\n・テーマ: サービス終了と債務不履行","what_happened":"順を追って説明しますね。\n\n原告は携帯電話のデータ通信サービス（被告側が提供）を使っていました。\n\n被告側はサービスの利用者が大幅に減少したことから、平成19年10月22日に「このサービス、平成20年5月31日で終わります」とリリースを出しました。\n\nそして12月には、全契約者にDMを合計4回送って「サービス終わります。端末を無料で交換します」と案内しました。さらに電話でも連絡しました。\n\nここで僕の話をさせてほしいんですけど、4回もDM来たらさすがに気づきますよね。僕だったら1回でも捨てちゃいそうだけど。4回は多い。話を戻します。\n\n原告はこの案内を認識していました。しかし、無料交換の期間内に機種変更を申し出なかったんです。\n\nしかも実は、端末を修理に出していて代用機を使っていた状態だったので、仮に申し出ていても無料交換できない状態だったりもしました。\n\nちなみに全然関係ないけど、「無料交換期間内に申し出なかった」というのはなかなかのミスですよね。で、\n\n原告はサービス終了後に「自分の同意なくサービスを終わらせたのは債務不履行だ」として100万円の損害賠償を請求しました。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\n原告の気持ちはわかる気がしますよ。でも被告側は半年前から告知して、無料交換もして、電話もした。これで「俺の同意がない」って言えるのか、というのが今日の話です。","issue":"要するに何が問題だったの？\n\n被告側がサービスをやめたのは原告への「約束破り」になるのか？\n\nもう少し言うと「サービス事業者がサービスを終了することは、契約上の義務を果たさなかったことになるのか」という話です。\n\nここテストに出ます。「サービス継続」を義務と解釈できるかどうかが鍵です。","ruling":"裁判所、こう言いました。\n\n結論：債務不履行なし、原告の請求を棄却。\n\nその理由がこちらです。\n\n [1]被告側によるこのサービスの終了は，契約者の著しい減少を理由とするものであり，被告側においてその必要性は高かったし，全ての契約者からこのサービスの終了について個別の同意を得ることは著しく困難であった。\n\n[2]そして，被告側は，このサービスの終了の約半年前から，このサービスの契約者に対しこのサービスの終了を告知するとともに，このサービスと同様のサービスである代替サービスを利用できる代替端末への無料交換サービスを実施し，ダイレクトメールや電話により，契約者に対し，代替端末への機種変更を行うよう促しており，相応の代償措置を執っていた。\n\n[3]しかし原告は，ダイレクトメールやオペレーターからの電話によりこのサービスの終了及び代替端末への無料交換を認識していたが，無料交換期間内に機種変更を申し出なかったし，仮に申し出ていても，修理に出した際に借りた代用機を使用していたため，無料交換を申し出ても無料交換できない状態にあった。\n\nこれらの点に照らすと，（略）被告側には債務不履行はないというべきであり，また，上記のような事情に照らすと被告側には帰責事由もないというべきである。\n\n裁判所の言いたいことをまとめると、こういうことです。\n\n- 利用者激減で終了するのはしかたない\n- 半年前から告知して、無料交換もした\n- でも原告は知っていたのに申し出なかった\n- それは被告側のせいじゃないよね\n\n裁判所、めっちゃ冷静。好き。\n\nあ、今思い出したんですけど、この判決って「サービス事業者側が告知と代替手段をちゃんと用意した」という事実が決め手になってるんですよね。逆に言うと、何も告知せずに突然終了したら結果が違った可能性もある。","takeaway":"で、結局なにが大事なの？\n\n- サービスを終了する側は「告知」と「代替手段」を用意すること — この2つがあれば債務不履行と言われにくい\n- サービスを使う側は終了告知を見落とすな — 「知っていたのに申し出なかった」と言われたら自己責任になる\n- 全契約者の同意を得るのは現実的に無理 — 裁判所もそれを認めた。だから告知が大事\n- 無料交換期間内に動く — チャンスは向こうが用意してくれてる。使わないのはもったいない\n\n最後に一言。サービス終了のお知らせDM、ちゃんと読みましょう。捨てると後悔します。","one_liner":"サービス終了の告知を無視した結果、裁判所にも「それあなたのせいでしょ」と言われた。通知は読め。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"サービス利用者"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"携帯通信会社"}],"lessons":["証拠がないと詰む"]},{"original_title":"東京地判平25.5.23（解約経緯の情報不開示と不法行為該当性）","url":"https://itlaw.hatenablog.com/entry/2020/05/06/220651","court":"東京地判","date":"平25.5.23","year":"平成25年","topic":"解約経緯の情報不開示と不法行為該当性","categories":["契約・報酬","責任・損害"],"fun_headline":"【怖い】「なんで口座解約されたか教えろ」と証券会社を訴えた男、負ける","hook":"これ、他人事じゃないかもしれない話です。\n\n突然、証券会社から電話がきて「口座を閉鎖させていただくことになりました」って言われたとします。\n\n理由は教えてもらえない。「審査の結果です」とだけ言われる。\n\n怖くないですか？　僕だったら何もしてないのに？　って聞き返すと思う。\n\nで、今日の主人公は「個人情報保護法があるんだから審査の内容を開示しろ」と裁判を起こしました。結果は……？","summary":"・テーマ: 解約経緯の情報不開示と不法行為該当性\n・契約とお金の話","what_happened":"で、何が起きたかというと。\n\n発注側は開発側の証券取引口座を持っていて、信用取引口座を開設しようとしました。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\nでも開発側の審査で「開設できない」と言われた。しかも、開発側の担当者から電話で「現在の口座につきましても、閉鎖させていただくことになりました」と言われて、既存の口座まで解約されてしまいました。\n\n「え？　新しい口座が無理なのはまだわかる。でも今の口座まで？」ってなりますよね。\n\n発注側は開発側に対して「なんで解約されたんですか、審査の理由を教えてください」と求めました。また、個人情報保護法に基づいて「私の保有個人データをすべて開示してください」とも求めました。\n\n開発側は氏名・住所・取引内容などは開示しましたが、審査の内容や解約の経緯は教えませんでした。\n\nここまで読んで「うわぁ……」ってなった人、正常です。\n\nここで僕の話をさせてほしいんですけど、理由を教えてもらえないのって本当につらいですよね。昔バイトの面接で不採用になって、理由を聞いたら「採用基準は非公開です」って言われたことがあって。それとはまったく規模が違うんですけど、気持ちはわかる。話を戻します。\n\n発注側は「審査内容を開示しなかったのは個人情報保護法違反で不法行為だ」として損害賠償を請求しました。さらに「口座の強制解約は債務不履行だ」とも主張しました。","issue":"両者の言い分が食い違ったポイントはここ。\n\n■開発側の不法行為責任の有無\n\n「審査の内容や解約経緯」って、個人情報保護法が言う「保有個人データ」に該当するの？　該当するなら開示義務あり、不開示は違法。\n\nもう一個の争点：口座の強制解約が債務不履行かどうかについては、裁判所は「電話でのやり取りから合意解約が成立していた」と認定して開発側に債務不履行を認めました。ただし「それによる精神的損害は生じてない」として賠償は否定されています。","ruling":"裁判所、こう言いました。\n\n結論：発注側の請求を棄却。審査内容は「保有個人データ」にあたらない。\n\n 開発側は，発注側からの個人情報保護法に基づき保有個人データの開示請求に対して，直ちに，発注側の保有個人データとして，氏名，住所，生年月日，取引内容，勤務先情報，年収，投資目的，投資経験等を開示しているのであって，発注側が主張する上記審査上の理由や審査内容等が，前記(1)で述べた個人情報データベース等を構成する個人情報に含まれていたことをうかがわせる事情は見当たらない。\n\nつまり「氏名とか取引内容はちゃんと開示した。でも審査内容がそもそもデータベースに入っていた証拠がない」ということです。\n\n裁判所はさらにこう続けました。\n\nむしろ，ポイントは，Y代理人が上記回答書で述べている発注側について生じた上記種々の疑い（引用者注：証券取引契約を継続することに困難をきたす種々の疑い）が，個人データベース等に記載されていたか否かであるところ，発注側は，この点について，開発側のような証券会社においては，顧客との証券取引契約の解約などの重要な決定を行った場合には，当該顧客からの問い合わせ等に備え，それらの決定に至るまでの経緯を検索できるように個人データベース等に残しておくはずである旨主張する。しかし，前記のとおり，開発側は，何らかの解約事由に当たるとして強制解約を行ったのではなく，合意解約の申入れを行い，その了解が取れたものとして合意解約の手続を進めたものであり，その申入れに至る経緯を逐一個人データベース等に残しておくのが通常であるとはいえず，特に，本件のように，合意解約の申入れをするに至った原因が取引継続に困難を来す種々の疑いであることからすれば，これを，原則として開示の対象となる個人データベース等に残すことが通常であるとは，なおさら考えられず，発注側の上記主張には理由がない。\n\n要するにこういうことです。「怪しいと思って解約を申し出た」という内部判断を、企業が個人情報データベースに残しておくのが「通常」とは言えない。だから開示義務の対象じゃない。\n\nちなみに全然関係ないけど、「審査の理由は非公開」は法的に認められてるわけですね。「なんで落とされたか教えろ」っていうのは、ビジネスの世界では難しいことが多い。で、","takeaway":"で、結局なにが大事なの？\n\n- 個人情報保護法の「保有個人データ」は「会社が持ってる全情報」ではない — データベースに記録されてなければ開示対象にならない\n- 審査の内部判断は開示義務の対象外になりうる — 「なぜ審査に落ちたか教えろ」は法律上必ずしも通らない\n- 電話での「いいですよ」は合意として解釈される可能性がある — 解約に同意するつもりがないなら明確に「同意しない」と言う必要がある\n- 証拠がなければ主張できない — 発注側は「データベースに残すはずだ」と主張したが、残ってる証拠がなくて負けた\n\n最後に一言。「なぜか」を知る権利があると思っていても、法律上は保障されていないことがある。世の中はそういうもんです。","one_liner":"企業の「審査の内部判断」を教えてもらう権利は、個人情報保護法にはない。知りたくても、知れないことがある。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"口座解約被害者"},{"role":"開発側","icon":"💻","side":"defendant","desc":"証券会社"}],"lessons":["証拠がないと詰む"]},{"original_title":"東京地判平24.7.11（委託を受けたデータの流用）","url":"https://itlaw.hatenablog.com/entry/2023/03/31/225019","court":"東京地判","date":"平24.7.11","year":"平成24年","topic":"委託を受けたデータの流用","categories":["その他"],"fun_headline":"【最悪】「うちのデータを競合に横流しした！600万払え！」→ 裁判所「30万ね」","hook":"これ聞いたら委託契約の見直ししたくなるやつだから。\n\n仕事を頼んだ会社が、そのデータを競合他社に流用してたとします。\n\n普通にありえない話ですよね。契約書に「目的外使用禁止」って書いてあるのに。\n\n裁判にまで持ち込んで、損害額の600万を請求しました。裁判所が認めた金額は……30万円でした。\n\n意味がわからない。でも理由はあります。","summary":"・絡んでる金額: 600万円\n・テーマ: 委託を受けたデータの流用","what_happened":"話を整理しましょう。\n\n原告側は建築関係の出版社で、「建築関係法令集」という本を出しています。\n\nこの本の編集作業（原稿整理や校閲）を、外部の被告側という会社に委託しました。平成21年度版、22年度版と続けて委託しています。\n\n委託契約書には「原告側から提供された情報・資料は、本業務遂行以外の目的に使用しない」という条項がありました。いわゆる「目的外使用禁止条項」というやつです。\n\n原告側は被告側に電子データをCD-Rで渡して、被告側はそのデータを元に編集作業をして原告側に納入していました。\n\nここで僕の話をさせてほしいんですけど、出版社の編集ってデータの扱いが命みたいなところありますよね。法令集って特に年度ごとのアップデートが命で、前年度のデータがそのまま次年度の素材になる。そのデータを……話を戻します。\n\nその後、被告側は別の出版社第三者から建築関係法令集の編集を受注して、第三者は被告側の協力で平成22年度版・23年度版の法令集を出版しました。\n\nここからが本番です。覚悟してください。\n\n原告側が平成22年度版の原告側法令集と第三者法令集を比較したところ、同一箇所に同じ誤記や校正ミスが見つかりました。\n\nこれ、居酒屋の会計で考えると、二つのレシートに全く同じ計算ミスがあったようなものです。偶然の一致ではない。\n\n原告側は「被告側が私たちのデータを競合の第三者に横流しした」として、電子データの使用差止と600万円の損害賠償を請求しました。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\nで、ここからがヤバいんですけど、被告側は「流用してない」と否定していたんです。この言い訳が裁判所にどう判断されたかというと……。","issue":"両者の言い分が食い違ったポイントはここ。\n\n（1）被告側はデータを流用したのか？\n\n「同じ誤記がある」という状況証拠だけで流用を認定できるか。\n\n（2）流用が認められたとして、損害額はいくらか？\n\n原告側は「2年度分の売上減少分、約600万円」を請求。でも法令集の売上が下がったのは本当に被告側の流用のせいなのか、証明できるか。\n\nしかしながら，（略）平成２２年原告側法令集（法令編）と平成２２年第三者法令集には，同一箇所の誤記や校正のミスがあること（略）が認められ，これらに照らせば，被告側が，平成２２年第三者法令集の編集にあたって，直接，原告側提供データを使用するか，あるいは，平成２１年原告側法令集（法令編）の編集に当たって，被告側が加工した後のデータを使用したことが認められる。\n\n流用は認定されました。同じ誤記・校正ミスは証拠として十分だったわけです。\n\nさらに被告側は「加工済みのデータは原告側のデータとは別物だから目的外使用禁止の対象外」と主張しましたが、これも否定されました。\n\n次に，被告側は，平成２１年原告側法令集（法令編）の編集により加工されたデータは，原告側提供データとの同一性がなくなり，本件目的外使用禁止条項の対象とならないと主張する（略）。しかしながら，原告側は，その加工後のデータを取得するため，被告側に対し，数百万円もの業務委託代金を支払っており，この業務委託契約書①，②には，加工後のデータ（著作物）の著作権や知的財産権は，原告側に帰属する旨規定されている（１１条１項）のであり，被告側がこれを自由に使用することは許されていない。加工前のデータが本件目的外使用禁止条項の対象となって流用が禁止されるのに，加工後のデータは，被告側において自由に流用できると解するのは道理に適わないというべきであるから，加工後のデータも本件目的外使用禁止条項の対象となると解すべきである。\n\nこのように述べて，被告側の債務不履行を認めたが，損害の額については，販売部数の減少と被告側の流用行為との因果関係を認めるのが困難だとし，民訴法248条を適用して，30万円が認定された。\n\nなお，流用行為は平成22年度分でしか認められなかったことから，将来に渡って流用される蓋然性は認められないとして，原告側提供データの使用を差し止める必要性が認められないとした。","ruling":"で、裁判所はどう判断したか。\n\n被告側の債務不履行（データ流用）は認定。でも損害額は600万円じゃなくて30万円。\n\nちなみに全然関係ないけど、「同じ誤記が証拠になった」って話、スゴいと思いませんか。ミスを直さずそのまま流用したから同じミスが残ったわけで。「完璧に流用すれば証拠が残らなかったのでは」という話でもあって。いや、そもそも流用するなという話ですね。で、\n\n裁判所はデータ流用は認めたものの、「売上が下がったのが流用のせい」という因果関係は証明できないと判断しました。600万の請求に対して30万の認定。\n\nあ、今思い出したんですけど、裁判って「やったこと自体」と「損害額の証明」は別の話なんですよね。やった事実は認められても、損害の金額は別途証明が必要。これ、意外とみんな知らない話だと思います。","takeaway":"で、結局なにが大事なの？\n\n- 「加工済みなら別物」は通じない — 委託先が加工したデータも「元データの目的外使用禁止」の対象になる\n- 同じ誤記は証拠になる — コピーしたデータを使い回すと同じミスが残る。それが流用の証拠になる\n- 損害額の証明は別問題 — 「やった事実」と「損害の因果関係」は別に証明が必要。証明できなければ賠償額は小さくなる\n- 委託契約書に「知的財産権の帰属」と「目的外使用禁止」を明記しておく — この2つがあったから勝てた（30万だけど）\n\n最後に一言。証拠を残してからやるか、そもそもやらないかのどちらかです。","one_liner":"委託したデータを競合に流用されたのに、損害賠償は30万円。証拠がなければお金は取れない。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"建築出版社"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"編集委託会社"},{"role":"第三者","icon":"👥","side":"third","desc":"競合"}],"lessons":["証拠がないと詰む","「完成」って何？","損害、証明できる？"]},{"original_title":"東京地判平24.5.30（アジャイルの不履行，虚偽表示）","url":"https://itlaw.hatenablog.com/entry/2019/07/20/000402","court":"東京地判","date":"平24.5.30","year":"平成24年","topic":"アジャイルの不履行，虚偽表示","categories":["その他"],"fun_headline":"【悲報】「アジャイルだからドキュメントなし」を裁判所に持ち込んだ結果がヤバすぎた","hook":"「アジャイルだから仕様書なくても大丈夫」ってIT業界でよく聞くじゃないですか。\n\nそれを裁判所で言い張った人がいたんですよ。\n\n結果どうなったか？　今日はその話をします。震えながら聞いてください。","summary":"・絡んでる金額: 2億円\n・テーマ: アジャイルの不履行，虚偽表示","what_happened":"状況を整理しますね。\n\nX（開発する側）とY（お金を払う側）が、ECモール構築のシステム開発について話し合いを重ねました。\n\n委託料は約1.2億円。でかい。\n\nで、ここからがヤバいんですけど、原告はシステム開発をやり切ったと言い張って、被告に5000万円を払えと訴えたんですよ（本訴）。\n\n一方の被告は「そもそも建物貸してたのに家賃払ってない」として反訴。\n\nもう何がなんだかわからない。\n\nここで僕の話をさせてほしいんですけど、僕ってタスク管理が壊滅的に苦手で、昨日「あの資料どこ行った？」ってなったんですよ。でもそれ、個人レベルの話で、1.2億の案件でそれやったら完全にアウトですよね。話を戻します。\n\n原告はアジャイル開発でやったんだから、ドキュメントがないのは当然だと主張します。\n\nちょっと待ってほしい。","issue":"要するに、何が問題だったの？\n\n2つあります。\n\n①「システム仕様書」ちゃんと作ったの問題\n\n裁判所が出てきた書類を見たら、「○○サークルシステム要件定義書」とかがあった。でも内容を見たら「これ、システム仕様書って呼べる？」と疑問符だらけ。既存ソフト使って作ったのに、そのことが書いてない。ここテストに出ます。\n\n②「アジャイルだからドキュメントなし」は言い訳になるの問題\n\n【ちょっと解説】アジャイル開発── 大きな計画を立てずに、短いサイクルで「作る→試す→改善する」を繰り返す開発手法。ドキュメントより動くソフトを重視する、というのが元々の思想。\n\n原告が「アジャイルだからドキュメントなくて当然」と言ったやつです。これが通るかどうかが最大の争点。","ruling":"裁判所、こう言いました。まず仕様書について。\n\n  確かに「○○サークルシステム要件定義書」、「○○サークルポイントシステム要件定義書」及び平成２０年８月２７日付けの「納品書」が存在することが認められる。\n\n本件委託契約書第２条によれば、「システム仕様書」とは、このソフトウェアを開発する上で必要となるシステムの目的、機能及び制限事項、技術的実現方法、運用上の制約事項などの事項が記述された書類であり、本契約に基づき乙（X）によって作成されるものをいうところ、「○○サークルシステム要件定義書」は、目次の項目の中に、「システムの目的」、「システムのスケジュール」、「用語の定義」が記載され、「システム開発の前提条件」、「システム要件」の項目の中には、「機能要求」、「サーバ運用設定情報」、「機能外要求」、「セキュリティ目標」等が記載され、「○○サークルポイントシステム要件定義書」も同様の項目が記載されていることが認められるものの、その内容の一般性をみると、上記「システム仕様書」の定義に当てはまるといえる程の内容であるのか疑問であり、また、仮に要件定義書が「システム仕様書」にあたるとしても、このソフトウェアは、既存のソフトを使って作られたというのであるから、その点も要件定義書に記載されてよいはずであるが、かかる記載は認められない。\n\n(略)\n\n以上からすると、システム仕様書作成業務が履行されたとは認められない。\n\n裁判所、めっちゃ冷静。好き。\n\n続いてアジャイルの言い訳について。\n\n アジャイル・ソフトウェア開発は従来のソフトウェア開発手法とは異なり、余計な成果物や手順を排除した軽い手法を目指すものであるが、その目的はユーザーに価値をもたらし、かつ、動作が保証されたソフトを超高速で実現するというものであるから、アジャイル・ソフトウェア開発を採用したことが直ちにドキュメントを省略したことの合理的な説明となるとは考えられない。また、エクストリーム・プログラミングは、開発リスクを早期に軽減することに主眼をおき、一回のイテレーション（開発サイクル）で開発する機能（ストーリー）をユーザーが選び、そのストーリーをプログラムとして実現していくという作業を繰り返すというものであり、本件において、原告と被告との間で、ドキュメントを省略することを選択したと認められる証拠もない。ドキュメントが作成されなければ、プログラムを開発した担当者が退社などした場合を考えると、「○○サークルシステム要件定義書」、「○○サークルポイントシステム要件定義書」、「タイムライン」、「チケット一覧」、「チケット」、「チェンジセット」などから、直ちにシステムの保守ができるのか疑問であり、最低限のドキュメントが必要であると考えられるところ、本件において最低限のドキュメントが存在するとはいえない。X代表者は、ホワイトボードにメモを書きながらシステム開発を行ったと供述するが、これを裏付ける証拠もない。したがって、原告の主張は採用できない。\n\nつまり「アジャイルだから」は言い訳にならない、ということです。\n\nドキュメントをなくすのは「ドキュメント省くって合意した証拠があるとき」だけですよ、と。\n\nそして「ホワイトボードに書いた」って言ったけど証拠ないじゃん、と。\n\n証拠がない主張は、存在しないのと同じ。裁判所の論理はシンプルで残酷です。\n\n結果、原告の本訴請求はすべて棄却。お金はもらえませんでした。","takeaway":"で、結局なにが大事なの？\n\n・アジャイルは「ドキュメント不要」ではなく「最低限のドキュメントは要る」。そこ誤解してる人、多い\n・「ドキュメント省きます」という合意をするなら、書面に残せ。口約束は証拠にならない\n・「ホワイトボードに書いた」は証拠にならない。写真撮れ。議事録に残せ\n・アジャイル開発を採用するなら、何を省いて何を残すか最初に合意しておけ\n\n最後に一言。アジャイルは方法論であって、「証拠を残さなくていい」という免罪符ではありません。","one_liner":"アジャイルだからドキュメントなし、は裁判所には通じない。アジャイルマニフェストは法廷で読まれない。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"システム開発者"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"ECモール発注者"}],"lessons":["契約書読んどけば…","証拠がないと詰む"]},{"original_title":"東京地判平23.3.30（追加代金請求の可否）","url":"https://itlaw.hatenablog.com/entry/2020/06/04/235354","court":"東京地判","date":"平23.3.30","year":"平成23年","topic":"追加代金請求の可否","categories":["その他"],"fun_headline":"【実話】「2700万持ち出しで苦しい」と伝えたら「あとで埋め合わせします」メールが来た→裁判になった","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n「今、2700万円の持ち出しが出て厳しいです」って取引先に伝えたら、「今後の案件で埋め合わせするよう頑張ります」っていうメールが返ってきたとします。\n\nこれ、追加代金をもらう約束になってると思いますか？\n\n今日はそれを裁判所に聞いた話です。","summary":"・絡んでる金額: 5800万円\n・テーマ: 追加代金請求の可否","what_happened":"状況を整理しましょう。\n\n被告はAからシステム開発を受託して、そこから原告に再委託しました。\n\n業務委託基本契約を締結して、個別契約は「注文書・請書の手交」で成立するルールでした。\n\n【ちょっと解説】注文書・請書── 「この仕事お願いします」（注文書）→「わかりました」（請書）のセットで契約成立、というやり方。口約束じゃないので証拠が残る。\n\n第1から第9まで個別契約が締結され、成果物も納品。代金合計約5800万円が支払われました。\n\nここまではよかった。\n\nで、ここからがヤバいんですけど。\n\n納品直前に原告が被告に「2700万の持ち出しが出て厳しい」と伝えたところ、被告の担当者から「今後の改修案件での工数の上積みで埋め合わせできるよう努力する」というメールが来ます。\n\n原告の気持ち、わかる。めっちゃわかる。つらい。\n\nちなみに全然関係ないけど、「努力します」って言葉って、よく考えると何も約束してないですよね。「努力する」だから。結果は保証しない。大事なことを言っているようでいて何も言っていない言葉、ランキング上位に入ると思う。話を戻します。\n\n原告はこのメールを根拠に「追加でお金をもらえる合意があった」として約2700万円を請求しました。","issue":"要するに、何が問題だったの？\n\n「努力するメール」は追加代金の合意になるの？　これです。\n\n原告は3つの根拠で請求しました。\n①事後的に金額を調整する合意があった（主位的主張）\n②不法行為（わざと損害を与えた）にあたる\n③下請法違反にあたる\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約がなくても「やったことが悪い」なら責任を問える。\n\n③について補足すると、原告は「被告が一方的に低い代金を押しつけた、これは下請法違反だ」と主張しました。\n\nさあ、裁判所はどう判断するか。","ruling":"裁判所、こう言いました。\n\n追加代金の合意があったかどうかについて。これは認められませんでした。\n\n下請法違反の主張についても、裁判所はこう言います。\n\n 代金合意及びその経緯については，（略）原告は，空港系支援業務との作業名による計５人月分の追加発注を受け，また，実体のない契約の締結や当該代金名下での支払をも受けるなどしていたとの事実も認められるところであり，これらの経緯に照らした場合，被告が，原告に一定の行為を強いうる地位にあったものとは認められない。そして，甲３１及び甲４０にある押し付けや無理矢理といった表現部分等にしても，その内容は曖昧であり，本件全証拠によっても，被告が代金を不当に定めたとの事実は，これを認めるに足りないことから，不法行為の主張はその余の点について検討するまでもなく理由がない。\n\nつまりこういうことです。\n\n「そもそも被告が原告に強制できる立場にあったとは言えない。むしろ原告は追加の仕事をもらったりしてたじゃないか。押し付けって言ってるけど証拠が曖昧。不法行為は認めない。」\n\n全部却下。\n\n原告の請求は認められませんでした。「努力するメール」は法的な合意じゃなかった。\n\n今気づいたんですけどこの記事もう結構長くないですか？　でも大事なとこなので続けます。","takeaway":"で、結局なにが大事なの？\n\n・「後で埋め合わせします」メールは合意の証拠にならない。「いくら、いつ、どうやって」が必要\n・追加代金が発生しそうなら、作業前に書面で合意を取れ。口頭やメモレベルでは戦えない\n・下請法を使いたいなら「強制された」という明確な証拠が必要。「なんとなく言われた気がする」は無理\n・合意の証拠（メール、議事録、注文書）は丁寧に保管しろ\n\n最後に一言。「後で話し合いましょう」は今話し合わないということ。","one_liner":"「努力します」は約束じゃない。契約書に書いてないことは、存在しないのと同じ。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"システム開発会社"},{"role":"下請業者","icon":"🔧","side":"third","desc":""},{"role":"被告","icon":"⚖️","side":"defendant","desc":"元請けベンダ"}],"lessons":["契約書読んどけば…","証拠がないと詰む","口約束は約束じゃない"]},{"original_title":"東京地判平19.10.11（追加発注の範囲と報酬額）","url":"https://itlaw.hatenablog.com/entry/2023/02/21/225053","court":"東京地判","date":"平19.10.11","year":"平成19年","topic":"追加発注の範囲と報酬額","categories":["契約・報酬"],"fun_headline":"【朗報】「追加でやった仕事、お金払ってよ」と言い張ったら裁判所が認めてくれた話","hook":"「え、お金もらえないの？」\n\nIT業界でわりとよく聞く話なんですけど。\n\n「追加でやった作業、別料金ですよね？」「いや、それ込みでしょ」みたいなやつ。\n\n今日はそれを裁判所に持ち込んだら、開発した側が勝った話をします。珍しい。","summary":"・絡んでる金額: 5000円\n・テーマ: 追加発注の範囲と報酬額\n・契約とお金の話","what_happened":"順を追って説明しますね。\n\n開発側が発注側に特許情報管理システムの設計開発を依頼しました。\n\nまず要件定義フェーズで請負契約を結んで、発注側が要件定義書を作って開発側に渡して、262万5000円が支払われました。順調。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。ラーメン屋で「カレーください」と注文するようなもの。カレーが出てこなかったら契約違反。\n\nその後、内部設計の第1請負契約、仕様変更目的の第2請負契約と続きます。\n\n開発側は発注側に合計720万円を支払って、第1請負契約代金に充当されました。\n\nここからが本番です。\n\n発注側は「第1請負の代金は1050万円だから残り330万円払え」「第2請負の代金は283万5000円払え」と主張しました。合計610万円くらい。\n\n開発側は「そんな話は聞いてない。むしろ債務不履行で解除したから、払った720万円を返せ」と反論。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期遅れ、バグだらけ、そもそも作らなかった、全部これ。\n\nここで僕の話をさせてほしいんですけど、僕って友達に「割り勘ね」って言われたのに後からやっぱり奢ってと言われたことがあって、あれ本当にきつかったですよ。でも今回の話はスケールが違う。610万の「割り勘ね、やっぱり奢って」。話を戻します。\n\n特に揉めたのが第2請負契約の内容です。開発側は「あの作業、Cという個人への依頼であって、X（会社）への依頼じゃなかった」と言い張りました。","issue":"要するに、何が問題だったの？\n\n第2請負契約の中身がどっちの主張通りかです。\n\n発注側の主張：パテントニュース配信対応（PN作業）と旧システムバグ対応を含む。3人月で283万5000円。\n\n開発側の主張：PNはC個人への依頼。バグ対応は無償。だから発注側への追加代金はゼロ。\n\n証拠がある方が勝つ世界です。","ruling":"裁判所、こう言いました。\n\n「C個人への依頼だった」という開発側の主張について。\n\n開発側は，ＰＮ対応作業は，Ｃ個人に対する依頼であった旨主張し，Ｄはそれに沿う供述をするが，同作業には発注側従業員Ｅも関与して行われたことが認められ（略），また，同作業のほか，第２請負契約の各作業が第１請負契約の作業開始後，追加割込作業として加わったため，第１請負契約の作業が遅れ，詳細設計書の完成も当初予定時期から遅れたことは前記認定のとおりであり，（略），当時Ｃは原告技術担当取締役であったことなどの事実に照らすと，前記Ｄの供述は措信できず，他に前記認定を覆すに足りる証拠はない。\n\n要するに「発注側の従業員も関わってたし、Cは発注側の取締役だったし、あなたの主張は信用できない」ということです。\n\nY、完全に論破された。\n\n次に金額について。283万5000円と確定できる客観的証拠はなかったんですよ。でも裁判所はこう推論しました。\n\n- 別の作業で「1人月90万円、2人月分189万円」を払った実績がある\n- だから開発側も同程度の単価になると推測できた\n- 発注側はこれをさらにA社に70〜80万円で外注していた\n\nこれって要するに、ラーメン屋でいつも「大盛り500円」だったのに急に「大盛りの値段は決まってなかった」って言い張るのと同じくらい無理な話ですよね。\n\nえっ。マジで？　という感じですが、裁判所は3人月・283万5000円を認定。発注側の請求すべて認めました。\n\n発注側が全勝。珍しい。","takeaway":"で、結局なにが大事なの？\n\n・追加作業の依頼は書面で。「C個人への依頼」なのか「会社への依頼」なのか明確にしろ\n・過去の取引実績は証拠になる。単価の慣行が認定の根拠になることがある\n・「請負」か「準委任」か確認しよう。請負は完成責任あり、準委任は善管注意義務あり\n・契約書に金額が明記されてなくても、証拠と状況から認定されることがある\n\nあ、今思い出したんですけど、このケース開発側が勝ってるの、本当に珍しいんですよ。普段は発注側が強い。証拠をきっちり揃えた側が勝つ、それだけの話です。","one_liner":"「契約書なんてなくても大丈夫」は、大丈夫じゃなかったときに一番後悔するセリフ。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"システム開発会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"特許管理会社"}],"lessons":["契約書読んどけば…","「完成」って何？","金の話は最初にしろ"]},{"original_title":"東京地判平3.2.22（契約の性質と遅延の責任の所在）","url":"https://itlaw.hatenablog.com/entry/2019/10/12/141255","court":"東京地判","date":"平3.2.22","year":"平成10年以前","topic":"契約の性質と遅延の責任の所在","categories":["契約・報酬","責任・損害"],"fun_headline":"「仕様書が遅れたせいで完成できなかった」→裁判所「いや、それあなたの仕事ですよね」","hook":"お金の話って、だいたいめんどくさいですよね。\n\nでも今日の話は、めんどくさいを通り越して、ちょっと怖い。\n\n「完成できなかったのは相手のせい」って言い張ったら、裁判所に「全部あなたの責任ですよ」って言われた話です。\n\nIT系の開発に関わってる人は特に聞いておいてほしい。","summary":"・絡んでる金額: 700万円\n・テーマ: 契約の性質と遅延の責任の所在\n・契約とお金の話","what_happened":"話を整理しましょう。\n\nAが文字入力システムの開発を被告側に依頼して、被告側がそれを発注側に再委託しました。\n\n途中でシステム完成が遅延して、最終的に完成しませんでした。\n\n発注側は被告側に「実は派遣契約の形で人員提供してたんだから、700万円払ってよ」と訴えました（本訴）。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになる。お互い「もらったものを返す」義務が発生する。\n\n被告側は逆に「発注側がプログラム完成させないまま放棄した。履行不能で解除するから、前払いした400万円を返せ」と反訴。\n\nここで僕の話をさせてほしいんですけど、「やり切れなかったけど責任は相手にある」という状況、社会人として一番つらいやつですよね。僕も昔バイトで似たような経験をしたんですけど、実態は全然似てない。僕の場合は閉店前にシフトを上がったら翌日店長に怒られた、というだけの話なので。話を戻します。\n\n発注側は「完成しなかったのは仕様書の提出が遅れた被告側のせいだ」と主張しました。","issue":"要するに、何が問題だったの？\n\n「未完成の責任はどっちにある？」これです。\n\n発注側の言い分は3つ。\n①仕様書の提出が遅れた\n②システム設計とプログラム設計はY側の仕事だった\n③仕様変更が頻繁で作業量が爆増した\n\nこれが認められれば「被告側のせいで完成できなかった」になり、発注側は被告側に700万円を請求できます。\n\n逆に認められなければ、発注側は被告側へ400万円を返す羽目になります。ここテストに出ます。","ruling":"裁判所、ものすごく丁寧に全部潰していきました。\n\nまず「仕様書の提出遅延が原因」という言い訳について。\n\n (二)　しかし、発注側の右主張は、前記のように、このプログラムの作成が遅延したことの理由付けにはなりえても、およそこのプログラムを作成することができなかった結果となったことの理由付けになるものではない。（略）本件においては、被告側は、発注側が右プログラムの作成から手を引いた後、相当の日時は要したものの独自にこれを完成してAに納入したことが認められるのであり、当初の契約期限が経過したからといって、発注側においてその作成をすることが不可能となったというような事情はなかったものといわなければならず、仮にY側に仕様書の提出の遅延があったとしても、その事由をもって、発注側の債務の履行不能についての帰責事由とすることはできないといわなければならない。\n\nつまり「被告側が自力で完成させてたんだから、物理的に作れなかったわけじゃないでしょ」ということです。辛辣。\n\n次に「システム設計はY側の仕事だった」という言い訳について。\n\n (三)　のみならず、発注側が主張する事由自体についても、以下のとおり、その存在を認めることはできない。\n\nすなわち、発注側は、その請け負った債務には、具体的なプログラムを作成することのみが含まれ、システム設計及びプログラム設計は含まれておらず、これらはY側が提供する約束であったところ、その提供が遅延したというのであるが、発注側の債務のうちにプログラム設計が含まれていたことは、X代表者がその尋問の結果において自認するところである。また、システム設計についても、〈証拠〉によれば、発注側は、このシステムの開発工程として、仕様検討、基本設計からプログラム設計、コーディング、デバック、ドキュメント作成までを考えていたことが認められ、このうち仕様検討とは、まさにシステム設計のことなのである（略）から、これも、発注側の請け負った債務に含まれていたと優に認めることができるのである。\n\nそうすると、発注側としては、システム設計及びプログラム設計は、その自ら行うべき作業なのであるから、Y側からその提供されるのを待つ等ということは有り得ないものといわなければならない。\n\n「X代表者自身が尋問で認めてるじゃないですか」という話です。自分で言ってしまった。つらすぎる。\n\n次に「仕様変更が多すぎた」という言い訳について。\n\n (四)　もっとも、発注側は、システム設計をするための要求仕様自体を被告側が提供しなかったとも主張している。しかし、Aは、昭和六〇年一一月一八日ないしこれに近接した日時に「キャプテンITE仕様書」（乙第二号証）、「ITE仕様説明書」（乙第三号証）及び「キャプテン情報入力装置操作法説明書」（乙第四号証）を交付したものであることは発注側が争わないところである。発注側は、これらが指図として不十分なものであったと主張するのであるが、（略）右各資料の交付に際し、詳細な説明がX側に対し行われたことが認められることに照らせば、右各資料は、これをもって優にこのシステムについて開発作業に入るための要求仕様書に当たるものと認められるのである（もっとも、右記載内容は、なお相当に概括的なものではあることを免れないが、およそシステム開発を一括して請け負った者であれば、ある程度概括的なものであっても、それがどのようなことを実現したいのかが把握できる程度のものである限り、注文主に発問し、提案する等してプログラム開発が可能となる程度まで右要求を具体化していくことはその職務内容に属するものというべきである。本件において、X側が、右の各資料を受け取って後Aに対しそうした働き掛けを一切しなかったことは一部X代表者の自認するところであ（略）る。）。\n\n「概括的でも、プロなら質問して具体化するのがあなたの仕事でしょ。それを一切しなかったってX自身が認めてますよね」ということです。\n\n最後に仕様変更の言い訳も。\n\n (五)　また、発注側は、Aが仕様変更を頻繁に行い、その為に発注側の作業量が著しく増大したことをも履行不能の一因としてあげる。しかし〈証拠〉によれば、仕様変更があったとの主張のされている多くの項目は、本件三月版システムの開発項目に入っていないものであるし、入っているものについても、各資料間の説明の相違は、これによって機能そのものの仕様の変更を来すものは殆どなく、機能の実現方法における相違が大部分であると認められる。そして、機能をどのように実現するかはシステム設計の内容であり、これは、前認定のように発注側の行うべきことなのであるから、発注側は、A側からの資料に疑問があれば、これを指摘し、疑問点を解消してシステムの完成を図るべきであったのであり、提供された資料の間に相違があったからといって、Y側が何らかの責めを負わなければならないとはいえない。\n\n「機能の実現方法を決めるのはあなたの仕事。資料に疑問があれば聞くのがプロ。」\n\n裁判所、全部論破。X全敗。発注側は400万円を返すことになりました。","takeaway":"で、結局なにが大事なの？\n\n・「仕様書が遅れた」は免罪符にならない。プロとして質問して具体化するのが受注者の仕事\n・「相手のせいで完成できなかった」を主張するなら、その証拠を当時から記録しておけ\n・請負契約の場合、何を自分の仕事の範囲とするか、契約書に明記しないと後で泣く\n・困ったときは弁護士に相談。ネットの法律情報だけで判断すると手遅れになることがある\n\nこの判例、相手のせいにするのが4本全部潰されてます。怖すぎる。","one_liner":"お金のことは最初に決めておけ。そして決めた内容は書面に残せ。おばあちゃんもそう言ってた。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"システム開発会社"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"元請け会社"}],"lessons":["契約書読んどけば…","証拠がないと詰む","「完成」って何？"]},{"original_title":"東京地判昭57.12.6（著作権法によるプログラムの保護）","url":"https://itlaw.hatenablog.com/entry/2018/10/17/202438","court":"東京地判","date":"昭57.12.6","year":"平成10年以前","topic":"著作権法によるプログラムの保護","categories":["著作権","プログラム・システム"],"fun_headline":"全ITエンジニアが震えた「スペースインベーダーのプログラム、著作権あります」裁判1982","hook":"みなさん、スペースインベーダー知ってますか？\n\n1978年のゲームです。僕は生まれてません。\n\nでもこの判例は1982年の裁判で、「プログラムって著作権で守られるの？」という問いに初めて正面から答えた歴史的なやつなんですよ。\n\n当時の法律にはプログラムが著作物として書いてなかった。じゃあどうなる？　今日はそういう話です。","summary":"・絡んでる金額: 200万円\n・テーマ: 著作権法によるプログラムの保護\n・著作権がらみの争い","what_happened":"で、何が起きたかというと。\n\n利用側が、X（タイトー）が販売するゲーム「スペース・インベーダー・パートII」のプログラムをマシン語に置き換えたオブジェクトプログラムをROMに入れて、同じゲームができるよう基盤を改造しました。\n\nつまり、タイトーのゲームを丸パクリして基盤を売ってたわけです。\n\nここで僕の話をさせてほしいんですけど、スペースインベーダーってゲームセンターに専用の筐体（きょうたい）があって、それが当時すごく流行ったんですよね。僕は生まれてないので全部Wikipediaの知識ですが。当時の人にとってはとんでもない衝撃だったらしい。話を戻します。\n\nタイトーは当然怒ります。「著作権の侵害だ。200万払え」と訴えました。\n\nところが、当時の著作権法にはプログラムが著作物として明記されていませんでした。\n\n利用側の言い分は「このプログラムに使われてる記号語は人間に理解できるものじゃない。だから思想を表現したとは言えないし、著作物じゃない」というものでした。\n\nちょっと待ってほしい。「人間に読めないから著作権なし」ってそれ通ったら大変なことになるぞ。","issue":"で、何が問題になったかというと──\n\nプログラムに著作物性はあるか、という一点です。\n\n【ちょっと解説】著作物性── 「それ、著作権で守られる著作物ですか？」という問い。著作物と認められるには「創作的な表現」が必要。ありふれた表現やアイデアそのものは対象外。\n\n利用側は「人間が読めない記号語で書かれたプログラムは思想を表現したものとは言えない」と主張。\n\nこれが認められたら、プログラムは著作権で守られないことになります。\n\nここテストに出ます。しかも歴史的な意味で。","ruling":"裁判所、こう言いました。\n\n このプログラムは、このゲームの内容を本件機械の受像機面上に映し出すことを目的とし、その目的達成のために必要な種々の問題を細分化して分析し、そのそれぞれについて解法を発見した上で、その発見された解法に従つて作成されたフローチャートに基づき、専門的知識を有する第三者に伝達可能な記号語（アッセンブリ言語）によつて、種々の命令及びその他の情報の組合せとして表現されたものであり、当然のことながら右の解法の発見及び命令の組合せの方法においてプログラム作成者の論理的思考が必要とされ、また最終的に完成されたプログラムはその作成者によつて個性的な相違が生じるものであることは明らかであるから、このプログラムは、その作成者の独自の学術的思想の創作的表現であり、著作権法上保護される著作物に当たると認められる。\n\nつまりこういうことです。\n\n「プログラムを作るとき、問題を分析して解法を考えて命令の組み合わせを作る。そこに作者の論理的思考があり、作者によって結果が違う。だから著作物だ。」\n\n裁判所、めっちゃ冷静。好き。\n\nさらに、利用側が複製したのはオブジェクトコード（機械が読む形式）でしたが、ソースプログラム（人間が読む形式）の複製物にあたる、という判断もされました。\n\nいや、そうはならんやろ。なっとるやないか。\n\nちなみに全然関係ないけど「そうはならんやろ、なっとるやないか」ってもともと漫才のツッコミとして使われてた言葉なんですけど、法律の話でも「そうはならんやろ」って思った瞬間に「なっとるやないか」という事実を突きつけられることが多い。話を戻します。\n\n損害賠償は1台2万円で27台分、合計54万円が認められました。請求の200万円よりは少ないけど、歴史的判決。","takeaway":"で、結局なにが大事なの？\n\n・プログラムは著作物として保護される（この判決以降、特に1985年に著作権法改正で明示的に追加された）\n・「人間に読めない」「機械語に変換した」は著作権侵害を免れる理由にならない\n・オブジェクトコードもソースプログラムの複製物として扱われる\n・トラブルの記録は丁寧に残そう。裁判では「書いてある・書いてない」で決まる\n\nこの判決、1982年の判決です。スマホもクラウドもない時代。でも「プログラムに著作権はあるか」という問いへの答えは今も生きてる。","one_liner":"コードを書いた瞬間から、それはあなたの著作物。盗むやつは1982年から負けてる。","parties":[{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"タイトー"},{"role":"第三者","icon":"👥","side":"third","desc":""},{"role":"利用側","icon":"⚖️","side":"defendant","desc":"ゲーム基盤改造者"}],"lessons":["著作権は万能じゃない","パクリの立証は地獄"]}];

function renderParties(parties){
  if(!parties||parties.length<2)return '';
  const pl=parties.filter(p=>p.side==='plaintiff');
  const df=parties.filter(p=>p.side==='defendant');
  const th=parties.filter(p=>p.side==='third');
  // 3+ parties: diagram view
  if(parties.length>=3){
    const colors=['n0','n1','n2','n3'];
    let nodes=parties.map((p,i)=>{
      let label=p.desc?e(p.desc):'';
      return '<div class="pnode '+colors[Math.min(i,3)]+'">'+p.icon+' '+e(p.role)+(label?'<div class="pn-role">'+label+'</div>':'')+'</div>';
    }).join('');
    let rels=[];
    if(pl.length&&df.length)rels.push(e(pl[0].role)+(pl[0].desc?' ('+e(pl[0].desc)+')':'')+' → 提訴 → '+e(df[0].role)+(df[0].desc?' ('+e(df[0].desc)+')':''));
    if(th.length)th.forEach(t=>rels.push(e(t.role)+(t.desc?' ('+e(t.desc)+')':'')+' が関与'));
    let relHtml=rels.length?'<div class="pdiag-rels">'+rels.map(r=>'<span class="prel">'+r+'</span>').join('')+'</div>':'';
    return '<div class="pdiag"><div class="pdiag-title">⚖️ この裁判の登場人物</div><div class="pdiag-nodes">'+nodes+'</div>'+relHtml+'</div>';
  }
  // 2 parties: vs card
  const p1=pl[0]||parties[0];
  const p2=df[0]||parties[1];
  return '<div class="pvs"><div class="pc pl"><div class="icon">'+p1.icon+'</div><div class="role">'+e(p1.role)+'</div>'+(p1.desc?'<div class="desc">'+e(p1.desc)+'</div>':'')+'<div class="side">⬅ 訴えた側</div></div><div class="pvs-mid">VS</div><div class="pc df"><div class="icon">'+p2.icon+'</div><div class="role">'+e(p2.role)+'</div>'+(p2.desc?'<div class="desc">'+e(p2.desc)+'</div>':'')+'<div class="side">訴えられた側 ➡</div></div></div>';
}

function fmtBody(text){
  if(!text)return '';
  const lines=text.split('\n');
  let h='',inQ=false;
  for(let l of lines){
    l=l.trim();
    if(!l){if(inQ){h+='</div>';inQ=false}continue}
    // 法律用語解説ボックス
    if(l.startsWith('【ちょっと解説】')){
      if(inQ){h+='</div>';inQ=false}
      h+='<div class="glossary">'+e(l.replace('【ちょっと解説】',''))+'</div>';
    }
    // 裁判所引用（中身がある場合のみ）
    else if((l.startsWith('>')||l.startsWith('＞'))&&l.replace(/^[>＞]\s*/,'').trim()){
      const qt=l.replace(/^[>＞]\s*/,'');
      if(!inQ){h+='<div class="cq">';inQ=true}
      h+=e(qt)+'<br>';
    }
    // 永田リアクション
    else if(l.match(/^(いやいや|えっ[。．?？]|ここ、大事|僕がこの|ここまで読んで|わかります|ちょっとここで|いや、そう|ここからが本番|この時点で|ここ、エンジニア|こういうの聞くと|マジ[？?。]|ヤバい|ヤバすぎ|怖すぎ|意味がわからない|ねえ聞いて|ちなみに全然関係ない|話を戻し|ここで僕の話|今気づいたんですけど|あ、今思い出した|ここテストに出ます|で、結局|どういうこと[？?]|つらい[。.]|正直に言うと|ここで全然関係ない話|待って[。、]|ちょっと待って|これ聞いたら|ここ大事なとこ|全ITエンジニア|この判決[、,]|僕[はも]この|いや待って|なんでこうなった|嘘でしょ|信じられない|冷静に考えて|まあ聞いてください|すみません、ここで|あっ、ちなみに|ここだけの話|一回整理すると|簡単に言うと|ここで豆知識|要するに[これそ])/)){
      if(inQ){h+='</div>';inQ=false}
      h+='<div class="reaction">'+e(l)+'</div>';
    }
    // セクション見出し（## は除外）
    else if(l.startsWith('## ')){
      if(inQ){h+='</div>';inQ=false}
    }
    // 通常テキスト
    else{
      if(inQ){h+='</div>';inQ=false}
      let el=e(l).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      h+='<p class="bt">'+el+'</p>';
    }
  }
  if(inQ)h+='</div>';
  return h;
}

function fmtSum(text){
  if(!text)return '';
  return '<ul>'+text.split('\n').filter(l=>l.trim()).map(b=>'<li>'+e(b.replace(/^[・\-]\s*/,''))+'</li>').join('')+'</ul>';
}

function getF(){
  return C.filter(c=>{
    const catOk=aCat==='all'||c.categories.includes(aCat);
    const yrOk=aYr==='all'||c.year===aYr;
    const lesOk=aLesson==='all'||(c.lessons&&c.lessons.includes(aLesson));
    const qOk=!sQ||c.fun_headline.toLowerCase().includes(sQ)||c.topic.toLowerCase().includes(sQ)||c.original_title.toLowerCase().includes(sQ)||c.categories.some(x=>x.includes(sQ));
    return catOk&&yrOk&&lesOk&&qOk;
  });
}

function renderList(){
  const sy=y=>y.replace(/（.*?）/,'');
  const tg=cats=>cats.map(c=>'<span class="tag '+(TC[c]||'t-etc')+'">'+c+'</span>').join('');
  const ybtn=yrs.map(y=>'<button class="fb'+(aYr===y?' on':'')+'" data-yr="'+y+'">'+sy(y)+'</button>').join('');
  const catDef=[['all','すべて'],['著作権','著作権'],['契約・報酬','契約・報酬'],['責任・損害','責任・損害'],['プログラム・システム','プログラム'],['PM・開発管理','PM'],['瑕疵・完成','瑕疵'],['ネット・コンテンツ','ネット'],['営業秘密','営業秘密'],['セキュリティ','セキュリティ'],['暗号資産・ブロッキング','暗号資産'],['利用規約・消費者','利用規約'],['プライバシー','プライバシー'],['その他','その他']];
  const cbtn=catDef.map(([v,l])=>'<button class="fb'+(aCat===v?' on':'')+'" data-cat="'+v+'">'+l+'</button>').join('');
  const lessonSet=new Set();C.forEach(c=>(c.lessons||[]).forEach(l=>lessonSet.add(l)));
  const lesArr=Array.from(lessonSet).sort();
  const lbtn='<button class="fb lb'+(aLesson==='all'?' on':'')+'" data-les="all">すべて</button>'+lesArr.map(l=>'<button class="fb lb'+(aLesson===l?' on':'')+'" data-les="'+e(l)+'">💡'+e(l)+'</button>').join('');
  const fl=getF();
  const cards=fl.map((c,i)=>{
    const idx=C.indexOf(c);
    return '<div class="card" onclick="go('+idx+')" style="animation-delay:'+Math.min(i*.02,.5)+'s"><div class="top"><span class="ct">'+e(c.court)+' '+e(c.date)+'</span><span class="yr">'+sy(c.year)+'</span></div><div class="mid"><div class="hl">'+e(c.fun_headline)+'</div><div class="ol">'+e(c.one_liner)+'</div></div><div class="tags">'+tg(c.categories)+(c.lessons&&c.lessons.length?' '+c.lessons.map(l=>'<span class="ltag lclick" onclick="event.stopPropagation();filtLesson(\''+e(l).replace(/'/g,"\\'")+'\')">💡'+e(l)+'</span>').join(''):'')+'</div><div class="rm">📖 この判例を読む →</div></div>';
  }).join('');

  document.getElementById('app').innerHTML='<div class="view"><header class="hero"><div class="hero-in"><h1><span class="g">⚖️</span> IT裁判沙汰コレクション</h1><p class="sub">ITエンジニアのための判例ガイド。法律知識を、面白がりながら学ぼう。</p><div class="stats"><div class="stat">📚 <b>'+C.length+'</b>件の判例</div><div class="stat">📅 昭和57年〜令和8年</div><div class="stat">🏷️ <b>13</b>カテゴリ</div></div><button class="gacha" onclick="go(Math.floor(Math.random()*C.length))">🎰 ランダム判例ガチャ</button></div></header><div class="wave"><svg viewBox="0 0 1200 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="M0,40 C300,80 900,0 1200,40 L1200,80 L0,80 Z" fill="#FFF9E6"/></svg></div><section class="fwrap"><div class="fcard"><div class="fr"><span class="fl">🏷️ 分野:</span>'+cbtn+'</div><div class="fr"><span class="fl">📅 年代:</span><button class="fb'+(aYr==='all'?' on':'')+'" data-yr="all">すべて</button>'+ybtn+'</div><div class="fr les-row"><span class="fl">💡 教訓:</span>'+lbtn+'</div></div></section><div class="rc"><b>'+fl.length+'</b> 件の判例がヒット</div><main class="cw">'+(fl.length?'<div class="grid">'+cards+'</div>':'<div class="empty"><div class="big">🤔</div><p>該当する判例が見つかりません。<br>検索条件を変えてみてください。</p></div>')+'</main><footer><p>⚖️ IT裁判沙汰コレクション</p><p>弁護士 伊藤雅浩 / IT・システム判例メモ</p></footer></div>';

  let t;
  
  document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{aCat=b.dataset.cat;renderList()}));
  document.querySelectorAll('[data-yr]').forEach(b=>b.addEventListener('click',()=>{aYr=b.dataset.yr;renderList()}));
  document.querySelectorAll('[data-les]').forEach(b=>b.addEventListener('click',()=>{aLesson=b.dataset.les;renderList()}));
  const activeLes=document.querySelector('.les-row .fb.lb.on');if(activeLes)activeLes.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  
}

function renderDetail(idx){
  const c=C[idx];
  if(!c){location.hash='#/';return}
  const tg=c.categories.map(x=>'<span class="tag '+(TC[x]||'t-etc')+'">'+x+'</span>').join('');
  const wc=(c.what_happened+c.issue+c.ruling+c.hook+c.takeaway).length;const rt=Math.max(1,Math.round(wc/400));
  const pv=idx>0?idx-1:null,nx=idx<C.length-1?idx+1:null;
  let nav='<div class="cnav">';
  if(pv!==null)nav+='<button class="nb" onclick="go('+pv+')"><div class="dir">← 前の判例</div><div class="nt">'+e(C[pv].fun_headline)+'</div></button>';else nav+='<div></div>';
  if(nx!==null)nav+='<button class="nb nx" onclick="go('+nx+')"><div class="dir">次の判例 →</div><div class="nt">'+e(C[nx].fun_headline)+'</div></button>';
  nav+='</div>';

  document.getElementById('app').innerHTML='<div class="view"><div class="dh"><div class="din"><button class="back" onclick="location.hash=\'#/\'">← 判例一覧に戻る</button><div class="dcats">'+tg+'</div>'+(c.lessons&&c.lessons.length?'<div class="ltags" style="margin-top:.4rem">'+c.lessons.map(l=>'<span class="ltag lclick" onclick="filtLesson(\''+e(l).replace(/'/g,"\\'")+'\')">💡'+e(l)+'</span>').join('')+'</div>':'')+'<h1>'+e(c.fun_headline)+'</h1><div class="dm"><span>🏛️ '+e(c.court)+'</span><span>📅 '+e(c.date)+'</span><span>📋 '+e(c.year)+'</span><span>⏱️ 約'+rt+'分</span><span>#'+(idx+1)+'/'+C.length+'</span></div></div></div><article class="art"><div class="hookbox">'+e(c.hook)+'</div>'+renderParties(c.parties)+'<h2 class="sh"><span class="ic">📝</span> ざっくり言うと</h2><div class="sbox">'+fmtSum(c.summary)+'</div><h2 class="sh"><span class="ic">💥</span> 何が起きたのか</h2>'+fmtBody(c.what_happened)+'<h2 class="sh"><span class="ic">❓</span> 何が争われたのか</h2>'+fmtBody(c.issue)+'<h2 class="sh"><span class="ic">🏛️</span> 裁判所の判断</h2>'+fmtBody(c.ruling)+'<div class="tkbox"><h3>💡 この判例から学べること</h3><div class="items">'+e(c.takeaway)+'</div></div><div class="olbox"><div class="q">「'+e(c.one_liner)+'」</div><div class="lb">── この判例をひとことで</div></div><div class="share-wrap"><button class="share-btn share-x" onclick="shareX('+idx+')">𝕏 ポスト</button><button class="share-btn share-copy" onclick="copyQuote('+idx+')">📋 名言コピー</button></div>'+(c.url?'<a class="srclink" href="'+c.url+'" target="_blank" rel="noopener"><span class="src-icon">📝</span> 原典：IT・システム判例メモ（伊藤雅浩）で読む <span class="src-icon">↗</span></a>':'')+nav+'</article><footer><p>⚖️ IT裁判沙汰コレクション</p><p>弁護士 伊藤雅浩 / IT・システム判例メモ</p></footer></div>';
  window.scrollTo(0,0);
}

function filtLesson(l){aLesson=l;location.hash='#/';renderList()}
function go(i){location.hash='#/case/'+i}
function shareX(i){const c=C[i];const t='「'+c.one_liner+'」\n\n── '+c.fun_headline+'\n#IT裁判沙汰コレクション';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t)+'&url='+encodeURIComponent('https://saiban-collection.web.app/#/case/'+i),'_blank')}
function copyQuote(i){const c=C[i];navigator.clipboard.writeText('「'+c.one_liner+'」\n── '+c.fun_headline+'\nhttps://saiban-collection.web.app/#/case/'+i).then(()=>showToast('コピーしました！'))}
function showToast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function route(){const h=location.hash||'#/';const m=h.match(/^#\/case\/(\d+)$/);if(m){renderDetail(parseInt(m[1]));document.title=C[parseInt(m[1])].fun_headline+' | IT裁判沙汰コレクション'}else{renderList();document.title='IT裁判沙汰コレクション'}}
function init(){
window.addEventListener('hashchange',route);
window.addEventListener('scroll',()=>{const s=document.getElementById('stt');if(s)s.classList.toggle('vis',window.scrollY>350);const rb=document.getElementById('rpbar');if(rb){const h=document.documentElement.scrollHeight-window.innerHeight;rb.style.width=h>0?(window.scrollY/h*100)+'%':'0'}});
window.addEventListener('keydown',ev=>{const h=location.hash;const m=h.match(/^#\/case\/(\d+)$/);if(!m)return;const i=parseInt(m[1]);if(ev.key==='ArrowLeft'&&i>0)go(i-1);else if(ev.key==='ArrowRight'&&i<C.length-1)go(i+1)});
route();
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init,{once:true})}else{init()}
</script>
</body>
