成31年・令和元年","topic":"仮想通貨不正流出における取引所の責任","categories":["セキュリティ","暗号資産・ブロッキング","責任・損害"],"fun_headline":"【実話】4500万円が1時間で消えた朝。そして取引所は「知らない」と言った","hook":"朝6時に起きたら口座が空になってた話、聞きます？\n\n4500万円。午前6時14分から午前7時21分のあいだに。全部消えた。\n\n怖くないですか。僕だったら泣きながら布団に戻ります。でも戻れない。お金ないので。","summary":"・絡んでる金額: 4500万円\n・テーマ: 仮想通貨不正流出における取引所の責任\n・セキュリティ事案","what_happened":"順を追って説明しますね。\n\n仮想通貨の取引所相手方にアカウントを持っていた被害者側。ある朝起きたら残高4545万円が61円になってました。\n\nいや、61円って。61円て何に使うんですか。コンビニのガム買えないじゃないですか。\n\nで、何が起きたかというと。被害者側のアカウントから誰かがAPIを使ってビットコインに交換しまくって、全部知らないアドレスに送っちゃったんです。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\nここで僕の話をさせてほしいんですけど、僕、昔スマホのパスワードを「0000」にしてたんですよ。4年くらい。そういう話じゃなかったですね。話を戻します。\n\n被害者側と相手方は平成28年8月に利用契約を結んでいて、その規約にはこういう免責規定が書いてあった。\n\n （ア）　５条２項\n\nパスワード又はユーザーＩＤの管理不十分，使用上の過誤，第三者の使用等による損害の責任は登録ユーザーが負うものとし，当社は一切の責任を負いません。\n\n（イ）　１３条１項１文\n\n当社は，ビットコインの販売・買取，その他関連サービス並びにビットコインの価値，機能，使用先及び用途につき如何なる保証及び如何なる責任（瑕疵担保責任を含みます。）を負うものではありません。\n\n【ちょっと解説】瑕疵（かし）── 法律用語で「バグ」のこと。正確には「契約で約束した品質を満たしていない部分」。要するに「ひでえ出来」のことです。\n\n（ウ）　１４条２項\n\n当社は，本サービスに関連して登録ユーザーが被った損害について，一切賠償の責任を負いません。なお，消費者契約法の適用その他の理由により，本項その他当社の損害賠償責任を免責する規定にかかわらず当社が登録ユーザーに対して損害賠償義務を負う場合においても，当社の賠償責任は，損害の事由が生じた時点から遡って過去１ヶ月の期間に登録ユーザーから現実に受領した本サービスの利用料金の総額を上限とします。\n\nこれ、読んで「え、そういうこと？」ってなりますよね。なりません？\n\nで、ここからがヤバいんですけど。この不正取引に使われたIPアドレスを調べたら、相手方自身が提供している「プレイグラウンド」というテスト画面のものだったんですよ。\n\nプレイグラウンドって、遊び場って意味ですよ。遊び場から攻撃されてた。シュールすぎる。\n\nちなみに翌年、相手方は関東財務局から業務改善命令も受けてます。まあそうですよね。という感じです。","issue":"要するに何が問題だったの？\n\n争点はふたつです。ここテストに出ます。\n\n（１）相手方に債務不履行や不法行為があったか\n（２）規約の免責規定は有効に適用されるか\n\n要するに「取引所はセキュリティをちゃんとしてなかったんじゃないか。免責条項で逃げられるのか」って話。\n\n相手方は「ユーザーのパスワード管理の話だから免責される」と言い、被害者側は「いや取引所のシステムがザルすぎた」と言った。\n\nどっちが正しいか。裁判所に聞きましょう。","ruling":"で、裁判所はどう判断したか。\n\nまずセキュリティ義務について。裁判所はこう言いました。\n\n 相手方のビットコインの取引の仕組みからすると，相手方は，本件交換及び本件引出し当時，信義則上，利用者財産の保護のために十分なセキュリティを構築する義務を負っていたと解される（略）から，通常のウェブサイト上からユーザー自身のAPIキー及びAPIシークレットを入力して，相手方のウェブサイトにあるユーザーのアカウント内の情報を呼び出して，ビットコインの取引が行われた場合や，通常のウェブサイト上からユーザー自身のユーザーＩＤ及びパスワードを入力して，相手方のウェブサイトにあるユーザーのアカウントにアクセスして，ビットコインの取引が行われた場合であっても，相手方において，当該APIキー及びAPIシークレットの管理や，当該ユーザーＩＤ及びパスワードの管理が不十分であったなど，上記義務に違反していると認められる特段の事情がある場合には，本件免責規定は適用されないと解される（最高裁平成５年７月１９日第二小法廷判決・集民１６９号２５５頁，判タ８４２号１１７頁参照）。\n\nつまりこういうこと。「取引所がちゃんとセキュリティ管理してなかった、という特別な事情があれば、免責規定は使えない」。\n\n裁判所、めちゃくちゃ冷静。好き。\n\nじゃあ実際に相手方はセキュリティをサボってたの？という話。被害者側は「異常取引を検知する義務があった」「二段階認証を推奨する義務があった」と主張した。\n\nこれに対して裁判所は……\n\n APIは，もともと通常のログイン取引に比して，複雑な取引条件を設定したり，大量又は自動的な取引をすることを希望するユーザー向けに設置されているサービスであり，被害者側の取引においても，短時間に多額の出金措置を講じたり，本件口座においてビットコインの売買をしたりするなどしていることからしても，API利用者には，ビットコインの取引に関し，多様なニーズがあることがうかがわれる。そして，そのようなAPI利用者の取引のうち，どのような取引をもって異常なものと判断することには困難を伴うと考えられ，また，相手方として，本件交換及び本件引出しがされた当時の技術水準からして，API利用者の通常の取引と比較して，異常な取引がされた場合に，そのような取引を注視させる措置を講ずることが技術的に可能であったとも認められない。\n\nえっ、義務違反なし。つまり「APIってそもそも大量取引向けサービスだから、何が異常か判断しようがなかった」ということ。\n\n二段階認証については……\n\n 相手方のCTOを務めるＢの陳述書によれば，当時の仮装通貨業界では二段階認証を一般的に採用している会社はない旨の記載があり，Ｂも証人尋問において同旨の証言をするところ，Ｂの証言の信用性を左右するに足りる的確な証拠はなく，その信用性は否定し難い上に，APIが通常のログイン取引と異なり，API利用者の多様なニーズに対応する必要があり，二段階認証を通常の設定とすることが，複雑な取引条件を設定することや，大量又は自動的な取引を行うことを希望するユーザーにとって障害となる可能性も否定できないことからしても，本件交換及び本件引出しの当時，相手方において，API利用時に当然に二段階認証を通常設定とし，積極的に推奨する義務を負っていたとまでは認められない。\n\n「当時の業界標準として、二段階認証を強制する義務まではなかった」という判断。\n\nという流れで、被害者側のその他の主張もすべて退けられ、請求は全部棄却されました。\n\n被害者側の気持ち、わかる。めっちゃわかる。つらい。","takeaway":"で、結局なにが大事なの？\n\n・二段階認証は設定しろ。任意でも使えるのに使わなかったら自己責任の方向に転ぶ\n・APIキーは銀行の暗証番号と同じ。漏れたら終わりと思って管理しよう\n・「免責規定があっても取引所の管理が雑だったら無効」という理屈は残った。諦めるな\n・当時の「業界標準」が義務の基準になる。つまり時代が変われば義務も変わる\n\n裁判所は正しいことを言ってるんだけど、被害者側からすると「じゃあ誰が悪いんですか」ってなりますよね。それが一番つらい。","one_liner":"二段階認証をオフにしてるの、今すぐオンにしてください。本当に。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"仮想通貨取引所"},{"role":"被害者側","icon":"🛡️","side":"plaintiff","desc":"仮想通貨利用者"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["証拠がないと詰む","セキュリティ甘すぎ","「完成」って何？"]},{"original_title":"福島地判平30.12.4（カーナビルート案内の責任）","url":"https://itlaw.hatenablog.com/entry/2020/04/22/230852","court":"福島地判","date":"平30.12.4","year":"平成30年","topic":"カーナビルート案内の責任","categories":["責任・損害"],"fun_headline":"【悲報】カーナビの言う通りに走ったら車がボコボコになった。でも裁判所は「それあなたのせいです」と言った","hook":"みなさん、カーナビって信用してますか。\n\n僕は結構信用してるんですよ。「ここ曲がれって言ってるしな」って素直に曲がる。\n\nでもこの裁判の人は、カーナビを信用して曲がったら43万円分の損害が発生して、裁判所に「それはあなたが悪い」と言われました。\n\n意味がわからない。でも法律的には意味がわかる。この不条理を一緒に見ていきましょう。","summary":"・絡んでる金額: 43万円\n・テーマ: カーナビルート案内の責任\n・責任の所在を巡る争い","what_happened":"で、ここからが面白いんですけど。\n\n被請求側1は地図データ会社。被請求側2はカーナビのメーカー。請求側の車には被請求側2製のカーナビが載っていて、被請求側1の地図データ（平成27年版）が入ってました。\n\nで、平成29年5月のある日。請求側はカーナビのルート案内に従って走っていたら、幅員約2メートルの未舗装路に連れていかれたんですよ。\n\nちょっと待ってください。幅員2メートルって、だいたい自転車2台分です。車が通る道じゃない。草木まで生い茂ってたらしいです。\n\nここで僕の話をさせてほしいんですけど、僕も一回カーナビに「この先、川」みたいなところを案内されたことがあって、え、橋ないじゃんってなったことがあるんですよ。あ、全然違う話でしたね。話を戻します。\n\nで、請求側はその道を走ったら車に擦過痕が生じて約43万円の修理費が発生した。そこで被請求側2（カーナビメーカー）にPL法で、被請求側1（地図データ会社）に民法で、お金を請求したんです。\n\n【ちょっと解説】製造物責任法（PL法）── 製品に欠陥があって損害が出たら、メーカーが責任を負う法律。要するに「あなたの製品がダメだったんだから弁償してください」と言える法律。\n\nエンジニアなら「これ誰の責任？」っていうの、身に覚えあるんじゃないですか。地図データが古かったのか、ナビの設計が悪いのか、ユーザーが悪いのか。","issue":"要するに何が問題だったの？\n\n表向きの争点はPL法の「欠陥の有無」と被告らの「過失の有無」だったんですけど。\n\n裁判所はそこじゃなくて「カーナビのルート案内と擦過痕のあいだに因果関係があるか」という点から攻めました。\n\n【ちょっと解説】相当因果関係── 「AがなければBはなかった」という原因と結果のつながり。要するに「カーナビのせいで車が傷ついたと言えるか」です。\n\nここテストに出ます。「欠陥があったか」じゃなくて「カーナビが原因だと言えるか」で判断した、というのがポイント。","ruling":"で、裁判所はどう判断したか。\n\n裁判所はまず、カーナビというものの限界についてこう言いました。\n\n カーナビとは、一定の地図情報等に基づいてルート案内等のサービスを提供する機器であるところ、道路はその性質上、新設・変更・廃止があるのはもちろん、舗装状態や周囲の状況など車両の通行に影響する要素も刻々と変化することが想定される。そのため、カーナビの製造者等において、定期的にデータを更新するとしても、全国各地の道路の正確な状況をリアルタイムで情報提供するのは不可能か著しく困難であり、ましてや、個々の道路の安全性については、現に直面する運転者が最も把握し得るところであり、カーナビにおいて表示する道路の安全性まで保障できるものではない。この点、本件カーナビの画面表示や取扱説明書において、地図データ等が実際の道路状況や交通規制と異なる可能性がある旨指摘し、カーナビの表示に盲目的に従うことのないよう警告していることからも明らかである。このようにカーナビは、一定の地図情報等に基づき車両の走行が可能と考えられる道路を表示することで、運転者の判断を補助するものにすぎず、ルート案内された道路を走行するか否かは、車両の運転者が実際の道路状況や車両の車種・形態等の事情を踏まえて自ら判断すべきものであり、カーナビの表示したルート案内は運転者の判断資料の一つにすぎないと考えるのが相当である。\n\nつまりこういうこと。「カーナビはナビするだけ。行くかどうかは運転手が決めろ」。\n\n裁判所、ものすごい正論を言ってる。正論なんですよ。わかってる。わかってるけど……。\n\nさらに裁判所はこう続けます。\n\n 係る状況下において、請求側が本件カーナビのルート案内に依存するのは適切ではなく、自らが本件道路の具体的状況と本件車両の車種・形態を考慮して進路を選択するのが相当である。\n\n（中略）\n\n以上のとおり、本件カーナビが本件道路を含むルートを表示すること自体が必ずしも不合理でない上、請求側は本件カーナビのルート案内に依存せず、自らの判断に基づき本件道路を走行しなければならないところ、あえて本件道路の走行を選択したものであり、仮にその際に本件車両に擦過痕が生じたとしても、それは本件カーナビのルート案内によって生じたものと認めることはできない。したがって、本件カーナビによるルート案内と本件車両に生じた擦過痕との間に相当因果関係は認められない。\n\n「カーナビのせいではなく、あなたが走ることを選んだんです」という判断。\n\nあ、今思い出したんですけど、取扱説明書って読みます？　カーナビに「表示と実際の道路が違う場合があります」って書いてあったらしいんですよ。読んでないですよね、普通は。読んでないんですけど。\n\n結果、因果関係なしで請求棄却。請求側のお金は戻ってきませんでした。","takeaway":"で、結局なにが大事なの？\n\n・カーナビは「判断補助ツール」。最終判断は運転手にある、というのが法律の立場\n・「機器の言う通りにしました」は免責事由にならない。自分で判断した扱いになる\n・取扱説明書の免責事項は、ちゃんと法的効果を持つ\n・AIやシステムの言う通りに動いて損失が出ても、今後も「自分で判断した」とされる可能性が高い\n\nこれ、自動運転が普及したらめちゃくちゃ重要になりますよね。怖い話です。","one_liner":"カーナビはナビするだけ。信じるか信じないかはあなた次第。法律的に本当に。","parties":[{"role":"請求側","icon":"💼","side":"plaintiff","desc":"カーナビ利用者"},{"role":"被請求側","icon":"⚖️","side":"defendant","desc":"地図DB会社"}],"lessons":["証拠がないと詰む"]},{"original_title":"東京地判平30.11.30（開発契約の成否（否定））","url":"https://itlaw.hatenablog.com/entry/2022/08/20/160617","court":"東京地判","date":"平30.11.30","year":"平成30年","topic":"開発契約の成否（否定）","categories":["契約・報酬"],"fun_headline":"【衝撃】「契約してました」「してません」→ 裁判所「してません」→ 97万円返ってきた件","hook":"ちょっと待ってこれ聞いたら驚くから。\n\nシステム開発の話をして、97万円払って、作業もちょっとしてもらって……それでも「契約は成立してなかった」って言われることあるんです。\n\n「え、じゃあ払ったお金は？」返ってきます。「え、やった作業は？」タダ働き。\n\nどういうこと？　一緒に見ていきましょう。","summary":"・絡んでる金額: 90万円\n・テーマ: 開発契約の成否（否定）\n・契約とお金の話","what_happened":"順を追って説明しますね。\n\n人材派遣業の発注側は、2015年10月、システム開発会社の開発側に「業務効率化のためのシステムを作ってほしい」と相談した。\n\n開発側はシフト編成とか請求書業務のシステム開発を提案して、見積書を出した。合計250時間、期間300日、報酬は初回90万円＋以後毎月90万円という内容。\n\nここ、大事なとこなんで簡単に言うと。「かなりデカい契約の話をしてた」ということです。\n\n発注側はこれを受けて、初回97万2000円（税込）を振り込んだ。\n\nで、開発側は12月に発注側の事務所に行って、ネットワークやPCの確認をしたり、業務フローを聴取したりした。「ＩＴマネージメントサービス基本契約書」も送ったんですけど……調印されなかった。\n\nここで僕の話をさせてほしいんですけど、僕も昔フリーランスで契約書を作らずに仕事したことがあって、相手に「え、いくらでしたっけ」って言われて全部のお金を回収できなかった経験があるんですよ。あ、本題に似てる話でしたね。続けましょう。\n\nその後、作業は全然進まなかった。業を煮やした発注側は「そもそも契約は成立してないので97万円は返してください」と訴えた。\n\nで、逆に開発側は「残代金の180万円払え」と反訴した。\n\nこれ、居酒屋の割り勘で言ったら「払ってないから返して」「いや残りも払って」が同時に起きてる状態です。カオス。","issue":"要するに何が問題だったの？\n\n「そもそも契約は成立してたの？」これだけです。\n\nヤバいですよね。お金は払った。作業も（ちょっと）した。でも契約書のハンコは押されていない。\n\nこういう状態で「契約成立してました」と言えるのか。ここテストに出ます。\n\n法律的には「意思の合致があれば契約は成立する」んですけど、じゃあ何について意思が合致してた？　というのが問題になった。","ruling":"いよいよ判決です。\n\n裁判所は「契約は成立していない」という判断をしました。理由はこうです。\n\n【ちょっと解説】引用── 他人の著作物を自分の著作物の中に取り込むこと。「出所の明示」「主従関係」「必然性」などの要件を満たせば、著作権者の許諾なしでOK。\n\nこの点，契約が成立したといえるためには，当事者間において，外形的に意思表示が合致する必要があるところ，当然の前提として，当該意思表示の内容が特定されている必要がある。\nしかし，上記事実関係を踏まえても，平成２７年１２月８日時点でも，この契約を基礎付ける意思表示の内容が特定されているということはできない。\n\nつまり「合意してたとしても、何について合意してたかがわからなかったら、契約は成立しない」ということ。\n\n裁判所、めちゃくちゃ根本的なことを言ってる。好き。\n\nもう少し詳しく言うと、開発側は「シフト編成システムを作ります」と言ってたけど、発注側の業務の何をどう改善するのか、どんな仕様で作るのかが全然決まってなかった。\n\nすなわち，同年１０月２３日時点では，開発側からは，業務繁忙時に効率的に業務を行うためのシステムの構築や提供という提案がされたにすぎず，当該システムの具体的な内容は明確とはいい難い。この点，提案書（甲２）によれば，その内容として，発注側従業員がＩＤやパスワードを入力してログインした後，顧客別のシフト編成等を入力すると，入力したデータがサーバー内に構築されたデータベースにおいて連携され，ＩＤやパスワードが入力された他のＰＣからもシフト編成表や請求書等が出力できるシステムである旨の記載はあるが，この段階で，開発側が，発注側の業務についてどのような書式を用い，どのようにデータを処理していたのか，業務のどの点について具体的に支障が生じていたのか等，発注側の具体的な業務に即した事情を把握していたという事実は証拠上認められず，そのような，開発側においてどのような仕様に基づいて上記システムを構築するのか全く不明な中で，結果的に上記のような処理が可能となるシステムを構築するとの提案をしたからといって，抽象的に，発注側の要望に添うシステムの構築が可能であると回答したと評価できるにとどまり，意思表示の内容として具体的であるとは到底いえない。\n\nまた，同年１１月１９日時点でも，見積書や請求書には，「シフト編成を効率的・効果的に行うための入力ツール」，「請求書作成システム，求職管理簿作成システム，手数料管理簿作成システム」，「上記に付随するスタッフ・お客様データのメンテナンスツール」との記載があり，その例示が多少あるのみで，やはり開発側が発注側の具体的な業務を把握した上で何らかの提案をしているとは認められず，契約の内容が特定されているとはいえない。\n\nさらに，同年１２月８日になっても，確かに，前記のように，開発側において，発注側の業務に関する具体的な書式や帳簿等を受領し，業務フローを聴取するなどしたことは認められるが，このシステムの構築に当たり，同時点での発注側の業務のうち，そのような書式等を踏まえ，どの点をどのような仕様に基づいて改良するのか，そのために発注側においてもどのような点を準備する必要があるのか，具体的に開発側から何らかの提案がされたとはいい難い。かえって，システムのネットワークの概要についての書面及びサーバー注文依頼書を提出して，サーバーの調達を依頼したのは，前記のとおり，平成２８年３月になってからというのであるから，それ以前に，開発側が発注側に対し，システムの具体的な仕様ないしその前提となるネットワーク環境等について具体的に提案したということはできず，そのような状況において，契約内容が具体的に特定されているということはできない。\nこれらの点に，平成２８年３月時点でも，ＩＴマネジメントサービス基本契約書（甲３）が調印されず，その後も，発注側から開発側に対し，この契約の基本的な内容についての質問とこれに対する回答（甲５）がやり取りされているといったことを併せ考えると，このシステムの構築に当たり，平成２７年１２月８日時点において発注側と開発側との間で合意があったということはできない。\n\n「仕様が決まってない状態でお金だけ払っても、契約は成立していない」ということ。\n\n開発側の反論「システム開発の契約は大まかな合意で足りる」に対しても、\n\nこれに対し，開発側は，システム開発に関する契約については，システム内容の特定に関し，システム化しようとする範囲と概要が分かる程度の特定で足りる旨主張する。しかし，システム開発であれ，契約である以上，成立した場合には相手方に強制的な履行の請求や不履行の場合の損害賠償を求められる程度に具体化されている必要があるところ，仮に開発側の主張する時点で契約が成立したということになれば，開発側においても，どの範囲まで業務を行えば契約の本旨に従った債務の履行といえるのか不明なままに業務を行わざるを得ないということになってしまい，不合理な結果となることは明らかであり，開発側の主張を前提としても，この契約が成立したということはできない。\nまた，開発側は，発注側との間で契約書が作成されていないことについて，本件において契約書の作成は形式的なものにすぎないと主張するが，既に当事者間で実質的に合意がされており，後から形だけ書面化するというのであれば，発注側においても直ちに契約書に署名ないし記名の上押印することに応じるはずであり，そのような事実が認められない本件においては，むしろ当事者間で契約内容が合意に至っていない方向に働く事実というべきであり，開発側の主張は採用できない。\n\n「実質的に合意してたなら署名してるはずでしょ」という、めちゃくちゃ的を得た反論。\n\n結論。契約が成立していないので、発注側が払った97万円は不当利得として返ってきました。\n\nちなみに開発側の反訴（残代金180万円払え）は当然棄却です。","takeaway":"で、結局なにが大事なの？\n\n・「仕様が決まる前に先払いした」は最悪のパターン。仕様確定→契約書作成→支払いの順番を守れ\n・契約書にサインしてもらえない状況は「合意できていない」のサイン。そのまま進めるな\n・メールや議事録でも合意の証拠になる。「言った言わない」を残らない形にするな\n・「大まかな合意で十分」という言い訳は裁判所に通じない\n\n今回開発側は作業もしたし、お金ももらえないし、反訴も負けた。踏んだり蹴ったりとはこのことです。","one_liner":"仕様が決まってない契約書は存在しないのと同じ。サインされてない契約書も然り。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"人材派遣会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"システム開発会社"}],"lessons":["契約書読んどけば…","証拠がないと詰む","金の話は最初にしろ"]},{"original_title":"東京地判平30.11.29（ソースコードと営業秘密の使用）","url":"https://itlaw.hatenablog.com/entry/2018/12/28/235849","court":"東京地判","date":"平30.11.29","year":"平成30年","topic":"ソースコードと営業秘密の使用","categories":["プログラム・システム","営業秘密"],"fun_headline":"【転職あるある】前の会社のコードを「記憶から」書いたら3800万円の損害賠償を請求された件","hook":"会社を辞めるとき、「あ、これ持って帰っちゃいけないやつだ」ってなるもの、ありますよね。\n\n名刺は持って帰っていい。業務フォーマットはグレー。ソースコードは絶対ダメ。\n\nじゃあ「頭の中に入ってる」場合は？　それが問題になった事件です。\n\n鑑定人まで使った本格的な法廷バトル、いきましょう。","summary":"・テーマ: ソースコードと営業秘密の使用\n・営業秘密の話","what_happened":"順を追って説明しますね。\n\n字幕制作用ソフトウェアを作ってる会社側。元従業員のＡとＢが退職して、競合他社元社員に入った。\n\nで、元社員が会社側と似たようなソフトウェアを販売し始めた。\n\n会社側は「これうちのコードを使ってるんじゃないか」と思って訴えた。\n\n【ちょっと解説】不正競争防止法── 営業秘密の持ち出し、商品の模倣など、ズルい競争方法を規制する法律。略して「不競法」。ライバル会社への秘密情報持ち出しを取り締まる法律と思えばOK。\n\nちなみにこの件、以前に著作権侵害でも訴えてたんですよ。そのときは請求棄却になって、今度は「営業秘密」として再挑戦した案件なんです。\n\nあ、今思い出したんですけど、「前の会社でやってたやり方を新しい会社に持ち込んじゃいけない」って研修で言われたことあるんですよ。僕はその研修を聞いてたのにどのくらいの人が実践できてるんだろう、と思いながら今これを書いています。話を戻します。\n\nで、本当にコードをコピーしたのかどうかを調べるために、裁判所は「鑑定」を行いました。","issue":"要するに何が問題だったの？\n\n（１）元社員は実際に会社側のソースコードを使ったのか\n（２）使ったとしたら、それは不正競争行為にあたるか\n\nこの2つ。ここテストに出ます。\n\n「似てる」だけでは不正にならない。でも「ありえない一致」があれば不正になる。その線引きをどこでするかが問題でした。","ruling":"さあ、裁判所の答えです。\n\nまず、コードが本当に似てるかどうかを確認するために鑑定が行われました。300組のペアを選んで、8種類の方法で類似度を調べた。その方法がこれです。\n\n ８種類のコードクローン検出の方法の概要は，\n\n[1]識別子とリテラルのオーバーラップ係数を用いて名前の包含度合いを確認する，\n\n[2]識別子とリテラルのコサイン係数を用いて名前の一致度合いを確認する，\n\n[3]識別子とリテラルの部分文字列のオーバーラップ係数を用いて名前の文字並びの包含度合いを確認する，\n\n[4]識別子とリテラルの部分文字列のコサイン係数を用いて名前の文字並びの一致度合いを確認する，\n\n[5]コメントの部分文字列のオーバーラップ係数を用いてコメントの文字並びの包含度合いを確認する，\n\n[6]コメントの文字列のコサイン係数を用いてコメントの文字並びの一致度合いを確認する，[7]キーワードや記号の系列にＳｍｉｔｈ－Ｗａｔｅｒｍａｎアルゴリズムを適用してソースコードの文字並びの一致度合いを確認する，\n\n[8]前記アルゴリズムをソースコードの長さで正規化してソースコードの構造の一致度合いを確認するというものであった。\n\nわかりますか。僕はわかりません。でも「めちゃくちゃ丁寧に調べた」ということはわかります。\n\n結果、5箇所の類似箇所が発見されました。その評価がこちら。\n\n Xソフトウェアのソースコードの一部がサンプルで公開されていたなどといった外部要因がないことを前提とすれば，XソフトウェアとYソフトウェアの開発者は必ず同一人物である。Yソフトウェアを開発する際にXソフトウェアを参照した可能性が高いが，参照せずに開発することが全く不可能であるとまでは言い切れない。\n\nもっとも，XソフトウェアとYソフトウェアの開発者が同一人物であり，その人物の記憶を手掛かりとしても，Xソフトウェアのソースコードを参照せずに類似箇所１で見られるような細かい特徴まで一致させることは難しいと考えることが自然である。\n\n「開発者が同じ人物なのは確実。コードを参照した可能性が高いが断言はできない」という、絶妙にニュアンスのある結論。\n\n鑑定人、誠実すぎる。好き。\n\nさらに、両方のソフトウェアに「共通のバグ」があったことも指摘されている。これ、かなりクサいですよね。同じバグが独立して発生するとは考えにくい。\n\n結論。全体のコピーは認めなかったけど、類似箇所1〜3については使用・開示があったと認定。\n\n ソースコードのペアにおいて，共通性や類似性が疑われる箇所は類似箇所１ないし５のみであったこと，本件鑑定の手法に不合理な部分は認められないことが認められ，また，本件ソースコードについて元社員らによる使用等の根拠として会社側が主張する事実は，そもそも元社員らによる使用等を推認させるとはいえないとの意見を鑑定人が述べたものがあるほか（略），その内容から，いずれも元社員らによる本件ソースコードの使用等を直接裏付けるものとはいえない。（略）\n\nこれらを総合すれば，鑑定において類似箇所として指摘された部分である類似箇所１ないし５は別として，本件ソースコード全体やＴｅｍｐｌａｔｅ．ｍｄｂに関して会社側が主張する情報，前記類似箇所以外の本件ソースコードの一部について，元社員らによる使用等はなかったと認めるのが相当である。\n\n （２）　類似箇所１ないし３について\n\n前記１（１）によれば，類似箇所１ないし３について，本件ソースコードの元社員らによる使用等があったと認められる。そして，Ｂが，Xソフトウェアの開発に携わった者の一人であり，Yソフトウェアについて実際の開発，制作を担当したこと（略）から，Ｂは，Yソフトウェアの開発の際，本件ソースコードの類似箇所１ないし３に対応する部分を使用してYソフトウェアを制作等し，もって，類似箇所１ないし３を元社員に対して開示し，また，元社員においてそれを取得して使用したと認められる。\n\n営業秘密に該当するかについて。\n\n【ちょっと解説】営業秘密── 不正競争防止法で保護される企業秘密。ただし「秘密管理性」「有用性」「非公知性」の3要件が必要。「うちの秘密です」と言い張るだけじゃダメ。社内での管理体制が大事。\n\n 類似箇所１ないし３はいずれも本件ソースコードの一部を構成するものである。そして，会社側が開発，制作して販売しているXソフトウェアに係る本件ソースコードの全体は会社側の営業秘密であると認められるところ，ソースコードはそれぞれの構成部分が相互に関連したり作用したりしながら一定の動作を実現するものであることに照らせば，特段の事情がない限り，本件ソースコードの構成部分である類似箇所１ないし３も会社側の営業秘密であると認めることが相当である。\n\nそして，類似箇所１ないし３は本件ソースコードにおける変数名，型名，注釈等を宣言するものであるところ，それらが本件ソースコードの他の部分と異なって管理されていたとは認めるに足りない。また，それらは本件ソースコードにおいて様々な形で利用され，多岐にわたる機能に影響を及ぼす有用なものであるといえるし，元社員らも将来的な機能の拡張に対応するという観点に照らして型名が選択される場合もあると主張しており，型名の選択も有用性を肯定し得る。さらに，類似箇所１とそれに対応するYソフトウェアのソースコードはそれらの字幕データの標準値（変数名）をパブリック・メンバ変数（公開変数）に格納している点も一致しており，ソースコードにおいて変数を公開とするか非公開とするかという情報もその開発に際して技術的に有用なものであることは当業者が知り得る技術常識であるといい得る。\n\n営業秘密に該当すると認定。Bは会社側のコードを元社員に横流しした。元社員も注意する立場だったのに怠った。ということで不正競争行為に該当。\n\n損害は約3800万円と推定されましたが、類似箇所が全体のごく一部だったので95%覆滅。結果、約200万円の責任のみ認めました。\n\n裁判所、割り算がうまい。","takeaway":"で、結局なにが大事なの？\n\n・転職先で前の会社のコードを使うのは絶対ダメ。「記憶から書いた」でも通じないかもしれない\n・「共通のバグがある」は一致の証拠として強力。バグまで一致したら言い訳できない\n・営業秘密として保護したいなら社内での管理体制が必要。ラベルなし・アクセス制限なしでは弱い\n・コードクローン検出技術は本格的な法廷証拠として使われる時代になった\n\nBさんと元社員、この件で得たものより失ったものの方がずっと多そうです。","one_liner":"前の会社のコードは頭の中にあっても持ち出し禁止。法律はそのくらい厳しい。","parties":[{"role":"会社側","icon":"🏢","side":"plaintiff","desc":"字幕ソフト会社"},{"role":"元社員","icon":"👤","side":"defendant","desc":"元従業員ら会社"}],"lessons":["証拠がないと詰む","秘密は管理してナンボ","辞め方を間違えた"]},{"original_title":"東京地判平30.10.26（ゲームシナリオ作成と請負/準委任）","url":"https://itlaw.hatenablog.com/entry/2018/12/24/210810","court":"東京地判","date":"平30.10.26","year":"平成30年","topic":"ゲームシナリオ作成と請負/準委任","categories":["契約・報酬","ネット・コンテンツ"],"fun_headline":"乙女ゲームのシナリオを書いたら「気に入らないから払わない」と言われた話。裁判所「払え」","hook":"これ結構ヤバい話なので。\n\nシナリオを依頼して、書いてもらって、「気に入らないから払わない」って言える世界線があるとしたら？\n\n100万円の話です。\n\n「請負」と「準委任」の違い。これを知ってるかどうかで、まったく違う結末になります。","summary":"・絡んでる金額: 100万円\n・テーマ: ゲームシナリオ作成と請負/準委任\n・契約とお金の話","what_happened":"で、何が起きたかというと。\n\n発注側は、スマホ用の乙女ゲームを作る開発側から「企画とシナリオを書いてほしい」と依頼された。報酬は100万円で合意。\n\n発注側はシナリオを書いて、開発側に提出した。\n\nでも開発側はお金を払わなかった。\n\n発注側の気持ち、わかる。めっちゃわかる。\n\n「書いたじゃないですか」「払ってください」「でも気に入らないから」「は？」ってなるやつですよ。\n\nここで僕の話をさせてほしいんですけど、僕も昔原稿を書いたのにボツになって、しかも「じゃあ報酬は半額で」って言われたことがあるんですよ。あのとき裁判を知っていたら……。話を戻します。\n\n発注側は開発側を訴えた。","issue":"要するに何が問題だったの？\n\n「XY間の契約は何契約か」。これだけです。でもこれがすごく重要。\n\n開発側は「請負契約だから、完成品として認められるまで払う義務はない」と主張した。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。レストランで「カレーください」と注文するようなもので、カレーが出てこなかったら契約違反。つまり発注者が「気に入った」と認めるまで報酬が発生しない可能性がある。\n\n発注側は「そんな契約した覚えない」という立場。\n\nここテストに出ます。「請負」か「準委任」かで、払う義務が全然違います。","ruling":"裁判所、こう言いました。\n\n裁判所は「これは準委任契約だ」と判断しました。\n\n【ちょっと解説】準委任（じゅんいにん）── 「結果は約束しないけど、プロとしてちゃんとやります」という契約。美容院で「いい感じにしてください」と言うのに近い。SES契約はだいたいこれ。\n\n 前記認定事実の経過に照らせば，発注側と開発側との間では，このプロジェクトの内容，方向性について上記の程度には合意されているものの，それ以上具体的な合意がされてはいないこと，発注側において，このプロジェクトにおけるシナリオ作成についての具体的な内容に関する提案や開発側の意向の確認等はされており，開発側からは抽象的な方向性等を示すことや要望を述べることはされているものの，具体的な内容に関する指示等はされていないことからすれば，シナリオの企画立案やその内容を固めていくことについて，発注側に大幅に委ねられていたものであると認められる。したがって，発注側は，この契約上，上記で合意されたこのプロジェクトの内容，方向性の範囲でシナリオを作成し，納品することが求められ，かつ，それで足りるものとされていたといえる。そうすると，この契約の性質は，開発側が発注側に対し上記のようなシナリオ作成の事務を委託した準委任契約であると認められる。\n\nつまりこういうこと。「具体的な指示がなくて発注側に大幅に委ねてたんだから、それは準委任。提出した時点で仕事完了、払え」。\n\n裁判所、めちゃくちゃ的確。好き。\n\nさらに裁判所はこう付け加えました。「もし請負だとすると、開発側が気に入った時だけ報酬発生、ってことになる。それはさすがに不合理すぎる」。\n\n「開発側の意に沿わない限り報酬が発生しないことになり、不合理」という言い方、裁判所にしては結構ストレートですよね。\n\n発注側はシナリオを提出していたことは争いがなかった。だから報酬請求権あり。100万円を払え、という結論になりました。\n\nちなみに、この記事もう結構長くないですか。でも大事な話なので続けます。","takeaway":"で、結局なにが大事なの？\n\n・フリーランスは必ず「請負か準委任か」を契約書に明記してもらおう。曖昧だと揉める\n・「プロに大幅に委ねた」場合は準委任になりやすい。発注側は「完成まで払わない」とはなりにくい\n・「気に入らないから払わない」は法律的に通じない。払うかどうかは好みで決まらない\n・シナリオ・デザイン・コンサルなど「成果物が曖昧な仕事」ほど契約の性質が重要になる\n\n「契約書はラブレターより丁寧に書け」とはよく言いますが、ラブレターを書く機会がない僕には実感がわきません。でも契約書は丁寧に書いてください。本当に。","one_liner":"「気に入らないから払わない」は通じない。裁判所がそう言ってる。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"シナリオ作家"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ゲーム会社"}],"lessons":["「完成」って何？"]},{"original_title":"東京地判平30.10.26（SQLインジェクション対策不備の責任）","url":"https://itlaw.hatenablog.com/entry/2019/08/30/221450","court":"東京地判","date":"平30.10.26","year":"平成30年","topic":"SQLインジェクション対策不備の責任","categories":["セキュリティ","責任・損害"],"fun_headline":"【実話】SQLインジェクション対策をサボった結果、裁判所に320万円の話をされた件","hook":"セキュリティ対策って「なんとなくやってる」か「そもそもやってない」かどっちかじゃないですか。\n\nこの判例、後者の人が読むと足が震えると思います。\n\n震えてほしい。いい意味で。","summary":"・絡んでる金額: 320万円\n・テーマ: SQLインジェクション対策不備の責任\n・セキュリティ事案","what_happened":"時系列で整理しますね。\n\n被害者側が車・バイクの一括査定システムを責任者側に約320万円で作ってもらいました。平成24年9月に納品。ここまでは普通の話。\n\nで、ここからがヤバいんですけど。\n\n4年後の平成28年12月、IPAから「中国のサイトにあなたのシステムの脆弱性情報が載ってますよ」という指摘が来るんですよ。\n\n【ちょっと解説】IPA（情報処理推進機構）── 国の情報セキュリティ機関。「あなたのシステム、穴あいてますよ」って知らせてくれるありがたい存在。知らせが来た時点でもう手遅れ感ある。\n\n被害者側が責任者側に調査を依頼したところ、SQLインジェクション対策が不十分という脆弱性が判明しました。\n\n【ちょっと解説】SQLインジェクション── データベースへの命令文を悪用して、不正に情報を盗んだり改ざんしたりする攻撃手法。要するに「データベースへの不法侵入」です。\n\nここで僕の話をさせてほしいんですけど、僕も昔パスワードを「password」にしてたことがあって、さすがに今はやめました。全然関係ない話でした。話を戻します。\n\n被害者側は責任者側に対して損害賠償を請求。金額がこれ。\n\n・緊急対策費用：47万5200円\n・詳細調査・抜本修正費用：640万円\n・サーバー移転費用：35万6400円\n・システム停止期間の売上減：200万円\n\nちなみに全然関係ないけど、923万って数字、なんか中途半端じゃないですか。普通100万とか1000万で来るじゃないですか。927万1600円って細かい。\n\n合計、923万1600円。\n\n9、2、3、万。ヤバい。","issue":"要するに何が問題だったの？\n\nざっくり言うと「セキュリティ穴だらけのシステムを納品したら、どこまで弁償しないといけないの？」という話です。\n\nここテストに出ます。\n\n被害者側は923万円全額請求しましたが、裁判所が「そのうちどれが本当の損害か」を仕分けしました。\n\nまず裁判所はこう言っています。\n\n \n\n このシステムが不正アクセスを受け，サーバー上のコンテンツのファイルが改ざんされた可能性を否定し得ず，個人情報が漏えいする危険性がなお残存する状態にある。そして，これらの可能性や危険性を除去するためには，このシステムのサーバー管理会社から推奨された，サーバー上の全ファイルの削除及び再構築を実施すること又はこれに代替する措置を講ずることが必要であり，特段の反証のない本件においては，被害者側の主張するサーバーの移転は上記の代替措置として適切なものであり，これに要する費用（３５万６４００円）もサーバー内の全ファイルの削除及び再構築に要する費用よりも低額であると考えられるから，これをもって相当因果関係のある損害と認める\n\n \n\nつまり「まだ実際に被害が出てなくても、リスクを消すためにかかった費用は賠償しろ」ということ。\n\n仕分けの結果はこうです。\n\n・緊急対策費用の約47万円→認める\n・640万円のリニューアル費用→元の開発代金320万円を大幅に上回るから認めない\n・サーバー移転費用35万6400円→認める（不正アクセスの可能性を消すために必要）\n・売上減→対策のための2日間停止分、約12万円を認める\n\n合計約95万円が損害として認定されました。","ruling":"裁判所の判断は以上のとおりです。\n\n裁判所、めちゃくちゃ冷静。好き。\n\nラーメン屋で言うと、「大盛り無料」と言っておきながら器の材料費をケチって食中毒が出て、治療費を払わされるような話ですね。違うか。","takeaway":"で、結局なにが大事なの？\n\n・ベンダーは「セキュリティ対策はオプションです」と言えない。善管注意義務に含まれる。既知の脆弱性を放置すると負ける\n・「実際に被害が出てない」は関係ない。リスクが残存している状態でかかった費用も損害として認められる\n・脆弱性が発覚したら速攻で動け。4年後にIPAから指摘されるのは最悪のパターン\n・「安く作ってもらったから」は免責の理由にならない\n\nセキュリティ対策をケチるのは、保険に入らずに車を運転するようなもんです。事故が起きてから後悔しても遅い。","one_liner":"セキュリティ対策をサボると、あとで裁判所に「サボったな」と言われながら100万円払うことになる。","parties":[{"role":"被害者側","icon":"🛡️","side":"plaintiff","desc":"査定システム運営"},{"role":"責任者側","icon":"⚖️","side":"defendant","desc":"システム開発会社"}],"lessons":["セキュリティ甘すぎ","損害、証明できる？"]},{"original_title":"東京地判平30.10.12（多段階契約と民641条解除の成否）","url":"https://itlaw.hatenablog.com/entry/2019/10/13/100536","court":"東京地判","date":"平30.10.12","year":"平成30年","topic":"多段階契約と民641条解除の成否","categories":["契約・報酬"],"fun_headline":"【5780万円】システム開発で信頼関係を破壊し続けたベンダーが、解除されても賠償取れなかった話","hook":"ちょっと待ってこれ聞いたら驚くから。\n\nシステム開発で「お客さんが勝手に解除した」と思って損害賠償を請求したら、裁判所に「いや、あなたが信頼関係を破壊したんですけど」と言われた会社の話です。\n\n5780万円の案件で。\n\nやばくないですか？","summary":"・絡んでる金額: 5780万円\n・テーマ: 多段階契約と民641条解除の成否\n・契約とお金の話","what_happened":"順番に整理しますね。\n\nベンダー発注側は味噌メーカー開発側との間で、新販売管理システムと新生産管理システムを合計5780万円で開発する契約を結びました。平成25年のこと。\n\nここで重要なポイントがあって、この契約は「多段階契約」という方式を採用していました。\n\n【ちょっと解説】多段階契約── システム開発を「要件定義→設計→構築→運用準備」という段階に分けて、各段階ごとに個別に契約する方式。「まずここまでやって、うまくいったら次のフェーズを発注する」という進め方。途中でやめやすい設計になってる。\n\nここで僕の話をさせてほしいんですけど、僕も昔「まあなんとかなるでしょ」でプロジェクトを始めて、全然なんとかならなかったことがあります。全然関係ない話でした。話を戻します。\n\n新販売管理システムについては要件定義・設計・構築・移行と順次契約して検収まで完了。\n\n【ちょっと解説】検収（けんしゅう）── 「確認しました、OKです」と納品物を正式に受け取ること。これが終わると基本的に「やっぱダメ」とは言いにくくなる。\n\nしかし問題はここから。\n\n新生産管理システムについては、個別契約3本を一括で締結させたんですね。で、検収を受けたのは「要件定義・設計」の605万円分だけ。\n\nその後開発側が「工場統合の理由で、構築・移行の各契約を解除する」と通知した。\n\n発注側は「それは一方的解除だ！」として1173万円の損害賠償を請求しました。\n\nで、ここからが本当にヤバいんですけど。","issue":"要するに何が問題だったの？\n\n表面上の争点は「開発側の解除は一方的な都合による解除（民法641条）なの？それとも正当な理由があったの？」という話。\n\nここテストに出ます。\n\n民法641条による解除なら「損害賠償して解除できる」ので発注側が1173万円もらえる。でも「信頼関係の破壊」を理由にした解除なら、発注側は賠償もらえない。\n\nY側の主張は「発注側の業務遂行態度と能力に問題があった」。\n\nどっちが正しいのか。裁判所が判断します。","ruling":"裁判所はこう言いました。\n\nまず発注側の提案段階から振り返って、5780万円という金額が「単なる目安ではなく上限を画するもの」だったと認定。\n\n 発注側は，７回に及ぶ開発側からのヒアリングを通じて開発側の現行システムの抱える課題を十分に把握した上で，これらの課題を全面的に解決するシステムとして，新販売管理システム，新生産管理システムの開発を開発側に提案したものであったから，これらのシステムは，開発側の要求する仕様ないし機能をもともと網羅的に備えたものであって，後日，開発側からの仕様変更や機能追加の要求があり得るとしても，その程度は比較的軽微なものにとどまり，大幅な追加発注がないこと，したがって，これに伴う大幅な開発費用の追加負担もほとんどないものとして開発側に提案されたと考えられる。\n\n一般にシステム開発に当たっては，要件定義を確定しない限り，その開発費用を具体的に確定し得ないとしても，上記１で認定した事実によれば，発注側は，開発側の予算的制約に配慮しなければ開発側の発注は獲得できないとの前提に立って開発側に対する積極的な営業活動を行っていたことがうかがわれ，実際上も，新販売管理システム，新生産管理システムの総請負代金額としての開発費用を（当初機能を削減することなく）当初提示額よりも１０００万円以上も値引きした最終提示額（５７８０万円）を開発側に提示することで，ようやく受注することができたものと認められる。このような本件基本契約の締結に至る経緯に照らせば，発注側と開発側との間においては，上記最終提示額は，単なる開発費用の目安にとどまるものではなく，その後に締結されることが予定された各個別契約の各開発費用を定めるに当たっても，その総開発費用の上限を画する機能を有するものであって，数十万円程度の開発費用の増額を否定するものではないにせよ，各個別契約の総開発費用が数百万円単位で増額されることを許容するものではなかったと考えられる。\n\nその上で、発注側がやらかしたことをこれでもかと列挙します。\n\n 発注側は，本件基本契約に基づき，各個別契約を合計５７８０万円の範囲内で受注する一方，新販売管理システムについては，開発側からの追加発注があったという理由で数十万円程度の追加契約を開発側に締結させるにとどまらず，数百万円単位の追加契約ないし覚書まで開発側に次々と締結させていた。また，発注側から納品され，開発側の検収を終えたはずの新販売管理システムの成果物については，決して少なくないシステム障害が発見され，前回の定例会議で報告された不具合が次回の定例会議でも未対応のまま，別のシステム障害が新たに発見され，未対応の障害件数が累積していく状況にあった。さらに，このような状況下では当初の開発スケジュールを維持することも困難となり，本件基本契約の締結日から１年程度で，X自身においても，新販売システムの立ち上げ状況から判断して新生産管理システムの立ち上げ時期を見直す必要があることを余儀なくされていた。\n\nバグが直らないのに次の会議でまた別のバグが増えてる状況。\n\n想像したら怖い。開発側の担当者の気持ち、わかる。めっちゃわかる。つらい。\n\nさらに続きます。\n\n 他方，発注側は，新販売システムがいまだ完成していないばかりか，そのシステム障害を全面的に解決する見込みも立っていない段階にあったにもかかわらず，開発側に安易な開発見通しを伝えつつ，便宜的な理由により，開発側をして，新生産管理システムについての個別契約である生産個別契約１ないし生産個別契約３を同時に締結させることにより，段階的な個別契約の締結による不利益，負担の可及的な低減という開発側の契約上の利益を奪う事態を招いていた。また，発注側は，開発側の顧客情報の流出，サーバのバックアップ，ＵＰＳの未設定等，自らの不手際により，開発側に多大な迷惑をかけ，謝罪することすらあったのに，新生産管理システムについては，追加作業を理由に８００万円もの追加請求を行い，開発側からの強い拒否回答があり，発注側も曖昧な契約内容であったことを自認しつつ，担当者レベルではこの追加請求問題を解決することができず，開発側に対し，進行中の作業を一旦停止することまで申し入れるなど，開発側にとって，このまま発注側によるシステム開発作業を進めると，開発完了までの著しい遅延が発生するにとどまらず，開発費用の大幅な追加負担を求められることは容易に予想し得た。このような状況の下，平成２７年１月時点で発注側と開発側との間で取り交わされた合意書によって今後の処理方針について一応の合意を見たものの，この合意に基づき発注側から提出された新生産管理システムの残課題の対応は開発側から見て芳しいものではなく，協議期間中は留保，延期された生産個別契約２，生産個別契約３についての発注側の適切な履行は依然として危ぶまれる状況にあった。そのため，開発側が，同年２月時点で，発注側に対し，新販売管理システムの残作業を実施する一方で，新生産管理システムの実施の可否を判断すべく，半年ないし１年の凍結を申し入れたことは，本件基本契約上，本来であれば，生産個別契約２，生産個別契約３の同時締結を行う必要のなかった開発側にとってやむを得ない措置であった。\n\n顧客情報流出、バックアップ未設定、800万円の追加請求。\n\nもうこれ、全部アウトのやつです。\n\n最終的に裁判所はこう結論を出しました。\n\n 以上のような本件基本契約，これに基づく各個別契約の各締結に至るまでの間における発注側と開発側との交渉状況，発注側による各個別契約の履行状況，開発側により本件解除がされるに至った経緯等に鑑みると，本件解除がされた平成２７年９月当時，発注側による生産個別契約２，生産個別契約３の債務の本旨に従った履行はもはや期待し得ない状況にあり，発注側と開発側との信頼関係は既に破壊されていたというべきであるから，開発側による本件解除は，かかる信頼関係の破壊を解除原因とするものとして有効なものであって，発注側の開発側に対する民法の損害賠償請求権を発生させるものではなかったというべきである。本件解除の意思表示がされた書面に記載された解除理由は，もともと発注側の求めにより記載されたものにすぎない上，開発側としては，自己都合による解約という穏便な取引終了の体裁を取ることにより，発注側との無用な紛争を回避しようとする趣旨に出たものにすぎなかったから，上記の判断を左右する事情であるとはいえない。\n\nつまりこういうことです。\n\n「信頼関係が既に破壊されていたので、開発側の解除は正当。発注側は損害賠償1173万円を受け取れない」。\n\n発注側の請求、全部棄却。\n\nちなみに今気づいたんですけど、この記事もう結構長くないですか？でも大事なことしか書いてないので続けます。","takeaway":"で、結局なにが大事なの？\n\n・多段階契約は「お客さんが途中でやめる権利」も同時に設計している。それを理解してないベンダーが負ける\n・「信頼関係の破壊」は解除の正当な理由になる。バグ放置・追加請求連発・情報流出でそれは成立する\n・最初に提示した総額は「単なる目安」にはならない。裁判所は上限として判断することがある\n・解除通知の理由が「自己都合」と書いてあっても、実態で判断される\n\nバグが直らないまま追加請求を繰り返すのは、料理が出てこないのに「食材費が上がりました」と言い続けるのと同じです。そりゃ怒られる。","one_liner":"信頼関係を壊したのは自分なのに、解除した相手を訴える。裁判所に全部バレてた。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ベンダ"},{"role":"開発側","icon":"💻","side":"defendant","desc":"味噌製造会社"}],"lessons":["契約書読んどけば…","「完成」って何？","PM不在の悲劇"]},{"original_title":"東京地判平30.9.18（ガチャの確率表示）","url":"https://itlaw.hatenablog.com/entry/2018/09/24/144422","court":"東京地判","date":"平30.9.18","year":"平成30年","topic":"ガチャの確率表示","categories":["その他"],"fun_headline":"【ガチャ民集合】「ピックアップが高確率で出る」と思ってたら「そうは書いてない」と裁判所に言われた事件","hook":"ガチャ、引いたことありますか。\n\n「ピックアップ！期間限定！優先排出！」って書いてあるやつ。\n\nあれって「他より確率高い」って思いますよね。思いますよね？\n\n思わなかった人だけが生き残れる世界の話をします。","summary":"・テーマ: ガチャの確率表示","what_happened":"整理しますね。\n\n被告が運営するスマホゲームに、ガチャで7%の確率で出る「★5そうび」というレアアイテムがありました。\n\n期間限定ガチャで全11種類の★5そうびが出現するとされていたんですが、そのガチャの表示が問題でした。\n\n表示のポイントは「上記のそうびの他にも排出される場合があります。」という一文。\n\nここで僕の話をさせてほしいんですけど、僕も「他にも場合があります」って書いてあったら「メインのが優先されるんだな」と思います。絶対そう思う。でも裁判所はそう思わなかった。話を戻します。\n\nユーザー原告らは「ピックアップが優先排出されると思ってガチャを引いたのに、実際には極めて低い確率でしか出なかった」として訴えました。\n\n請求の根拠がすごい多くて：\n\n(1) 債務不履行\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。「ピックアップ優先」が約束の内容に入ってたかどうかが争点。\n\n(2) 要素の錯誤（「こういうガチャだと思ってた」が間違いだった）\n(3) 詐欺\n(4) 消費者契約法による取消\n(5) 景品表示法違反の不法行為\n\n全方向から攻めてきた。\n\nちなみに全然関係ないけど、ガチャで100万円使った人の話をネットで見たことがあって、その人は「むしろ清々しい」って言ってました。そういう境地に達したい。で、\n\n裁判所の答えは？","issue":"要するに何が問題だったの？\n\n「あの表示は、ピックアップアイテムが他の★5そうびよりも確率が高いと思わせる、誤った表示だったか」という一点です。\n\nここテストに出ます。\n\n原告らの主張は「あの書き方だと絶対ピックアップが優先されると思う」。\n被告の反論は「そうは書いてない」。\n\nどっちが正しいか、裁判所が「一般の人はどう読むか」で判断しました。","ruling":"裁判所はこう言いました。\n\nまず判断基準の前置きです。\n\n 本件の各争点は，いずれも本件表示が（略）いかなる意味と認識されるかということが重要な前提問題となっているところ，そのような記載から認識される意味内容を検討するに当たっては，当事者間に当該記載の意味内容について，特別な意味内容を持つような特段の事情がある場合を除き，単に本件表示の記載のみならず，本件表示が記載されている場所や本件表示の前後の文脈，当該表示がパソコンやスマートフォンの画面において表示される場合には，その画面の変遷等を総合的に考慮して，一般通常人の認識を基準として，その意味内容を解釈すべきものと解される。\n\nつまり「一般の人がどう読むかで判断しますよ」ということ。ここまでは「ユーザー有利になるかな」と思うじゃないですか。\n\nならないんですよ。これが。\n\n裁判所、続けてこう言います。\n\n ピックアップそうびが主たるものと読み取れる記載があるからといって，当然に，ピックアップそうびの排出確率が，他の★５そうびより高いことを，一般通常人をして認識するものとはいえない。\n\n（略）\n\n「場合がある」という原告らの主張に沿うような記載があるとしても，当然に，これをもって，一般通常人をして，ピックアップそうびの排出確率が他の★５そうびより高いとを（ママ）いうことを認識するものとはいえない。\n\n「そうは書いてない」。\n\nこれです。裁判所は結局「ピックアップが優先排出されるとは書いていない」と判断した。\n\n個人的には「え？そう読むの普通じゃない？」と思うんですが、裁判所的には「書いてないものは読み取れない」ということみたいです。\n\nこの判断を前提に5つの請求を全部退けました。全敗です。\n\n裁判所、めちゃくちゃ冷静。好き。というか怖い。","takeaway":"で、結局なにが大事なの？\n\n・「優先」「ピックアップ」という言葉は確率の高さを保証しない。明記されてないとアウト\n・ゲームの表示は「一般の人がどう読むか」で判断される。でも「どう読むか」の解釈は必ずしもユーザーに有利ではない\n・消費者契約法・景表法・詐欺・錯誤と全方向から攻めてもダメなことがある\n・トラブルの記録は丁寧に残そう。裁判では「書いてある・書いてない」で決まる\n\n運営は「確率が高いとは書いてない」で逃げられる。ユーザーは「思ってた」では戦えない。","one_liner":"「ピックアップ」は「確率高い」じゃない。裁判所もそう言ってる。引く前に読め。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"ゲームユーザ"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"ゲーム運営会社"}],"lessons":["証拠がないと詰む"]},{"original_title":"東京地判平30.8.17（ソフトウェア画面と商品形態模倣）","url":"https://itlaw.hatenablog.com/entry/2024/10/27/145714","court":"東京地判","date":"平30.8.17","year":"平成30年","topic":"ソフトウェア画面と商品形態模倣","categories":["プログラム・システム"],"fun_headline":"【教育アプリ対決】ロイロノート vs オクリンク、1600万円かけて裁判した結果がこれ","hook":"エンジニアのみなさん、今日の話は直接関係あるかもしれないやつです。\n\n「うちのアプリ、あの会社にパクられた！」と思ったことはありますか？\n\nこの判例は、そう思って1600万円の損害賠償を請求した会社の話です。\n\n結論から言います。負けました。\n\nなぜ負けたのか、聞きますか？","summary":"・絡んでる金額: 1600万円\n・テーマ: ソフトウェア画面と商品形態模倣\n・システム開発のトラブル","what_happened":"話を整理しますね。\n\n原告原告側は「ロイロノートスクール」という教育アプリを開発・販売していました。学校の授業で使われるやつです。\n\n被告被告側は「オクリンク」という同じく教育向けアプリを開発・販売していた。\n\n原告側は「オクリンクはロイロノートの形態を模倣している」として、不正競争防止法に基づいて逸失利益1600万円を請求しました。\n\n【ちょっと解説】不正競争防止法（ふせいきょうそうぼうしほう）── 営業秘密の持ち出し、商品の模倣など、ズルい競争方法を規制する法律。略して「不競法」。\n\nここで僕の話をさせてほしいんですけど、僕も昔「このアプリ、あのアプリに似てるな」と思ったことが何度かあります。でも似てることと「違法な模倣」は全然別の話なんですよね。話を戻します。\n\nソフトウェアの「画面の見た目」を模倣されたとき、どういう法的保護が受けられるのか。これが今回のテーマです。\n\n著作権侵害は主張してないんですよ。\n\nあくまで「商品形態の模倣」として不競法で攻めた。ここが重要。","issue":"要するに何が問題だったの？\n\nまず不競法の「商品形態模倣」の話。これは「他社の商品の外見をそのままパクること」を禁止するルール。\n\nここテストに出ます。\n\nでも裁判所はこの主張を認めませんでした。その上で「不競法に当たらなかったとしても、不法行為（民法上の損害賠償）にならないか」というのも争点になりました。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\n裁判所はこのように述べました。\n\n不競法各号の規定は，特定の行為を不正競争として限定列挙するものであるから，同条各号所定の不正競争に該当しない行為は，同法が規律の対象とする社会全体の公正な競争秩序の維持等の利益とは異なる法的に保護された利益を侵害するなどの特段の事情がない限り，不法行為を構成するものではないと解するのが相当である（最高裁平成２１年（受）第６０２号，同第６０３号同２３年１２月８日第一小法廷判決・民集６５巻９号３２７５頁参照）。\n\n原告側が主張する被告側の行為が不競法の不正競争行為に当たると認められないのは前記のとおりであるところ，被告側が，同法が規律の対象とする社会全体の公正な競争秩序の維持等の利益とは異なる法的に保護された利益を侵害したなどの特段の事情は認められない。\n\n「不競法に当たらない行為は、よっぽど特別な事情がない限り不法行為にもならない」。\n\nそして今回は「よっぽど特別な事情」もなかった。という結論。なるほどね。","ruling":"いよいよ判決です。\n\n原告側の1600万円の請求は棄却されました。\n\n裁判所、冷静すぎて笑った。\n\nちなみに全然関係ないけど、「似てる」と「同じ」の間には法律的に宇宙ほどの差があることをこの判例は教えてくれます。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n・ソフトウェアの「画面の見た目」は、不競法の商品形態模倣で守りにくい。著作権で攻めるのが基本戦略\n・不競法に当たらない行為は、特段の事情がない限り不法行為にもならない。抜け道はほぼない\n・「パクられた」と感じたら、どの権利が侵害されたか弁護士と一緒に整理してから動くこと\n・1600万円を請求して全部棄却される前に、法的根拠をしっかり確認しよう\n\n「似てる」を「違法」に変えるのは、思ってるより10倍難しい。","one_liner":"「パクられた」と「違法に模倣された」は別の話。裁判所は後者にしか反応しない。","parties":[{"role":"原告側","icon":"💼","side":"plaintiff","desc":"ロイロノート社"},{"role":"被告側","icon":"⚖️","side":"defendant","desc":"オクリンク開発会社"}],"lessons":["秘密は管理してナンボ","損害、証明できる？"]},{"original_title":"東京地判平30.7.25（ネットオークション出品者実在確認義務等）","url":"https://itlaw.hatenablog.com/entry/2019/12/19/002848","court":"東京地判","date":"平30.7.25","year":"平成30年","topic":"ネットオークション出品者実在確認義務等","categories":["その他"],"fun_headline":"【40万円被害】ネットオークションで詐欺に遭ったのに、運営に出品者情報を開示してもらえなかった話","hook":"みなさん、ネットオークション使ったことありますか。\n\n「落札したのに商品が届かない」という悪夢を想像したことありますか。\n\n40万円の金貨が届かなかった人がいます。\n\n運営に「出品者の情報を教えてください」と言ったら、どうなったと思いますか。","summary":"・絡んでる金額: 40万円\n・テーマ: ネットオークション出品者実在確認義務等","what_happened":"整理します。\n\n原告は相手方が運営するネットオークションで約40万円の金貨を落札しました。\n\nところが商品が届かない。詐欺の可能性がある。\n\n原告は相手方に「出品者の情報を教えてくれ」と言いました。相手方は「個人情報なので開示できません」と回答。\n\n原告の気持ち、わかる。めっちゃわかる。つらい。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。今回は「運営は出品者の情報を確認する義務があったのに怠った」「情報を開示する義務があったのに開示しなかった」という主張。\n\n原告は相手方に対して110万円の損害賠償を求めて裁判を起こしました。\n\nここで僕の話をさせてほしいんですけど、40万円の金貨って何グラムあるんだろうと思って計算しようとしたら面倒くさくなりました。話を戻します。\n\n最初は東京簡裁で原告が負けたので、控訴した。今回はその控訴審の話です。\n\nここ、大事なとこです。\n\n原告の主張は2つ。\n\n(1) 相手方には出品者の実在性を確認する義務があった\n(2) 相手方には詐欺被害者に出品者情報を開示する義務があった\n\nさてどうなったか。","issue":"要するに何が問題だったの？\n\n「ネットオークションの運営会社は、出品者が本当に存在する人かどうか確認する義務を負うのか。また、詐欺被害があった場合に出品者情報を開示する義務を負うのか」という話です。\n\nここテストに出ます。\n\n利用規約に何が書いてあるかが全部決まります。","ruling":"裁判所はこう言いました。\n\nまず実在性確認義務について、あっさり片付けました。\n\n \n\n 原告は，相手方が，このサービスの利用契約上，出品者の実在性について確認する義務を負うにもかかわらず，これを怠ったと主張する。原告の上記主張は，相手方には，出品者が登録した氏名，住所，電話番号等の情報が当該出品者本人の情報であることを調査確認する義務があるというものと解される。\n\nしかし，（略）本件利用規約には，原告が主張するような調査確認義務に関する規定は存在しない。その他，上記義務を定めた法令上の根拠も見当たらない。\n\nしかも，（略）本件利用規約において，相手方は，利用者間の取引及び商品等の内容には一切関与せず，このサービスに出品される商品等の品質，安全性又は適法性について一切保証せず，出品者が提示する商品等を実際に販売又は提供できるかどうかに関しても一切保証しない旨定められている。これらに照らせば，相手方は，あくまでインターネット上での取引の機会の場を提供するにすぎないのであって，取引の内容等を担保するものではなく，原告もこのことを前提にこのサービスを利用しているというべきであるから，このサービスの内容からも，原告の主張する義務があると解することはできない。\n\n \n\nつまり「利用規約に書いてない。法律にも書いてない。だから義務なし」。\n\nめちゃくちゃ明快です。怖いくらい明快。\n\n次に出品者情報の開示義務。利用規約にこういう文言があったんです。\n\n \n\n 相手方は，取引の相手方の情報を出品者又は落札者に開示する義務を負わない。\n\n \n\nこれに対して原告は「詐欺をした人の情報は開示すべきだろう」と主張したんですが、裁判所の答えはこうです。\n\n \n\n 原告は，本件利用規約の前記規定について，取引の相手方の情報のうち，取引と関係しない事項を出品者又は落札者に対し開示しないという趣旨に解すべきであり，詐欺を行った者の情報については開示すべきであるなどと主張する。\n\nしかし，前記規定は，その文言上，取引の相手方の情報については開示義務を負わない旨定めているものであり，何ら例外が定められていない。しかも，商品の品質等について関知しない相手方において，詐欺の有無を客観的に判断することには困難を伴うことからすると，詐欺を行った者の情報については開示義務を負うと解することもできない。\n\n \n\nつまりこういうことです。\n\n「例外の書いてない規定は例外なし」「詐欺かどうか運営が判断するのも難しい」。\n\n原告の請求、棄却。\n\n裁判所、本当に冷静。完全に利用規約の文言で全部決まりました。\n\nちなみに今気づいたんですけど、この結論ってユーザーにとって相当しんどくないですか？詐欺に遭っても運営に開示してもらえないんですよ。怖すぎる。","takeaway":"で、結局なにが大事なの？\n\n・ネットオークションの運営は「場の提供者」であって「取引の保証者」ではない。利用規約にそう書いてある\n・「詐欺があった」という事実だけでは、運営に情報開示を義務付けられない\n・義務は「利用規約に書いてあるか」「法律に根拠があるか」で決まる。書いてなければ義務なし\n・ネットオークションは自己責任の世界。トラブルに備えるなら「エスクロー決済」など安全な支払い方法を使うこと\n\n利用規約はサービスの「憲法」です。使う前に読みましょう。40万円なくなってから読んでも遅い。","one_liner":"利用規約に書いてないことは、運営の義務じゃない。詐欺に遭っても自己責任の可能性がある。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"オークション被害者"},{"role":"相手方","icon":"⚖️","side":"defendant","desc":"ヤフーオークション"}],"lessons":["規約、読んだ？"]},{"original_title":"東京地判平30.6.21（著作権帰属条項の解釈）","url":"https://itlaw.hatenablog.com/entry/2018/12/20/232429","court":"東京地判","date":"平30.6.21","year":"平成30年","topic":"著作権帰属条項の解釈","categories":["著作権"],"fun_headline":"【悲報】ベンダ、「著作権侵害だ！」と1620万円請求した結果…全部棄却されてた","hook":"システムを別のサーバーに引っ越したら、著作権侵害で訴えられる世界線、想像できます？\n\n引越し作業でダンボール詰めてたら「それうちのものだから運ぶな！」って言われるようなもんなんですけど。\n\nしかも裁判まで行ったやつの話です。今日はそれ。","summary":"・絡んでる金額: 1620万円\n・テーマ: 著作権帰属条項の解釈\n・著作権がらみの争い","what_happened":"ちょっと長くなるけど、大事な話なので付き合ってください。\n\nベンダ権利主張側が利用側にシステムを開発して納品しました。\n\nそのシステム、冷蔵庫管理用らしくて、あと「共通環境設定プログラム」っていうやつもセットで作った。\n\n【ちょっと解説】検収（けんしゅう）── 「確認しました、OKです」と納品物を正式に受け取ること。これが終わると基本的に「やっぱダメ」とは言いにくくなる。\n\n利用側は「ちゃんと確認して受け取ったよ」で、開発費も払った。ここまでは普通の話。\n\nで、ここからがヤバいんですけど。\n\n保守契約が解除されて、基本契約も終了した。要するに「もうお付き合い終わり」ってなった。\n\nそしたら利用側がサーバーの老朽化を理由に、システムを新しいサーバーに引っ越したんですよ。\n\n「サーバー古いから買い替えたよ、システムも移したよ」ってやつです。\n\nここで僕の話をさせてほしいんですけど、僕も去年パソコン壊れてデータ移行したんですよ。\n\nあれ地獄ですよね。古いパソコンから新しいのに全部うつすやつ。丸一日かかった。話を戻します。\n\n権利主張側はこれを見て「待って！うちのプログラムをコピーした！著作権侵害だ！」と言って1620万円の損害賠償を請求。\n\n利用側の気持ち、わかる。めっちゃわかる。つらい。「サーバー壊れそうだから移したのに何が悪いの？」ってなりますよね。\n\nこういうの聞くと、明日から契約書の読み方が変わりますよね。変わってほしい。","issue":"要するに、何が問題だったの？\n\n利用側がサーバー引っ越しのときに、共通環境設定プログラムのファイルを移したこと、これが著作権侵害（コピーしたこと・改変したこと）に当たるかどうか。\n\nここテストに出ます。\n\n「サーバー移行のためのコピー」って、許諾されてるの？されてないの？って話です。","ruling":"裁判所はこう言いました。\n\nまずサーバー移行でファイルがコピーされた事実は認めた。ただ、ソースコード（設計図みたいなやつ）まで複製されたかは証明されてないとした。\n\nそのうえで、こう言い放った。\n\n 本件共通環境設定プログラムのＥＸＥファイル及びＤＬＬファイルは，本件新冷蔵庫等システムに実装されて一体として機能するプログラムであり，権利主張側が，本件基本契約及び本件個別契約に基づき，利用側から委託され，作成したコンピュータプログラムである（略）から，本件基本契約２条（２）における「成果物」である。そして，上記「成果物」について，利用側は，それが従前から権利主張側が有し，その著作権が権利主張側に帰属するものであっても，「対象ソフトウェア」である本件共通環境設定プログラムを使用するために必要な範囲で複製又は翻案をすることが許諾されている）。コンピュータプログラムを継続的に使用する上で，コンピュータプログラムを保存しているサーバの老朽化等の理由により，新サーバにコンピュータプログラムを移行することは必要な事項であるといえるから，本件新冷蔵庫等システムのサーバ移行のために，同システムに実装され，一体として機能する本件共通環境設定プログラムのＥＸＥファイル及びＤＬＬファイルを複製することは本件基本契約２１条３項（２）によって許諾されているというべきである。\n\nつまりこういうこと。\n\n「サーバー老朽化で移行するのは当然のことだから、そのためにコピーするのは契約で認められてる」\n\n裁判所、めっちゃ冷静。好き。\n\n引用文中の「本件基本契約２１条３項(2)」の中身はこれです。\n\n （２）　Xまたは利用側が従前から有していた成果物\n\nXまたは利用側が従前から有していた成果物の著作権については，それぞれXまたは利用側に帰属するものとする。この場合，利用側は権利主張側に対し，当該成果物について，権利主張側が自ら対象ソフトウェアを使用するために必要な範囲で，著作権法に基づく利用を無償で許諾するものとする。（略）\n\nちなみに全然関係ないけど「無償で許諾」って言葉、かっこよくないですか。言ってみたい。「いいよ、無償で許諾してあげる」って。\n\nで、さらに裁判所はこう続けた。\n\n「ソースコードも納品物に含まれてた。だからそれをコピーすることも許諾の範囲内」\n\n 本件個別契約の内容である本件注文書には，本件新冷蔵庫等システム等とともに本件共通環境設定プログラムが開発委託の対象として記載され（略），権利主張側とY間で取り交わされた納品物件一覧及び検収物件一覧（略）には，「システム共通関数プログラム　(1)クラスライブラリー機能一覧　(2)共通関数仕様　(3)共通関数ソースプログラム」等と記載され，本件共通環境設定プログラムのソースコードが納品物件の対象であると明記されている。これらからすると，本件共通環境設定プログラムのソースコードも本件基本契約の納品の対象であり，上記「成果物」に含まれると認められる。（略）\n\n契約終了後の第三者による保守作業も「問題なし」とした。\n\n結果：権利主張側の請求、全部棄却。1620万円、一円も取れなかった。\n\nということで決着。","takeaway":"・で、結局なにが大事なの？\n\n・契約書に「著作権の帰属」と「使用許諾の範囲」を両方書いておくこと。どちらかだけだとあとでもめる\n・サーバー移行みたいな「普通のメンテ作業」は許諾の範囲内になりやすい。訴える前に契約書を読もう\n・納品物件一覧に何が書いてあるか、ちゃんと確認すること。書いてあったことが全部証拠になる\n・最後に一言：「著作権がある」と「訴えて勝てる」は別の話。","one_liner":"「著作権がある」と「権利を行使できる」は全然違う。契約書がすべてを決める。","parties":[{"role":"権利主張側","icon":"©️","side":"plaintiff","desc":"ベンダ"},{"role":"第三者","icon":"👥","side":"third","desc":""},{"role":"利用側","icon":"⚖️","side":"defendant","desc":"冷蔵庫システム利用"}],"lessons":["証拠がないと詰む","「完成」って何？","パクリの立証は地獄"]},{"original_title":"千葉地判平30.6.20（個人情報保護法違反と不法行為・ベネッセ事件）","url":"https://itlaw.hatenablog.com/entry/2019/01/07/230838","court":"千葉地判","date":"平30.6.20","year":"平成30年","topic":"個人情報保護法違反と不法行為・ベネッセ事件","categories":["プライバシー","責任・損害"],"fun_headline":"ベネッセ個人情報流出、被害者が「2万円払え」と訴えた結果→全員敗訴という衝撃の幕切れ","hook":"「誰のせいなの、これ」\n\nあのベネッセの個人情報流出事件、覚えてます？\n\n2014年ごろに大騒ぎになったやつ。顧客の名前や住所が名簿業者に売られたやつです。\n\nで、被害にあった人たちが「2万円払え」って訴えた。\n\n結果どうなったか。ちょっと待って、これ聞いたら驚くから。","summary":"・絡んでる金額: 2万円\n・テーマ: 個人情報保護法違反と不法行為・ベネッセ事件\n・責任の所在を巡る争い","what_happened":"順を追って説明しますね。\n\nベネッセ（Y）は、a社にシステム開発・運用を委託してた。\n\nそのa社の業務委託先の従業員B、この人がとんでもないことをやった。\n\n相手方の顧客の個人情報を抜き出して、自分のスマホにUSBケーブルで転送した。\n\nそして複数の名簿業者に売り飛ばした。\n\n【ちょっと解説】不法行為── わざと、または不注意で他人に損害を与える行為。契約関係がなくても責任を問える。\n\n漏れた情報は氏名・性別・生年月日・住所・電話番号とか。要するに「その人を特定できる情報ぜんぶ」です。\n\nここで僕の話をさせてほしいんですけど、僕も昔、会員登録した覚えのないDMがバンバン届いた時期があって。\n\n名簿に載ってたんだと思う。どこから流れたのかいまだにわからない。怖すぎる。\n\n話を戻します。\n\n本人側ら（被害者たち）は「これは不法行為だ、一人あたり2万〜3万円の損害賠償を払え」とベネッセを訴えた。\n\nBが悪いのはわかってる。でも「ベネッセが責任を負うべきだ」という主張です。\n\nで、ここからがヤバいんですけど。","issue":"要するに、何が問題だったの？\n\n争点は2つ。\n\n（１）ベネッセはBの行為について「使用者責任」を負うか？\n要するに：「うちの委託先の委託先の従業員がやったことだけど、うちの責任？」という話\n\n（２）ベネッセに一般的な不法行為責任はあるか？\n要するに：セキュリティ対策が甘かったこと自体が「過失」になるか、という話\n\nここテストに出ます。","ruling":"裁判所はこう言いました。\n\n争点（１）について。\n\n本人側らは「ベネッセがa社を監督してた」「a社とBは指揮監督関係がある」と主張した。\n\nしかし裁判所は「ベネッセがBを直接指揮監督してたとは言えない」として、この主張は土台から却下された。\n\nえっ。マジで？\n\n争点（２）について。まずこう述べた。\n\n ＭＴＰスマートフォンへのデータの書き出しを防止するには，従来のスマートフォンとは異なる対策を講じる必要があるということは，本件事故当時，一般的に認識されていなかったことが認められるから，相手方は，ａ社において，正規のアクセス権限を有していた者が，その所有するスマートフォンをクライアントパソコンにＵＳＢケーブルで接続することによりクライアントパソコンからスマートフォンにデータを転送する方法によって，個人情報を不正に取得することを予見することはできなかったということができる。\n\n「当時のスマホの転送方法は一般的に知られてなかったから、予見できなかった」\n\n……なるほど？\n\nただしその直後にこうも言った。\n\n イ　もっとも，スマートフォンの転送形式やソフト開発は日進月歩であり，ある時点では本件書き出し制御システムが有効に機能しているとしても，その後の新たな技術等の開発によって，容易に当該システムが機能しなくなる可能性は当然に予見できるものであり，その他，相手方は，ａ社において，正規のアクセス権限を有していた者が，このデータベースから個人情報を大量に取得し，それを何らかの方法で外部へ持ち出し，漏えいする可能性があること自体については予見可能であったということができる。したがって，これを踏まえて，少なくとも，ａ社においては，通常の企業に要求された一般的水準における，情報漏えいの結果を回避すべき義務があるというべきである。\n\n「でも情報が漏れるかもしれないってこと自体は予見できたはず。一定の対策義務はある」\n\nちょっとここで深呼吸しましょう。\n\nじゃあ本人側らの主張は通るのか？というと……\n\n被害者本人側が「これをやってなかったのが過失だ」と挙げた6項目（アラートシステム、書き出し制御、モバイル端末制限、アクセス権限細分化、ログ確認、管理者設定）について、裁判所は全部「当時のガイドラインで必須とされてなかった」として否定した。\n\nさらに「経済産業省から勧告受けてるじゃないか」という本人側の主張にも、\n\n 相手方が受けた本件勧告では，個人情報のダウンロードを監視する情報システムの対象範囲を監査の対象としていなかったことが個人情報保護法に違反すること及び相手方の業務の全過程において相手方が保有する個人情報の利用・管理に責任を持つ部門を設置しなかったことが同法２０条に違反することが勧告の原因となる事実とされていることが認められる。\n\nしかし，相手方の過失の前提として，相手方がいかなる注意義務に違反したかについては，本人側が主張立証責任を負うものであり，個人情報保護法及び２２条は，相手方の具体的な注意義務を基礎付けるものではないから，相手方がこれらの規定に違反することを内容とする本件勧告を受けたことをもって，直ちに，本件事故について相手方に過失があるということはできない。\n\n「勧告されたからって即・過失とはならない」と退けた。\n\n結果：本人側ら全員、請求棄却。\n\nBはもちろん悪い。でもベネッセへの民事責任は認められなかった。\n\n以上が裁判所の判断です。","takeaway":"・で、結局なにが大事なの？\n\n・「情報が漏れた」だけでは損害賠償が取れるとは限らない。「具体的にどの義務に違反したか」を立証するのは被害者側の仕事\n・当時のガイドラインで「必須」とされてなかった対策が抜けてても、それだけで過失にはならない\n・「行政に勧告された」と「民事で過失が認められる」は別の話\n・最後に一言：流出された側も、訴えた側も、みんなつらい。本当にセキュリティ対策は最初にやれ。","one_liner":"個人情報を漏らされても裁判で勝てるとは限らない。「誰が悪いか」と「誰が賠償するか」は別問題。","parties":[{"role":"相手方","icon":"⚖️","side":"defendant","desc":"ベネッセ"},{"role":"本人側","icon":"👤","side":"plaintiff","desc":"個人情報漏洩被害者"}],"lessons":["証拠がないと詰む"]},{"original_title":"東京地判平30.3.29（3Dセキュア導入の要否）","url":"https://itlaw.hatenablog.com/entry/2019/11/03/200551","court":"東京地判","date":"平30.3.29","year":"平成30年","topic":"3Dセキュア導入の要否","categories":["その他"],"fun_headline":"【驚愕】「3Dセキュア入れてないお前が悪い！」→裁判所「いや違います」の一部始終","hook":"今日はちょっと変わった判例を紹介します。\n\n不正利用されて損をした人が「セキュリティを強化してなかったお前のせいだ」と主張した話です。\n\nあ、ちなみに3Dセキュアっていうのは、ネットショッピングするときに「ご本人確認のため〜」って出てくるやつです。\n\n「えっそれって入れてなかったら義務違反になるの？」という話を裁判所がマジで議論してた。","summary":"・テーマ: 3Dセキュア導入の要否","what_happened":"順を追って説明しますね。\n\n原告はネットショップ開設サービスを提供している会社。\n\n被告はそのサービスの会員で、ドローン関連の商品を売ってた。\n\n決済の流れは「カード会社→加盟店→X→Y」という構造。\n\nここで僕の話をさせてほしいんですけど、僕も昔ネットショップで買い物したらカード情報が漏れたことがあって。\n\n気づいたら知らない国の決済が入ってた。本当に怖かった。話を戻します。\n\n被告が平成27年の7〜9月ごろ、ドローン関連製品を55件売ったんですよ。\n\nそしたら後から「身に覚えがない」ってクレームが入り始めた。\n\n要するに：不正利用されたクレカで買われてた、ということ。\n\nカード会社から原告に返金請求が来て、原告は被告に「立替払金を返せ」と言った。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n\n被告は返金を拒否。「そもそも原告が3Dセキュアを導入してないのが悪い。それは安全な決済手段を提供する義務違反だ」と反論した。\n\nこれ当事者だったら胃に穴あく。\n\nでこれ、控訴審（東京高判平30.10.18）でも原審維持されてる。つまり最終的にもこの結論。\n\nここまで読んで「うわぁ……」ってなった人、正常です。","issue":"要するに、何が問題だったの？\n\n被告の返金義務はあるか。\n\nそして被告の反論「3Dセキュア入れてない原告が悪い」は通るか。\n\nこれを裁判所がどう判断したか、ですね。\n\nここテストに出ます。","ruling":"裁判所はこう言いました。\n\nまず安全な決済手段を提供する義務について、\n\n 原告は，○○決済の提供者として，○○会員が○○決済に伴うリスクに徒らに晒されないように配慮すべき立場にあるから，○○決済がクレジットカードの不正利用に係るリスクとの関係で致命的な欠陥を有するにもかかわらず，原告がそれを殊更に放置しているような特段の事情がある場合には，そのリスクを一方的に○○会員に転嫁することが信義則違反と評価される余地はあるといえる。もっとも，○○会員には退会の自由も保障されている以上，その具体的な配慮の仕方については運営者である原告に一定の裁量が認められているというべきである。\n\n「致命的な欠陥を放置してたら問題。でも具体的にどうするかはX次第」という判断。\n\n裁判所、めっちゃ冷静。好き。\n\nそのうえで実際に原告がやってた対策を評価して、こう言った。\n\n そのような観点からすると，原告としては，○○決済において，クレジットカードの不正利用に対する一般的な対策の一つであるカード利用者をしてセキュリティコードの入力をさせるシステムを整備した上で，クレジットカードの不正利用の疑いがある取引について情報を入手し次第，これを被告に伝えて，契約解除及び商品発送の取りやめを慫慂したり，カード会社による返金請求（チャージバック）がされた場合でも，これに対する反証のための資料の収集・提出について被告を促したりしており，被告が無用な損失を被らないように一定の配慮をしていることが認められる。\n\nつまりこういうこと。「セキュリティコードの確認もしてたし、不正の疑いがあれば被告に連絡もしてた。それで十分」\n\nちなみに全然関係ないけど、「慫慂（しょうよう）」って言葉、読めます？「勧める」って意味らしい。判決文ってたまにこういう字が出てくる。\n\nで、「3Dセキュアも名義人情報の共有もやってないじゃないか」という被告の主張に対しては、原告が得る手数料が決済額の0.06%余りにしかならない薄利であることも考慮して「その水準まで求めるのは過剰」と退けた。\n\n被告の反論は全部却下。原告の請求が認められた。\n\n以上が裁判所の判断です。","takeaway":"・で、結局なにが大事なの？\n\n・「3Dセキュアを入れてないから義務違反」とはならない。どこまでやれば十分かは文脈次第\n・不正利用のリスクは、決済サービスを使う人が一定程度自分で負う\n・「嫌なら退会できるでしょ」という理屈が法的に通る世界\n・最後に一言：不正利用された側より、不正利用されたクレカで買った商品を売った人のほうが損をすることがある。","one_liner":"「セキュリティが甘いお前が悪い」は、法的には必ずしも通らない。自衛が大事。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"ネットショップ開設"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"ネット販売会社"}],"lessons":["セキュリティ甘すぎ"]},{"original_title":"東京地判平30.3.9（非正規サイトで入手したアマゾンギフト券の扱い）","url":"https://itlaw.hatenablog.com/entry/2019/12/30/225949","court":"東京地判","date":"平30.3.9","year":"平成30年","topic":"非正規サイトで入手したアマゾンギフト券の扱い","categories":["その他"],"fun_headline":"非正規サイトで234万円分のアマゾンギフト券を買った男の末路がヤバすぎた","hook":"ちょっと待ってこれ聞いたら驚くから。\n\nアマゾンのギフト券を234万円分買った人がいる。\n\n普通のショップじゃなくて「非正規サイト」で。\n\nそしてアカウントを停止されて、残高が全部使えなくなった。\n\nここまで読んで「えっ」てなった人、正常です。今日はその話。","summary":"・絡んでる金額: 170万円\n・テーマ: 非正規サイトで入手したアマゾンギフト券の扱い","what_happened":"話を整理しましょう。\n\n原告がアマゾンに「不当利得返還請求」をした。\n\n【ちょっと解説】不当利得返還請求── 「法律上の理由なく得た利益を返せ」という請求。「もらっていい理由がないのに持ってるのはおかしい」という話。\n\n経緯はこうです。\n\n原告は非正規サイトZから234万円分のギフト券を買った。\n\n14個のアカウントに登録した。\n\n購入数量制限のかかったMS Officeを大量に買おうとした。\n\nえっ。マジで？\n\nここで僕の話をさせてほしいんですけど、僕も昔セールのときに限定品を大量に買おうとしたら弾かれたことあって。\n\n1個しか買えなかった。悲しかった。でも14アカウントは作ってない。話を戻します。\n\nアマゾンは2度警告を出したあと、全アカウントを利用停止にした。\n\n残高は全部使えなくなった。未使用分が約170万円。\n\n原告は「使えなくなった分を返せ」と訴えた。\n\nなお、アマゾンの規約には「一人一アカウント」「ギフト券の転売禁止」「裁量でアカウント停止できる」と書いてある。\n\nそしてギフト券は本物だったことは認定されている。\n\n「本物のギフト券」「でも非正規サイトから買った」「14アカウント作った」「大量購入しようとした」。この状況で原告は勝てるのか。","issue":"さあ、何が揉めたのかというと。\n\n不当利得返還請求が成立するかどうかを2つに分けて検討した。\n\n（１）原告に「損失」があって、アマゾンに「利得」があるか\n要するに：原告は本当に損したの？アマゾンは本当に得したの？\n\n（２）アマゾンが得た利益は「法律上の原因がない」と言えるか\n要するに：アマゾンが残高を使えなくしたことは法的に許されないことなの？\n\nここテストに出ます。","ruling":"さあ、裁判所の答えです。\n\n裁判所は、アマゾンの規約上「裁量でアカウント停止できる」と明示されており、ギフト券の転売も禁止されていたことなどを踏まえ、アマゾンがアカウントを停止したことには法律上の根拠があると判断した。\n\n要するに：「規約に書いてあったことをやっただけだから、アマゾンが不当に得したとは言えない」\n\nあ、今思い出したんですけど「非正規サイトで買ったギフト券」ってそもそも大丈夫なの？という疑問、当然ですよね。\n\n本件では「ギフト券は本物」とされてるので転売ルートの問題は別として、今回の請求には関係ないとされた。\n\n結果：原告の請求棄却。\n\nギフト券は本物でも、規約違反のことをして停止されたら残高は戻ってこない。\n\n以上が裁判所の判断です。","takeaway":"・で、結局なにが大事なの？\n\n・「本物の商品を持ってる」と「使える権利がある」は別の話\n・アマゾンの規約、読んでなくても適用される。「知らなかった」は通用しない\n・非正規サイトでお得に買ったものが、あとで全部使えなくなるリスクがある\n・最後に一言：規約はあなたが読まなくても効力があります。","one_liner":"規約は読まなくても有効。「知らなかった」と言った瞬間に負けが確定する。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"アカウント停止者"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"アマゾン"}],"lessons":["プラットフォームの罠"]},{"original_title":"東京地判平30.3.6（請負契約の成否と従業員給与等の損害賠償）","url":"https://itlaw.hatenablog.com/entry/2021/08/15/180811","court":"東京地判","date":"平30.3.6","year":"平成30年","topic":"請負契約の成否と従業員給与等の損害賠償","categories":["契約・報酬","責任・損害"],"fun_headline":"【実話】「開発はボランティアでした」と言い張った個人エンジニア、裁判所にどう判断されたか","hook":"お金の話って、だいたいめんどくさいですよね。\n\nでも今日の話は、めんどくさいを通り越してちょっと怖い。\n\n「契約書がない」「ボランティアでやってた」って言えば契約はなかったことになるのか？\n\nそういう主張をした個人エンジニアと、「75万円払って完成しなかった、損害賠償よこせ」という会社の話です。","summary":"・絡んでる金額: 75万円\n・テーマ: 請負契約の成否と従業員給与等の損害賠償\n・契約とお金の話","what_happened":"で、何が起きたかというと。\n\nX（発注した会社）がY（個人のエンジニア）に業務システムの開発を頼んだ。\n\n金額は75万円。そのうち40万円は先払いした。\n\nところが期限が来てもシステムは完成しなかった。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n\n発注側は「もう無理」と契約解除を通知した。\n\nそして、40万円の返還＋「開発のために使った人件費・PC代など約200万円も払え」と要求した。\n\nここで僕の話をさせてほしいんですけど、フリーの仕事でスケジュールが伸びたことが僕もあって。\n\nあれはほんとに申し訳なかった。でも200万の賠償は請求されなかった。よかった。話を戻します。\n\n開発側の反論がまた面白くて。\n\n「契約書なんてない。開発はボランティアでやってた。受託する合意なんてしてない」と言い張った。\n\n40万円払われてるのに「ボランティア」。\n\n開発側の気持ち、ちょっとだけわかる気もしなくもないけど、つらいな。\n\nシステムが完成しなかったことは開発側も認めてる。争いはなかった。","issue":"両者の言い分が食い違ったポイントはここ。\n\n（１）そもそも請負契約は成立してたのか\n要するに：契約書なしでも「開発受けます」という合意があったか\n\n（２）解除による損害の範囲\n要するに：人件費や経費まで損害として請求できるか\n\n【ちょっと解説】請負契約── 「仕事を完成させたら報酬をもらう」という契約。成果物が完成しないと報酬請求ができない。\n\nシステムが完成しなかったことは双方とも認めているので、主な争点は損害の範囲。\n\nそのうち裁判所は、開発側の勧めで買ったPC代約13万円については損害として認めた。（開発側があまり争わなかったらしい）\n\n問題は人件費。発注側は「開発のために従業員を動かした。その給与分が損害だ」と主張した。\n\nこれに対して裁判所はこう言った。\n\n 従業員への給与やX代表者の報酬は，このシステム導入の如何にかかわらず当然に支出すべき経費と考えられるところ，本件において，このシステムの導入がされれば，X従業員ないしX代表者が他の業務に従事することにより具体的に利益が得られたというような具体的事情の主張立証はないから，発注側の主張は理由がない","ruling":"裁判所はこう言いました。\n\nまず請負契約の成否について。\n\n40万円が払われていること、実際に開発作業が行われていたことなどから、「ボランティアでした」は通らず、請負契約の成立が認められた。\n\n「契約書なくても契約は成立する」という話ですね。ここテストに出ます。\n\nつぎに損害の範囲について。\n\nPC代（約13万円）：認められた。\n\n人件費・給与：上記の引用のとおり、認められなかった。\n\nつまりこういうこと。\n\n「従業員の給料はシステムがあろうとなかろうと払うものでしょ。システムのせいで余計に払ったとは言えない」\n\n裁判所、めっちゃ冷静。好き。\n\nこれって要するに「もともと払う予定だったコストは損害にならない」ということ。\n\nちなみに全然関係ないけど、本人訴訟（弁護士なし）で開発側は戦ったらしくて。\n\nそれはそれで「ひとりで戦ったのか……」ってなる。\n\n以上が裁判所の判断です。","takeaway":"・で、結局なにが大事なの？\n\n・契約書がなくても、お金をやり取りして仕事をした事実があれば契約は成立する\n・「もともと払う予定の経費」は損害として認められにくい。「システムのせいで余計にかかったコスト」を具体的に立証できないと厳しい\n・口頭でもいいから、金額・納期・仕様は最初に決めておくこと\n・最後に一言：ボランティアと言い張るなら最初からお金を受け取るな。","one_liner":"「契約書がない」は「契約がない」ではない。お金を受け取った瞬間に何かが始まっている。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"発注者"},{"role":"開発側","icon":"💻","side":"defendant","desc":"個人開発者"}],"lessons":["契約書読んどけば…"]},{"original_title":"東京地判平30.2.27（契約書なきレベニューシェア）","url":"https://itlaw.hatenablog.com/entry/2019/06/24/215139","court":"東京地判","date":"平30.2.27","year":"平成30年","topic":"契約書なきレベニューシェア","categories":["契約・報酬"],"fun_headline":"【実話】口約束でシステム開発した男、2660万円を求めて裁判所へ行った結果","hook":"「契約書なくてもまあいっか」って思ったこと、ありますよね。\n\n信頼できる相手だし、空気感でわかるし、って。\n\nわかります。僕もそういうタイプです。でも今日の話を聞いたら考えが変わるかもしれない。\n\n2660万円が吹っ飛んだ話です。","summary":"・絡んでる金額: 2660万円\n・テーマ: 契約書なきレベニューシェア\n・契約とお金の話","what_happened":"順を追って説明しますね。\n\n発注側と開発側は、システムを共同で開発することにしました。\n\nここまではよくある話。で、ここからがちょっと特殊で。\n\n発注側は「儲かったら山分けしよう」という完全成功報酬型を自分から提案したんですよ。レベニューシェアってやつです。要するに「サービスが当たったら利益を折半する」という契約。サービスが始まらないと1円も入らない仕組み。\n\n発注側はストックオプション（株を安く買える権利みたいなもの）も求めて、開発側はOKする方針でした。\n\nここで僕の話をさせてほしいんですけど、僕、昔バイト先で「完全歩合制で働いてみようか」って言われて、「かっこいいな」と思ってOKしたら全然稼げなかったことがあって。あれは本当につらかった。発注側と開発側の話に全然関係ないですけど。話を戻します。\n\n発注側はシステム開発を始めたんですが、スプリント（短い期間に区切った開発サイクル）ごとの目標を達成できなくて、リリース予定が何度も何度も後ろ倒しになりました。\n\nで、ここからがヤバいんですけど。\n\n開発側は痺れを切らして、発注側とのシステムとはまったくベツモノの「ｅ」「ｆ」というシステムを、別の会社に発注して、そっちでサービスを始めちゃったんですよ。\n\nつまり発注側は開発が遅れ → 開発側は別会社に依頼 → サービス開始せず → 契約書もなし → 発注側は1円も受け取れないまま終了。\n\n嫌すぎる。\n\n発注側は「エンジニアを何時間使ったか」という工数に標準単価を掛けた約2660万円を、「商法512条の報酬」か「騙された分の損害賠償」として請求しました。\n\n【ちょっと解説】契約締結上の過失── 契約の交渉段階でのやらかし。「やるやる」と言って期待させておいて突然「やっぱやめた」みたいなケース。損害賠償を請求できる場合がある。","issue":"で、何が問題だったの？ 一言で言うと：\n\n「契約書ナシ・サービス未開始・開発遅れはX自身のせい」という三重苦。\n\n①商法512条の報酬請求はどうか → レベニューシェアを自分で提案してるんで、サービスが始まらないと報酬は発生しない。しかも開発が遅れたのは発注側のせいでもある。\n\n②開発側に契約交渉を打ち切った責任はないか → ここテストに出ます。\n\n発注側と開発側との間で収益分配の比率等の詳細は詰められず，合意するに至ってはいなかったものの，発注側は，自ら開発側に提案したとおり，開発するシステムに基づくサービス開始により得られる収益が分配されることにより開発に要した費用を回収して利益を上げることを前提に，システム開発を行っていたが，発注側による開発の遅れからリリース予定も数次の変更を余儀なくされ，最終的にサービスの開始には至らなかったのであるから，開発側が発注側との間で正式に契約書を交わすに至らなかったとしても，そのことから開発側に信義則上何らかの過失が認められるということはできない。\n\nしたがって，発注側の主張を採用することはできず，開発側が発注側に対して不法行為に基づく損害賠償義務を負うということはできない。\n\nつまり「開発が遅れたのは発注側の問題だから、開発側に責任はない」ということです。\n\n【ちょっと解説】不法行為── 悪意や不注意で他人に損害を与えること。「弁償しろ」と言える根拠になる。","ruling":"裁判所はこう言いました。\n\n発注側の全請求棄却。1円も取れませんでした。\n\n理由はシンプルで、「契約書がない」「サービスが始まってない」「開発遅れはX自身のせい」。この三点がそろったら、どんな法律の使い方をしても発注側の言い分は通らない。\n\n裁判所、めちゃくちゃ冷静。でも正しいと思う。\n\nちなみに全然関係ないけど、「信義則」って法律用語、かっこいいですよね。「信義誠実の原則」の略で、要するに「ズルするな、誠実にやれ」ってこと。使いたくなる単語ナンバーワン。で、\n\nという結論。なるほどね。","takeaway":"で、結局なにが大事なの？\n\n・口約束でシステム開発を始めてはいけない。2660万円が吹っ飛ぶ\n・「成功報酬型」を自分で提案したなら、成功しないと1円も請求できないことを理解する\n・開発が遅れた場合のルール（延滞損害、打ち切り条件）も書面に残す\n・「やるやる」って言ってくれてる相手でも、契約書ができるまでは全力で動かない\n\n契約書は愛情表現じゃないですか。「あなたを信頼してるから書かなくていい」は思い込みです。","one_liner":"口約束のプロジェクトに2660万円かけた人の話。契約書って、保険じゃなくて最低限のマナー。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"システム開発者"},{"role":"開発側","icon":"💻","side":"defendant","desc":"発注者"}],"lessons":["契約書読んどけば…","金の話は最初にしろ"]},{"original_title":"東京地判平30.2.6（検収合格証と稼働保証責任）","url":"https://itlaw.hatenablog.com/entry/2023/10/14/171507","court":"東京地判","date":"平30.2.6","year":"平成30年","topic":"検収合格証と稼働保証責任","categories":["契約・報酬","責任・損害"],"fun_headline":"【4200万円案件】「バグだらけで使えない！」→「いや要望でしょ」→ 裁判所「……」","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n4200万円払ったシステム、バグだらけで使えない。\n\nで、「払い戻して、プラス損害賠償で1.3億くれ」って言ったら、どうなるか。\n\n「バグ」と「要望」の境界線をめぐる、わりとシビアな話です。","summary":"・絡んでる金額: 4200万円\n・テーマ: 検収合格証と稼働保証責任\n・契約とお金の話","what_happened":"で、何が起きたかというと。\n\n（複雑な経緯をたどっているため、大幅に簡略化している）\n\n発注側は倉庫管理システム「aシステム」を販売したいと思っていました。\n\nそこでソフトウェアを作っている開発側と契約。ソースコードをもらって、カスタマイズして、売っていいよという許諾も得た。合計4200万円支払いました。\n\nここで僕の話をさせてほしいんですけど、4200万円って、僕の人生で一番高い買い物、たぶん家より高いですよね。家族全員でそんな金額を一度に使うことないし、ソフトウェアのソースコードに4200万円ってちょっと想像がつかない。話を戻します。\n\n発注側はソースコードを受け取って「検査合格証」を開発側に渡しました。つまり「OKです、受け取りました」という書類。\n\nこれが後でめちゃくちゃ重要になります。\n\nで、ここからがヤバいんですけど。\n\n発注側がこのソフト（Biz版）を売ろうとしたら、不具合だらけで販売できない。開発側に2年間にわたって修正を求めたけど、最終的に開発側は「この事業をやめます」と言って撤退した。\n\n発注側はキレて、「全額返せ、プラス逸失利益とか含めて1.3億よこせ」と要求。\n\n【ちょっと解説】逸失利益── 「あのバグがなければ稼げたはずの売上」のこと。システムが使えない間に失った利益のイメージ。","issue":"で、裁判所に聞きたいことはこういうこと。\n\n発注側が指摘した不具合は本当に「不具合」なの？ それとも「改善要望」？\n\nこれ、全然違う話なんですよ。\n\n「不具合」= 約束通りに動いていない → 開発側が直す義務がある\n「改善要望」= 動いてはいるけど発注側が気に入らない → 開発側に義務はない\n\nこの区別が裁判の核心でした。裁判所の判断はこちら：\n\n開発側は，本件覚書５条１項において，このプログラム（Ｂｉｚ版）が正常に稼働することを保証したものと認められる。本件覚書５条４項，本件販売契約９条３項によれば，稼働保証の内容は，このプログラム（Ｂｉｚ版）が正常に稼働しない場合の交換又は修補を指すと解されるところ，上記４のとおり，発注側は，平成２４年３月１４日頃の時点で，開発側及びＡ社に対し，別紙課題管理台帳のうち，「不具合／エンハンス」欄の区分が「不具合」とされている各事象を，このプログラム（Ｂｉｚ版）に生じている不具合として指摘していたことが認められる（同欄の区分が「エンハンス」とされているものは，このプログラム（Ｂｉｚ版）の正常稼働を妨げるものではなく，改善のための要望事項であることが明らかである。）。\n\nそして，確かに，上記認定のとおり，発注側が，開発側がこのプログラム（Ｂｉｚ版）を納品した平成２３年３月から，開発側が本件事業の検討を中止する意思を示した平成２５年２月までの約２年間にわたり不具合の修正を求め，Ａ社がその対処を行った部分があったにもかかわらず，結果的にこのプログラム（Ｂｉｚ版）の販売に至らなかったことは認められるものの，別紙課題管理台帳の不具合の「内容」欄及び「対策案」欄の記載自体からしても，発注側が指摘する不具合は，販売のために改善を要望する事項にすぎないものがその大部分を占めているものというべきであり，上記不具合の中に正常な稼働を妨げる要因となるものが含まれていたことを認めるに足りる的確な証拠はない。\n\nつまりこういうこと。「開発側は稼働保証をしていた。でも発注側が指摘したのは『バグ』じゃなくて『要望』がほとんどだった。だから開発側は稼働保証を破っていない」。\n\n【ちょっと解説】債務不履行── 約束したのに守らなかったこと。「納期に遅れた」「バグだらけで使えない」「そもそも作らなかった」、全部これ。","ruling":"さあ、裁判所の答えです。\n\n発注側の大部分の請求は棄却。Biz版については稼働保証責任の違反なし。\n\nただし、別のJava版については債務不履行があったとして、その部分に相当する代金の一部は損害賠償が認められました。人件費や逸失利益は認めなかった。\n\n裁判所、めちゃくちゃ精緻。「課題管理台帳」という証拠資料を逐一確認して、「不具合」と「エンハンス（改善要望）」を区別した。\n\nあ、今思い出したんですけど、「検収合格証」を渡してしまったことも大きくて。「これOKです」って書類を出した後に「やっぱバグだらけ」と言い出しても、「じゃあなんでOKしたの？」ってなる。\n\n裁判所、バッサリ。","takeaway":"で、結局なにが大事なの？\n\n・検収合格証はめちゃくちゃ重い書類。「とりあえずOK出しておくか」は絶対NG\n・「バグ」と「改善要望」は明確に区別して記録する。課題管理台帳が裁判の証拠になった\n・稼働保証の内容は契約書に具体的に書く。「正常に動く」だけでは範囲が曖昧\n・4200万払ったからといって、証拠がなければ1.3億は請求できない\n\n検収は「全部確認した」という宣言。ハンコを押す前に本当に動かしてみてください。","one_liner":"「バグ」と「要望」の区別、できてる？ 4200万円の裁判はそこで決まった。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"倉庫システム販売"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ソフト提供会社"},{"role":"関連会社","icon":"🏢","side":"third","desc":""}],"lessons":["証拠がないと詰む","「完成」って何？","損害、証明できる？"]},{"original_title":"東京地判平30.1.31（契約の成否と契約締結上の過失）","url":"https://itlaw.hatenablog.com/entry/2021/10/02/183949","court":"東京地判","date":"平30.1.31","year":"平成30年","topic":"契約の成否と契約締結上の過失","categories":["契約・報酬"],"fun_headline":"【悲報】「やるって言ったじゃん！」→ 裁判所「契約書がないと無理です」→ 全額棄却","hook":"一緒にシステム開発しよう、って話が進んでて。\n\n打ち合わせも何ヶ月もして、見積もりも出した。\n\nで、急に向こうが「やめます」って言ったら？\n\n900万円の損害賠償を求めた裁判の話です。","summary":"・絡んでる金額: 160万円\n・テーマ: 契約の成否と契約締結上の過失\n・契約とお金の話","what_happened":"順を追って説明しますね。\n\n（被告には開発側のほか，開発側の代表者も含まれるが，事案を簡略化する）\n\n発注側と開発側は業務委託基本契約を結んでいました。\n\nこの契約の重要なルール：「発注書を発注側が出して、開発側が請書を返したときに個別契約が成立する」。\n\nここ、大事なとこです。赤線引いてください。\n\nふたりは協力してD社に「出版社総合管理システム」を売り込みました。要件定義を160万円で受託して、うち80万円分を発注側が開発側に再委託。開発側は資料を納品して、発注側は開発側に80万円を支払った。ここまではスムーズ。\n\n後続の開発本体（約1400万円）についても、発注側はD社に見積もりを出して、開発側は発注側に1100万円の見積もりを出していました。D社は発注側に正式発注した。\n\n僕がこの当事者だったら、「よし、あとは契約書を交わすだけ！」って思うじゃないですか。ところがそうはならなかった。\n\nここで僕の話をさせてほしいんですけど、昔チームで「次のプロジェクト一緒にやろう」って約束した友達に、直前にキャンセルされたことがあって。「うわ最悪」ってなったんですけど、あれはまだ金銭的な話じゃなかったからよかった。発注側と開発側の場合は900万円の話なので、話を戻します。\n\nじつは発注側と開発側の間で、開発側の株式を発注側が全部買う「経営統合」の話が並行して進んでたんですよ。で、デューデリジェンス（会社の中身を細かく調べること）もやって、株式譲渡契約書の案まで出てきた。\n\nで、ここからがヤバいんですけど。\n\n経営統合の交渉が決裂した。\n\n開発側は「信頼関係が築けなかった」として撤退。システム開発にも関与しなくなりました。\n\n発注側は「損害賠償で900万よこせ」と主張した。\n\n【ちょっと解説】契約締結上の過失── 契約の交渉段階でのやらかし。「やるやる」と言って期待させておいて突然「やっぱやめた」みたいなケース。","issue":"両者の言い分が食い違ったポイントはここ。\n\n「契約は成立していたの？」「開発側に一方的な責任があったの？」という2点。\n\n裁判所の判断は：\n\nしかしながら，上記認定事実によれば，\n\n①そもそも，発注側と開発側の間で締結されていた本件基本契約においては，発注側が開発側に対して注文書を送付し，開発側が請書を送付することにより個別契約が成立するとされていたにもかかわらず，発注側は，このシステム開発につき，開発側から撤退の意思を表されるまで，開発側に対して注文書を送付していなかったこと，\n\n②詳細設計会議が約４か月間にわたり開催されたものの，詳細設計会議が開始された初期の段階で，このシステム開発の内容は，フロント部分につき○○を用いず発注側が独自に開発を行うという内容に大きく変更されたこと，そして，\n\n③開発側がこのシステム開発から撤退する意思を表明したのは，上記の間に並行して進められていた本件株式譲渡に関する交渉において，発注側と開発側が信頼関係を築くことができず，その交渉が破談となったためであることが認められる。\n\nそうすると，確かに，発注側と開発側との間で本件請負契約の成立に向けた作業が進められていたことは認められるものの，本件請負契約が成立するに至らなかったことについて，開発側に一方的な責任があるということはできない。\n\n要するにこういうこと。\n\n①発注側は発注書を出してなかった（自分たちのルールを守ってない）\n②開発内容がすでに大きく変わってた\n③開発側がやめたのはM&A交渉の破談のせいで、一方的な悪意じゃない\n\nこれ全部そろったら「開発側が悪い」とは言えない、という結論。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。カレーを注文したのにカレーが出てこなかったら契約違反。","ruling":"で、裁判所はどう判断したか。\n\n発注側の全請求を棄却。0円でした。\n\n裁判所、冷静すぎる。でも筋は通ってる。「自分たちで決めたルール（発注書→請書）を守らなかった発注側が、後から『契約があったはず』と言っても通らない」という話。\n\nちなみに全然関係ないけど「デューデリジェンス」って言葉、IT業界でもM&A業界でも使うんですけど、要するに「買う前に中身をちゃんと調べること」です。略して「DD」。覚えておくと賢く見える。で、\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n・自分たちで決めた契約ルール（発注書・請書）は必ず守る。「雰囲気でやってた」は通じない\n・口頭や打ち合わせの積み重ねだけでは契約は成立しない。書類が必要\n・M&Aと業務契約を並行させると、どちらかが壊れたとき両方に影響する\n・損害賠償を請求するなら「相手に一方的な責任がある」ことを証明しなければならない\n\n打ち合わせを何ヶ月しても、発注書を出さなければ契約は存在しない。悲しいけどそれが法律。","one_liner":"発注書を出さずに「やるって話だったじゃん」は、裁判所に通じない。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ITサービス会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"パッケージ会社"}],"lessons":["契約書読んどけば…","「完成」って何？"]},{"original_title":"東京地判平30.1.30（ダウンロード先URLの教示と公衆送信権侵害）","url":"https://itlaw.hatenablog.com/entry/2018/11/19/100802","court":"東京地判","date":"平30.1.30","year":"平成30年","topic":"ダウンロード先URLの教示と公衆送信権侵害","categories":["その他"],"fun_headline":"「URLを教えただけ」は著作権侵害になるの？ → 裁判所「なります」","hook":"みなさん「URLを貼っただけ」って言い訳、聞いたことありますか？\n\n「私は何もしてない。リンクを示しただけだ」。\n\nこれ、法的に通じるのかどうか。\n\n20万円のCADソフトを「ダウンロード販売」した男の話です。","summary":"・絡んでる金額: 20万円\n・テーマ: ダウンロード先URLの教示と公衆送信権侵害","what_happened":"やっと本題に入れる。長かった。\n\n原告は、CADソフトウェア（建築設計・製図ソフト）の著作権者です。定価20万円。起動にはシリアルナンバーが必要な仕様になっていました。\n\n被告は、オークションサイト（ヤフオク）に出品しました。「DRA-CAD11」というソフトウェアを、「ダウンロード品同等」「インストール完了までフルサポート」と書いて。\n\n落札者には何が届いたか。\n\n本物のソフトウェアのインストーラーではなく、違法アップロードされたファイルのあるオンラインストレージのURL。そして、シリアルナンバーがなくても起動できるようにアクティベーション機能を無効化するクラック版モジュール。インストール方法の説明書。\n\nここで僕の話をさせてほしいんですけど、昔、友達から「無料でソフト使えるようになるやつ送るわ」ってファイルをもらったことがあって。怖くて使わなかったんですけど、あれたぶんこういうやつですよね。話を戻します。\n\n被告は商標法違反で有罪判決も受けています。で、著作権侵害についての裁判がこれです。\n\nえっ。マジで？","issue":"で、何が問題になったかというと──\n\n「URLを教えただけで著作権侵害になるの？」という問い。\n\n被告の反論がこちら：\n\n被告は，ソフトウェアのダウンロード販売をしたものではなく，ソフトウェアがもともと違法にアップロードされている場所（ダウンロードアドレス）を教えて，そのインストール方法をマニュアル化して販売したにすぎない。\n\nつまり「私は場所を教えただけ。ファイルを送ったわけじゃない」という主張。\n\nこれ、パッと聞くと「うーん一理あるかも？」と思いませんか。でも裁判所は全然そう思いませんでした。\n\n【ちょっと解説】不正競争防止法（ふせいきょうそうぼうしほう）── 営業秘密の持ち出し、商品の模倣など、ズルい競争方法を規制する法律。略して「不競法」。","ruling":"いよいよ判決です。\n\n裁判所は著作権・著作者人格権の侵害を認めました。\n\n【ちょっと解説】公衆送信権── 著作権の一種で、著作物をインターネット等で公衆に送信する権利。無断でネットにアップすると侵害になる。\n\n（改行位置等は適宜修正した）\n\n[1]被告は，ヤフオクにおいて，あくまで「DRA-CAD11」建築設計・製図CAD自体をオークションの対象物と表示して出品しており，「商品説明」欄には「DRA-CAD11」，「注意事項」欄には「ダウンロード品同等」「インストール完了までフルサポートさせて頂きます」，「発送詳細」欄には「ダウロード販売」と記載されていたこと，\n\n[2]かかる表示を見てオークションに入札した顧客も，当然，このソフトウェアを安価に入手する意図で入札を行ったと推認できること，\n\n[3]被告は，顧客に対し，このソフトウェア及びそのアクティべーション機能を担うプログラムのクラック版（いずれも原告の無許諾）のダウンロード先をあえて教示し，かつこれらの起動・実行方法を教示するマニュアル書面を提供し，その結果，顧客が，このソフトウェア（無許諾品）を入手した上，このソフトウェアで要求されるアクティベーションを回避してこれを実行することができるという結果をもたらしており，被告の上記行為は，かかる結果を発生させるのに不可欠なものであったこと，\n\n[4]被告は，営利目的でかかる行為を行い，後記３認定のとおり多額の利益を得ていること，\n\n以上の事実が認められる。\n\nちょっとここで深呼吸しましょう。\n\nこれらの事情を総合すれば，上記(1)の一連の経過により，被告は，このソフトウェアの一部に原告の許諾なく改変（アクティベーション機能の回避）を加え（このソフトウェアの表現上の本質的な特徴の同一性を維持しつつ，具体的表現に修正，変更等を加えて新たな創作的表現を付加し），同改変後のものをダウンロード販売したものと評価できるから，被告は，原告の著作権（翻案権及び公衆送信権）並びに著作者人格権（同一性保持権）を侵害したものと評価すべきであり，これに反する被告の主張は採用できない。なお，原告は，譲渡権侵害を主張しているが，有体物の譲渡ではなくソフトウェアのダウンロードが行われたものとして，公衆送信権が侵害されたものと解すべきである。\n\n要するに「URLを教えただけ」じゃなくて、「クラック版を組み合わせて実質的にソフトを届けた」という行為全体を評価した。\n\n裁判所、本質を見てる。好き。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n・「URLを貼っただけ」「場所を教えただけ」は著作権侵害の免責事由にならない\n・一連の行為の「全体」が評価される。個別の行為が合法でも、組み合わせが違法になりえる\n・クラック版ソフトを売る行為は著作権侵害・商標法違反など複数の法律に同時に触れる\n・ヤフオクで怪しいソフトを買うと、買った側にもリスクがある\n\n「リンクを貼っただけ」という主張が通じるのは、法廷ドラマの中だけです。","one_liner":"「URLを教えただけ」は著作権侵害。行為の本質を見るのが裁判所のお仕事。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"CADソフト著作権者"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"不正販売者"}],"lessons":["秘密は管理してナンボ","パクリの立証は地獄"]},{"original_title":"東京地判平30.1.22（リワード広告の報酬請求可否）","url":"https://itlaw.hatenablog.com/entry/2019/11/24/105830","court":"東京地判","date":"平30.1.22","year":"平成30年","topic":"リワード広告の報酬請求可否","categories":["契約・報酬"],"fun_headline":"【衝撃】リワード広告で「機械的な操作」は許されるの？ → 裁判所「許されます（条件付き）」","hook":"スマホゲームの広告で「アプリをダウンロードするとポイントがもらえます」ってやつ、ありますよね。\n\nあれ、リワード広告っていうんですけど。\n\n「ダウンロード5万件達成で248万円」という契約が裁判になった話です。","summary":"・絡んでる金額: 50円\n・テーマ: リワード広告の報酬請求可否\n・契約とお金の話","what_happened":"で、ここからが面白いんですけど。\n\n開発側はゲームアプリの会社。「ダウンロード件数を増やしたい」という目的で発注側にリワード広告を発注しました。\n\n条件はこう：\n・まず4万件達成を目標、1件50円\n・4万〜5万件の追加分は1件30円\n・件数の計測はFOX（スマートフォン広告効果測定ツール）で行う\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。カレーを注文したら、カレーが出てくるまでが請負。カレーが出てこなかったら契約違反。\n\n発注側はリワード広告を実施して、12月30日に「5万件達成しました」と報告。248万4000円の支払いを請求しました。\n\n開発側が支払わなかったので、発注側は支払督促を申し立て、開発側は異議を申し立てて裁判になりました。\n\nここで僕の話をさせてほしいんですけど、「支払督促」って制度、知ってます？ 裁判所を通じて「払え」という書類を送りつけられる制度で、相手が異議を言わなければ強制執行できる。使ったことはないけど、なんかパワフルな制度だな、と思う。話を戻します。\n\n開発側の言い分は「機械的な操作や中華ブーストで数字を増やしたのは不正だから払わない」というもの。\n\n「中華ブースト」というのは、大量のデバイスや操作で人工的にダウンロード数を増やす手法。アプリストアのランキングを不正に上昇させる行為として問題視されていたやつです。\n\nえっ。マジで？","issue":"で、何が問題になったかというと──\n\n「リワード広告において、機械的なダウンロード操作は契約違反なの？」という一点。\n\n開発側は「不正操作で水増しした数字で金を請求するな」と主張していました。これ、感情的にはわかるんですよね。「ズルしてノルマ達成した分は払いたくない」という気持ち。\n\n裁判所は請負契約の内容についてこう認定しました：\n\n本件請負契約の内容すなわち発注側が完成させるべき仕事の内容としては，（略）当初，発注側が，リワード広告を通じ，すなわちリワード広告により付与されるポイントの獲得を目的とするユーザーに働きかけて，このアプリのダウンロード件数について４万件を達成すること（１件当たりの単価５０円），その後にダウンロード件数を１万件追加すること（１件当たりの単価３０円）を合意したことが認められる。そして，達成すべきダウンロード件数の判定に当たっては，前記１(2)のとおり，ＦＯ発注側による旨合意していることも認められる。\n\n (2)なお，開発側が主張する不正操作が本件請負契約において許容されているかどうか，すなわち，開発側が主張する，ポイントの獲得を目的とせずに直接ランキングを上昇させるような「中華ブースト」などの手法によりダウンロード件数を達成することは，もとより，上記(1)のリワード広告を通じたダウンロード件数の達成ということと相容れないものであることはいうまでもないが，他方，リワード広告の効果を通じてダウンロード件数を達成し，これによりアプリの注目度を上げて自然流入を促すという本件請負契約の目的（この点は当事者間に争いがない。）に照らせば，リワードを目的とするユーザーが機械的にＩＰアドレスを変更するなどして，二重，三重にポイントの獲得を目的とする行為まで明確に排除されているとはいえず，そのような意味での機械的操作自体は許容されているものと解さざるを得ない。\n\n(3)なお，開発側は，不正操作については本件請負契約における仕事の完成の手段としては認められていない旨主張する。この点について，上記(2)のとおり，ポイントの獲得を目的としない第三者による不正な操作を排除するという趣旨であるならば，開発側の主張のとおりと理解できるが，他方，ポイントの獲得を目的とする機械的操作である限り，それ自体は，本件請負契約がリワード広告を通じたダウンロード件数の達成という趣旨に反せず，許容されているものといわざるを得ない。また，開発側が，機械的操作を許容することはこのアプリのゲームユーザーとして残ることが期待できないことになると主張する点も，リワード広告の性格上，当該アプリに関心を示さない，ポイントの獲得のみを目的とするダウンロードは当然許容されるのであって，この点に関する開発側の主張は採用できない。\n\nまた，開発側は，人為的操作による順位の上昇を禁じたアップストアの規約に照らして，機械的操作を許容するはずがないと主張しているが，前記１(2)のとおり，発注側は，メールにおいて，開発側に対し，明確に「リジェクトの際の責任」すなわち規約違反の責任を負いかねると伝えており，ＡがＢに対して，規約違反の可能性について説明していたと認められること（略）に照らせば，規約違反によるリスクについては，開発側も承知していたと考えられ，この点に関する開発側の主張は採用できない。\n\nえっ。マジで？","ruling":"いよいよ判決です。\n\n「ポイント目的の機械的操作はリワード広告の性質上、禁止していない」という驚きの結論。\n\nつまりこういうこと。\n\nランキング操作目的の「中華ブースト」はNG。でも「ポイントもらいたくてアプリDLする」という行為をIPアドレス変えて何回もやるのは……リワード広告の仕組み上、そもそも排除できてない。\n\nしかも、発注側は開発側に「規約違反のリスクはうちじゃ責任負えません」とメールで伝えていた。開発側は知っていた。だから文句は言えない。\n\n計測結果は4万9974件。5万件には届かなかったけど、件数に応じた報酬は認められました。\n\nちなみに全然関係ないけど、「リワード広告」って仕組み自体がすごく面白くて、「アプリをDLするとゲームの中でアイテムもらえます」みたいなやつ。DLする側も得するし、アプリ会社は数字が上がるし、広告代理店は儲かるし、三方よしのビジネスモデルのはずだったんですけど。で、\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n・「禁止」は契約書に書かないと禁止にならない。「当然ダメでしょ」は通じない\n・リワード広告の「ダウンロード件数」は、純粋な新規ユーザーとは限らないと最初から理解する\n・計測方法（FOXなど）を契約に明記したら、その数字が絶対的な基準になる\n・アプリストアの規約違反リスクを相手が知っていたかどうかが、免責の分かれ目になった\n\nリワード広告に「機械的操作禁止」を盛り込んでいなかった時点で、開発側の負けは決まっていた。","one_liner":"「当然ダメでしょ」は契約書に書かないと禁止にならない。リワード広告の教訓。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"広告配信会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ゲームアプリ会社"},{"role":"第三者","icon":"👥","side":"third","desc":""}],"lessons":["「完成」って何？","金の話は最初にしろ"]},{"original_title":"東京高判平29.12.13（マイグレーション失敗／履行不能）","url":"https://itlaw.hatenablog.com/entry/2022/07/30/174328","court":"東京高判","date":"平29.12.13","year":"平成29年","topic":"マイグレーション失敗／履行不能","categories":["その他"],"fun_headline":"【8億円】マイグレーション大失敗、控訴審でも「やっぱり履行不能」だった件","hook":"8億円です。8億円が動いた裁判の話をします。\n\n「マイグレーション失敗して履行不能」って一言で言うとさらっとしてるんですけど、中身がやばい。どのくらいやばいかというと、読み終わったあとに「契約書、ちゃんと書かんとだめだ……」って思わずつぶやいてしまうくらいにはやばい。\n\n覚悟して読んでください。","summary":"・絡んでる金額: 8億円\n・テーマ: マイグレーション失敗／履行不能","what_happened":"まず大前提の話から整理させてください。\n\nこれ、控訴審の判決なんですよ。一審がすでにあって、それに対して「納得いかん！」って控訴したやつです。\n\n一審でどうなったか。ベンダ（システムを作る側）がユーザー（お金を払う側）に「代金払ってくれ！」と訴えたのに対して、ユーザー側は「いや、そもそもあんたの債務は履行不能だったでしょ」って言って解除、かつ払ったお金を返せと反撃したわけです。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n\nで、一審の結果。ユーザー側が大勝ちです。「ベンダの債務は履行不能だった」として、すでに払ったお金を含む約8億円の返還がほぼ認められた。\n\nここで僕の話を少しさせてほしいんですけど、僕は「8億円」って数字を見たとき、思わず立ち上がりました。リアルに。座ってたのに立った。8億って何億ですか。8億ですよね。意味がわからない。\n\n話を戻します。\n\n控訴審でも、ベンダの債務が履行不能だったという大枠の判断は変わりませんでした。ただ、争点になったのは「第5契約、第6契約、第7契約って、そもそも成立してたの？」という個別の論点です。\n\nで、ここからがヤバいんですけど、これが全部フワっとした状態で進んでたらしいんですよね。「え、ちゃんと契約書にサインした？」って聞きたくなる案件。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n「個別契約の第5・第6・第7、それぞれちゃんと契約として成立してたの？」という点です。\n\n基本契約には「個別契約は責任者が記名押印した書面で締結する」ってルールが書いてあった。でも実態は、そんな書面がないのに実際の作業は進んでた。\n\nつまり「書類ない → 契約なし → お金もらえない」のか、「実態として合意あった → 契約あり → お金もらえる」のか、どっちなんだ、という話です。\n\n契約書って読んでおくもんだな、と思いますよね。","ruling":"裁判所はこう言いました。\n\n第5契約について。「成立していた」と認めました。なぜか。こういう理由です。\n\nまた，本件の事実関係を見ても，物流システム（ｂ）の納品をめぐる当事者間のやりとりにおいて，上記の「倉庫概念」に係る作業についての指摘はなく，１審被告は，平成２１年３月３１日頃，１審原告に対し，物流システム（ｂ）に係る「検収および納入物件受領書」（甲１０６の３）を交付しているものであり，第５契約に係る作業は，１審被告が，平成２１年３月にｅ社を子会社化したことに伴い，物流システム（ｂ）をこれに対応させる必要が生じたことを契機として，同年４月以降，「倉庫概念」と呼ばれる作業の整理が行われたものであって，本件ｂシステム契約とは別個の作業であるということができる。\n\n【ちょっと解説】検収（けんしゅう）── 「確認しました、OKです」と納品物を正式に受け取ること。これが終わると基本的に「やっぱダメ」とは言いにくくなる。\n\nつまり「ちゃんと検収書を渡してるじゃないですか。受け取ったってことですよね」ってことです。裁判所、めっちゃ現実主義。好き。\n\nさらに続きます。\n\nそして，同年６月１７日の全体ミーティングにおける１審被告の担当者の指示に従い，１審原告は，その指示に従ってこれらの作業を行うとともに，「返品」に関する物流システム（ｂ）の変更作業を含む「倉庫概念」の全体の作業の見積りを繰り返し提示していたものである。\n\nこれらの事実関係に照らせば，１審原告と１審被告との間には，平成２１年６月１７日，「倉庫概念」を作業内容とする契約が成立していたものと認めるのが相当というべきである。\n\n書面がなくても合意は認められる、という判断です。でも基本契約には「書面が必要」って書いてあった。それはどうするの？\n\n確かに，第５契約の成立は，第２契約を変更したとも解し得るところ，上記の書面によってされたとはいえず，本件基本契約６条に定める方式に沿わないものであるが，第５契約に係る作業内容や事実経過等の上記説示を踏まえれば，当事者間で第５契約の成立が認められることを左右するとはいえないものというべきである。\n\n要するに「書面ないけど、実態からして成立してたでしょ」ってことです。\n\nこれ、読んで「うわぁ……」ってなりますよね。なっていい。正常な反応です。\n\n第6契約も同様に成立と認定。作業を「継続」するかどうかの一覧表を作って渡してた事実、口頭での「個別で対応するので良い」という発言、これが決め手になってます。\n\n１審被告は，本件作業停止指示に際し，作業項目毎に作業を「継続」するのか「停止」するのかを記載した一覧表を作成し，１審原告に交付するなど，きめ細かな仕分けを行っていたことがうかがわれる。そして，第２契約に係る作業については，基本的に停止を指示する一方，第６契約に係る作業（ＥＤＩ・ＡＳ切替接続テストに係る作業）については「継続」を指示しているものである。その後，これに基づいて継続されていた上記の切替接続テストに係る作業の平成２２年２月以降の取扱いについて，１審原告の担当者であるＰと１審被告のＮとの間で協議がされ（甲８２，１０７，１０８），これを踏まえて，同月５日の打合せにおいて，１審原告の担当者であるＱが１審被告のＤに対し，同月から同年４月まで３人月で別途発注とすることを提案したところ，１審被告のＤは，「見積りの見直しをやりながらそれについては個別で対応するので良い。」と発言してこれに同意しているものである（甲１３８）。これによれば，１審被告において，第６契約を第２契約とは別の発注として扱うことを了承し，第６契約につき承諾をしているというべきである。\n\n一方、第7契約は「既存の契約の範囲内の作業」として、別個の契約としては成立しないと判断されました。\n\nというのが裁判所の結論です。","takeaway":"で、結局なにが大事なの？\n\n- 合意の証拠を残せ。メール一本でもいい。口約束は「なかった」と同じ扱いになる可能性がある\n- 検収は書面でやれ。「確認しました」の一言がのちの裁判で決定的な証拠になる\n- 基本契約に「書面で締結」と書いても、実態が伴えばその方式が無視されることがある。書いたから安心、ではない\n- 8億円の教訓は他人のもの。今日から議事録を残す習慣をつけろ\n\n証拠のない主張は存在しないのと同じ。","one_liner":"口約束はなかった扱いになる。でも行動の記録は黙って証拠になる。","parties":[{"role":"ユーザー側","icon":"👤","side":"plaintiff","desc":"ベンダ"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"ユーザ企業"}],"lessons":["契約書読んどけば…","証拠がないと詰む","口約束は約束じゃない"]},{"original_title":"東京地判平29.11.21（仕様の大幅な変更と仕事の完成）","url":"https://itlaw.hatenablog.com/entry/2019/07/02/213047","court":"東京地判","date":"平29.11.21","year":"平成29年","topic":"仕様の大幅な変更と仕事の完成","categories":["瑕疵・完成"],"fun_headline":"【700万円】仕様がどんどん変わってゲームが別物になったのに「完成」と認定された件","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n「仕様が変わり続けて結局ゲームは世に出なかった。でも裁判所は『完成した』と言った」\n\nどういうこと？ 完成してないのに完成なの？\n\nこの矛盾みたいな話、実は法律的にはちゃんと筋が通ってるんです。今日はそれを説明します。裁判所の「完成」という概念、思ってたより広かった。","summary":"・絡んでる金額: 700万円\n・テーマ: 仕様の大幅な変更と仕事の完成\n・完成したかどうかの争い","what_happened":"状況を整理します。\n\n発注側はゲーム開発会社。開発側はゲームの発注側。\n\n平成27年2月、700万円でゲーム開発の契約を結びました。α版、β版、マスタ版、リリース版と段階的に作っていく計画で、代金も四等分して払う仕組みでした。\n\nここで全然関係ない話なんですけど、ゲームって「α版」「β版」って呼び方するじゃないですか。ギリシャ文字で段階を表すやつ。あれって何となくかっこいいな、と思ってた時期が僕にもあって。で、なんで急にこの話をしたかというと、この判例でその「段階」が争点になってくるからです。話を戻します。\n\n2月27日、α版を送ったら「想像以上！」と大好評。スタートは順調でした。\n\nここからが本番です。覚悟してください。\n\nβ版フェーズに入ると、開発側は設計書にない機能の追加を求め始めました。さらに開発側の発注元Zが介入してきて、仕様が大幅に変わり始める。\n\n当初は「冒険ゲーム」だったのが、気づいたら「アクションゲーム」になってました。\n\nこれ、ラーメン屋に「塩ラーメン」を頼んだのに気づいたら「担々麺」を作らされてるような状況じゃないですか。しかも同じ値段で。\n\n4月に追加契約を締結。2.5人月分の報酬が加わりました。\n\nマスタ版フェーズでさらに機能追加。でもZがゲーム自体の製作を打ち切ったため、ゲームは完成しないまま終わりました。\n\n発注側は「払ってない代金を払え」と開発側を訴えました。開発側は75万円しか払ってなかった。全額700万円のうちの75万円。残り625万円の話です。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n「仕様が途中でごっそり変わって、当初と全然違うものを作った。それでも『契約通りに完成した』と言えるのか？」\n\nゲームは世に出ていない。でも発注側はちゃんと作業をした。β版には「かなり進めて頂いてて感服しております！」という高評価まである。\n\n開発側が「完成してない」と言うなら、なぜそんな褒め言葉を書いたの？ という話でもあります。\n\nで、裁判所の判断はこうでした。\n\n 以上の事情を総合的に考慮すると，プレイアブル版は，本件個別契約締結当初は想定されていなかったものであるが，既に判示したとおり，開発側とZは，このゲームの製作過程で，その内容や仕様を大幅に変える協議を行い，その中で，マスタ版やリリース版ではなく，プレイアブル版の製作を決定したこと，これに伴い，発注側と開発側は，新たな契約を締結することのないまま，β版に引き続いてプレイアブル版の製作に入っていること，プレイアブル版の提出期限が，本件個別契約のマスタ版及びリリース版の提出期限に概ね合わせる形で設定されていること，以上の事実が認められ，これらの事情に照らすと，発注側と開発側との間では，本件個別契約に基づいてマスタ版及びリリース版を製作する代わりに，プレイアブル版を製作することに合意していたものというべきであり，これに反する的確な証拠はない。\n\nそして，前記認定事実によれば，発注側は，プレイアブル版の実装要件として指示された項目を含む成果物を提出し，開発側も，これに対して，一定の修正を求めただけで，プレイアブル版の次の版である体験版の製作の話に移行し，（略）ことが認められるから，開発側においても，X提出にかかるプレイアブル版を完成したものとして認識していたものと優に認められる（略）。","ruling":"裁判所はこう言いました。\n\nマスタ版もリリース版も「完成した」と認定。追加契約の報酬も全額認容。つまり、発注側の主張がほぼ全面勝訴です。\n\n裁判所が重視したのは「開発側が次の段階の話を始めた」という事実。「プレイアブル版の次は体験版を作ろう」という話が出ていた時点で、開発側は暗黙的に「プレイアブル版は完成した」と認めてたでしょ、という論理です。\n\n裁判所、めっちゃ現実主義。褒め言葉と次のフェーズへの進行を、完成の証拠として使ってきた。好き。\n\n「かなり進めて頂いてて感服しております！」って言ってたのに「完成してない」は通じなかったということです。\n\nはい、裁判所はこう言いました。以上。","takeaway":"で、結局なにが大事なの？\n\n- 「完成」の定義を最初に決めておけ。「裁判所が判断する完成」は思ってるより広いことがある\n- 称賛メールは証拠になる。「素晴らしい！」「感服！」と書いたら、それは「完成した」の証拠として使われる可能性がある\n- 仕様変更は書面で合意しろ。新しい契約を結ばずに別物を作らされてる状態は、後で大変なことになる\n- 次フェーズへの着手は「前フェーズの完成承認」と見なされることがある\n\n口から出た「感服！」は、裁判所でも感服される。","one_liner":"褒め言葉はメールに残すな。それが証拠になる。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ゲーム開発会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"ゲーム発注会社"}],"lessons":["契約書読んどけば…","「完成」って何？","金の話は最初にしろ"]},{"original_title":"東京高判平29.9.27（担当者間の合意と契約の成否）","url":"https://itlaw.hatenablog.com/entry/2024/06/16/193910","court":"東京高判","date":"平29.9.27","year":"平成29年","topic":"担当者間の合意と契約の成否","categories":["契約・報酬"],"fun_headline":"【6800万円】担当者同士で「やります！」と合意したのに会社レベルで契約してないと言われた話","hook":"「担当者が『やる』と言ったのに、会社として契約してないから払わない」\n\nこれ、言われた側の気持ち、わかりますか。わかる。めっちゃわかる。つらい。\n\nしかも金額が6800万円です。6800万円です。僕が当事者だったら、三日は飯が食えない。今日はそんな話をします。","summary":"・絡んでる金額: 6800万円\n・テーマ: 担当者間の合意と契約の成否\n・契約とお金の話","what_happened":"状況を整理しましょう。\n\n発注側はシステム開発会社。開発側から「Q言語で書かれたプログラムをCOBOLに変換するツールを作ってほしい」と頼まれた（と主張している）。\n\nここで補足をさせてください。Q言語とCOBOL、どちらも僕にはたぶん一生わからない言語なんですけど、要するに「古いシステムを別の形式に作り直すツール」です。マイグレーションツールってやつです。企業の古いシステムを新しくするための道具。これを作ってほしいと頼まれたわけです。\n\n発注側はそのツールを開発して開発側に納入した。その後もQ言語の変換作業を続け、個別契約の代金として合計約1.4億円を開発側から受け取っていました。\n\nここで僕の話をさせてほしいんですけど、1.4億円もらってるのに6800万円でさらに揉めるって、全体の規模が大きすぎてちょっと感覚がバグります。億単位の取引の話を読んでると、たまに自分が何を読んでるかわからなくなる瞬間があって。でもこれ実際に裁判になった話なので、しっかり読みます。話を戻します。\n\n発注側は「6800万円分の業務委託契約が成立していた」と主張して開発側を訴えた。でも開発側は「そんな契約は成立してない」と反論。一審（東京地判平28.4.27）では、業務委託契約の成立は認められなかったものの、開発業務の部分だけ商法512条を使って約1700万円の報酬を認めた。\n\n【ちょっと解説】商法512条── 商人が営業のためにサービスをした場合、相当な報酬を請求できるという規定。「タダで働かせるのは違う」という考え方。\n\n発注側は「1700万円じゃ足りない、6800万円よこせ」と控訴。開発側も「1700万円も払いたくない」と付帯控訴。\n\nというのが控訴審の前提です。\n\n僕がこの当事者だったら、三日は寝込む。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n2つあります。\n\n（1）そもそも6800万円の業務委託契約は成立していたのか\n（2）成立してないとしても、相当報酬（商法512条）はいくらか\n\n担当者レベルでは「やります」「お願いします」というやり取りがあった。でも会社として正式な契約書を交わしたのかどうか。そこが争点です。\n\nこれって要するに「合コンで個別に『今度ご飯行きましょう』と言ったのは本当に付き合う約束なの？」みたいな話。担当者の言葉がどこまで会社を縛るのか、という問題です。","ruling":"裁判所はこう言いました。\n\n業務委託契約全体の成立については、一審と同様に認めませんでした。\n\n担当者間のやり取りはあった。でも6800万円という大きな契約を担当者レベルの合意だけで成立と認めるのは難しかった。\n\nただし、商法512条の相当報酬については議論があり、控訴審では一審の1700万円という判断を踏まえながら各業務の報酬を検討しました。\n\n裁判所、めっちゃ冷静。担当者が「やる」と言っても、会社としての正式な合意がなければ全額は認めない。でも「タダ働きも違う」として一定の報酬は認める。バランス感覚がある判断です。\n\nという結論。なるほどね。","takeaway":"で、結局なにが大事なの？\n\n- 担当者の発言は「会社の約束」にならないことがある。大きな金額の仕事は必ず書面で契約しろ\n- 「やります」「お願いします」はメールに残っても、契約書がなければ全額認めてもらえないことがある\n- 商法512条は保険になる。「タダにはならないけど、全額ももらえない」という中間地点\n- お金の話は最初に固めておけ。後からだと「そんな話してない」と言われたら詰む\n\nお金のことは最初に決めておけ。これが全てです。","one_liner":"お金のことは最初に決めておけ。担当者の言葉は会社の約束じゃない。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"ソフト開発会社"},{"role":"開発側","icon":"💻","side":"defendant","desc":"COBOL変換依頼"}],"lessons":["契約書読んどけば…","金の話は最初にしろ"]},{"original_title":"東京地判平29.8.8（グルメサイトからの店舗情報削除請求）","url":"https://itlaw.hatenablog.com/entry/2019/05/20/232809","court":"東京地判","date":"平29.8.8","year":"平成29年","topic":"グルメサイトからの店舗情報削除請求","categories":["その他"],"fun_headline":"「うちの店の情報をグルメサイトから消してくれ」→「嫌です」→裁判した結果がこれ","hook":"みなさん、「インターネットアーカイブ」って知ってますか。\n\nウェブサイトの過去の状態を丸ごと保存してくれるアメリカのNPOなんですよ。「wayback machine」とも呼ばれてる。昔のYahoo!とかAmazonの画面が見られたりする。なかなかロマンある。\n\n今日はそのインターネットアーカイブが絡んだ裁判の話をします。\n\nしかもグルメサイト。しかも「完全紹介制のレストラン」。なんかもうキャラが立ってる。読んでいきましょう。","summary":"・テーマ: グルメサイトからの店舗情報削除請求","what_happened":"で、何が起きたかというと。\n\n原告は完全紹介制のレストランを経営していました。完全紹介制というのは、知り合いの紹介がないと入れない、いわばVIPなお店です。一般の予約サイトとは相性が悪い業態ですね。\n\n被告は日本最大級のグルメコミュニティサイトを運営していました。（グルメサイト大手、みなさんご存知のやつです。多分。）\n\n原告は最初、被告のサービスを普通に使っていました。無料の店舗会員になって、自分でお店の情報を編集して公開してた。有料サービスも使っていた。\n\nあ、今思い出したんですけど、グルメサイトって飲食店側から見るとけっこう複雑な感情のある存在らしいんですよね。載せたいお店もあれば、載せてほしくないお店もある。掲載方針をめぐる問題は昔からある話で。この判例はその系譜にある話でもあります。\n\nで、原告はだんだん「完全紹介制だから、情報を公開しすぎるのはマズい」と思い始めた。電話番号を消したり、「完全紹介制」と強調するようにしたりして、最終的に被告に「うちの店のページを消してくれ」と要求したら、消えた。\n\nただし、インターネットアーカイブには過去のページが残ってた。\n\n原告は「そっちも消してくれ」と被告に要求しました。被告は「いや、それは無理です」と断った。で、裁判になりました。\n\nわかります？ この展開の怖さ、伝わってます？","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\n被告はインターネットアーカイブ上の過去の店舗情報を削除する義務があるのか、という話です。\n\n原告の言い分は「うちの店の情報をコントロールする権利がある。それを侵害している」。\n\n被告の言い分は「インターネットアーカイブはうちじゃなくてアメリカのNPOが管理してる。うちに削除義務はない」。\n\nさあ、裁判所はどう判断したでしょうか。","ruling":"裁判所はこう言いました。\n\nまず前提として、「被告のサイトに最初に店舗ページが作られたのは原告の承諾なし」という事実は認めました。勝手に作られたのは事実。\n\nでも、そのあとをこう言った。\n\n 原告はこのサイト上に本件店舗ページが作成された後，自ら，被告の無料の店舗会員となって，本件店舗に関する情報を編集・公開していたほか，被告が提供する店舗を宣伝するための有料サービスも利用し，このサイト上に名称等の情報が掲載された本件店舗ページが存在することを前提とした上で，これを原告の事業活動に利用していたものと認められる。このような事情に照らすと，原告は，このサイト上に，本件店舗の情報が掲載された本件店舗ページが存在することを甘受し，これを利用していたものといわざるを得ない。\n\nつまり「自分でも使ってたじゃないですか」ということです。有料サービスまで使っておいて、今さら「情報をコントロールする権利が侵害された」は通らない。\n\n裁判所、めっちゃ冷静。「甘受し、利用していた」という表現がすごい。好き。\n\nさらに続きます。\n\n（略）本件情報に掲載された本件店舗情報は，本件店舗の名称や住所の一部を始め，そのほとんどが，X自らが一般に公開し，もしくは，公開することを許可していた情報というべきである。\n\n「公開してたのはあなた自身でしょ」ということです。\n\n口コミについても「単なる感想の記述で、原告の権利を侵害するとは認められない」と判断されました。\n\n（略）本件情報に掲載された口コミは，主に本件店舗利用者の感想が述べられているにとどまり，X自身が公開していた以上の店舗情報を具体的に記載するものとも認められず，これらの投稿により，直ちに原告が主張する本件店舗に関する情報をコントロールする権利が侵害されるものとはいい難い上，そのほか，同口コミの内容自体によって，原告の何らかの権利が侵害されたことを認めるに足りる的確な証拠はない。\n\n最終的に原告の請求は全部棄却。\n\nいや、そうはならんやろ。なっとるやないか。\n\n被告には削除義務なし、が裁判所の結論です。","takeaway":"で、結局なにが大事なの？\n\n- 一度公開した情報は簡単には消えない。インターネットアーカイブに保存されてたりする\n- 自分でサービスを使っておいて「情報をコントロールする権利が侵害された」は通りにくい\n- グルメサイトに限らず、プラットフォームへの情報掲載は慎重に。削除を「お願い」することしかできない場面がある\n- 「知らなかった」「同意してない」は、実際にサービスを使ってた事実の前では弱い\n\n一度ネットに出した情報は、取り戻せないと思っておけ。","one_liner":"一度ネットに出した情報はもう自分のものじゃない。","parties":[{"role":"原告","icon":"💼","side":"plaintiff","desc":"完全紹介制レストラン"},{"role":"被告","icon":"⚖️","side":"defendant","desc":"グルメサイト運営"}],"lessons":["プラットフォームの罠"]},{"original_title":"東京地判平29.3.21（サイト開発遅延の責任の所在）","url":"https://itlaw.hatenablog.com/entry/2020/06/26/232602","court":"東京地判","date":"平29.3.21","year":"平成29年","topic":"サイト開発遅延の責任の所在","categories":["責任・損害"],"fun_headline":"「リリース1時間前もまだ開発中」→納期遅延の責任はベンダじゃなかった件","hook":"エンジニアの人、聞いてください。\n\nリリース当日の1時間前でも開発サーバで作業してた、っていう経験ありますか。\n\nある人は今日の話、めちゃくちゃ刺さると思います。ない人は「そんなことあるの？」と思いながら読んでください。\n\n今日の裁判、「誰のせいなの、これ」という話です。答えを先に言うと、ベンダ（作る側）は意外と守られました。それがなぜか、というのを一緒に読んでいきましょう。","summary":"・絡んでる金額: 231万円\n・テーマ: サイト開発遅延の責任の所在\n・責任の所在を巡る争い","what_happened":"状況を整理します。\n\nファーストフードチェーンKがキャンペーンをやろうとした。Kは被請求側に「キャンペーンの企画運営をお願いします」と委託。被請求側は請求側に「キャンペーンサイトを作ってください」と下請けに出した。報酬231万円、2.4人月分です。\n\n公開予定日は平成25年11月18日午前7時。\n\nでは、プロジェクトの経緯を時系列で見ていきます。これがヤバい。\n\n9月中旬： 被請求側が請求側にサイト開発を打診。まあ普通のスタート。\n\n10月2日： 「どのようなことがやりたいかを記載された資料のみが存在している状況」。なにも確定してない。\n\nいやいやいや。ちょっと待ってほしい。\n\n11月18日のリリースに向けて、10月2日時点で「なにも確定してない」。1ヶ月半しかない。しかもここから何かが確定していくわけでもなかった。\n\n10月4日の打ち合わせ： 「21日までに仕様確定、28日までに8割がたHTMLを請求側に提供する」予定だった。\n\n10月16日： 当初予定になかった「事前登録機能」と「ティザーサイト」が追加されることに。\n\nここ、エンジニアなら身に覚えがある人いるんじゃないですか。「ついでにこれも」「こっちも追加で」ってやつ。\n\n11月7日： 8割がた確定したHTMLはまだ請求側のもとに届いてない。請求側は「リリース延期しないといけない」と伝えた。\n\n11月12日： やっとHTMLを受領。請求側は24時間体制で開発を開始。\n\n11月17日： リリース前日に、クーポン情報の形式がやっと確定。\n\n11月18日リリース当日：1時間前でもまだ開発サーバで作業中。テストする時間がなかった。\n\n案の定、文字化けが発生してリリース失敗。4日後の11月22日に再リリースとなりました。\n\n請求側は「当初の予算では足りない、493万円に上げてくれ」と求め（本訴）、被請求側は「約2500万円の損害賠償を払え」と反訴。\n\nここまで読んで「関係者の気持ち、わかる。めっちゃわかる。つらい。」と思った人、正常です。","issue":"要するに何が問題だったの？\n\nここテストに出ます。\n\nリリース遅延の責任は誰にあるのか？ です。\n\n被請求側は「請求側がちゃんと作らなかったから遅れた。2500万円の損害を賠償しろ」と言っている。\n\n請求側は「仕様がどんどん変わって、HTMLが届くのも遅れた。遅延はうちのせいじゃない」と言っている。\n\n裁判所はどっちの言い分を採用したのか。\n\nその判断がこちら。\n\n 本件キャンペーンサイトが当初リリース日に公開することができず，それが再リリース日にずれ込んだことについては，①元々日程が過密であったこと，②それにもかかわらず，当初予定されていなかった事前登録機能の追加及びティザーサイトの公開が追加されたこと（ディレクターである被請求側は，G又はKなどに対し，このような機能を追加すれば当初リリース日に公開が間に合わなくなるおそれがることを忠告することも可能であった。），③Zがデザインの入ったHTMLファイルを請求側に対して交付するのが遅れたこと，④ディレクターである被請求側がこのプロジェクトの進行管理を十分に行わなかったこと，⑤請求側とZとの間，請求側とDとの間など，このプロジェクトについて役割分担をした者同士の間で十分な意思の疎通が図れておらず，このような意思の統一をすることはディレクターである被請求側の役割であったこと，⑥過密な日程がさらに押したものとなり，請求側は当初リリース日の公開予定時刻の１時間前にもなお修正作業を続け，公開前のテストを行う時間もなかったこと，⑦請求側はこのように時間に追われ，平成２５年１１月１３日以降，２４時間体制で開発作業を続けた結果，文字化けのような凡ミスが出ることとなった。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\nこのように考えると，文字化け，レアクーポンの出現割合の設定ミス及びレポート出力の不備など個別の不具合については請求側が債務不履行責任を負うということができるとしても，本件キャンペーンサイトを当初リリース日に公開することができず再リリース日になってようやく公開にこぎ着けたという本件委託契約に係る履行遅滞について，請求側の責めに帰することができない。","ruling":"裁判所はこう言いました。\n\n「納期の遅延は請求側のせいじゃない」。\n\n理由は判決文に①〜⑦まで丁寧に書いてあります。HTMLが遅かった、機能を途中で追加した、ディレクターの被請求側が進行管理を怠った、そういった複合的な要因を裁判所は全部列挙しました。\n\n裁判所、めっちゃ丁寧に仕事してる。7つも理由を並べてくれた。好き。\n\n文字化けなど個別のバグは請求側の責任。でも「リリースが4日遅れた」という大きな遅延については請求側に責任なし。\n\n被請求側の反訴（2500万円の損害賠償）は全面棄却。請求側の請求は当初契約額の範囲で認められました。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n- 仕様確定の遅れはきちんと記録しろ。「HTMLが届いたのは11月12日」という事実が判決を左右した\n- 機能追加は必ずスケジュールへの影響を明示的に伝えて書面に残せ。「ついでにこれも追加」は後で誰かが泥をかぶる\n- ディレクター・PM側が「進行管理義務」を負う。上流工程の人間が怠けると下請けのベンダが守られることがある\n- 24時間体制で働かされた上に訴えられそうになった請求側の話、これが「現場の記録を残す」理由です\n\n遅延の責任は、一番サボってた人に向かう。","one_liner":"仕様を固めるのもリリース日を守ることの一部だと、発注側は知っておけ。","parties":[{"role":"下請業者","icon":"🔧","side":"third","desc":""},{"role":"請求側","icon":"💼","side":"plaintiff","desc":"Web開発会社"},{"role":"被請求側","icon":"⚖️","side":"defendant","desc":"広告代理店"}],"lessons":["契約書読んどけば…","「完成」って何？","PM不在の悲劇"]},{"original_title":"東京地判平29.1.20（納期変更の合意、不具合、損害の範囲等）","url":"https://itlaw.hatenablog.com/entry/2023/04/12/222639","court":"東京地判","date":"平29.1.20","year":"平成29年","topic":"納期変更の合意、不具合、損害の範囲等","categories":["瑕疵・完成","責任・損害"],"fun_headline":"【悲報】1600万円払ったのにシステムが永遠に完成しなかった件、損害の範囲がえぐすぎた","hook":"「納期守ります」って言った人間が、何度延ばしても完成させられなかったとしたら、その人にいくら払ってもらえると思いますか。\n\n開発費？ サーバー代？ ライセンス費用？\n\n今日の裁判、この「いくら取れるか」がまあまあヤバい話になってるので、ちょっと付き合ってください。","summary":"・絡んでる金額: 1600万円\n・テーマ: 納期変更の合意、不具合、損害の範囲等\n・完成したかどうかの争い","what_happened":"ちょっと長くなるけど、大事な話なので付き合ってください。\n\n登場人物がわりと複雑なんですけど、今日の話に必要なとこだけ整理しますね。\n\n発注側は、開発側に対し、オンラインカジノゲームのシステム開発の見積を依頼しました。\n\n開発側は見積を提示し、まず請負金額1600万円で合意。\n\nその後、話し合いで1910万円に増額されました。\n\n【ちょっと解説】請負（うけおい）── 「完成品を納品します」という契約。レストランで「カレーください」と注文するようなもので、カレーが出てこなかったら契約違反。\n\nフェーズごとにリリースする予定で、フェーズ１のローンチは2011年12月20日とされました。\n\nここ、赤線引いてください。2011年12月20日。\n\nここで僕の話をさせてほしいんですけど、僕も昔バイト先の先輩に「来週には絶対やっとく」って言われて一ヶ月待たされたことがあって。\n\n先輩に言いたいことは今もたくさんあるんですが、話を戻しますね。\n\n開発側は「数度にわたって」納期を延ばしました。\n\n数度。数度ですよ。\n\n「もうちょっと待って」「いやもうちょっと」「来月には絶対」みたいなやつです。\n\nでも完成しなかった。\n\nで、ここからがヤバいんですけど、結局発注側は開発側の履行不能を理由に契約を解除して、5000万円の損害賠償を請求しました。\n\n【ちょっと解説】解除── 契約を「なかったこと」にすること。遡って最初からなかったことになるのが原則。お互い原状回復（もらったものを返す）義務が発生する。\n\n5000万円。さっきの契約額が1910万円だったのに。\n\n内訳は開発費の既払金800万円と、サーバ等の機器代約470万円などなど。\n\nなお発注側開発側間の契約書には「現実に被った通常かつ直接の損害に限り、個別契約に定める委託料を超えない損害賠償を請求することができる」という条項がありました。\n\nちなみに全然関係ないけど、こういう条項を読んでちゃんと「あ、上限があるな」って気づける人間、僕の周りにほぼいないです。\n\nみんな読んでない。僕も読んでない。","issue":"要するに何が問題だったの？\n\nざっくり言うと「損害賠償として何をいくら払わないといけないか」が争点です。\n\nここテストに出ます。\n\n（３）損害の範囲\n\n開発費用として支払われた800万円については、契約違反との因果関係ありとして認められました。\n\n【ちょっと解説】債務不履行── 「約束したのに守らなかった」こと。納期に遅れた、バグだらけで使えない、そもそも作らなかった、全部これ。\n\nサーバ等の代金約470万円については、\n\nこれは，本件請負契約とは別個の，サーバ等売買契約にもとづく代金の支払いであるが，これらのサーバ等は，このシステムを搭載してこのサイトをロンチさせるためのものであり，本件請負契約が債務不履行となってこのサイトがロンチしなければ当然に意味を持たなくなるものであるから，本件請負契約の債務不履行と相当因果関係のある損害であると認められる。\n\nこれ、すごくないですか。サーバーの代金は「別の契約」だったのに、システムが動かないなら意味ないよね、ということで損害に含まれた。\n\nつまり、本丸がコケたら周辺の費用も全部巻き込まれる、ということです。\n\nさらにライセンス取得のために払った弁護士費用約120万円について、\n\nフィリピンにおいて，ＣＥ第三者ＡおよびＦＣＬＲＣの付与するライセンスを取得するためのサポートに必要な費用で，このシステムの開発を被告会社に依頼することとなった直後である平成２３年８月１７日に支出されたものであり，開発側が本件請負契約を履行する前提としてこのサイトをロンチするために支出された費用であるといえるから，本件請負契約の債務不履行と相当因果関係のある損害であると認められる。\n\n一方で、コンサルティング費用は「実質的には人件費で請負契約と無関係」として否定。\n\n解除後の新しいシステム開発費用については「それを認めたら発注側は賠償を受けたうえでさらに開発側負担で新システムも作れてしまう、それはさすがにおかしい」として否定されました。\n\n裁判所、めっちゃ冷静。好き。\n\n結果として認められた損害は合計約1600万円でした。","ruling":"で、裁判所はどう判断したか。\n\n整理するとこうです。\n\n・開発費の既払金800万円→認める\n・サーバー代約470万円→システムと一体不可分だから認める\n・フィリピンのライセンス弁護士費用約120万円→ロンチ前提の費用だから認める\n・コンサルティング費用→人件費で無関係、認めない\n・解除後の新開発費用→二重取りになるから認めない\n\n合計約1600万円の損害賠償を認めました。\n\n以上が裁判所の判断です。","takeaway":"で、結局なにが大事なの？\n\n・納期を守れないなら最初から受けるな。「なんとかなる」は地獄への入口\n・サーバー代とかライセンス費用も「損害」になりうる。周辺コストをナメるな\n・契約書の損害賠償上限条項は必ず読め。読まないと5000万請求して1600万しか取れないことになる\n・「別の契約だから関係ない」は通じない。全体が一体として見られることがある\n\n最後に一言。納期って、守れる見込みがない時点で延ばすのをやめろ。","one_liner":"「サーバー代は別の契約です」は通じない。全部つながってると裁判所は思ってる。","parties":[{"role":"発注側","icon":"💼","side":"plaintiff","desc":"カジノゲーム発注"},{"role":"開発側","icon":"💻","side":"defendant","desc":"システム開発会社"}],"lessons":["「完成」って何？","金の話は最初にしろ","損害、証明できる？"]},{"original_title":"東京地判平29.1.13（契約の成否（否定）と契約締結上の過失（肯定））","url":"https://itlaw.hatenablog.com/entry/2022/08/10/212941","court":"東京地判","date":"平29.1.13","year":"平成29年","topic":"契約の成否（否定）と契約締結上の過失（肯定）","categories":["契約・報酬"],"fun_headline":"【怖い話】「やるやる」と言い続けた発注者が突然「やっぱやめます」と言った結果","hook":"ちょっと待ってこれ聞いたら驚くから。\n\n仕事を「やります」って方向で話が進んで、要件定義まで終わらせて、さあ開発だってなったとき。\n\n発注者から「やっぱやめます」って連絡が来たとしたら。\n\n契約書、ないです。\n\nさあ、どうする？","summary":"・絡んでる金額: 35万円\n・テーマ: 契約の成否（否定）と契約締結上の過失（肯定）\n・契約とお金の話","what_happened":"で、何が起きたかというと。\n\n開発側はエンドユーザＡからアプリの開発を受託しました。\n\nで、そのアプリの要件定義業務を発注側に外注しました。代金は税抜き35万円。\n\n発注側と開発側は、要件定義と並行して、今後の開発に関する取引基本契約も締結しました。\n\n流れとしては「まず要件定義してもらって、そのまま開発もお願いする」みたいな感じですね。\n\n発注側は要件定義を無事終えて、開発側に対し開発作業の見積を６パターン提示しました。\n\n６パターンも出したんですよ。頑張りましたよね。\n\nここで僕の話をさせてほしいんですけど、見積もりって６パターンも出すとたまに「いや全部要らなくなった」って言われるやつがあるじゃないですか。\n\n……あ、それまさにこれでした。話を戻します。\n\nその直後、開発側は発注側に対し「このアプリの作業を中止します」と伝えてきました。\n\nいやいやいや。ちょっと待ってほしい。\n\n【ちょっと解説】契約締結上の過失── 契約の交渉段階でのやらかし。「やるやる」と言って期待させておいて突然「やっぱやめた」みたいなケース。契約が成立していなくても損害を請求できる場合がある。\n\n発注側は開発側に対し、要件定義の報酬の請求に加えて、開発作業についても「請負契約が成立してたはず」として損害賠償を請求。\n\nさらに予備的に「契約締結上の過失」で出来高相当の損害も請求しました。\n\n請求の組み立て方が二段構えになってる。弁護士さん仕事してますね。","issue":"要するに何が問題だったの？\n\n「契約締結上の過失で請求できる損害の範囲」がここでのポイントです。\n\nここテストに出ます。\n\n発注側は自社従業員の作業単価（35000円／日）×日数で約262万円を請求しました。\n\nこれは「売値ベース」の計算、つまり利益込みの金額です。\n\n裁判所はここで「ちょっと待って」と言いました。\n\n発注側は，発注側の利益を含む日額３万５０００円の人工代金をもって発注側の損害を算定すべきであると主張するが，契約の締結に至らなかった場合における契約締結に対する信頼が害されたことに基づく損害には，逸失利益は含まれないと解するのが相当であるから，発注側の主張は採用することができない。同様に，この開発契約に係る逸失利益についても，損害と認めることはできない。\n\n裁判所、めっちゃ冷静。好き。\n\n【ちょっと解説】逸失利益── 「あの事故がなければ得られたはずの利益」のこと。システムが止まってる間の売上損失とか。今回はこれが認められなかった。\n\nつまり「契約が成立してたら得られたはずの利益」は取れない。\n\n取れるのは実際にかかったコスト（人件費・経費）だけ。\n\n売値262万円の請求に対し、裁判所が認めたのはコストベースの約176万円でした。","ruling":"で、裁判所はどう判断したか。\n\n・開発の請負契約は成立していない→発注側の主位的請求は棄却\n・でも契約締結上の過失は認める→開発側はガン無視してたわけではなく、期待を持たせたのは事実\n・ただし損害は「逸失利益なし」のコストベース→認定額は約176万円\n\nあと、契約未成立の場面で
